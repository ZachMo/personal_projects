<style>
  :root {
    --cream: #fcefd5; --paper: #fff8ea; --ink: #1d1a17; --ink2: #5e554b; --red: #a3403f; --teal: #3f8f8c;
    --mustard: #eebf45; --line: rgba(29,26,23,.2);
    --display: "Futura", "Century Gothic", "Gill Sans", "Trebuchet MS", sans-serif;
    --chunk: "Arial Black", "Impact", "Haettenschweiler", "Franklin Gothic Heavy", sans-serif;
    --text: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
    --script: "Snell Roundhand", "Brush Script MT", "Segoe Script", cursive;
  }
  * { box-sizing: border-box; min-width: 0; }
  html, body { margin: 0; }
  body {
    background: var(--cream) radial-gradient(rgba(29,26,23,.06) 1px, transparent 1.4px) 0 0 / 9px 9px;
    color: var(--ink); font: 15px/1.45 var(--text); -webkit-font-smoothing: antialiased;
  }
  button { font: inherit; color: inherit; cursor: pointer; }
  .gi { width: 1.15em; height: 1.15em; vertical-align: -0.22em; }
  .chunk { font: italic 900 1em/1 var(--chunk); text-transform: uppercase; letter-spacing: .01em; }
  .btn {
    background: var(--paper); border: 2px solid var(--ink); border-radius: 999px; padding: 6px 14px; color: var(--ink);
    font: 700 12px var(--display); box-shadow: 2px 2px 0 var(--ink); text-transform: uppercase; letter-spacing: .05em;
  }
  .btn:hover { transform: translate(-1px,-1px); box-shadow: 3px 3px 0 var(--ink); }
  .btn:active { transform: translate(1px,1px); box-shadow: 1px 1px 0 var(--ink); }
  .btn.red { background: var(--red); color: #fff; } .btn.teal { background: var(--teal); color: #fff; } .btn.gold { background: var(--mustard); }
  .btn.on { background: var(--ink); color: var(--cream); }
  .btn.sm { padding: 3px 9px; font-size: 11px; box-shadow: 1px 1px 0 var(--ink); }
  .btn:disabled { opacity: .4; cursor: default; transform: none; box-shadow: 2px 2px 0 var(--ink); }
  input, select { font: 14px var(--display); padding: 6px 9px; border: 2px solid var(--ink); border-radius: 8px; background: var(--paper); color: var(--ink); }

  /* the starburst the rulebook loves */
  .burstw { display: inline-block; filter: drop-shadow(4px 4px 0 var(--ink)); }
  .burst { display: inline-block; background: var(--red); color: var(--cream); clip-path: var(--burst); padding: 44px 60px; transform: rotate(-5deg); text-align: center; }
  .burst b { display: block; font: italic 900 38px/0.95 var(--chunk); text-transform: uppercase; }
  .burst i { display: block; font: 700 11px var(--display); letter-spacing: .26em; text-transform: uppercase; color: var(--mustard); margin-top: 8px; font-style: normal; }
  .burst.sm { padding: 26px 40px; } .burst.sm b { font-size: 24px; }

  /* home */
  .home { max-width: 580px; margin: 0 auto; padding: 22px 16px 60px; text-align: center; }
  /* The front page: a game box on a diner table. One box stays on screen the whole time. The lid lifts
     off and lies beside it, the view moves in over the open box, and the pieces sit in its wells. */
  .table { min-height: 100vh; padding: 10px 14px 40px; text-align: center; overflow: hidden;
    background: conic-gradient(#f6ddd2 25%, #fcefd5 0 50%, #f6ddd2 0 75%, #fcefd5 0) 0 0 / 72px 72px; }
  .boxscene { perspective: 1500px; display: flex; justify-content: center; padding: 1vh 0 12px; }
  .gamebox { position: relative; width: min(94vw, 620px, calc((100vh - 70px) * .8)); aspect-ratio: 4 / 5; transform-style: preserve-3d;
    transform: rotateX(26deg) rotateZ(-4deg) scale(.64); transition: transform .95s cubic-bezier(.5,0,.2,1); }
  .gamebox:not(.is-open):not(.closing):hover { transform: rotateX(22deg) rotateZ(-2deg) scale(.66) translateY(-10px); transition-duration: .3s; }
  .gamebox.is-open { transform: none; }
  .gamebox.away { transform: translate(-70vw, -30vh) rotate(-14deg) scale(.3); opacity: 0; transition: transform .42s ease-in, opacity .42s; }
  .gamebox.back { animation: boxback .55s cubic-bezier(.2,.8,.3,1); }
  @keyframes boxback { from { transform: translate(-70vw, -30vh) rotate(-14deg) scale(.3); opacity: 0; } }
  .gamebox .shadow { position: absolute; inset: 4% -3% -12% 3%; background: rgba(29,26,23,.3); filter: blur(18px); transform: translateZ(-50px); transition: opacity .9s; }
  .gamebox.is-open .shadow { opacity: .55; }
  .base { position: absolute; inset: 0; container-type: inline-size; background: #8a3534; border: 3px solid var(--ink); border-radius: 8px; padding: 3cqw; display: flex; flex-direction: column;
    box-shadow: inset 0 0 0 .7cqw #6e2a29, inset 0 0 7cqw rgba(0,0,0,.4); pointer-events: none; }
  .gamebox.is-open.settled .base { pointer-events: auto; }
  .base h1 { margin: 1.4cqw 0 2.8cqw 30%; text-align: left; color: var(--cream); font: italic 900 5.2cqw/1 var(--chunk); text-transform: uppercase; text-shadow: .4cqw .4cqw 0 var(--ink); }
  .base h1 small { display: block; font: 400 2.9cqw var(--text); text-transform: none; font-style: normal; color: #f3d6c6; text-shadow: none; margin-top: 1cqw; }
  .wells { flex: 1; min-height: 0; display: grid; grid-template-columns: 1fr 1fr; grid-auto-rows: 1fr; gap: 2.4cqw; }
  /* each well of the insert holds one thing you can pick up */
  .comp { position: relative; min-height: 0; background: #2a2420; border: 3px solid var(--ink); border-radius: 2.4cqw; padding: 1.6cqw; display: flex; flex-direction: column;
    box-shadow: inset 0 1.6cqw 3.4cqw rgba(0,0,0,.65); color: var(--cream); font: inherit; }
  .comp:hover { background: #3a302a; }
  .comp .slot { position: relative; flex: 1; min-height: 0; display: block; }
  .comp .thing { position: absolute; left: 50%; top: 50%; width: 150px; height: 160px; margin: -80px 0 0 -75px; display: block; transform: scale(var(--k, 1)); transition: transform .22s; }
  .comp:hover .thing { transform: translateY(-9%) rotate(-3deg) scale(calc(var(--k, 1) * 1.08)); }
  .comp:active .thing { transform: translateY(-16%) rotate(2deg) scale(calc(var(--k, 1) * 1.14)); }
  .comp .lab { display: block; background: var(--paper); color: var(--ink); border: 2px solid var(--ink); border-radius: 4px; padding: 1.1cqw 1.4cqw 1.3cqw; box-shadow: 2px 2px 0 var(--ink); transform: rotate(-1deg); }
  .comp .lab b { display: block; font: italic 900 max(3.1cqw, 12px)/1.1 var(--chunk); text-transform: uppercase; color: var(--red); }
  .comp .lab small { display: block; font-size: max(2.35cqw, 10px); line-height: 1.25; margin-top: .4cqw; }
  .savedrow { margin-top: 2.4cqw; display: flex; align-items: center; gap: 2cqw; background: #2a2420; border: 3px solid var(--ink); border-radius: 2.4cqw; padding: 1.4cqw 2cqw; color: var(--cream); font: inherit; text-align: left; box-shadow: inset 0 1cqw 2.4cqw rgba(0,0,0,.65); }
  .savedrow .lab { flex: 1; display: block; background: var(--paper); color: var(--ink); border: 2px solid var(--ink); border-radius: 4px; padding: 1cqw 1.4cqw; }
  .savedrow .lab b { font: italic 900 3cqw/1.1 var(--chunk); text-transform: uppercase; color: var(--red); margin-right: 1cqw; } .savedrow .lab small { font-size: 2.35cqw; }
  .ribbon { width: 5.5cqw; height: 7.5cqw; background: var(--mustard); border: 2px solid var(--ink); clip-path: polygon(0 0, 100% 0, 100% 100%, 50% 78%, 0 100%); flex: none; }
  .gamebox.opening .comp .thing { animation: rise .5s cubic-bezier(.3,1.5,.5,1) backwards; animation-delay: calc(var(--i) * 110ms + 620ms); }
  @keyframes rise { from { transform: translateY(26%) scale(calc(var(--k, 1) * .6)); opacity: 0; } }
  /* the lid */
  .lid { position: absolute; inset: 0; padding: 0; border: 0; background: none; display: block; transform-style: preserve-3d; transform-origin: 0 0; transform: translateZ(2px); color: inherit; }
  .lid > span { position: absolute; display: block; }
  .lid-top { inset: 0; container-type: inline-size; border: 3px solid var(--ink); border-radius: 6px; overflow: hidden; background: var(--paper); }
  .lid-top img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .lid-top > span { position: absolute; display: block; text-transform: uppercase; }
  .lt-title { left: 4.5%; top: 26.5%; filter: drop-shadow(.9cqw .9cqw 0 var(--ink)); }
  .lt-title .burst { padding: 8.4cqw 8cqw; } .lt-title .burst b { font-size: 7.6cqw; }
  .lt-b1 { left: 9%; top: 12.2%; width: 40%; text-align: center; transform: rotate(-10deg); color: var(--cream); font: italic 900 3.5cqw/1 var(--chunk); }
  .lt-b2 { left: 47.5%; top: 77.2%; width: 40%; text-align: center; transform: rotate(-24deg); color: var(--cream); font: italic 900 3.3cqw/1 var(--chunk); }
  .lt-seal { left: 76%; top: 81.6%; width: 15%; text-align: center; color: var(--ink); font: 800 2.2cqw/1.1 var(--display); transform: rotate(-8deg); }
  .lt-seal b { display: block; font: italic 900 5.4cqw/1 var(--chunk); }
  .lid-front { left: 0; right: 0; top: 100%; height: 62px; background: #8a3534; border: 3px solid var(--ink); border-top: 0; border-radius: 0 0 6px 6px; transform-origin: top; transform: rotateX(-90deg);
    color: var(--cream); font: italic 900 22px/60px var(--chunk); text-transform: uppercase; letter-spacing: .04em; }
  .lid-side { top: 0; bottom: 0; left: 100%; width: 62px; background: #6e2a29; border: 3px solid var(--ink); border-left: 0; transform-origin: left; transform: rotateY(90deg); }
  .gamebox.is-open.settled .lid { transform: translate(-7%, -6%) rotateZ(-13deg) scale(.27); transition: transform .2s; }
  .gamebox.is-open.settled .lid:hover { transform: translate(-7%, -7.5%) rotateZ(-9deg) scale(.29); }
  .gamebox.is-open .lid-top { box-shadow: 18px 22px 0 rgba(29,26,23,.4); }
  .gamebox.opening .lid { animation: lidoff 1.1s cubic-bezier(.45,.05,.3,1) forwards; }
  .gamebox.closing .lid { animation: lidoff 1.05s cubic-bezier(.45,.05,.3,1) reverse both; }
  .gamebox.opening, .gamebox.closing { pointer-events: none; }
  @keyframes lidoff {
    0% { transform: translateZ(2px); }
    9% { transform: translateZ(2px) rotateZ(-1.2deg); } 18% { transform: translateZ(2px) rotateZ(1.2deg); }
    55% { transform: translateZ(240px) rotateX(-9deg) rotateZ(-3deg); }
    100% { transform: translate(-7%, -6%) rotateZ(-13deg) scale(.27); }
  }
  @media (prefers-reduced-motion: reduce) { .gamebox, .gamebox *, .mat, .mat *, .intro *, .card, .modal > div { animation: none !important; transition: none !important; } }
  /* the things in the wells */
  .booklet { position: absolute; inset: 4px 18px 0 14px; background: var(--cream); border: 2.5px solid var(--ink); border-radius: 3px 8px 8px 3px; transform: rotate(-5deg); box-shadow: 3px 3px 0 #d8c7a4, 5px 5px 0 var(--ink); overflow: hidden; display: block; }
  .booklet::before { content: ""; position: absolute; left: 9px; top: 0; bottom: 0; border-left: 2px dashed var(--line); }
  .booklet img { position: absolute; left: 12%; bottom: -4%; width: 88%; mix-blend-mode: multiply; }
  .booklet .burstw { position: absolute; left: 14px; top: 2px; filter: drop-shadow(2px 2px 0 var(--ink)); } .booklet .burst { padding: 12px 17px; } .booklet .burst b { font-size: 17px; }
  .fan .mc { position: absolute; left: 30px; top: 12px; width: 92px; height: 128px; border: 2.5px solid var(--ink); border-radius: 7px; overflow: hidden; background: var(--paper); box-shadow: 2px 2px 0 var(--ink); transform-origin: 50% 120%; display: block; transition: transform .22s; }
  .fan .mc i { display: block; height: 22px; background: var(--ink); } .fan .mc img { width: 100%; aspect-ratio: 1; object-fit: cover; object-position: 50% 0; display: block; mix-blend-mode: multiply; }
  .fan .mc:nth-child(1) { transform: rotate(-20deg); } .fan .mc:nth-child(2) { transform: rotate(-3deg); } .fan .mc:nth-child(3) { transform: rotate(15deg); }
  .comp:hover .fan .mc:nth-child(1) { transform: rotate(-32deg); } .comp:hover .fan .mc:nth-child(3) { transform: rotate(27deg); }
  .bits svg.tile { position: absolute; width: 96px; height: 96px; border: 2.5px solid var(--ink); border-radius: 4px; box-shadow: 3px 3px 0 var(--ink); }
  .bits svg.tile:nth-child(1) { left: 2px; top: 2px; transform: rotate(-9deg); } .bits svg.tile:nth-child(2) { left: 48px; top: 20px; transform: rotate(7deg); }
  .bits .tok { position: absolute; width: 38px; height: 38px; filter: drop-shadow(2px 2px 0 var(--ink)); }
  .note { position: absolute; width: 74px; height: 36px; background: #9cc59a; border: 2px solid var(--ink); border-radius: 3px; font: 800 15px/32px var(--display); color: #24512a; box-shadow: 2px 2px 0 var(--ink); text-align: center; display: block; }
  .postcard { position: absolute; inset: 26px 2px 34px 6px; background: var(--paper); border: 2.5px solid var(--ink); border-radius: 3px; transform: rotate(-6deg); box-shadow: 4px 4px 0 var(--ink); display: block; }
  .postcard img { position: absolute; right: 6px; top: 6px; width: 34px; height: 34px; border: 2px dashed var(--ink); padding: 2px; }
  .postcard::before { content: ""; position: absolute; left: 10px; right: 52px; top: 16px; height: 44px; background: repeating-linear-gradient(var(--ink) 0 2px, transparent 2px 13px); opacity: .55; }
  .postcard::after { content: "wish you were here!"; position: absolute; left: 10px; bottom: 8px; font: 700 15px var(--script); color: var(--red); }
  svg.pawn { width: 34px; height: 46px; filter: drop-shadow(2px 2px 0 rgba(29,26,23,.5)); }

  /* setting up: a paper placemat with real things on it */
  .mat { max-width: 640px; margin: 8px auto 0; background: var(--paper); border: 3px solid var(--ink); border-radius: 18px; box-shadow: 8px 10px 0 rgba(29,26,23,.3); padding: 18px 20px 24px; text-align: left; position: relative;
    outline: 2px dashed var(--red); outline-offset: -11px; }
  .mat h2 { margin: 4px 0 2px; font: italic 900 28px/1 var(--chunk); text-transform: uppercase; color: var(--red); text-align: center; }
  .mat h3 { margin: 20px 0 8px; font: italic 900 14px/1 var(--chunk); text-transform: uppercase; color: var(--ink); }
  .mat > p { margin: 4px 0; text-align: center; }
  .nametag { background: var(--red); border: 3px solid var(--ink); border-radius: 12px; padding: 6px 10px 10px; max-width: 300px; margin: 14px auto 0; transform: rotate(-2deg); box-shadow: 3px 3px 0 var(--ink); text-align: center; }
  .nametag b { display: block; color: #fff; font: italic 900 20px/1 var(--chunk); letter-spacing: .06em; } .nametag small { display: block; color: #fff; font: 700 10px var(--display); letter-spacing: .2em; text-transform: uppercase; margin: 1px 0 6px; }
  .nametag input { width: 100%; border: 0; border-radius: 6px; background: #fff; font: 700 26px var(--script); text-align: center; padding: 4px 6px; color: var(--ink); }
  .seats { display: flex; gap: 6px; align-items: flex-end; flex-wrap: wrap; }
  .seats button { background: none; border: 0; padding: 4px 6px; border-radius: 10px; text-align: center; font: 700 11px var(--display); text-transform: uppercase; color: var(--ink2); }
  .seats button:hover { background: rgba(238,191,69,.35); }
  .seats .out svg { opacity: .22; filter: none; } .seats svg.pawn { width: 44px; height: 58px; display: block; margin: 0 auto 2px; }
  .picks { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
  .pick { display: flex; flex-direction: column; background: var(--paper); border: 2.5px solid var(--ink); border-radius: 10px; padding: 0; overflow: hidden; text-align: center; box-shadow: 2px 2px 0 var(--ink); opacity: .62; font: inherit; color: var(--ink); }
  .pick.on { opacity: 1; box-shadow: 0 0 0 4px var(--mustard), 4px 4px 0 4px var(--ink); transform: rotate(-1.2deg); }
  .pick i { display: block; background: var(--ink); color: var(--cream); font: italic 900 13px/1 var(--chunk); text-transform: uppercase; padding: 7px 4px; }
  .pick span.im { display: block; } .pick img { width: 100%; aspect-ratio: 5 / 3; object-fit: cover; object-position: 50% 8%; display: block; mix-blend-mode: multiply; }
  .pick small { display: block; padding: 6px 8px 8px; font-size: 13px; line-height: 1.25; }
  .bell { display: block; margin: 22px auto 0; background: var(--red); color: #fff; border: 3px solid var(--ink); border-radius: 14px; padding: 12px 30px; box-shadow: 4px 4px 0 var(--ink); font: italic 900 22px/1 var(--chunk); text-transform: uppercase; transform: rotate(-1.5deg); }
  .bell:hover { transform: rotate(-1.5deg) translate(-2px,-2px); box-shadow: 6px 6px 0 var(--ink); } .bell.teal { background: var(--teal); }
  .bell small { display: block; font: 700 10px var(--display); letter-spacing: .22em; margin-top: 4px; font-style: normal; color: var(--mustard); }
  .backb { position: absolute; left: 12px; top: 10px; z-index: 2; display: flex; align-items: center; gap: 8px; background: none; border: 0; padding: 0; font: 700 11px var(--display); text-transform: uppercase; letter-spacing: .05em; color: var(--ink); }
  .backb img { width: 44px; aspect-ratio: 4 / 5; object-fit: cover; border: 2px solid var(--ink); border-radius: 3px; box-shadow: 2px 2px 0 var(--ink); transform: rotate(-9deg); transition: transform .2s; }
  .backb:hover img { transform: rotate(-3deg) scale(1.12); }
  /* things arrive the way real ones would: the mat is laid down, the tag is stuck on, pawns drop, cards are dealt */
  .mat.deal { animation: matin .55s cubic-bezier(.2,.9,.3,1.05) backwards; }
  .mat.leave { animation: matout .3s ease-in forwards; }
  @keyframes matin { from { transform: translateY(80vh) rotate(7deg); } }
  @keyframes matout { to { transform: translateY(90vh) rotate(-6deg); opacity: 0; } }
  .deal .nametag { animation: slap .32s cubic-bezier(.3,1.6,.5,1) .5s backwards; }
  @keyframes slap { from { transform: scale(1.7) rotate(-16deg); opacity: 0; } }
  .deal .seats button { animation: drop .4s cubic-bezier(.3,1.7,.5,1) backwards; animation-delay: calc(var(--i) * 80ms + 700ms); }
  @keyframes drop { from { transform: translateY(-70px); opacity: 0; } }
  .deal .pick { animation: dealt .45s cubic-bezier(.2,.8,.3,1) backwards; animation-delay: calc(var(--i) * 140ms + 950ms); }
  @keyframes dealt { from { transform: translate(70vw, -50vh) rotate(50deg); opacity: 0; } }
  .deal .bell, .deal .ticket { animation: swing .5s cubic-bezier(.3,1.6,.5,1) 1.5s backwards; }
  @keyframes swing { from { transform: translateY(-40px) rotate(-24deg); opacity: 0; } }
  .deal h3, .deal > p { animation: fadein .4s .6s backwards; }
  @keyframes fadein { from { opacity: 0; } }
  /* in the game: the board folds out, chips are set down, cards are dealt, paper slides in */
  .board.unfold { perspective: 1600px; animation: boarddown .5s cubic-bezier(.2,.8,.3,1) backwards; animation-delay: calc(0ms - var(--t, 0ms)); }
  @keyframes boarddown { from { transform: translateY(-60vh) rotate(-8deg) scale(.7); opacity: 0; } }
  .board.unfold .half { display: block; clip-path: inset(0 50% 0 0); }
  .board.unfold .half.r { position: absolute; left: 6px; right: 6px; top: 6px; clip-path: inset(0 0 0 50%); transform-origin: 50% 50%; backface-visibility: hidden;
    animation: flap .75s cubic-bezier(.4,0,.2,1) backwards; animation-delay: calc(450ms - var(--t, 0ms)); }
  .board.unfold .half svg { display: block; width: 100%; height: auto; max-height: 80vh; }
  .board.unfold .spine { position: absolute; left: 50%; top: 6px; bottom: 34px; width: 0; border-left: 2px solid rgba(29,26,23,.25); animation: fadeout .4s 1.3s forwards; }
  @keyframes flap { from { transform: rotateY(-180deg); } }
  @keyframes fadeout { to { opacity: 0; } }
  .intro .chip { animation: drop .4s cubic-bezier(.3,1.7,.5,1) backwards; animation-delay: calc(var(--i) * 120ms + 1150ms - var(--t, 0ms)); }
  .intro .panel > * { animation: paperin .45s cubic-bezier(.2,.8,.3,1) backwards; animation-delay: calc(1450ms - var(--t, 0ms)); }
  .intro .steps, .intro .legend { animation: fadein .4s backwards; animation-delay: calc(1300ms - var(--t, 0ms)); }
  @keyframes paperin { from { transform: translateX(60px) rotate(2deg); opacity: 0; } }
  .card.dealt { animation: dealt .5s cubic-bezier(.2,.8,.3,1) backwards; animation-delay: calc(var(--i, 0) * 110ms); z-index: 2; }
  .card.flipped { animation: flip .6s ease-in-out backwards; }
  @keyframes flip { from { transform: rotateY(180deg) scale(1.15); } 50% { transform: rotateY(90deg) scale(1.15); } }
  .modal.in > div { animation: slipin .38s cubic-bezier(.2,.9,.3,1.1) backwards; }
  .modal.in { animation: fadein .25s backwards; }
  @keyframes slipin { from { transform: translateY(70vh) rotate(-4deg); } }

  throw:     { n: 'First to throw away food or drink', r: 'A freezer. Keep up to 10 items between rounds.' },
  pay20:     { n: 'First to pay $20 in salaries', r: 'Several trainers may train the same person.' },
  have20:    { n: 'First to have $20', r: 'You may look at the bank reserve cards.' },
  have100:   { n: 'First to have $100', r: 'Your CEO works as a CFO too: 50% more income.' },
  mBurger:   { n: 'First burger advertised', r: '$5 more for each burger you sell.' },
  mPizza:    { n: 'First pizza advertised', r: '$5 more for each pizza you sell.' },
  mDrink:    { n: 'First drink advertised', r: '$5 more for each drink you sell.' },

// Map tiles, 5 x 5, read row by row. # road, H house, B beer, L lemonade, S soft drink.
// A road leaves a tile only through the middle of a side, so any two tiles fit together.
const TILES = [
  ['HH#..HH#..#####..#....#..', 3], ['..#....#..#####..#....#..', 3],
  ['..#....#.B#####..#....#..', 1], ['..#....#.L#####..#....#..', 1], ['..#....#.S#####..#....#..', 1],
  ['.HH...HH..#####..#....#..', 2],
  ['..#....#..###....#.B..#..', 1], ['..#....#..###....#.L..#..', 1], ['..#....#..###....#.S..#..', 1],
  ['..#....#HH..#HH..#....#..', 2], ['..#....#..HH###HH........', 1],
  ['........S.###....#....#..', 1], ['........B.###....#....#..', 1],
  ['..........#####..........', 1],
];
const MAPSIZE = { 2: [3, 3], 3: [4, 3], 4: [4, 4], 5: [5, 4] };

function mkRng(G) {
  return function () {
    G.rs = (G.rs + 0x6D2B79F5) | 0; let t = G.rs;
    t = Math.imul(t ^ t >>> 15, t | 1); t ^= t + Math.imul(t ^ t >>> 7, t | 61);
    return ((t ^ t >>> 14) >>> 0) / 4294967296;

}
function shuffle(a, r) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function log(G, s) { G.log.push(s); if (G.log.length > 70) G.log.shift(); }
const N4 = [[1, 0], [-1, 0], [0, 1], [0, -1]];
function inB(G, x, y) { return x >= 0 && y >= 0 && x < G.W && y < G.H; }
function isRoad(G, x, y) { return inB(G, x, y) && G.road[y * G.W + x] === '1'; }
function tileKey(x, y) { return Math.floor(x / TS) + ',' + Math.floor(y / TS); }

function buildMap(G, r) {
  const [tw, th] = MAPSIZE[G.np]; G.W = tw * TS; G.H = th * TS;
  const rot = t => { const o = []; for (let y = 0; y < 5; y++) for (let x = 0; x < 5; x++) o[y * 5 + x] = t[(4 - x) * 5 + y]; return o; };
  for (let tries = 0; tries < 300; tries++) {
    const pool = []; TILES.forEach(([s, n]) => { for (let i = 0; i < n; i++) pool.push(s); }); shuffle(pool, r);
    const g = new Array(G.W * G.H).fill('.');
    for (let ty = 0; ty < th; ty++) for (let tx = 0; tx < tw; tx++) {
      let t = pool[ty * tw + tx].split('');
      for (let k = Math.floor(r() * 4); k > 0; k--) t = rot(t);
      for (let y = 0; y < 5; y++) for (let x = 0; x < 5; x++) g[(ty * 5 + y) * G.W + tx * 5 + x] = t[y * 5 + x];
    }
    G.road = g.map(c => c === '#' ? '1' : '0').join('');
    G.houses = []; G.drinks = [];
    const seen = {};
    for (let y = 0; y < G.H; y++) for (let x = 0; x < G.W; x++) {
      const c = g[y * G.W + x];
      if (c === 'H' && !seen[x + ',' + y]) {
        [[0, 0], [1, 0], [0, 1], [1, 1]].forEach(([dx, dy]) => { seen[(x + dx) + ',' + (y + dy)] = 1; });
        G.houses.push({ x, y, g: null, demand: [] });
      } else if (c === 'B' || c === 'L' || c === 'S') G.drinks.push({ x, y, t: { B: 'beer', L: 'lemon', S: 'soda' }[c] });
    }
    // One road network should hold nearly every road square and reach every house.
    const first = G.road.indexOf('1'), comp = new Set([first]), q = [first];
    while (q.length) {
      const i = q.pop(), x = i % G.W, y = (i - x) / G.W;
      N4.forEach(([dx, dy]) => { const j = (y + dy) * G.W + x + dx; if (isRoad(G, x + dx, y + dy) && !comp.has(j)) { comp.add(j); q.push(j); } });
    }
    const total = G.road.split('1').length - 1;
    const housesOk = G.houses.every(h => houseSq(h).some(([x, y]) => N4.some(([dx, dy]) => isRoad(G, x + dx, y + dy) && comp.has((y + dy) * G.W + x + dx))));
    const kinds = new Set(G.drinks.map(d => d.t)).size;
    if (comp.size >= total * 0.85 && housesOk && G.houses.length >= Math.max(3, G.np) && kinds >= 2) break;
  }
  shuffle(G.houses, r).forEach((h, i) => { h.id = i; h.num = i + 1; });
}

// mode: 'full', or the rulebook's introductory game: 'intro' (no milestones) and 'introms' (with them).
// Both introductory games have $75 a player, no reserve cards and no salaries, and end when the bank first breaks.
function newGame(seats, seed, mode, easy) {
  const np = seats.length; mode = mode || 'full';
  const G = { v: 1, mode, easy: !!easy, rs: seed | 0, np, round: 0, phase: 'place', bank: (mode === 'full' ? 50 : 75) * np, breaks: 0, ceoSlots: 3, nextCeo: 3, nid: 1,
    players: seats.map(s => ({ name: s.name, bot: !!s.bot, cash: 0, cards: [], work: [], pick: null, rests: [],
      stock: { burger: 0, pizza: 0, beer: 0, lemon: 0, soda: 0 }, ms: [], reserve: 0, u: null, disc: 0, firePick: null })),
    houses: [], drinks: [], camps: [], ms: {}, supply: {}, order: [], turn: 0, pi: 0, done: [], log: [], last: null,
    choosers: [], ci: 0, newOrder: [] };
  const r = mkRng(G);
  buildMap(G, r);
  const uniq = np <= 3 ? 1 : np - 2;
  for (const t in EMP) G.supply[t] = EMP[t].uniq ? uniq : t === 'mt' ? 18 : t === 'jvp' || EMP[t].entry ? 12 : 6;
  for (const m in MS) G.ms[m] = { own: [], closed: mode === 'intro' };
  G.order = shuffle(seats.map((_, i) => i), r);
  G.pi = np - 1;
  log(G, 'A new town. Each baron opens a first restaurant, last in line first.');
  return G;
}

// ---- the map ---------------------------------------------------------------
function houseSq(h) { const s = [[h.x, h.y], [h.x + 1, h.y], [h.x, h.y + 1], [h.x + 1, h.y + 1]]; return h.g ? s.concat(h.g) : s; }
function restSq(r) { return [[r.x, r.y], [r.x + 1, r.y], [r.x, r.y + 1], [r.x + 1, r.y + 1]]; }
// What stands on each square: 'r' road, or an object for anything built there.
function occ(G) {
  const o = new Array(G.W * G.H).fill(null);
  for (let i = 0; i < o.length; i++) if (G.road[i] === '1') o[i] = 'r';
  G.houses.forEach(h => houseSq(h).forEach(([x, y]) => { o[y * G.W + x] = h; }));
  G.drinks.forEach(d => { o[d.y * G.W + d.x] = d; });
  G.players.forEach(P => P.rests.forEach(r => restSq(r).forEach(([x, y]) => { o[y * G.W + x] = r; })));
  G.camps.forEach(c => { if (c.kind !== 'air') o[c.y * G.W + c.x] = c; });
  return o;
}
// Steps by road from a set of road squares. A step is one tile border crossed.
function roadDist(G, starts) {
  const d = new Array(G.W * G.H).fill(Infinity), dq = [];
  starts.forEach(([x, y]) => { d[y * G.W + x] = 0; dq.push([x, y]); });
  while (dq.length) {
    const [x, y] = dq.shift(), c = d[y * G.W + x];
    for (const [dx, dy] of N4) {
      const nx = x + dx, ny = y + dy; if (!isRoad(G, nx, ny)) continue;
      const w = tileKey(x, y) === tileKey(nx, ny) ? 0 : 1, j = ny * G.W + nx;
      if (c + w < d[j]) { d[j] = c + w; if (w) dq.push([nx, ny]); else dq.unshift([nx, ny]); }
    }
  }
  return d;
}
// The road squares a restaurant opens onto. With a drive-in, every corner is an entrance.
function restStarts(G, r, all) {
  const out = [];
  (all ? restSq(r) : [[r.ex, r.ey]]).forEach(([a, b]) => N4.forEach(([dx, dy]) => { if (isRoad(G, a + dx, b + dy)) out.push([a + dx, b + dy]); }));
  return out;
}
function distFor(G, p, openOnly) {
  const P = G.players[p], drive = cnt(P, 'lm') + cnt(P, 'rm') > 0; // a working local or regional manager gives a drive-in
  let s = []; P.rests.forEach(r => { if (r.open || !openOnly) s = s.concat(restStarts(G, r, drive)); });
  return roadDist(G, s);
}
function nearRoad(G, d, squares) {
  let m = Infinity;
  squares.forEach(([x, y]) => N4.forEach(([dx, dy]) => { if (isRoad(G, x + dx, y + dy)) m = Math.min(m, d[(y + dy) * G.W + x + dx]); }));
  return m;
}
function houseDist(G, h, d) { return nearRoad(G, d, houseSq(h)); }

// Where a restaurant may go. Returns { "x,y": [entranceX, entranceY] } by top-left square.
function legalRests(G, p, kind) {
  const o = occ(G), out = {}, d = kind === 'lm' ? distFor(G, p, false) : null;
  const taken = {}; if (kind === 'init') G.players.forEach(P => P.rests.forEach(r => { taken[tileKey(r.ex, r.ey)] = 1; }));
  for (let y = 0; y < G.H - 1; y++) for (let x = 0; x < G.W - 1; x++) {
    const sq = [[x, y], [x + 1, y], [x, y + 1], [x + 1, y + 1]];
    if (sq.some(([a, b]) => o[b * G.W + a])) continue;
    const e = sq.find(([a, b]) => N4.some(([dx, dy]) => isRoad(G, a + dx, b + dy)) &&
      (kind !== 'init' || !taken[tileKey(a, b)]) && (kind !== 'lm' || nearRoad(G, d, [[a, b]]) <= 3));
    if (e) out[x + ',' + y] = e;
  }
  return out;
}
function legalHouses(G) {
  const o = occ(G), out = {};
  for (let y = 0; y < G.H - 1; y++) for (let x = 0; x < G.W - 1; x++) {
    const sq = [[x, y], [x + 1, y], [x, y + 1], [x + 1, y + 1]];
    if (sq.some(([a, b]) => o[b * G.W + a])) continue;
    if (sq.some(([a, b]) => N4.some(([dx, dy]) => isRoad(G, a + dx, b + dy)))) out[x + ',' + y] = 1;
  }
  return out;
}
// A garden is 2 x 1 along one full side of a house. Returns [{h, o, sq}].
function legalGardens(G) {
  const o = occ(G), out = [];
  G.houses.forEach(h => {
    if (h.g) return;
    [[[h.x, h.y - 1], [h.x + 1, h.y - 1]], [[h.x, h.y + 2], [h.x + 1, h.y + 2]],
     [[h.x - 1, h.y], [h.x - 1, h.y + 1]], [[h.x + 2, h.y], [h.x + 2, h.y + 1]]].forEach((sq, i) => {
      if (sq.every(([x, y]) => inB(G, x, y) && !o[y * G.W + x])) out.push({ h: h.id, o: i, sq });
    });
  });
  return out;
}
function legalCampSpots(G, p, kind, range) {
  const o = occ(G), out = {}, d = distFor(G, p, false);
  for (let y = 0; y < G.H; y++) for (let x = 0; x < G.W; x++) {
    if (o[y * G.W + x] || !N4.some(([dx, dy]) => isRoad(G, x + dx, y + dy))) continue;
    if (range >= 99 || nearRoad(G, d, [[x, y]]) <= range) out[x + ',' + y] = 1;
  }
  return out;
}
function freeNums(G, kind) { return CAMPNUM[kind].filter(n => !G.camps.some(c => c.num === n) && (NOBILL[G.np] || []).indexOf(n) < 0); }
// The houses a campaign talks to.
function campReach(G, c) {
  if (c.kind === 'bill') return G.houses.filter(h => houseSq(h).some(([x, y]) => Math.abs(x - c.x) + Math.abs(y - c.y) === 1));
  if (c.kind === 'radio') {
    const tx = Math.floor(c.x / TS), ty = Math.floor(c.y / TS);
    return G.houses.filter(h => houseSq(h).some(([x, y]) => Math.abs(Math.floor(x / TS) - tx) <= 1 && Math.abs(Math.floor(y / TS) - ty) <= 1));
  }
  if (c.kind === 'air') return G.houses.filter(h => houseSq(h).some(([x, y]) => { const v = c.axis === 'row' ? y : x; return v >= c.start && v < c.start + c.size; }));
  // A mailbox reaches every house in its block: all it can get to without crossing a road.
  const seen = new Set([c.y * G.W + c.x]), q = [[c.x, c.y]];
  while (q.length) {
    const [x, y] = q.pop();
    N4.forEach(([dx, dy]) => { const nx = x + dx, ny = y + dy, j = ny * G.W + nx; if (inB(G, nx, ny) && !isRoad(G, nx, ny) && !seen.has(j)) { seen.add(j); q.push([nx, ny]); } });
  }
  return G.houses.filter(h => houseSq(h).some(([x, y]) => seen.has(y * G.W + x)));
}

// ---- companies -------------------------------------------------------------
function has(P, m) { return P.ms.indexOf(m) >= 0; }
function cardOf(P, id) { return P.cards.find(c => c.id === id); }
function workCards(P) { return P.work.map(id => cardOf(P, id)).filter(Boolean); }
function cnt(P, t) { return workCards(P).filter(c => c.t === t).length; }
function give(G, p, t) {
  if (!(G.supply[t] > 0)) return null;
  G.supply[t]--; const c = { id: G.nid++, t, busy: 0 }; G.players[p].cards.push(c); return c;
}
function award(G, p, m) {
  const s = G.ms[m], P = G.players[p];
  if (s.closed || s.own.indexOf(p) >= 0) return false;
  s.own.push(p); P.ms.push(m);
  log(G, '★ ' + P.name + ': ' + MS[m].n + '. ' + MS[m].r);
  if (m === 'hire3') { give(G, p, 'mt'); give(G, p, 'mt'); }
  if (m === 'burgerMade') give(G, p, 'bc');
  if (m === 'pizzaMade') give(G, p, 'pc');
  return true;
}
// Managers report to the CEO. Everyone else fills the slots that are left.
function capacity(G, types) {
  let m = 0, s = 0, n = 0;
  types.forEach(t => { if (EMP[t].slots) { m++; s += EMP[t].slots; } else n++; });
  const cap = G.ceoSlots - m + s;
  return { ok: m <= G.ceoSlots && n <= cap, open: cap - n, m, n, cap };
}
function priceOf(G, p) {
  const P = G.players[p];
  return 10 - cnt(P, 'pm') - 3 * cnt(P, 'dm') + (cnt(P, 'lux') ? 10 : 0) - (has(P, 'lower') ? 1 : 0);
}
function recruitsOf(P) { return 1 + cnt(P, 'rg') + 2 * cnt(P, 'rmgr') + 4 * cnt(P, 'hr'); }
function trainsOf(P) { return cnt(P, 'tr') + 2 * cnt(P, 'co') + 3 * cnt(P, 'gu'); }
function trainCapPerCard(P) { return has(P, 'pay20') ? 99 : cnt(P, 'gu') ? 3 : cnt(P, 'co') ? 2 : 1; }
function salary(G, p, fired) {
  if (G.mode !== 'full') return 0;
  const P = G.players[p]; let n = 0;
  P.cards.forEach(c => { if (fired && fired.indexOf(c.id) >= 0) return; if (EMP[c.t].sal && !(MARKETER[c.t] && has(P, 'billboard'))) n++; });
  return Math.max(0, n * 5 - (has(P, 'train') ? 15 : 0) - P.disc);
}
function checkCash(G, p) { if (G.players[p].cash >= 20) award(G, p, 'have20'); }
function pay(G, p, amt) {
  if (amt <= 0) return;
  let need = amt;
  while (need > 0 && G.breaks < 2) {
    if (G.bank >= need) { G.bank -= need; need = 0; break; }
    need -= G.bank; G.bank = 0;
    if (G.breaks === 0 && G.mode === 'full') {
      G.breaks = 1;
      const tally = {}; let sum = 0;
      G.players.forEach(P => { sum += P.reserve; tally[P.reserve] = (tally[P.reserve] || 0) + 1; });
      let best = 0; [100, 200, 300].forEach(v => { if ((tally[v] || 0) >= (tally[best] || 0) && tally[v]) best = v; });
      G.bank = sum; G.nextCeo = best / 100 + 1;
      log(G, 'The bank breaks. The reserve adds $' + sum + '. CEOs hold ' + G.nextCeo + ' slots from next round.');
    } else { G.breaks = 2; log(G, G.mode === 'full' ? 'The bank breaks again. This is the last dinner.' : 'The bank is empty. This is the last dinner.'); }
  }
  G.players[p].cash += amt; checkCash(G, p);
}

// ---- the round -------------------------------------------------------------
function newRound(G) {
  G.round++; G.ceoSlots = G.nextCeo; G.phase = 'restructure'; G.done = [];
  G.players.forEach((P, p) => { P.pick = null; if (!P.cards.some(c => !c.busy)) { P.pick = []; G.done[p] = 1; } });
  log(G, '— Round ' + G.round + ' —');
  if (G.players.every((P, p) => G.done[p])) reveal(G);
}
function reveal(G) {
  G.players.forEach(P => { P.work = P.pick || []; P.pick = null; });
  G.order.forEach(p => {
    const P = G.players[p];
    if (cnt(P, 'eb')) award(G, p, 'errand');
    if (cnt(P, 'cart')) award(G, p, 'cart');
    if (cnt(P, 'wa')) award(G, p, 'waitress');
    if (cnt(P, 'pm') || cnt(P, 'dm')) award(G, p, 'lower');
  });
  const open = G.players.map((P, p) => capacity(G, workCards(P).map(c => c.t)).open + (has(P, 'airplane') ? 2 : 0));
  G.choosers = G.order.slice().sort((a, b) => open[b] - open[a] || G.order.indexOf(a) - G.order.indexOf(b));
  G.ci = 0; G.newOrder = new Array(G.np).fill(-1); G.phase = 'order';
}
function startTurn(G) {
  const p = G.order[G.turn], P = G.players[p];
  P.u = { rec: 0, tr: 0, tc: {}, done: {} };
  const made = { burger: 3 * cnt(P, 'bc') + 8 * cnt(P, 'bch'), pizza: 3 * cnt(P, 'pc') + 8 * cnt(P, 'pch') };
  if (made.burger) { P.stock.burger += made.burger; award(G, p, 'burgerMade'); }
  if (made.pizza) { P.stock.pizza += made.pizza; award(G, p, 'pizzaMade'); }
  const got = collectDrinks(G, p);
  DRINKS.forEach(d => { P.stock[d] += got[d]; });
  const parts = GOODS.filter(g => (made[g] || got[g])).map(g => (made[g] || got[g]) + ' ' + GOODNAME[g]);
  if (parts.length) log(G, P.name + ' stocks ' + parts.join(', ') + '.');
}
// Each driver starts at one of your restaurants. A cart or truck takes drinks from every source that sits
// beside a road in range. A zeppelin takes them from every source on a tile in range, roads or not.
function collectDrinks(G, p) {
  const P = G.players[p], got = { beer: 0, lemon: 0, soda: 0 }, drive = cnt(P, 'lm') + cnt(P, 'rm') > 0;
  const run = (n, range, amt, air) => {
    for (; n > 0; n--) {
      let best = null;
      P.rests.forEach(r => {
        const d = air ? null : roadDist(G, restStarts(G, r, drive));
        const src = G.drinks.filter(s => air
          ? Math.abs(Math.floor(s.x / TS) - Math.floor(r.ex / TS)) + Math.abs(Math.floor(s.y / TS) - Math.floor(r.ey / TS)) <= range
          : nearRoad(G, d, [[s.x, s.y]]) <= range);
        if (!best || src.length > best.length) best = src;
      });
      (best || []).forEach(s => { got[s.t] += amt; });
    }
  };
  const xr = has(P, 'cart') ? 1 : 0, xa = has(P, 'errand') ? 1 : 0;
  run(cnt(P, 'cart'), 2 + xr, 2 + xa, false);
  run(cnt(P, 'truck'), 3 + xr, 3 + xa, false);
  run(cnt(P, 'zep'), 4 + xr, 2 + xa, true);
  return got;
}
function endTurn(G) {
  const P = G.players[G.order[G.turn]];
  P.disc = 5 * Math.min(recruitsOf(P) - P.u.rec, 2 * cnt(P, 'rmgr') + 4 * cnt(P, 'hr'));
  G.turn++;
  if (G.turn < G.np) { startTurn(G); return; }
  dinner(G);
  if (G.breaks >= 2) { G.phase = 'over'; log(G, 'The game is over.'); return; }
  G.phase = 'payday'; G.done = [];
  G.players.forEach((P2, p) => { P2.firePick = null; if (G.mode !== 'full' || !P2.cards.some(c => EMP[c.t].sal)) { P2.firePick = []; G.done[p] = 1; } });
  if (G.players.every((P2, p) => G.done[p])) payday(G);
}
function dinner(G) {
  const dist = G.players.map((P, p) => distFor(G, p, true));
  const price = G.players.map((P, p) => priceOf(G, p)), wait = G.players.map(P => cnt(P, 'wa'));
  const earned = G.players.map(() => 0);
  const L = G.last = { round: G.round, sales: [], tips: [], bonus: [] };
  G.houses.slice().sort((a, b) => a.num - b.num).forEach(h => {
    if (!h.demand.length) return;
    const need = {}; h.demand.forEach(g => { need[g] = (need[g] || 0) + 1; });
    let best = -1, bs = 0, bd = 0;
    G.order.forEach(p => {
      const d = houseDist(G, h, dist[p]);
      if (d === Infinity || Object.keys(need).some(g => G.players[p].stock[g] < need[g])) return;
      const s = price[p] + d;
      if (best < 0 || s < bs || (s === bs && wait[p] > wait[best])) { best = p; bs = s; bd = d; }
    });
    if (best < 0) { L.sales.push({ num: h.num, p: -1, items: h.demand.slice() }); return; }
    const P = G.players[best]; let amt = 0;

    '<li><b>People at work cannot train.</b> To train someone, leave that person on the beach for the round.</li>' +
    '<li><b>A marketer goes away.</b> While the campaign runs, the marketer is busy. A busy marketer takes no slot.</li>' +
    '<li><b>Distance counts tile borders.</b> The map is made of big square tiles. A house on your tile is 0 away. Each border the road crosses adds 1.</li>' +
    '<li><b>Trained people cost $5 a round</b> in the full game, at work or not. Do not train more people than your dinner income can pay.</li></ul>' +
    '<h4>The Coach</h4><p>While tips are on, the Coach explains each step and suggests a safe move. Press the gold button to take it, or do something else. It also lists facts about the town, so that you can judge for yourself. When the steps feel easy, read the Strategy page: that is where the game starts. Turn tips on or off with the <b>Tips</b> button at the top right.</p>' +
    '<h4>Reading the map</h4><ul>' +
    '<li>A cream square with a red number is a <b>house</b>. Low numbers eat first. Tokens on it are what it wants.</li>' +
    '<li>A colored square with a letter is a <b>restaurant</b>. The white dot is its door.</li>' +
    '<li>A round white badge with a bottle or glass is a <b>drink source</b>.</li>' +
    '<li>A small square with a colored edge is a <b>campaign</b>. B is a billboard, M a mailbox and R a radio. The number is the rounds left. ∞ means it never ends.</li></ul>',
  rules: () => '<h4>Goal</h4><p>Have the most money when the bank runs out. All money you earn comes from the bank.</p>' +
    '<h4>Your company</h4><ul>' +
    '<li>Your people are cards. Each round you choose who is <b>at work</b>. Everyone else is <b>on the beach</b>.</li>' +
    '<li>Your <b>CEO</b> always works and has 3 slots. Each person at work fills one slot.</li>' +
    '<li>A <b>manager</b> (black card) fills one CEO slot and brings slots of his own. Managers report only to the CEO.</li>' +
    '<li>You can only <b>hire</b> entry-level people, marked ▶. You get better people by <b>training</b>.</li>' +
    '<li>A card marked <b>1×</b> is a top job. Each baron may own only one.</li></ul>' +
    '<h4>A round has seven steps</h4>' +
    '<div class="step"><b>1</b><div><p><b>Restructuring.</b> All barons choose in secret who works. Then everyone shows.</p></div></div>' +
    '<div class="step"><b>2</b><div><p><b>Order of business.</b> The baron with the most empty slots picks a place in line first. Ties go to the baron who was earlier last round.</p></div></div>' +
    '<div class="step"><b>3</b><div><p><b>Working 9 to 5.</b> In line order, each baron uses the people at work:</p><ul>' +
      '<li><b>Hire.</b> The CEO hires 1 person. Recruiters hire more. New people go to the beach.</li>' +
      '<li><b>Train.</b> Each training moves one beach person one step up. New hires can train at once.</li>' +
      '<li><b>Advertise.</b> Each marketer may start one campaign. Choose the kind, the place, the product and how long.</li>' +
      '<li><b>Stock up.</b> Kitchen staff make food. Buyers fetch drinks.</li>' +
      '<li><b>Build.</b> A New Business Developer builds a house or a garden. A Local or Regional Manager opens a restaurant.</li></ul></div></div>' +
    '<div class="step"><b>4</b><div><p><b>Dinnertime.</b> Houses eat in number order, lowest first. See below.</p></div></div>' +
    '<div class="step"><b>5</b><div><p><b>Payday.</b> You may let people go. Then pay $5 for each card marked $5, at work or on the beach. The money goes back to the bank.</p></div></div>' +
    '<div class="step"><b>6</b><div><p><b>Marketing.</b> Every campaign adds 1 demand token to each house it reaches. A house holds 3 tokens, or 5 with a garden. Then each campaign loses a round. At zero it ends and the marketer comes home.</p></div></div>' +
    '<div class="step"><b>7</b><div><p><b>Clean up.</b> Unsold food and drink are thrown away. New restaurants open. Demand tokens and campaigns stay.</p></div></div>' +
    '<h4>Dinnertime in detail</h4><ol>' +
    '<li>A house with no tokens stays home.</li>' +
    '<li>A chain can serve a house only if a road joins them and the chain has <b>every</b> item the house wants.</li>' +
    '<li>If several chains can, the house adds each chain\'s <b>price</b> and <b>distance</b> and goes to the lowest total.</li>' +
    '<li>A tie goes to the chain with more waitresses at work. A second tie goes to the baron earlier in line.</li>' +
    '<li>The winner sells every item at its price. A house with a garden pays double.</li></ol>' +
    '<p><b>Price</b> is $10. Each Pricing Manager at work takes off $1, each Discount Manager $3, and a Luxuries Manager adds $10.</p>' +
    '<p><b>Distance</b> is the number of tile borders crossed by road from the house to your nearest open restaurant door.</p>' +
    '<p class="eg"><b>Example.</b> A house wants a burger and a beer. Red is 1 tile away and charges $10: total 11. Blue is on the same tile but has a Luxuries Manager and charges $20: total 20. Red has both items, so the house goes to Red and pays $20. If Red had no beer, the house would go to Blue and pay $40.</p>' +
    '<p>After the houses, each Waitress at work earns $3. Then a CFO adds 50% to all you earned this round.</p>' +
    '<h4>The four campaigns</h4><table>' +
    '<tr><th>Kind</th><th>Who can place it</th><th>Which houses it reaches</th></tr>' +
    '<tr><td><b>Billboard</b></td><td>Any marketer</td><td>Houses that touch it, side to side.</td></tr>' +
    '<tr><td><b>Mailbox</b></td><td>Campaign Manager and up</td><td>Every house in its block: all it can reach without crossing a road.</td></tr>' +
    '<tr><td><b>Airplane</b></td><td>Brand Manager and up</td><td>Every house in the 1, 3 or 5 rows or columns it flies over.</td></tr>' +
    '<tr><td><b>Radio</b></td><td>Brand Director</td><td>Every house on its tile and on the 8 tiles around it.</td></tr></table>' +
    '<p>A billboard, mailbox or radio goes on an empty square beside a road. A Marketing Trainee must stay within 2 tiles of one of your restaurants by road, and a Campaign Manager within 3. Campaigns run in number order: radios, airplanes, mailboxes, then billboards.</p>' +
    '<h4>Drinks</h4><p>An Errand Boy fetches 1 drink of any kind. A Cart Operator, Truck Driver or Zeppelin Pilot sets out from one of your restaurants and takes drinks from each source in range.</p>' +
    '<h4>Building</h4><ul><li>A new <b>house</b> comes with a garden. A <b>garden</b> can also be added to a house that started on the map.</li>' +
    '<li>A baron has at most 3 restaurants. One placed by a Local Manager opens at the end of the round.</li>' +
    '<li>While a Local or Regional Manager is at work, your restaurants have a <b>drive-in</b>: every corner counts as a door.</li></ul>' +
    '<h4>Milestones</h4><p>The first baron to do each of 18 things keeps a bonus for the whole game. Barons who do it in the same round all get it. After that round it is gone. See the Milestones tab during a game.</p>' +
    '<h4>The bank, and the end</h4><ul>' +
    '<li>The bank starts with $50 for each baron. Nobody starts with money.</li>' +
    '<li>At the start, each baron secretly picks a reserve card: $100, $200 or $300.</li>' +
    '<li><b>First time the bank runs dry:</b> the reserve cards are shown and their money is added. The value most barons picked sets the CEO slots from the next round: $100 means 2, $200 means 3, $300 means 4. A tie goes to the higher one.</li>' +
    '<li><b>Second time:</b> dinnertime is finished, everyone is paid in full, and the game ends. The richest baron wins.</li></ul>' +
    '<h4>The three kinds of game</h4><ul>' + MODES.map(m => '<li><b>' + m[1] + '.</b> ' + m[2] + '</li>').join('') + '</ul><p>The first two are the learning games from the rulebook. They start the bank at $75 a baron.</p>' +
    '<h4>How this differs from the box</h4><ul>' +
    '<li>The map tiles and the art are new.</li><li>Every billboard, mailbox and radio takes one square.</li>' +
    '<li>A driver takes drinks from every source in range of one restaurant. You do not trace a route.</li>' +
    '<li>You may do your actions in any order in your turn.</li><li>The game picks the door side of a restaurant, and nobody may pass on the first restaurant.</li></ul>',
  strategy: () => '<p>The Coach plays safe: advertise, cook, sell, grow a little. It plays the same way the computer does, so following it gives you an even match and no more. Real players win by doing one thing harder and earlier than anyone else. These are the plans they use. They need milestones, so play a Second game or a Full game.</p>' +
    '<h4>1 · Race for a milestone</h4><p>Milestones last all game and only the first round counts. Pick two or three and build your first rounds around them.</p><ul>' +
    '<li><b>First billboard.</b> Your campaigns never end and your marketers are never paid. Hire a Marketing Trainee in round 1 and place it in round 2. Most games, everyone who can does this.</li>' +
    '<li><b>First to hire 3 in one turn.</b> Two free Management Trainees. Hire a Recruiting Girl in round 1 and another in round 2. In round 3 both work, and with your CEO you hire 3. You now have far more slots than anyone.</li>' +
    '<li><b>First to train.</b> $15 off salaries every round, which is three free trained people for the whole game. Hire a Trainer in round 1 and use it in round 2.</li>' +
    '<li><b>First burger, pizza or drink advertised.</b> $5 more on every one you sell. On a $10 item that is half again.</li></ul>' +
    '<p class="eg">You cannot have them all. The Recruiting Girl opening gives up the first billboard. The billboard opening gives up the free managers. Choosing is the game.</p>' +
    '<h4>2 · Build an engine, then switch it on</h4><p>Money in the first rounds is small. Many winners earn almost nothing for six or seven rounds. They hire and train instead: Coaches or a Guru, a deep row of managers, a Burger Chef, a Brand Manager. Then they advertise widely and sell eight items a round while rivals sell two. The risk is the clock. If the bank empties before you switch on, you lose.</p>' +
    '<h4>3 · Sell dear</h4><p>A <b>Luxuries Manager</b> doubles your price to $20. Houses that have no other choice still pay it. A <b>garden</b> doubles the price again. A <b>CFO</b> adds half on top. One house with a garden that wants three items, sold at $20, pays $120 and a CFO makes it $180. This works when you are the only chain that can serve a house: because of distance, or because you advertise a product nobody else makes.</p>' +
    '<h4>4 · Sell cheap</h4><p>A house goes to the lowest price plus distance. One <b>Pricing Manager</b> beats a rival who is one tile closer. A <b>Discount Manager</b> beats one who is three tiles closer. You earn less on each item, and your rival earns nothing at all. Use it to take houses, or to answer a rival who sells dear. Waitresses win the ties.</p>' +
    '<h4>5 · Starve a rival</h4><p>A house buys only if one chain has its whole list. So advertise a second product at a house a rival feeds. If they sell burgers there, put up a billboard for lemonade. Now the house wants both, and a rival with no lemonade sells nothing. Make sure you can serve it yourself.</p>' +
    '<h4>6 · Own the map</h4><ul><li>A <b>second restaurant</b>, from a Local Manager, puts you 0 away from houses a rival thought were safe.</li>' +
    '<li>A <b>New Business Developer</b> builds a house with a garden beside your own restaurant: a rich customer only you are close to.</li>' +
    '<li>A <b>radio</b> or an <b>airplane</b> reaches many houses at once. It only pays if you can feed them all, so pair it with a Chef.</li></ul>' +
    '<h4>7 · Watch the clock and the line</h4><ul><li>The game ends when the bank is empty. Add up what everyone earns each round and you can see the end coming. Stop training two rounds before it and sell everything you can.</li>' +
    '<li>In a Full game, a $100 reserve card votes for a short game and a small company. A $300 card votes for a long one. Pick the card that suits your plan.</li>' +
    '<li>Earlier in line wins ties and gets the scarce cards first. You go earlier by leaving slots empty. Sometimes that is worth one idle slot.</li></ul>' +
    '<h4>Why you can follow every tip and lose</h4><p>The Coach suggests the move the computer would make. Against Sharp rivals that is a mirror match, and the map and the turn order decide it. On the menu, Relaxed rivals build more slowly, so the Coach\'s line usually wins. To beat Sharp rivals, pick one plan above and commit to it.</p>',
  jobs: () => '<p>▶ means you can hire the person. Everyone else comes from training, one step for each arrow. $5 means a salary each round. 1× means one per baron.</p>' +
    '<h4>Kitchen</h4>' + pathHTML(['kt', '>', 'bc', '>', 'bch']) + pathHTML(['kt', '>', 'pc', '>', 'pch']) +
    '<h4>Buyers</h4>' + pathHTML(['eb', '>', 'cart', '>', 'truck', '>', 'zep']) +
    '<h4>Marketing</h4>' + pathHTML(['mk', '>', 'cm', '>', 'bm', '>', 'bd']) +
    '<h4>Managers</h4>' + pathHTML(['mt', '>', 'jvp', '>', 'vp', '>', 'svp', '>', 'evp']) +
    '<h4>Hired as they are</h4><p>These four never train into anything.</p>' + pathHTML(['wa', 'pm', 'rg', 'tr']) +
    '<h4>From a Management Trainee</h4>' + pathHTML(['nbd', 'lux']) +
    '<h4>From a Junior Vice President</h4>' + pathHTML(['lm', 'dm', 'rmgr', 'co']) +
    '<h4>From a Vice President</h4>' + pathHTML(['rm', 'gu']) +

  ms: () => '<p>Be the first to do each thing and keep the bonus for the whole game. Barons who do it in the same round share it.</p><div class="ms">' +
    Object.keys(MS).map(m => '<div><b>' + MS[m].n + '</b>' + MS[m].r + '</div>').join('') + '</div>',

function helpHTML() {
  const tabs = [['guide', 'First game guide'], ['strategy', 'Strategy'], ['rules', 'Rules'], ['jobs', 'The jobs'], ['ms', 'Milestones']];
  return '<div class="help"><div class="head"><div class="tabs" style="margin:0">' + tabs.map(([k, n]) => '<button class="btn sm' + (UI.help === k ? ' on' : '') + '" onclick="U.help(\'' + k + '\')">' + n + '</button>').join('') +
    '</div><button class="btn sm red" onclick="U.modal(null)">Close</button></div><h2>' + tabs.find(t => t[0] === UI.help)[1] + '</h2>' + HELP[UI.help]() +
    '<p class="fine" style="margin-top:18px">Fan-made, not affiliated with Splotter Spellen.</p></div>';
}

function gameHTML() {
  const G = UI.G, me = UI.me, P = G.players[me];
  if (G.phase === 'restructure' && UI.pickRound !== G.round) {
    UI.pickRound = G.round; UI.mk = {};
    const all = P.cards.filter(c => !c.busy); UI.pick = capacity(G, all.map(c => c.t)).ok ? all.map(c => c.id) : [];
  }
  if (G.phase === 'payday' && UI.fireRound !== G.round) { UI.fireRound = G.round; UI.fire = []; }
  if (G.phase === 'place' && needs(G, me)) UI.mode = { t: 'rest', init: true, legal: legalRests(G, me, 'init') };
  else if (UI.mode && (UI.mode.init || G.phase !== 'work' || !needs(G, me))) UI.mode = null;
  tipAction(G, me);
  // For the first moments of a new game the pieces are set out: board, chips, cards. --t is how far in we are,
  // so a redraw part-way through carries on and does not start again.
  const t = Date.now() - UI.introAt, intro = UI.introOn = t < 2300;
  if (intro) { clearTimeout(UI.introT); UI.introT = setTimeout(() => { if (UI.screen === 'game') render(); }, 2320 - t); }
  UI.dealtNow = {}; UI.dealN = 0;
  const h = ['<div class="' + (intro ? 'intro' : '') + '" style="--t:' + t + 'ms"><div class="top"><img class="mascot" src="burger-barons-icon-180.png" alt=""><span class="name">Burger Barons</span>' + (G.round ? '<span class="pill">Round ' + G.round + '</span>' : '') + '<span class="pill">Bank $' + G.bank + (G.breaks === 1 ? ' · broke once' : '') + '</span>' +
    (NET.code ? '<span class="pill">Game ' + NET.code + '</span>' : '') + '<span class="sp"></span><button class="btn sm' + (UI.tips ? ' gold' : '') + '" onclick="U.tipsToggle()">Tips: ' + (UI.tips ? 'on' : 'off') + '</button><button class="btn sm" onclick="U.modal(\'help\')">How to play</button><button class="btn sm" onclick="U.quit()">Quit game</button></div>'];
  const stepNow = { restructure: 0, order: 1, work: 2, payday: 4 }[G.phase];
  if (G.round) h.push('<div class="steps">' + ['1 Restructure', '2 Order', '3 Work 9 to 5', '4 Dinner', '5 Payday', '6 Marketing', '7 Clean up'].map((n, i) => '<span class="' + (i === stepNow ? 'now' : i < stepNow ? 'done' : '') + '">' + n + '</span>').join('') + '</div>');
  else h.push('<div class="steps"><span class="now">Setting up · ' + PHASE[G.phase] + '</span></div>');
  h.push('<div class="players">' + G.order.map((p, i) => {
    const Q = G.players[p];
    return '<div class="chip' + (needs(G, p) ? ' act' : '') + '" style="--i:' + i + ';border-left-color:' + PCOL[p] + '"><div class="n"><span>' + (i + 1) + '. ' + esc(Q.name) + (p === me ? ' (you)' : Q.bot ? ' · computer' : '') + '</span><span>$' + Q.cash + '</span></div><div class="s">' +
      Q.cards.length + ' staff' + (G.mode === 'intro' ? '' : ' · ★' + Q.ms.length) + ' · ' + stockHTML(Q.stock) + '</div></div>';
  }).join('') + '</div>');
  const bsvg = boardSVG(G);
  h.push('<div class="cols"><div class="board' + (intro ? ' unfold' : '') + '">' + (intro ? '<span class="half">' + bsvg + '</span><span class="half r">' + bsvg.replace('id="bd"', '').replace('id="pv"', '') + '</span><span class="spine"></span>' : bsvg) + '<div class="legend"><span>Red number: house</span><span>White dot: restaurant door</span><span>' + gi('burger') + gi('pizza') + ' food</span><span>' + gi('soda') + ' soft drink</span><span>' + gi('beer') + ' beer</span><span>' + gi('lemon') + ' lemonade</span></div></div><div class="panel">' + actionHTML(G, me) +
    '<div class="tabs">' + [['me', 'My company'], ['rivals', 'Rivals'], ['ms', 'Milestones'], ['log', 'Log']].map(([k, n]) => '<button class="btn sm' + (UI.tab === k ? ' on' : '') + '" onclick="U.tab(\'' + k + '\')">' + n + '</button>').join('') + '</div>' + tabHTML(G, me) + '</div></div>');
  let modal = UI.modal;
  if (!modal && G.last && G.last.round > UI.seen) modal = 'dinner';
  if (!modal && G.phase === 'over' && !UI.overSeen) modal = 'over';
  const mcls = UI.lastModal === modal ? '' : ' in'; UI.lastModal = modal;
  if (modal) h.push('<div class="modal ' + modal + mcls + '"><div>' + (modal === 'help' ? helpHTML() : modal === 'dinner' ? dinnerHTML(G) : overHTML(G)) + '</div></div>');
  h.push('</div>');
  Object.assign(UI.dealt, UI.dealtNow);
  return h.join('');
}

    return '<div class="table"><div class="mat' + (fresh ? ' deal' : '') + '" id="mat">' + back + '<h2 style="margin-top:46px">Friends at the table</h2><p>Each friend plays on their own screen. Up to five barons.</p>' + nameTag() +
      '<h3>Start a table</h3><p style="text-align:left">You get a four-letter code and a link to send. Your browser runs the game, so keep this page open.</p><button class="bell teal" onclick="U.host()">Host a table<small>Get a code</small></button>' +
      '<h3>Or join one</h3><div class="ticket"><b>Guest check · table code</b><input id="jc" maxlength="4" placeholder="CODE" value="' + esc(join.toUpperCase()) + '"> <button class="btn" onclick="U.join()">Join</button></div>' +
      '<p class="fine" id="err" style="color:var(--red);min-height:1.2em;margin-top:12px">' + esc(UI.err) + '</p></div></div>' + help;
  }
  const saved = store.get('barons-save'), backIn = UI.boxBack; UI.boxBack = false;
  const well = (i, click, thing, cls, title, text) => '<button class="comp" style="--i:' + i + '" onclick="' + click + '"><span class="slot"><span class="thing' + cls + '">' + thing + '</span></span><span class="lab"><b>' + title + '</b><small>' + text + '</small></span></button>';
  return '<div class="table"><div class="boxscene"><div class="gamebox' + (UI.open ? ' is-open settled' : '') + (backIn ? ' back' : '') + '" id="gbox"><span class="shadow"></span>' +
    '<div class="base"><h1>What shall we play?<small>Pick something up.</small></h1><div class="wells">' +
    well(0, 'U.modal(\'help\')', '<span class="booklet"><span class="burstw"><span class="burst sm"><b>Rules</b></span></span>' + art('ceo') + '</span>', '', 'Learn the rules', 'A first game guide, the rules, and every job.') +
    well(1, 'U.view(\'practice\')', [['wa', '#a58bb0'], ['bc', '#8aa063'], ['co', '#b9b0a8']].map(([t, c]) => '<span class="mc" style="background:' + c + '"><i></i>' + art(t) + '</span>').join(''), ' fan', 'Practice game', 'The Coach walks you through a short, gentle game.') +
    well(2, 'U.view(\'real\')', TILEPIC + TILEPIC + '<span class="note" style="left:70px;top:112px;transform:rotate(9deg)">$5</span><span class="note" style="left:58px;top:120px;transform:rotate(-4deg)">$10</span>' +
      GOODS.map((g, i) => '<svg class="tok" viewBox="0 0 24 24" style="left:' + [0, 26, 104, 118, 4][i] + 'px;top:' + [104, 122, 66, 6, 66][i] + 'px;transform:rotate(' + [-12, 8, 14, -8, -20][i] + 'deg)"><use href="#g-' + g + '"/></svg>').join(''), ' bits', 'Real game', 'You against the computer, with money on the line.') +
    well(3, 'U.view(\'online\')', '<span class="postcard"><img src="burger-barons-icon-180.png" alt=""></span>' + [0, 1, 2].map(i => '<span style="position:absolute;bottom:0;left:' + (22 + i * 36) + 'px">' + pawn(PCOL[i + 1]) + '</span>').join(''), '', 'Play friends online', 'Send a code. Everyone plays on their own screen.') +
    '</div>' + (saved ? '<button class="savedrow" onclick="U.resume()"><span class="ribbon"></span><span class="lab"><b>Carry on</b><small>Your saved game against the computer.</small></span></button>' : '') +
    '</div>' + lidHTML() + '</div></div><p class="fine">Fan-made, not affiliated with Splotter Spellen.</p></div>' + help;
}
function lobbyHTML() {
  const host = NET.role === 'host', link = location.origin + location.pathname + '?join=' + NET.code;
  return '<div class="table"><div class="home" style="padding-top:8px"><div class="sheet" style="text-align:center"><h2>Game code</h2><div class="code">' + NET.code + '</div>' +
    '<p class="fine">Send friends this link, or the code.</p><div class="row" style="justify-content:center"><input readonly value="' + esc(link) + '" style="flex:1" onclick="this.select()"><button class="btn sm" onclick="U.copy(\'' + esc(link) + '\')">Copy</button></div></div>' +
    '<div class="sheet"><h2>At the table · ' + NET.seats.length + ' of 5</h2>' + NET.seats.map((s, i) => '<div class="seat">' + pawn(PCOL[i]) + '<b style="flex:1">' + esc(s.name) + (s.bot ? ' · computer' : '') + (s.id === NET.me ? ' (you)' : '') + '</b>' +
      (host && s.bot ? '<button class="btn sm" onclick="U.dropBot(' + i + ')">Remove</button>' : '') + '</div>').join('') +
    (host ? '<div class="row" style="margin-top:12px"><button class="btn sm"' + (NET.seats.length >= 5 ? ' disabled' : '') + ' onclick="U.addBot()">Add a computer</button><span style="flex:1"></span><button class="btn red"' + (NET.seats.length < 2 ? ' disabled' : '') + ' onclick="U.startOnline()">Start the game</button></div>'
      : '<p class="fine">Waiting for the host to start a ' + MODES.find(m => m[0] === NET.gmode)[1].toLowerCase() + '.</p>') + '</div>' +
    (host ? '<div class="sheet"><h2>Which game?</h2>' + modeHTML(UI.gmode, 'U.gmode') + '</div>' : '') +
    '<p><button class="btn" onclick="U.home()">Leave</button></p></div></div>';
}
function fitBox() { const b = $('gbox'); if (b) document.documentElement.style.setProperty('--k', (b.offsetWidth / 560).toFixed(3)); }
function render() {
  $('app').innerHTML = UI.screen === 'home' ? homeHTML() : UI.screen === 'lobby' ? lobbyHTML() : gameHTML();
  bindBoard(); fitBox();
}
window.addEventListener('resize', fitBox);

// ============================================================================
// Online play. The host's browser runs the game. A guest sends each move to the
// host, and the host sends back what that guest may see. Moves are rare, so
// everything rides on a Supabase Realtime broadcast channel named after the
// code: the same project and the same raw-WebSocket handshake Spartan Brawl uses.
// ============================================================================
const SIGNAL_URL = 'wss://tnaassoaraijvhswevvp.supabase.co/realtime/v1/websocket' +
  '?apikey=sb_publishable_KSJZlg0qLmEOak6sP3WX0g_UDo8lz9Z&vsn=1.0.0';
function makeCode() { const A = 'ABCDEFGHJKLMNPQRSTUVWXYZ'; let c = ''; for (let i = 0; i < 4; i++) c += A[Math.floor(Math.random() * A.length)]; return c; }
function openSignal(code, onMsg) {
  return new Promise((resolve, reject) => {
    let ws, ref = 1, hb, joined = false;
    const topic = 'realtime:barons-' + code;
    try { ws = new WebSocket(SIGNAL_URL); } catch (e) { reject(e); return; }
    const sig = {
      send(o) {
        if (ws.readyState === 1) ws.send(JSON.stringify({ topic, event: 'broadcast', ref: String(++ref), join_ref: '1',
          payload: { type: 'broadcast', event: 'sig', payload: o } }));
      },
      close() { clearInterval(hb); try { ws.close(); } catch (e) {} },
    };
    ws.onopen = () => {
      ws.send(JSON.stringify({ topic, event: 'phx_join', ref: '1', join_ref: '1',
        payload: { config: { broadcast: { self: false, ack: false }, presence: { key: '' }, private: false } } }));
      hb = setInterval(() => { if (ws.readyState === 1) ws.send(JSON.stringify({ topic: 'phoenix', event: 'heartbeat', payload: {}, ref: String(++ref) })); }, 25000);
    };
    ws.onmessage = e => {
      let m;
      try { m = JSON.parse(e.data); } catch (x) { return; }
      if (m.event === 'phx_reply' && m.ref === '1') {
        joined = true;
        if (m.payload && m.payload.status === 'ok') resolve(sig); else reject(new Error('join refused'));
      } else if (m.event === 'broadcast' && m.payload && m.payload.payload) {
        const o = m.payload.payload;
        if (!o.to || o.to === NET.me) onMsg(o);
      }
    };
    ws.onerror = () => { if (!joined) reject(new Error('socket')); };
    ws.onclose = () => { clearInterval(hb); if (!joined) reject(new Error('closed')); else if (NET.sig === sig) { toast('The connection dropped.'); } };
    setTimeout(() => { if (!joined) { reject(new Error('timeout')); sig.close(); } }, 8000);
  });
}
function resetNet() {
  clearInterval(NET.timer); clearTimeout(botT);
  if (NET.sig) { const s = NET.sig; NET.sig = null; s.send({ t: NET.role === 'host' ? 'bye' : 'leave', from: NET.me }); setTimeout(() => s.close(), 300); }
  NET.role = null; NET.code = null; NET.seats = [];
}
function broadcast() {
  if (NET.role !== 'host' || !NET.sig) return;
  if (UI.screen === 'lobby') { NET.sig.send({ t: 'lobby', seats: NET.seats, gmode: UI.gmode }); return; }
  NET.seats.forEach((s, i) => { if (s.id && s.id !== NET.me && !UI.G.players[i].bot) NET.sig.send({ t: 'state', to: s.id, me: i, G: view(UI.G, i) }); });
}
function hostMsg(o) {
  const i = NET.seats.findIndex(s => s.id && s.id === o.from), G = UI.G, inGame = UI.screen === 'game';
  if (o.t === 'join') {
    if (i >= 0) { if (inGame) NET.sig.send({ t: 'state', to: o.from, me: i, G: view(G, i) }); else broadcast(); return; }
    if (inGame || NET.seats.length >= 5) { NET.sig.send({ t: 'no', to: o.from, why: inGame ? 'That game has already started.' : 'That game is full.' }); return; }
    NET.seats.push({ id: o.from, name: cleanName(o.name) || 'Guest' }); broadcast(); render();
  } else if (o.t === 'leave' && i > 0) {
    if (inGame) { G.players[i].bot = true; log(G, G.players[i].name + ' left. The computer takes over.'); changed(); }
    else { NET.seats.splice(i, 1); broadcast(); render(); }
  } else if (o.t === 'sync' && i > 0) {
    if (!inGame) broadcast();
    else if (o.v !== G.v) NET.sig.send({ t: 'state', to: o.from, me: i, G: view(G, i) });
  } else if (o.t === 'act' && i > 0 && inGame && !G.players[i].bot) {
    const e = act(G, i, o.a);
    if (e) NET.sig.send({ t: 'err', to: o.from, msg: e }); else changed();
  }
}
function guestMsg(o) {
  if (o.t === 'lobby' && UI.screen !== 'game') { NET.seats = o.seats; NET.gmode = o.gmode || 'full'; UI.screen = 'lobby'; render(); }
  else if (o.t === 'state') { if (UI.G && o.G.v < UI.G.v) return; UI.G = o.G; UI.me = o.me; UI.screen = 'game'; render(); }
  else if (o.t === 'err') { toast(o.msg); }
  else if (o.t === 'no') { resetNet(); UI.screen = 'home'; UI.open = true; UI.view = 'online'; UI.err = o.why; render(); }
  else if (o.t === 'bye') { resetNet(); UI.G = null; UI.screen = 'home'; UI.open = true; UI.view = 'online'; UI.err = 'The host closed the game.'; render(); }
}
function freshGame() { UI.introAt = Date.now(); UI.dealt = {}; UI.lastModal = null; UI.seen = 0; UI.overSeen = false; UI.pickRound = -1; UI.fireRound = -1; UI.mode = null; UI.modal = null; UI.tab = 'me'; UI.mk = {}; UI.tipKey = ''; }

// ---- buttons ---------------------------------------------------------------
const BOTNAMES = ['Big Marge', 'Fry King', 'Mama Rossa', 'Sweet Lou', 'Dixie Belle', 'Uncle Sal', 'Patty Ann', 'The Colonel'];
const U = {
  act: send,
  name(v) { UI.name = cleanName(v); store.set('barons-name', UI.name); },
  // Lift the lid off, or put it back. The box stays where it is; only classes change, so nothing cuts.
  lid() {
    const b = $('gbox'); if (!b || b.classList.contains('opening') || b.classList.contains('closing')) return;
    if (!UI.open) {
      UI.open = true; b.classList.add('is-open', 'opening');
      setTimeout(() => { b.classList.remove('opening'); b.classList.add('settled'); }, 1120);
    } else {
      UI.open = false; b.classList.remove('is-open', 'settled'); b.classList.add('closing');
      setTimeout(() => b.classList.remove('closing'), 1080);
    }
  },
  // Pick a thing up: the box slides away and a placemat is laid down. Going back does the reverse.
  view(v) {
    const go = () => { UI.view = v; UI.err = ''; UI.fresh = true; UI.boxBack = v === 'box'; if (v === 'real' && UI.gmode === 'intro') UI.gmode = 'introms'; render(); window.scrollTo(0, 0); };
    const b = $('gbox'), m = $('mat');
    if (v !== 'box' && b) { b.classList.add('away'); setTimeout(go, 400); }
    else if (v === 'box' && m) { m.classList.remove('deal'); m.classList.add('leave'); setTimeout(go, 280); }
    else go();
  },
  practice() { UI.tips = true; store.set('barons-tips', 'on'); U.solo('intro', true); },
  rivals(n) { UI.rivals = n; render(); },
  level(e) { UI.easy = !!e; store.set('barons-level', e ? 'relaxed' : 'sharp'); render(); },
  gmode(m) { UI.gmode = m; store.set('barons-mode', m); if (NET.role === 'host') broadcast(); render(); },
  tab(k) { UI.tab = k; render(); },
  help(k) { UI.help = k; render(); const m = document.querySelector('.modal > div'); if (m) m.scrollTop = 0; },
  modal(k) { if (k === null && UI.G && UI.G.phase === 'over') UI.overSeen = true; UI.modal = k; render(); },
  closeDinner() { UI.seen = UI.G.last.round; UI.modal = null; render(); },
  cancel() { UI.mode = null; render(); },
  tipsToggle() { UI.tips = !UI.tips; store.set('barons-tips', UI.tips ? 'on' : 'off'); render(); },
  tipsOff() { UI.tips = false; store.set('barons-tips', 'off'); toast('Tips are off. Turn them on again at the top right.'); render(); },
  tipDo() {
    const a = UI.tip, G = UI.G; if (!a) return;
    if (G.phase === 'restructure') { UI.pick = a.ids.slice(); render(); toast('Line-up set. Press “Lock it in” when you are happy.'); }
    else if (G.phase === 'payday' && a.ids.length) { UI.fire = a.ids.slice(); render(); }
    else send(a);
  },
  pick(id) { const i = UI.pick.indexOf(id); if (i >= 0) UI.pick.splice(i, 1); else UI.pick.push(id); render(); },
  pickAll(on) { UI.pick = on ? UI.G.players[UI.me].cards.filter(c => !c.busy).map(c => c.id) : []; render(); },
  fire(id) { const i = UI.fire.indexOf(id); if (i >= 0) UI.fire.splice(i, 1); else UI.fire.push(id); render(); },
  mk(id, f, v) { (UI.mk[id] || (UI.mk[id] = {}))[f] = f === 'dur' || f === 'size' ? Number(v) : v; UI.mode = null; render(); },
  end() {
    const G = UI.G, P = G.players[UI.me], left = [];
    if (recruitsOf(P) > P.u.rec) left.push('a hire');
    if (workCards(P).some(c => !P.u.done[c.id] && (c.t === 'kt' || c.t === 'eb'))) left.push('kitchen or errand staff');
    if (left.length && U.endAsk !== G.v) { U.endAsk = G.v; toast('You still have ' + left.join(' and ') + ' to use. Press again to end anyway.'); return; }
    send({ k: 'end' });
  },
  place(what, id, move) {
    const G = UI.G, me = UI.me, P = G.players[me], c = cardOf(P, id);
    if (what === 'house') UI.mode = { t: 'house', id, legal: legalHouses(G), hint: 'Tap near a green dot to build the house.' };
    else if (what === 'garden') { UI.mode = { t: 'garden', id, opts: legalGardens(G), hint: 'Tap a green strip beside a house.' }; if (!UI.mode.opts.length) { UI.mode = null; toast('No house has room for a garden.'); } }
    else if (what === 'rest') {
      let legal;
      if (move != null) { const old = P.rests.splice(move, 1)[0]; legal = legalRests(G, me, c.t); P.rests.splice(move, 0, old); } else legal = legalRests(G, me, c.t);
      UI.mode = { t: 'rest', id, move, legal, hint: 'Tap near a green dot to place the restaurant.' };
    } else {
      const k = mkOf(G, P, c), o = k.o, a = { k: 'market', id, kind: o.kind, good: o.good, dur: has(P, 'billboard') ? 1 : o.dur };
      if (o.kind === 'air') { a.axis = o.axis; a.size = o.size; UI.mode = { t: 'air', a, hint: 'Tap the map to pick where the airplane flies.' }; }
      else UI.mode = { t: 'camp', a, legal: legalCampSpots(G, me, o.kind, k.M.range), hint: 'Tap a green square for the ' + KINDNAME[o.kind].toLowerCase() + '.' };
    }
    render();
    if (window.innerWidth <= 900) { const b = document.querySelector('.board'); if (b) b.scrollIntoView({ behavior: 'smooth', block: 'start' }); }
  },
  solo(mode, easy) {
    resetNet(); freshGame();
    const names = BOTNAMES.slice().sort(() => Math.random() - 0.5);
    const seats = [{ name: UI.name || 'You' }]; for (let i = 0; i < UI.rivals; i++) seats.push({ name: names[i], bot: true });
    UI.G = newGame(seats, Math.floor(Math.random() * 2 ** 31), mode || UI.gmode, mode ? easy : UI.easy); UI.me = 0; UI.screen = 'game'; changed();
  },
  resume() {
    try { const s = JSON.parse(store.get('barons-save')); if (!s.G.mode) throw 0; resetNet(); freshGame(); UI.G = s.G; UI.me = s.me; UI.seen = s.G.last ? s.G.last.round : 0; s.G.players[s.me].cards.forEach(c => { UI.dealt[c.id] = c.t; }); UI.screen = 'game'; render(); scheduleBots(); }

  home() { resetNet(); UI.screen = 'home'; UI.open = true; UI.view = 'box'; UI.modal = null; UI.err = ''; render(); },
  quit() {

  async host() {

  },
  async join() {
    const code = ($('jc').value || '').toUpperCase().replace(/[^A-Z]/g, '');

    resetNet(); UI.err = 'Looking for game ' + code + '…'; render();
    NET.code = code; NET.role = 'guest';
    try { NET.sig = await openSignal(code, guestMsg); }
    catch (e) { NET.role = null; UI.err = 'Could not reach the game server. Check your connection.'; render(); return; }
    freshGame(); UI.G = null;
    const hello = () => NET.sig && NET.sig.send(UI.screen === 'home' ? { t: 'join', from: NET.me, name: UI.name || 'Guest' } : { t: 'sync', from: NET.me, v: UI.G ? UI.G.v : -1 });
    hello(); NET.timer = setInterval(hello, 4000);
    setTimeout(() => { if (NET.role === 'guest' && UI.screen === 'home') { resetNet(); UI.err = 'No game answered to ' + code + '.'; render(); } }, 9000);
  },
  addBot() { const used = NET.seats.map(s => s.name), n = BOTNAMES.find(b => used.indexOf(b) < 0); NET.seats.push({ id: null, name: n, bot: true }); broadcast(); render(); },
  dropBot(i) { NET.seats.splice(i, 1); broadcast(); render(); },
  startOnline() {
    freshGame();
    UI.G = newGame(NET.seats.map(s => ({ name: s.name, bot: s.bot })), Math.floor(Math.random() * 2 ** 31), UI.gmode, UI.easy); UI.me = 0; UI.screen = 'game'; changed();
  },
  takeover(p) { const G = UI.G; G.players[p].bot = true; log(G, 'The computer takes over for ' + G.players[p].name + '.'); changed(); },
  copy(s) { if (navigator.clipboard) navigator.clipboard.writeText(s).then(() => toast('Link copied.'), () => toast('Copy it by hand.')); },
};
if (new URLSearchParams(location.search).get('join')) { UI.open = true; UI.view = 'online'; }
window.addEventListener('beforeunload', () => { if (NET.sig) NET.sig.send({ t: NET.role === 'host' ? 'bye' : 'leave', from: NET.me }); });
render();
