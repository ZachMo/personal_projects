  for (let j = 0; j <= nz; j++) for (let i = 0; i <= nx; i++) H[j * (nx + 1) + i] = rawH(x0 + i * CELL, z0 + j * CELL);
  W.H = H;
  W.heightAt = (x, z) => {
    const fx = clamp((x - W.x0) / CELL, 0, nx - 1e-4), fz = clamp((z - W.z0) / CELL, 0, nz - 1e-4);
    const i = Math.floor(fx), j = Math.floor(fz), u = fx - i, v = fz - j, k = j * (nx + 1) + i;
    // Split each cell the way the mesh splits it, so the ground the disc
    // lands on is the ground you see.
    if (u + v <= 1) return H[k] + (H[k + 1] - H[k]) * u + (H[k + nx + 1] - H[k]) * v;
    return H[k + nx + 2] + (H[k + nx + 1] - H[k + nx + 2]) * (1 - u) + (H[k + 1] - H[k + nx + 2]) * (1 - v);
  };
  W.inMap = (x, z) => x > W.x0 + 6 && x < W.x1 - 6 && z > W.z0 + 6 && z < W.z1 - 6;
  W.surface = (x, z) => {
    if (!W.inMap(x, z)) return S.OOB;
    if (W.heightAt(x, z) < WATER_Y + 0.01) return S.WATER;
    if (W.roadAt(x, z)) return S.ROAD;
    for (const s of W.sands) if (W.ell(s, x, z) < 0.93) return S.SAND;
    if (Math.hypot(x - W.pin.x, z - W.pin.z) < 10) return S.CIRCLE;
    if (W.pathDist(x, z) < def.fw) return S.FAIR;
    return S.ROUGH;
  };
  W.pin.y = W.heightAt(W.pin.x, W.pin.z);
  W.tee.y = W.heightAt(W.tee.x, W.tee.z);

  // ── Trees ──
  const rnd = seeded(seed * 7919);
  const addTree = (x, z, big) => {
    const s = W.surface(x, z);
    if (s === S.WATER || s === S.ROAD || s === S.SAND || s === S.OOB && W.inMap(x, z)) return;
    if (Math.hypot(x - W.tee.x, z - W.tee.z) < 7 || Math.hypot(x - W.pin.x, z - W.pin.z) < 6) return;
    const y = W.heightAt(x, z);
    if (y < WATER_Y + 0.3) return;
    const pine = rnd() < 0.5;
    const tall = (big ? 1.15 : 1) * (pine ? 8 + rnd() * 9 : 7 + rnd() * 6);
    const t = { x, z, y, pine, tall, trunk: pine ? 0.22 + rnd() * 0.1 : 0.28 + rnd() * 0.14 };
    if (pine) { t.cy0 = y + 1.4 + rnd() * 0.8; t.cy1 = y + tall; t.cr = tall * (0.22 + rnd() * 0.06); }
    else { t.cr = tall * (0.30 + rnd() * 0.08); t.cy = y + tall - t.cr * 0.85; t.cry = t.cr * 0.82; }
    t.tint = rnd();
    W.trees.push(t);
  };
  // Woods: a jittered grid, thinning out towards the fairway.
  for (let z = W.z0 + 4; z < W.z1; z += 8) {
    for (let x = W.x0 + 4; x < W.x1; x += 8) {
      const px = x + (rnd() - 0.5) * 7, pz = z + (rnd() - 0.5) * 7;
      const d = W.pathDist(px, pz);
      const edge = Math.min(px - W.x0, W.x1 - px, pz - W.z0, W.z1 - pz);
      let p = def.trees * smooth(def.fw + 1, def.fw + 14, d);
      if (edge < 22) p = Math.max(p, 0.8);            // the woods that close the park
      if (rnd() < p) addTree(px, pz, false);
    }
  }
  for (const ft of def.feat) {
    if (ft.t === "tree") addTree(ft.x, -ft.f, true);
    if (ft.t === "grove") {
      for (let n = 0; n < ft.n; n++) {
        const a = rnd() * TAU, r = Math.sqrt(rnd()) * ft.r;
        addTree(ft.x + Math.cos(a) * r, -ft.f + Math.sin(a) * r, false);
      }
    }
  }
  // A spatial hash for collisions, 10 m buckets.
  W.treeAt = new Map();
  for (const t of W.trees) {
    const k = Math.floor(t.x / 10) * 100000 + Math.floor(t.z / 10);
    if (!W.treeAt.has(k)) W.treeAt.set(k, []);
    W.treeAt.get(k).push(t);
  }
  W.treesNear = (x, z, out) => {
    out.length = 0;
    const i = Math.floor(x / 10), j = Math.floor(z / 10);
    for (let a = -1; a <= 1; a++) for (let b = -1; b <= 1; b++) {
      const l = W.treeAt.get((i + a) * 100000 + (j + b));
      if (l) for (const t of l) out.push(t);
    }
    return out;
  };

  // Cars, two to a road, one each way.
  for (const r of W.roads) {
    const len = Math.hypot(r.bx - r.ax, r.bz - r.az);
    r.len = len; r.ux = (r.bx - r.ax) / len; r.uz = (r.bz - r.az) / len;
    for (let k = 0; k < 2; k++) {
      W.cars.push({ road: r, s: rnd() * len, dir: k ? -1 : 1, lane: k ? 1.9 : -1.9,
                    speed: 11 + rnd() * 5, col: k });
    }
  }

  // Wind, fixed for the hole.
  const wa = rnd() * TAU;
  W.wind = { x: Math.cos(wa) * def.wind, z: Math.sin(wa) * def.wind, speed: def.wind };
  return W;
}

// Where a car is, and which way it points.
function carPose(W, c) {
  const r = c.road;
  const x = r.ax + r.ux * c.s - r.uz * c.lane, z = r.az + r.uz * c.s + r.ux * c.lane;
  return { x, z, y: W.heightAt(x, z), ux: r.ux * c.dir, uz: r.uz * c.dir };
}

// ── Meshes for a hole ──
const C = {

  sand: [0.91, 0.82, 0.58], mud: [0.47, 0.44, 0.30], road: [0.27, 0.27, 0.29],
  outer: [0.24, 0.42, 0.19], water: [0.12, 0.36, 0.55], line: [0.95, 0.85, 0.3], white: [0.92, 0.92, 0.9],
  bark: [0.36, 0.25, 0.16], pine: [0.13, 0.33, 0.18], leaf: [0.27, 0.50, 0.20],
  pad: [0.68, 0.67, 0.63], metal: [0.70, 0.72, 0.74], chain: [0.80, 0.81, 0.83], band: [0.98, 0.76, 0.12],

      c = lerp3(C.fair, C.rough, smooth(def.fw - 3, def.fw, W.pathDist(x, z)));
    } else c = C.rough;
    if (h < WATER_Y + 0.7) c = lerp3(C.mud, c, smooth(WATER_Y + 0.2, WATER_Y + 0.7, h));
    const n = 0.92 + vnoise(x / 4, z / 4, def.seed + 9) * 0.16;      // mown and unmown
    const o = k * 9;
    a[o] = x; a[o + 1] = h; a[o + 2] = z;
    a[o + 3] = nnx / l; a[o + 4] = ny / l; a[o + 5] = nnz / l;
    a[o + 6] = c[0] * n; a[o + 7] = c[1] * n; a[o + 8] = c[2] * n;
  }
  let q = 0;
  for (let j = 0; j < nz; j++) for (let i = 0; i < nx; i++) {
    const k = j * row + i;
    idx[q++] = k; idx[q++] = k + 1; idx[q++] = k + row;
    idx[q++] = k + 1; idx[q++] = k + row + 1; idx[q++] = k + row;
  }
  return { data: a, index: idx };
}
function lerp3(a, b, t) { return [lerp(a[0], b[0], t), lerp(a[1], b[1], t), lerp(a[2], b[2], t)]; }

function propsMesh(W) {
  const g = new Geo();
  const rnd = seeded(W.def.seed * 31);
  // Trees.
  for (const t of W.trees) {
    const v = 0.85 + t.tint * 0.3;
    if (t.pine) {
      g.frustum(t.x, t.y - 0.3, t.z, t.trunk, t.cy0 + 0.6, t.trunk * 0.7, 5, C.bark, 0, t.tint * 3);
      const tiers = 3, span = t.cy1 - t.cy0;
      for (let n = 0; n < tiers; n++) {
        const y0 = t.cy0 + span * n * 0.27, y1 = y0 + span * (0.55 - n * 0.06);
        const r = t.cr * (1 - n * 0.27);
        const col = [C.pine[0] * v, C.pine[1] * v * (1 + n * 0.05), C.pine[2] * v];
        g.frustum(t.x, y0, t.z, r, Math.min(y1, t.cy1), 0, 7, col, 1, t.tint * 5 + n);
      }
    } else {
      g.frustum(t.x, t.y - 0.3, t.z, t.trunk, t.cy, t.trunk * 0.6, 5, C.bark, 0, t.tint * 3);
      const col = [C.leaf[0] * v * (0.9 + t.tint * 0.3), C.leaf[1] * v, C.leaf[2] * v];
      g.blob(t.x, t.cy, t.z, t.cr, t.cry, col, rnd);
    }
  }
  // Roads: a strip draped over the ground with a dashed centre line and edges.
  for (const r of W.roads) {
    const len = Math.hypot(r.bx - r.ax, r.bz - r.az), ux = (r.bx - r.ax) / len, uz = (r.bz - r.az) / len;
    const px = -uz, pz = ux, hw = r.w / 2;
    const at = (s, o, up) => {
      const x = r.ax + ux * s + px * o, z = r.az + uz * s + pz * o;
      return [x, W.heightAt(x, z) + (up || 0.07), z];
    };
    for (let s = 0; s < len; s += 2) {
      const s2 = Math.min(len, s + 2);
      const x = r.ax + ux * s, z = r.az + uz * s;
      if (x < W.x0 - 2 || x > W.x1 + 2 || z < W.z0 - 2 || z > W.z1 + 2) continue;
      g.quad(at(s, -hw), at(s2, -hw), at(s2, hw), at(s, hw), C.road);
      g.quad(at(s, -hw + 0.25, 0.09), at(s2, -hw + 0.25, 0.09), at(s2, -hw + 0.4, 0.09), at(s, -hw + 0.4, 0.09), C.white);
      g.quad(at(s, hw - 0.4, 0.09), at(s2, hw - 0.4, 0.09), at(s2, hw - 0.25, 0.09), at(s, hw - 0.25, 0.09), C.white);
      if ((s / 2) % 3 < 1.5) g.quad(at(s, -0.08, 0.09), at(s2, -0.08, 0.09), at(s2, 0.08, 0.09), at(s, 0.08, 0.09), C.line);
    }
  }
  // The tee pad, pointing up the first leg.
  {
    const p = W.path, dx = p[1][0] - p[0][0], dz = p[1][1] - p[0][1], l = Math.hypot(dx, dz);
    const fx = dx / l, fz = dz / l, rx = -fz, rz = fx, y = W.tee.y + 0.06;
    const c = (f, r) => [W.tee.x + fx * f + rx * r, y, W.tee.z + fz * f + rz * r];
    g.quad(c(-1.2, -0.8), c(-1.2, 0.8), c(3.2, 0.8), c(3.2, -0.8), C.pad);
    W.teeYaw = Math.atan2(fx, -fz);
  }
  // The basket.
  {
    const x = W.pin.x, z = W.pin.z, y = W.pin.y, B = BASKET;
    g.frustum(x, y - 0.2, z, B.poleR, y + B.bandHi + 0.08, B.poleR, 6, C.metal, 2);
    g.frustum(x, y + B.trayLo, z, B.trayR * 0.86, y + B.trayHi, B.trayR, 14, C.metal, 1);
    g.frustum(x, y + B.chainHi, z, B.chainR, y + B.bandHi, B.chainR, 14, C.band, 0);
    // Chains: two rings of them, each hanging from the band in to the pole.
    for (let n = 0; n < 18; n++) {
      const a = (n / 18) * TAU, r0 = n % 2 ? B.chainR * 0.92 : B.chainR * 0.6;
      const tx = x + Math.cos(a) * r0, tz = z + Math.sin(a) * r0;
      const bx = x + Math.cos(a) * 0.09, bz = z + Math.sin(a) * 0.09;
      const sx = -Math.sin(a) * 0.012, sz = Math.cos(a) * 0.012;
      const ctr = [x, y + 1, z];
      g.quad([tx - sx, y + B.chainHi, tz - sz], [tx + sx, y + B.chainHi, tz + sz],
             [bx + sx, y + B.chainLo + 0.03, bz + sz], [bx - sx, y + B.chainLo + 0.03, bz - sz], C.chain, ctr);
    }
  }
  // The rest of the world: grass out to the haze, and a ring of blue hills.
  {
    const R = 1400, y = 1.3, c = C.outer;
    const o = [[W.x0, W.z0], [W.x1, W.z0], [W.x1, W.z1], [W.x0, W.z1]];
    const far = [[-R, -R], [R, -R], [R, R], [-R, R]];
    for (let i = 0; i < 4; i++) {
      const a = o[i], b = o[(i + 1) % 4], fa = far[i], fb = far[(i + 1) % 4];
      g.quad([a[0], y, a[1]], [b[0], y, b[1]], [fb[0], y, fb[1]], [fa[0], y, fa[1]], c);
    }
    const cx = (W.x0 + W.x1) / 2, cz = (W.z0 + W.z1) / 2;
    const ring = 48, ctr = [cx, -200, cz];
    for (let i = 0; i < ring; i++) {
      const a = (i / ring) * TAU, b = ((i + 1) / ring) * TAU;
      const r = 900, h1 = 40 + vnoise(i * 0.7, 3, W.def.seed) * 90, h2 = 40 + vnoise((i + 1) * 0.7, 3, W.def.seed) * 90;
      const p = [cx + Math.cos(a) * r, 0, cz + Math.sin(a) * r], q = [cx + Math.cos(b) * r, 0, cz + Math.sin(b) * r];
      const pt = [cx + Math.cos(a) * r * 1.08, h1, cz + Math.sin(a) * r * 1.08];
      const qt = [cx + Math.cos(b) * r * 1.08, h2, cz + Math.sin(b) * r * 1.08];
      g.quad(p, q, qt, pt, C.hill, ctr);
    }
  }
  return new Float32Array(g.a);
}

function waterMesh(W) {
  if (!W.lakes.length) return null;
  const g = new Geo(), y = WATER_Y;
  // One sheet over the part of the map that has lakes in it.
  let x0 = Infinity, x1 = -Infinity, z0 = Infinity, z1 = -Infinity;
  for (const l of W.lakes) {
    x0 = Math.min(x0, l.x - l.rx - 4); x1 = Math.max(x1, l.x + l.rx + 4);
    z0 = Math.min(z0, l.z - l.rz - 4); z1 = Math.max(z1, l.z + l.rz + 4);
  }
  x0 = Math.max(x0, W.x0); x1 = Math.min(x1, W.x1); z0 = Math.max(z0, W.z0); z1 = Math.min(z1, W.z1);
  const step = 8;
  for (let z = z0; z < z1; z += step) for (let x = x0; x < x1; x += step) {
    const xb = Math.min(x + step, x1), zb = Math.min(z + step, z1);
    g.quad([x, y, z], [xb, y, z], [xb, y, zb], [x, y, zb], C.water);
  }
  return new Float32Array(g.a);
}

function skyMesh() {
  const g = new Geo(), seg = 24, rings = 8, R = 1500;
  const col = (e) => lerp3([0.80, 0.88, 0.94], [0.30, 0.56, 0.86], Math.pow(Math.max(0, e), 0.6));
  for (let j = 0; j < rings; j++) {
    const e0 = -0.25 + (j / rings) * 1.25, e1 = -0.25 + ((j + 1) / rings) * 1.25;
    const a0 = Math.min(e0, 1) * Math.PI / 2, a1 = Math.min(e1, 1) * Math.PI / 2;
    for (let i = 0; i < seg; i++) {
      const t0 = (i / seg) * TAU, t1 = ((i + 1) / seg) * TAU;
      const p = (t, a) => [Math.cos(t) * Math.cos(a) * R, Math.sin(a) * R, Math.sin(t) * Math.cos(a) * R];
      const c0 = col(e0), c1 = col(e1);
      const A = p(t0, a0), B = p(t1, a0), Cc = p(t1, a1), D = p(t0, a1);
      g.v(...A, 0, 1, 0, c0); g.v(...B, 0, 1, 0, c0); g.v(...Cc, 0, 1, 0, c1);
      g.v(...A, 0, 1, 0, c0); g.v(...Cc, 0, 1, 0, c1); g.v(...D, 0, 1, 0, c1);
    }
  }
  return new Float32Array(g.a);
}

function discMesh(col) {
  const g = new Geo(), r = DISC_R, top = 0.016, rim = -0.012, n = 20;
  const dark = [col[0] * 0.62, col[1] * 0.62, col[2] * 0.62];
  const ctr = [0, 0, 0];
  for (let i = 0; i < n; i++) {
    const a = (i / n) * TAU, b = ((i + 1) / n) * TAU;
    const p = [Math.cos(a) * r, 0, Math.sin(a) * r], q = [Math.cos(b) * r, 0, Math.sin(b) * r];
    const pi = [Math.cos(a) * r * 0.62, top * 0.85, Math.sin(a) * r * 0.62], qi = [Math.cos(b) * r * 0.62, top * 0.85, Math.sin(b) * r * 0.62];
    // A stripe across the top, so you can see it spin.
    const stripe = i < 3 || (i >= n / 2 && i < n / 2 + 3);
    const c = stripe ? [1, 1, 1] : col;
    g.quad(p, q, qi, pi, c, ctr);
    g.tri(pi, qi, [0, top, 0], c, ctr);
    g.quad(p, q, [q[0], rim, q[2]], [p[0], rim, p[2]], dark, ctr);
    g.tri([p[0] * 0.9, rim, p[2] * 0.9], [q[0] * 0.9, rim, q[2] * 0.9], [0, rim + 0.004, 0], dark, [0, 1, 0]);
    g.quad([p[0], rim, p[2]], [q[0], rim, q[2]], [q[0] * 0.9, rim, q[2] * 0.9], [p[0] * 0.9, rim, p[2] * 0.9], dark, [0, 1, 0]);
  }
  return new Float32Array(g.a);
}

function carMesh(col) {
  const g = new Geo();
  g.box(0, 0.62, 0, 1.8, 0.75, 4.3, col);                                   // body (x across, z along)
  g.box(0, 1.25, -0.2, 1.6, 0.6, 2.2, [col[0] * 0.5 + 0.25, col[1] * 0.5 + 0.3, col[2] * 0.5 + 0.35]);
  for (const sx of [-0.85, 0.85]) for (const sz of [-1.35, 1.35]) g.box(sx, 0.33, sz, 0.25, 0.62, 0.62, [0.1, 0.1, 0.1]);
  return new Float32Array(g.a);
}

// ── The renderer ──
const VS = `
attribute vec3 aP; attribute vec3 aN; attribute vec3 aC;
uniform mat4 uVP; uniform mat4 uM; uniform vec3 uEye;
varying vec3 vC; varying vec3 vN; varying vec3 vW; varying float vD;
void main() {
  vec4 w = uM * vec4(aP, 1.0);
  vW = w.xyz; vN = (uM * vec4(aN, 0.0)).xyz; vC = aC; vD = length(w.xyz - uEye);
  gl_Position = uVP * w;
}`;
const FS = `
#ifdef GL_FRAGMENT_PRECISION_HIGH
precision highp float;
#else
precision mediump float;
#endif
uniform vec3 uSun; uniform vec3 uFog; uniform float uFogK; uniform float uMode; uniform float uTime;
uniform vec3 uEye;
varying vec3 vC; varying vec3 vN; varying vec3 vW; varying float vD;
void main() {
  vec3 c = vC;
  if (uMode > 1.5) { gl_FragColor = vec4(c, 1.0); return; }
  vec3 n = normalize(vN);
  float spec = 0.0;
  if (uMode > 0.5) {
    float r = sin(vW.x * 0.8 + uTime * 1.3) * sin(vW.z * 0.65 - uTime * 1.05)
            + 0.5 * sin((vW.x + vW.z) * 1.9 + uTime * 2.1);
    n = normalize(vec3(r * 0.05, 1.0, r * 0.04));
    vec3 v = normalize(uEye - vW);
    spec = pow(max(dot(reflect(-uSun, n), v), 0.0), 60.0) * 0.8;
    c = mix(c, vec3(0.62, 0.78, 0.88), pow(1.0 - max(v.y, 0.0), 4.0) * 0.6);
  }
  float diff = max(dot(n, uSun), 0.0);
  float hemi = 0.5 + 0.5 * n.y;
  vec3 lit = c * (vec3(0.50, 0.55, 0.63) * hemi + vec3(0.24, 0.22, 0.18) * (1.0 - hemi)
           + vec3(1.0, 0.95, 0.84) * diff * 0.72) + vec3(spec);
  float f = 1.0 - exp(-pow(vD * uFogK, 2.0));
  gl_FragColor = vec4(mix(lit, uFog, clamp(f, 0.0, 1.0)), 1.0);
}`;

const R3 = {
  gl: null, ok: false, loc: {}, sky: null,
  init(canvas) {
    if (this.gl) return this.ok;
    let gl = null;
    try { gl = canvas.getContext("webgl", { antialias: true, alpha: false }) ||
               canvas.getContext("experimental-webgl"); } catch (e) {}
    this.gl = gl || false;
    if (!gl) return (this.ok = false);
    const sh = (type, src) => {
      const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);
      if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
      return s;
    };
    const p = gl.createProgram();
    gl.attachShader(p, sh(gl.VERTEX_SHADER, VS)); gl.attachShader(p, sh(gl.FRAGMENT_SHADER, FS));
    gl.linkProgram(p);
    gl.useProgram(p);
    for (const n of ["aP", "aN", "aC"]) this.loc[n] = gl.getAttribLocation(p, n);
    for (const n of ["uVP", "uM", "uEye", "uSun", "uFog", "uFogK", "uMode", "uTime"]) this.loc[n] = gl.getUniformLocation(p, n);
    for (const n of ["aP", "aN", "aC"]) gl.enableVertexAttribArray(this.loc[n]);
    gl.enable(gl.DEPTH_TEST);
    const s = [0.45, 0.8, 0.35], l = Math.hypot(...s);
    gl.uniform3f(this.loc.uSun, s[0] / l, s[1] / l, s[2] / l);
    gl.uniform3f(this.loc.uFog, 0.80, 0.88, 0.94);
    this.sky = this.mesh(skyMesh());
    return (this.ok = true);
  },
  mesh(data, index) {
    if (!data) return null;
    const gl = this.gl, m = { vbo: gl.createBuffer(), count: data.length / 9, ibo: null };
    gl.bindBuffer(gl.ARRAY_BUFFER, m.vbo); gl.bufferData(gl.ARRAY_BUFFER, data, gl.STATIC_DRAW);
    if (index) {
      m.ibo = gl.createBuffer(); m.count = index.length;
      gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, m.ibo); gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, index, gl.STATIC_DRAW);
    }
    return m;
  },
  free(m) {
    if (!m || !this.gl) return;
    this.gl.deleteBuffer(m.vbo); if (m.ibo) this.gl.deleteBuffer(m.ibo);
  },
  draw(m, model, mode) {
    if (!m) return;
    const gl = this.gl, L = this.loc;
    gl.bindBuffer(gl.ARRAY_BUFFER, m.vbo);
    gl.vertexAttribPointer(L.aP, 3, gl.FLOAT, false, 36, 0);
    gl.vertexAttribPointer(L.aN, 3, gl.FLOAT, false, 36, 12);
    gl.vertexAttribPointer(L.aC, 3, gl.FLOAT, false, 36, 24);
    gl.uniformMatrix4fv(L.uM, false, model || IDENT);
    gl.uniform1f(L.uMode, mode || 0);
    if (m.ibo) { gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, m.ibo); gl.drawElements(gl.TRIANGLES, m.count, gl.UNSIGNED_SHORT, 0); }
    else gl.drawArrays(gl.TRIANGLES, 0, m.count);
  },
};

// ── Flight ──
// One fixed step of a disc in the air. `f` is the flight state: position,
// velocity, the disc's normal (unit, the way its top faces), spin in rad/s,
// spin direction (+1 clockwise seen from above, a right-handed backhand) and
// the disc's coefficients.
function airStep(f, W, dt) {
  const d = f.disc;
  const rx = f.vx - W.wind.x, ry = f.vy, rz = f.vz - W.wind.z;
  const sp = Math.hypot(rx, ry, rz) || 1e-6;
  const ux = rx / sp, uy = ry / sp, uz = rz / sp;
  const dn = ux * f.nx + uy * f.ny + uz * f.nz;
  const alpha = -Math.asin(clamp(dn, -1, 1));             // air from below is positive
  f.alpha = alpha;
  // Spin relative to what a clean release of this pace would carry. Under
  // about half of that the disc wobbles: less lift, more drag.
  const sf = clamp(f.w / (f.wFull || 1), 0, 1);
  const stall = 0.42, aa = Math.abs(alpha);
  let cl = d.cl0 + d.cla * clamp(alpha, -stall, stall);
  if (aa > stall) cl *= Math.max(0, 1 - (aa - stall) / 0.9);
  cl *= 0.6 + 0.4 * sf;
  const cd = d.cd0 + d.cda * (alpha - d.a0) * (alpha - d.a0) + 0.10 * (1 - sf) * (1 - sf) + f.leafDrag;
  let lx = f.nx - dn * ux, ly = f.ny - dn * uy, lz = f.nz - dn * uz;
  const ll = Math.hypot(lx, ly, lz);
  if (ll > 1e-6) { lx /= ll; ly /= ll; lz /= ll; } else { lx = ly = lz = 0; }
  const q = 0.5 * AIR * sp * sp * DISC_A;
  f.vx += (q * (cl * lx - cd * ux) / DISC_M) * dt;
  f.vy += (q * (cl * ly - cd * uy) / DISC_M - G) * dt;
  f.vz += (q * (cl * lz - cd * uz) / DISC_M) * dt;
  f.x += f.vx * dt; f.y += f.vy * dt; f.z += f.vz * dt;

  // Precession. The pitching moment acts about the disc's sideways axis
  // (velocity x normal); spin turns that into a roll about the flight line.
  const cm = d.cm0 + d.cma * clamp(alpha, -0.6, 0.6);
  const rate = clamp((q * DISC_D * cm) / (DISC_I * Math.max(f.w, 4)), -6, 6);
  let sx = uy * f.nz - uz * f.ny, sy = uz * f.nx - ux * f.nz, sz = ux * f.ny - uy * f.nx;
  const sl = Math.hypot(sx, sy, sz);
  if (sl > 1e-6) {
    const k = -f.dir * rate * dt / sl;
    f.nx += sx * k; f.ny += sy * k; f.nz += sz * k;
    const nl = Math.hypot(f.nx, f.ny, f.nz); f.nx /= nl; f.ny /= nl; f.nz /= nl;
  }
  f.w *= 1 - 0.05 * dt;                                     // the air slowly takes the spin
  f.spinA += f.dir * f.w * dt;
}

// A throw's starting state. Yaw 0 looks down -z. Angle is the launch angle;
// tilt is positive with the right edge down.
function release(disc, x, y, z, yaw, angleDeg, tiltDeg, speed, spin) {
  const th = angleDeg * Math.PI / 180, ti = tiltDeg * Math.PI / 180;
  const fx = Math.sin(yaw), fz = -Math.cos(yaw), rx = Math.cos(yaw), rz = Math.sin(yaw);
  const dirx = fx * Math.cos(th), diry = Math.sin(th), dirz = fz * Math.cos(th);
  // Nose follows the launch, with a little nose-down, the way a clean throw leaves the hand.
  const p = th - 0.035;
  let nx = -fx * Math.sin(p), ny = Math.cos(p), nz = -fz * Math.sin(p);
  nx = nx * Math.cos(ti) + rx * Math.sin(ti); ny = ny * Math.cos(ti); nz = nz * Math.cos(ti) + rz * Math.sin(ti);
  const nl = Math.hypot(nx, ny, nz);
  const wFull = 30 + 4.4 * speed;                          // what a clean release spins at
  const amt = clamp(Math.abs(spin), 0.06, 1);
  return {
    disc, x, y, z, vx: dirx * speed, vy: diry * speed, vz: dirz * speed,
    nx: nx / nl, ny: ny / nl, nz: nz / nl, w: wFull * amt, wFull, dir: spin < 0 ? -1 : 1,
    spinA: 0, alpha: 0, leafDrag: 0, t: 0,
  };
}

// How hard a throw is, from 0..1 on the meter. The bottom of the meter is
// stretched so short putts have room.
function throwSpeed(disc, power, footing) {
  return disc.vmax * (0.1 + 0.9 * Math.pow(clamp(power, 0, 1), 1.3)) * footing;
}

// ── The game ──
const DEG = Math.PI / 180;
const ANGLE_LO = -6, ANGLE_HI = 30, TILT_MAX = 45;
const near = [];                                          // scratch list for tree lookups

function discModel(px, py, pz, nx, ny, nz, spinA) {
  let ax = 1, az = 0;
  if (Math.abs(nx) > 0.9) { ax = 0; az = 1; }
  const d = ax * nx + az * nz;
  let Xx = ax - d * nx, Xy = -d * ny, Xz = az - d * nz;
  const l = Math.hypot(Xx, Xy, Xz); Xx /= l; Xy /= l; Xz /= l;
  const Zx = Xy * nz - Xz * ny, Zy = Xz * nx - Xx * nz, Zz = Xx * ny - Xy * nx;
  const c = Math.cos(spinA), s = Math.sin(spinA);
  return M4.basis(Xx * c + Zx * s, Xy * c + Zy * s, Xz * c + Zz * s, nx, ny, nz,
                  Zx * c - Xx * s, Zy * c - Xy * s, Zz * c - Xz * s, px, py, pz);
}

function angDiff(a, b) { let d = b - a; while (d > Math.PI) d -= TAU; while (d < -Math.PI) d += TAU; return d; }

function scoreName(n, par) {
  if (n === 1) return "Ace";
  const d = n - par;
  return { "-3": "Albatross", "-2": "Eagle", "-1": "Birdie", "0": "Par", "1": "Bogey", "2": "Double bogey" }[d] ||
         (d > 0 ? "+" + d : d + "");
}
const vsPar = (d) => d === 0 ? "E" : d > 0 ? "+" + d : "" + d;

const game = {
  id: "frisbee",
  title: "Frisbee Fall",
  light: true,
  clubs: DISCS.map((d) => d.name),
  usesPads: false,
  gl: true,

  init(w, h) {
    this.canvas3d = $("stage3d");
    this.state = "ready";
    this.W = null;
    this.mesh = {};
    this.time = 0;
    this.disc = 0;
    this.angle = 8; this.tilt = 0; this.spin = 0; this.power = 0;
    this.yaw = 0; this.pitch = -7 * DEG; this.fovK = 1;
    this.camYaw = 0; this.camPitch = 0;
    this.trail = [];
    this.toast = null;
    this.fade = 0;
    this.keys = {};
    this.resize(w, h);
    let ok = false;
    try { ok = R3.init(this.canvas3d); } catch (e) { ok = false; }
    this.bindTouch();
    Hud.set("", "");
    if (!ok) {
      overlay('<h3>Frisbee Fall</h3><p class="why">This browser cannot draw in 3D (no WebGL).</p>' +
              '<button class="btn ghost" data-act="home">Back</button>', { home: () => Router.show("home") });
      return;
    }
    this.discMeshes = this.discMeshes || DISCS.map((d) => R3.mesh(discMesh(d.col)));
    this.carMeshes = this.carMeshes || [R3.mesh(carMesh([0.80, 0.18, 0.16])), R3.mesh(carMesh([0.20, 0.36, 0.72]))];
    this.loadHole(0);                                    // something to look at behind the intro
    this.intro();
  },

  resize(w, h) {
    this.w = w; this.h = h;
    if (this.canvas3d) {
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      this.canvas3d.width = Math.round(w * dpr);
      this.canvas3d.height = Math.round(h * dpr);
    }
    this.layout();
  },

  layout() {
    const w = this.w, h = this.h;
    const bar = $("clubs").getBoundingClientRect(), st = $("stage").getBoundingClientRect();
    const bottom = (bar.height ? bar.top - st.top : h) - 12;
    const lefty = Settings.lefty;
    const r = clamp(Math.min(w, h) * 0.1, 32, 46);
    const bx = lefty ? 22 + r : w - 22 - r;
    const by = clamp(h * 0.5, 130, bottom - 110);
    this.btn = { x: bx, y: by, r, pull: Math.max(70, bottom - by - r - 8) };
    const pw = clamp(w * 0.3, 104, 150), ph = pw * 0.86;
    this.pad = { x: lefty ? w - 18 - pw : 18, y: bottom - ph, w: pw, h: ph };
  },

  destroy() {
    this.unbindTouch();
    this.freeHole();
    if (this.canvas3d) this.canvas3d.style.display = "none";
  },

  freeHole() {
    for (const k in this.mesh) R3.free(this.mesh[k]);
    this.mesh = {};
  },

  // ── Round flow ──
  intro() {
    overlay(
      '<h3>Frisbee Fall</h3>' +
      '<p class="why">Six holes in the park. Pull down to throw. A second finger swipes the spin.</p>' +
      '<button class="btn primary" data-act="play">Start</button>' +
      '<button class="btn ghost" data-act="home">Back</button>',
      { play: () => this.startRound(), home: () => Router.show("home") }
    );
  },

  onPause() {
    if (this.state === "ready" || this.state === "card" || this.state === "held") return;
    this.held = this.state;
    this.state = "held";
    overlay(
      '<h3>Paused</h3>' +
      '<button class="btn primary" data-act="go">Play on</button>' +
      '<button class="btn ghost" data-act="home">Walk off</button>',
      { go: () => { Veil.hide(); this.state = this.held; Engine.resume(); },
        home: () => Router.show("home") }
    );
  },

  startRound() {
    Veil.hide();
    Engine.resume();
    this.scores = [];
    this.loadHole(0);
    this.state = "aim";
  },

  loadHole(i) {
    this.freeHole();
    this.hole = i;
    this.throws = 0;
    const W = this.W = buildWorld(HOLES[i]);
    const t = terrainMesh(W);
    this.mesh.terrain = R3.mesh(t.data, t.index);
    this.mesh.props = R3.mesh(propsMesh(W));
    this.mesh.water = R3.mesh(waterMesh(W));
    this.f = null;
    this.trail = [];
    this.standAt(W.tee.x, W.tee.z, W.teeYaw);
    this.say(HOLES[i].name, "Hole " + (i + 1) + " · Par " + HOLES[i].par + " · " +
             Math.round(Math.hypot(W.pin.x - W.tee.x, W.pin.z - W.tee.z)) + " m", 2.6);
    this.paintClubs();
  },

  standAt(x, z, yaw) {
    const W = this.W;
    this.lie = { x, z, y: W.heightAt(x, z), surf: W.surface(x, z) };
    this.yaw = yaw === undefined ? Math.atan2(W.pin.x - x, -(W.pin.z - z)) : yaw;
    this.camYaw = this.yaw;
    this.pitch = -7 * DEG;
    this.camPitch = this.pitch;
    this.fovK = 1;
    this.spin = 0;
    this.power = 0;
    // Close in, a putter is what you want; you can still change it.
    const d = Math.hypot(W.pin.x - x, W.pin.z - z);
    this.disc = d < 22 ? 2 : d < 60 ? 1 : 0;
    this.paintClubs();
  },

  pickClub(i) {
    if (this.state !== "aim") return;
    this.disc = i;
    this.paintClubs();
    Sound.blip(520 + i * 120, 0.05, "sine", 0.08);
  },

  paintClubs() {
    $("clubs").querySelectorAll("button").forEach((b) => {
      b.setAttribute("aria-pressed", String(Number(b.dataset.c) === this.disc));
    });
  },

  say(big, small, secs) { this.toast = { big, small, t: secs || 1.8, life: secs || 1.8 }; },

  // ── Throwing ──
  footing() { return FOOTING[this.lie.surf] || 1; },

  throwIt() {
    const d = DISCS[this.disc], L = this.lie;
    const speed = throwSpeed(d, this.power, this.footing());
    // The disc leaves the hand a step in front of you, at chest height.
    const fx = Math.sin(this.yaw), fz = -Math.cos(this.yaw);
    this.f = release(d, L.x + fx * 0.4, L.y + HAND, L.z + fz * 0.4, this.yaw, this.angle, this.tilt, speed, this.spin);
    Object.assign(this.f, { phase: "air", lastIn: { x: L.x, z: L.z }, caught: false, rest: null });
    this.throws++;
    this.trail = [];
    this.trailT = 0;
    this.acc = 0;
    this.restT = 0;
    this.state = "fly";
    this.from = { x: L.x, z: L.z };
    this.power = 0;
    Sound.noise(0.16, 0.1);
    Sound.slide(420, 820, 0.18, "sine");
    buzz(14);
  },

  inBounds(x, z) {
    const W = this.W;
    return W.inMap(x, z) && W.heightAt(x, z) >= WATER_Y + 0.01 && !W.roadAt(x, z);
  },

  // One fixed step of the disc and everything it can hit.
  tick(dt) {
    const f = this.f, W = this.W, B = BASKET;
    f.t += dt;
    if (f.t > 16) { this.settle(); return; }
    const px = W.pin.x, pz = W.pin.z, py = W.pin.y;

    if (f.phase === "air") {
      airStep(f, W, dt);
      f.leafDrag = 0;
      if (this.inBounds(f.x, f.z)) { f.lastIn.x = f.x; f.lastIn.z = f.z; }

      // Trees: the trunk is solid, the crown is a gamble.
      W.treesNear(f.x, f.z, near);
      for (const t of near) {
        const dx = f.x - t.x, dz = f.z - t.z, d = Math.hypot(dx, dz);
        if (d > t.cr + 1) continue;
        const trunkTop = t.pine ? t.cy0 + 0.6 : t.cy;
        if (d < t.trunk + DISC_R && f.y < trunkTop && f.y > t.y - 0.3) {
          const nx = dx / (d || 1), nz = dz / (d || 1), vn = f.vx * nx + f.vz * nz;
          if (vn < 0) { f.vx -= 1.35 * vn * nx; f.vz -= 1.35 * vn * nz; }
          f.vx *= 0.4; f.vz *= 0.4; f.vy = Math.min(f.vy, 0) * 0.5; f.w *= 0.5;
          f.x = t.x + nx * (t.trunk + DISC_R + 0.01); f.z = t.z + nz * (t.trunk + DISC_R + 0.01);
          this.thunk();
          continue;
        }
        let inside;
        if (t.pine) inside = f.y > t.cy0 && f.y < t.cy1 && d < t.cr * (1 - (f.y - t.cy0) / (t.cy1 - t.cy0));
        else { const a = d / t.cr, b = (f.y - t.cy) / t.cry; inside = a * a + b * b < 1; }
        if (!inside) continue;
        f.leafDrag = 0.35;
        const sp = Math.hypot(f.vx, f.vy, f.vz);
        if (Math.random() < 1 - Math.exp(-sp * dt * 0.32)) {
          // A branch. It takes most of the pace and knocks the disc off line.
          const k = rand(0.25, 0.55);
          f.vx = f.vx * k + rand(-1, 1) * sp * 0.25;
          f.vz = f.vz * k + rand(-1, 1) * sp * 0.25;
          f.vy = f.vy * k - rand(0, 1) * sp * 0.15;
          f.nx += rand(-0.5, 0.5); f.nz += rand(-0.5, 0.5);
          const l = Math.hypot(f.nx, f.ny, f.nz); f.nx /= l; f.ny /= l; f.nz /= l;
          f.w *= 0.6;
          Sound.noise(0.22, 0.09);
          this.thunk(true);
        }
      }

      // The basket.
      const dx = f.x - px, dz = f.z - pz, dh = Math.hypot(dx, dz), y = f.y - py;
      if (!f.spat && dh < B.chainR - 0.02 && y > B.trayLo && y < B.bandHi) {
        // The chains stop a disc that is not going too hard, and a hard one
        // that hits them square. Clip the edge at pace and it goes through.
        const hs = Math.hypot(f.vx, f.vz);
        if (hs < 16 - dh * 26) { this.catchIt(); return; }
        f.spat = true;
        f.vx *= -0.15; f.vz *= -0.15; f.vy = Math.min(f.vy, 0);
        this.chains(3);
        this.say("Spit out", "Too hot for the chains", 1.6);
      } else if (dh < B.chainR + 0.06 && dh > B.chainR - 0.06 && y > B.chainHi - 0.02 && y < B.bandHi + 0.02) {
        this.bounceOff(f, dx / dh, dz / dh, 0.3);
        Sound.blip(1250, 0.35, "square", 0.06);
      } else if (dh < B.poleR + DISC_R * 0.6 && y < B.bandHi && y > -0.2) {
        this.bounceOff(f, dx / (dh || 1), dz / (dh || 1), 0.25);
        Sound.blip(1100, 0.3, "square", 0.07);
      } else if (dh < B.trayR + 0.02 && y < B.trayHi && y > B.trayLo - 0.05) {
        this.bounceOff(f, dx / (dh || 1), dz / (dh || 1), 0.3);
        Sound.blip(900, 0.2, "square", 0.06);
      }

      // Cars.
      for (const c of W.cars) {
        const p = carPose(W, c);
        const ex = f.x - p.x, ez = f.z - p.z;
        const u = ex * p.ux + ez * p.uz, v = -ex * p.uz + ez * p.ux;
        if (Math.abs(u) < 2.25 && Math.abs(v) < 0.95 && f.y > p.y && f.y < p.y + 1.6) {
          this.bounceOff(f, -p.uz * Math.sign(v || 1), p.ux * Math.sign(v || 1), 0.4);
          f.vy = Math.abs(f.vy) * 0.3 + 1.5;
          Sound.blip(330, 0.22, "square", 0.08);
          setTimeout(() => Sound.blip(330, 0.3, "square", 0.08), 260);
          this.say("Honk", "", 1.2);
        }
      }

      // The ground.
      const gy = W.heightAt(f.x, f.z);
      if (f.y <= gy + 0.012) {
        f.y = gy + 0.012;
        const s = W.surface(f.x, f.z);
        if (s === S.WATER) { this.splash(); return; }
        const g = GRIP[s] || GRIP[1];
        const hs = Math.hypot(f.vx, f.vz) || 1e-6;
        const steep = Math.abs(f.vy) / hs;
        // A disc that lands on its edge with pace rolls.
        if (Math.abs(f.ny) < 0.55 && hs > 7 && s !== S.SAND && s !== S.ROUGH) {
          f.phase = "roll";
          const k = 0.75 / (1 + steep);
          f.vx *= k; f.vz *= k;
        } else {
          f.phase = "slide";
          const k = g.keep / (1 + steep * 1.2);
          f.vx *= k; f.vz *= k;
        }
        f.vy = 0;
        Sound.noise(0.07, 0.06);
      }
      return;
    }

    // On the ground: sliding flat, or rolling on its edge.
    const s = W.surface(f.x, f.z);
    if (s === S.WATER) { this.splash(); return; }
    const sp = Math.hypot(f.vx, f.vz);
    const g = GRIP[s] || GRIP[1];
    if (f.phase === "roll") {
      // Rolling discs curve toward the side they lean to, and lean further as they slow.
      const lean = f.nx * Math.cos(Math.atan2(f.vx, -f.vz)) + f.nz * Math.sin(Math.atan2(f.vx, -f.vz));
      const turn = clamp(lean, -1, 1) * 0.9 * dt;
      const c = Math.cos(turn), si = Math.sin(turn);
      const vx = f.vx * c - f.vz * si, vz = f.vx * si + f.vz * c;
      f.vx = vx; f.vz = vz;
      const drop = (0.09 + (s === S.ROAD ? 0 : 0.08)) * G * dt;
      const k = Math.max(0, sp - drop) / (sp || 1);
      f.vx *= k; f.vz *= k;
      if (sp < 2) { f.phase = "slide"; f.ny = 1; f.nx = f.nz = 0; Sound.noise(0.06, 0.05); }
    } else {
      const drop = g.mu * G * dt;
      const k = Math.max(0, sp - drop) / (sp || 1);
      f.vx *= k; f.vz *= k;
      // Lie down flat as it stops.
      f.nx *= 0.95; f.nz *= 0.95; const l = Math.hypot(f.nx, f.ny, f.nz); f.nx /= l; f.ny /= l; f.nz /= l;
    }
    const nx = f.x + f.vx * dt, nz = f.z + f.vz * dt;
    W.treesNear(nx, nz, near);
    for (const t of near) {
      if (Math.hypot(nx - t.x, nz - t.z) < t.trunk + DISC_R) { f.vx = f.vz = 0; this.thunk(); break; }
    }
    if (Math.hypot(nx - px, nz - pz) < B.poleR + DISC_R) { f.vx = f.vz = 0; Sound.blip(1100, 0.2, "square", 0.05); }
    if (f.vx || f.vz) { f.x = nx; f.z = nz; }
    f.y = W.heightAt(f.x, f.z) + 0.012;
    if (this.inBounds(f.x, f.z)) { f.lastIn.x = f.x; f.lastIn.z = f.z; }
    f.spinA += f.dir * f.w * dt * 0.2;
    f.w *= 1 - 3 * dt;
    if (Math.hypot(f.vx, f.vz) < 0.12) this.settle();
  },

  bounceOff(f, nx, nz, e) {
    const vn = f.vx * nx + f.vz * nz;
    if (vn < 0) { f.vx -= (1 + e) * vn * nx; f.vz -= (1 + e) * vn * nz; }
    f.vx *= 0.5; f.vz *= 0.5; f.w *= 0.6;
    f.x += nx * 0.05; f.z += nz * 0.05;
  },

  thunk(soft) {
    Sound.blip(soft ? 190 : 120, 0.12, "triangle", soft ? 0.1 : 0.22);
    if (!soft) buzz(20);
  },

  chains(n) {
    const notes = [1760, 2310, 1480, 2640, 1980, 2200, 1650];
    for (let i = 0; i < n; i++) setTimeout(() => Sound.blip(notes[i % notes.length], 0.18, "square", 0.035), i * 55);
  },

  catchIt() {
    const f = this.f, W = this.W;
    f.caught = true;
    f.x = W.pin.x + (f.x - W.pin.x) * 0.5; f.z = W.pin.z + (f.z - W.pin.z) * 0.5;
    f.y = W.pin.y + BASKET.trayLo + 0.05;
    f.vx = f.vy = f.vz = 0;
    f.nx = 0; f.ny = 1; f.nz = 0;
    this.chains(7);
    buzz([20, 40, 20]);
    const n = this.throws, par = HOLES[this.hole].par;
    this.say(n === 1 ? "Ace!" : "Chains!", scoreName(n, par) + " · " + n + (n === 1 ? " throw" : " throws"), 2.2);
    this.settle();
  },

  splash() {
    const f = this.f;
    f.splashed = true;
    f.y = WATER_Y;
    f.vx = f.vy = f.vz = 0;
    Sound.noise(0.5, 0.24);
    Sound.slide(380, 70, 0.45, "sine");
    buzz(30);
    this.settle();
  },

  // The disc has stopped. Work out what that means.
  settle() {
    const f = this.f, W = this.W;
    f.phase = "rest";
    f.vx = f.vy = f.vz = 0;
    this.state = "rest";
    this.restT = 0;
    if (f.caught) return;
    const s = f.splashed ? S.WATER : W.surface(f.x, f.z);
    const dist = Math.round(Math.hypot(f.x - this.from.x, f.z - this.from.z));
    if (s === S.WATER || s === S.ROAD || s === S.OOB) {
      this.throws++;                                     // one stroke penalty
      f.ob = true;
      const why = s === S.WATER ? "Splash" : s === S.ROAD ? "On the road" : "Out of bounds";
      this.say(why, "Penalty throw · play from where it went out", 2.0);
      // Play from the last place the disc was over in-bounds ground, a step back toward the tee side.
      let x = f.lastIn.x, z = f.lastIn.z;
      for (let k = 0; k < 20 && !this.inBounds(x, z); k++) {
        x += (this.from.x - x) * 0.1; z += (this.from.z - z) * 0.1;
      }
      f.next = { x, z };
    } else {
      const extra = s === S.SAND ? " · bad footing" : "";
      this.say(dist + " m", SURF_NAME[s] + extra, 1.7);
      f.next = { x: f.x, z: f.z };
    }
    // Never stand inside a tree.
    const n = f.next;
    W.treesNear(n.x, n.z, near);
    for (const t of near) {
      const d = Math.hypot(n.x - t.x, n.z - t.z), need = t.trunk + 0.5;
      if (d < need) { const k = need / (d || 1); n.x = t.x + (n.x - t.x) * k; n.z = t.z + (n.z - t.z) * k; }
    }
  },

  holeDone() {
    const par = HOLES[this.hole].par, n = this.throws;
    this.scores[this.hole] = n;
    const total = this.scores.reduce((a, b) => a + b, 0);
    const parSoFar = HOLES.slice(0, this.scores.length).reduce((a, h) => a + h.par, 0);
    const last = this.hole === HOLES.length - 1;
    this.state = "card";
    const rows = HOLES.map((h, i) => {
      const v = this.scores[i];
      return '<li><span>' + (i + 1) + ' · ' + h.name + ' <span class="miss">par ' + h.par + '</span></span>' +
             (v ? '<span class="v">' + v + '</span>' : '<span class="miss">–</span>') + '</li>';
    }).join("");
    if (!last) {
      overlay(
        '<h3>' + scoreName(n, par) + '</h3>' +
        '<p class="why">Hole ' + (this.hole + 1) + ' · ' + HOLES[this.hole].name + '</p>' +
        '<div class="score">' + n + '</div>' +
        '<p class="best">Round ' + vsPar(total - parSoFar) + '</p>' +
        '<ul class="catch-list">' + rows + '</ul>' +
        '<button class="btn primary" data-act="next">Hole ' + (this.hole + 2) + '</button>' +
        '<button class="btn ghost" data-act="home">Walk off</button>',
        { next: () => { Veil.hide(); this.loadHole(this.hole + 1); this.state = "aim"; },
          home: () => Router.show("home") }
      );
      return;
    }
    const prev = Best.get("frisbee", 0);
    const isBest = Best.setLow("frisbee", total);
    overlay(
      '<h3>' + (isBest && prev ? "New best round" : "Round done") + '</h3>' +
      '<p class="why">' + vsPar(total - parSoFar) + ' on a par ' + parSoFar + '</p>' +
      '<div class="score">' + total + '</div>' +
      '<p class="best">' + (prev && !isBest ? "Best " + prev : "Throws") + '</p>' +
      '<ul class="catch-list">' + rows + '</ul>' +
      '<button class="btn primary" data-act="again">Play again</button>' +
      '<button class="btn ghost" data-act="home">Home</button>',
      { again: () => this.startRound(), home: () => Router.show("home") }
    );
  },

  // ── Input ──
  bindTouch() {
    const cv = $("stage");
    const at = (e) => { const r = cv.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; };
    this.ptr = {};
    this._down = (e) => {
      const p = at(e), id = e.pointerId;
      if (this.state === "fly") { this.fast = true; this.ptr[id] = { kind: "fast" }; return; }
      if (this.state !== "aim") return;
      Sound.wake();
      const b = this.btn, pd = this.pad;
      const onBtn = Math.hypot(p.x - b.x, p.y - b.y) < b.r * 1.35;
      const onPad = p.x > pd.x - 8 && p.x < pd.x + pd.w + 8 && p.y > pd.y - 8 && p.y < pd.y + pd.h + 8;
      const holding = Object.values(this.ptr).some((q) => q.kind === "throw");
      if (holding) this.ptr[id] = { kind: "spin", x0: p.x };
      else if (onBtn) this.ptr[id] = { kind: "throw", x0: p.x, y0: p.y, x: p.x, y: p.y, mode: "?" };
      else if (onPad) {
        const now = performance.now();
        if (now - (this.padTap || 0) < 320) { this.angle = 8; this.tilt = 0; Sound.blip(600, 0.05, "sine", 0.06); }
        this.padTap = now;
        this.ptr[id] = { kind: "pad", x: p.x, y: p.y };
      } else this.ptr[id] = { kind: "look", x: p.x, y: p.y };
    };
    this._move = (e) => {
      const q = this.ptr[e.pointerId];
      if (!q) return;
      const p = at(e);
      if (q.kind === "look") {
        this.yaw += (p.x - q.x) * 0.0042;
        this.pitch = clamp(this.pitch - (p.y - q.y) * 0.003, -40 * DEG, 25 * DEG);
      } else if (q.kind === "pad") {
        this.tilt = clamp(this.tilt + (p.x - q.x) * 0.45, -TILT_MAX, TILT_MAX);
        this.angle = clamp(this.angle - (p.y - q.y) * 0.22, ANGLE_LO, ANGLE_HI);
      } else if (q.kind === "spin") {
        this.spin = clamp((p.x - q.x0) / (this.w * 0.32), -1, 1);
      } else if (q.kind === "throw") {
        const dx = p.x - q.x0, dy = p.y - q.y0;
        if (q.mode === "?") {
          if (dy > 10 && dy > Math.abs(dx)) q.mode = "pull";
          else if (Math.abs(dx) > 12 && Math.abs(dx) > Math.abs(dy)) q.mode = "spin";
        }
        if (q.mode === "pull") this.power = clamp(dy / this.btn.pull, 0, 1);
        if (q.mode === "spin") this.spin = clamp(dx / (this.w * 0.32), -1, 1);
      }
      if (q.x !== undefined) { q.x = p.x; q.y = p.y; }
    };
    this._up = (e) => {
      const q = this.ptr[e.pointerId];
      delete this.ptr[e.pointerId];
      if (!q) return;
      if (q.kind === "fast") this.fast = Object.values(this.ptr).some((r) => r.kind === "fast");
      if (q.kind === "throw" && this.state === "aim") {
        if (q.mode === "pull" && this.power > 0.04 && e.type === "pointerup") this.throwIt();
        else this.power = 0;
      }
    };
    this._key = (e) => {
      const down = e.type === "keydown", k = e.key.toLowerCase();
      this.keys[k] = down;
      if (k === " " && this.state === "aim") {
        e.preventDefault();
        if (!down && this.power > 0.04) this.throwIt();
      }
      if (k === " " && this.state === "fly") this.fast = down;
    };
    cv.addEventListener("pointerdown", this._down);
    cv.addEventListener("pointermove", this._move);
    cv.addEventListener("pointerup", this._up);
    cv.addEventListener("pointercancel", this._up);
    window.addEventListener("keydown", this._key);
    window.addEventListener("keyup", this._key);
  },

  unbindTouch() {
    const cv = $("stage");
    if (!this._down) return;
    cv.removeEventListener("pointerdown", this._down);
    cv.removeEventListener("pointermove", this._move);
    cv.removeEventListener("pointerup", this._up);
    cv.removeEventListener("pointercancel", this._up);
    window.removeEventListener("keydown", this._key);
    window.removeEventListener("keyup", this._key);
    this._down = null;
  },

  // ── Frame ──
  update(dt) {
    this.time += dt;
    const W = this.W;
    if (!W) return;
    for (const c of W.cars) {
      c.s += c.speed * c.dir * dt;
      if (c.s > c.road.len) c.s -= c.road.len;
      if (c.s < 0) c.s += c.road.len;
    }
    if (this.toast) { this.toast.t -= dt; if (this.toast.t <= 0) this.toast = null; }
    if (this.state === "held" || this.state === "ready" || this.state === "card") return;

    if (this.state === "aim") {
      const k = this.keys;
      this.yaw += Input.padAxis * 0.9 * dt;
      if (k.w) this.angle = clamp(this.angle + 14 * dt, ANGLE_LO, ANGLE_HI);
      if (k.s) this.angle = clamp(this.angle - 14 * dt, ANGLE_LO, ANGLE_HI);
      if (k.q) this.tilt = clamp(this.tilt - 40 * dt, -TILT_MAX, TILT_MAX);
      if (k.e) this.tilt = clamp(this.tilt + 40 * dt, -TILT_MAX, TILT_MAX);
      if (k.z) this.spin = clamp(this.spin - 1.5 * dt, -1, 1);
      if (k.x) this.spin = clamp(this.spin + 1.5 * dt, -1, 1);
      if (k[" "]) this.power = clamp(this.power + dt / 1.4, 0, 1);
      this.camYaw = this.yaw;
      this.camPitch = this.pitch;
      this.fovK += (1 - this.fovK) * Math.min(1, dt * 4);
      const L = this.lie, dist = Math.hypot(W.pin.x - L.x, W.pin.z - L.z);
      const ft = this.footing();
      Hud.set(Math.round(dist) + " m",
              "Hole " + (this.hole + 1) + " · Par " + HOLES[this.hole].par + " · Throw " + (this.throws + 1) +
              (ft < 1 ? " · " + SURF_NAME[L.surf] : ""));
      return;
    }

    if (this.state === "fly") {
      const f = this.f;
      this.acc += dt * (this.fast ? 3 : 1);
      let n = 0;
      while (this.acc >= DT && this.state === "fly" && n < 2000) {
        this.tick(DT); this.acc -= DT; n++;
        this.trailT += DT;
        if (this.trailT > 0.04) { this.trailT = 0; this.trail.push([f.x, f.y, f.z]); if (this.trail.length > 400) this.trail.shift(); }
      }
    }
    this.track(dt);

    if (this.state === "rest") {
      this.restT += dt;
      if (this.restT > (this.f.caught ? 1.8 : 1.5)) {
        if (this.f.caught) { this.holeDone(); return; }
        this.state = "cut"; this.cutT = 0;
      }
    }
    if (this.state === "cut") {
      // Fade out, step to where the disc stopped, fade back in.
      this.cutT += dt;
      if (this.cutT >= 0.35 && !this.cutDone) {
        this.cutDone = true;
        this.standAt(this.f.next.x, this.f.next.z);
        this.f = null;
        this.trail = [];
      }
      this.fade = this.cutT < 0.35 ? this.cutT / 0.35 : Math.max(0, 1 - (this.cutT - 0.35) / 0.35);
      if (this.cutT >= 0.7) { this.state = "aim"; this.cutDone = false; this.fade = 0; }
    }
  },

  // In flight you stay where you threw from and turn to watch, zooming in as it goes.
  track(dt) {
    const f = this.f;
    if (!f) return;
    const L = this.lie, ex = L.x, ey = L.y + EYE, ez = L.z;
    const dx = f.x - ex, dy = f.y - ey, dz = f.z - ez, hd = Math.hypot(dx, dz);
    const ty = Math.atan2(dx, -dz), tp = Math.atan2(dy, hd);
    const k = Math.min(1, dt * 5);
    this.camYaw += angDiff(this.camYaw, ty) * k;
    this.camPitch += (clamp(tp, -40 * DEG, 40 * DEG) - 4 * DEG - this.camPitch) * k;
    const d = Math.hypot(dx, dy, dz);
    const want = clamp(Math.atan(10 / Math.max(d, 1)) * 2 / this.baseFov(), 0.13, 1);
    this.fovK += (want - this.fovK) * Math.min(1, dt * 2.5);
  },

  baseFov() {
    const aspect = this.w / this.h;
    return clamp(2 * Math.atan(Math.tan(37 * DEG) / aspect), 45 * DEG, 88 * DEG);
  },

  camera() {
    const L = this.lie;
    const ex = L.x, ey = L.y + EYE, ez = L.z;
    const cp = Math.cos(this.camPitch);
    const fx = Math.sin(this.camYaw) * cp, fy = Math.sin(this.camPitch), fz = -Math.cos(this.camYaw) * cp;
    const proj = M4.persp(this.baseFov() * this.fovK, this.w / this.h, 0.05, 3000);
    const view = M4.look(ex, ey, ez, fx, fy, fz);
    return { ex, ey, ez, fx, fy, fz, vp: M4.mul(proj, view) };
  },

  project(cam, x, y, z) {
    const m = cam.vp;
    const cx = m[0] * x + m[4] * y + m[8] * z + m[12];
    const cy = m[1] * x + m[5] * y + m[9] * z + m[13];
    const cw = m[3] * x + m[7] * y + m[11] * z + m[15];
    if (cw <= 0.01) return null;
    return { x: (cx / cw * 0.5 + 0.5) * this.w, y: (0.5 - cy / cw * 0.5) * this.h, d: cw };
  },

  draw(g, w, h) {
    g.clearRect(0, 0, w, h);
    if (!R3.ok || !this.W) return;
    this.layout();
    const cam = this.camera();
    this.render3d(cam);
    this.drawOverlay(g, w, h, cam);
  },

  render3d(cam) {
    const gl = R3.gl, L = R3.loc, cv = this.canvas3d;
    gl.viewport(0, 0, cv.width, cv.height);
    gl.clearColor(0.80, 0.88, 0.94, 1);
    gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
    gl.uniformMatrix4fv(L.uVP, false, cam.vp);
    gl.uniform3f(L.uEye, cam.ex, cam.ey, cam.ez);
    gl.uniform1f(L.uTime, this.time);
    gl.uniform1f(L.uFogK, 0.0016);
    gl.depthMask(false);
    R3.draw(R3.sky, M4.at(cam.ex, cam.ey - 20, cam.ez), 2);
    gl.depthMask(true);
    R3.draw(this.mesh.terrain);
    R3.draw(this.mesh.water, null, 1);
    R3.draw(this.mesh.props);
    const W = this.W;
    for (const c of W.cars) {
      const p = carPose(W, c);
      R3.draw(this.carMeshes[c.col], M4.basis(p.uz, 0, -p.ux, 0, 1, 0, p.ux, 0, p.uz, p.x, p.y + 0.05, p.z));
    }
    const f = this.f;
    if (f) {
      R3.draw(this.discMeshes[DISCS.indexOf(f.disc)], discModel(f.x, f.y, f.z, f.nx, f.ny, f.nz, -f.spinA));
    }
    if (this.state === "aim" || (this.state === "cut" && this.cutDone)) {
      // The disc in your hand, tilted the way you will throw it.
      gl.clear(gl.DEPTH_BUFFER_BIT);
      const yaw = this.yaw, fx = Math.sin(yaw), fz = -Math.cos(yaw), rx = Math.cos(yaw), rz = Math.sin(yaw);
      const r = release(DISCS[this.disc], 0, 0, 0, yaw, this.angle, this.tilt, 1, 1);
      const cpch = Math.cos(this.camPitch), spch = Math.sin(this.camPitch);
      // Kept the same height on screen whatever the field of view.
      const fk = Math.tan(this.baseFov() / 2) / Math.tan(44 * DEG);
      const back = (0.8 - this.power * 0.16) / Math.pow(fk, 0.75);
      const down = (0.3 + this.power * 0.05) * fk * back / 0.8;
      // Hold it in front of the eye, below the middle of the view, whichever way you look.
      const ux = -fx * spch, uy = cpch, uz = -fz * spch;          // camera up
      const px = cam.ex + cam.fx * back - ux * down + rx * 0.02;
      const py = cam.ey + cam.fy * back - uy * down;
      const pz = cam.ez + cam.fz * back - uz * down + rz * 0.02;
      const wob = this.power > 0 ? Math.sin(this.time * 30) * 0.004 * this.power : 0;
      R3.draw(this.discMeshes[this.disc], discModel(px, py + wob, pz, r.nx, r.ny, r.nz, this.time * 0.3));
    }
  },

  drawOverlay(g, w, h, cam) {
    const W = this.W;
    g.save();
    g.textAlign = "center";
    g.textBaseline = "middle";
    const font = (wt, px) => wt + " " + px + "px system-ui, -apple-system, sans-serif";

    // Where the basket is: a marker over it, or an arrow at the edge pointing round to it.
    {
      const p = this.project(cam, W.pin.x, W.pin.y + 1.75, W.pin.z);
      const L = this.lie, dist = Math.round(Math.hypot(W.pin.x - L.x, W.pin.z - L.z));
      const onScreen = p && p.x > 20 && p.x < w - 20 && p.y > 60 && p.y < h - 20;
      if (onScreen) {
        g.fillStyle = "#ffcf33"; g.strokeStyle = "rgba(22,35,46,.7)"; g.lineWidth = 2;
        g.beginPath(); g.moveTo(p.x, p.y); g.lineTo(p.x - 7, p.y - 12); g.lineTo(p.x + 7, p.y - 12); g.closePath();
        g.stroke(); g.fill();
        if (this.state === "aim") {
          g.font = font(700, 12);
          g.lineWidth = 3; g.strokeStyle = "rgba(255,255,255,.85)"; g.strokeText(dist + " m", p.x, p.y - 22);
          g.fillStyle = "#16232e"; g.fillText(dist + " m", p.x, p.y - 22);
        }
      } else if (this.state === "aim") {
        const side = angDiff(this.camYaw, Math.atan2(W.pin.x - L.x, -(W.pin.z - L.z)));
        const x = side > 0 ? w - 26 : 26, y = h * 0.36;
        g.fillStyle = "#ffcf33"; g.strokeStyle = "rgba(22,35,46,.7)"; g.lineWidth = 2;
        g.beginPath();
        const s = side > 0 ? 1 : -1;
        g.moveTo(x + s * 10, y); g.lineTo(x - s * 6, y - 11); g.lineTo(x - s * 6, y + 11); g.closePath();
        g.stroke(); g.fill();
      }
    }

    // The flight: a fading trail and a bright dot, since a disc 80 m off is smaller than a pixel.
    const f = this.f;
    if (f && this.trail.length) {
      g.lineWidth = 2; g.lineCap = "round"; g.lineJoin = "round";
      let prev = null;
      const n = this.trail.length;
      for (let i = 0; i < n; i++) {
        const t = this.trail[i];
        // The first few metres pass under the eye and would streak across a zoomed view.
        const p = Math.hypot(t[0] - cam.ex, t[2] - cam.ez) > 6 ? this.project(cam, t[0], t[1], t[2]) : null;
        if (p && prev) {
          g.strokeStyle = "rgba(255,255,255," + (0.15 + 0.55 * i / n).toFixed(3) + ")";
          g.beginPath(); g.moveTo(prev.x, prev.y); g.lineTo(p.x, p.y); g.stroke();
        }
        prev = p;
      }
    }
    if (f) {
      const p = this.project(cam, f.x, f.y, f.z);
      if (p) {
        g.fillStyle = f.disc.css; g.strokeStyle = "#fff"; g.lineWidth = 2;
        g.beginPath(); g.arc(p.x, p.y, 4.5, 0, TAU); g.fill(); g.stroke();
        // Its shadow, so you can judge height.
        const gy = W.heightAt(f.x, f.z);
        const s = f.y - gy > 0.3 ? this.project(cam, f.x, gy + 0.02, f.z) : null;
        if (s) { g.fillStyle = "rgba(10,20,10,.35)"; g.beginPath(); g.ellipse(s.x, s.y, 4, 1.8, 0, 0, TAU); g.fill(); }
      }
    }

    if (this.state === "aim") this.drawControls(g, w, h, cam, font);
    this.drawWind(g, w, font);

    if (this.toast) {
      const t = this.toast, a = clamp(Math.min(t.t / 0.35, (t.life - t.t) / 0.2), 0, 1);
      g.globalAlpha = a;
      const y = h * 0.27;
      g.font = font(800, 30);
      g.lineWidth = 5; g.strokeStyle = "rgba(255,255,255,.75)"; g.strokeText(t.big, w / 2, y);
      g.fillStyle = "#16232e"; g.fillText(t.big, w / 2, y);
      if (t.small) {
        g.font = font(600, 13);
        g.lineWidth = 4; g.strokeText(t.small, w / 2, y + 28);
        g.fillStyle = "rgba(22,35,46,.85)"; g.fillText(t.small, w / 2, y + 28);
      }
      g.globalAlpha = 1;
    }

    if (this.fade > 0) { g.fillStyle = "rgba(10,14,20," + this.fade.toFixed(3) + ")"; g.fillRect(0, 0, w, h); }
    g.restore();
  },

  drawWind(g, w, font) {
    const W = this.W;
    if (!W || W.wind.speed < 0.2 || this.state === "ready") return;
    const fx = Math.sin(this.camYaw), fz = -Math.cos(this.camYaw), rx = Math.cos(this.camYaw), rz = Math.sin(this.camYaw);
    const fw = W.wind.x * fx + W.wind.z * fz, rw = W.wind.x * rx + W.wind.z * rz;
    const a = Math.atan2(rw, fw);               // 0 is a following wind, pointing up the screen
    const cx = 33, cy = 98;   // under the back button
    g.save();
    g.translate(cx, cy);
    g.fillStyle = "rgba(255,255,255,.55)";
    g.beginPath(); g.arc(0, 0, 17, 0, TAU); g.fill();
    g.rotate(a);
    g.strokeStyle = "#16232e"; g.fillStyle = "#16232e"; g.lineWidth = 2;
    g.beginPath(); g.moveTo(0, 10); g.lineTo(0, -6); g.stroke();
    g.beginPath(); g.moveTo(0, -11); g.lineTo(-5, -4); g.lineTo(5, -4); g.closePath(); g.fill();
    g.restore();
    g.font = font(700, 11); g.fillStyle = "rgba(22,35,46,.8)";
    g.fillText(W.wind.speed.toFixed(1) + " m/s", cx, cy + 27);
  },

  drawControls(g, w, h, cam, font) {
    const b = this.btn, pd = this.pad, d = DISCS[this.disc];
    const ink = "#16232e", glass = "rgba(255,255,255,.42)", rim = "rgba(255,255,255,.75)";

    // Launch reticle: where the disc is pointed, 25 m out.
    {
      const th = this.angle * DEG, L = this.lie;
      const x = L.x + Math.sin(this.yaw) * Math.cos(th) * 25, z = L.z - Math.cos(this.yaw) * Math.cos(th) * 25;
      const p = this.project(cam, x, L.y + HAND + Math.sin(th) * 25, z);
      if (p) {
        g.save(); g.translate(p.x, p.y); g.rotate(this.tilt * DEG);
        g.strokeStyle = "rgba(255,255,255,.9)"; g.lineWidth = 2;
        g.beginPath(); g.ellipse(0, 0, 13, 4, 0, 0, TAU); g.stroke();
        g.beginPath(); g.moveTo(-22, 0); g.lineTo(-16, 0); g.moveTo(16, 0); g.lineTo(22, 0); g.stroke();
        g.restore();
      }
    }

    // The angle pad: launch angle up and down, hyzer and anhyzer left and right.
    {
      g.fillStyle = glass; g.strokeStyle = rim; g.lineWidth = 1;
      roundRect(g, pd.x, pd.y, pd.w, pd.h, 16); g.fill(); g.stroke();
      const cx = pd.x + pd.w / 2, cy = pd.y + pd.h / 2 + 4;
      g.strokeStyle = "rgba(22,35,46,.25)";
      g.beginPath(); g.moveTo(pd.x + 10, cy); g.lineTo(pd.x + pd.w - 10, cy); g.stroke();
      const lift = -(this.angle / ANGLE_HI) * (pd.h * 0.32);
      g.save(); g.translate(cx, cy + lift); g.rotate(this.tilt * DEG);
      g.fillStyle = d.css;
      g.beginPath(); g.ellipse(0, 0, pd.w * 0.3, 5 + Math.abs(this.angle) * 0.12, 0, 0, TAU); g.fill();
      g.fillStyle = "rgba(0,0,0,.22)"; g.fillRect(-pd.w * 0.3, 1, pd.w * 0.6, 3);
      g.restore();
      // Which side is hyzer depends on which way it spins: the edge away from you goes down.
      const dir = this.spin < 0 ? -1 : 1;
      g.font = font(700, 9.5); g.fillStyle = "rgba(22,35,46,.7)";
      g.textAlign = "left";  g.fillText(dir > 0 ? "HYZER" : "ANHYZER", pd.x + 9, pd.y + pd.h - 11);
      g.textAlign = "right"; g.fillText(dir > 0 ? "ANHYZER" : "HYZER", pd.x + pd.w - 9, pd.y + pd.h - 11);
      g.textAlign = "center";
      g.font = font(700, 11); g.fillStyle = ink;
      const tl = Math.round(this.tilt);
      g.fillText(Math.round(this.angle) + "° · " + (tl === 0 ? "flat" : Math.abs(tl) + "° " + ((tl < 0) === (dir > 0) ? "hyzer" : "anhyzer")), cx, pd.y + 13);
    }

    // The throw button, its power ring, the pull track and the spin arc.
    {
      const pull = this.power;
      g.fillStyle = "rgba(255,255,255,.2)";
      roundRect(g, b.x - 4, b.y + b.r + 6, 8, b.pull, 4); g.fill();
      if (pull > 0) {
        g.fillStyle = pull > 0.92 ? "#e8452f" : "#ffcf33";
        roundRect(g, b.x - 4, b.y + b.r + 6, 8, b.pull * pull, 4); g.fill();
      }
      const by = b.y + pull * b.pull * 0.25;
      g.fillStyle = glass; g.strokeStyle = rim; g.lineWidth = 1.5;
      g.beginPath(); g.arc(b.x, by, b.r, 0, TAU); g.fill(); g.stroke();
      g.fillStyle = d.css;
      g.beginPath(); g.arc(b.x, by, b.r * 0.62, 0, TAU); g.fill();
      g.fillStyle = "rgba(255,255,255,.55)";
      g.beginPath(); g.arc(b.x, by, b.r * 0.2, 0, TAU); g.fill();
      if (pull > 0) {
        g.strokeStyle = "#ffcf33"; g.lineWidth = 5; g.lineCap = "round";
        g.beginPath(); g.arc(b.x, by, b.r + 5, -Math.PI / 2, -Math.PI / 2 + TAU * pull); g.stroke();
        g.font = font(800, 13); g.fillStyle = ink;
        g.textAlign = Settings.lefty ? "left" : "right";
        g.fillText(Math.round(pull * 100) + "%", b.x + (Settings.lefty ? 1 : -1) * (b.r + 12), by);
        g.textAlign = "center";
      } else {
        g.font = font(700, 10); g.fillStyle = "rgba(22,35,46,.7)";
        g.fillText("PULL ↓", b.x, b.y + b.r + 16 + b.pull / 2);
      }
      // Spin: an arc over the button, round the way it spins, as long as there is spin.
      const s = this.spin;
      const sy = by - b.r - 16;
      const lx = clamp(b.x, 50, w - 50);
      if (Math.abs(s) > 0.02) {
        g.strokeStyle = s > 0 ? "#4cc9f0" : "#c77dff"; g.lineWidth = 4; g.lineCap = "round";
        const span = Math.abs(s) * Math.PI * 0.9;
        g.beginPath();
        if (s > 0) g.arc(b.x, by, b.r + 13, -Math.PI / 2 - span / 2, -Math.PI / 2 + span / 2);
        else g.arc(b.x, by, b.r + 13, -Math.PI / 2 + span / 2, -Math.PI / 2 - span / 2, true);
        g.stroke();
        const end = -Math.PI / 2 + (s > 0 ? span / 2 : -span / 2);
        const ex = b.x + Math.cos(end) * (b.r + 13), ey = by + Math.sin(end) * (b.r + 13);
        g.save(); g.translate(ex, ey); g.rotate(end + (s > 0 ? Math.PI / 2 : -Math.PI / 2));
        g.fillStyle = g.strokeStyle;
        g.beginPath(); g.moveTo(6, 0); g.lineTo(-3, -5); g.lineTo(-3, 5); g.closePath(); g.fill();
        g.restore();
        g.font = font(700, 10); g.fillStyle = ink;
        g.fillText((s > 0 ? "↻ " : "↺ ") + Math.round(Math.abs(s) * 100) + "% spin", lx, sy - 14);
      } else {
        g.font = font(700, 10); g.fillStyle = "rgba(22,35,46,.7)";
        g.fillText("↔ SPIN", lx, sy);
      }
    }
  },

  // for checking the flight model from a console
  _airStep: airStep, _release: release, _buildWorld: buildWorld, _throwSpeed: throwSpeed,
  _DISCS: DISCS, _HOLES: HOLES, _S: S,
};

function roundRect(g, x, y, w, h, r) {
  g.beginPath();
  g.moveTo(x + r, y); g.lineTo(x + w - r, y); g.quadraticCurveTo(x + w, y, x + w, y + r);
  g.lineTo(x + w, y + h - r); g.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  g.lineTo(x + r, y + h); g.quadraticCurveTo(x, y + h, x, y + h - r);
  g.lineTo(x, y + r); g.quadraticCurveTo(x, y, x + r, y); g.closePath();
}

return game;
})();

];

const Home = {
  paint() {
    $("cards").innerHTML = GAMES.map((entry, i) => {
      const soon = entry.g.soon;
      return '<button class="card' + (soon ? " locked" : "") + '" data-i="' + i + '"' +
             (soon ? ' disabled' : '') + '>' +
        '<span class="art">' + ART[entry.art] + '</span>' +
        '<span><h2>' + entry.g.title +
          (soon ? '<span class="tag soon">Soon</span>' : '<span class="tag">Beta</span>') + '</h2>' +
          '<span class="meta">' + entry.fmt(Best.get(entry.g.id)) + '</span></span>' +
      '</button>';
    }).join("");

    $("cards").querySelectorAll(".card").forEach((el) => {
      el.addEventListener("click", () => {
        const entry = GAMES[Number(el.dataset.i)];
        if (entry.g.soon) return;
        Sound.wake();
        Engine.run(entry.g);
      });
    });
  },
};

// ── Settings wiring ──────────────────────────────────────────────────────────
function paintSeg(id, value) {
  $(id).querySelectorAll("button").forEach((b) => {
    b.setAttribute("aria-pressed", String(b.dataset.v === value));
  });
}
function paintSwitch(id, on) { $(id).setAttribute("aria-pressed", String(!!on)); }

function paintSettings() {
  paintSeg("ctrlSeg", Settings.controls);
  paintSeg("tiltSeg", Settings.tilt);
  paintSwitch("optSound", Settings.sound);
  paintSwitch("optHaptics", Settings.haptics);
  paintSwitch("optLefty", Settings.lefty);

  const needsPerm = typeof DeviceOrientationEvent !== "undefined" &&
                    typeof DeviceOrientationEvent.requestPermission === "function";
  $("tiltPerm").style.display = (Settings.controls === "tilt" && needsPerm && !Input.tiltSeen) ? "block" : "none";

  const noTilt = Settings.controls === "tilt" && !Input.tiltSeen;
  $("ctrlHint").textContent = noTilt
    ? "This device has not reported any tilt yet. Allow motion access, or steer another way."
    : "";
}

function wireSettings() {
  $("toSettings").addEventListener("click", () => { Router.show("settings"); paintSettings(); });
  $("settingsBack").addEventListener("click", () => Router.show("home"));

  $("ctrlSeg").addEventListener("click", (e) => {
    const b = e.target.closest("button[data-v]");
    if (!b) return;
    Settings.save("controls", b.dataset.v);
    paintSettings();
  });
  $("tiltSeg").addEventListener("click", (e) => {
    const b = e.target.closest("button[data-v]");
    if (!b) return;
    Settings.save("tilt", b.dataset.v);
    paintSettings();
  });

  $("tiltPerm").addEventListener("click", () => {
    if (typeof DeviceOrientationEvent !== "undefined" &&
        typeof DeviceOrientationEvent.requestPermission === "function") {
      DeviceOrientationEvent.requestPermission().then(() => {
        setTimeout(paintSettings, 400);
      }).catch(() => {});
    }
  });
  $("tiltZero").addEventListener("click", (e) => {
    Settings.save("tiltZero", Input.tiltAxis);
    e.target.textContent = "Centred";
    setTimeout(() => { e.target.textContent = "Recentre tilt"; }, 1200);
  });

  const toggle = (id, key) => $(id).addEventListener("click", () => {
    Settings.save(key, !Settings[key]);
    paintSwitch(id, Settings[key]);
    if (key === "sound" && Settings.sound) { Sound.wake(); Sound.blip(760, 0.09, "sine", 0.1); }
    if (key === "haptics" && Settings.haptics) buzz(18);
  });
  toggle("optSound", "sound");
  toggle("optHaptics", "haptics");
  toggle("optLefty", "lefty");

  $("wipe").addEventListener("click", (e) => {
    if (e.target.dataset.sure !== "1") {
      e.target.dataset.sure = "1";
      e.target.textContent = "Tap again to erase";
      setTimeout(() => { e.target.dataset.sure = ""; e.target.textContent = "Erase every best score"; }, 3500);
      return;
    }
    GAMES.forEach((entry) => Store.drop("best_" + entry.g.id));
    e.target.dataset.sure = "";
    e.target.textContent = "Gone";
    setTimeout(() => { e.target.textContent = "Erase every best score"; }, 1500);
  });

  $("quit").addEventListener("click", () => Router.show("home"));

  $("clubs").addEventListener("click", (e) => {
    const b = e.target.closest("button[data-c]");
    if (b && Engine.game && Engine.game.pickClub) Engine.game.pickClub(Number(b.dataset.c));
  });
}
