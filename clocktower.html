<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0710">
<title>Midnight Clocktower</title>
<meta name="description" content="A fan-made Storyteller kit for Blood on the Clocktower. Everyone plays on their phone in the same room.">
<link rel="icon" href="clocktower-icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="clocktower-icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=Pirata+One&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js" defer onload="try { render(); } catch (e) {}"></script>
<style>
  :root {
    color-scheme: dark;
    --bg: #0a0710; --bg2: #160d1c; --panel: rgba(30, 18, 36, .9); --panel2: rgba(48, 28, 52, .92);
    --line: rgba(236, 226, 204, .14); --line2: rgba(236, 226, 204, .28);
    --bone: #ece2cc; --bone2: #c4b8a0; --muted: #8f8474;
    --blood: #a8101c; --blood2: #e2333f; --ember: #ef7c2e; --gold: #dcae52;
    --good: #5f9fe6; --out: #57c7cf; --minion: #ef6a3c; --demon: #d1182a; --trav: #b591e8;
    --glow: rgba(239, 124, 46, .35);
    --r: 14px;
  }
  * { box-sizing: border-box; min-width: 0; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; }
  body {
    min-height: 100vh; min-height: 100dvh; color: var(--bone);
    background: radial-gradient(120% 70% at 50% -10%, #3a1730 0%, #1a0d1e 45%, var(--bg) 80%) fixed, var(--bg);
    font: 17px/1.45 "IM Fell English", Georgia, serif;
    -webkit-font-smoothing: antialiased; overflow-x: hidden;
    transition: background 1.2s;
  }
  body.night { background: radial-gradient(120% 70% at 70% -10%, #1b2448 0%, #0e1022 50%, #05050b 85%) fixed, #05050b; }
  body.day { background: radial-gradient(120% 70% at 30% -10%, #5a2a16 0%, #2a1416 45%, var(--bg) 85%) fixed, var(--bg); }
  h1, h2, h3, .gothic { font-family: "Pirata One", "IM Fell English", serif; font-weight: 400; letter-spacing: .02em; }
  h1 { font-size: 2.6rem; line-height: 1; margin: 0; }
  h2 { font-size: 1.7rem; margin: 0 0 8px; color: var(--gold); }
  h3 { font-size: 1.3rem; margin: 14px 0 6px; color: var(--bone); }
  p { margin: 0 0 10px; }
  a { color: var(--ember); }
  small, .small { font-size: .82rem; color: var(--bone2); }
  .muted { color: var(--muted); }
  .center { text-align: center; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .row.nowrap { flex-wrap: nowrap; }
  .grow { flex: 1; }
  .stack > * + * { margin-top: 10px; }
  .wrap { max-width: 720px; margin: 0 auto; padding: 14px 16px 120px; position: relative; z-index: 2; }

  /* ---- atmosphere ---- */
  .fog { position: fixed; inset: -20% -50%; pointer-events: none; z-index: 0; opacity: .5;
    background: radial-gradient(40% 18% at 20% 70%, rgba(200,190,220,.10), transparent 70%),
                radial-gradient(35% 14% at 70% 80%, rgba(200,190,220,.08), transparent 70%),
                radial-gradient(30% 12% at 45% 95%, rgba(220,210,230,.10), transparent 70%);
    animation: drift 46s linear infinite alternate; }
  .fog.two { animation-duration: 70s; animation-direction: alternate-reverse; opacity: .35; top: -10%; }
  @keyframes drift { from { transform: translateX(-8%); } to { transform: translateX(8%); } }
  .vignette { position: fixed; inset: 0; pointer-events: none; z-index: 1;
    background: radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,.65) 100%);
    animation: flicker 5s infinite; }
  @keyframes flicker { 0%,100% { opacity: 1; } 40% { opacity: .9; } 42% { opacity: 1; } 70% { opacity: .94; } 72% { opacity: 1; } }
  .moon { position: fixed; right: 7%; top: 70px; width: 90px; height: 90px; border-radius: 50%; pointer-events: none; z-index: 0;
    background: radial-gradient(circle at 38% 38%, #fffbe8, #e8dcae 55%, #b8a878 100%);
    box-shadow: 0 0 60px 20px rgba(240,230,190,.18); opacity: 0; transition: opacity 2s; }
  .moon::after { content: ""; position: absolute; inset: 0; border-radius: 50%;
    background: radial-gradient(circle at 62% 60%, rgba(120,100,70,.25) 0 8%, transparent 9%), radial-gradient(circle at 35% 70%, rgba(120,100,70,.2) 0 6%, transparent 7%), radial-gradient(circle at 55% 30%, rgba(120,100,70,.18) 0 5%, transparent 6%); }
  body.night .moon, body.home .moon { opacity: .9; }
  .bat { position: fixed; z-index: 1; pointer-events: none; width: 42px; height: 20px; }
  .bat svg { width: 100%; height: 100%; fill: #050307; animation: flap .22s ease-in-out infinite alternate; transform-origin: center; }
  @keyframes flap { from { transform: scaleY(1); } to { transform: scaleY(.35); } }
  @media (prefers-reduced-motion: reduce) {
    .fog, .vignette, .bat svg { animation: none; } .bat { display: none; }
  }

  /* ---- controls ---- */
  button { font: inherit; color: inherit; cursor: pointer; }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    border: 1px solid var(--line2); background: linear-gradient(#2c1a30, #1d1020); color: var(--bone);
    border-radius: 12px; padding: 10px 16px; min-height: 44px; font-size: 1rem; text-decoration: none;
    box-shadow: inset 0 1px 0 rgba(255,255,255,.06), 0 2px 8px rgba(0,0,0,.4); }
  .btn:hover { border-color: var(--ember); }
  .btn:active { transform: translateY(1px); }
  .btn:disabled { opacity: .4; cursor: default; }
  .btn.red { background: linear-gradient(#b5151f, #6e0a12); border-color: #e2333f; color: #fff2e6; box-shadow: 0 0 18px rgba(200,20,30,.35), inset 0 1px 0 rgba(255,255,255,.18); }
  .btn.ember { background: linear-gradient(#f08a3c, #a6451a); border-color: #ffb070; color: #1a0a04; font-weight: 700; }
  .btn.ghost { background: transparent; box-shadow: none; }
  .btn.small { min-height: 34px; padding: 5px 10px; font-size: .9rem; border-radius: 10px; }
  .btn.big { min-height: 58px; font-size: 1.25rem; padding: 12px 22px; font-family: "Pirata One", serif; letter-spacing: .04em; }
  .btn.wide { width: 100%; }
  .btn.on { border-color: var(--gold); box-shadow: 0 0 0 2px rgba(220,174,82,.35); }
  input[type=text], input[type=number], textarea, select {
    font: inherit; color: var(--bone); background: rgba(0,0,0,.35); border: 1px solid var(--line2);
    border-radius: 10px; padding: 10px 12px; min-height: 44px; width: 100%; }
  select { appearance: none; background-image: linear-gradient(45deg, transparent 50%, var(--bone2) 50%), linear-gradient(135deg, var(--bone2) 50%, transparent 50%);
    background-position: calc(100% - 18px) 50%, calc(100% - 12px) 50%; background-size: 6px 6px; background-repeat: no-repeat; padding-right: 30px; }
  select option, select optgroup { background: #1d1020; color: var(--bone); }
  textarea { min-height: 90px; resize: vertical; }
  input:focus, textarea:focus, select:focus { outline: 2px solid var(--ember); outline-offset: 1px; }
  label.check { display: inline-flex; gap: 8px; align-items: center; }
  .code-in { font-family: "Pirata One", serif; font-size: 2rem; letter-spacing: .4em; text-align: center; text-transform: uppercase; }

  .card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; margin: 12px 0;
    box-shadow: 0 8px 30px rgba(0,0,0,.45); backdrop-filter: blur(3px); }
  .card.parch { background: linear-gradient(160deg, #efe3c4, #d8c49a); color: #2a1a10; border-color: #8b6a3a; }
  .card.parch h2, .card.parch h3 { color: #6e0a12; }
  .card.parch .small, .card.parch small { color: #5a4630; }
  .pill { display: inline-flex; align-items: center; gap: 4px; padding: 2px 9px; border-radius: 999px; font-size: .78rem;
    border: 1px solid var(--line2); background: rgba(0,0,0,.3); white-space: nowrap; }
  .pill.x { cursor: pointer; }
  .pill.good { border-color: var(--good); color: var(--good); }
  .pill.evil { border-color: var(--demon); color: #ff8088; }
  .pill.warn { border-color: var(--ember); color: var(--ember); }
  .t-townsfolk { color: var(--good); } .t-outsider { color: var(--out); } .t-minion { color: var(--minion); } .t-demon { color: #ff4d5b; } .t-traveller { color: var(--trav); }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { border: 1px solid var(--line2); background: rgba(0,0,0,.3); border-radius: 999px; padding: 6px 12px; min-height: 36px; font-size: .92rem; }
  .chip.on { border-color: var(--gold); background: rgba(220,174,82,.18); color: #ffe7b0; }
  .chip.dead { opacity: .55; text-decoration: line-through; }
  .chip:disabled { opacity: .35; }

  /* ---- title ---- */
  .title { text-align: center; padding: 26px 0 8px; }
  .title h1 { font-size: clamp(2.6rem, 11vw, 4.2rem); color: #e23a44;
    text-shadow: 0 0 22px rgba(226,58,68,.55), 0 3px 0 #3a0508; }
  .title .sub { color: var(--bone2); font-style: italic; margin-top: 6px; }
  .tower { width: 150px; height: 190px; display: block; margin: 0 auto; filter: drop-shadow(0 0 24px rgba(239,124,46,.25)); }
  .tower .face { animation: glow 4s ease-in-out infinite; }
  @keyframes glow { 50% { opacity: .75; } }

  /* ---- bars ---- */
  .bar { position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: 8px; padding: 8px 12px;
    padding-top: max(8px, env(safe-area-inset-top)); background: rgba(10,6,14,.88); border-bottom: 1px solid var(--line); backdrop-filter: blur(8px); }
  .bar .ph { font-family: "Pirata One", serif; font-size: 1.35rem; color: var(--gold); flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .bar .code { font-family: "Pirata One", serif; letter-spacing: .2em; border: 1px solid var(--line2); border-radius: 8px; padding: 2px 8px; }
  .ibtn { width: 42px; height: 42px; border-radius: 10px; border: 1px solid var(--line); background: rgba(0,0,0,.3); font-size: 1.2rem; display: inline-flex; align-items: center; justify-content: center; position: relative; }
  .ibtn.on { border-color: var(--ember); box-shadow: 0 0 12px var(--glow); }
  .badge { position: absolute; top: -5px; right: -5px; background: var(--blood2); color: #fff; font: 700 .7rem/1 system-ui, sans-serif; border-radius: 999px; padding: 3px 6px; }
  .tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; display: flex; background: rgba(10,6,14,.94); border-top: 1px solid var(--line);
    padding-bottom: env(safe-area-inset-bottom); backdrop-filter: blur(8px); }
  .tabs button { flex: 1; border: 0; background: none; padding: 9px 4px 10px; color: var(--muted); font-size: .8rem; position: relative; }
  .tabs button b { display: block; font-size: 1.35rem; font-weight: 400; line-height: 1.1; }
  .tabs button.on { color: var(--gold); }
  .tabs .badge { top: 3px; right: calc(50% - 22px); }

  /* ---- tokens and the town circle ---- */
  .circle { position: relative; width: 100%; max-width: 560px; aspect-ratio: 1; margin: 6px auto 10px; }
  .circle::before { content: ""; position: absolute; inset: 11%; border-radius: 50%; border: 1px dashed rgba(236,226,204,.12);
    background: radial-gradient(circle, rgba(239,124,46,.07), transparent 70%); }
  .circle .mid { position: absolute; inset: 24%; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 4px; }
  .seat { position: absolute; display: flex; flex-direction: column; align-items: center; background: none; border: 0; padding: 0; }
  .tok { width: 100%; aspect-ratio: 1; border-radius: 50%; display: flex; align-items: center; justify-content: center; position: relative;
    background: radial-gradient(circle at 40% 35%, #f3e6c6, #cdb586 70%, #9c7f4c); box-shadow: 0 3px 10px rgba(0,0,0,.6), inset 0 -3px 6px rgba(0,0,0,.25);
    border: 2px solid #6d5430; font-size: 1.6em; line-height: 1; }
  .tok.townsfolk { border-color: var(--good); } .tok.outsider { border-color: var(--out); } .tok.minion { border-color: var(--minion); } .tok.demon { border-color: var(--demon); box-shadow: 0 0 14px rgba(209,24,42,.6); } .tok.traveller { border-color: var(--trav); }
  .tok.blank { background: radial-gradient(circle at 40% 35%, #3a2a3c, #1e1420); border-color: var(--line2); color: var(--bone2); font-family: "Pirata One", serif; }
  .tok.me { box-shadow: 0 0 0 3px var(--gold), 0 0 18px rgba(220,174,82,.6); }
  .tok.hand { box-shadow: 0 0 0 3px #ffe08a, 0 0 22px rgba(255,224,138,.8); }
  .tok.clock { outline: 3px solid var(--blood2); outline-offset: 3px; }
  .seat.dead .tok { filter: grayscale(.9) brightness(.55); }
  .seat.dead .tok::after { content: ""; position: absolute; left: 6%; right: 6%; top: 42%; height: 18%; background: #0b0b0b; border-radius: 3px; transform: rotate(-18deg); opacity: .85; }
  .seat .nm { position: relative; z-index: 3; margin-top: 3px; font-size: .78em; background: rgba(0,0,0,.65); padding: 1px 7px; border-radius: 6px; max-width: 120%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--bone); }
  .seat .gv { position: absolute; top: -4%; right: -6%; width: 30%; aspect-ratio: 1; border-radius: 50%; background: #f4f0e6; border: 2px solid #333; font-size: .5em; display: flex; align-items: center; justify-content: center; }
  .seat .rm { position: absolute; bottom: 22%; left: -10%; display: flex; gap: 2px; }
  .seat .rm i { width: 9px; height: 9px; border-radius: 50%; background: var(--ember); border: 1px solid #000; }
  .seat .rm i.pz { background: #66d16a; } .seat .rm i.dr { background: #b58be6; } .seat .rm i.dd { background: #111; }
  .seat .guess { position: absolute; top: -8%; left: -8%; width: 40%; aspect-ratio: 1; border-radius: 50%; background: #2a1c30; border: 1px solid var(--line2); display: flex; align-items: center; justify-content: center; font-size: .5em; }
  .seat .off { position: absolute; top: 2%; left: 2%; width: 12px; height: 12px; border-radius: 50%; background: #555; border: 2px solid #000; }
  .seat .off.on { background: #58d36a; }

  .role { display: flex; gap: 12px; align-items: flex-start; padding: 10px 0; border-bottom: 1px solid var(--line); }
  .role:last-child { border-bottom: 0; }
  .role .tok { width: 50px; flex: none; font-size: 1.6rem; }
  .role b { font-family: "Pirata One", serif; font-weight: 400; font-size: 1.2rem; }
  .roles-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 8px; }
  .rpick { border: 1px solid var(--line); background: rgba(0,0,0,.25); border-radius: 12px; padding: 8px 4px; display: flex; flex-direction: column; align-items: center; gap: 4px; text-align: center; font-size: .82rem; }
  .rpick .tok { width: 48px; font-size: 1.45rem; }
  .rpick.on { border-color: var(--gold); background: rgba(220,174,82,.16); box-shadow: 0 0 12px rgba(220,174,82,.3); }

  /* ---- sheets and overlays ---- */
  .sheet-bg { position: fixed; inset: 0; z-index: 40; background: rgba(0,0,0,.6); display: flex; align-items: flex-end; justify-content: center; }
  .sheet { width: 100%; max-width: 640px; max-height: 92vh; max-height: 92dvh; overflow: auto; background: linear-gradient(#22142a, #140b18);
    border: 1px solid var(--line2); border-bottom: 0; border-radius: 20px 20px 0 0; padding: 18px 16px calc(24px + env(safe-area-inset-bottom)); }
  .sheet .x { float: right; }
  @keyframes rise { from { transform: translateY(30px); opacity: 0; } }
  @keyframes fade { from { opacity: 0; } }
  .over { position: fixed; inset: 0; z-index: 35; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px 18px;
    text-align: center; background: radial-gradient(circle at 50% 30%, #1a1f3c, #05050b 70%); overflow: auto; }
  .over.red { background: radial-gradient(circle at 50% 30%, #4a0a12, #0b0306 70%); }
  .over h2 { font-size: 2.2rem; }
  .over .inner { width: 100%; max-width: 480px; }
  .toast { position: fixed; left: 50%; bottom: 92px; transform: translateX(-50%); z-index: 60; background: #2b1a2f; border: 1px solid var(--ember); color: var(--bone);
    padding: 10px 16px; border-radius: 12px; box-shadow: 0 6px 24px rgba(0,0,0,.6); max-width: 90vw; text-align: center; animation: rise .2s; }
  .cover { position: fixed; inset: 0; z-index: 50; background: #050307; display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 14px; }

  .info { text-align: center; }
  .info .say { font-style: italic; font-size: 1.05rem; margin-bottom: 8px; }
  .info .num { font-family: "Pirata One", serif; font-size: 5rem; line-height: 1; color: #6e0a12; }
  .info .yn { font-family: "Pirata One", serif; font-size: 3.4rem; line-height: 1; }
  .info .toks { display: flex; justify-content: center; flex-wrap: wrap; gap: 14px; margin: 10px 0; }
  .info .toks > div { width: 86px; display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: .9rem; }
  .info .toks .tok { width: 72px; font-size: 2rem; }
  .info .pname { font-family: "Pirata One", serif; font-size: 1.5rem; background: rgba(0,0,0,.08); border: 1px solid rgba(0,0,0,.2); padding: 2px 12px; border-radius: 10px; }

  .hold { user-select: none; -webkit-user-select: none; touch-action: manipulation; }
  .charcard { text-align: center; padding: 22px 16px; }
  .charcard .tok { width: 130px; margin: 0 auto 10px; font-size: 4.2rem; }
  .charcard .nm { font-family: "Pirata One", serif; font-size: 2.3rem; line-height: 1.05; }
  .facedown { height: 290px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; border-radius: var(--r);
    background: repeating-linear-gradient(45deg, #2a1220 0 12px, #22101b 12px 24px); border: 2px solid #5a2a3a; color: var(--bone2); }
  .facedown .eye { font-size: 3.4rem; }

  .steps { display: flex; gap: 6px; overflow-x: auto; padding: 4px 2px 10px; scrollbar-width: thin; }
  .steps button { flex: none; border: 1px solid var(--line); background: rgba(0,0,0,.3); border-radius: 10px; padding: 6px 9px; font-size: .8rem; display: flex; flex-direction: column; align-items: center; min-width: 64px; }
  .steps button b { font-size: 1.3rem; font-weight: 400; }
  .steps button.on { border-color: var(--gold); background: rgba(220,174,82,.15); }
  .steps button.done { opacity: .5; }
  .sticky-foot { position: sticky; bottom: 70px; z-index: 5; display: flex; gap: 8px; margin-top: 12px; }
  .sticky-foot .btn { flex: 1; }
  .seatrow { display: flex; align-items: center; gap: 8px; padding: 8px 0; border-bottom: 1px solid var(--line); }
  .seatrow .tok { width: 40px; flex: none; font-size: 1.2rem; }
  .dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; background: #555; }
  .dot.on { background: #58d36a; }
  .timer { font-family: "Pirata One", serif; font-size: 2rem; color: var(--ember); text-align: center; }
  .handbtn { width: 170px; height: 170px; border-radius: 50%; font-size: 4rem; border: 3px solid var(--line2); background: radial-gradient(circle, #2c1a30, #120a15); margin: 8px auto; display: flex; align-items: center; justify-content: center; flex-direction: column; }
  .handbtn span { font-size: 1rem; font-family: "Pirata One", serif; }
  .handbtn.up { border-color: #ffe08a; box-shadow: 0 0 30px rgba(255,224,138,.6); background: radial-gradient(circle, #6b4a10, #2a1a05); }
  .handbtn:disabled { opacity: .5; }
  details { border: 1px solid var(--line); border-radius: 12px; padding: 8px 12px; margin: 8px 0; background: rgba(0,0,0,.2); }
  details summary { cursor: pointer; font-family: "Pirata One", serif; font-size: 1.2rem; color: var(--gold); }
  table.counts { width: 100%; border-collapse: collapse; font-size: .9rem; }
  table.counts td, table.counts th { border: 1px solid var(--line); padding: 4px; text-align: center; }
  .guide { border: 1px dashed var(--gold); background: rgba(220,174,82,.08); border-radius: var(--r); padding: 4px 14px; margin: 12px 0; }
  .guide > summary { color: var(--gold); font-family: "Pirata One", serif; font-size: 1.2rem; padding: 8px 0; }
  .guide ol { margin: 4px 0 10px; padding-left: 22px; } .guide li { margin: 4px 0; }
  .guide p { margin: 6px 0 10px; }
  .aloud { border-left: 3px solid var(--ember); padding: 4px 0 4px 12px; margin: 8px 0 12px; font-style: italic; font-size: 1.05rem; }
  .aloud::before { content: "Say out loud"; display: block; font-style: normal; font-size: .75rem; color: var(--ember); letter-spacing: .08em; text-transform: uppercase; }
  .qr { background: #fff; border-radius: 12px; padding: 8px; width: 190px; margin: 12px auto 4px; cursor: zoom-in; }
  .qr svg { display: block; width: 100%; height: auto; }
  .qrbig { position: fixed; inset: 0; z-index: 60; background: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; color: #111; cursor: zoom-out; padding: 16px; }
  .qrbig svg { width: min(86vw, 70vh); height: auto; }
  .warnbox { border: 1px solid var(--ember); background: rgba(239,124,46,.1); border-radius: 10px; padding: 8px 12px; font-size: .92rem; }
  .truth { border: 1px solid var(--good); background: rgba(95,159,230,.1); border-radius: 10px; padding: 8px 12px; }
  .ann { font-family: "Pirata One", serif; font-size: 1.9rem; line-height: 1.2; color: var(--bone); }
</style>
</head>
<body class="home">
<div class="fog"></div><div class="fog two"></div><div class="moon"></div><div class="vignette"></div>
<div id="app"></div>
<div id="toast"></div>
<script>
// ============================================================================

  const S = G.seats, v = G.vote, opts = (sel, f) => S.map((s, j) => (f && !f(s, j)) ? '' : '<option value="' + j + '"' + (j === sel ? ' selected' : '') + '>' + esc(s.name) + (s.alive ? '' : ' ☠') + '</option>').join('');
  let h = '<div class="card center"><h2>☀️ Day ' + G.day + '</h2><p>' + living(G) + ' alive. ' + needed(G) + ' votes to execute.</p>' + timerHTML(G.timer) +
    '<div class="row" style="justify-content:center;margin-top:6px">' + [2, 5, 8].map(m => '<button class="btn small" onclick="ST.timer(' + m + ')">⏳ ' + m + ' min</button>').join('') + (G.timer ? '<button class="btn small" onclick="ST.timer(0)">Stop</button>' : '') + '</div></div>';
  if (v) {
    const order = voteOrder(G, v.on), cnt = order.filter(j => v.locked[j]).length;
    h += '<div class="card"><h2>🗳️ ' + esc(S[v.on].name) + (v.exile ? ' faces exile' : ' is on trial') + '</h2><p class="small">Nominated by ' + esc(S[v.by].name) + '. ' + v.need + ' votes needed.' + (v.exile ? ' Everyone may vote, the dead too, at no cost.' : '') + '</p>' +
      circleHTML(grimItems().map((it, j) => Object.assign(it, { icon: v.locked[j] != null ? (v.locked[j] ? '✋' : '·') : v.hands[j] ? '✋' : it.icon })), j => 'ST.hand(' + j + ')',
        '<div class="gothic" style="font-size:2.6rem;color:var(--gold)">' + (v.done ? v.count : cnt) + '</div><div class="small">of ' + v.need + ' needed</div>') +
      '<p class="small center">Tap a seat to raise or lower a hand for someone without a phone.</p>';
    if (!v.done) h += '<div class="row"><button class="btn ember grow" onclick="ST.voteRun()" ' + (v.running ? 'disabled' : '') + '>🕰️ ' + (v.running ? 'The hand is moving…' : 'Start the clock') + '</button><button class="btn" onclick="ST.voteNow()">Count now</button><button class="btn ghost" onclick="ST.voteCancel()">Cancel</button></div>' +
      '<div class="row" style="margin-top:6px"><span class="small">Hand speed</span>' + [[2500, 'slow'], [1500, 'normal'], [800, 'quick']].map(([ms, l]) => '<button class="chip' + (UI.voteMs === ms ? ' on' : '') + '" onclick="UI.voteMs=' + ms + ';render()">' + l + '</button>').join('') + '</div>';
    else h += '<div class="center"><div class="row" style="justify-content:center"><button class="btn" onclick="ST.voteAdj(-1)">−1</button><span class="gothic" style="font-size:2rem">' + v.count + ' votes</span><button class="btn" onclick="ST.voteAdj(1)">+1</button></div>' +
      '<p class="small">Adjust for a Bureaucrat, a Thief, a Butler and so on.</p><button class="btn red big wide" onclick="ST.voteRecord()">Record the vote</button></div>';
    h += '</div>';
  } else {
    if (G.reqs.length) h += '<div class="card"><h3>Nominations from phones</h3>' + G.reqs.map((r, k) => '<div class="seatrow"><span class="grow">' + esc(S[r.by].name) + ' nominates <b>' + esc(S[r.on].name) + '</b></span><button class="btn small ember" onclick="ST.reqOK(' + k + ')">Accept</button><button class="btn small" onclick="ST.reqNo(' + k + ')">✕</button></div>').join('') + '</div>';
    h += '<div class="card"><h3>Nominate</h3><div class="row nowrap"><select id="nby" class="grow" data-keep>' + opts(null) + '</select><span>→</span><select id="non" class="grow" data-keep>' + opts(null) + '</select></div>' +
      '<label class="check small" style="margin-top:6px"><input type="checkbox" id="nexile"> A Traveller’s exile</label><button class="btn ember wide" style="margin-top:8px" onclick="ST.nominate()">Open the nomination</button>' +
      '<p class="small" style="margin-top:6px">Each living player may nominate once a day, and each player may be nominated once a day.</p></div>';
  }
  const noms = G.noms.filter(n => n.day === G.day);
  if (noms.length) h += '<div class="card"><h3>Today’s votes</h3>' + noms.map(n => '<div class="small">' + esc(S[n.by].name) + ' → ' + esc(S[n.on].name) + ': <b>' + n.count + '</b> of ' + n.need + (n.exile ? ' (exile)' : '') + '</div>').join('') + '</div>';
  const b = G.block;
  h += '<div class="card center"><h3>The block</h3>' + (b && b.seat != null ? '<p class="ann">' + esc(S[b.seat].name) + ' is about to die, with ' + b.count + ' votes.</p>' : b ? '<p>A tie at ' + b.count + '. Nobody is about to die.</p>' : '<p class="muted">Nobody is about to die.</p>');
  if (G.lastExec && G.lastExec.day === G.day) h += '<p>' + esc(S[G.lastExec.seat].name) + ' was executed today.</p>';
  else if (b && b.seat != null) h += '<label class="check"><input type="checkbox" id="xdie" checked> They die (untick for a Fool, a Zombuul and so on)</label><button class="btn red big wide" style="margin-top:8px" onclick="ST.execute()">⚔️ Execute ' + esc(S[b.seat].name) + '</button>';
  h += '<button class="btn big wide" style="margin-top:10px" onclick="ST.dusk()">🌒 End the day · Night ' + (G.night + 1) + '</button></div>';
  h += '<div class="card"><h3>Tell everyone</h3><textarea id="anntext" placeholder="For example: the Slayer’s shot does nothing."></textarea><button class="btn wide" style="margin-top:6px" onclick="ST.announce()">Show it on every phone</button></div>';
  h += '<div class="card center"><h3>The game ends</h3><div class="row" style="justify-content:center"><button class="btn" style="border-color:var(--good)" onclick="ST.win(\'good\')">😇 Good wins</button><button class="btn red" onclick="ST.win(\'evil\')">😈 Evil wins</button></div></div>';
  return h;
}
function overHTML() {
  return '<div class="card center"><h2>' + (G.winner === 'good' ? '😇 Good wins' : '😈 Evil wins') + '</h2><p>Every phone now shows the whole Grimoire.</p>' +
    '<button class="btn big ember wide" onclick="ST.again()">Play again with the same town</button><p></p><button class="btn ghost" onclick="ST.unwin()">Oops, the game is not over</button></div>' +
    '<div class="card">' + G.log.slice(-80).map(l => '<div class="small">' + esc((l.ph === 'night' ? 'N' + l.n : 'D' + l.d) + ' · ' + l.t) + '</div>').join('') + '</div>';

    (x.kind === 'whisper' ? '<button class="btn small" style="margin-top:6px" onclick="ST.openSeat(' + x.from + ')">Reply…</button>' : '') + '</div>').join('');

}
function menuSheet() {
  return '<button class="btn small x" onclick="UI.sheet=null;render()">Close</button><h2>Storyteller</h2>' +
    '<p class="small">Game ' + G.code + ' · ' + SCRIPTS[G.script].name + '</p>' +

// ---- the Storyteller's handbook --------------------------------------------
function bookHTML(script, st) {
  const roles = scriptRoles(script), trav = scriptTravellers(script);
  let h = '<h2>' + (st ? 'Storyteller’s handbook' : 'The characters') + '</h2><p class="small">' + SCRIPTS[script].name + '. ' + SCRIPTS[script].blurb + '</p>';
  if (st) h += RULES_ST;
  else h += RULES_PLAYER;
  ['townsfolk', 'outsider', 'minion', 'demon'].forEach(t => {
    h += '<details' + (st ? '' : ' open') + '><summary class="t-' + t + '">' + TYPENAME[t] + '</summary>' + roles.filter(r => r.type === t).map(r => roleLine(r.id) +
      (st && (r.f || r.o || r.setup || r.tip) ? '<div class="small" style="margin:-4px 0 10px 62px">' + (r.setup ? '<div>⚙️ Setup: ' + esc(r.setup) + '</div>' : '') + (r.f ? '<div>🌒 First night: ' + esc(r.f) + '</div>' : '') + (r.o ? '<div>🌙 Other nights: ' + esc(r.o) + '</div>' : '') + (r.tip ? '<div>💡 ' + esc(r.tip) + '</div>' : '') + '</div>' : '')).join('') + '</details>';
  });
  h += '<details><summary class="t-traveller">Travellers</summary><p class="small">People who arrive late or leave early. Their character is public. Their alignment is secret.</p>' + trav.map(r => roleLine(r.id)).join('') + '</details>';
  if (st) {
    const ord = (list) => list.filter(id => STEP[id] || (ROLES[id] && (script === 'all' || ROLES[id].ed === script))).map(id => (ROLES[id] || STEP[id]).icon + ' ' + esc((ROLES[id] || STEP[id]).name)).join(' → ');
    h += '<details><summary>Night order</summary><h3>First night</h3><p class="small">' + ord(FIRST) + '</p><h3>Other nights</h3><p class="small">' + ord(OTHER) + '</p></details>';
    h += '<details><summary>Setup table</summary><table class="counts"><tr><th>Players</th>' + Object.keys(COUNTS).map(n => '<th>' + n + '</th>').join('') + '</tr>' +
      ['Townsfolk', 'Outsiders', 'Minions', 'Demons'].map((l, i) => '<tr><td>' + l + '</td>' + Object.keys(COUNTS).map(n => '<td>' + COUNTS[n][i] + '</td>').join('') + '</tr>').join('') + '</table><p class="small">Up to 5 Travellers on top, for a town of 20.</p></details>';
  }
  return h;
}
const RULES_PLAYER = '<details><summary>How to play</summary>' +
  '<p>The town has a Demon in it. Each night, it kills. You are either <b class="t-townsfolk">good</b> or <b class="t-demon">evil</b>.</p>' +
  '<p><b>Good wins</b> when the Demon dies. <b>Evil wins</b> when only two players are left alive.</p>' +
  '<p><b>At night</b>, close your eyes and put your phone face down. If the Storyteller taps you, look at your phone. It shows what you choose or what you learn.</p>' +
  '<p><b>By day</b>, talk. Lie if you like. Whisper in corners. Then nominate. Each living player may nominate once a day, and each player may be nominated once.</p>' +
  '<p><b>Voting</b>: a clock hand goes round the circle. Raise your hand on your phone before the hand reaches you. A player with votes from at least half the living, and more than anyone else today, is executed at the end of the day.</p>' +
  '<p><b>The dead</b> keep talking and still win with their team. A dead player has one ghost vote 👻 for the rest of the game.</p>' +
  '<p><b>Drunk or poisoned</b> players have no ability, but they do not know it. What they learn may be wrong.</p></details>';
const RULES_ST = '<details><summary>Running a game</summary>' +
  '<h3>Before you start</h3><p>Put the names in seat order in the lobby. Choose a story. Fill the bag, or press Random. Deal, check the deal, and choose the Demon’s bluffs. Begin the first night.</p>' +
  '<h3>Each night</h3><p>Work down the night list. For each character, read the instruction. Press <i>Wake on their phone</i> and tap that player’s shoulder. Their phone shows a question. Their answer appears on your screen. Then build what they learn and send it. The blue box shows the true answer. Give a false one if they are drunk or poisoned, or if you want to.</p>' +
  '<p>Mark deaths with <i>Dies</i>. At dawn, the phones show who died.</p>' +
  '<h3>Each day</h3><p>Let people talk. Start a timer if you like. Then open nominations. A nomination can come from a phone, or you can enter it. Start the clock: the hand moves seat by seat, and each hand locks as the clock passes. Record the vote. A player is about to die if they have at least half the living players’ votes and more than anyone else. A tie means nobody.</p>' +
  '<p>Execute at the end of the day, or nobody. Then end the day.</p>' +
  '<h3>Being a good Storyteller</h3><p>Your job is a close, fun game, not a fair one. Give the good team true info early and lean on drunkenness and poison later. If evil is far ahead, help good. If good is far ahead, help evil. Keep things moving. A day should not drag past ten minutes.</p>' +
  '<h3>Death</h3><p>Dead players lose their ability, keep talking, and may vote once more with their ghost vote. They cannot nominate.</p>' +
  '<h3>Drunk and poisoned</h3><p>Their ability does nothing, but they must not know. Wake them as usual. Give them info that may be false.</p>' +
  '<h3>Registering</h3><p>The Recluse and the Spy may read as another alignment or character. You decide each time.</p>' +
  '<h3>Travellers</h3><p>Late arrivals and early leavers. Their character is public, you choose their alignment. They can be exiled any number of times a day: everyone may vote, the dead too, at no cost.</p>' +
  '<h3>Winning</h3><p>Good wins when the Demon dies. Evil wins when just two players live, not counting Travellers. Some characters change this: the Saint, the Mayor, the Mastermind, the Evil Twin, the Klutz, the Vortox.</p></details>';

// ============================================================================
// The first-game guide. It says what to do now, step by step, on both sides.
// The Storyteller can turn it off in the lobby or the menu.
// ============================================================================
const guideOn = () => G && G.guide !== false;
const sayHTML = t => '<div class="aloud">' + t + '</div>';
function guideBox(title, steps, after) {
  return '<details class="guide"' + (UI.guideMin ? '' : ' open') + '><summary onclick="UI.guideMin=!UI.guideMin">🕯️ ' + title + '</summary>' +
    (steps.length ? '<ol>' + steps.map(s => '<li>' + s + '</li>').join('') + '</ol>' : '') + (after || '') + '</details>';
}
const SAY_INTRO = 'Welcome to the town. A Demon hides among us, and every night it kills. Most of you are good. A few of you are evil: the Demon and its Minions. ' +
  'Good wins if we execute the Demon. Evil wins if only two players are left alive. ' +
  'Each of you gets a secret character with an ability. Good players use theirs to find the Demon. Evil players know each other, and they lie. ' +
  'At night, I wake some of you, one at a time. By day, we talk, nominate and vote. The dead can still talk, and they get one last vote. ' +
  'You may say anything, and you may lie. But never show anyone your character screen.';
function stGuide() {
  if (!guideOn()) return '';
  const nm = j => '<b>' + esc(G.seats[j].name) + '</b>';
  if (G.phase === 'lobby') return guideBox('First game guide · 1 of 4: gather the town', [
    'Ask everyone to scan the QR code, or to open the link and type the code.',
    'Add anyone without a phone by name. You tell them things in person.',
    'Put the names in the order people sit, going clockwise. Use ▲ and ▼.',
    'For a first game, choose <b>Trouble Brewing</b>.',
    'Read the welcome below out loud. Then press <b>Choose the characters</b>.'], sayHTML(SAY_INTRO));
  if (G.phase === 'setup' && !G.dealt) return guideBox('First game guide · 2 of 4: choose the characters', [
    'Press <b>🎲 Random bag</b>. It always gives a fair mix for this many players.',
    'If you like, tap characters in or out. The counts turn green when the bag is right.',
    'Press <b>Deal the characters</b>. Nobody sees anything yet.']);
  if (G.phase === 'setup') {
    const extra = [];
    if (G.seats.some(s => s.role === 'drunk')) extra.push('what the Drunk thinks they are');
    if (G.seats.some(s => s.rem.some(r => r.t === 'Red herring'))) extra.push('the Fortune Teller’s red herring');
    return guideBox('First game guide · 3 of 4: check the deal', [
      'The page has already chosen ' + listAnd(['the Demon’s three bluffs'].concat(extra)) + '. You can leave them as they are.',
      'Read down the list, so you know who is who. Open the Handbook later if a character is new to you.',
      'Press <b>Begin the first night</b>. Every phone shows its owner their character.',
      'Read the line below out loud.'], sayHTML('Look at your phone and shield it. Learn your character and your team, then press Got it. Keep your character secret.'));
  }
  if (G.phase === 'over') return guideBox('First game guide: the end', [
    'Announce who won. Every phone now shows every character.',
    'Talk it through. Ask people what they knew and when. This is often the best part.',
    'Press <b>Play again with the same town</b> for another game.']);
  if (G.phase === 'night') {
    const steps = nightSteps(G), id = steps[Math.min(G.step, steps.length - 1)];
    const nextB = 'Press <b>Next ▶</b>.';
    if (id === 'dusk') return guideBox('First game guide · night ' + G.night + ': how nights work', [
      'Read the line below out loud. Wait until every eye is closed.',
      nextB + ' The list at the top shows who wakes tonight, in order. Work from left to right.'],
      sayHTML('Night falls. Everyone close your eyes and put your phone face down. If I tap your shoulder, look at your phone. Keep your eyes closed until I say it is morning.'));
    if (id === 'minioninfo' || id === 'demoninfo') {
      const who = id === 'minioninfo' ? 'each Minion' : 'the Demon';
      if (players(G).length < 7) return guideBox('First game guide', ['With fewer than 7 players, the evil team does not learn each other. ' + nextB]);
      return guideBox('First game guide', [
        'Press the button below. It shows ' + who + ' the evil team on their phone.',
        'Tap ' + who + ' on the shoulder, so they look. For a player without a phone, point at the others.',
        'Wait until their phone is face down again. Then ' + nextB.replace('Press', 'press')]);
    }
    if (id === 'dawn') return guideBox('First game guide: morning', [
      'Check the Grimoire. Anyone who died tonight must be marked with <b>☠ Dies</b>.',
      'Press <b>Wake the town</b>. Every phone shows who died.',
      'Read the line below out loud.'], sayHTML('Everyone, open your eyes. It is morning.'));
    const r = ROLES[id], ws = wakers(G, id), tips = [];
    if (!ws.length) return guideBox('First game guide', ['Nobody wakes for the ' + esc(r.name) + ' now. ' + nextB]);
    const j = ws[0], s = G.seats[j], ph = !!s.id;
    if (!r.ask && !r.tell) {
      tips.push('Nobody wakes for this one. It is a note for you. Read the instruction above, act on it if it applies, and then ' + nextB.replace('Press', 'press'));
    } else {
      if (r.ask) tips.push(ph ? 'Press <b>Wake ' + esc(s.name) + ' on their phone</b>.' : nm(j) + ' has no phone. Tap them and let them point at their choice.');
      if (ph) tips.push('Tap ' + nm(j) + ' on the shoulder, so they look at their phone.');
      if (r.ask) tips.push('Wait. Their choice appears here.' + (r.rem.indexOf('Dead') >= 0 ? ' If someone dies, press <b>☠ Dies</b> for them.' : r.rem.length && r.rem[0] !== 'Red herring' ? ' Mark it with the button that appears.' : ''));
      if (r.tell) tips.push('Under <b>Show them</b>, choose what they learn. The blue box has the true answer.' + (ph ? ' Then press <b>Show it on their phone</b>.' : ' Show them with your fingers, or let them read your screen.'));
      tips.push('When their phone is face down, ' + nextB.replace('Press', 'press'));
    }
    let after = '';
    if (impaired(s)) after += '<p class="small">' + nm(j) + ' is drunk or poisoned. Their ability does nothing tonight. If they learn something, you may give a wrong answer. That makes a better game.</p>';
    if (G.night === 1 && G.step < 4) after += '<p class="small">Each character’s instruction is in the box above. The Handbook explains every character.</p>';
    return guideBox('First game guide: the ' + esc(r.name), tips, after);
  }
  if (G.phase === 'day') {
    const v = G.vote, noms = G.noms.filter(n => n.day === G.day);
    if (v && !v.done && !v.running) return guideBox('First game guide: the vote', [
      'Read the line below out loud.',
      'Wait a few seconds, so people can decide. Then press <b>Start the clock</b>.',
      'For a player without a phone, watch their real hand and tap their seat.'],
      sayHTML(esc(G.seats[v.by].name) + ' nominates ' + esc(G.seats[v.on].name) + '. If you want ' + esc(G.seats[v.on].name) + ' executed, raise your hand on your phone before the clock reaches you. ' + v.need + ' votes are needed.'));
    if (v && !v.done) return guideBox('First game guide: the vote', ['The hand goes round the circle. Each vote locks as it passes. Wait for it to finish.']);
    if (v) return guideBox('First game guide: the vote', [
      'Read the number out loud.',
      'Change it with −1 or +1 only if a character changes votes, such as the Butler or the Bureaucrat.',
      'Press <b>Record the vote</b>. The player with the most votes, if it is enough, goes on the block.']);
    if (G.lastExec && G.lastExec.day === G.day) return guideBox('First game guide: after the execution', [
      'Only one execution happens each day.',
      'If the Demon died, or only two players are alive, press <b>Good wins</b> or <b>Evil wins</b>.',
      'If not, press <b>End the day</b>. The next night begins.']);
    if (!noms.length && !G.timer) return guideBox('First game guide · day ' + G.day + ': talk', [
      'Start a timer. Five minutes is good for a first game.',
      'Read the line below out loud.',
      'When time is up, call everyone back to their seats.',
      'Ask: “Does anyone want to nominate?” A nomination comes from a phone, or you enter it below.',
      'Abilities like the Virgin and the Slayer happen out loud. You decide what they do. The page does not.'],
      sayHTML('It is day. Talk to anyone. You may whisper in private, in pairs or small groups. When the time is up, come back to the circle.'));
    return guideBox('First game guide · day ' + G.day + ': nominations', [
      'Ask: “Does anyone else want to nominate?” Accept nominations from phones, or enter them below.',
      'Each living player may nominate once a day. Each player may be nominated once a day.',
      'When nobody else wants to nominate: if someone is on the block, press <b>Execute</b>. Then press <b>End the day</b>.',
      'If the Demon dies, or only two players are alive, the game ends. Press <b>Good wins</b> or <b>Evil wins</b>.']);
  }
  return '';
}
// What a player sees. p is the public view, me the private one.
function plGuide(where) {
  const p = PL.pub, me = PL.priv;
  if (!p || !p.guide || !me) return '';
  const alive = p.seats[me.seat] && p.seats[me.seat].a;
  if (where === 'goal') return me.align === 'evil'
    ? '<p class="small">You are on the <b class="t-demon">evil</b> team. Keep the Demon alive until only two players are left. Lie about who you are.</p>'
    : '<p class="small">You are on the <b class="t-townsfolk">good</b> team. Find the Demon and vote to execute them.</p>';
  if (where === 'night') return '<p class="small">The Storyteller wakes players one at a time. On many nights you are not woken. That is normal. Keep your eyes closed until morning.</p>';
  if (where === 'prompt') return '<p class="small" style="margin-top:12px">Tap your choice, then press Choose. Nobody else sees this. Then put your phone face down.</p>';
  if (where === 'day' && p.phase === 'day') {

  v.running = false; v.done = true; v.at = -1;
  const yes = Object.keys(v.locked).filter(j => v.locked[j]).map(Number);
  v.count = yes.length;
  yes.forEach(j => { if (G.today.voters.indexOf(j) < 0) G.today.voters.push(j); if (!G.seats[j].alive && !v.exile) G.seats[j].ghost = false; });
  log('Vote on ' + G.seats[v.on].name + ': ' + v.count + ' (' + yes.map(j => G.seats[j].name).join(', ') + ').');
  changed();
}

  h += '<div class="card"><h2>Join a town</h2><input id="pname" type="text" placeholder="Your name" value="' + esc(UI.name) + '" maxlength="18" oninput="U.name(this.value)" autocomplete="nickname">' +
    '<input id="jc" type="text" class="code-in" style="margin-top:10px" placeholder="CODE" maxlength="4" value="' + esc(UI.joinCode) + '" autocapitalize="characters" autocomplete="off" oninput="UI.joinCode=this.value.toUpperCase()">' +
    '<button class="btn big red wide" style="margin-top:12px" onclick="U.join(false)">Enter the town</button>' +
    '<p class="center" style="margin:10px 0 0"><button class="btn ghost small" onclick="U.join(true)">Just watch, on a big screen</button></p></div>';
  h += '<div class="card"><h2>Be the Storyteller</h2><p class="small">Your phone becomes the Grimoire. It runs the game, so keep it charged and on this page. Everyone else joins with the code it shows.</p>' +
    (saved && saved.code ? '<button class="btn ember wide" onclick="U.resume()">Resume town ' + esc(saved.code) + ' · ' + esc(SCRIPTS[saved.script] ? SCRIPTS[saved.script].name : '') + '</button><p></p>' : '') +
    '<button class="btn big wide" onclick="U.host()">🕯️ Open a new town</button></div>';
  h += '<details><summary>What is this?</summary><p>A fan-made kit for playing <i>Blood on the Clocktower</i> in one room, with phones instead of tokens and a Grimoire. It has the three editions in the base game, Trouble Brewing, Bad Moon Rising and Sects &amp; Violets, with their Travellers.</p><p>The game belongs to The Pandemonium Institute. Buy the real thing if you love it.</p></details>';
  return h + '</div>';
}

// ---- drawing -----------------------------------------------------------------
function render() {
  // Keep typing, focus and scroll through a redraw. Network updates redraw a lot.
  const a = document.activeElement, keep = {};
  document.querySelectorAll('#app input[id], #app textarea[id], #app select[id]').forEach(e => { if (e.type !== 'checkbox') keep[e.id] = e.value; else keep[e.id] = e.checked; });
  const focus = a && a.id ? { id: a.id, s: a.selectionStart, e: a.selectionEnd } : null;
  const sheetEl = document.querySelector('.sheet'), sheetTop = sheetEl ? sheetEl.scrollTop : 0, stepsEl = $('steps'), stepsLeft = stepsEl ? stepsEl.scrollLeft : 0;
  let h;
  if (UI.screen === 'host' && G) { h = hostHTML(); document.body.className = G.phase === 'night' ? 'night' : G.phase === 'day' ? 'day' : ''; }
  else if (UI.screen === 'play') h = playHTML();
  else h = homeHTML();
  if (UI.sheet) {
    const k = UI.sheet.k, body = k === 'seat' ? seatSheet(UI.sheet.j) : k === 'menu' ? menuSheet() : k === 'guess' ? guessSheet(UI.sheet.j) : k === 'nominate' ? nominateSheet() : k === 'pmenu' ? pmenuSheet() : '';
    h += '<div class="sheet-bg" onclick="if(event.target===this){UI.sheet=null;render()}"><div class="sheet">' + body + '</div></div>';
  }
  $('app').innerHTML = h;
  Object.keys(keep).forEach(id => {
    const e = $(id); if (!e) return;
    if (e.type === 'checkbox') e.checked = keep[id];
    else if (e.tagName === 'SELECT') { if (e.hasAttribute('data-keep')) e.value = keep[id]; }
    else if ((e.value === '' && keep[id] !== '') || (focus && focus.id === id)) e.value = keep[id];
  });
  if (focus) { const e = $(focus.id); if (e && e.focus) { e.focus(); try { if (focus.s != null) e.setSelectionRange(focus.s, focus.e); } catch (x) {} } }
  const s2 = document.querySelector('.sheet'); if (s2) s2.scrollTop = sheetTop;
  const st2 = $('steps'); if (st2) st2.scrollLeft = stepsLeft;
}

// ---- bats --------------------------------------------------------------------
const BAT = '<svg viewBox="0 0 64 30"><path d="M32 10c2-3 3-6 3-8 1 3 0 6-1 8 6-6 16-9 30-6-6 2-9 6-10 12-4-3-8-3-12 0-2-2-5-3-8-1-3-2-6-1-8 1-4-3-8-3-12 0-1-6-4-10-10-12 14-3 24 0 30 6-1-2-2-5-1-8 0 2 1 5 3 8z"/></svg>';
function bat() {
  if (matchMedia('(prefers-reduced-motion: reduce)').matches || document.hidden) return;
  const b = document.createElement('div'); b.className = 'bat'; b.innerHTML = BAT;
  const y = 40 + Math.random() * 260, rtl = Math.random() < 0.5, w = innerWidth + 120, s = 0.6 + Math.random() * 0.8;
  b.style.top = y + 'px'; b.style.left = (rtl ? w : -80) + 'px'; document.body.appendChild(b);
  const dx = rtl ? -w - 160 : w + 160;
  const an = b.animate([{ transform: 'translate(0,0) scale(' + s + ')' }, { transform: 'translate(' + dx / 2 + 'px,' + (Math.random() * 80 - 60) + 'px) scale(' + s + ')' }, { transform: 'translate(' + dx + 'px,' + (Math.random() * 120 - 60) + 'px) scale(' + s + ')' }], { duration: 5000 + Math.random() * 4000, easing: 'ease-in-out' });
  an.onfinish = () => b.remove();
}
(function batLoop() { setTimeout(() => { bat(); if (Math.random() < 0.3) setTimeout(bat, 400); batLoop(); }, 9000 + Math.random() * 16000); })();
// ============================================================================
// Spooky music for the Storyteller's device, made live with Web Audio, so there
// are no files to load. Night: a low drone, wind and a slow music box. Day: an
// organ that drifts through minor chords. Bells toll at dusk and dawn.
// ============================================================================
const AUD = {
  ctx: null, on: false, vol: Number(store.get('vol') || 0.6), cur: 'day', nodes: [], loop: null,
  ensure() {
    if (this.ctx) { if (this.ctx.state === 'suspended') this.ctx.resume(); return true; }
    const C = window.AudioContext || window.webkitAudioContext; if (!C) return false;
    const c = this.ctx = new C();
    this.out = c.createGain(); this.out.gain.value = this.vol;
    const comp = c.createDynamicsCompressor(); this.out.connect(comp); comp.connect(c.destination);
    // A long dark hall: reverb from decaying noise.
    this.verb = c.createConvolver(); const len = c.sampleRate * 3.5, ir = c.createBuffer(2, len, c.sampleRate);
    for (let ch = 0; ch < 2; ch++) { const d = ir.getChannelData(ch); for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 2.6); }
    this.verb.buffer = ir; this.wet = c.createGain(); this.wet.gain.value = 0.55; this.verb.connect(this.wet); this.wet.connect(this.out);
    this.fx = c.createGain(); this.fx.connect(this.out); this.fx.connect(this.verb);
    const nb = c.createBuffer(1, c.sampleRate * 2, c.sampleRate), nd = nb.getChannelData(0); for (let i = 0; i < nd.length; i++) nd[i] = Math.random() * 2 - 1;
    this.noise = nb;
    return true;
  },
  setVol(v) { this.vol = v; store.set('vol', String(v)); if (this.out) this.out.gain.setTargetAtTime(v, this.ctx.currentTime, 0.1); },
  start() { if (!this.ensure()) { toast('This browser cannot play sound.'); return; } this.on = true; this.mood(this.cur, true); },
  stop() { this.on = false; this.clear(); },
  clear() {
    clearTimeout(this.loop); const t = this.ctx ? this.ctx.currentTime : 0;
    this.nodes.forEach(n => { try { if (n.gain) n.gain.setTargetAtTime(0, t, 0.6); else n.stop(t + 3); } catch (e) {} });
    const old = this.nodes; this.nodes = []; setTimeout(() => old.forEach(n => { try { n.disconnect(); } catch (e) {} }), 4000);
  },
  mood(m, force) {
    if (m === this.cur && !force) return;
    this.cur = m; if (!this.on) return;
    this.clear();
    const c = this.ctx, t = c.currentTime, bed = c.createGain(); bed.gain.value = 0; bed.gain.setTargetAtTime(1, t, 2); bed.connect(this.out); bed.connect(this.verb); this.nodes.push(bed);
    // Wind: noise through a slowly sweeping band-pass.
    const w = c.createBufferSource(); w.buffer = this.noise; w.loop = true;
    const bp = c.createBiquadFilter(); bp.type = 'bandpass'; bp.Q.value = 1.4; bp.frequency.value = 500;
    const lfo = c.createOscillator(); lfo.frequency.value = 0.07; const lg = c.createGain(); lg.gain.value = 320; lfo.connect(lg); lg.connect(bp.frequency);
    const wg = c.createGain(); wg.gain.value = m === 'night' ? 0.11 : 0.05; w.connect(bp); bp.connect(wg); wg.connect(bed); w.start(); lfo.start();
    this.nodes.push(w, lfo, wg);
    if (m === 'night') {
      // Drone: two detuned saws on a low A, filtered and breathing.
      [55, 55.35, 82.4].forEach((f, i) => {
        const o = c.createOscillator(); o.type = i === 2 ? 'triangle' : 'sawtooth'; o.frequency.value = f;
        const lp = c.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 240;
        const l2 = c.createOscillator(); l2.frequency.value = 0.05 + i * 0.03; const l2g = c.createGain(); l2g.gain.value = 120; l2.connect(l2g); l2g.connect(lp.frequency);
        const g = c.createGain(); g.gain.value = i === 2 ? 0.05 : 0.07; o.connect(lp); lp.connect(g); g.connect(bed); o.start(); l2.start();
        this.nodes.push(o, l2, g);
      });
      this.musicBox();
    } else this.organ();
  },
  // A music box in A harmonic minor, slow and a little out of tune.
  musicBox() {
    const scale = [57, 60, 62, 64, 65, 68, 69, 72, 74, 76], motif = [0, 2, 4, 5, 4, 2, 1, 0];
    let k = 0;
    const play = () => {
      if (!this.on || this.cur !== 'night') return;
      const c = this.ctx, t = c.currentTime, phrase = Math.random() < 0.6;
      const n = phrase ? scale[(motif[k++ % motif.length] + (Math.random() < 0.2 ? 3 : 0)) % scale.length] + 12 : scale[Math.floor(Math.random() * scale.length)] + 12;
      this.note(440 * Math.pow(2, (n - 69) / 12) * (1 + (Math.random() - 0.5) * 0.006), t, 0.07);
      if (Math.random() < 0.08) this.owl();
      this.loop = setTimeout(play, 700 + Math.random() * 1600 + (k % 8 === 0 ? 2500 : 0));
    };
    this.loop = setTimeout(play, 1500);
  },
  note(f, t, v) {
    const c = this.ctx, o = c.createOscillator(), o2 = c.createOscillator(), g = c.createGain();
    o.type = 'sine'; o.frequency.value = f; o2.type = 'triangle'; o2.frequency.value = f * 2.01;
    const g2 = c.createGain(); g2.gain.value = 0.25; o2.connect(g2); g2.connect(g);
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(v, t + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, t + 2.6);
    o.connect(g); g.connect(this.fx); o.start(t); o2.start(t); o.stop(t + 2.7); o2.stop(t + 2.7);
  },
  // Day: a slow organ through i, VI, iv, V in A minor.
  organ() {
    const chords = [[57, 60, 64], [53, 57, 60], [50, 53, 57], [52, 56, 59], [57, 60, 64], [55, 59, 62], [53, 57, 60], [52, 56, 59]];
    let k = 0;
    const play = () => {
      if (!this.on || this.cur !== 'day') return;
      const c = this.ctx, t = c.currentTime, ch = chords[k++ % chords.length];
      ch.concat([ch[0] - 12]).forEach(n => {
        const f = 440 * Math.pow(2, (n - 69) / 12);
        [1, 2, 3].forEach((h, i) => {
          const o = c.createOscillator(), g = c.createGain(); o.type = 'sine'; o.frequency.value = f * h;
          g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(0.022 / (i + 1), t + 1.2); g.gain.setValueAtTime(0.022 / (i + 1), t + 5.6); g.gain.linearRampToValueAtTime(0, t + 7.4);
          o.connect(g); g.connect(this.fx); o.start(t); o.stop(t + 7.6);
        });
      });
      if (Math.random() < 0.15) setTimeout(() => this.crow(), 2500);
      this.loop = setTimeout(play, 6500);
    };
    play();
  },
  // A church bell: inharmonic partials that fade at different rates.
  bell(times) {
    if (!this.on || !this.ensure()) return;
    for (let i = 0; i < (times || 1); i++) {
      const c = this.ctx, t = c.currentTime + i * 2.2;
      [[1, 0.25, 5], [2, 0.12, 3.5], [2.4, 0.1, 3], [3, 0.08, 2.4], [4.2, 0.05, 1.8], [5.4, 0.035, 1.2], [0.5, 0.15, 6]].forEach(([m, v, d]) => {
        const o = c.createOscillator(), g = c.createGain(); o.frequency.value = 196 * m;
        g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(v, t + 0.005); g.gain.exponentialRampToValueAtTime(0.0001, t + d);
        o.connect(g); g.connect(this.fx); o.start(t); o.stop(t + d + 0.1);
      });
    }
  },
  toll() { if (this.on) this.bell(1); },
  thunder() {
    if (!this.on || !this.ensure()) return;
    const c = this.ctx, t = c.currentTime, s = c.createBufferSource(); s.buffer = this.noise; s.loop = true;
    const lp = c.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.setValueAtTime(900, t); lp.frequency.exponentialRampToValueAtTime(80, t + 3);
    const g = c.createGain(); g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(0.9, t + 0.08); g.gain.setValueAtTime(0.5, t + 0.3); g.gain.linearRampToValueAtTime(0.7, t + 0.5); g.gain.exponentialRampToValueAtTime(0.001, t + 4.5);
    s.connect(lp); lp.connect(g); g.connect(this.fx); s.start(t); s.stop(t + 4.6);
    document.body.animate([{ filter: 'brightness(1)' }, { filter: 'brightness(2.4)' }, { filter: 'brightness(1)' }, { filter: 'brightness(1.8)' }, { filter: 'brightness(1)' }], { duration: 600 });
  },
  // A dissonant low cluster for an execution.
  sting() {
    if (!this.on || !this.ensure()) return;
    const c = this.ctx, t = c.currentTime;
    [41.2, 43.65, 61.7, 65.4, 87.3].forEach(f => {
      const o = c.createOscillator(), g = c.createGain(); o.type = 'sawtooth'; o.frequency.value = f;
      const lp = c.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 700;
      g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(0.12, t + 0.05); g.gain.exponentialRampToValueAtTime(0.0001, t + 4);
      o.connect(lp); lp.connect(g); g.connect(this.fx); o.start(t); o.stop(t + 4.1);
    });
    this.bell(1);
  },
  scream() {
    if (!this.on || !this.ensure()) return;
    const c = this.ctx, t = c.currentTime, o = c.createOscillator(), g = c.createGain(), v = c.createOscillator(), vg = c.createGain();
    o.type = 'sawtooth'; o.frequency.setValueAtTime(700, t); o.frequency.linearRampToValueAtTime(1300, t + 0.25); o.frequency.exponentialRampToValueAtTime(380, t + 1.6);
    v.frequency.value = 9; vg.gain.value = 40; v.connect(vg); vg.connect(o.frequency);
    const bp = c.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 1400; bp.Q.value = 2;
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(0.25, t + 0.06); g.gain.exponentialRampToValueAtTime(0.0001, t + 1.7);
    o.connect(bp); bp.connect(g); g.connect(this.fx); o.start(t); v.start(t); o.stop(t + 1.8); v.stop(t + 1.8);
  },
  owl() {
    const c = this.ctx, t = c.currentTime + 0.3;
    [[0, 0.35], [0.5, 0.9]].forEach(([s, e]) => {
      const o = c.createOscillator(), g = c.createGain(); o.frequency.setValueAtTime(400, t + s); o.frequency.linearRampToValueAtTime(360, t + e);
      g.gain.setValueAtTime(0, t + s); g.gain.linearRampToValueAtTime(0.05, t + s + 0.05); g.gain.linearRampToValueAtTime(0, t + e);
      o.connect(g); g.connect(this.fx); o.start(t + s); o.stop(t + e + 0.05);
    });
  },
  crow() {
    if (!this.on) return;
    const c = this.ctx;
    for (let i = 0; i < 2; i++) {
      const t = c.currentTime + i * 0.35, o = c.createOscillator(), g = c.createGain(), bp = c.createBiquadFilter();
      o.type = 'sawtooth'; o.frequency.setValueAtTime(520, t); o.frequency.linearRampToValueAtTime(380, t + 0.22);
      bp.type = 'bandpass'; bp.frequency.value = 1100; bp.Q.value = 3;
      g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(0.06, t + 0.02); g.gain.linearRampToValueAtTime(0, t + 0.24);
      o.connect(bp); bp.connect(g); g.connect(this.fx); o.start(t); o.stop(t + 0.26);
    }
  },
  // The clock hand during a vote: a tick, or a deeper tock for a raised hand.
  tick(up) {
    if (!this.on) return;
    const c = this.ctx, t = c.currentTime, o = c.createOscillator(), g = c.createGain();
    o.type = 'square'; o.frequency.value = up ? 330 : 1500;
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(up ? 0.12 : 0.05, t + 0.002); g.gain.exponentialRampToValueAtTime(0.0001, t + (up ? 0.3 : 0.05));
    o.connect(g); g.connect(this.fx); o.start(t); o.stop(t + 0.32);
  },
};

// ---- start --------------------------------------------------------------------
(function boot() {
  const j = store.json('join');
  if (UI.joinCode && j && j.code === UI.joinCode && UI.name) { enterGame(j.code, j.spec); return; }
  if (!UI.joinCode && j && QS.get('rejoin') !== '0' && UI.name) { enterGame(j.code, j.spec); return; }
  render();
})();
