<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#0d0d0d">
<meta name="mobile-web-app-capable" content="yes">
<title>Map Trivia</title>
<style>
  :root {
    color-scheme: dark;
    --surface-1: #1a1a19;
    --plane: #0d0d0d;
    --text-primary: #ffffff;
    --text-secondary: #c3c2b7;
    --muted: #898781;
    --grid: #2c2c2a;
    --axis: #383835;
    --border: rgba(255,255,255,0.12);
    --wash: rgba(255,255,255,0.07);
    --land: #303030;
    --land-ink: #4a4a48;
    --accent: #3987e5;
    --good: #0ca30c;
    --bad: #d03b3b;
    --on-fill: #ffffff;
    --sheet-shadow: 0 -8px 32px rgba(0,0,0,.5);
  }

  * { box-sizing: border-box; min-width: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; margin: 0; overscroll-behavior: none; }
  body {
    background: var(--plane); color: var(--text-primary);
    font: 16px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased;
    display: flex; flex-direction: column;
    height: 100dvh; overflow: hidden;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left);
  }
  button, input { font: inherit; color: inherit; touch-action: manipulation; }

  /* ---------- top bar ---------- */
  .top {
    flex: 0 0 auto; display: flex; align-items: center; gap: 10px;
    padding: 10px 14px; border-bottom: 1px solid var(--grid); background: var(--surface-1);
  }
  .modes { display: flex; gap: 2px; background: var(--wash); padding: 3px; border-radius: 10px; }
  .modes button {
    background: none; border: 0; padding: 8px 14px; border-radius: 7px;
    color: var(--text-secondary); cursor: pointer; font-size: .9rem; min-height: 40px;
  }
  .modes button[aria-pressed="true"] {
    background: var(--surface-1); color: var(--text-primary); font-weight: 650;
    box-shadow: 0 1px 2px rgba(0,0,0,.10), 0 0 0 1px var(--border);
  }
  .grow { flex: 1 1 auto; }
  .stat { text-align: right; line-height: 1.15; }
  .stat .big { font-size: 1.05rem; font-weight: 650; font-variant-numeric: tabular-nums; }
  .stat .cap { font-size: .66rem; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); }
  .lives { display: flex; gap: 3px; font-size: 1rem; line-height: 1; }
  .lives i { font-style: normal; filter: grayscale(1) opacity(.28); }
  .lives i.on { filter: none; }

  .iconbtn {
    background: var(--surface-1); border: 1px solid var(--axis); border-radius: 10px;
    width: 42px; height: 42px; display: grid; place-items: center; cursor: pointer;
    font-size: 1.05rem; flex: 0 0 auto;
  }
  .iconbtn:active { background: var(--wash); }

  /* ---------- map ---------- */
  .maparea { flex: 1 1 auto; position: relative; min-height: 0; background: var(--plane); }
  svg#map { width: 100%; height: 100%; display: block; touch-action: none; }
  #map path {
    fill: var(--land); stroke: var(--plane); stroke-width: 1.6;
    stroke-linejoin: round; vector-effect: non-scaling-stroke;
  }
  #map path.solved { fill: var(--good); pointer-events: none; }
  #map path.active { fill: var(--accent); }
  #map path.wrong  { fill: var(--bad); }
  #map .dot { fill: var(--land-ink); stroke: var(--plane); stroke-width: 1.2;
              vector-effect: non-scaling-stroke; }
  #map .dot.solved { fill: var(--good); pointer-events: none; }
  #map .dot.active { fill: var(--accent); }
  #map .dot.wrong  { fill: var(--bad); }
  #map text {
    fill: var(--on-fill); text-anchor: middle; font-weight: 700;
    pointer-events: none; opacity: 0; letter-spacing: .02em;
  }
  #map text.show { opacity: 1; }
  .zoomers { position: absolute; right: 10px; bottom: 10px; display: flex; flex-direction: column; gap: 6px; }

  .hint {
    position: absolute; left: 50%; top: 10px; transform: translateX(-50%);
    background: var(--surface-1); border: 1px solid var(--border); border-radius: 999px;
    padding: 7px 14px; font-size: .82rem; color: var(--text-secondary);
    box-shadow: 0 2px 10px rgba(0,0,0,.08); white-space: nowrap; pointer-events: none;
  }

  /* ---------- answer sheet ---------- */
  .sheet {
    flex: 0 0 auto; background: var(--surface-1); border-top: 1px solid var(--grid);
    box-shadow: var(--sheet-shadow);
    padding: 14px 14px calc(14px + env(safe-area-inset-bottom));
  }
  .ask { font-size: .82rem; color: var(--muted); text-transform: uppercase;
         letter-spacing: .07em; font-weight: 650; margin-bottom: 10px; text-align: center; }
  .opts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
  .opts button {
    min-height: 56px; border-radius: 12px; border: 1px solid var(--axis);
    background: var(--surface-1); cursor: pointer; padding: 8px 6px;
    font-size: .92rem; font-weight: 550; line-height: 1.15;
    overflow-wrap: break-word; hyphens: auto;
  }
  .opts button:active { background: var(--wash); }
  .opts button.right { background: var(--good); border-color: var(--good); color: #fff; }
  .opts button.wrongpick { background: var(--bad); border-color: var(--bad); color: #fff; }
  @media (min-width: 620px) { .opts { grid-template-columns: repeat(4, 1fr); } }

  .typerow { display: flex; gap: 8px; }
  .typerow input {
    flex: 1 1 auto; min-width: 0; min-height: 56px; border-radius: 12px; padding: 0 14px;
    border: 1px solid var(--axis); background: var(--plane); font-size: 16px;
  }
  .typerow input:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  .typerow button {
    min-height: 56px; padding: 0 20px; border-radius: 12px; border: 0;
    background: var(--accent); color: #fff; font-weight: 650; cursor: pointer;
  }
  .idle { text-align: center; color: var(--text-secondary); font-size: .92rem; padding: 6px 0 2px; }
  .flash { text-align: center; font-weight: 650; min-height: 1.3em; margin-top: 10px; font-size: .95rem; }
  .flash.ok { color: var(--good); }
  .flash.no { color: var(--bad); }

  /* ---------- overlay ---------- */
  .overlay {
    position: fixed; inset: 0; z-index: 50; display: grid; place-items: center;
    background: rgba(0,0,0,.55); padding: 24px;
  }
  .overlay[hidden] { display: none; }
  .panel {
    background: var(--surface-1); border-radius: 18px; padding: 26px 22px;
    max-width: 380px; width: 100%; text-align: center;
    box-shadow: 0 20px 60px rgba(0,0,0,.35);
  }
  .panel h2 { margin: 0 0 6px; font-size: 1.4rem; letter-spacing: -0.01em; }
  .panel p { margin: 0 0 18px; color: var(--text-secondary); font-size: .95rem; }
  .panel button {
    width: 100%; min-height: 52px; border-radius: 12px; border: 0;
    background: var(--accent); color: #fff; font-weight: 650; cursor: pointer; font-size: 1rem;
  }
  [hidden] { display: none !important; }

  @keyframes shake {
    0%,100% { transform: translateX(0); }
    25% { transform: translateX(-6px); }
    75% { transform: translateX(6px); }
  }
  .shake { animation: shake .22s ease-in-out 2; }
</style>
</head>
<body>

<div class="top">
  <div class="modes" role="group" aria-label="Difficulty">
    <button type="button" data-mode="easy" aria-pressed="true">Easy</button>
    <button type="button" data-mode="hard" aria-pressed="false">Hard</button>
  </div>
  <div class="grow"></div>
  <div class="stat">
    <div class="big" id="score">0/32</div>
    <div class="lives" id="lives" aria-label="Lives remaining"></div>
  </div>
</div>

<div class="maparea">
  <svg id="map" role="application"></svg>
  <div class="hint" id="hint">Pinch to zoom · drag to pan</div>
  <div class="zoomers">
    <button class="iconbtn" id="zin"  type="button" aria-label="Zoom in">+</button>
    <button class="iconbtn" id="zout" type="button" aria-label="Zoom out">−</button>
    <button class="iconbtn" id="zfit" type="button" aria-label="Reset view">⤢</button>
  </div>
</div>

<div class="sheet">
  <div id="idle" class="idle">Tap any grey state to name it.</div>

  <div id="quiz" hidden>
    <div class="ask" id="ask">Which state is highlighted?</div>
    <div class="opts" id="opts" hidden></div>
    <form class="typerow" id="typerow" hidden autocomplete="off">
      <input id="answer" type="text" placeholder="Type the state name"
             autocomplete="off" autocorrect="off" autocapitalize="words"
             spellcheck="false" enterkeyhint="go" aria-label="State name">
      <button type="submit">Go</button>
    </form>
  </div>

  <div class="flash" id="flash" role="status" aria-live="polite"></div>
</div>

<div class="overlay" id="overlay" hidden>
  <div class="panel">
    <h2 id="ovtitle"></h2>
    <p id="ovbody"></p>
    <button type="button" id="ovbtn"></button>
  </div>
</div>

const KEY = "map-trivia-v1:" + MAP.id;
const MAX_WRONG = 5;
const N = MAP.states.length;

const $ = id => document.getElementById(id);
const norm = s => s.normalize("NFD").replace(/[\u0300-\u036f]/g, "")
  .toLowerCase().replace(/[^a-z0-9 ]+/g, " ").replace(/\s+/g, " ").trim();

/* ---------------- persistence ---------------- */
const blank = () => ({ solved: [], wrong: 0 });
let save;
try {
  save = JSON.parse(localStorage.getItem(KEY)) || {};
} catch { save = {}; }
save.easy = save.easy || blank();
save.hard = save.hard || blank();
save.best = save.best || { easy: 0, hard: 0 };

let mode = "easy";
const run = () => save[mode];
const solved = () => new Set(run().solved);

function persist() {
  try { localStorage.setItem(KEY, JSON.stringify(save)); } catch {}
}

/* ---------------- map rendering ---------------- */
const svg = $("map");
const NS = "http://www.w3.org/2000/svg";
let g, byName = {};
let k = 1, tx = 0, ty = 0;          // content transform
const SMALL = 1600;                  // area below which a state also gets a dot

function buildMap() {
  svg.setAttribute("viewBox", `0 0 ${MAP.w} ${MAP.h}`);
  svg.setAttribute("preserveAspectRatio", "xMidYMid meet");
  g = document.createElementNS(NS, "g");
  svg.appendChild(g);

  for (const s of MAP.states) {
    const p = document.createElementNS(NS, "path");
    p.setAttribute("d", s.d);
    p.dataset.n = s.n;
    p.style.cursor = "pointer";
    g.appendChild(p);

    let dot = null;
    if (s.a < SMALL) {
      dot = document.createElementNS(NS, "circle");
      dot.setAttribute("class", "dot");
      dot.setAttribute("cx", s.c[0]);
      dot.setAttribute("cy", s.c[1]);
      dot.dataset.n = s.n;
      dot.style.cursor = "pointer";
      g.appendChild(dot);
    }

    const t = document.createElementNS(NS, "text");
    t.setAttribute("x", s.c[0]);
    t.setAttribute("y", s.c[1]);
    t.textContent = s.code;
    g.appendChild(t);

    byName[s.n] = { s, path: p, dot, text: t };
  }
  applyTransform();
}

// viewBox units per CSS pixel, honouring xMidYMid meet (fit to the tighter axis)
function unitsPerPx() {
  const r = svg.getBoundingClientRect();
  if (!r.width || !r.height) return 1;
  return 1 / Math.min(r.width / MAP.w, r.height / MAP.h);
}

function applyTransform() {
  g.setAttribute("transform", `translate(${tx} ${ty}) scale(${k})`);
  // dots and labels must stay a constant size in CSS pixels, so convert through
  // both the viewBox fit and the current zoom
  const u = unitsPerPx();
  const r = 10 * u / k;          // ~20px tap target for the tiny states
  const fs = 11 * u / k;
  for (const name in byName) {
    const { s, dot, text } = byName[name];
    const areaPx = s.a * k * k / (u * u);
    if (dot) {
      dot.setAttribute("r", r);
      // once the state itself is a big enough target, drop the helper dot
      dot.style.display = areaPx < 1900 ? "" : "none";
    }
    text.setAttribute("font-size", fs);
    // label a state only once its shape is big enough on screen to hold the text
    text.classList.toggle("show",
      text.classList.contains("solvedlabel") && areaPx > 1100);
  }
}

function fit() { k = 1; tx = 0; ty = 0; applyTransform(); }

function zoomAt(factor, vx, vy) {
  const nk = Math.min(12, Math.max(1, k * factor));
  if (nk === k) return;
  // keep the content point under (vx,vy) fixed
  tx += (k - nk) * ((vx - tx) / k);
  ty += (k - nk) * ((vy - ty) / k);
  k = nk;
  clamp();
  applyTransform();
}

function clamp() {
  if (k <= 1) { k = 1; tx = 0; ty = 0; return; }
  const minx = MAP.w - MAP.w * k, miny = MAP.h - MAP.h * k;
  tx = Math.min(0, Math.max(minx, tx));
  ty = Math.min(0, Math.max(miny, ty));
}

// client px -> viewBox units
function toView(cx, cy) {
  const pt = new DOMPoint(cx, cy).matrixTransform(svg.getScreenCTM().inverse());
  return [pt.x, pt.y];
}

/* ---------------- pan / pinch / tap ---------------- */
const pointers = new Map();
let startDist = 0, startK = 1, startMid = null, moved = false, downAt = 0;
let downName = null, multi = false;

svg.addEventListener("pointerdown", e => {
  // Capturing keeps panning alive outside the element, but it also retargets the
  // follow-up click to the <svg>, so taps are resolved from pointerup instead.
  try { svg.setPointerCapture(e.pointerId); } catch {}
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (pointers.size === 1) {
    moved = false;
    multi = false;
    downAt = Date.now();
    downName = (e.target.dataset && e.target.dataset.n) || null;
  }
  if (pointers.size === 2) {
    multi = true;
    const [a, b] = [...pointers.values()];
    startDist = Math.hypot(a.x - b.x, a.y - b.y);
    startK = k;
    startMid = toView((a.x + b.x) / 2, (a.y + b.y) / 2);
  }
});

svg.addEventListener("pointermove", e => {
  const prev = pointers.get(e.pointerId);
  if (!prev) return;
  const dx = e.clientX - prev.x, dy = e.clientY - prev.y;
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });

  if (pointers.size === 1) {
    if (Math.abs(dx) + Math.abs(dy) > 2) moved = true;
    if (k > 1) {
      const u = unitsPerPx();
      tx += dx * u;
      ty += dy * u;
      clamp();
      applyTransform();
    }
  } else if (pointers.size === 2) {
    moved = true;
    const [a, b] = [...pointers.values()];
    const dist = Math.hypot(a.x - b.x, a.y - b.y);
    if (startDist > 0) {
      const nk = Math.min(12, Math.max(1, startK * (dist / startDist)));
      tx += (k - nk) * ((startMid[0] - tx) / k);
      ty += (k - nk) * ((startMid[1] - ty) / k);
      k = nk;
      clamp();
      applyTransform();
    }
  }
});

svg.addEventListener("pointerup", e => {
  const wasLast = pointers.size === 1;
  pointers.delete(e.pointerId);
  if (pointers.size < 2) startDist = 0;
  // a tap is: one finger, no pan, no pinch, quick, and started on a state
  if (wasLast && !moved && !multi && downName && Date.now() - downAt < 600) {
    const n = downName;
    downName = null;
    select(n);
  }
});

svg.addEventListener("pointercancel", e => {
  pointers.delete(e.pointerId);
  if (pointers.size < 2) startDist = 0;
  downName = null;
});

svg.addEventListener("wheel", e => {
  e.preventDefault();
  const [vx, vy] = toView(e.clientX, e.clientY);
  zoomAt(e.deltaY < 0 ? 1.18 : 1 / 1.18, vx, vy);
}, { passive: false });

// Fallback for anything without Pointer Events; modern browsers use pointerup above.
if (!window.PointerEvent) {
  svg.addEventListener("click", e => {
    const n = e.target.dataset && e.target.dataset.n;
    if (n) select(n);
  });
}

$("zin").onclick  = () => zoomAt(1.5, MAP.w / 2, MAP.h / 2);
$("zout").onclick = () => zoomAt(1 / 1.5, MAP.w / 2, MAP.h / 2);
$("zfit").onclick = () => fit();

/* ---------------- game ---------------- */
let current = null;    // state name being asked
let locked = false;    // ignore input during answer animation

function shuffle(a) {
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function select(name) {
  if (locked || solved().has(name)) return;
  current = name;
  paint();
  askQuestion();
}

function askQuestion() {
  $("idle").hidden = true;
  $("quiz").hidden = false;
  $("flash").textContent = "";
  $("flash").className = "flash";

  if (mode === "easy") {
    $("opts").hidden = false;
    $("typerow").hidden = true;
    const others = MAP.states.map(s => s.n).filter(n => n !== current);
    const choices = shuffle([current, ...shuffle(others).slice(0, 3)]);
    $("opts").innerHTML = choices
      .map(c => `<button type="button" data-c="${c}">${c}</button>`).join("");
    for (const b of $("opts").children) b.onclick = () => answer(b.dataset.c, b);
  } else {
    $("opts").hidden = true;
    $("typerow").hidden = false;
    $("answer").value = "";
    $("answer").focus({ preventScroll: true });
  }
}

function answer(text, btn) {
  if (locked || !current) return;
  const st = byName[current].s;
  const ok = mode === "easy" ? text === current : st.alt.includes(norm(text));

  if (ok) {
    locked = true;
    if (btn) btn.classList.add("right");
    run().solved.push(current);
    if (run().solved.length > save.best[mode]) save.best[mode] = run().solved.length;
    persist();
    flash(`Correct — ${current}`, true);
    byName[current].text.classList.add("solvedlabel");
    current = null;
    setTimeout(() => {
      locked = false;
      paint();
      if (run().solved.length === N) return over(true);
      idle();
    }, 550);
  } else {
    run().wrong++;
    persist();
    if (btn) btn.classList.add("wrongpick");
    document.querySelector(".sheet").classList.add("shake");
    setTimeout(() => document.querySelector(".sheet").classList.remove("shake"), 460);
    if (navigator.vibrate) navigator.vibrate(60);
    const left = MAX_WRONG - run().wrong;
    if (left <= 0) { paintLives(); return over(false); }
    flash(mode === "easy" ? `Not quite — ${left} ${left === 1 ? "life" : "lives"} left`
                          : `“${text}” isn’t right — ${left} left`, false);
    paintLives();
    if (mode === "easy") {
      locked = true;
      setTimeout(() => { locked = false; askQuestion(); }, 700);
    } else {
      $("answer").select();
    }
  }
}

function flash(msg, ok) {
  const f = $("flash");
  f.textContent = msg;
  f.className = "flash " + (ok ? "ok" : "no");
}

function idle() {
  current = null;
  $("quiz").hidden = true;
  $("idle").hidden = false;
  paint();
}

function paint() {
  const done = solved();
  for (const name in byName) {
    const { path, dot, text } = byName[name];
    const isDone = done.has(name);
    const isCur = name === current;
    path.classList.toggle("solved", isDone);
    path.classList.toggle("active", isCur);
    if (dot) {
      dot.classList.toggle("solved", isDone);
      dot.classList.toggle("active", isCur);
    }
    text.classList.toggle("solvedlabel", isDone);
  }
  applyTransform();
  $("score").textContent = `${done.size}/${N}`;
  paintLives();
}

function paintLives() {
  const left = Math.max(0, MAX_WRONG - run().wrong);
  $("lives").innerHTML = Array.from({ length: MAX_WRONG },
    (_, i) => `<i class="${i < left ? "on" : ""}">♥</i>`).join("");
  $("lives").setAttribute("aria-label", `${left} of ${MAX_WRONG} lives remaining`);
}

function over(won) {
  locked = true;
  const got = run().solved.length;
  $("ovtitle").textContent = won ? "All 32 states!" : "Out of lives";
  $("ovbody").textContent = won
    ? `You named every state in ${mode} mode without running out of lives.`
    : `You got ${got} of ${N} before missing ${MAX_WRONG} times. Best so far: ${save.best[mode]}.`;
  $("ovbtn").textContent = won ? "Play again" : "Start over";
  $("overlay").hidden = false;
}

$("ovbtn").onclick = () => {
  save[mode] = blank();
  persist();
  $("overlay").hidden = true;
  locked = false;
  for (const name in byName) byName[name].text.classList.remove("solvedlabel");
  fit();
  idle();
};

/* ---------------- chrome ---------------- */
for (const b of document.querySelectorAll(".modes button")) {
  b.onclick = () => {
    mode = b.dataset.mode;
    for (const o of document.querySelectorAll(".modes button"))
      o.setAttribute("aria-pressed", String(o.dataset.mode === mode));
    $("overlay").hidden = true;
    locked = false;
    for (const name in byName) byName[name].text.classList.remove("solvedlabel");
    for (const n of run().solved) byName[n].text.classList.add("solvedlabel");
    $("hint").textContent = mode === "easy"
      ? "Tap a state, then pick its name" : "Tap a state, then type its name";
    idle();
  };
}

$("typerow").onsubmit = e => { e.preventDefault(); answer($("answer").value); };

setTimeout(() => { const h = $("hint"); if (h) h.style.display = "none"; }, 4000);

// On phones the software keyboard shrinks the visual viewport without changing
// 100dvh, which would push the answer row under the keyboard. Track it directly.
if (window.visualViewport) {
  const vv = window.visualViewport;
  const sizeToKeyboard = () => {
    document.body.style.height = vv.height + "px";
    applyTransform();
  };
  vv.addEventListener("resize", sizeToKeyboard);
}

// dot and label sizing depends on the rendered box, so recompute when it changes
if (window.ResizeObserver) new ResizeObserver(() => applyTransform()).observe(svg);
addEventListener("orientationchange", () => setTimeout(applyTransform, 250));

document.title = `Map Trivia — ${MAP.title}`;
svg.setAttribute("aria-label", `Map of ${MAP.title}. Tap a ${MAP.unit} to name it.`);
buildMap();
for (const n of run().solved) byName[n].text.classList.add("solvedlabel");
idle();
if (run().wrong >= MAX_WRONG) over(false);
</script>
</body>
</html>
