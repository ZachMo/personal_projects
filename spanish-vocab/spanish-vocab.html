<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Practica con Zach</title>
<meta name="description" content="Spanish vocabulary flashcards and a match game, with Zach as your coach.">
<meta name="theme-color" content="#c8553d">
<meta name="apple-mobile-web-app-title" content="Practica con Zach">
<link rel="icon" href="zach-icon.svg" type="image/svg+xml">
<link rel="icon" href="zach-icon-180.png" sizes="180x180" type="image/png">
<link rel="icon" href="zach-icon-512.png" sizes="512x512" type="image/png">
<link rel="apple-touch-icon" href="zach-icon-180.png">
<style>
  :root {
    color-scheme: light;
    --plane: #f7f3ec; --surface: #fffdf9; --surface-2: #f1ebe1;
    --ink: #1f1b16; --ink-2: #5a5249; --muted: #8b8279;
    --line: #e6ddd0; --border: rgba(31,27,22,.12); --wash: rgba(31,27,22,.05);
    --accent: #c8553d; --accent-ink: #fff; --accent-soft: rgba(200,85,61,.12);
    --good: #2f8a4c; --good-soft: rgba(47,138,76,.13);
    --bad: #c23a3a; --bad-soft: rgba(194,58,58,.12);
    --warn: #b7791f; --warn-soft: rgba(183,121,31,.14);
    --bar: #c8553d;
    --zach-skin: #fff3e6; --zach-hair: #6b4a2e; --zach-shirt: #3f6f9e; --zach-ink: #2a221b;
    --shadow: 0 1px 2px rgba(31,27,22,.06), 0 8px 24px rgba(31,27,22,.08);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      color-scheme: dark;
      --plane: #15130f; --surface: #1f1c17; --surface-2: #29251f;
      --ink: #f6f1e9; --ink-2: #cdc4b8; --muted: #958c80;
      --line: #332e27; --border: rgba(255,255,255,.12); --wash: rgba(255,255,255,.05);
      --accent: #e57a5f; --accent-ink: #1b0f0b; --accent-soft: rgba(229,122,95,.16);
      --good: #5cc07a; --good-soft: rgba(92,192,122,.16);
      --bad: #ef6b6b; --bad-soft: rgba(239,107,107,.15);
      --warn: #e0a84a; --warn-soft: rgba(224,168,74,.16);
      --bar: #e57a5f;
      --zach-skin: #f3e2cf; --zach-hair: #8a6442; --zach-shirt: #4f86bd; --zach-ink: #1d1712;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35);
    }
  }
  * { box-sizing: border-box; min-width: 0; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; background: var(--plane); color: var(--ink);
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent;
    min-height: 100vh; min-height: 100dvh;
  }
  button, input, select { font: inherit; color: inherit; }
  button { cursor: pointer; }
  .serif { font-family: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif; }
  [hidden] { display: none !important; }

  /* ---------- top bar ---------- */
  header.top {
    position: sticky; top: 0; z-index: 20;
    background: color-mix(in srgb, var(--plane) 88%, transparent);
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--line);
    padding: max(10px, env(safe-area-inset-top)) 16px 10px;
  }
  .top-in { max-width: 920px; margin: 0 auto; display: flex; align-items: center; gap: 12px; }
  .brand { display: flex; align-items: center; gap: 8px; text-decoration: none; color: inherit; font-weight: 700; letter-spacing: -.01em; }
  .brand .dot { width: 30px; height: 30px; border-radius: 9px; background: var(--accent); color: var(--accent-ink);
    display: grid; place-items: center; font: 700 15px/1 Georgia, serif; }
  .brand small { display: block; font-weight: 500; color: var(--muted); font-size: .72rem; letter-spacing: 0; }
  nav.tabs { margin-left: auto; display: flex; gap: 4px; }
  nav.tabs button { border: 0; background: none; padding: 7px 11px; border-radius: 999px; color: var(--ink-2); font-weight: 600; font-size: .9rem; }
  nav.tabs button[aria-current="page"] { background: var(--accent-soft); color: var(--accent); }
  .icon-btn { border: 1px solid var(--border); background: var(--surface); width: 36px; height: 36px; border-radius: 10px;
    display: grid; place-items: center; padding: 0; flex: none; }
  .icon-btn svg { width: 18px; height: 18px; }
  .sm { display: none; }
  @media (max-width: 560px) {
    .brand small { display: none; }
    .lg { display: none; } .sm { display: inline; }
    .opt-row .seg button { padding: 7px 10px; }
    nav.tabs button { padding: 7px 8px; font-size: .84rem; }
  }

  @media (max-width: 430px) { .brand .name { display: none; } }

  main { max-width: 920px; margin: 0 auto; padding: 20px 16px 120px; }
  .screen { animation: fadeUp .25s ease both; }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

  h1, h2, h3 { letter-spacing: -.015em; line-height: 1.2; }
  h2 { font-size: 1.15rem; margin: 0 0 10px; }
  .muted { color: var(--muted); }
  .panel { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 18px; box-shadow: var(--shadow); }
  .stack > * + * { margin-top: 16px; }

  /* ---------- buttons & controls ---------- */
  .btn { border: 1px solid var(--border); background: var(--surface); padding: 11px 18px; border-radius: 12px; font-weight: 650;
    display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 46px; transition: transform .08s ease, background .15s; }
  .btn:active { transform: scale(.97); }
  .btn.primary { background: var(--accent); border-color: transparent; color: var(--accent-ink); }
  .btn.good { background: var(--good); border-color: transparent; color: #fff; }
  .btn.bad { background: var(--bad); border-color: transparent; color: #fff; }
  .btn.ghost { background: transparent; }
  .btn.small { min-height: 36px; padding: 6px 12px; font-size: .88rem; border-radius: 10px; }
  .btn:disabled { opacity: .45; cursor: default; }
  .seg { display: inline-flex; flex-wrap: wrap; background: var(--surface-2); border-radius: 12px; padding: 3px; gap: 2px; }
  .seg button { border: 0; background: none; padding: 7px 12px; border-radius: 9px; font-weight: 600; font-size: .9rem; color: var(--ink-2); }
  .seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 3px rgba(0,0,0,.12); }
  .opt-row { display: flex; align-items: center; justify-content: space-between; gap: 10px 16px; flex-wrap: wrap; padding: 10px 0; border-top: 1px solid var(--line); }
  .opt-row:first-child { border-top: 0; padding-top: 0; }
  .opt-row > span { font-weight: 600; font-size: .92rem; }
  .switch { display: inline-flex; align-items: center; gap: 10px; cursor: pointer; font-size: .92rem; font-weight: 600; }
  .switch input { appearance: none; -webkit-appearance: none; width: 42px; height: 25px; border-radius: 999px; background: var(--line);
    position: relative; transition: background .15s; margin: 0; flex: none; cursor: pointer; }
  .switch input::after { content: ""; position: absolute; top: 3px; left: 3px; width: 19px; height: 19px; border-radius: 50%; background: #fff;
    box-shadow: 0 1px 2px rgba(0,0,0,.25); transition: transform .15s; }
  .switch input:checked { background: var(--accent); }
  .switch input:checked::after { transform: translateX(17px); }

  /* ---------- home ---------- */
  .hero { display: flex; align-items: center; gap: 16px; padding: 6px 0 18px; }
  .hero .zach-face { width: 92px; flex: none; }
  .hero h1 { margin: 0 0 4px; font-size: 1.6rem; }
  .hero p { margin: 0; color: var(--ink-2); }
  .bubble-static { position: relative; background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 12px 14px; box-shadow: var(--shadow); }
  .bubble-static::before { content: ""; position: absolute; left: -8px; top: 26px; width: 14px; height: 14px; background: var(--surface);
    border-left: 1px solid var(--border); border-bottom: 1px solid var(--border); transform: rotate(45deg); }
  .chips-row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
  .pill { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 999px; background: var(--surface-2); font-size: .82rem; font-weight: 600; color: var(--ink-2); }
  .play-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .play-card { text-align: left; border: 1px solid var(--border); background: var(--surface); border-radius: 18px; padding: 18px; box-shadow: var(--shadow);
    display: flex; flex-direction: column; gap: 6px; transition: transform .12s ease, border-color .15s; }
  .play-card:hover { border-color: var(--accent); transform: translateY(-2px); }
  .play-card .art { height: 64px; display: flex; align-items: center; gap: 6px; }
  .play-card b { font-size: 1.2rem; }
  .play-card span { color: var(--ink-2); font-size: .9rem; }
  .play-card .go { color: var(--accent); font-weight: 700; font-size: .9rem; margin-top: 4px; }
  .mini-card { width: 40px; height: 52px; border-radius: 8px; border: 2px solid var(--accent); background: var(--accent-soft); display: grid; place-items: center; font-weight: 800; color: var(--accent); }
  .mini-card.b { transform: rotate(8deg); background: var(--surface); }
  .mini-tile { width: 26px; height: 20px; border-radius: 5px; background: var(--surface-2); border: 1.5px solid var(--border); }
  .mini-tile.on { background: var(--good-soft); border-color: var(--good); }
  .mini-grid { display: grid; grid-template-columns: repeat(4, 26px); gap: 4px; }
  @media (max-width: 520px) { .play-grid { grid-template-columns: 1fr; } .play-card .art { height: 52px; } }

  .course { border-top: 1px solid var(--line); padding: 12px 0 4px; }
  .course-head { display: flex; align-items: center; gap: 10px; justify-content: space-between; margin-bottom: 8px; }
  .course-head b { font-size: .95rem; }
  .topics { display: flex; flex-wrap: wrap; gap: 6px; }
  .topic { border: 1.5px solid var(--border); background: var(--surface); border-radius: 999px; padding: 6px 12px; font-size: .86rem; font-weight: 600; color: var(--ink-2);
    display: inline-flex; gap: 6px; align-items: center; }
  .topic em { font-style: normal; color: var(--muted); font-weight: 500; font-size: .78rem; }
  .topic[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); color: var(--ink); }
  .linkish { border: 0; background: none; color: var(--accent); font-weight: 650; font-size: .85rem; padding: 4px 2px; }
  .pool-note { font-size: .88rem; color: var(--ink-2); margin-top: 12px; padding: 10px 12px; border-radius: 10px; background: var(--surface-2); }
  .pool-note.warn { background: var(--warn-soft); }

  /* ---------- flashcards ---------- */
  .game-head { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
  .progress { flex: 1; height: 8px; border-radius: 999px; background: var(--surface-2); overflow: hidden; }
  .progress i { display: block; height: 100%; width: 0; background: var(--accent); border-radius: inherit; transition: width .3s ease; }
  .count { font-weight: 700; font-size: .9rem; color: var(--ink-2); font-variant-numeric: tabular-nums; }
  .streak { font-weight: 800; font-size: .9rem; color: var(--warn); min-width: 46px; text-align: right; transition: transform .2s; }
  .streak.pop { animation: pop .4s ease; }
  @keyframes pop { 40% { transform: scale(1.4); } }

  .scene { perspective: 1200px; max-width: 560px; margin: 0 auto; }
  .card { position: relative; height: clamp(230px, 38vh, 320px); transform-style: preserve-3d; transition: transform .55s cubic-bezier(.3,1.3,.5,1); cursor: pointer; }
  .card.flipped { transform: rotateY(180deg); }
  .face { position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden; border-radius: 22px;
    background: var(--surface); border: 1px solid var(--border); box-shadow: var(--shadow);
    display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 22px 22px 18px; }
  .face.back { transform: rotateY(180deg); }
  .face .tag { position: absolute; top: 14px; left: 16px; font-size: .72rem; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
  .face .topic-tag { position: absolute; top: 14px; right: 16px; font-size: .72rem; color: var(--muted); max-width: 55%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .word { font-size: clamp(1.5rem, 5.4vw, 2.3rem); font-weight: 700; line-height: 1.2; overflow-wrap: anywhere; }
  .word.long { font-size: clamp(1.15rem, 4vw, 1.6rem); }
  .word.es { cursor: pointer; text-decoration: underline dotted color-mix(in srgb, var(--accent) 60%, transparent); text-underline-offset: 6px; text-decoration-thickness: 2px; }
  .speak { margin-top: 14px; border: 1px solid var(--border); background: var(--surface-2); border-radius: 999px; padding: 6px 12px; display: inline-flex; gap: 6px; align-items: center; font-size: .82rem; font-weight: 650; color: var(--ink-2); }
  .speak svg { width: 16px; height: 16px; }
  .speak.talking { color: var(--accent); border-color: var(--accent); }
  .verdict { margin-top: 12px; font-weight: 700; font-size: .95rem; padding: 6px 12px; border-radius: 10px; }
  .verdict.ok { color: var(--good); background: var(--good-soft); }
  .verdict.close { color: var(--warn); background: var(--warn-soft); }
  .verdict.no { color: var(--bad); background: var(--bad-soft); }
  .marked { margin-top: 8px; font-size: .78rem; font-weight: 700; color: var(--muted); }
  .gave { margin-top: 6px; font-size: .86rem; color: var(--ink-2); }
  .gave s { color: var(--bad); }
  .card.right .face.back { border-color: var(--good); box-shadow: 0 0 0 3px var(--good-soft), var(--shadow); }
  .card.wrong .face.back { border-color: var(--bad); box-shadow: 0 0 0 3px var(--bad-soft), var(--shadow); }
  .shake { animation: shake .45s ease; }
  @keyframes shake { 15%,55% { translate: -9px 0; } 35%,75% { translate: 9px 0; } }
  .glow { animation: glow .6s ease; }
  @keyframes glow { 30% { scale: 1.035; } }

  .answer-area { max-width: 560px; margin: 16px auto 0; }
  .answer-row { display: flex; gap: 8px; }
  .answer-row input { flex: 1; min-height: 50px; border-radius: 12px; border: 1.5px solid var(--border); background: var(--surface); padding: 0 14px; font-size: 1.05rem; }
  .answer-row input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .accents { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 8px; }
  .accents button { border: 1px solid var(--border); background: var(--surface); border-radius: 8px; min-width: 36px; height: 34px; font-weight: 600; }
  .row-btns { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
  .row-btns .btn { flex: 1 1 150px; }
  .mic { width: 100%; min-height: 64px; font-size: 1.02rem; border-radius: 16px; }
  .mic.listening { background: var(--bad); color: #fff; border-color: transparent; animation: pulse 1.2s ease infinite; }
  @keyframes pulse { 50% { box-shadow: 0 0 0 10px var(--bad-soft); } }
  .hint { font-size: .82rem; color: var(--muted); text-align: center; margin-top: 10px; }
  kbd { font: 600 .74rem/1 ui-monospace, monospace; border: 1px solid var(--border); border-bottom-width: 2px; border-radius: 5px; padding: 2px 5px; background: var(--surface); }
  @media (hover: none) { .kbd-hint { display: none; } }

  /* ---------- match ---------- */
  .timer { font: 800 1.5rem/1 ui-monospace, "SF Mono", Menlo, monospace; font-variant-numeric: tabular-nums; }
  .penalty { color: var(--bad); font-weight: 800; font-size: .9rem; opacity: 0; transition: opacity .2s; }
  .penalty.show { opacity: 1; }
  .best-line { font-size: .85rem; color: var(--muted); }
  .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; position: relative; }
  .tile { border: 1.5px solid var(--border); background: var(--surface); border-radius: 14px; min-height: 104px; padding: 10px; box-shadow: var(--shadow);
    font-weight: 650; font-size: clamp(.86rem, 2.3vw, 1.02rem); line-height: 1.25; display: grid; place-items: center; text-align: center; overflow-wrap: anywhere;
    transition: transform .12s ease, background .15s, border-color .15s, opacity .3s; position: relative; }
  .tile .lang { position: absolute; top: 6px; left: 8px; font-size: .62rem; font-weight: 800; letter-spacing: .08em; color: var(--muted); }
  .tile.es { font-style: normal; }
  .tile.sel { border-color: var(--accent); background: var(--accent-soft); transform: scale(1.04); }
  .tile.ok { border-color: var(--good); background: var(--good-soft); animation: matchPop .45s ease forwards; }
  @keyframes matchPop { 40% { transform: scale(1.1); } 100% { transform: scale(.6); opacity: 0; visibility: hidden; } }
  .tile.no { border-color: var(--bad); background: var(--bad-soft); animation: shake .4s ease; }
  .countdown { position: absolute; inset: 0; display: grid; place-items: center; z-index: 3; font: 900 5rem/1 Georgia, serif; color: var(--accent);
    background: color-mix(in srgb, var(--plane) 70%, transparent); border-radius: 14px; }
  .countdown span { animation: cd .7s ease both; }
  @keyframes cd { from { transform: scale(2); opacity: 0; } 30% { transform: scale(1); opacity: 1; } }
  @media (max-width: 600px) {
    .grid { grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .tile { min-height: 92px; padding: 8px 6px; }
  }

  /* ---------- summary ---------- */
  .result-top { display: grid; grid-template-columns: auto 1fr; gap: 18px; align-items: center; }
  .result-top .zach-face { width: 110px; }
  .score-big { font: 800 2.6rem/1 Georgia, serif; letter-spacing: -.02em; }
  .say { font: 700 1.3rem/1.3 "Iowan Old Style", Palatino, Georgia, serif; margin: 6px 0; color: var(--accent); }
  .review-list { list-style: none; margin: 0; padding: 0; }
  .review-list li { display: grid; grid-template-columns: 22px 1fr auto; gap: 10px; align-items: center; padding: 10px 0; border-top: 1px solid var(--line); }
  .review-list li:first-child { border-top: 0; }
  .mark { font-weight: 900; text-align: center; }
  .mark.y { color: var(--good); } .mark.n { color: var(--bad); }
  .rw-es { font-weight: 700; cursor: pointer; }
  .rw-en { font-size: .86rem; color: var(--ink-2); }
  .status-seg { display: inline-flex; border: 1px solid var(--border); border-radius: 10px; overflow: hidden; flex: none; }
  .status-seg button { border: 0; background: var(--surface); padding: 6px 10px; font-size: .78rem; font-weight: 700; color: var(--muted); white-space: nowrap; }
  .status-seg button + button { border-left: 1px solid var(--border); }
  .status-seg button.on-p { background: var(--warn-soft); color: var(--warn); }
  .status-seg button.on-k { background: var(--good-soft); color: var(--good); }
  .times { list-style: none; margin: 0; padding: 0; counter-reset: t; }
  .times li { display: flex; justify-content: space-between; padding: 7px 10px; border-radius: 9px; font-variant-numeric: tabular-nums; counter-increment: t; }
  .times li::before { content: counter(t) "."; width: 24px; color: var(--muted); font-weight: 700; }
  .times li span:first-of-type { flex: 1; font-weight: 700; }
  .times li.me { background: var(--accent-soft); }
  @media (max-width: 520px) {
    .review-list li { grid-template-columns: 20px 1fr; }
    .review-list .status-seg { grid-column: 2; justify-self: start; }
    .result-top .zach-face { width: 84px; }
  }

  /* ---------- progress ---------- */
  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; }
  .stat { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 12px 14px; }
  .stat b { display: block; font-size: 1.55rem; line-height: 1.1; font-variant-numeric: tabular-nums; }
  .stat span { font-size: .8rem; color: var(--muted); font-weight: 600; }
  .bars { display: grid; gap: 10px; }
  .bar-row { display: grid; grid-template-columns: minmax(110px, 34%) 1fr 48px; gap: 10px; align-items: center; font-size: .88rem; }
  .bar-row .lbl { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--ink-2); }
  .bar-row .lbl small { color: var(--muted); }
  .track { height: 12px; background: var(--surface-2); border-radius: 4px; overflow: hidden; }
  .track i { display: block; height: 100%; background: var(--bar); border-radius: 0 4px 4px 0; }
  .bar-row .val { text-align: right; font-weight: 700; font-variant-numeric: tabular-nums; }
  @media (max-width: 520px) {
    .bar-row { grid-template-columns: 1fr 44px; row-gap: 4px; }
    .bar-row .lbl { grid-column: 1 / -1; white-space: normal; }
  }
  .coach { display: grid; grid-template-columns: 90px 1fr; gap: 16px; align-items: start; }
  .coach ul { margin: 0; padding-left: 18px; }
  .coach li { margin: 4px 0; font-family: "Iowan Old Style", Palatino, Georgia, serif; font-size: 1.04rem; }
  .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  @media (max-width: 680px) { .two-col { grid-template-columns: 1fr; } .coach { grid-template-columns: 64px 1fr; } }
  .missed { list-style: none; padding: 0; margin: 0; }
  .missed li { display: flex; justify-content: space-between; gap: 10px; padding: 7px 0; border-top: 1px solid var(--line); font-size: .92rem; }
  .missed li:first-child { border-top: 0; }
  .missed .n { color: var(--bad); font-weight: 700; white-space: nowrap; }

  /* ---------- library ---------- */
  .lib-tools { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .lib-tools input[type=search] { flex: 1 1 220px; min-height: 42px; border-radius: 12px; border: 1.5px solid var(--border); background: var(--surface); padding: 0 12px; }
  .lib-tools select { min-height: 42px; border-radius: 12px; border: 1.5px solid var(--border); background: var(--surface); padding: 0 10px; }
  .lib-topic { margin-top: 18px; }

const TOPICS = [], ENTRIES = [];
function topicFor(course, name, type = null) {
  let t = TOPICS.find(t => t.course === course && t.name === name);
  if (!t) { t = { id: TOPICS.length, course, name, type, entries: [] }; TOPICS.push(t); }
  return t;
}
function addEntry(topic, es, en, extra) {
  const e = Object.assign({ es, en, topic, key: norm(es) + '=' + norm(en) }, extra);
  e.type = topic.type || guessType(e);
  topic.entries.push(e);
  ENTRIES.push(e);
  return e;
}
// A topic's stable name for saved settings: ids change as shared words arrive, names do not.
const topicKey = t => t.course + '|' + t.name;
function courses() { return [...new Set(TOPICS.filter(t => t.entries.length).map(t => t.course))]; }
(function parse() {
  let course = '', topic = null;
  for (const raw of VOCAB.split('\n')) {
    const line = raw.trim();
    if (!line) continue;
    if (line.startsWith('@ ')) { course = line.slice(2).trim(); continue; }
    if (line.startsWith('# ')) {
      const [name, opt] = line.slice(2).split('|').map(s => s.trim());
      const type = opt && opt.startsWith('type=') ? opt.slice(5) : null;
      topic = topicFor(course, name, type);
      continue;
    }
    const i = line.indexOf(' = ');
    if (i < 0 || !topic) continue;
    addEntry(topic, line.slice(0, i).trim(), line.slice(i + 3).trim());
  }
})();

function guessType(e) {
  const first = e.es.split(',')[0].replace(/\([^)]*\)/g, '').trim();
  if (/^\(?to\b/i.test(e.en)) return 'verb';
  if (/^(el|la|los|las|un|una)\s/i.test(first)) return 'noun';
  if (/\s/.test(first) || /[.!?¡¿]/.test(first)) return 'expr';
  if (/(ar|er|ir|ír)(se)?$/.test(first) && /^to /.test(e.en)) return 'verb';
  return 'adj';
}

   ===================================================================== */
function norm(s) {
  return String(s).toLowerCase()
    .replace(/[¡!¿?.,;:"“”«»…]/g, ' ').replace(/[’‘`´']/g, '')
    .replace(/\s+/g, ' ').trim();
}
function deaccent(s) { return s.normalize('NFD').replace(/[̀-ͯ]/g, ''); }
const ART_RE = /^(el|la|los|las|un|una) /;
function article(s) { const m = s.match(ART_RE); return m ? m[1] : ''; }
function bare(s, lang) {
  return lang === 'es' ? s.replace(ART_RE, '') : s.replace(/^(to|the|a|an) /, '').replace(/^(its|it is) /, '');
}
function answerForms(text, lang) {
  let s = text.replace(/\+\s*infinitiv[eo]/gi, ' ').replace(/\.\.\./g, ' ');
  const out = new Set();
  const forms = [s.replace(/\([^)]*\)/g, ' '), s.replace(/[()]/g, ' ')];
  for (const f of forms) {
    out.add(f);
    for (const p of f.split(/[,\/;]/)) out.add(p);
  }
  return [...out].map(norm).filter(a => a && !/^(el|la|los|las|un|una|to|the)$/.test(a));
}
function lev(a, b) {
  if (Math.abs(a.length - b.length) > 2) return 9;
  const d = Array.from({ length: a.length + 1 }, (_, i) => [i]);
  for (let j = 1; j <= b.length; j++) d[0][j] = j;
  for (let i = 1; i <= a.length; i++) for (let j = 1; j <= b.length; j++)
  {
    d[i][j] = Math.min(d[i-1][j] + 1, d[i][j-1] + 1, d[i-1][j-1] + (a[i-1] === b[j-1] ? 0 : 1));
    if (i > 1 && j > 1 && a[i-1] === b[j-2] && a[i-2] === b[j-1]) d[i][j] = Math.min(d[i][j], d[i-2][j-2] + 1);
  }
  return d[a.length][b.length];
}
// A wrong article outranks a typo: "la abuelo" is a gender slip, not a spelling one.
const RANK = { exact: 0, accent: 1, gender: 2, typo: 3, wrong: 4 };
/* Returns {ok, kind}. kind: exact | accent | typo | gender | wrong */
function judge(given, expected, lang) {
  const u = norm(given);
  if (!u) return { ok: false, kind: 'wrong' };
  let best = { ok: false, kind: 'wrong' };
  const take = r => { if (RANK[r.kind] < RANK[best.kind]) best = r; };
  for (const a of answerForms(expected, lang)) {
    if (u === a) return { ok: true, kind: 'exact' };
    const ub = bare(u, lang), ab = bare(a, lang);
    const ua = article(u), aa = article(a);
    const sameWord = ub === ab, sameNoAcc = deaccent(ub) === deaccent(ab);
    if (lang === 'es' && ua && aa && ua !== aa && sameNoAcc) { take({ ok: false, kind: 'gender' }); continue; }
    if (sameWord) { take({ ok: true, kind: 'exact' }); continue; }
    if (sameNoAcc) { take({ ok: true, kind: 'accent' }); continue; }
    const L = deaccent(ab).length, tol = L >= 8 ? 2 : L >= 4 ? 1 : 0;
    if (tol && lev(deaccent(ub), deaccent(ab)) <= tol) take({ ok: true, kind: 'typo' });
  }
  return best;
}

  try {

    for (let from = 0; ; from += 1000) {
      const r = await fetch(`${CLOUD.url}/rest/v1/${CLOUD.table}?select=id,section,list,es,en,device_hash,made_at&order=id`, { headers: { ...cloudHead(), Range: `${from}-${from + 999}` } });

/* One pair per line: "Spanish = English", or a tab between them (spreadsheets, Quizlet exports), or " - ". */
function parsePairs(text, enFirst) {
  const ok = [], bad = [];
  for (const raw of text.split(/\r?\n/)) {
    const line = raw.trim();
    if (!line) continue;
    let parts = null;
    for (const sep of ['\t', ' = ', '=', ' – ', ' — ', ' - ']) {
      const i = line.indexOf(sep);
      if (i > 0) { parts = [line.slice(0, i).trim(), line.slice(i + sep.length).trim()]; break; }
    }
    if (!parts || !parts[0] || !parts[1]) { bad.push(line); continue; }
    ok.push(enFirst ? { es: parts[1], en: parts[0] } : { es: parts[0], en: parts[1] });
  }
  return { ok, bad };
}
function W(e) {
  return S.words[e.key] || (S.words[e.key] = { st: '', seen: 0, right: 0, wrong: 0, slips: {}, dir: {} });
}
function statusOf(e) { const w = S.words[e.key]; return w ? w.st : ''; }
function setStatus(e, st) { const w = W(e); if (w.st !== st) { w.st = st; w.stAt = Date.now(); queueSync(); } }
function today() { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
function record(e, ok, kind, dir) {
  const w = W(e);
  w.seen++; ok ? w.right++ : w.wrong++;
  if (kind === 'accent' || kind === 'typo' || kind === 'gender') w.slips[kind] = (w.slips[kind] || 0) + 1;
  const d = w.dir[dir] || (w.dir[dir] = [0, 0]);
  d[ok ? 0 : 1]++;
  w.last = Date.now();
  queueSync();
  const t = today();
  if (!S.days.includes(t)) S.days.push(t);
  save();
}
function dayStreak() {
  const set = new Set(S.days);
  let n = 0; const d = new Date();
  if (!set.has(today())) d.setDate(d.getDate() - 1);
  for (;;) {
    const k = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
    if (!set.has(k)) break;
    n++; d.setDate(d.getDate() - 1);
  }
  return n;
}

function uniq(list) { const seen = new Set(); return list.filter(e => !seen.has(e.key) && seen.add(e.key)); }
function buildPool(p = S.prefs) {
  const off = new Set(p.off);
  let list = uniq(ENTRIES.filter(e => !off.has(topicKey(e.topic))));
  const all = list.length;
  const known = list.filter(e => statusOf(e) === 'known').length;
  if (!p.showAll) list = list.filter(e => statusOf(e) !== 'known');
  return { list, all, known };
}
function weight(e) {
  const w = S.words[e.key];
  if (!w) return 2;
  let x = 1;
  if (w.st === 'practice') x += 3;
  if (w.seen) x += 4 * (w.wrong / w.seen);
  if (w.last && Date.now() - w.last < 5 * 60e3) x *= .3;
  return x;
}
function pick(list, n) {
  const items = list.map(e => ({ e, k: Math.pow(Math.random(), 1 / weight(e)) }));
  items.sort((a, b) => b.k - a.k);
  return items.slice(0, n).map(i => i.e);
}
function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.random() * (i + 1) | 0; [a[i], a[j]] = [a[j], a[i]]; } return a; }

let actx = null;
function tone(freq, t0, dur, type = 'sine', vol = .16) {
  const o = actx.createOscillator(), g = actx.createGain();
  o.type = type; o.frequency.setValueAtTime(freq, actx.currentTime + t0);
  g.gain.setValueAtTime(0, actx.currentTime + t0);
  g.gain.linearRampToValueAtTime(vol, actx.currentTime + t0 + .015);
  g.gain.exponentialRampToValueAtTime(.0001, actx.currentTime + t0 + dur);
  o.connect(g).connect(actx.destination);
  o.start(actx.currentTime + t0); o.stop(actx.currentTime + t0 + dur + .05);
}

/* Zach's hello on the home screen fits the moment: the hour, how long since the

function greeting() {
  const h = new Date().getHours();
  const lines = [];   // [weight, text]
  const add = (w, list) => list.forEach(t => lines.push([w, t]));
  add(1, SAY.hello);
  add(1.2, h < 5 ? ['¿Practicando a estas horas? ¡Qué dedicación!', '¿No puedes dormir? Practica conmigo.', 'Una rondita de medianoche… muy sexy.']
    : h < 12 ? ['¡Buenos días! ¿Un cafecito y unas palabras?', '¡Buenos días, guapa! Empecemos el día en español.']
    : h < 19 ? ['¡Buenas tardes! ¿Una rondita rápida?', '¡Buenas tardes! Hora de un descanso en español.']
    : ['¡Buenas noches! Unas palabras antes de dormir.', '¡Buenas noches, guapa! ¿Practicamos un ratito?']);
  const last = S.sessions[0] && S.sessions[0].at;
  if (!last) add(3, ['¡Hola! Soy Zach, tu entrenador. ¡Vamos a practicar juntos!']);
  else {
    const days = Math.floor((new Date().setHours(0, 0, 0, 0) - new Date(last).setHours(0, 0, 0, 0)) / 864e5);
    if (days === 0) add(1.5, ['¡Otra vez por aquí! ¡Me encanta!', '¿Otra ronda? ¡Así me gusta!']);
    else if (days === 1) add(1.5, ['¡Hola de nuevo! ¿Seguimos donde lo dejamos?']);
    else if (days < 7) add(3, [`¡Te extrañé! Hace ${days} días que no practicamos.`]);

  }
  const streak = dayStreak();
  if (streak >= 2 && !S.days.includes(today())) add(3, [`¡Llevas ${streak} días seguidos! ¡No rompas la racha!`]);
  // shared words from the last week she has not met yet
  const fresh = uniq(ENTRIES.filter(e => e.madeAt && Date.now() - Date.parse(e.madeAt) < 7 * 864e5 && !(S.words[e.key] && S.words[e.key].seen))).length;

}

   No accounts: the learner gets a private code like "k7pm-x2qd-9fhr". Every
   device with the code pulls the saved copy, merges it with its own, and
   pushes the result (supabase/functions/progress). For each word the copy

const SYNC_ABC = 'abcdefghjkmnpqrstuvwxyz23456789';   // no 0/o, 1/l/i look-alikes

  else if ((S.resetAt || 0) > (r.resetAt || 0)) r = Object.assign({}, r, empty);              // reset here; drop their older copy
  for (const [k, rw] of Object.entries(r.words || {})) {
    const lw = S.words[k];
    if (!lw) { S.words[k] = rw; continue; }
    const base = (rw.last || 0) > (lw.last || 0) ? rw : lw;
    const mark = (rw.stAt || 0) > (lw.stAt || 0) ? rw : lw;

      <div class="opt-row"><span>I answer by</span>${seg('answer', [['type', 'Typing'], ['speak', 'Speaking'], ['flip', '<span class="lg">Flip &amp; self-check</span><span class="sm">Flip</span>']], p.answer)}</div>
      <div class="opt-row"><span>Cards per round</span>${seg('count', [[10, '10'], [20, '20'], [50, '50'], [0, 'All']], p.count)}</div>
      <div class="opt-row"><span>Match</span><label class="switch"><input type="checkbox" data-flag="speakTiles" ${p.speakTiles ? 'checked' : ''}>Read Spanish tiles aloud</label></div>
      </div>

    <section class="panel">
      <h2>Choose your words</h2>
      <div class="opt-row" style="padding:0 0 10px;border:0">
        <label class="switch"><input type="checkbox" data-flag="showAll" ${p.showAll ? 'checked' : ''}>Show all words</label>
        <button class="linkish" id="toAdd">＋ Add new words</button>
      </div>
      <p class="muted" style="margin:0 0 6px;font-size:.86rem">When “Show all words” is off, words you marked “I know it” stay out of your games.</p>

  </div>`;

  const paintPool = () => {

      el.innerHTML = `<div class="pool-note warn">${courses().every(c => TOPICS.filter(t => t.course === c && t.entries.length).every(t => p.off.includes(topicKey(t)))) ? 'Pick at least one topic below.' : 'You know every word in these topics! Turn on “Show all words”, or pick more topics.'}</div>`;
    } else {

    }
    $$('[data-play]').forEach(b => b.disabled = !list.length || (b.dataset.play === 'match' && matchable(list).length < 6));
    if (list.length && matchable(list).length < 6) el.firstChild.insertAdjacentHTML('beforeend', ' Match needs at least 6 words.');
  };
  const paintOpts = () => {
    const n = buildPool().list.length;
    $('#optsNow').textContent = [{ en2es: 'EN → ES', es2en: 'ES → EN', mix: 'Mix' }[p.dir], { type: 'Typing', speak: 'Speaking', flip: 'Flip' }[p.answer], p.count ? `${Math.min(p.count, n)} cards` : `All ${n} cards`].join(' · ');
  };
  const paintTopics = () => {
    const off = new Set(p.off);

        <div class="topics">${ts.map(t => `<button class="topic" data-topic="${esc(topicKey(t))}" aria-pressed="${!off.has(topicKey(t))}">${esc(t.name)} <em>${t.entries.length}</em></button>`).join('')}</div></div>`;
    }).join('');
  };
  const refresh = () => { paintPool(); paintOpts(); };
  paintTopics(); refresh();
  onWordsChanged = () => { paintTopics(); refresh(); };
  $('#topicGroups').addEventListener('click', ev => {
    const b = ev.target.closest('button'); if (!b) return;
    const off = new Set(p.off);

    const c = b.dataset.all || b.dataset.none;
    if (c) TOPICS.filter(t => t.course === c).forEach(t => b.dataset.all ? off.delete(topicKey(t)) : off.add(topicKey(t)));
    p.off = [...off]; save();

  $$('.seg[data-pref]').forEach(sg => sg.addEventListener('click', ev => {
    const b = ev.target.closest('button'); if (!b) return;

    if (k === 'count') v = +v;
    p[k] = v; save();
    $$('button', sg).forEach(x => x.setAttribute('aria-pressed', String(x === b)));

  }));
  $$('[data-flag]').forEach(cb => cb.addEventListener('change', () => { p[cb.dataset.flag] = cb.checked; save(); refresh(); }));
  $('#toAdd').onclick = () => { libState.addOpen = true; go('library'); };

/* =====================================================================
   FLASHCARDS
   ===================================================================== */
function startFlash(custom) {
  const p = S.prefs;
  let cards;
  if (custom && custom.length) cards = shuffle(custom.slice());
  else { const { list } = buildPool(); cards = pick(list, p.count || list.length); }
  if (!cards.length) { go('home'); return; }
  const session = { mode: 'flash', items: [], start: Date.now() };
  let i = 0, streak = 0, phase = 'ask', dir = 'en2es', judged = null, rec = null, autoNext = 0;

  app.innerHTML = `<div class="screen">
    <div class="game-head">
      <button class="icon-btn" id="quit" title="Back" aria-label="Back to menu">✕</button>
      <div class="progress"><i id="bar"></i></div>
      <span class="count" id="count"></span>
      <span class="streak" id="streak"></span>
    </div>
    <div class="scene"><div class="card" id="card">
      <div class="face front"><span class="tag" id="fTag"></span><span class="topic-tag" id="fTopic"></span><div id="fBody"></div></div>
      <div class="face back"><span class="tag" id="bTag"></span><span class="topic-tag" id="bTopic"></span><div id="bBody"></div></div>
    </div></div>
    <div class="answer-area" id="area"></div>
  </div>`;
  const card = $('#card'), area = $('#area');
  $('#quit').onclick = () => session.items.length ? go('summary', session) : go('home');

  function wordHTML(text, lang) {
    const long = text.length > 26 ? ' long' : '';
    return lang === 'es'
      ? `<div class="word es serif${long}" data-say="${esc(text)}" title="Tap to hear it">${esc(text)}</div>${speakBtn(text)}`
      : `<div class="word${long}">${esc(text)}</div>`;
  }

  function show() {
    const e = cards[i];
    dir = p.dir === 'mix' ? (Math.random() < .5 ? 'en2es' : 'es2en') : p.dir;
    phase = 'ask'; judged = null;
    card.classList.remove('flipped', 'right', 'wrong');
    const fromLang = dir === 'en2es' ? 'en' : 'es';
    const front = fromLang === 'es' ? e.es : e.en, back = fromLang === 'es' ? e.en : e.es;
    $('#fTag').textContent = fromLang === 'es' ? 'Español' : 'English';
    $('#bTag').textContent = fromLang === 'es' ? 'English' : 'Español';
    $('#fTopic').textContent = $('#bTopic').textContent = e.topic.name;
    $('#fBody').innerHTML = wordHTML(front, fromLang);
    // back face is filled on reveal so it can't be peeked at
    $('#bBody').innerHTML = '';
    $('#bar').style.width = (100 * i / cards.length) + '%';
    $('#count').textContent = `${i + 1} / ${cards.length}`;
    paintStreak();
    renderAsk(e, fromLang === 'es' ? 'en' : 'es');
  }

  function paintStreak() { const s = $('#streak'); s.textContent = streak >= 2 ? `🔥 ${streak}` : ''; }

  function renderAsk(e, toLang) {
    const langName = toLang === 'es' ? 'Spanish' : 'English';
    if (p.answer === 'flip') {
      area.innerHTML = `<div class="row-btns"><button class="btn primary" id="reveal">Show answer</button></div>
        <p class="hint">Say it in your head, then flip. <span class="kbd-hint"><kbd>Space</kbd> flips</span></p>`;
      $('#reveal').onclick = () => reveal(null);
      card.onclick = ev => { if (!ev.target.closest('[data-say]') && phase === 'ask') reveal(null); };
      return;
    }
    const speak = p.answer === 'speak' && SR;
    area.innerHTML = `
      ${speak ? `<button class="btn mic" id="mic" type="button">${ICON.mic}<span id="micTxt">Tap and say it in ${langName}</span></button><p class="hint" id="heard"></p>` : ''}
      <form class="answer-row" id="form" autocomplete="off">
        <input id="ans" type="text" inputmode="text" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="${speak ? 'Or type' : 'Type'} it in ${langName}…" lang="${toLang}">
        <button class="btn primary" type="submit">Check</button>
      </form>
      ${toLang === 'es' ? `<div class="accents">${['á', 'é', 'í', 'ó', 'ú', 'ñ', 'ü', '¿', '¡'].map(c => `<button type="button" data-ch="${c}">${c}</button>`).join('')}</div>` : ''}
      <div class="row-btns"><button class="btn ghost small" id="idk" type="button">I don't know — show me</button></div>
      ${p.answer === 'speak' && !SR ? '<p class="hint">This browser cannot listen. Type your answer instead.</p>' : ''}`;
    const inp = $('#ans');
    card.onclick = null;
    if (!speak && matchMedia('(hover: hover)').matches) inp.focus();
    $('#form').onsubmit = ev => { ev.preventDefault(); check([inp.value]); };
    $('#idk').onclick = () => check(['']);
    $$('[data-ch]').forEach(b => b.onclick = () => {
      const s = inp.selectionStart ?? inp.value.length, en = inp.selectionEnd ?? s;
      inp.value = inp.value.slice(0, s) + b.dataset.ch + inp.value.slice(en);
      inp.focus(); inp.setSelectionRange(s + 1, s + 1);
    });
    if (speak) $('#mic').onclick = () => listen(toLang);
  }

  function listen(lang) {
    const btn = $('#mic'), txt = $('#micTxt');
    if (rec) { rec.abort(); return; }
    rec = new SR();
    rec.lang = lang === 'es' ? (listen.fallback ? 'es-ES' : 'es-MX') : 'en-US';
    rec.interimResults = false; rec.maxAlternatives = 5;
    btn.classList.add('listening'); txt.textContent = 'Listening… tap to stop';
    rec.onresult = ev => {
      const alts = [...ev.results[0]].map(a => a.transcript);
      $('#heard').textContent = `I heard: “${alts[0]}”`;
      check(alts);
    };
    rec.onerror = ev => {
      // "aborted" is the page stopping the listener itself after an answer, not a failure
      if (ev.error === 'aborted') return;
      if (ev.error === 'language-not-supported' && lang === 'es' && !listen.fallback) {
        listen.fallback = true;   // some browsers know es-ES but not es-MX: listen again with that
        retry = true;
        return;
      }
      const msg = {
        'not-allowed': 'The microphone is blocked for this page. Allow it in the address bar, then reload.',
        'service-not-allowed': "This browser's speech recognition is off. On a Mac or iPhone, turn on Dictation in Settings → Keyboard. Brave and some other browsers do not offer it; Chrome, Edge and Safari do.",
        'network': "Speech recognition needs the internet: the browser sends your voice to its speech service. Check the connection. Brave, Arc and some other browsers block this service; Chrome, Edge and Safari allow it.",
        'audio-capture': 'No microphone was found. Check that one is connected and chosen in your system settings.',
        'no-speech': "I didn't hear anything. Tap the button, then speak.",
        'language-not-supported': 'This browser cannot listen for Spanish. Type your answer instead.',
      }[ev.error] || `Could not listen (${ev.error}). Try again or type.`;
      console.warn('Speech recognition error:', ev.error);
      const h = $('#heard'); if (h) h.textContent = msg;
      toast(msg);
    };
    let retry = false;
    rec.onend = () => { rec = null; if (retry && btn.isConnected) { listen(lang); return; } if (btn.isConnected) { btn.classList.remove('listening'); txt.textContent = `Tap and say it in ${lang === 'es' ? 'Spanish' : 'English'}`; } };
    try { rec.start(); } catch (e) { rec = null; btn.classList.remove('listening'); }
  }

  function check(tries) {
    if (phase !== 'ask') return;
    const e = cards[i];
    const toLang = dir === 'en2es' ? 'es' : 'en';
    const expected = toLang === 'es' ? e.es : e.en;
    let best = { ok: false, kind: 'wrong' }, given = tries[0] || '';
    for (const t of tries) { const r = judge(t, expected, toLang); if (RANK[r.kind] < RANK[best.kind]) { best = r; given = t; } }
    judged = { ...best, given };
    reveal(judged);
  }

  function reveal(j) {
    if (phase !== 'ask') return;
    phase = 'shown';
    if (rec) { rec.abort(); rec = null; }
    const e = cards[i];
    const toLang = dir === 'en2es' ? 'es' : 'en';
    const back = toLang === 'es' ? e.es : e.en;
    let verdict = '';
    if (j) {
      const cls = j.ok ? (j.kind === 'exact' ? 'ok' : 'close') : 'no';
      const label = j.ok
        ? ({ exact: '✓ ¡Correcto!', accent: '✓ Correct — mind the accents', typo: '✓ Correct — check the spelling' }[j.kind])
        : j.kind === 'gender' ? '✗ Check the article (el / la)' : j.given.trim() ? '✗ Not quite' : 'Here it is';
      verdict = `<div class="verdict ${cls}">${label}</div>${j.given.trim() && j.kind !== 'exact' ? `<div class="gave">You said: ${j.ok ? esc(j.given) : `<s>${esc(j.given)}</s>`}</div>` : ''}`;
    }
    $('#bBody').innerHTML = wordHTML(back, toLang) + verdict;
    card.classList.add('flipped');
    sfx('flip');
    if (j) finish(j.ok, j.kind, j.given);
    else {
      area.innerHTML = `<div class="row-btns"><button class="btn bad" id="no">✗ Missed it</button><button class="btn good" id="yes">✓ Got it</button></div>
        <p class="hint kbd-hint"><kbd>←</kbd> missed · <kbd>→</kbd> got it</p>`;
      $('#no').onclick = () => finish(false, 'wrong', '');
      $('#yes').onclick = () => finish(true, 'exact', '');
    }
    card.onclick = ev => { if (!ev.target.closest('[data-say]')) { card.classList.toggle('flipped'); sfx('flip'); } };
  }

  function finish(ok, kind, given) {
    if (phase === 'done') return;
    phase = 'done';
    const e = cards[i];
    record(e, ok, kind, dir);
    const item = { e, ok, kind, given, dir };
    session.items.push(item);
    setStatus(e, ok ? 'known' : 'practice'); save();
    const back = $('#bBody');
    back.insertAdjacentHTML('beforeend', `<div class="marked">${ok ? '✓ Marked as known' : '⭐ Added to practice'}</div>`);
    feedback(ok, kind);
    if (p.answer === 'flip') {
      // self-check: the answer was the choice, so go straight on to the next card
      area.innerHTML = `<p class="hint">${i + 1 < cards.length ? 'Next card…' : 'Your results…'}</p>`;
      autoNext = setTimeout(next, 900);
      return;
    }
    area.innerHTML = `<div class="row-btns">
        ${!ok && p.answer !== 'flip' ? '<button class="btn ghost" id="override">I was right</button>' : ''}
        <button class="btn primary" id="next">${i + 1 < cards.length ? 'Next' : 'See results'} →</button></div>
      <p class="hint kbd-hint"><kbd>Enter</kbd> next</p>`;
    $('#next').onclick = next;
    const ov = $('#override');
    if (ov) ov.onclick = () => {
      // undo the miss and count it as right
      const w = W(e); w.wrong--; w.right++; const d = w.dir[dir]; if (d) { d[1]--; d[0]++; } save();
      item.ok = true; item.kind = 'exact'; streak++;
      setStatus(e, 'known'); save();
      const m = $('.marked', card); if (m) m.textContent = '✓ Marked as known';
      card.classList.remove('wrong'); card.classList.add('right');
      const v = $('.verdict', card); if (v) { v.className = 'verdict ok'; v.textContent = '✓ Counted as correct'; }
      sfx('right'); paintStreak(); ov.remove();
    };
    $('#next').focus({ preventScroll: true });
  }

  function feedback(ok, kind) {
    if (ok) {
      streak++;
      card.classList.add('right');
      card.classList.remove('glow'); void card.offsetWidth; card.classList.add('glow');
      sfx('right');
      const s = $('#streak'); paintStreak(); s.classList.remove('pop'); void s.offsetWidth; s.classList.add('pop');
      if (kind === 'accent' || kind === 'typo') zach(any(SAY[kind]), 'kind');
      else if (streak >= 3 && (streak === 3 || streak % 5 === 0)) {
        zach(streak >= 5 && Math.random() < .4 ? any(SAY.cheeky) : any(SAY.streak(streak)), 'grin', 2800);
        if (streak >= 5) confetti(40);
      }
      else if (p.answer === 'speak' && kind === 'exact' && Math.random() < .3) zach(any(SAY.spoken), 'grin', 2600);
      else if (Math.random() < .4) zach(any(SAY.right), 'happy', 1700);
    } else {
      const was = streak; streak = 0; paintStreak();
      card.classList.add('wrong');
      const sc = $('.scene'); sc.classList.remove('shake'); void sc.offsetWidth; sc.classList.add('shake');
      sfx('wrong');
      if (kind === 'gender') zach(any(SAY.gender), 'kind');
      else if (was >= 3 || Math.random() < .55) zach(any(SAY.wrong), 'kind');
    }
  }

  function next() {
    if (phase !== 'done') return;
    clearTimeout(autoNext);
    i++;
    if (i >= cards.length) { $('#bar').style.width = '100%'; go('summary', session); return; }
    show();
  }

  const onKey = ev => {
    if (ev.target.tagName === 'INPUT' && phase === 'ask') return;
    if (phase === 'done' && ev.key === 'Enter') { ev.preventDefault(); next(); }
    else if (p.answer === 'flip' && phase === 'ask' && (ev.key === ' ' || ev.key === 'Enter')) { ev.preventDefault(); reveal(null); }
    else if (p.answer === 'flip' && phase === 'shown' && ev.key === 'ArrowLeft') finish(false, 'wrong', '');
    else if (p.answer === 'flip' && phase === 'shown' && ev.key === 'ArrowRight') finish(true, 'exact', '');
  };
  document.addEventListener('keydown', onKey);
  cleanup = () => { document.removeEventListener('keydown', onKey); clearTimeout(autoNext); if (rec) rec.abort(); };
  show();
}

/* =====================================================================
   MATCH
   ===================================================================== */
function matchable(list) {
  const es = new Set(), en = new Set(), out = [];
  for (const e of list) {
    const a = norm(e.es), b = norm(e.en);
    if (es.has(a) || en.has(b)) continue;
    es.add(a); en.add(b); out.push(e);
  }
  return out;
}
function startMatch() {
  const { list } = buildPool();
  // choose 6 words whose Spanish and English are all different, so every pair has one answer
  const chosen = [];
  const seenEs = new Set(), seenEn = new Set();
  for (const e of pick(list, list.length)) {
    const a = norm(e.es), b = norm(e.en);
    if (seenEs.has(a) || seenEn.has(b)) continue;
    seenEs.add(a); seenEn.add(b); chosen.push(e);
    if (chosen.length === 6) break;
  }
  if (chosen.length < 6) { go('home'); return; }
  const tiles = shuffle(chosen.flatMap((e, k) => [{ k, lang: 'es', text: e.es }, { k, lang: 'en', text: e.en }]));
  const missed = new Set();
  let sel = null, done = 0, t0 = 0, penalty = 0, raf = 0, running = false, busy = false;
  const best = S.matchTimes[0];

  app.innerHTML = `<div class="screen">
    <div class="game-head">
      <button class="icon-btn" id="quit" title="Back" aria-label="Back to menu">✕</button>
      <div style="flex:1"><div class="timer" id="timer">0.0s</div><div class="best-line">${best ? `Best: ${fmtTime(best.ms)} — beat it!` : 'Set your first record!'}</div></div>
      <span class="penalty" id="pen">+1s</span>
    </div>
    <div class="grid" id="grid">
      ${tiles.map((t, n) => `<button class="tile ${t.lang}" data-n="${n}"><span class="lang">${t.lang === 'es' ? 'ES' : 'EN'}</span><span class="${t.lang === 'es' ? 'serif' : ''}">${esc(t.text)}</span></button>`).join('')}
      <div class="countdown" id="cd"></div>
    </div>
    <p class="hint">Tap a word, then tap its match. A wrong pair adds 1 second.</p>
  </div>`;
  $('#quit').onclick = () => go('home');
  const timer = $('#timer');
  const tick = () => { timer.textContent = fmtTime(Date.now() - t0 + penalty); raf = requestAnimationFrame(tick); };

  // 3 · 2 · 1 · ¡Ya!
  const cd = $('#cd'); let c = 3;
  const step = () => {
    if (!cd.isConnected) return;
    if (c === 0) { cd.innerHTML = '<span>¡Ya!</span>'; sfx('match'); setTimeout(() => { cd.remove(); running = true; t0 = Date.now(); tick(); }, 450); return; }
    cd.innerHTML = `<span>${c}</span>`; sfx('tick'); c--; setTimeout(step, 650);
  };
  step();

  $('#grid').addEventListener('click', ev => {
    const b = ev.target.closest('.tile');
    if (!b || !running || busy || b.classList.contains('ok')) return;
    const t = tiles[+b.dataset.n];
    if (t.lang === 'es' && S.prefs.speakTiles) speakEs(t.text);   // speakEs stays quiet when muted
    if (!sel) { sel = b; b.classList.add('sel'); return; }
    if (sel === b) { b.classList.remove('sel'); sel = null; return; }
    const a = tiles[+sel.dataset.n];
    if (a.lang === t.lang) { sel.classList.remove('sel'); sel = b; b.classList.add('sel'); return; }
    const first = sel; sel = null;
    first.classList.remove('sel');
    if (a.k === t.k) {
      first.classList.add('ok'); b.classList.add('ok'); sfx('match');
      done++;
      if (done === 6) win();
    } else {
      busy = true;
      missed.add(a.k); missed.add(t.k);
      first.classList.add('no'); b.classList.add('no'); sfx('wrong');
      penalty += 1000;
      const pen = $('#pen'); pen.classList.add('show'); setTimeout(() => pen.classList.remove('show'), 700);
      setTimeout(() => { first.classList.remove('no'); b.classList.remove('no'); busy = false; }, 420);
    }
  });

  function win() {
    running = false; cancelAnimationFrame(raf);
    const ms = Date.now() - t0 + penalty;
    timer.textContent = fmtTime(ms);
    chosen.forEach((e, k) => record(e, !missed.has(k), missed.has(k) ? 'wrong' : 'exact', 'match'));
    const prevBest = S.matchTimes[0] ? S.matchTimes[0].ms : Infinity;
    const entry = { ms, at: Date.now() };
    S.matchTimes.push(entry);
    S.matchTimes.sort((x, y) => x.ms - y.ms);
    S.matchTimes = S.matchTimes.slice(0, 10);
    save(); queueSync();
    const record_ = ms < prevBest;
    const session = { mode: 'match', items: chosen.map((e, k) => ({ e, ok: !missed.has(k), kind: missed.has(k) ? 'wrong' : 'exact', dir: 'match' })), start: t0, ms, record: record_, entryAt: entry.at, prevBest };
    setTimeout(() => go('summary', session), 500);
  }
  cleanup = () => cancelAnimationFrame(raf);
}

/* =====================================================================
   SUMMARY + MARK WORDS
   ===================================================================== */
function renderSummary(session) {
  const items = session.items;
  const right = items.filter(x => x.ok).length;
  const score = items.length ? right / items.length : 0;
  S.sessions.unshift({ at: Date.now(), mode: session.mode, n: items.length, right, ms: session.ms || null });
  S.sessions = S.sessions.slice(0, 50);
  save(); queueSync();

  // Default marks: missed words go on the practice list; the rest keep their status.
  const marks = new Map();
  const byKey = new Map();
  items.forEach(x => { byKey.set(x.e.key, x.e); });
  for (const [k, e] of byKey) {
    const miss = items.some(x => x.e.key === k && !x.ok);
    marks.set(k, miss ? 'practice' : session.mode === 'flash' ? 'known' : statusOf(e));
  }

  let mood, line;
  if (session.mode === 'match') {
    line = session.record ? any(Math.random() < .5 ? SAY.cheeky : SAY.record) : score === 1 ? any(SAY.matchDone) : any(score >= .5 ? SAY.ok : SAY.low);
    mood = session.record || score === 1 ? 'grin' : 'kind';
  } else {
    const bucket = score >= .9 ? 'great' : score >= .7 ? 'good' : score >= .5 ? 'ok' : 'low';
    line = score === 1 && items.length >= 5 ? any(SAY.perfect)
      : bucket === 'great' && Math.random() < .5 ? any(SAY.cheeky)
      : any(SAY[bucket]);
    mood = bucket === 'great' ? 'grin' : bucket === 'good' ? 'happy' : 'kind';
  }

  const missedCards = [...byKey.values()].filter(e => marks.get(e.key) === 'practice');
  app.innerHTML = `<div class="screen stack">
    <section class="panel result-top">
      ${zachSVG(mood)}
      <div>
        <div class="score-big">${session.mode === 'match' ? fmtTime(session.ms) : `${right} / ${items.length}`}</div>
        <div class="say" data-say="${esc(line)}" title="Tap to hear Zach">${esc(line)}</div>
        <div class="muted">${session.mode === 'match'
          ? (session.record ? (isFinite(session.prevBest) ? `New record! You beat ${fmtTime(session.prevBest)}.` : 'Your first record!') : `Your best is ${fmtTime(S.matchTimes[0].ms)}.`)
          : `${Math.round(score * 100)}% correct`}</div>
      </div>
    </section>

    ${session.mode === 'match' ? `<section class="panel"><h2>Fastest times</h2><ol class="times">${S.matchTimes.slice(0, 5).map(t => `<li class="${t.at === session.entryAt ? 'me' : ''}"><span>${fmtTime(t.ms)}</span><span class="muted">${new Date(t.at).toLocaleDateString()}</span></li>`).join('')}</ol></section>` : ''}

    <section class="panel">
      <h2>How did these feel?</h2>
      <p class="muted" style="margin:-4px 0 10px;font-size:.9rem">Mark words to keep practicing, or that you know. Words you know stop showing up, unless you turn on “Show all words”.</p>
      <ul class="review-list">${[...byKey.values()].map(e => {
        const ok = items.filter(x => x.e.key === e.key).every(x => x.ok);
        const m = marks.get(e.key);
        return `<li data-k="${esc(e.key)}"><span class="mark ${ok ? 'y' : 'n'}">${ok ? '✓' : '✗'}</span>
          <div><div class="rw-es serif" data-say="${esc(e.es)}">${esc(e.es)}</div><div class="rw-en">${esc(e.en)}</div></div>
          <div class="status-seg"><button data-s="practice" class="${m === 'practice' ? 'on-p' : ''}">⭐ Keep practicing</button><button data-s="known" class="${m === 'known' ? 'on-k' : ''}">✓ I know it</button></div></li>`;
      }).join('')}</ul>
      <div class="row-btns" style="margin-top:14px">
        <button class="btn small" id="allKnown">Mark all correct as known</button>
      </div>
    </section>

    <div class="row-btns">
      <button class="btn" id="home">Save &amp; menu</button>
      ${session.mode === 'flash' ? `<button class="btn" id="retry" ${missedCards.length ? '' : 'hidden'}>Practice these again</button>` : ''}
      <button class="btn primary" id="again">Save &amp; play again</button>
    </div>
  </div>`;

  $$('.review-list li').forEach(li => li.addEventListener('click', ev => {
    const b = ev.target.closest('[data-s]'); if (!b) return;
    const k = li.dataset.k, s = b.dataset.s;
    const nowOn = marks.get(k) === s ? '' : s;
    marks.set(k, nowOn);
    $$('[data-s]', li).forEach(x => x.className = x.dataset.s === nowOn ? (nowOn === 'practice' ? 'on-p' : 'on-k') : '');
  }));
  $('#allKnown').onclick = () => {
    $$('.review-list li').forEach(li => {
      const k = li.dataset.k;
      if (items.filter(x => x.e.key === k).every(x => x.ok)) {
        marks.set(k, 'known');
        $$('[data-s]', li).forEach(x => x.className = x.dataset.s === 'known' ? 'on-k' : '');
      }
    });
  };
  const commit = () => {
    let k = 0, pr = 0;
    for (const [key, m] of marks) { const e = byKey.get(key); setStatus(e, m); if (m === 'known') k++; if (m === 'practice') pr++; }
    save();
    return { k, pr };
  };
  $('#home').onclick = () => { commit(); go('home'); };
  $('#again').onclick = () => { commit(); go(session.mode); };
  const retry = $('#retry');
  if (retry) retry.onclick = () => { commit(); go('flash', [...byKey.values()].filter(e => marks.get(e.key) === 'practice')); };

  // celebrate
  if (session.record) { sfx('fanfare'); confetti(110); }
  else if (score >= .9 && items.length >= 5) { sfx('fanfare'); confetti(80); }
  setTimeout(() => speakEs(line), 350);
}

function aggregate() {
  const byType = {}, byTopic = new Map(), dir = { en2es: [0, 0], es2en: [0, 0], match: [0, 0] }, slips = { accent: 0, gender: 0, typo: 0 };
  let seenWords = 0, right = 0, wrong = 0;
  const words = [];
  for (const e of uniq(ENTRIES)) {
    const w = S.words[e.key];
    if (!w || !w.seen) continue;
    seenWords++; right += w.right; wrong += w.wrong;
    const t = byType[e.type] || (byType[e.type] = [0, 0]); t[0] += w.right; t[1] += w.wrong;
    const tp = byTopic.get(e.topic) || [0, 0]; tp[0] += w.right; tp[1] += w.wrong; byTopic.set(e.topic, tp);
    for (const d in w.dir) { if (dir[d]) { dir[d][0] += w.dir[d][0]; dir[d][1] += w.dir[d][1]; } }
    for (const s in w.slips) slips[s] = (slips[s] || 0) + w.slips[s];
    words.push({ e, w });
  }
  return { byType, byTopic, dir, slips, seenWords, right, wrong, words };
}
function advice(a) {
  const tips = [];
  if (a.right + a.wrong < 15) return ['¡Juega unas rondas más y te daré consejos personalizados!'];
  const types = Object.entries(a.byType).filter(([, v]) => v[0] + v[1] >= 6).map(([k, v]) => [k, pct(...v)]).sort((x, y) => x[1] - y[1]);
  if (types.length) {
    const top = types[types.length - 1];
    if (top[1] >= 80) tips.push(`¡${TYPE_ES[top[0]][0].toUpperCase() + TYPE_ES[top[0]].slice(1)} te salen genial! (${top[1]}% de aciertos)`);
    const low = types[0];
    if (low[1] < 75 && low[0] !== top[0]) tips.push({
      verb: `Los verbos son tu reto (${low[1]}%). Di cada verbo en voz alta y úsalo en una frase.`,
      noun: `Los sustantivos te cuestan (${low[1]}%). Apréndelos siempre con su artículo: el, la, los, las.`,
      adj: `Los adjetivos te cuestan (${low[1]}%). Piensa en una persona o cosa que cada uno describa.`,
      expr: `Las expresiones largas te cuestan (${low[1]}%). Repítelas en voz alta como una frase completa.`,
    }[low[0]]);
  }
  const topics = [...a.byTopic].filter(([, v]) => v[0] + v[1] >= 5).map(([t, v]) => [t, pct(...v)]).sort((x, y) => x[1] - y[1]);
  if (topics.length && topics[0][1] < 70) tips.push(`Repasa el tema «${topics[0][0].name}»: ahí fallas más (${topics[0][1]}%).`);
  const e2s = a.dir.en2es, s2e = a.dir.es2en;
  if (e2s[0] + e2s[1] >= 8 && s2e[0] + s2e[1] >= 8) {
    const d = pct(...e2s) - pct(...s2e);
    if (d <= -12) tips.push('Te cuesta más pasar del inglés al español. Elige «English → Spanish» unas rondas.');
    else if (d >= 12) tips.push('Te cuesta más entender el español. Elige «Spanish → English» y escucha cada palabra.');
  }
  if (a.slips.accent >= 3) tips.push('Ojo con las tildes: á, é, í, ó, ú y la ñ también cuentan.');
  if (a.slips.gender >= 2) tips.push('A veces confundes el y la. Di siempre el artículo junto con la palabra.');
  const worst = a.words.filter(x => x.w.wrong >= 2).sort((x, y) => y.w.wrong - x.w.wrong)[0];
  if (worst) tips.push(`Tu palabra más difícil es «${worst.e.es}». ¡Practícala hoy!`);
  if (!tips.length) tips.push('¡Vas muy bien! Sigue practicando un poco cada día.');
  return tips.slice(0, 5);
}
function barRows(rows) {
  if (!rows.length) return '<p class="muted" style="font-size:.9rem">Not enough answers yet.</p>';
  return `<div class="bars">${rows.map(r => `<div class="bar-row" title="${esc(r.label)}: ${r.p}% correct over ${r.n} answers">
    <span class="lbl">${esc(r.label)} <small>· ${r.n}</small></span><span class="track"><i style="width:${r.p}%"></i></span><span class="val">${r.p}%</span></div>`).join('')}</div>`;
}

        return `<li data-k="${esc(e.key)}"><span class="mark ${st === 'known' ? 'y' : ''}" style="color:var(--warn)">${st === 'practice' ? '⭐' : st === 'known' ? '<span style="color:var(--good)">✓</span>' : ''}</span>
          <div><div class="rw-es serif" data-say="${esc(e.es)}">${esc(e.es)}</div><div class="rw-en">${esc(e.en)}${w && w.seen ? ` <span class="lib-score">· ✓${w.right} ✗${w.wrong}</span>` : ''}</div>${e.shared && myHash && e.owner === myHash ? `<button class="del" data-del="${e.shared}">Added by you · Delete</button>` : ''}</div>
          <div class="status-seg"><button data-s="practice" class="${st === 'practice' ? 'on-p' : ''}">⭐ Practice</button><button data-s="known" class="${st === 'known' ? 'on-k' : ''}">✓ Known</button></div></li>`;
      }).join('')}</ul></div>`;
    }).join('');
    $('#libList').innerHTML = html || '<p class="muted">No words match.</p>';
    $('#libActions').innerHTML = knownShown.length ? `<button class="btn small" id="restore">Bring back all ${knownShown.length} known word${knownShown.length === 1 ? '' : 's'} shown</button>` : '';
    const r = $('#restore');
    if (r) r.onclick = () => { knownShown.forEach(e => setStatus(e, '')); save(); toast(`${knownShown.length} word${knownShown.length === 1 ? '' : 's'} back in your games.`); paint(); };
  };
  paint();
  // new shared words: redraw the whole screen (new lists join the menu), unless they are typing
  onWordsChanged = () => text.value.trim() ? paint() : renderLibrary();
  syncWords();
  $('#q').addEventListener('input', ev => { libState.q = ev.target.value; paint(); });
  $('#course').addEventListener('change', ev => { libState.course = ev.target.value; paint(); });
  $('.seg[data-pref="libfilter"]').addEventListener('click', ev => {
    const b = ev.target.closest('button'); if (!b) return;
    libState.filter = b.dataset.v;
    $$('.seg[data-pref="libfilter"] button').forEach(x => x.setAttribute('aria-pressed', String(x === b)));
    paint();
  });
  $('#libList').addEventListener('click', ev => {
    const d = ev.target.closest('[data-del]');
    if (d) {
      // first tap arms, second tap deletes
      if (!d.dataset.armed) { d.dataset.armed = '1'; d.textContent = 'Tap again to delete'; d.style.color = 'var(--bad)'; return; }
      d.textContent = 'Deleting…';
      deleteShared(+d.dataset.del).then(() => {
        toast('Word deleted.');
        if (!courses().includes(libState.course)) libState.course = 'all';
        paint();
      }, e => { toast(`Could not delete: ${e.message}`); paint(); });
      return;
    }
    const b = ev.target.closest('[data-s]'); if (!b) return;
    const li = b.closest('li'), key = li.dataset.k;
    const e = ENTRIES.find(x => x.key === key);
    const st = statusOf(e) === b.dataset.s ? '' : b.dataset.s;
    // the same word can sit in two topics; they share one status
    setStatus(e, st); save();
    $$(`li[data-k="${CSS.escape(key)}"]`).forEach(row => {
      $$('[data-s]', row).forEach(x => x.className = x.dataset.s === st ? (st === 'practice' ? 'on-p' : 'on-k') : '');
      $('.mark', row).innerHTML = st === 'practice' ? '⭐' : st === 'known' ? '<span style="color:var(--good)">✓</span>' : '';
    });
  });
}

go('home');
(function startSync() {
  const m = location.hash.match(/sync=([a-z0-9-]+)/i);
  if (m && validCode(m[1])) {
    history.replaceState(null, '', location.pathname + location.search);   // keep the code out of the address bar
    linkSync(m[1]).then(ok => toast(ok ? '☁ Linked! Your progress now follows you between devices.' : 'Could not reach the server to link. Try the link again.'));
  } else syncNow();
})();
</script>
</body>
</html>
