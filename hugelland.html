      const q = queue.pop();
      for (const j of around(q)) if (!done.has(j) && roleOf.get(j) === role) { done.add(j); group.push(j); queue.push(j); }
    }
    const gx = group.map(colOf), gy = group.map(rowOf);
    const x0 = Math.min(...gx), y0 = Math.min(...gy), gw = Math.max(...gx) - x0 + 1, gh = Math.max(...gy) - y0 + 1;
    if (gw * gh === group.length) {
      roofFor(g, role, d, UI.BX + x0 * S + pad, UI.BY + y0 * S + dy + pad, gw * S - pad * 2, gh * S - pad * 2, baking);
    } else {
      for (const q of group) roofFor(g, role, d, cellX(q) + pad, cellY(q) + dy + pad, S - pad * 2, S - pad * 2, baking);
    }
    if (!sign || group.length > sign.n) sign = { n: group.length, x: UI.BX + (x0 + gw / 2) * S, y: UI.BY + (y0 + gh / 2) * S + dy, w: gw * S - pad * 2, h: gh * S - pad * 2 };
  }
  const way = d.roles.includes("rail") ? "rail" : d.bridge ? "deck" : null;
  if (way) alive(g, d.bridge ? "wagon" : "train", 0, 0, hash(cells[0], 9), { ...route(d, cells, way, dy), freight: d === DEF.freight });
  if (d.extra === "birds") alive(g, "birds", cells.reduce((sum, c) => sum + cellX(c), 0) / cells.length + S / 2,
                                cells.reduce((sum, c) => sum + cellY(c), 0) / cells.length + S / 2 + dy, hash(cells[0], 8));
  else if (d.extra && sign) extra(g, d, sign, cells, dy, baking);
  // A name board standing on the lower slope of the biggest roof. False fronts paint theirs on instead.
  if (d.sign && d.style !== "front" && sign) {
    if (sign.w >= sign.h) signBoard(g, sign.x, sign.y + sign.h * .22, sign.w * .78, Math.min(sign.h * .3, S * .3), d.sign, d.roof, false, true);
    else signBoard(g, sign.x + sign.w * .22, sign.y, sign.h * .78, Math.min(sign.w * .3, S * .3), d.sign, d.roof, true, true);
  }
  if (d.emblem && sign) emblem(g, d.emblem, sign.x, sign.y);
}

/* A raised tile with a building on it. `lift` raises the whole tile off the board. */
function drawPiece(g, type, cells, lift, baking) {
  const d = DEF[type], S = UI.S, ins = S * .075, r = S * .16, th = S * .085, tile = d.tile || TILE[d.cat];
  g.save();
  g.shadowColor = "rgba(18,28,24,.4)"; g.shadowBlur = S * .14 + lift * .5; g.shadowOffsetY = S * .05 + lift * .5;
  union(g, cells, ins, r, 0); g.fillStyle = tile[1]; g.fill();
  g.restore();
  if (lift) { union(g, cells, ins, r, -lift); g.fillStyle = tile[1]; g.fill(); }
  union(g, cells, ins, r, -lift - th - 1); g.fillStyle = "rgba(255,255,255,.7)"; g.fill();
  union(g, cells, ins, r, -lift - th); g.fillStyle = tile[0]; g.fill();
  art(g, type, cells, -lift - th, baking);
}

/* The board without anything that moves: land, streets and settled buildings. */
function bake() {
  UI.dirty = false;
  SMOKE.length = 0; LIVE.length = 0;
  lg.setTransform(UI.dpr, 0, 0, UI.dpr, 0, 0);
  lg.clearRect(0, 0, UI.w, UI.h);
  drawLand(lg);
  const built = [];
  for (let i = 0; i < N; i++) if (OWNER[i] >= 0 && MAP[i] !== "water") built.push(i);
  // Streets under the town, so gaps between buildings read as lanes.
  lg.save(); lg.beginPath(); rr(lg, UI.BX, UI.BY, COLS * UI.S, ROWS * UI.S, UI.S * .26); lg.clip();
  union(lg, built, UI.S * .01, UI.S * .2); lg.fillStyle = "#e6dcc6"; lg.fill();
  union(lg, built, UI.S * .045, UI.S * .18); lg.fillStyle = "#ddd1b8"; lg.fill();
  // Lots: one for each district, in its colour, so buildings of one kind that touch read as one patch.
  for (const group of districts()) {
    const cells = group.flatMap(k => G.pieces[k].cells).filter(c => MAP[c] !== "water");
    const lot = LOT[DEF[G.pieces[group[0]].type].cat];
    union(lg, cells, UI.S * .02, UI.S * .22); lg.fillStyle = lot[0]; lg.fill();
    union(lg, cells, UI.S * .05, UI.S * .19); lg.fillStyle = lot[1]; lg.fill();
  }
  lg.restore();
  const order = G.pieces.map((p, k) => k).sort((a, b) => Math.min(...G.pieces[a].cells) - Math.min(...G.pieces[b].cells));
  for (const k of order) if (!UI.drop || UI.drop.k !== k) drawPiece(lg, G.pieces[k].type, G.pieces[k].cells, 0, true);
}

/* Every district in town, as lists of building indexes. */
function districts() {
  const seen = new Set(), out = [];
  G.pieces.forEach((p, k) => {
    if (seen.has(k) || DEF[p.type].bridge) return;
    const group = [k, ...districtOf(p.type, p.cells, k)];
    group.forEach(j => seen.add(j));
    out.push(group);
  });
  return out;
}

/* ───────────────────────── Things that move ───────────────────────── */

const FX = { walkers: [], puffs: [], dust: [], floats: [], confetti: [], smokeClock: 0 };
const SHIRTS = ["#d65a45", "#3f79b5", "#4f9a5f", "#e3a92f", "#8a5fb0", "#f4efe4", "#2f6b73", "#c2703f"];
const SKIN = ["#f1cfae", "#d9a77f", "#a8744f", "#7a5236"];

/* A lane runs along a grid line that has a building on at least one side, and isn't inside one building. */
function lane(ax, ay, bx, by) {
  let a, b;
  if (ay === by) { const x = Math.min(ax, bx); a = inside(x, ay - 1) ? OWNER[idx(x, ay - 1)] : -2; b = inside(x, ay) ? OWNER[idx(x, ay)] : -2; }
  else { const y = Math.min(ay, by); a = inside(ax - 1, y) ? OWNER[idx(ax - 1, y)] : -2; b = inside(ax, y) ? OWNER[idx(ax, y)] : -2; }
  return (a >= 0 || b >= 0) && !(a >= 0 && a === b);
}
function exits(x, y) {
  return N4.map(([dx, dy]) => [x + dx, y + dy])
    .filter(([nx, ny]) => nx >= 0 && ny >= 0 && nx <= COLS && ny <= ROWS && lane(x, y, nx, ny));
}

function spawnWalker() {
  const spots = [];
  for (let y = 0; y <= ROWS; y++) for (let x = 0; x <= COLS; x++) if (exits(x, y).length) spots.push([x, y]);
  if (!spots.length) return null;
  const [x, y] = pick(spots);
  return { ax: x, ay: y, bx: x, by: y, t: 1, speed: .55 + Math.random() * .45, wait: Math.random() * 2,
           shirt: pick(SHIRTS), skin: pick(SKIN), phase: Math.random() * 6, fade: 0 };
}

function updateWalkers(dt) {
  const homes = G.pieces.filter(p => DEF[p.type].cat === "home").length;
  const want = Math.min(34, Math.round(G.pieces.length * 1.1 + homes * 1.4));
  if (FX.walkers.length < want && Math.random() < dt * 2) { const w = spawnWalker(); if (w) FX.walkers.push(w); }
  if (FX.walkers.length > want) FX.walkers.length = want;
  for (let n = FX.walkers.length - 1; n >= 0; n--) {
    const w = FX.walkers[n];
    w.fade = Math.min(1, w.fade + dt * 2);
    if (w.wait > 0) { w.wait -= dt; continue; }
    w.t += dt * w.speed;
    if (w.t < 1) continue;
    w.ax = w.bx; w.ay = w.by; w.t = 0;
    let next = exits(w.ax, w.ay);
    if (!next.length) { FX.walkers.splice(n, 1); continue; }
    if (next.length > 1) next = next.filter(([x, y]) => x !== w.px || y !== w.py) ;
    const [nx, ny] = pick(next.length ? next : exits(w.ax, w.ay));
    w.px = w.ax; w.py = w.ay; w.bx = nx; w.by = ny;
    if (Math.random() < .12) w.wait = .6 + Math.random() * 1.6;
  }
}

function drawWalkers(g, now) {
  const S = UI.S;
  for (const w of FX.walkers) {
    const t = w.wait > 0 ? 0 : w.t;
    const x = UI.BX + (w.ax + (w.bx - w.ax) * t) * S, y = UI.BY + (w.ay + (w.by - w.ay) * t) * S;
    const bob = w.wait > 0 ? 0 : Math.abs(Math.sin(now * 9 + w.phase)) * S * .02;
    g.globalAlpha = w.fade;
    ellipse(g, x + S * .02, y + S * .045, S * .065, S * .035, "rgba(20,20,15,.22)");
    circle(g, x, y - bob, S * .06, w.shirt);
    circle(g, x, y - bob - S * .02, S * .036, w.skin);
    g.globalAlpha = 1;
  }
}

function updateSmoke(dt) {
  FX.smokeClock -= dt;
  if (FX.smokeClock <= 0 && SMOKE.length) {
    FX.smokeClock = 1.6 / Math.max(1, SMOKE.length * .6);
    const [x, y, dark] = pick(SMOKE);
    FX.puffs.push({ x, y, t: 0, dark, drift: .5 + Math.random() * .5 });
  }
  for (const p of FX.puffs) p.t += dt;
  FX.puffs = FX.puffs.filter(p => p.t < 2.4);
}
function drawSmoke(g) {
  const S = UI.S;
  for (const p of FX.puffs) {
    const k = p.t / 2.4, a = (1 - k) * Math.min(1, p.t * 4) * .5;
    circle(g, p.x + k * S * .35 * p.drift, p.y - k * S * .5, S * (.04 + k * .1), p.dark ? `rgba(90,90,95,${a})` : `rgba(255,255,255,${a})`);
  }
}

function drawWater(g, now) {
  const S = UI.S;
  g.strokeStyle = "rgba(255,255,255,.5)"; g.lineWidth = Math.max(1, S * .03); g.lineCap = "round";
  g.beginPath();
  for (let i = 0; i < N; i++) {
    if (MAP[i] !== "water" || OWNER[i] >= 0) continue;
    for (let k = 0; k < 2; k++) {
      const ph = (now * .07 + hash(i, k + 80)) % 1;
      const x = cellX(i) + S * (.25 + .5 * ph), y = cellY(i) + S * (.3 + .4 * hash(i, k + 90));
      const len = S * .1 * Math.sin(ph * Math.PI);
      g.moveTo(x - len, y); g.lineTo(x + len, y);
    }
  }
  g.stroke();
}

/* Cattle and sheep that drift around their patch until something is built on it. */
function drawHerds(g, now) {
  const S = UI.S;
  for (let i = 0; i < N; i++) {
    if (MAP[i] !== "herd" || OWNER[i] >= 0) continue;
    for (let k = 0; k < 2; k++) {
      const ph = hash(i, k + 120) * 6, t = now * .25 + ph;
      const x = cellX(i) + S * (.3 + .4 * hash(i, k + 130)) + Math.sin(t) * S * .06;
      const y = cellY(i) + S * (.28 + .44 * hash(i, k + 140)) + Math.cos(t * .8) * S * .03;
      const face = Math.cos(t) >= 0 ? 1 : -1, z = S * 1.35;
      ellipse(g, x + z * .02, y + z * .07, z * .13, z * .05, "rgba(30,50,20,.25)");
      if (hash(i, k + 150) < .45) {
        for (const [dx, dy] of [[-.05, 0], [.04, -.02], [.03, .03], [-.02, -.03], [0, 0]]) circle(g, x + z * dx, y + z * dy, z * .055, "#fbf8f0");
        circle(g, x + face * z * .1, y - z * .01, z * .038, "#3f3a36");
      } else {
        ellipse(g, x, y, z * .11, z * .065, "#f7f3ea");
        circle(g, x - face * z * .03, y - z * .02, z * .032, "#4a382d");
        circle(g, x + face * z * .045, y + z * .02, z * .026, "#4a382d");
        circle(g, x + face * z * .12, y - z * .005, z * .042, "#6e5140");
      }
    }
  }
}

function drawGlints(g, now) {
  const S = UI.S;
  for (let i = 0; i < N; i++) {
    if (MAP[i] !== "ore" || OWNER[i] >= 0) continue;
    const a = Math.max(0, Math.sin(now * 1.7 + hash(i, 5) * 20) - .82) / .18;
    if (a <= 0) continue;
    const x = cellX(i) + S * (.25 + .5 * hash(i, 6)), y = cellY(i) + S * (.25 + .5 * hash(i, 7)), s = S * .09 * a;
    g.fillStyle = `rgba(255,248,215,${a})`;
    g.beginPath(); g.moveTo(x, y - s); g.lineTo(x + s * .25, y); g.lineTo(x, y + s); g.lineTo(x - s * .25, y); g.closePath(); g.fill();
    g.beginPath(); g.moveTo(x - s, y); g.lineTo(x, y + s * .25); g.lineTo(x + s, y); g.lineTo(x, y - s * .25); g.closePath(); g.fill();
  }
}

function drawDust(g, dt) {
  const S = UI.S;
  for (const p of FX.dust) {
    p.t += dt;
    const k = p.t / .6;
    circle(g, p.x + Math.cos(p.a) * S * .5 * k, p.y + Math.sin(p.a) * S * .25 * k, S * (.05 + k * .06), `rgba(245,236,215,${(1 - k) * .8})`);
  }
  FX.dust = FX.dust.filter(p => p.t < .6);
}

function drawFloats(g, dt) {
  const S = UI.S;
  g.textAlign = "center"; g.textBaseline = "middle";
  for (const f of FX.floats) {
    f.t += dt;
    const k = f.t / 1.4, a = Math.min(1, (1 - k) * 3);
    g.font = `800 ${Math.round(S * (f.big ? .78 : .5))}px system-ui, -apple-system, sans-serif`;
    g.lineWidth = S * .1; g.strokeStyle = `rgba(20,28,26,${a * .8})`; g.lineJoin = "round";
    const y = f.y - k * S * .8;
    g.strokeText(f.text, f.x, y);
    g.fillStyle = f.good ? `rgba(160,236,170,${a})` : `rgba(255,170,150,${a})`;
    g.fillText(f.text, f.x, y);
  }
  FX.floats = FX.floats.filter(f => f.t < 1.4);
}

const CONFETTI = ["#ffd45c", "#e0703f", "#5ab4d6", "#6cc07a", "#b673c9", "#ffffff"];
function burst(x, y, n) {
  for (let k = 0; k < n; k++) {
    const a = -Math.PI / 2 + (Math.random() - .5) * 2.4, sp = UI.S * (3 + Math.random() * 6);
    FX.confetti.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, r: Math.random() * 6, vr: (Math.random() - .5) * 14,
                       c: pick(CONFETTI), s: UI.S * (.07 + Math.random() * .07), t: 0 });
  }
}
function drawConfetti(g, dt) {
  const S = UI.S;
  for (const p of FX.confetti) {
    p.t += dt; p.vy += S * 10 * dt; p.vx *= 1 - dt * 1.4;
    p.x += p.vx * dt; p.y += p.vy * dt; p.r += p.vr * dt;
    g.save(); g.translate(p.x, p.y); g.rotate(p.r); g.globalAlpha = Math.max(0, 1 - p.t / 1.8);
    g.fillStyle = p.c; g.fillRect(-p.s / 2, -p.s * .3, p.s, p.s * .6);
    g.restore();
  }
  FX.confetti = FX.confetti.filter(p => p.t < 1.8);
}

/* ───────────────────────── The building in hand ───────────────────────── */

const ghostCells = () => UI.ghost && current() ? cellsAt(current(), UI.ghost) : null;

function placeGhost(o) {
  const [w, h] = extent(orient(DEF[current()].shape, o.rot, o.flip));
  UI.ghost = { rot: o.rot, flip: o.flip, ax: clamp(o.ax, 0, COLS - w), ay: clamp(o.ay, 0, ROWS - h) };
}

/* Starts a new building in hand at the open spot nearest the middle of the map. */
function freshGhost() {
  const type = current();
  if (!type) { UI.ghost = null; return; }
  let best = null;
  for (const p of placements(type)) {
    const [w, h] = extent(orient(DEF[type].shape, p.rot, p.flip));
    const d = (p.ax + w / 2 - COLS / 2) ** 2 + (p.ay + h / 2 - ROWS / 2) ** 2 + (p.rot || p.flip ? 1.5 : 0);
    if (!best || d < best.d) best = { ...p, d };
  }
  UI.ghost = best && { rot: best.rot, flip: best.flip, ax: best.ax, ay: best.ay };
}

function turnGhost(dRot, flip) {
  if (!UI.ghost) return;
  const g = UI.ghost, type = current();
  const [w, h] = extent(orient(DEF[type].shape, g.rot, g.flip));
  const next = { rot: (g.rot + dRot + 4) % 4, flip: flip ? !g.flip : g.flip };
  const [w2, h2] = extent(orient(DEF[type].shape, next.rot, next.flip));
  placeGhost({ ...next, ax: Math.round(g.ax + w / 2 - w2 / 2), ay: Math.round(g.ay + h / 2 - h2 / 2) });
  if (dRot) TUT.turned = true;
  if (flip) TUT.flipped = true;
  paintPanel();
}

function drawGhost(g, now) {
  const cells = ghostCells();
  if (!cells) return;
  const S = UI.S, type = current(), ok = canPlace(cells, type), lift = S * .16;
  const dy = -lift - S * .085, pulse = .8 + .2 * Math.sin(now * 5);
  // The district it would join: its lot breathes a deeper shade in the lanes between the buildings.
  if (ok && !DEF[type].bridge) {
    const joins = districtOf(type, cells);
    if (joins.length) {
      const th = S * .085;
      wg.setTransform(UI.dpr, 0, 0, UI.dpr, 0, 0); wg.clearRect(0, 0, UI.w, UI.h);
      union(wg, joins.flatMap(k => G.pieces[k].cells).concat(cells).filter(c => MAP[c] !== "water"), S * .02, S * .22);
      wg.fillStyle = shade(CAT_HEX[DEF[type].cat], .15); wg.fill();
      wg.globalCompositeOperation = "destination-out";
      for (const k of joins) for (const lift of [0, th]) { union(wg, G.pieces[k].cells, S * .075, S * .16, -lift); wg.fill(); }
      wg.globalCompositeOperation = "source-over";
      g.globalAlpha = .3 + .25 * Math.sin(now * 2.6);
      g.drawImage(wash, 0, 0, UI.w, UI.h);
      g.globalAlpha = 1;
    }
  }
  // The squares it would land on, marked on the board below it.
  g.beginPath();
  for (const c of cells) rr(g, cellX(c) + S * .1, cellY(c) + S * .1, S * .8, S * .8, S * .16);
  g.fillStyle = ok ? "rgba(255,255,255,.38)" : "rgba(214,72,52,.4)"; g.fill();
  if ((press && press.moved) || UI.rules) {
    const own = new Set(cells), ring = new Set();
    for (const c of cells) for (const j of around(c)) if (!own.has(j)) ring.add(j);
    g.save();
    g.setLineDash([S * .09, S * .07]); g.lineWidth = Math.max(1.5, S * .035); g.strokeStyle = "rgba(255,255,255,.8)";
    g.beginPath();
    for (const j of ring) rr(g, cellX(j) + S * .14, cellY(j) + S * .14, S * .72, S * .72, S * .12);
    g.stroke();
    g.restore();
  }
  // A glowing rim: a slightly bigger shape filled underneath, so only its outside edge shows.
  union(g, cells, 0, S * .22, dy + S * .04);
  g.fillStyle = ok ? `rgba(255,255,255,${pulse})` : `rgba(255,105,85,${pulse})`;
  g.fill();
  drawPiece(g, current(), cells, lift, false);
  if (!ok) {
    for (const c of cells) {
      const end = c === cells[0] || c === cells[cells.length - 1];
      if (OWNER[c] < 0 && (MAP[c] !== "water" || (DEF[type].bridge && !end))) continue;
      const x = cellX(c), y = cellY(c) + dy;
      g.beginPath(); rr(g, x + S * .12, y + S * .12, S * .76, S * .76, S * .14); g.fillStyle = "rgba(214,72,52,.55)"; g.fill();
      g.strokeStyle = "#fff"; g.lineWidth = Math.max(2, S * .06); g.lineCap = "round";
      g.beginPath(); g.moveTo(x + S * .36, y + S * .36); g.lineTo(x + S * .64, y + S * .64); g.moveTo(x + S * .64, y + S * .36); g.lineTo(x + S * .36, y + S * .64); g.stroke();
    }
  }
}

function drawSelection(g, now) {
  if (UI.sel < 0) return;
  const S = UI.S, k = OWNER[UI.sel], a = .6 + .4 * Math.sin(now * 4);
  if (k >= 0) {
    if (UI.drop && UI.drop.k === k) return;
    const p = G.pieces[k];
    union(g, p.cells, S * .01, S * .22, -S * .04); g.fillStyle = `rgba(255,214,102,${a})`; g.fill();
    drawPiece(g, p.type, p.cells, 0, false);
  }
}

/* ───────────────────────── Loop ───────────────────────── */

let last = performance.now();
function frame(nowMs) {
  requestAnimationFrame(frame);
  const dt = Math.min(.1, (nowMs - last) / 1000), now = nowMs / 1000;
  last = nowMs;
  if (!G || !UI.w) return;
  NOW = now;
  if (UI.dirty) bake();
  ctx.setTransform(UI.dpr, 0, 0, UI.dpr, 0, 0);
  ctx.clearRect(0, 0, UI.w, UI.h);
  ctx.drawImage(layer, 0, 0, UI.w, UI.h);
  drawWater(ctx, now);
  drawGlints(ctx, now);
  drawHerds(ctx, now);
  if (UI.drop) {
    UI.drop.t += dt;
    const k = Math.min(1, UI.drop.t / .32), p = G.pieces[UI.drop.k];
    drawPiece(ctx, p.type, p.cells, UI.S * .5 * (1 - k) * (1 - k), false);
    if (k >= 1) {
      const S = UI.S, cx = p.cells.reduce((s, c) => s + cellX(c), 0) / p.cells.length + S / 2, cy = p.cells.reduce((s, c) => s + cellY(c), 0) / p.cells.length + S / 2;
      for (let n = 0; n < 12; n++) FX.dust.push({ x: cx, y: cy + S * .3, a: (n / 12) * Math.PI * 2, t: 0 });
      UI.drop = null; UI.dirty = true;
    }
  }
  updateWalkers(dt); drawWalkers(ctx, now);
  for (const [kind, x, y, a, r] of LIVE) live(ctx, kind, x, y, a, r);
  updateSmoke(dt); drawSmoke(ctx);
  drawDust(ctx, dt);
  if ($("dialogWrap").hidden) { drawGhost(ctx, now); drawTarget(ctx, now); }
  drawSelection(ctx, now);
  drawFloats(ctx, dt);
  drawConfetti(ctx, dt);
  tickScore(dt);
}

function tickScore(dt) {
  const target = total();
  if (UI.shown === target) return;
  const step = Math.max(1, Math.abs(target - UI.shown) * dt * 6);
  UI.shown = UI.shown < target ? Math.min(target, UI.shown + step) : Math.max(target, UI.shown - step);
  $("score").textContent = Math.round(UI.shown);
}

/* ───────────────────────── Words on screen ───────────────────────── */

const catColor = (cat) => `var(--${cat})`;
const chip = (cat) => `<span class="chip" style="--c:${catColor(cat)}">${CATS[cat].name}</span>`;

function shapeSVG(type, rot = 0, flip = false, box = 44) {
  const offs = orient(DEF[type].shape, rot, flip), [w, h] = extent(offs);
  const s = Math.floor(box / Math.max(w, h, 3)), gap = Math.max(1, s * .12);
  const color = getComputedStyle(document.documentElement).getPropertyValue(`--${DEF[type].cat}`).trim();
  const cellsSvg = offs.map(([x, y]) => `<rect x="${x * s + gap / 2}" y="${y * s + gap / 2}" width="${s - gap}" height="${s - gap}" rx="${s * .22}" fill="${color}"/>`).join("");
  return `<svg width="${w * s}" height="${h * s}" viewBox="0 0 ${w * s} ${h * s}">${cellsSvg}</svg>`;
}

const LAND_HEX = { grass: "#a5c884", forest: "#5b9a58", ore: "#9a9285", wheat: "#e2bf5c", herd: "#c4a37c", water: "#62abc9" };

/* A small picture of what a rule counts: a kind of land, a kind of building, the map edge. `type` owns the rule. */
function ruleIcon(r, type) {
  const svg = (inner) => `<svg class="ico" viewBox="0 0 20 20">${inner}</svg>`;
  if (r.k === "land") return svg(`<rect x="1" y="1" width="18" height="18" rx="4" fill="${LAND_HEX[r.t]}"/><path d="M5.5 15.5V9.8L10 5.8l4.5 4v5.7z" fill="#fff"/>`);
  if (r.k === "room") return svg(`<rect x="1.5" y="1.5" width="17" height="17" rx="4" fill="${LAND_HEX.grass}" stroke="#5b645f" stroke-width="1.4" stroke-dasharray="2.6 2"/>`);
  if (r.k === "crowd") return districtIcon(DEF[type].cat);
  if (r.bridge) return svg(`<rect x="1.5" y="5.5" width="8" height="9" rx="2.5" fill="#fff" stroke="#c9c2b4"/><rect x="10.5" y="7" width="8.5" height="6" rx="1.5" fill="#c9a06f"/><path d="M11 10h7.5" stroke="#8f6a45" stroke-width="1.2"/>`);
  const catOf = () => r.any ? null : r.cats ? r.cats[0] : DEF[r.types[0]].cat;
  if (r.k === "town") {
    const cat = catOf();
    return svg(`<g fill="#d8d2c5">${[0, 1, 2].map(a => [0, 1, 2].map(b => `<rect x="${1 + a * 6.3}" y="${1 + b * 6.3}" width="5" height="5" rx="1.2"/>`).join("")).join("")}</g>` +
      `<rect x="13.6" y="1" width="5" height="5" rx="1.2" fill="${CAT_HEX[cat]}"/><rect x="1" y="13.6" width="5" height="5" rx="1.2" fill="${CAT_HEX[cat]}"/>`);
  }
  if (r.k === "without") {
    const cat = catOf();
    return svg(`<rect x="3" y="3" width="14" height="14" rx="3.5" fill="${CAT_HEX[cat]}" opacity=".45"/><path d="M3 17 17 3" stroke="#b8412f" stroke-width="2.6" stroke-linecap="round"/>`);
  }
  if (r.k === "near") {
    const cat = catOf();
    if (!cat) return svg(`<rect x="1.5" y="5.5" width="8" height="9" rx="2.5" fill="#fff" stroke="#c9c2b4"/><rect x="10.5" y="5" width="8.5" height="10" rx="2.5" fill="#9aa19c"/>`);
    return svg(`<rect x="1.5" y="5.5" width="8" height="9" rx="2.5" fill="#fff" stroke="#c9c2b4"/><rect x="10.5" y="5" width="8.5" height="10" rx="2.5" fill="${CAT_HEX[cat]}"/>`);
  }
  if (r.k === "edge") return svg(`<rect x="5" y="3" width="13" height="14" rx="3" fill="#fff" stroke="#c9c2b4"/><rect x="1" y="1" width="3" height="18" rx="1.5" fill="#5b645f"/>`);
  return svg(`<rect x="1" y="6" width="5.5" height="8" rx="1.5" fill="${CAT_HEX.home}"/><rect x="7.25" y="6" width="5.5" height="8" rx="1.5" fill="${CAT_HEX.shop}"/><rect x="13.5" y="6" width="5.5" height="8" rx="1.5" fill="${CAT_HEX.civic}"/>`);
}
/* A district: three squares of one kind, joined into one lot. */
const districtIcon = (cat) => `<svg class="ico" viewBox="0 0 20 20"><path d="M1 3.5A2.5 2.5 0 0 1 3.5 1h13A2.5 2.5 0 0 1 19 3.5v13a2.5 2.5 0 0 1-2.5 2.5h-6A2.5 2.5 0 0 1 8 16.5V12H3.5A2.5 2.5 0 0 1 1 9.5z" fill="${shade(CAT_HEX[cat], .55)}"/>` +
  `<g fill="${CAT_HEX[cat]}"><rect x="2.5" y="2.5" width="6" height="6" rx="1.5"/><rect x="11.5" y="2.5" width="6" height="6" rx="1.5"/><rect x="11.5" y="11.5" width="6" height="6" rx="1.5"/></g></svg>`;
const rowHTML = (v, text, cls, icon) =>
  `<li class="${cls ?? (v < 0 ? "bad" : "")}"><b>${signed(v)}</b>${icon || '<i class="sp"></i>'}<span>${esc(text)}</span></li>`;
function modsHTML(type) {
  const d = DEF[type];
  const district = d.bridge ? "" : rowHTML(1, districtText(type), "", districtIcon(d.cat));
  return `<ul class="mods">${rowHTML(d.base, "Base", "base")}${district}${d.rules.map(r => rowHTML(r.p, ruleText(r), undefined, ruleIcon(r, type))).join("")}</ul>`;
}

function hud() {
  $("townName").textContent = G.tut ? "Tutorial" : G.player ? townName(G.player, G.pick) : GAME;
  const placed = G.pieces.length;
  // The game's name sits under the town's, so it is on screen the whole game.
  const where = isDaily() ? `${GAME} · Daily ${goalsDone()}/3` : G.tut ? `${GAME} · learn how to play` : GAME;
  $("townSub").textContent = G.over ? `${where} · the town is done`
    : `${where} · ${placed} built${G.away.length ? ` · ${G.away.length} turned away` : ""}${G.challenge ? ` · Beat ${G.challenge.score}` : ""}`;
  $("left").textContent = G.over ? 0 : G.deck.length - G.at;
  paintCoach();
}

function paintPanel() {
  $("panel").hidden = false;
  if (G.over) {
    $("piece").innerHTML = `<div class="done"><div class="big num">${total()}</div><div class="sub">points</div></div>`;
    $("controls").innerHTML = `<button class="primary" id="bSummary">Summary</button>`;
    $("bSummary").onclick = showSummary;
    return;
  }
  if (!$("bTurn")) restoreControls();
  const type = current(), nxt = upcoming(), o = UI.ghost || { rot: 0, flip: false };
  $("piece").innerHTML = `
    <button class="head" id="pieceHead" aria-expanded="${UI.rules}">
      <div class="mini">${shapeSVG(type, o.rot, o.flip, 34)}</div>
      <div><div class="name">${esc(DEF[type].name)}</div>
        <div class="hint"><span>${UI.rules ? "Scoring ▴" : "Scoring ▾"}</span>${nxt ? `<span class="nx">Next ${shapeSVG(nxt, 0, false, 15)}</span>` : ""}</div></div>
    </button>`;
  $("pieceHead").onclick = toggleRules;
  $("bBuild").disabled = !placeOK();
  paintCoach();
}

const CONTROLS = $("controls").innerHTML;
function restoreControls() {
  $("controls").innerHTML = CONTROLS;
  $("bTurn").onclick = () => turnGhost(1, false);
  $("bFlip").onclick = () => turnGhost(0, true);
  $("bBuild").onclick = doBuild;
}

let toastTimer = 0;
function toast(text, ms = 2600) {
  $("toast").textContent = text; $("toast").classList.add("on");
  clearTimeout(toastTimer); toastTimer = setTimeout(() => $("toast").classList.remove("on"), ms);
}

/* ───────────────────────── Info about a square ───────────────────────── */

function select(i) {
  UI.rules = false; UI.sel = i;
  paintInfo(); paintPanel();
  tutEvent("select");
}
function closeInfo() {
  const wasRules = UI.rules;
  UI.sel = -1; UI.rules = false; $("info").hidden = true;
  if (wasRules && G && G.player) paintPanel();
}
function toggleRules() {
  if (UI.rules) return closeInfo();
  UI.sel = -1; UI.rules = !!current();
  paintInfo(); paintPanel();
  if (UI.rules) tutEvent("rules");
}
const ghostRow = () => { const cells = ghostCells(); return cells ? cells.reduce((sum, c) => sum + rowOf(c), 0) / cells.length : 0; };
function placeInfo(row) {
  const step = tutStep(), side = step ? (step.side === "top" ? "bottom" : "top") : null;
  const cls = "card " + (side || (row >= ROWS / 2 ? "top" : "bottom"));
  if ($("info").className !== cls) $("info").className = cls;
}

function paintInfo() {
  const box = $("info"), i = UI.sel;
  let html = `<button class="x" id="infoX" aria-label="Close">×</button>`;
  if (UI.rules && current()) {
    const d = DEF[current()];
    html += `<div class="kind">Scoring ${chip(d.cat)}</div><h3>${esc(d.name)}</h3><p>${esc(d.blurb)}</p>${modsHTML(current())}`;
    placeInfo(ghostRow());
  } else if (i >= 0 && OWNER[i] >= 0) {
    const k = OWNER[i], p = G.pieces[k], d = DEF[p.type], parts = pieceParts(k);
    const rows = parts.map(q => {
      const r = d.rules[q.r];

/* ───────────────────────── Moves ───────────────────────── */

function doBuild() {
  const cells = ghostCells();
  if (!G || G.over || !placeOK()) return;
  const res = build(cells), S = UI.S;
  const middle = (cs) => [cs.reduce((sum, c) => sum + cellX(c), 0) / cs.length + S / 2, cs.reduce((sum, c) => sum + cellY(c), 0) / cs.length + S / 2];
  // Neighbours whose scores moved show it over their roofs.
  for (const x of res.changed) {
    const [nx, ny] = middle(G.pieces[x.k].cells);
    FX.floats.push({ x: nx, y: ny - S * .2, t: -.35, text: signed(x.d), good: x.d > 0 });
  }
  const [cx, cy] = middle(cells);
  if (res.trophies.some(id => TROPHIES[id].good)) burst(cx, cy, res.gain >= JACKPOT ? 90 : 45);
  UI.drop = { k: res.k, t: 0 };
  UI.dirty = true;
  freshGhost();
  showPop(res, cells);
  bumpScore();
  for (const e of res.events) if (e.away) toast(`No room for the ${DEF[e.away].name}. −${AWAY}`, 3000);
  save(); hud();
  if (G.over) closeInfo(); else if (UI.rules || UI.sel >= 0) paintInfo();
  paintPanel();
  if (G.over) {
    if (!G.tut) recordBest();
    if (!G.tut && isDaily() && G.day === dayKey()) keepTodayTown();
    setTimeout(showSummary, 2400);
  }
  tutEvent("build", res);
}

const CUP = `<svg viewBox="0 0 24 24" fill="#ffd45c"><path d="M7 3h10v2h3v3a4 4 0 0 1-4 4h-.4A5 5 0 0 1 13 14.9V17h3v3H8v-3h3v-2.1A5 5 0 0 1 8.4 12H8a4 4 0 0 1-4-4V5h3zM6 7v1a2 2 0 0 0 1 1.7V7zm11 0v2.7A2 2 0 0 0 18 8V7z"/></svg>`;
const DOWN = `<svg viewBox="0 0 24 24" fill="none" stroke="#ff9f8a" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7l6 6 4-4 8 8"/><path d="M15 17h6v-6"/></svg>`;

/* The new building's score, big, over its roof, with any trophies under it. It stays this long, fade included. */
let popTimer = 0;
const popPills = (res) => Math.min(2, res.trophies.filter(id => TROPHIES[id].good).length) + Math.min(1, res.trophies.filter(id => !TROPHIES[id].good).length);
const popTime = (res) => res ? 1300 + popPills(res) * 600 + 400 : 0;
function showPop(res, cells) {
  const good = res.trophies.filter(id => TROPHIES[id].good).slice(0, 2);
  const bad = res.trophies.filter(id => !TROPHIES[id].good).slice(0, 1);
  const tier = res.gain >= JACKPOT ? "gold" : res.gain >= GREAT ? "great" : res.pts <= 0 ? "low" : "";
  const pop = $("pop");
  pop.innerHTML = `<div class="popnum num ${tier}" id="popNum">+0</div>` + [...good, ...bad].map((id, n) =>
    `<div class="tpill${TROPHIES[id].good ? "" : " bad"}" style="animation-delay:${.25 + n * .15}s">${TROPHIES[id].good ? CUP : DOWN}${TROPHIES[id].name}</div>`).join("");
  const S = UI.S, x = cells.reduce((sum, c) => sum + cellX(c), 0) / cells.length + S / 2, y = Math.min(...cells.map(cellY));
  pop.className = "pop";
  pop.style.left = clamp(x, 90, UI.w - 90) + "px";
  pop.style.top = Math.max(60 + (good.length + bad.length) * 34, y + S * .2) + "px";
  pop.hidden = false;
  const start = performance.now();
  const count = (now) => {
    const k = Math.min(1, (now - start) / 500), el = $("popNum");
    if (!el) return;
    el.textContent = signed(Math.round(res.pts * (1 - (1 - k) ** 3)));
    if (k < 1) requestAnimationFrame(count);
  };
  requestAnimationFrame(count);
  clearTimeout(popTimer);
  popTimer = setTimeout(() => {
    pop.classList.add("hide");
    popTimer = setTimeout(() => { pop.hidden = true; }, 400);
  }, popTime(res) - 400);
}
function hidePop() { clearTimeout(popTimer); $("pop").hidden = true; }

/* ───────────────────────── Touch ───────────────────────── */

function boardPoint(e) {
  const r = cv.getBoundingClientRect();
  return [(e.clientX - r.left - UI.BX) / UI.S, (e.clientY - r.top - UI.BY) / UI.S];
}

let press = null;
cv.addEventListener("pointerdown", (e) => {
  if (!G) return;
  cv.setPointerCapture(e.pointerId);
  const [fx, fy] = boardPoint(e);
  const cells = ghostCells(), here = inside(Math.floor(fx), Math.floor(fy)) ? idx(Math.floor(fx), Math.floor(fy)) : -1;
  // The ghost floats a little above its squares, so a press just below it still counts as grabbing it.
  const lifted = inside(Math.floor(fx), Math.floor(fy + .25)) ? idx(Math.floor(fx), Math.floor(fy + .25)) : -1;
  const onGhost = !!cells && (cells.includes(here) || cells.includes(lifted));
  press = { x: e.clientX, y: e.clientY, fx, fy, here, onGhost, moved: false, touch: e.pointerType !== "mouse",
            gx: UI.ghost ? fx - UI.ghost.ax : 0, gy: UI.ghost ? fy - UI.ghost.ay : 0 };
});
cv.addEventListener("pointermove", (e) => {
  if (!press || !UI.ghost || G.over) return;
  if (!press.moved && Math.hypot(e.clientX - press.x, e.clientY - press.y) < 7) return;
  press.moved = true;
  const [fx, fy] = boardPoint(e), type = current();
  const [w, h] = extent(orient(DEF[type].shape, UI.ghost.rot, UI.ghost.flip));
  let ax, ay;
  if (press.onGhost) { ax = Math.round(fx - press.gx); ay = Math.round(fy - press.gy); }
  else { ax = Math.round(fx - w / 2); ay = Math.round(fy - (press.touch ? 1.3 : 0) - h / 2); }
  const before = UI.ghost.ax + "," + UI.ghost.ay;
  placeGhost({ ...UI.ghost, ax, ay });
  if (UI.ghost.ax + "," + UI.ghost.ay !== before) {
    $("bBuild").disabled = !placeOK();
    if (UI.rules) placeInfo(ghostRow());
    paintCoach();
  }
});
cv.addEventListener("pointerup", () => {
  if (!press) return;
  const p = press;
  press = null;
  if (p.moved) return;
  if (p.onGhost && !G.over) return toggleRules();
  // Only buildings have anything to say.
  if (p.here < 0 || OWNER[p.here] < 0 || p.here === UI.sel) return closeInfo();
  select(p.here);
});
cv.addEventListener("pointercancel", () => { press = null; });

addEventListener("keydown", (e) => {
  if (e.target.tagName === "INPUT" || !G) return;
  if (e.key === "Escape") { if (!$("sheetWrap").hidden) closeSheet(); else closeInfo(); return; }
  if (!$("sheetWrap").hidden || !$("dialogWrap").hidden || G.over || !UI.ghost) return;
  const moves = { ArrowLeft: [-1, 0], ArrowRight: [1, 0], ArrowUp: [0, -1], ArrowDown: [0, 1] };
  if (moves[e.key]) { e.preventDefault(); placeGhost({ ...UI.ghost, ax: UI.ghost.ax + moves[e.key][0], ay: UI.ghost.ay + moves[e.key][1] }); paintPanel(); }
  else if (e.key === "r" || e.key === "R") turnGhost(e.shiftKey ? -1 : 1, false);
  else if (e.key === "f" || e.key === "F") turnGhost(0, true);

/* The day the player last finished, what they scored on it, and how many days in a row they have played. */
function dailyRecord() {

}
const yesterdayOf = (key) => { const d = new Date(key + "T12:00:00Z"); d.setUTCDate(d.getUTCDate() - 1); return dayKey(d); };

/* The first finished run of a day is the one that counts, so a second run is practice. */
function recordDaily() {
  const past = dailyRecord();
  if (!isDaily() || G.day !== dayKey()) return past;
  if (past && past.day === G.day) {
    if (past.par === G.par) return past;
    const fixed = { ...past, par: G.par };
    try { localStorage.setItem(DAILY, JSON.stringify(fixed)); } catch (e) {}
    return fixed;
  }
  const streak = past && past.day === yesterdayOf(G.day) ? past.streak + 1 : 1;
  const now = { day: G.day, score: total(), par: G.par, goals: goalsDone(), streak };
  try { localStorage.setItem(DAILY, JSON.stringify(now)); } catch (e) {}
  cloudPost(now);
  return now;
}

/*
  A daily leaderboard. Fill in a Supabase project's URL and its public anon key and the game sends each finished
  daily town to a function that plays the moves again on that day's map and works out the score itself, so a
  score posted here is one the town really earned. Left empty, the game never touches the network and shows no
  board. See supabase/README.md.
*/
const CLOUD = { url: "https://tnaassoaraijvhswevvp.supabase.co", key: "sb_publishable_KSJZlg0qLmEOak6sP3WX0g_UDo8lz9Z", table: "daily_scores", fn: "score" };
// A copy running on a laptop or opened from disk may read the board, but never writes to it.
const LOCAL = ["localhost", "127.0.0.1", ""].includes(location.hostname) || location.protocol === "file:";
const cloudOn = () => !!(CLOUD.url && CLOUD.key);
const cloudHead = () => ({ "Content-Type": "application/json", apikey: CLOUD.key, Authorization: `Bearer ${CLOUD.key}` });

/*
  A tab left open across a release plays by the library it loaded with, which deals a different deck for the
  same day, and the board rightly refuses a town it cannot replay. So the page keeps its own build stamp and
  compares it with the one on the site whenever it comes back into view. A page behind the site reloads: at
  once if no town is under way, otherwise at the next town, which is a safe moment to change the rules.
*/
const BUILD = "2026-09-22T01:35Z";
let STALE = false;
async function checkBuild() {
  if (LOCAL) return;
  try {
    const r = await fetch(`version.txt?t=${Date.now()}`, { cache: "no-store" });
    if (!r.ok) return;
    const said = (await r.text()).trim();
    STALE = !!said && said !== BUILD;
    if (STALE && (!G || !G.player || G.over || !G.pieces.length)) location.reload();
  } catch (e) {}
}
addEventListener("visibilitychange", () => { if (!document.hidden) checkBuild(); });

/* This browser, so a day counts once for it. It is a random string and says nothing about who you are. */
const DEVICE = "hugelland.device";
function deviceId() {
  try {
    let id = localStorage.getItem(DEVICE);
    if (!id) { id = ([1e7] + "").replace(/\d/g, () => Math.floor(Math.random() * 36).toString(36)) + Date.now().toString(36); localStorage.setItem(DEVICE, id); }
    return id;
  } catch (e) { return "anon"; }
}

/* The town's moves, in the order they were built: all the server needs to play it through again. */
const townMoves = () => G.pieces.map(p => p.cells);

/*
  How the last town fared on its way to the board. Nothing of this shows on screen: a town that misses the board
  is tried again when the summary is opened, and the reason waits in the console and in `hugelland.post` for
  whoever is looking into it.
*/
let POSTED = null;
const POST_LOG = "hugelland.post";

async function cloudPost(run) {
  if (!cloudOn() || LOCAL || !isDaily() || run.day !== G.day) return null;
  const day = G.day, box = ["board10", "boardCard", "boardToday"].find(id => $(id));
  POSTED = { sending: true };
  try {
    const r = await fetch(`${CLOUD.url}/functions/v1/${CLOUD.fn}`, { method: "POST", headers: cloudHead(),
      body: JSON.stringify({ day, name: townName(G.player, G.pick).slice(0, 24), device: deviceId(), moves: townMoves() }) });
    const said = await r.json().catch(() => ({}));
    // A town this browser already sent in counts as on the board: the first one stands.
    POSTED = r.ok || r.status === 409 ? { ok: true } : { ok: false, why: said.why || `the board said no (${r.status})` };
  } catch (e) {
    POSTED = { ok: false, why: "no answer from the board: " + (e && e.message) };
  }
  if (!POSTED.ok) {
    console.warn("Hügelland: this town did not reach the board —", POSTED.why);
    try { localStorage.setItem(POST_LOG, JSON.stringify({ at: new Date().toISOString(), day, why: POSTED.why })); } catch (e) {}
  }
  // The board was drawn before this town reached it, so read it again now.
  if (box) showBoard(day, box);
  return POSTED;
}
const TOP_N = 3;
async function cloudTop(day) {
  if (!cloudOn()) return null;
  try {
    const r = await fetch(`${CLOUD.url}/rest/v1/${CLOUD.table}?day=eq.${day}&select=name,score,goals&order=score.desc,made_at.asc&limit=${TOP_N}`, { headers: cloudHead() });
    return r.ok ? await r.json() : null;

}

/* Where a score stands on a day: how many beat it, and how many played. */
async function cloudRank(day, score) {
  if (!cloudOn()) return null;
  const count = async (q) => {
    const r = await fetch(`${CLOUD.url}/rest/v1/${CLOUD.table}?day=eq.${day}${q}&select=id`,
      { method: "HEAD", headers: { ...cloudHead(), Prefer: "count=exact", Range: "0-0" } });
    const said = r.headers.get("content-range") || "";
    return r.ok ? parseInt(said.split("/")[1], 10) : NaN;
  };
  try {
    const [above, all] = await Promise.all([count(`&score=gt.${score}`), count("")]);
    return Number.isFinite(above) && Number.isFinite(all) ? { place: above + 1, of: Math.max(all, above + 1) } : null;
  } catch (e) { return null; }
}

/* What the finished town can be written about. */
function townFacts() {

    const land = (t) => (c.on[t] || 0) + (c.by[t] || 0);
    const uses = new Set(DEF[p.type].rules.filter(r => r.k === "land" && r.p > 0).map(r => r.t));
    return { k, type: p.type, cat: DEF[p.type].cat, name: DEF[p.type].name, cells: p.cells, score: pieceScore(k), land, uses,
             // Ground it covers but has no use for, and whether anything can still be built beside it.
             bridge: !!DEF[p.type].bridge,
             wasted: DEF[p.type].bridge ? [] : p.cells.filter(q => ["ore", "wheat", "herd"].includes(MAP[q]) && !uses.has(MAP[q])),
             room: p.cells.some(q => around(q).some(j => !own.has(j) && OWNER[j] < 0 && MAP[j] !== "water")),
             openCount: new Set(p.cells.flatMap(q => around(q).filter(j => !own.has(j) && OWNER[j] < 0 && MAP[j] !== "water"))).size,
             parts: pieceParts(k), won: p.won || [],
             neighbours: touching(p.cells, k).size };
  });
  const pairs = [];
  for (const a of P) for (const j of touching(a.cells, a.k)) if (j > a.k) pairs.push([a, P[j]]);
  const is = (q) => typeof q === "string" ? (p) => p.type === q || p.cat === q : (p) => q.includes(p.type) || q.includes(p.cat);
  const F = {
    P, pairs, away: G.away,
    of: (q) => P.filter(is(q)),
    // A pair that touches, first the one that matches `qa`.
    pair: (qa, qb) => {
      const fa = is(qa), fb = is(qb);
      for (const [a, b] of pairs) {
        if (fa(a) && fb(b) && a.k !== b.k) return { a, b };
        if (fa(b) && fb(a) && a.k !== b.k) return { a: b, b: a };
      }
      return null;
    },
    // The biggest district of a kind, as a list of buildings.
    biggest: (cat) => {
      let best = [];
      for (const p of P) {
        if (p.cat !== cat || DEF[p.type].bridge) continue;
        const group = [p, ...districtOf(p.type, p.cells, p.k).map(k => P[k])];
        if (group.length > best.length) best = group;
      }
      return best;
    },
    alone: (q) => P.filter(is(q)).find(p => touching(p.cells, p.k).size === 0),
    best: P.slice().sort((a, b) => b.score - a.score)[0],
    worst: P.slice().sort((a, b) => a.score - b.score)[0],
  };
  return F;
}

/* Runs the four tables over the town and returns every story that fits. */
function ruleStories(F, R) {
  const out = [], add = (e, d, cells) => out.push({ e, d, cells });
  for (const e of GRIPES) {
    const hit = F.pair(e.a, e.b);
    // Only when the rule really bites: the building has a penalty for that neighbour.
    if (hit && DEF[hit.a.type].rules.some(r => r.k === "near" && r.p < 0 && matches(r, hit.b.type))) add(e, hit, cellsOf(hit.a, hit.b));
    else if (hit && e.id === "toll-no-bridge") add(e, hit, cellsOf(hit.a, hit.b));
    else if (hit && e.id === "school-fun") add(e, hit, cellsOf(hit.a, hit.b));
  }
  for (const e of BOONS) {
    let d = null;
    if (e.land) { const p = F.of(e.a).find(q => q.land(e.land) >= 1); if (p) d = { a: p }; }
    else if (e.edge) { const p = F.of(e.a).find(q => q.parts.some((x, i) => DEF[q.type].rules[x.r] && DEF[q.type].rules[x.r].k === "edge" && x.v > 0)); if (p) d = { a: p }; }
    else if (e.near) { const p = F.of(e.a).find(q => [...touching(q.cells, q.k)].filter(k => DEF[G.pieces[k].type].cat === e.near).length >= e.n); if (p) d = { a: p, n: [...touching(p.cells, p.k)].filter(k => DEF[G.pieces[k].type].cat === e.near).length }; }
    else if (e.nearType) { const hit = F.pair(e.a, e.nearType); if (hit) d = hit; }
    else if (e.room) { const p = F.P.find(q => !q.bridge && DEF[q.type].rules.some(r => r.k === "room") && q.openCount >= e.room); if (p) d = { a: p, n: p.openCount }; }
    if (d) add(e, d, cellsOf(...[d.a, d.b].filter(Boolean)));
  }
  for (const e of MISSED) {
    const p = F.P.find(q => e.types.includes(q.type) && q.parts.some(x => { const r = DEF[q.type].rules[x.r]; return r && r.p > 0 && e.test(r) && x.v === 0; }));
    if (p) add(e, { a: p }, p.cells);
  }
  for (const p of F.P) for (const id of p.won || []) {
    if (!TROPHY_LINES[id]) continue;
    add({ id: "trophy-" + id, w: 7, fam: "trophy", lines: TROPHY_LINES[id] }, { a: p }, p.cells);
  }
  return out.map(({ e, d, cells }) => {
    const N = () => `${R() < .35 ? pick(FIRSTS, R) + " " : ""}${pick(SURNAMES, R)}`;
    const W = () => pick(PLACES, R);
    return { ...pick(e.lines, R)(d, N, W, R), w: e.w * (.35 + R() * 1.3), cells, fam: e.fam || "" };
  });
}

/* The paper the town earned: the loudest story that fits, then two shorter ones. */
function paperStories(R) {
  const F = townFacts(), out = [];
  for (const st of STORIES) {
    let d;
    try { d = st.find(F); } catch (e) { d = null; }
    if (!d) continue;
    const N = () => `${R() < .35 ? pick(FIRSTS, R) + " " : ""}${pick(SURNAMES, R)}`;
    const W = () => pick(PLACES, R);
    const line = pick(st.lines, R)(d, N, W, R);
    out.push({ ...line, w: st.w * (.35 + R() * 1.3), cells: d.cells || cellsOf(...[d.a, d.b].filter(Boolean)) });
  }
  out.push(...ruleStories(F, R));
  out.sort((a, b) => b.w - a.w);
  const kept = [], seen = new Set();
  let trophies = 0;
  for (const st of out) {
    const key = st.cells.slice().sort((a, b) => a - b).join(",");
    if (seen.has(key)) continue;
    if (st.fam === "trophy" && trophies >= 1) continue;
    if (st.fam === "trophy") trophies++;
    seen.add(key); kept.push(st);
    if (kept.length === 3) break;
  }
  return kept;
}

/* A photograph for the paper: the squares the story is about, cut straight out of the board. */
function paperShot(cells) {
  if (!cells || !cells.length || !UI.w) return "";
  if (UI.dirty) bake();
  const S = UI.S, pad = S * .4;
  const x0 = clamp(Math.min(...cells.map(cellX)) - pad, 0, UI.w), y0 = clamp(Math.min(...cells.map(cellY)) - pad, 0, UI.h);
  const x1 = clamp(Math.max(...cells.map(cellX)) + S + pad, 0, UI.w), y1 = clamp(Math.max(...cells.map(cellY)) + S + pad, 0, UI.h);
  const w = x1 - x0, h = y1 - y0;
  if (w < 4 || h < 4) return "";
  const out = document.createElement("canvas"), scale = Math.min(3, 420 / w);
  out.width = Math.round(w * scale); out.height = Math.round(h * scale);
  const g = out.getContext("2d");
  g.fillStyle = "#a5c884"; g.fillRect(0, 0, out.width, out.height);
  g.drawImage(layer, x0 * UI.dpr, y0 * UI.dpr, w * UI.dpr, h * UI.dpr, 0, 0, out.width, out.height);
  try { return out.toDataURL("image/png"); } catch (e) { return ""; }
}

/* The lead story of the paper just printed, for the share text. */

/* 1922 dress: the masthead, the dateline, one big story with its photograph, and two briefs. */

/* The dots under the summary follow the page you swiped to, and move it when tapped. */
function pageDots(labels = []) {
  const box = $("pages"), dots = [...$("dots").children], hint = $("swipe");
  const mark = () => {
    const i = Math.round(box.scrollLeft / (box.scrollWidth / dots.length));
    dots.forEach((d, k) => d.setAttribute("aria-current", String(k === i)));
    if (!hint) return;
    hint.style.visibility = i === dots.length - 1 ? "hidden" : "visible";
    hint.textContent = `Swipe for ${labels[i + 1] || "more"}`;
  };
  mark();
  box.addEventListener("scroll", mark, { passive: true });
  dots.forEach((d, i) => { d.onclick = () => box.scrollTo({ left: i * box.scrollWidth / dots.length, behavior: "smooth" }); });
}

/* ───────────────────────── Tutorial ───────────────────────── */

/*
  A short game on a map drawn by hand, with eight buildings in a set order. A coach card says what to do next,
  and the Build button waits until the building sits where the step wants it. The tutorial is never saved, so a
  town under way is still there when it ends.

  F woods, O ore, W wheat, H herd, ~ water, . open grass. The mill fits the woods only when turned and flipped,
  the farm that helps the homes sits on the Mine's ore, and the bridge crosses the river next to the homes.
  The lake keeps the land tight: at the end the Church, a plus, fits in only two gaps, next to the last ore.
  A Mine put down without thinking of it can take both, and the Church is turned away.
*/
const TUT_MAP = [
  "F.F..~~~~",
  ".FFF.~~~~",
  ".F..~~~~~",
  ".F.~~~~~~",
  "FFF..~~~~",
  ".....~~~~",
  ".....~.~~",
  "OO...~.HH",
  "OOW..~.H~",
  "OOW..~~~~",
  "....~~~~~",
  "~~~~~~~~~",
];
const TUT_LAND = { F: "forest", O: "ore", W: "wheat", H: "herd", "~": "water", ".": "grass" };
const TUT_DECK = ["lumber", "cabin", "loghouse", "homestead", "farm", "bridge", "mine", "church"];
const TUT = { on: false, i: 0, turned: false, flipped: false, last: null, html: "", until: 0, timer: 0 };

const squares = (xys) => xys.map(([x, y]) => idx(x, y));
const sameCells = (a, b) => !!a && a.length === b.length && a.every(c => b.includes(c));
const landOf = (r) => r.parts.find(q => q.r === 0).n;
const gained = (r) => r.changed.reduce((sum, x) => sum + x.d, 0);

/*
  side:  where the coach sits, "top" or "bottom", clear of the squares the step is about.
  next:  the step waits for the Next button. wait: it waits for "rules", "deck", "sheetclose" or "select".
  build: the squares the building must cover, or "any". ghost: where the building in hand starts.
  hold:  how long the coach stays away first, so the player can look: milliseconds, or "pop" to wait until the
         score and trophies over the new building have gone.
  text gets the last build's result, so it can name the points the move earned.
*/
const STEPS = [
  { side: "bottom", next: true,
    text: () => `Hügelland is a jigsaw. Every building must fit somewhere, and one with no room costs −${AWAY}. Within that, put each where it scores the most. First up: a <b>Lumber Mill</b>.` },
  { side: "bottom", wait: "rules",
    text: () => `Tap the mill on the map, or tap its name in the panel below, to see how it scores.` },
  { side: "bottom", next: true, hold: 2200, leave: () => closeInfo(),
    text: () => `Each row is one way the mill scores. <b>Base</b> is always yours. <b>District</b>: +1 for each industry it touches. <b>Woods</b>: +2 for each woods square under it or next to it, the dashed squares.` },
  { side: "bottom", build: [[2, 0], [2, 1], [1, 1], [1, 2]],
    todo: (s) => [["Turn", TUT.turned], ["Flip", TUT.flipped], ["On the outline", sameCells(ghostCells(), squares(s.build))]],
    text: () => `The outline sits deep in the woods. Use <b>Turn</b> and <b>Flip</b> to match its shape. Then drag the mill onto it and tap <b>Build</b>.` },
  { side: "bottom", next: true, hold: "pop",
    text: (r) => `+${r.pts}! <b>Perfect ground</b>: every square is on woods. <b>Rich land</b>: ${landOf(r)} woods in all. Build well to win trophies.` },
  { side: "top", build: [[0, 6], [1, 6]], ghost: { rot: 0, flip: false, ax: 3, ay: 4 },
    text: () => `Now a home. The Cabin's card has a red row: it loses 2 for each industry next to it, so keep homes away from the mill. Put the Cabin on the outline and tap <b>Build</b>.` },
  { side: "top", hold: "pop", build: [[0, 5], [1, 5], [2, 5]], ghost: { rot: 0, flip: false, ax: 2, ay: 4 },
    text: () => `Buildings of one kind that touch make a <b>district</b>. Put the Log House on the outline, next to the Cabin. The shaded lot shows the district it joins.` },
  { side: "top", next: true, hold: "pop",
    text: () => `A district of 2: each home gets +1, so the Cabin went up too.` },
  { side: "top", build: [[2, 6], [2, 7], [3, 7]], ghost: { rot: 0, flip: false, ax: 3, ay: 4 },
    text: () => `Add the Homestead to the district.` },
  { side: "top", next: true, hold: "pop",
    text: () => `A district of 3: now each home gets +2. It grows up to +${DISTRICT_MAX}.` },
  { side: "top", build: [[0, 7], [1, 7], [0, 8], [1, 8]], ghost: { rot: 0, flip: false, ax: 3, ay: 8 },
    text: () => `The Farm is food, and homes like food next door. Put it on the outline, next to the homes.` },
  { side: "top", next: true, hold: "pop",
    text: (r) => `The homes gained +${gained(r)}. But see the red trophy, <b>Wasted land</b>: the Farm covers ore that a Mine will want later. Every spot is a trade-off.` },
  { side: "top", build: [[4, 7], [5, 7], [6, 7]], ghost: { rot: 0, flip: false, ax: 4, ay: 6 },
    text: () => `<b>Bridges</b> are the only buildings that can sit on water, and both ends must be on land. Put the bridge on the outline, across the river.` },
  { side: "top", next: true, hold: "pop",
    text: (r) => `+${r.pts}: for the water around it and the building it touches. Bridges join no district.` },
  { side: "top", wait: "deck",
    text: () => `Two buildings are left. Tap <b>To come</b> at the top right to see them.` },
  { side: "top", wait: "sheetclose",
    text: () => `Everything still to come, and the squares it needs. In a real game that is almost every open square, so watch this count and leave room for awkward shapes. Then close the list.` },
  { side: "top", wait: "select",
    text: () => `Tap any building you have built to see its score now.` },
  { side: "top", next: true, hold: 2200, leave: () => closeInfo(),
    text: () => `Each row is part of its score now. Grey rows are bonuses it could still get. <b>Points</b> at the top shows the whole town.` },
  { side: "top", build: "any",
    text: () => current() === "church"
      ? `Now the Church. Find a gap where the whole plus fits.`
      : `Your turn. The Mine wants ore. But the Church comes next, a plus shape with only two gaps left that fit it, both by the ore. Place the Mine without taking them.` },
];

const tutStep = () => G && G.tut && TUT.on && !G.over ? STEPS[TUT.i] : null;

/* Only what the step asks for can be built. Outside the tutorial, any open spot will do. */
function placeOK() {
  const cells = ghostCells();
  if (!canPlace(cells, current())) return false;
  if (!G.tut) return true;
  const step = tutStep();
  return !!step && !!step.build && (step.build === "any" || sameCells(cells, squares(step.build)));
}

function paintCoach() {
  const box = $("coach"), step = tutStep();
  if (!step || performance.now() < TUT.until) { box.hidden = true; TUT.html = ""; return; }
  const todo = step.todo ? step.todo(step) : [];
  const html = `<div class="kind">Tutorial · ${TUT.i + 1} of ${STEPS.length}</div><p>${step.text(TUT.last)}</p>` +
    (todo.length ? `<ul class="todo">${todo.map(([t, ok]) => `<li class="${ok ? "ok" : ""}">${t}</li>`).join("")}</ul>` : "") +
    (step.next ? `<div class="go"><button class="primary" id="coachNext">Next</button></div>` : "");
  box.className = "card " + step.side;
  if (box.hidden) { box.hidden = false; box.style.animation = "none"; void box.offsetWidth; box.style.animation = ""; }
  // Paint only on a change, so a tap on Next is never lost to a fresh button.
  if (html === TUT.html) return;
  box.innerHTML = html; TUT.html = html;
  if ($("coachNext")) $("coachNext").onclick = nextStep;
}

function enterStep() {
  const step = STEPS[TUT.i];
  TUT.turned = TUT.flipped = false;
  clearTimeout(TUT.timer);
  const wait = step.hold === "pop" ? popTime(TUT.last) + 300 : step.hold || 0;
  TUT.until = performance.now() + wait;
  if (wait) TUT.timer = setTimeout(paintCoach, wait);
  if (step.ghost && current()) UI.ghost = { ...step.ghost };
  paintPanel();
  if (UI.rules || UI.sel >= 0) paintInfo();
}
function nextStep() {
  const step = STEPS[TUT.i];
  if (step.leave) step.leave();
  TUT.i = Math.min(TUT.i + 1, STEPS.length - 1);
  enterStep();
}
/* What the player just did. A step moves on when it is the thing the step waits for. */
function tutEvent(name, res) {
  const step = tutStep();
  if (name === "build" && G && G.tut) TUT.last = res;
  if (!step) return;
  if (name === "build" && step.build === "any") return paintCoach();
  if (step.wait === name || (name === "build" && step.build)) nextStep();
}

/* The squares the step wants, marked with a gold outline that turns green when the building fits them. */
function drawTarget(g, now) {
  const step = tutStep();
  if (!step || !step.build || step.build === "any") return;
  const cells = squares(step.build), set = new Set(cells), S = UI.S, hit = sameCells(ghostCells(), cells);
  union(g, cells, S * .04, S * .2);
  g.fillStyle = hit ? "rgba(108,240,154,.18)" : `rgba(255,214,92,${.14 + .1 * Math.sin(now * 4)})`;
  g.fill();
  g.beginPath();
  for (const c of cells) {
    const x = cellX(c), y = cellY(c), col = colOf(c);
    if (!set.has(c - COLS)) { g.moveTo(x, y); g.lineTo(x + S, y); }
    if (!set.has(c + COLS)) { g.moveTo(x, y + S); g.lineTo(x + S, y + S); }
    if (col === 0 || !set.has(c - 1)) { g.moveTo(x, y); g.lineTo(x, y + S); }
    if (col === COLS - 1 || !set.has(c + 1)) { g.moveTo(x + S, y); g.lineTo(x + S, y + S); }
  }
  g.save();
  g.setLineDash([S * .16, S * .1]); g.lineDashOffset = -now * S * .5; g.lineCap = "round";
  g.lineWidth = Math.max(2, S * .07); g.strokeStyle = hit ? "#6cf09a" : "#ffd45c";
  g.stroke();
  g.restore();
}

/* The name of the unfinished town in the save, if there is one. */
function savedTown() {
  try {
    const s = JSON.parse(localStorage.getItem(SAVE));
    return s && (s.v === 6 || s.v === 7) && s.player && !s.over ? townName(s.player, s.pick) : null;
  } catch (e) { return null; }
}

/* The end of the tutorial: the final score, how it adds up, and the way into a real game. */
function tutSummary() {
  hidePop();
  const won = Object.keys(TROPHIES).filter(id => G.trophies[id]), back = savedTown();
  showDialog(`<div class="final">
      <h2>Final scoring</h2>
      <div class="big num">${total()}</div>
      <div class="best">Your tutorial town</div>
    </div>
    <p>When the last building is down, the town is done and every building's score adds up. Fit them all for +${ALL_FIT}. Each building with no room costs −${AWAY}.</p>
    <p>${G.away.length
      ? `The ${esc(DEF[G.away[0]].name)} had no room, so it cost −${AWAY} and the +${ALL_FIT}. That is the jigsaw: every square you take is one a later building can't have.`
      : `You fit every building. On a real map that is the hard part, so keep an eye on To come.`}</p>
    <ul class="tally">
      <li><span>Buildings</span><b>${boardScore()}</b></li>
      ${G.away.length ? `<li><span>${G.away.length} turned away</span><b>−${G.away.length * AWAY}</b></li>`
                      : `<li><span>Every building fit</span><b>+${ALL_FIT}</b></li>`}
    </ul>
    ${won.length ? `<p class="label">Trophies</p><div class="tchips">${won.map(id =>
      `<span class="tchip${TROPHIES[id].good ? "" : " bad"}">${esc(TROPHIES[id].name.replace("!", ""))}${G.trophies[id] > 1 ? ` ×${G.trophies[id]}` : ""}</span>`).join("")}</div>` : ""}
    <p>Now try a real map. The <b>Daily</b> map is the same for everyone today, with three goals and a par to beat. A <b>Free</b> map is new each time.</p>
    ${back ? `<p class="today">A new map takes the place of ${esc(back)}.</p><button class="linkbtn" id="tBack">Back to ${esc(back)}</button>` : ""}
    <button class="linkbtn" id="tLook">Look at the town</button>
    <div class="row">
      <button class="primary" id="tDaily">Daily<span class="sub">Today's map</span></button>
      <button class="primary green" id="tFree">Free<span class="sub">A random map</span></button>
    </div>`);
  $("tDaily").onclick = () => playFromTutorial(dayKey());
  $("tFree").onclick = () => playFromTutorial(null);
  if ($("tBack")) $("tBack").onclick = leaveTutorial;
  $("tLook").onclick = closeDialog;
}

/* ───────────────────────── Saving and starting ───────────────────────── */

function save() { if (!G || !G.player || G.tut || G.viewing) return; try { localStorage.setItem(SAVE, JSON.stringify(G)); } catch (e) {} }
function load() {
  try {
    const s = JSON.parse(localStorage.getItem(SAVE));
    // A town saved before the daily map carries on as a free one.
    if (s && s.v === 6 && s.player) { s.v = 7; s.day = null; s.goals = null; s.par = 0; }
    if (s && s.v === 7 && s.player) { restore(s); return true; }
  } catch (e) {}
  return false;
}

function resetScene() {
  FX.walkers.length = 0; FX.puffs.length = 0; FX.dust.length = 0; FX.floats.length = 0; FX.confetti.length = 0;
  hidePop();
  UI.drop = null; UI.dirty = true; closeInfo();
}

/*
  The town gets its name when it is founded: Fort Zach, Zachville and so on. From the intro it keeps the map shown
  behind it. Pass null as the seed for a fresh random map.
*/
function startTown(player, challenge = null, daily = null, seed = G.seed) {
  // Today's map, once: carry on with it if it is half built, or see how it went if it is done.
  const kept = todayTown(), rec = dailyRecord();
  if (daily && daily === dayKey() && kept) { closeDialog(); closeSheet(); return kept.over ? viewToday(kept) : resumeToday(kept); }
  if (daily && daily === dayKey() && rec && rec.day === daily) { closeDialog(); closeSheet(); return showToday(rec); }
  stashDaily();
  // A page behind the site would deal a deck the board cannot check, so it takes the new one first.
  if (STALE) return location.reload();
  newGame(player, Math.floor(Math.random() * NAME_FORMS), seed, daily);
  G.challenge = challenge && { from: challenge.from, score: challenge.score };
  resetScene();
  UI.shown = 0; $("score").textContent = 0;
  freshGhost(); save(); hud(); paintPanel();
  layout();
  if (daily) toast(`${townName(player, G.pick)} on today's map, with three goals.`, 3600);
  else toast(`Welcome to ${townName(player, G.pick)}!${challenge ? ` Beat ${challenge.score}.` : ""}`);
}

function showGame() {
  closeDialog();
  resetScene();
  UI.shown = total(); $("score").textContent = total();
  freshGhost(); hud(); paintPanel();
  layout();
}

/*
  A day is played once. When today's map is already finished, the Daily button shows how it went instead of
  dealing it again, and the way on from here is a free map or tomorrow.
*/
function showToday(rec) {
  // The town itself is the best answer: its summary carries the tally, the paper, the goals and the board.
  const town = todayTown();
  if (town) return viewToday(town);
  const over = rec.score - rec.par;
  showDialog(`<div style="text-align:center">
      <h2>You have played today</h2>
      <p>${esc(dayName(rec.day))} · the daily map comes once a day.</p>
      <div class="big num" style="font-size:3rem;font-weight:800;letter-spacing:-.04em">${rec.score}</div>
      <div class="best" style="color:var(--muted);font-size:.8rem;font-weight:650">points</div>
    </div>
    <div class="par ${over >= 0 ? "win" : "lose"}"><span>Par ${rec.par}</span><b>${over >= 0 ? "+" : "−"}${Math.abs(over)}</b>
      <span>${over > 0 ? "over par" : over < 0 ? "under par" : "level with par"}</span></div>
    <p class="today" style="text-align:center">${rec.goals} of 3 goals${rec.streak > 1 ? ` · ${rec.streak} days in a row` : ""}</p>
    <div id="boardToday"></div>
    <p style="text-align:center">A new map comes at midnight. Until then, a free map is always there.</p>
    <div class="row"><button class="tool" id="tdBack">Back</button><button class="primary green" id="tdFree">Free map</button></div>`);
  if (cloudOn()) showBoard(rec.day, "boardToday");
  $("tdBack").onclick = () => intro();
  $("tdFree").onclick = () => {
    const name = lastName();
    closeDialog();
    if (name) startTown(name, null, null); else intro();
  };
}

/* Brings today's finished town back to the board and opens its summary. The town in progress waits in the save. */
function viewToday(town) {
  save();
  closeDialog(); closeSheet();
  restore(town);
  G.viewing = true;
  resetScene(); UI.ghost = null;
  UI.shown = total(); $("score").textContent = total();
  hud(); paintPanel(); layout();
  showSummary();
}

/* Out of looking at today's town, back to whatever was under way. */
function leaveViewing() {
  closeDialog();
  if (load() && !G.over) showGame(); else intro();
}

/* A challenge link brings its map, its deck and a score to beat. */
function intro(challenge = null) {
  newGame("", 0, challenge && challenge.seed ? challenge.seed : undefined, challenge && challenge.day ? challenge.day : null);
  resetScene(); UI.ghost = null;
  $("panel").hidden = true;
  hud();
  const today = dayKey(), rec = dailyRecord(), doneToday = rec && rec.day === today;
  // Today's map may be waiting half built, or already done.
  const kept = todayTown(), back = savedTown();
  const sameDay = challenge && challenge.day === today;
  const lead = challenge
    ? `<div class="versus">${esc(challenge.from)} scored ${challenge.score} on ${challenge.day ? (sameDay ? "today's map" : esc(dayName(challenge.day)) + "'s map") : "this map"}<span>${challenge.day ? "The daily map, with its three goals and its par." : "Same land, same buildings, same order. Can you beat it?"}</span></div>
       ${challenge.v !== LINK_VERSION ? `<p>This link is from an older version of the game, so the map or the scoring may be different.</p>` : ""}`
    : `<p>Fit odd-shaped buildings onto the map. Good spots score more.</p>`;
  const choose = challenge ? `<div class="row"><button class="primary" id="found" type="submit">Take the challenge</button></div>`
    : `<div id="chooseBox">
         <div class="modes">
           <button class="primary" id="goDaily" type="submit">Daily<span class="sub">${kept && !kept.over ? "Carry on with today's map"
             : (kept && kept.over) || doneToday ? "Played today · see how it went" : "Play the daily challenge map"}</span></button>
           <button class="primary green" id="goFree" type="button">Free<span class="sub">Play a random map</span></button>
         </div>
         <div class="modes one"><button class="primary wheat" id="goTut" type="button">Tutorial<span class="sub">Learn how to play</span></button></div>
         ${back ? `<button type="button" class="linkbtn" id="goBack">Back to ${esc(back)}</button>` : ""}
       </div>`;
  showDialog(`<form id="introForm" autocomplete="off" style="text-align:center">
      <div id="topBox">
        <img class="crest" src="hugelland-icon.svg" alt="">
        <h1>Hügelland</h1>
        ${lead}
        <input id="nameIn" maxlength="14" placeholder="Your name" enterkeyhint="go" autocapitalize="words" spellcheck="false" value="${esc(lastName())}">
      </div>
      ${choose}
      ${challenge ? `<button type="button" class="linkbtn" id="decline">Play a different map</button>` : ""}
      <div id="howBox" hidden><h2 style="margin-bottom:2px">How to play</h2>${RULES_HTML}</div>
      <button type="button" class="linkbtn" id="howBtn">How to play</button>
    </form>`);
  // The rules take the place of the buttons, so the dialog never grows past the screen.
  const how = () => {
    const open = !$("howBox").hidden;
    $("howBox").hidden = open;
    $("topBox").hidden = !open;
    if ($("chooseBox")) $("chooseBox").hidden = !open;
    $("howBtn").textContent = open ? "How to play" : "Back";
  };
  $("howBtn").onclick = how;
  const named = () => $("nameIn").value.trim();
  if ($("decline")) $("decline").onclick = () => intro();
  const begin = (daily) => {
    if (!named()) { $("nameIn").focus(); return; }
    const player = named();
    try { localStorage.setItem(NAME, player); } catch (e) {}
    $("nameIn").blur();
    closeDialog();
    startTown(player, challenge, daily);
  };
  if ($("goFree")) $("goFree").onclick = () => begin(null);
  if ($("goBack")) $("goBack").onclick = () => { closeDialog(); if (load() && !G.over) showGame(); else intro(); };
  if ($("goTut")) $("goTut").onclick = () => {
    if (named()) try { localStorage.setItem(NAME, named()); } catch (e) {}
    startTutorial();
  };
  $("introForm").onsubmit = (e) => {
    e.preventDefault();
    if (!challenge && kept) return kept.over ? viewToday(kept) : resumeToday(kept);
    if (!challenge && doneToday) return showToday(rec);
    begin(challenge ? challenge.day || null : dayKey());
  };
  layout();
}

// Safari ignores the viewport's no-zoom setting, so stop pinch zoom here.
for (const type of ["gesturestart", "gesturechange"]) document.addEventListener(type, (e) => e.preventDefault(), { passive: false });
addEventListener("visibilitychange", () => { if (document.hidden) save(); });
addEventListener("pagehide", save);
new ResizeObserver(layout).observe($("stage"));

restoreControls();
checkBuild();
const link = new URLSearchParams(location.search);
if (link.has("seed") || link.has("daily")) {
  const from = (link.get("from") || "").trim().slice(0, 14) || "A friend";
  const day = (link.get("daily") || "").slice(0, 10).match(/^\d{4}-\d{2}-\d{2}$/) ? link.get("daily") : null;
  const challenge = { seed: day ? 0 : parseInt(link.get("seed"), 10) | 0, day,
                      score: parseInt(link.get("score"), 10) || 0, from, v: parseInt(link.get("v"), 10) || 0 };
  // Drop the link from the address bar, so a reload resumes the game instead of starting the challenge again.
  history.replaceState(null, "", location.pathname);
  intro(challenge);
} else if (load() && !G.over) showGame(); else intro();
requestAnimationFrame(frame);
</script>
