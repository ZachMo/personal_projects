<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Zachbox Games</title>
<meta name="description" content="Party games for one shared screen and everyone's phones.">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@400;500;600&family=Playfair+Display:wght@700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/shared/zachbox.css">
<style>
  .wrap { max-width: 980px; margin: 0 auto; padding: max(28px, env(safe-area-inset-top)) 16px 60px; }
  header { text-align: center; padding: 24px 0 30px; }
  header h1 { font-size: clamp(2.6rem, 9vw, 4.8rem); font-weight: 900; line-height: 1; text-shadow: 0 0 40px rgba(212, 175, 55, 0.35); }
  header p { color: var(--ink-2); margin-top: 10px; font-size: 1.2rem; }
  .join { display: flex; gap: 10px; align-items: stretch; max-width: 460px; margin: 0 auto 36px; padding: 14px; }
  .join input { text-transform: uppercase; letter-spacing: 0.35em; text-align: center; font-weight: 700; font-size: 1.5rem; }
  .join .btn { flex: none; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 18px; }
  .game { padding: 22px; display: flex; flex-direction: column; gap: 12px; }
  .game h2 { font-size: 1.7rem; color: var(--gold-hi); }
  .game .meta { display: flex; gap: 8px; flex-wrap: wrap; }
  .game p { color: var(--ink-2); font-size: 1.2rem; flex: 1; }
  .game .art { height: 120px; border-radius: 10px; background: radial-gradient(circle at 50% 120%, rgba(179, 32, 46, 0.5), transparent 60%), #120c08; display: flex; align-items: center; justify-content: center; font-size: 3.4rem; border: 1px solid var(--line); }
  .soon { opacity: 0.45; border-style: dashed; justify-content: center; align-items: center; text-align: center; min-height: 200px; }
  footer { text-align: center; color: var(--muted); margin-top: 40px; font-size: 1rem; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="eyebrow">Party games for one screen and everyone's phones</div>
    <h1 style="margin-top:12px">Zachbox Games</h1>
    <p>Share one screen on the call. Everyone plays on their phone.</p>
  </header>

  <form class="join panel" id="join" autocomplete="off">
    <input type="text" id="code" maxlength="4" placeholder="CODE" aria-label="Room code" inputmode="text" autocapitalize="characters" spellcheck="false">
    <button class="btn" type="submit">Join a game</button>
  </form>

  <div class="flourish serif" style="margin-bottom:22px">Host a game</div>
  <div class="grid" id="games"></div>

  <footer>Hosting: open a game on the computer you share. Players join at this address with the room code.</footer>
</div>
<script>
  const ART = { 'murder-dinner-party': '🕯️🔪🍷' };
  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  fetch('/api/games').then((r) => r.json()).then((games) => {
    const el = document.getElementById('games');
    el.innerHTML = games.map((g) => `
      <div class="game panel">
        <div class="art" aria-hidden="true">${ART[g.id] || '🎲'}</div>
        <h2>${esc(g.name)}</h2>
        <div class="meta"><span class="chip">${g.minPlayers}–${g.maxPlayers} players</span>${g.minutes ? `<span class="chip dim">${esc(g.minutes)} min</span>` : ''}</div>
        <p>${esc(g.pitch)}</p>
        <a class="btn block" style="text-align:center;text-decoration:none" href="/host/${encodeURIComponent(g.id)}">Host a game</a>
      </div>`).join('') + `<div class="game panel soon"><p class="serif">More games coming</p></div>`;
  });
  const code = document.getElementById('code');
  code.addEventListener('input', () => { code.value = code.value.toUpperCase().replace(/[^A-Z]/g, ''); });
  document.getElementById('join').addEventListener('submit', (e) => {
    e.preventDefault();
    if (code.value.length === 4) location.href = '/join?code=' + code.value;
    else code.focus();
  });
</script>
</body>
</html>
