        if (!list) continue;
        for (const tr of list) {
          if (z > tr.z + tr.tall) continue;
          if (z < tr.z - 0.2) continue;
          if (Math.hypot(x - tr.x, y - tr.y) < tr.r * 0.62) return tr;
        }
      }
    }
    return null;
  },

  // ── Shooting ──
  // `this.lie` is where the shot was played from, so this one needs its own name.
  lieMul() {
    const t = this.cell(this.ball.x, this.ball.y);
    return (LIE[t] || LIE[4])[CLUBS[this.club].id];
  },

  shotSpeed(power) {
    return CLUBS[this.club].power * clamp(power, 0.06, 1) * this.lieMul();
  },

  hit(dirX, dirY, power) {
    const c = CLUBS[this.club];
    const speed = this.shotSpeed(power);
    const b = this.ball;
    const len = Math.hypot(dirX, dirY) || 1;
    b.vx = (dirX / len) * speed * Math.cos(c.angle);
    b.vy = (dirY / len) * speed * Math.cos(c.angle);
    b.vz = speed * Math.sin(c.angle);
    b.rest = false;
    b.slow = 0;
    b.age = 0;
    b.shotWith = c;
    b.squash = 1;
    this.lie = { x: b.x, y: b.y };
    this.shots++;
    this.trail = [];
    this.state = "fly";
    this.acc = 0;
    this.aim = null;
    for (let i = 0; i < 7; i++) {
      this.puff.push({ x: b.x, y: b.y, z: b.z, vx: rand(-2, 2), vy: rand(-2, 2),
                       vz: rand(1, 4), life: 1, col: "#e9f2df" });
    }
    Sound.blip(c.id === "putter" ? 420 : 250, 0.06, "square", 0.1);
    Sound.noise(0.05, 0.12);
    buzz(12);
  },

  // One fixed step of ball physics, shared by the live ball and the preview, so
  // the line you are shown is the line the ball takes.
  step(b, dt, preview) {
    if (b.rest) return;
    // Last resort. A ball wedged in a trench can keep enough speed to dodge the
    // slow check, and nobody wants to watch that.
    b.age = (b.age || 0) + dt;
    if (b.age > 30) { b.vx = b.vy = b.vz = 0; b.rest = true; return; }
    const gz = this.groundZ(b.x, b.y);

    if (b.z > gz + 0.001 || b.vz > 0) {                 // in the air
      b.vz -= GRAV * dt;
      const nx = b.x + b.vx * dt, ny = b.y + b.vy * dt, nz = b.z + b.vz * dt;
      const nCell = this.cell(nx, ny);

      if (nCell !== T.VOID) {
        const nh = this.heightAt(nx, ny);
        // One step is ground, and a ball flies over ground and lands on it.
        // More than a step is a face, and a ball flying at a face hits it. The
        // same line decides it for a rolling ball, so a ledge behaves the same
        // way whether you putt at it or fly into it — and a lie tucked under
        // one is still playable with a lofted club.
        if (nh > nz + 0.08 && nh > b.z + STEP_UP) {     // into the face of a rise
          b.vx *= -0.28; b.vy *= -0.28; b.vz *= 0.25;
          b.z = Math.max(b.z, gz);
          if (!preview) this.thud(b.x, b.y, b.z);
          return;
        }
      }
      const tr = this.treeHit(nx, ny, nz);
      if (tr) {                                         // into a tree
        b.vx *= -0.16; b.vy *= -0.16; b.vz *= 0.2;
        this.shoveOut(b, tr);
        if (!preview) this.thud(nx, ny, nz);
        return;
      }

      b.x = nx; b.y = ny; b.z = nz;
      if (nCell === T.VOID) {                           // out over the drop
        if (b.z < -14) { b.gone = true; b.rest = true; }
        return;
      }
      const land = this.heightAt(b.x, b.y);
      if (b.z > land) return;
      b.z = land;
      const g = this.ground(b.x, b.y);
      const club = b.shotWith || CLUBS[0];
      const e = g.e * club.bounce;
      if (e > 0.04 && -b.vz > 0.6) {
        b.vz = -b.vz * e;
        b.vx *= g.k * (0.55 + club.roll * 0.45);
        b.vy *= g.k * (0.55 + club.roll * 0.45);
      } else {
        b.vz = 0;
        b.vx *= g.k * club.roll;
        b.vy *= g.k * club.roll;
      }
      if (!preview) this.land(b.x, b.y, b.z, g);
      return;
    }

    // rolling
    const g = this.ground(b.x, b.y);
    if (!g) { b.gone = true; b.rest = true; return; }
    const sl = this.slope(b.x, b.y);
    b.vx += sl.x * dt * 2.6; b.vy += sl.y * dt * 2.6;
    const sp = Math.hypot(b.vx, b.vy);

    // Anything this slow for this long has stopped, whatever the slope says.
    // Without this a ball nudged into a kerb bounces off it for ever.
    b.slow = sp < 0.15 ? (b.slow || 0) + 1 : 0;
    if (sp < 0.06 || b.slow > 120) { b.vx = b.vy = 0; b.rest = true; return; }

    if (sp > 0.0001) {
      const drop = Math.min(sp, g.f * dt);
      b.vx -= (b.vx / sp) * drop;
      b.vy -= (b.vy / sp) * drop;
    }
    const nx = b.x + b.vx * dt, ny = b.y + b.vy * dt;
    const rt = this.treeHit(nx, ny, b.z + 0.2);
    if (rt) { b.vx *= -0.2; b.vy *= -0.2; this.shoveOut(b, rt); return; }
    const nCell = this.cell(nx, ny);
    if (nCell === T.VOID) { b.x = nx; b.y = ny; b.vz = 0; return; }   // rolls off
    const nh = this.heightAt(nx, ny);
    if (nh > b.z + STEP_UP) {                           // a kerb it cannot climb
      b.vx *= -0.3; b.vy *= -0.3;
      return;
    }
    // Rolling uphill trades speed for height.
    if (nh > b.z + 0.02) {
      const rise = nh - b.z;
      const v2 = b.vx * b.vx + b.vy * b.vy - 2 * GRAV * rise * 0.34;
      if (v2 <= 0.02) { b.vx *= -0.25; b.vy *= -0.25; return; }
      const k = Math.sqrt(v2) / Math.hypot(b.vx, b.vy);
      b.vx *= k; b.vy *= k;
    }
    b.x = nx; b.y = ny;
    // A real drop leaves the ball in the air, so it falls off ledges properly.
    if (nh > b.z - 0.05) b.z = nh;
  },

  // Move the ball to the edge of a trunk it is inside, keeping it on land.
  shoveOut(b, tr) {
    const d = Math.hypot(b.x - tr.x, b.y - tr.y);
    const want = tr.r * 0.62 + 0.12;
    if (d >= want) return;
    const nx = d > 0.001 ? (b.x - tr.x) / d : 1;
    const ny = d > 0.001 ? (b.y - tr.y) / d : 0;
    const px = tr.x + nx * want, py = tr.y + ny * want;
    if (this.cell(px, py) !== T.VOID) { b.x = px; b.y = py; b.z = this.heightAt(px, py); }
  },

  land(x, y, z, g) {
    this.ball.squash = 1;
    for (let i = 0; i < 5; i++) {
      this.puff.push({ x, y, z, vx: rand(-1.5, 1.5), vy: rand(-1.5, 1.5),
                       vz: rand(1, 3.5), life: 1, col: g.top });
    }
    Sound.blip(170, 0.05, "sine", 0.05);
  },

  thud(x, y, z) {
    this.ball.squash = 1;
    for (let i = 0; i < 6; i++) {
      this.puff.push({ x, y, z, vx: rand(-2, 2), vy: rand(-2, 2),
                       vz: rand(0.5, 2.5), life: 0.8, col: "#3c6b34" });
    }
    Sound.noise(0.08, 0.08);
  },

  // ── Update ──
  update(dt) {
    if (this.state === "ready" || this.state === "held" || this.state === "done") return;
    this.rot += this.spin * dt;
    this.spin *= Math.pow(0.02, dt);
    if (Math.abs(this.spin) < 0.01) this.spin = 0;

    if (this.msg) { this.msg.life -= dt; if (this.msg.life <= 0) this.msg = null; }

    for (let i = this.puff.length - 1; i >= 0; i--) {
      const q = this.puff[i];
      q.life -= dt * 1.9;
      q.x += q.vx * dt; q.y += q.vy * dt; q.z += q.vz * dt; q.vz -= 13 * dt;
      if (q.life <= 0) this.puff.splice(i, 1);
    }

    const b = this.ball;
    b.squash = Math.max(0, (b.squash || 0) - dt * 5);

    if (this.state === "fly") {
      this.acc = Math.min((this.acc || 0) + dt, 0.25);
      while (this.acc >= TICK) {
        this.acc -= TICK;
        b.px = b.x; b.py = b.y; b.pz = b.z;
        this.step(b, TICK, false);
        const cup = this.cupCheck(b);
        if (cup) { this.sink(cup); return; }
        if (this.lipped) {
          this.lipped = 0;
          Sound.blip(300, 0.09, "square", 0.09);
          Sound.blip(190, 0.14, "sine", 0.07);
          buzz(22);
        }
        if (b.gone || b.rest) { this.acc = 0; break; }
        if (this.trail.length > 300) this.trail.shift();
        this.trail.push({ x: b.x, y: b.y, z: b.z });
      }
      this.alpha = this.acc / TICK;

      if (b.gone) return this.penalty("off the edge");
      if (b.rest) {
        if (!this.ground(b.x, b.y) || this.cell(b.x, b.y) === T.WATER) {
          return this.penalty("in the water");
        }
        this.state = "aim";
        let near = 1e9;
        for (const c of this.course.cups) {
          if (!c.done) near = Math.min(near, Math.hypot(b.x - c.x, b.y - c.y));
        }
        this.club = near < 6 ? 2 : near < 17 ? 1 : 0;
        this.paintClubs();
      }
    }

    if (this.state === "sunk") {
      this.sinkT -= dt;
      if (this.sinkT <= 0) {
        if (this.course.cups.every((c) => c.done)) return this.finish();
        this.setBall(this.sunkAt.x + rand(-1.1, 1.1), this.sunkAt.y + rand(-1.1, 1.1));
        if (!this.ground(this.ball.x, this.ball.y)) this.setBall(this.sunkAt.x, this.sunkAt.y);
        this.state = "aim";
        this.paintClubs();
      }
      return;
    }

    const look = this.lookAt();
    const rate = Math.min(1, dt * 4.2);
    this.camX += (look.x - this.camX) * rate;
    this.camY += (look.y - this.camY) * rate;
    this.camZ += (look.z - this.camZ) * rate;
    this.frameBall();

    const left = this.course.cups.filter((c) => !c.done).length;
    Hud.set(this.shots, left + (left === 1 ? " cup left" : " cups left"));
  },

  // Where the camera wants to be: the ball, pulled toward the cups still in
  // play. While the ball is moving it leads the ball instead.
  //
  // The pull is capped at what it is worth on the screen rather than in the
  // world, so zooming in walks the camera back onto the ball. Without that, the
  // camera sits off to one side, the course turns about that point instead of
  // about the ball, and a spin at any real zoom parks the ball in a corner.
  lookAt() {
    const b = this.ball;
    const flying = this.state === "fly";
    const lead = flying ? 0.2 : 0;
    let x = b.x + b.vx * lead, y = b.y + b.vy * lead;
    const left = this.course.cups.filter((c) => !c.done);
    if (left.length) {
      let sx = 0, sy = 0;
      for (const c of left) { sx += c.x; sy += c.y; }
      const pull = flying ? 0.12 : 0.38;
      let ox = (sx / left.length - x) * pull;
      let oy = (sy / left.length - y) * pull;
      const cap = Math.min(this.w, this.h) * 0.15 / Math.max(this.scale(), 0.001);
      const d = Math.hypot(ox, oy);
      if (d > cap) { ox *= cap / d; oy *= cap / d; }
      x += ox; y += oy;
    }
    return { x, y, z: Math.max(0, b.z) * 0.45 };
  },

  // Whatever the camera wants, the ball stays inside a box on the screen. This
  // runs after the smoothing, so it is a wall and not a suggestion: turn the
  // course as hard as you like and the ball cannot be pushed out of frame.
  frameBall() {
    const b = this.ball;
    const p = this.proj(b.x, b.y, b.z);
    const mx = this.w * 0.27, top = this.h * 0.20, bot = this.h * 0.78;
    let dx = 0, dy = 0;
    if (p.x < mx) dx = p.x - mx;
    else if (p.x > this.w - mx) dx = p.x - (this.w - mx);
    if (p.y < top) dy = p.y - top;
    else if (p.y > bot) dy = p.y - bot;
    if (!dx && !dy) return;
    const move = this.unproj(dx, dy);                 // screen pixels back into
    this.camX += move.x; this.camY += move.y;         // the world
  },

  // The cup is a hole, not a target, so it is judged the way a hole is: the ball
  // has to fall its own depth in the time it takes to cross the opening. That
  // one line does everything. Straight through the middle is the longest
  // crossing and takes the most pace; clip the edge and the crossing is short,
  // so only a crawl stays down. Too quick for that but not by much and the ball
  // runs round the lip and comes out with the pace taken off it.
  //
  // A ball dropping out of the sky is a separate case: it holes if it lands
  // inside the rim slowly enough not to skid over the far edge.
  cupCheck(b) {
    const air = b.z > this.groundZ(b.x, b.y) + 0.03;
    for (const c of this.course.cups) {
      if (c.done) continue;
      if (!air && Math.abs(b.z - c.z) > 0.3) continue;
      const d = Math.hypot(b.x - c.x, b.y - c.y);
      const sp = Math.hypot(b.vx, b.vy);

      if (air) {                                            // dropped in
        if (b.vz > -1) continue;
        if (b.z > c.z + 0.25 || b.z < c.z - 0.6) continue;
        if (d > CUP_R - BALL_R * 0.5) continue;
        if (sp > 2.4) continue;
        return c;
      }
      if (d > CUP_R) continue;

      // How near the middle the ball will actually pass, not how near it is on
      // the tick it crosses the rim — otherwise every putt is judged at its
      // worst moment.
      const perp = sp > 0.001
        ? Math.abs((b.x - c.x) * b.vy - (b.y - c.y) * b.vx) / sp
        : d;
      const reach = CUP_R - BALL_R * 0.55;                  // the far lip holds a
      if (perp >= reach) continue;                          // ball hanging on it
      const chord = 2 * Math.sqrt(reach * reach - perp * perp);
      const cap = chord * Math.sqrt(GRAV / (2 * CUP_DEPTH));

      if (sp <= cap) return c;

      // Everything past here crosses the hole and comes out the other side, so
      // it is put down on the far rim rather than left to be judged again on
      // the next tick.
      const nx = d > 0.001 ? (b.x - c.x) / d : 1;
      const ny = d > 0.001 ? (b.y - c.y) / d : 0;
      if (sp <= cap * LIP) {                                // round the lip and out
        const sgn = (b.vx * -ny + b.vy * nx) >= 0 ? 1 : -1;
        b.vx = -ny * sgn * sp * 0.34;
        b.vy = nx * sgn * sp * 0.34;
        b.x = c.x + nx * (CUP_R + 0.05);
        b.y = c.y + ny * (CUP_R + 0.05);
        this.lipped = 0.6;
        return null;
      }
      const ex = b.vx / sp, ey = b.vy / sp;                 // straight over it,
      b.vx *= 0.86; b.vy *= 0.86;                           // but it still dips
      b.x = c.x + ex * (CUP_R + 0.03);
      b.y = c.y + ey * (CUP_R + 0.03);
      return null;
    }
    return null;
  },

  sink(cup) {
    const b = this.ball;
    cup.done = true;
    b.rest = true; b.vx = b.vy = b.vz = 0;
    b.x = b.px = cup.x; b.y = b.py = cup.y; b.z = b.pz = cup.z - 0.3;
    this.sunkAt = { x: cup.x, y: cup.y };
    this.state = "sunk";
    this.sinkT = 1.4;
    const left = this.course.cups.filter((c) => !c.done).length;
    this.msg = { txt: left ? "In" : "That is all five", life: 1.4, big: true };
    Sound.blip(680, 0.1, "sine", 0.12);
    Sound.blip(1020, 0.24, "sine", 0.1);
    buzz([16, 40, 24]);
  },

  penalty(why) {
    this.shots++;
    this.setBall(this.lie.x, this.lie.y);
    this.state = "aim";
    this.msg = { txt: why + " · +1", life: 1.8 };
    Sound.slide(280, 90, 0.3, "sawtooth");
    buzz(40);
    this.paintClubs();
  },

  finish() {
    this.state = "done";
    const fresh = Best.setLow(this.id, this.shots);
    const b = Best.get(this.id, 0);
    overlay(
      '<h3>' + (fresh ? "Best round yet" : "Round over") + '</h3>' +
      '<div class="score">' + this.shots + '</div>' +
      '<p class="best">' + (b ? "Best " + b : "&nbsp;") + '</p>' +
      '<button class="btn primary" data-act="again">Another round</button>' +
      '<button class="btn ghost" data-act="home">Back</button>',
      { again: () => this.startRound(), home: () => Router.show("home") }
    );
  },

  // ── Projection ──
  // Rotate on the ground plane, squash the vertical, lift by height.
  scale() { return Math.min(this.w, this.h) * 0.082 * CLUBS[this.club].zoom * this.userZoom; },

  // The zoom that puts the far corners of the land on screen.
  fitZoom() {
    const c = this.course, k = this.scale() / this.userZoom;
    let lo = 1e9, hi = -1e9, top = 1e9, bot = -1e9;
    for (let j = 0; j < c.h; j += 2) {
      for (let i = 0; i < c.w; i += 2) {
        if (c.grid[j * c.w + i] === T.VOID) continue;
        const cs = Math.cos(this.rot), sn = Math.sin(this.rot);
        const dx = i + 0.5 - this.camX, dy = j + 0.5 - this.camY;
        const rx = dx * cs - dy * sn, ry = dx * sn + dy * cs;
        lo = Math.min(lo, rx); hi = Math.max(hi, rx);
        top = Math.min(top, ry * 0.52); bot = Math.max(bot, ry * 0.52);
      }
    }
    if (hi < lo) return 1;
    const needX = (this.w * 0.88) / (Math.max(Math.abs(lo), Math.abs(hi)) * 2 * k);
    const needY = (this.h * 0.62) / (Math.max(Math.abs(top), Math.abs(bot)) * 2 * k);
    return clamp(Math.min(needX, needY), 0.16, 1.4);
  },

  proj(x, y, z) {
    const k = this.scale(), c = Math.cos(this.rot), s = Math.sin(this.rot);
    const dx = x - this.camX, dy = y - this.camY;
    const rx = dx * c - dy * s, ry = dx * s + dy * c;
    return {
      x: this.w / 2 + rx * k,
      y: this.h * 0.60 + ry * k * 0.52 - ((z || 0) - this.camZ) * k * VZ,
      d: ry,
    };
  },

  unproj(sdx, sdy) {
    const k = this.scale(), c = Math.cos(this.rot), s = Math.sin(this.rot);
    const rx = sdx / k, ry = sdy / (k * 0.52);
    return { x: rx * c + ry * s, y: -rx * s + ry * c };
  },

  // ── Touch: a finger on the ball aims, a finger elsewhere turns the course,
  // two fingers zoom. ──
  bindTouch() {
    const cv = Engine.canvas;
    this.pts = new Map();
    const at = (e) => {
      const r = cv.getBoundingClientRect();
      return { x: e.clientX - r.left, y: e.clientY - r.top };
    };

    this.onDown = (e) => {
      if (this.state !== "aim" && this.state !== "fly") return;
      const p = at(e);
      this.pts.set(e.pointerId, p);
      if (this.pts.size === 2) {
        const [a, b] = [...this.pts.values()];
        this.pinch = { d: Math.hypot(a.x - b.x, a.y - b.y), z: this.userZoom };
        this.aim = null;
        return;
      }
      if (this.state !== "aim") return;
      const bp = this.proj(this.ball.x, this.ball.y, this.ball.z);
      if (Math.hypot(p.x - bp.x, p.y - bp.y) < 60) {
        this.aim = { ox: p.x, oy: p.y, x: p.x, y: p.y, power: 0 };
        this.spin = 0;
      } else {
        this.turn = { last: p.x };
      }
    };

    this.onMove = (e) => {
      if (!this.pts.has(e.pointerId)) return;
      const p = at(e);
      this.pts.set(e.pointerId, p);

      if (this.pinch && this.pts.size >= 2) {
        const [a, b] = [...this.pts.values()];
        const d = Math.hypot(a.x - b.x, a.y - b.y);
        this.userZoom = clamp(this.pinch.z * (d / Math.max(1, this.pinch.d)), 0.14, 2.8);
        return;
      }
      if (this.aim) {
        this.aim.x = p.x; this.aim.y = p.y;
        const dx = p.x - this.aim.ox, dy = p.y - this.aim.oy;
        // The putter asks for a longer pull for the same power, because a putt
        // is decided by a fraction of it.
        const pull = Math.min(this.w, this.h) * (CLUBS[this.club].id === "putter" ? 0.62 : 0.34);
        this.aim.power = clamp(Math.hypot(dx, dy) / pull, 0, 1);
        return;
      }
      if (this.turn) {
        const dx = p.x - this.turn.last;
        this.rot -= dx * 0.006;
        this.spin = -dx * 0.09;
        this.turn.last = p.x;
      }
    };

    this.onUp = (e) => {
      const had = this.pts.get(e.pointerId);
      this.pts.delete(e.pointerId);
      if (this.pts.size < 2) this.pinch = null;
      if (this.turn && !this.pts.size) this.turn = null;
      if (!this.aim || !had) return;
      const a = this.aim;
      const dx = a.x - a.ox, dy = a.y - a.oy;
      this.aim = null;
      if (a.power < 0.06 || Math.hypot(dx, dy) < 14) return;   // a tap, not a swing
      const dir = this.unproj(-dx, -dy);                       // pull back to send it forward
      this.hit(dir.x, dir.y, a.power);
    };

    cv.addEventListener("pointerdown", this.onDown);
    cv.addEventListener("pointermove", this.onMove);
    cv.addEventListener("pointerup", this.onUp);
    cv.addEventListener("pointercancel", this.onUp);
  },

  unbindTouch() {
    const cv = Engine.canvas;
    if (!this.onDown) return;
    cv.removeEventListener("pointerdown", this.onDown);
    cv.removeEventListener("pointermove", this.onMove);
    cv.removeEventListener("pointerup", this.onUp);
    cv.removeEventListener("pointercancel", this.onUp);
    this.onDown = this.onMove = this.onUp = null;
  },

  paintClubs() {
    $("clubs").querySelectorAll("button").forEach((b, i) => {
      b.setAttribute("aria-pressed", String(i === this.club));
    });
  },

  pickClub(i) {
    if (this.state !== "aim") return;
    this.club = i;
    this.aim = null;
    this.paintClubs();
    Sound.blip(520 + i * 90, 0.05, "sine", 0.07);
  },

  // ── Drawing ──
  draw(g, w, h) {
    const sky = g.createLinearGradient(0, 0, 0, h);
    sky.addColorStop(0, "#87c1e8");
    sky.addColorStop(0.55, "#cde5f2");
    sky.addColorStop(1, "#eff4ee");
    g.fillStyle = sky; g.fillRect(0, 0, w, h);
    if (!this.course) return;

    const c = this.course;

    // Terrain and everything standing on it, back to front.
    const items = [];
    const k = this.scale(), padX = k * 2.2, padT = k * 5, padB = k * 3;
    const seen = (p) => p.x > -padX && p.x < w + padX && p.y > -padT && p.y < h + padB;
    for (let j = 0; j < c.h; j++) {
      for (let i = 0; i < c.w; i++) {
        const t = c.grid[j * c.w + i];
        if (t === T.VOID) continue;
        const p = this.proj(i + 0.5, j + 0.5, this.heightAt(i + 0.5, j + 0.5));
        if (!seen(p)) continue;
        items.push({ d: p.d, k: 0, i, j, t });
      }
    }
    // Anything standing on a cell is sorted by that cell, not by its own
    // position inside it. A flag sitting a third of a cell forward of the
    // centre used to sort ahead of the ground it stands on, so at some angles
    // its own cell was painted over the top of it and the hole vanished.
    for (const tr of c.trees) {
      const p = this.proj(tr.x, tr.y, tr.z + tr.tall);
      if (!seen(p)) continue;
      items.push({ d: this.cellD(tr.x, tr.y) + 0.01, k: 1, tr });
    }
    for (const cup of c.cups) {
      if (!cup.done) items.push({ d: this.cellD(cup.x, cup.y) + 0.02, k: 2, cup });
    }
    items.sort((a, z) => a.d - z.d);
    for (const it of items) {
      if (it.k === 0) this.drawCell(g, it.i, it.j, it.t);
      else if (it.k === 1) this.drawTree(g, it.tr);
      else this.drawFlag(g, it.cup);
    }

    // The ball goes on top of the world, never sliced by it.
    const b = this.ball;
    const bx = b.px + (b.x - b.px) * (this.alpha || 1);
    const by = b.py + (b.y - b.py) * (this.alpha || 1);
    const bz = b.pz + (b.z - b.pz) * (this.alpha || 1);

    if (this.trail.length > 2) {
      for (let i = 1; i < this.trail.length; i++) {
        const p = this.trail[i], q = this.trail[i - 1];
        const a = (i / this.trail.length) * 0.5;
        const s1 = this.proj(q.x, q.y, q.z), s2 = this.proj(p.x, p.y, p.z);
        g.strokeStyle = "rgba(255,255,255," + a.toFixed(3) + ")";
        g.lineWidth = 1 + a * 3;
        g.lineCap = "round";
        g.beginPath(); g.moveTo(s1.x, s1.y); g.lineTo(s2.x, s2.y); g.stroke();
      }
    }

    for (const q of this.puff) {
      const s = this.proj(q.x, q.y, q.z);
      g.globalAlpha = clamp(q.life, 0, 1) * 0.75;
      g.fillStyle = q.col;
      g.beginPath(); g.arc(s.x, s.y, Math.max(1.4, this.scale() * 0.08 * q.life), 0, TAU); g.fill();
    }
    g.globalAlpha = 1;

    if (this.state !== "sunk") this.drawBall(g, bx, by, bz);
    if (this.state === "aim" && this.aim && this.aim.power > 0.06) this.drawAim(g);

    if (this.msg) {
      g.textAlign = "center"; g.textBaseline = "middle";
      g.globalAlpha = clamp(this.msg.life, 0, 1);
      g.font = (this.msg.big ? "800 34px" : "700 17px") + " system-ui, sans-serif";
      g.fillStyle = "rgba(10,26,18,.35)";
      g.fillText(this.msg.txt, w / 2 + 1, h * 0.14 + 1.5);
      g.fillStyle = "#fff";
      g.fillText(this.msg.txt, w / 2, h * 0.14);
      g.globalAlpha = 1;
    }
  },

  // The sort depth of the cell a thing stands on.
  cellD(x, y) {
    return this.proj(Math.floor(x) + 0.5, Math.floor(y) + 0.5, 0).d;
  },

  // A cell is a top face at its own height, with walls dropping to whatever is
  // beside it. A neighbour that is lower, or missing, leaves a cliff.
  //
  // Colour carries the height. Low ground is grass; the higher it climbs the
  // more it wears through to dirt, and every wall is bare earth with a lighter
  // band along its top edge. So a rise looks like a rise before the ball
  // reaches it, which is the only way the clubs can mean anything.
  drawCell(g, i, j, t) {
    const c = this.course, n = j * c.w + i;
    const z = this.heightAt(i + 0.5, j + 0.5);
    const a = this.proj(i, j, z), b = this.proj(i + 1, j, z);
    const cc = this.proj(i + 1, j + 1, z), d = this.proj(i, j + 1, z);

    const nb = [[0, -1, a, b], [1, 0, b, cc], [0, 1, cc, d], [-1, 0, d, a]];
    for (const [di, dj, p, q] of nb) {
      const t2 = this.cell(i + di + 0.5, j + dj + 0.5);
      const nz = t2 === T.VOID ? z - 2.6 : this.heightAt(i + di + 0.5, j + dj + 0.5);
      if (nz >= z - 0.001) continue;
      const drop = (z - nz) * this.scale() * VZ;
      g.fillStyle = c.sideCol[n];
      g.beginPath();
      g.moveTo(p.x, p.y); g.lineTo(q.x, q.y);
      g.lineTo(q.x, q.y + drop); g.lineTo(p.x, p.y + drop);
      g.closePath(); g.fill();
      const cap = Math.min(drop, this.scale() * 0.14);      // sunlit lip of the cliff
      g.fillStyle = c.capCol[n];
      g.beginPath();
      g.moveTo(p.x, p.y); g.lineTo(q.x, q.y);
      g.lineTo(q.x, q.y + cap); g.lineTo(p.x, p.y + cap);
      g.closePath(); g.fill();
    }

    g.fillStyle = c.topCol[n];
    g.beginPath();
    g.moveTo(a.x, a.y); g.lineTo(b.x, b.y); g.lineTo(cc.x, cc.y); g.lineTo(d.x, d.y);
    g.closePath(); g.fill();

    if (t === T.WATER) {
      g.fillStyle = "rgba(255,255,255,.15)";
      const m = this.proj(i + 0.5, j + 0.5, z);
      g.beginPath();
      g.ellipse(m.x, m.y + Math.sin(Engine.last * 0.002 + i + j) * 1.5,
                this.scale() * 0.26, this.scale() * 0.09, 0, 0, TAU);
      g.fill();
    }
  },

  drawTree(g, tr) {
    const k = this.scale();
    const base = this.proj(tr.x, tr.y, tr.z);
    const top = this.proj(tr.x, tr.y, tr.z + tr.tall);
    g.fillStyle = "rgba(20,45,20,.16)";
    g.beginPath();
    g.ellipse(base.x + k * 0.35, base.y + k * 0.12, k * tr.r * 0.9, k * tr.r * 0.4, 0, 0, TAU);
    g.fill();
    g.strokeStyle = "#5b4227"; g.lineWidth = Math.max(2, k * 0.13); g.lineCap = "round";
    g.beginPath(); g.moveTo(base.x, base.y); g.lineTo(top.x, top.y); g.stroke();
    g.fillStyle = "#2e6b32";
    g.beginPath(); g.arc(top.x, top.y, k * tr.r, 0, TAU); g.fill();
    g.fillStyle = "rgba(255,255,255,.13)";
    g.beginPath();
    g.arc(top.x - k * tr.r * 0.3, top.y - k * tr.r * 0.35, k * tr.r * 0.44, 0, TAU); g.fill();
  },

  drawFlag(g, cup) {
    const k = this.scale();
    const base = this.proj(cup.x, cup.y, cup.z);
    const top = this.proj(cup.x, cup.y, cup.z + 2.4);
    g.fillStyle = "#0f2418";
    g.beginPath(); g.ellipse(base.x, base.y, k * CUP_R, k * CUP_R * 0.52, 0, 0, TAU); g.fill();
    g.strokeStyle = "#f4f4f0"; g.lineWidth = Math.max(1.6, k * 0.07);
    g.beginPath(); g.moveTo(base.x, base.y); g.lineTo(top.x, top.y); g.stroke();
    g.fillStyle = "#e8452f";
    const flap = Math.sin(Engine.last * 0.004 + cup.x) * k * 0.1;
    g.beginPath();
    g.moveTo(top.x, top.y);
    g.lineTo(top.x + k * 0.9, top.y + k * 0.25 + flap);
    g.lineTo(top.x, top.y + k * 0.55);
    g.closePath(); g.fill();
  },

  // Shadow on the ground below, ball above it. The gap between them is the
  // only cue for height, so both are drawn properly.
  drawBall(g, x, y, z) {
    const k = this.scale();

    // Shadow, but only where there is ground to cast it on.
    if (this.cell(x, y) !== T.VOID) {
      const gz = this.heightAt(x, y);
      const air = clamp(z - gz, 0, 9);
      const fade = clamp(1 - air / 9, 0.16, 1);
      const sh = this.proj(x, y, gz);
      g.fillStyle = "rgba(24,52,26," + (0.38 * fade).toFixed(3) + ")";
      g.beginPath();
      g.ellipse(sh.x, sh.y, k * 0.20 * (0.55 + fade * 0.45), k * 0.10 * (0.55 + fade * 0.45),
                0, 0, TAU);
      g.fill();
    }

    const s = this.proj(x, y, z);
    const sq = this.ball.squash || 0;
    const r = Math.max(2.6, k * BALL_R);
    g.save();
    g.translate(s.x, s.y);
    g.scale(1 + sq * 0.35, 1 - sq * 0.3);
    const grd = g.createRadialGradient(-r * 0.35, -r * 0.4, r * 0.1, 0, 0, r * 1.15);
    grd.addColorStop(0, "#ffffff");
    grd.addColorStop(0.55, "#f4f6ef");
    grd.addColorStop(1, "#c2cbbd");
    g.fillStyle = grd;
    g.beginPath(); g.arc(0, 0, r, 0, TAU); g.fill();
    g.fillStyle = "rgba(255,255,255,.85)";
    g.beginPath(); g.arc(-r * 0.32, -r * 0.36, r * 0.26, 0, TAU); g.fill();
    g.restore();
  },

  // The preview runs the real physics forward to the point the ball stops, so
  // what you see is what happens — the carry, the bounces, the run-out and the
  // spot it comes to rest on. That last one is the whole game on a short shot:
  // you can dial a putt until the ring sits on the cup instead of past it.
  //
  // Simulating the shot is cheap but not free, so it is only redone when the
  // pull actually changes.
  aimPath() {
    const a = this.aim, club = CLUBS[this.club], b = this.ball;
    const key = [a.x - a.ox, a.y - a.oy, this.club, b.x, b.y, this.rot.toFixed(3)].join(",");
    if (this.path && this.path.key === key) return this.path;

    const dir = this.unproj(-(a.x - a.ox), -(a.y - a.oy));
    const len = Math.hypot(dir.x, dir.y) || 1;
    const speed = this.shotSpeed(a.power);
    const sim = {
      x: b.x, y: b.y, z: b.z,
      vx: (dir.x / len) * speed * Math.cos(club.angle),
      vy: (dir.y / len) * speed * Math.cos(club.angle),
      vz: speed * Math.sin(club.angle),
      rest: false, shotWith: club, age: 0, slow: 0,
    };

    const pts = [];
    let land = null, holed = false;
    for (let i = 0; i < 1600 && !sim.rest && !sim.gone; i++) {
      this.step(sim, TICK, true);
      const onGround = sim.z <= this.groundZ(sim.x, sim.y) + 0.02;
      if (i % 2 === 0) pts.push({ x: sim.x, y: sim.y, z: sim.z, air: !onGround });
      if (!land && i > 2 && onGround) land = { x: sim.x, y: sim.y, z: sim.z };
      if (this.cupCheck(sim)) { holed = true; break; }
      this.lipped = 0;
    }
    this.path = { key, pts, land, holed, gone: sim.gone,
                  stop: { x: sim.x, y: sim.y, z: sim.z } };
    return this.path;
  },

  drawAim(g) {
    const a = this.aim, club = CLUBS[this.club], k = this.scale();
    const path = this.aimPath();
    const pts = path.pts;

    // Dashed while it is in the air, solid once it is running along the ground.
    g.lineWidth = 2.4; g.lineCap = "round";
    let run = null;
    const flush = () => {
      if (!run || run.list.length < 2) { run = null; return; }
      g.strokeStyle = run.air ? "rgba(255,255,255,.86)" : "rgba(255,255,255,.95)";
      g.setLineDash(run.air ? [5, 6] : []);
      g.beginPath();
      run.list.forEach((s, i) => (i ? g.lineTo(s.x, s.y) : g.moveTo(s.x, s.y)));
      g.stroke();
      run = null;
    };
    for (const p of pts) {
      const s = this.proj(p.x, p.y, p.z);
      if (!run || run.air !== p.air) {
        const tail = run && run.list.length ? run.list[run.list.length - 1] : null;
        flush();
        run = { air: p.air, list: tail ? [tail] : [] };
      }
      run.list.push(s);
    }
    flush();
    g.setLineDash([]);

    // Where it first touches down, and where it finally sits.
    if (path.land && club.id !== "putter") {
      const m = this.proj(path.land.x, path.land.y, path.land.z);
      g.strokeStyle = "rgba(255,255,255,.55)"; g.lineWidth = 1.6;
      g.beginPath();
      g.ellipse(m.x, m.y, k * 0.34, k * 0.34 * 0.52, 0, 0, TAU); g.stroke();
    }
    if (!path.gone) {
      const e = this.proj(path.stop.x, path.stop.y, path.stop.z);
      g.strokeStyle = path.holed ? "#ffd76b" : "rgba(255,255,255,.95)";
      g.lineWidth = path.holed ? 3.4 : 2.4;
      g.beginPath();
      g.ellipse(e.x, e.y, k * 0.5, k * 0.5 * 0.52, 0, 0, TAU); g.stroke();
      g.fillStyle = path.holed ? "rgba(255,215,107,.28)" : "rgba(255,255,255,.14)";
      g.fill();
    }

    const bp = this.proj(this.ball.x, this.ball.y, this.ball.z);
    g.strokeStyle = "rgba(255,255,255,.45)"; g.lineWidth = 2;
    g.setLineDash([3, 5]);
    g.beginPath(); g.moveTo(bp.x, bp.y);
    g.lineTo(bp.x + (a.x - a.ox), bp.y + (a.y - a.oy)); g.stroke();
    g.setLineDash([]);

    g.strokeStyle = a.power > 0.92 ? "#e8452f" : "#fff";
    g.lineWidth = 3;
    g.beginPath();
    g.arc(bp.x, bp.y, k * 0.55, -Math.PI / 2, -Math.PI / 2 + TAU * a.power);
    g.stroke();
  },
};

// ── The island ───────────────────────────────────────────────────────────────
// A hub with five arms reaching out of it, a cup on the head of each. The arms
// are long enough that crossing the course is driver work, and some of them are
// broken part way along, so getting out there is a carry.
function genCourse() {
  const W = 62, H = 62;
  const grid = new Uint8Array(W * H);
  const hgt = new Float32Array(W * H);
  const idx = (i, j) => j * W + i;
  const inside = (i, j) => i >= 0 && j >= 0 && i < W && j < H;
  const cellT = (i, j) => inside(i, j) ? grid[idx(i, j)] : T.VOID;

  const land = (cx, cy, r) => {
    for (let j = Math.floor(cy - r); j <= cy + r; j++) {
      for (let i = Math.floor(cx - r); i <= cx + r; i++) {
        if (inside(i, j) && Math.hypot(i + 0.5 - cx, j + 0.5 - cy) <= r) {
          if (grid[idx(i, j)] === T.VOID) grid[idx(i, j)] = T.ROUGH;
        }
      }
    }
  };
  const paint = (cx, cy, r, t) => {
    for (let j = Math.floor(cy - r); j <= cy + r; j++) {
      for (let i = Math.floor(cx - r); i <= cx + r; i++) {
        if (!inside(i, j) || cellT(i, j) === T.VOID) continue;
        if (Math.hypot(i + 0.5 - cx, j + 0.5 - cy) <= r && grid[idx(i, j)] < t) {
          grid[idx(i, j)] = t;
        }
      }
    }
  };
  const force = (cx, cy, r, t) => {
    for (let j = Math.floor(cy - r); j <= cy + r; j++) {
      for (let i = Math.floor(cx - r); i <= cx + r; i++) {
        if (!inside(i, j) || cellT(i, j) === T.VOID) continue;
        if (Math.hypot(i + 0.5 - cx, j + 0.5 - cy) <= r) grid[idx(i, j)] = t;
      }
    }
  };

  // Hub, then an arm per cup.
  const hub = { x: W / 2, y: H / 2 };
  land(hub.x, hub.y, rand(7, 9));

  const arms = [];
  const spin = Math.random() * TAU;
  for (let a = 0; a < CUPS; a++) {
    const ang = spin + (a / CUPS) * TAU + rand(-0.22, 0.22);
    const len = rand(20, 27);
    const bend = rand(-0.012, 0.012);
    const pts = [];
    for (let sdist = 2; sdist <= len; sdist += 1.1) {
      const aa = ang + bend * sdist * sdist * 0.1;
      pts.push({ x: hub.x + Math.cos(aa) * sdist, y: hub.y + Math.sin(aa) * sdist, u: sdist / len });
    }
    // Some arms are cut through, so the head is only reachable over air.
    const gapAt = Math.random() < 0.55 ? rand(0.42, 0.68) : -1;
    for (const p of pts) {
      if (gapAt > 0 && Math.abs(p.u - gapAt) < 0.16) continue;
      land(p.x, p.y, 2.8 + Math.sin(p.u * Math.PI) * 0.8);
    }
    const head = pts[pts.length - 1];
    land(head.x, head.y, rand(6.6, 8));
    arms.push({ pts, head, gapAt });
  }

  // Height: value noise on a coarse lattice, smoothed and stepped.
  const CO = 7, cw = Math.ceil(W / CO) + 2, ch = Math.ceil(H / CO) + 2;
  const seed = [];
  for (let n = 0; n < cw * ch; n++) seed.push(Math.random());
  const mix = (a, b, t) => a + (b - a) * t;
  const ease = (t) => t * t * (3 - 2 * t);
  for (let j = 0; j < H; j++) {
    for (let i = 0; i < W; i++) {
      const gx = i / CO, gy = j / CO;
      const x0 = Math.floor(gx), y0 = Math.floor(gy);
      const tx = ease(gx - x0), ty = ease(gy - y0);
      const at = (a, b) => seed[Math.min(ch - 1, b) * cw + Math.min(cw - 1, a)];
      const v = mix(mix(at(x0, y0), at(x0 + 1, y0), tx),
                    mix(at(x0, y0 + 1), at(x0 + 1, y0 + 1), tx), ty);
      hgt[idx(i, j)] = Math.round(v * 7) * 0.5;          // 0 .. 3.5, in half steps
    }
  }

  // Fairway down the middle of every arm, and across the hub.
  paint(hub.x, hub.y, 5.5, T.FAIR);
  for (const arm of arms) {
    for (const p of arm.pts) paint(p.x, p.y, 2.2, T.FAIR);
    paint(arm.head.x, arm.head.y, 4.4, T.FAIR);
  }

  // Water in the low ground, away from the greens.
  for (let n = 0; n < W * H; n++) {
    if (grid[n] !== T.ROUGH) continue;
    if (hgt[n] <= 0.5 && Math.random() < 0.7) { grid[n] = T.WATER; hgt[n] = 0.35; }
  }

  // Greens, flattened, each with a bunker or two guarding it.
  const cups = [];
  const flat = (cx, cy, r, z) => {
    for (let j = Math.floor(cy - r); j <= cy + r; j++) {
      for (let i = Math.floor(cx - r); i <= cx + r; i++) {
        if (inside(i, j) && Math.hypot(i + 0.5 - cx, j + 0.5 - cy) <= r) hgt[idx(i, j)] = z;
      }
    }
  };
  for (const arm of arms) {
    const h = arm.head;
    const z = hgt[idx(Math.floor(h.x), Math.floor(h.y))];
    flat(h.x, h.y, 3.4, z);
    // Apron: nothing round a green may sit more than one step off it, or a
    // rolling ball can never get on.
    for (let j = Math.floor(h.y - 7); j <= h.y + 7; j++) {
      for (let i = Math.floor(h.x - 7); i <= h.x + 7; i++) {
        if (!inside(i, j)) continue;
        const dd = Math.hypot(i + 0.5 - h.x, j + 0.5 - h.y);
        if (dd <= 3.4 || dd > 7) continue;
        const step = Math.min(0.5 * Math.ceil((dd - 3.4) / 1.4), 2);
        hgt[idx(i, j)] = clamp(hgt[idx(i, j)], z - step, z + step);
      }
    }
    force(h.x, h.y, 2.8, T.GREEN);
    // Bunkers guard the green from outside it, never on it.
    //
    // A bunker is a dish, not a well: it is levelled at the low point of the
    // ground it sits in and its lip is cut back to one step, so there is always
    // somewhere for a wedge to go. Sand a ball cannot be played out of is not a
    // hazard, it is a dead end. The green itself is never touched by any of it.
    const guards = 1 + ((Math.random() * 2) | 0);
    for (let b = 0; b < guards; b++) {
      const br = rand(1.4, 2.1);
      const ga = Math.random() * TAU, gd = rand(3.2 + br, 4.4 + br);
      const bx = h.x + Math.cos(ga) * gd, by = h.y + Math.sin(ga) * gd;
      force(bx, by, br, T.SAND);

      const around = (r, f) => {
        for (let j = Math.floor(by - r); j <= by + r; j++) {
          for (let i = Math.floor(bx - r); i <= bx + r; i++) {
            if (!inside(i, j) || cellT(i, j) === T.VOID) continue;
            // The green and the flat collar round it are off limits. A bunker
            // that cuts a trench into the collar leaves lies beside the cup
            // that nothing can be played out of.
            if (Math.hypot(i + 0.5 - h.x, j + 0.5 - h.y) <= 3.6) continue;
            const dd = Math.hypot(i + 0.5 - bx, j + 0.5 - by);
            if (dd <= r) f(idx(i, j), dd);
          }
        }
      };
      let lo = 1e9;
      around(br + 1.2, (n) => { lo = Math.min(lo, hgt[n]); });
      if (lo > 1e8) continue;
      around(br + 1.6, (n, dd) => {
        hgt[n] = dd <= br ? lo : Math.min(hgt[n], lo + STEP_UP);
      });
    }
    flat(h.x, h.y, 3.4, z);                       // the green stays a green
    cups.push({ x: h.x, y: h.y, z, done: false });
  }

  // No hollow anywhere on the island may be walled in on all four sides by more
  // than a ball can climb. Anything that is gets raised until one wall is a
  // step, so every lie has a way out.
  const NB = [[1, 0], [-1, 0], [0, 1], [0, -1]];
  for (let pass = 0; pass < 4; pass++) {
    for (let j = 0; j < H; j++) {
      for (let i = 0; i < W; i++) {
        if (cellT(i, j) === T.VOID) continue;
        let lowest = 1e9, open = false;
        for (const [di, dj] of NB) {
          if (cellT(i + di, j + dj) === T.VOID) { open = true; break; }
          lowest = Math.min(lowest, hgt[idx(i + di, j + dj)]);
        }
        if (open) continue;                       // the edge is always a way out
        const h0 = hgt[idx(i, j)];
        if (lowest > h0 + STEP_UP) hgt[idx(i, j)] = Math.ceil((lowest - STEP_UP) * 2) / 2;
      }
    }
  }
  for (const c of cups) c.z = hgt[idx(Math.floor(c.x), Math.floor(c.y))];

  // A tee in the middle of the hub.
  const teeZ = hgt[idx(Math.floor(hub.x), Math.floor(hub.y))];
  flat(hub.x, hub.y, 2.2, teeZ);
  force(hub.x, hub.y, 1.9, T.TEE);

  // Trees, bucketed by cell so a flight test only looks at the nine cells round
  // the ball.
  const trees = [];
  const treeAt = new Map();
  for (let j = 0; j < H; j++) {
    for (let i = 0; i < W; i++) {
      const t = grid[idx(i, j)];
      if (t !== T.ROUGH && t !== T.FAIR) continue;
      if (Math.random() > (t === T.FAIR ? 0.02 : 0.12)) continue;
      let clear = Math.hypot(i + 0.5 - hub.x, j + 0.5 - hub.y) > 4;
      for (const c of cups) if (Math.hypot(i + 0.5 - c.x, j + 0.5 - c.y) < 4.6) clear = false;
      if (!clear) continue;
      const tr = { x: i + 0.5 + rand(-0.2, 0.2), y: j + 0.5 + rand(-0.2, 0.2),
                   z: hgt[idx(i, j)], r: rand(0.5, 0.78), tall: rand(1.1, 2.2) };
      trees.push(tr);
      const key = idx(i, j);
      if (!treeAt.has(key)) treeAt.set(key, []);
      treeAt.get(key).push(tr);
    }
  }

  // Colour every cell once, now that the ground has stopped moving. Grass wears
  // to dirt as it climbs, walls are bare earth, and the lip of a wall catches
  // the light.
  const topCol = new Array(W * H), sideCol = new Array(W * H), capCol = new Array(W * H);
  for (let n = 0; n < W * H; n++) {
    const t = grid[n];
    if (t === T.VOID) continue;
    const gr = GROUND[t];
    // Grass below, dirt above, and one band in between rather than a long
    // gradient — so a rise is a different colour, not a slightly different one.
    const rise = clamp((hgt[n] - 1.0) / 1.5, 0, 1);
    const up = rise * rise * (3 - 2 * rise);
    topCol[n] = mixHex(gr.top, gr.dirt, up);
    sideCol[n] = mixHex(gr.side, "#9a7145", up);
    capCol[n] = mixHex(gr.side, "#c79c66", 0.42 + up * 0.3);
  }

  return { w: W, h: H, grid, hgt, trees, treeAt, cups, topCol, sideCol, capCol,
           tee: { x: hub.x, y: hub.y, z: teeZ } };
}

// ── Ski Fall ─────────────────────────────────────────────────────────────────
// Straight down a mountain that never ends. The trees come at you in ranks with
// one gap in them, and the gap gets narrower the longer you last.
//
// Looking down at the slope from behind and above, the way you would see it
// over your own skis. Down the mountain is down the screen, so the snow scrolls
// up, and everything ahead of you comes in at the bottom edge and rises to meet
// you. There is no horizon: a horizon at the top would put the summit in front
// of you and make the whole thing read as a climb.
//
// Speed is the score and speed is the danger, so everything that pays, pays in
// speed: thread a tree close enough to hear it and you get a push, take a ramp
// and the landing gives you another. Nothing on screen says so. The number
// climbing faster after a near miss says it.
const SNOW = "#f7fbff";

const SkiFall = {
  id: "ski",
  title: "Ski Fall",
  light: true,

  init(w, h) {
    this.resize(w, h);
    this.state = "ready";
    this.obs = [];
    this.spray = [];
    this.track = [];
    this.dist = 0;
    this.boost = 0;
    this.z = 0; this.vz = 0; this.airT = 0;
    this.lean = 0;
    this.scroll = 0;
    Hud.set("0", "metres");
    this.intro();
  },

  resize(w, h) {
    this.w = w; this.h = h;
    this.unit = clamp(Math.min(w, h) * 0.088, 24, 62);   // skier height
    this.lineY = h * 0.30;                               // where the skier rides
    this.x = clamp(this.x || w / 2, this.unit * 0.6, w - this.unit * 0.6);
  },

  intro() {
    overlay(
      '<h3>Ski Fall</h3>' +
      '<p class="why">Down the mountain.</p>' +
      '<button class="btn primary" data-act="play">Start</button>' +
      '<button class="btn ghost" data-act="home">Back</button>',
      { play: () => this.begin(), home: () => Router.show("home") }
    );
  },

  begin() {
    Veil.hide();
    Engine.resume();
    this.state = "run";
    this.obs = [];
    this.spray = [];
    this.track = [];
    this.dist = 0;
    this.boost = 0;
    this.z = 0; this.vz = 0; this.airT = 0;
    this.lean = 0;
    this.shake = 0;
    this.nextRow = this.h * 0.35;
    this.nextLone = this.h * 0.2;
    this.x = this.w / 2;
    Input.dragDelta();
  },

  onPause() {
    if (this.state !== "run") return;
    this.state = "held";
    overlay(
      '<h3>Paused</h3>' +
      '<button class="btn primary" data-act="go">Keep going</button>' +
      '<button class="btn ghost" data-act="home">Give up</button>',
      { go: () => { Veil.hide(); this.state = "run"; Input.dragDelta(); Engine.resume(); },
        home: () => Router.show("home") }
    );
  },

  // How fast the mountain goes past. It climbs by half again over the first
  // 200 m and keeps going to nearly double, which is a ramp you feel inside one
  // run rather than one that only exists on paper.
  speed() {
    return this.unit * (5.2 + Math.min(this.dist / 90, 4.8)) * (1 + this.boost * 0.5);
  },

  // One rank of trees with a single gap in it. The gap is what you aim at, and
  // it closes as you go. Everything is laid down below the bottom edge, because
  // that is what is in front of you.
  row() {
    const w = this.w, u = this.unit;
    const gapW = Math.max(u * 2.0, u * (4.4 - this.dist * 0.006));
    const gx = rand(gapW * 0.55, w - gapW * 0.55);
    const far = this.h + u * 2.6;
    let x = rand(-u * 0.6, u * 0.9);
    while (x < w + u) {
      if (Math.abs(x - gx) > gapW * 0.5) this.place(x, far + rand(-u * 0.5, u * 0.5));
      x += rand(u * 1.4, u * 3.0);
    }
    // Now and then the way through is a ramp, which is worth taking.
    if (Math.random() < 0.30) {
      this.obs.push({ k: "ramp", x: gx + rand(-u * 0.4, u * 0.4), y: far + u * 1.4,
                      s: u * rand(0.95, 1.3), r: u * 0.62, hit: 0 });
    }
  },

  place(x, y) {
    const u = this.unit;
    if (Math.random() < 0.78) {
      const s = u * rand(0.95, 1.5);
      this.obs.push({ k: "tree", x, y, s, r: s * 0.17, lean: rand(-0.05, 0.05), hit: 0 });
    } else {
      const s = u * rand(0.4, 0.7);
      this.obs.push({ k: "rock", x, y, s, r: s * 0.42, hit: 0 });
    }
  },

  update(dt) {
    this.shake = Math.max(0, this.shake - dt * 2.4);
    if (this.state !== "run") return;

    const { w, h, unit: u } = this;
    const spd = this.speed();
    const step = spd * dt;
    this.dist += step / (u * 0.55);
    this.scroll += step;
    this.boost = Math.max(0, this.boost - dt * 0.42);
    Hud.set(Math.floor(this.dist), "metres");

    // Steering. The skier carves rather than slides, so the sideways move is
    // capped and the lean comes out of what it actually did.
    // A skier cuts across the hill about as fast as they are going down it, so
    // the sideways move is capped against the speed rather than the screen.
    // Going quicker does not make you nimbler; it only brings the trees on
    // sooner.
    const want = Input.steer(this.x, dt, w * 1.35, u * 0.6, w - u * 0.6);
    const cap = Math.max(spd * 1.2, w * 0.6) * dt;
    const dx = clamp(want - this.x, -cap, cap);
    this.x += dx;
    const target = clamp(dx / (cap || 1), -1, 1);
    this.lean += (target - this.lean) * Math.min(1, dt * 11);

    // Air.
    if (this.z > 0 || this.vz > 0) {
      this.airT += dt;
      this.vz -= u * 10 * dt;
      this.z += this.vz * dt;
      if (this.z <= 0) {
        this.z = 0; this.vz = 0;
        this.boost = Math.min(1.6, this.boost + clamp(this.airT * 0.4, 0.1, 0.6));
        for (let i = 0; i < 14; i++) this.puff(this.x, this.lineY, 1);
        Sound.noise(0.14, 0.16);
        Sound.blip(220, 0.09, "sine", 0.07);
        buzz(16);
        this.airT = 0;
      }
    }

    // Spawning, measured in ground covered rather than seconds, so the pattern
    // stays the same however fast you are going.
    this.nextRow -= step;
    if (this.nextRow <= 0) {
      this.row();
      this.nextRow = Math.max(u * 4.4, u * (9.5 - this.dist * 0.014)) * rand(0.85, 1.2);
    }
    this.nextLone -= step;
    if (this.nextLone <= 0) {
      this.place(rand(0, w), h + u * 2.6);
      this.nextLone = u * rand(2.4, 6.5);
    }

    // Tracks, laid down where the skis are and left behind up the hill.
    if (this.z <= 0) this.track.push({ x: this.x, y: this.lineY, l: this.lean });
    if (this.track.length > 90) this.track.shift();
    for (const t of this.track) t.y -= step;

    const half = u * 0.24, tall = u * 0.3;
    for (let i = this.obs.length - 1; i >= 0; i--) {
      const o = this.obs[i];
      o.y -= step;                                   // the snow goes up past you
      if (o.y < -u * 2) { this.obs.splice(i, 1); continue; }

      const gapX = Math.abs(o.x - this.x), gapY = Math.abs(o.y - this.lineY);

      if (o.k === "ramp") {
        if (this.z <= 0 && gapX < o.r && gapY < o.s * 0.42) {
          this.vz = u * (7.0 + this.boost * 0.9);
          this.airT = 0;
          for (let n = 0; n < 10; n++) this.puff(this.x, this.lineY, 0.8);
          Sound.slide(280, 720, 0.22, "triangle");
          buzz(20);
        }
        continue;
      }

      if (this.z <= 0 && gapX < o.r + half && gapY < o.r * 0.6 + tall) {
        this.crash(o);
        return;
      }
      // Threading one close enough pays in speed. It only counts once, on the
      // way past.
      if (!o.hit && o.y < this.lineY) {
        o.hit = 1;
        if (this.z <= 0 && gapX < o.r + u * 0.95) {
          this.boost = Math.min(1.6, this.boost + 0.26);
          this.puff(o.x, this.lineY, 0.7);
          Sound.blip(760 + Math.random() * 120, 0.05, "triangle", 0.07);
          buzz(8);
        }
      }
    }

    // Snow off the edges when the skier is on them.
    if (this.z <= 0 && Math.abs(this.lean) > 0.35 && Math.random() < 0.7) {
      this.puff(this.x - this.lean * u * 0.3, this.lineY + u * 0.2, 0.5);
    }
    for (let i = this.spray.length - 1; i >= 0; i--) {
      const p = this.spray[i];
      p.life -= dt * 2.1;
      p.x += p.vx * dt; p.y += (p.vy - spd * 0.55) * dt;
      if (p.life <= 0) this.spray.splice(i, 1);
    }
  },

  puff(x, y, force) {
    for (let i = 0; i < 4; i++) {
      this.spray.push({ x, y, r: rand(1.5, 3.6) * (0.6 + force),
                        vx: rand(-90, 90) * force, vy: rand(-40, 40) * force, life: 1 });
    }
  },

  crash(o) {
    this.state = "over";
    this.shake = 1.5;
    for (let i = 0; i < 22; i++) this.puff(this.x, this.lineY, 1.4);
    const m = Math.floor(this.dist);
    const fresh = Best.set(this.id, m);
    Sound.noise(0.3, 0.26);
    Sound.slide(320, 70, 0.4, "sawtooth");
    buzz([30, 50, 60]);
    overlay(
      '<h3>' + (fresh ? "New best" : (o.k === "rock" ? "Rock" : "Tree")) + '</h3>' +
      '<div class="score">' + m + 'm</div>' +
      '<p class="best">Best ' + Best.get(this.id) + 'm</p>' +
      '<button class="btn primary" data-act="again">Again</button>' +
      '<button class="btn ghost" data-act="home">Back</button>',
      { again: () => this.begin(), home: () => Router.show("home") }
    );
  },

  // ── Drawing ──
  draw(g, w, h) {
    const u = this.unit;
    g.save();
    if (this.shake > 0) {
      const k = this.shake * this.shake * 14;
      g.translate(rand(-1, 1) * k, rand(-1, 1) * k);
    }

    // Snow. The slope you have already skied is in shadow behind you, the run
    // ahead of you is in the light, so the frame itself points downhill.
    const snow = g.createLinearGradient(0, 0, 0, h);
    snow.addColorStop(0, "#cddced");
    snow.addColorStop(0.22, "#e3ecf7");
    snow.addColorStop(0.62, SNOW);
    snow.addColorStop(1, "#ffffff");
    g.fillStyle = snow; g.fillRect(-20, -20, w + 40, h + 40);

    // Groomer lines, scrolling up, to show the speed on empty snow. Broken into
    // segments so empty snow looks like snow and not like ruled paper.
    g.strokeStyle = "rgba(150,178,206,.22)";
    g.lineWidth = 1;
    const gapLine = u * 1.15, span = Math.ceil(h / gapLine) + 2;
    for (let i = 0; i < span; i++) {
      const n = (i * 37) % 97;
      const y = ((i * gapLine + this.scroll * 0.55) % (h + gapLine) + h + gapLine) % (h + gapLine)
                - gapLine;
      if (y < 0 || y > h) continue;
      const x0 = ((n * 37) % 60) / 60 * w * 0.5;
      const x1 = x0 + w * (0.35 + ((n * 53) % 40) / 100);
      g.beginPath(); g.moveTo(x0, y); g.lineTo(Math.min(w, x1), y); g.stroke();
    }

    // Tracks, running back up the hill behind the skier.
    g.strokeStyle = "rgba(146,175,205,.55)";
    g.lineWidth = Math.max(1.2, u * 0.045);
    for (const side of [-1, 1]) {
      g.beginPath();
      let on = false;
      for (const t of this.track) {
        if (t.y < 0) { on = false; continue; }
        const px = t.x + side * u * 0.17;
        on ? g.lineTo(px, t.y) : g.moveTo(px, t.y);
        on = true;
      }
      g.stroke();
    }

    // Everything standing on the snow. Lower on the screen is nearer the
    // bottom of the hill, so it is drawn last and stands in front.
    const sorted = this.obs.slice().sort((a, b) => a.y - b.y);
    for (const o of sorted) {
      if (o.y > h + u * 3) continue;
      if (o.k === "ramp") this.drawRamp(g, o);
      else if (o.k === "rock") this.drawRock(g, o);
      else this.drawTree(g, o);
    }

    if (this.state !== "over") this.drawSkier(g);

    for (const p of this.spray) {
      g.globalAlpha = clamp(p.life, 0, 1) * 0.8;
      g.fillStyle = "#ffffff";
      g.beginPath(); g.arc(p.x, p.y, p.r, 0, TAU); g.fill();
    }
    g.globalAlpha = 1;

    // Haze along the bottom edge, so what is coming fades up out of the slope
    // instead of appearing in one frame.
    const haze = g.createLinearGradient(0, h, 0, h - u * 2.4);
    haze.addColorStop(0, "rgba(255,255,255,1)");
    haze.addColorStop(1, "rgba(255,255,255,0)");
    g.fillStyle = haze; g.fillRect(0, h - u * 2.4, w, u * 2.4 + 2);

    g.restore();
    this.drawBoost(g, w);
  },

  drawTree(g, o) {
    const u = this.unit, s = o.s;
    g.fillStyle = "rgba(96,124,152,.26)";
    g.beginPath();
    g.ellipse(o.x + s * 0.1, o.y + s * 0.06, s * 0.4, s * 0.15, 0, 0, TAU); g.fill();

    g.save();
    g.translate(o.x, o.y);
    g.fillStyle = "#4b3722";
    g.fillRect(-s * 0.06, -s * 0.22, s * 0.12, s * 0.26);
    g.fillStyle = "#1d3524";
    for (let i = 0; i < 3; i++) {
      const t = i / 3;
      const wid = s * (0.42 - t * 0.11);
      const top = -s * (0.34 + t * 0.34);
      const bot = -s * (0.10 + t * 0.34);
      g.beginPath();
      g.moveTo(0, top - s * 0.16);
      g.lineTo(wid, bot); g.lineTo(-wid, bot);
      g.closePath(); g.fill();
    }
    g.fillStyle = "rgba(255,255,255,.75)";           // snow sitting on the top
    g.beginPath();
    g.moveTo(0, -s * 0.727); g.lineTo(s * 0.125, -s * 0.58); g.lineTo(-s * 0.125, -s * 0.58);
    g.closePath(); g.fill();
    g.restore();
  },

  drawRock(g, o) {
    const s = o.s;
    g.fillStyle = "rgba(96,124,152,.26)";
    g.beginPath(); g.ellipse(o.x + s * 0.1, o.y + s * 0.08, s * 0.62, s * 0.24, 0, 0, TAU); g.fill();
    g.fillStyle = "#59616b";
    g.beginPath();
    g.moveTo(o.x - s * 0.6, o.y);
    g.lineTo(o.x - s * 0.34, o.y - s * 0.62);
    g.lineTo(o.x + s * 0.16, o.y - s * 0.72);
    g.lineTo(o.x + s * 0.6, o.y - s * 0.2);
    g.lineTo(o.x + s * 0.42, o.y + s * 0.08);
    g.closePath(); g.fill();
    g.fillStyle = "rgba(255,255,255,.7)";
    g.beginPath();
    g.moveTo(o.x - s * 0.34, o.y - s * 0.62);
    g.lineTo(o.x + s * 0.16, o.y - s * 0.72);
    g.lineTo(o.x + s * 0.3, o.y - s * 0.48);
    g.lineTo(o.x - s * 0.16, o.y - s * 0.42);
    g.closePath(); g.fill();
  },

  drawRamp(g, o) {
    const s = o.s;
    g.fillStyle = "rgba(120,150,180,.22)";
    g.beginPath();
    g.ellipse(o.x, o.y + s * 0.1, s * 0.72, s * 0.2, 0, 0, TAU); g.fill();
    g.fillStyle = "#cfe0f0";
    g.beginPath();
    g.moveTo(o.x - s * 0.66, o.y + s * 0.16);
    g.lineTo(o.x + s * 0.66, o.y + s * 0.16);
    g.lineTo(o.x + s * 0.44, o.y - s * 0.34);
    g.lineTo(o.x - s * 0.44, o.y - s * 0.34);
    g.closePath(); g.fill();
    g.fillStyle = "#ffffff";
    g.beginPath();
    g.moveTo(o.x - s * 0.44, o.y - s * 0.34);
    g.lineTo(o.x + s * 0.44, o.y - s * 0.34);
    g.lineTo(o.x + s * 0.38, o.y - s * 0.5);
    g.lineTo(o.x - s * 0.38, o.y - s * 0.5);
    g.closePath(); g.fill();
    g.fillStyle = "#e8452f";
    g.fillRect(o.x - s * 0.5, o.y - s * 0.5, s * 0.1, s * 0.06);
    g.fillRect(o.x + s * 0.4, o.y - s * 0.5, s * 0.1, s * 0.06);
  },

  // Seen from behind: two skis, a body over them, and a red hat. Ink and one
  // colour, the way everything else in Fall is drawn.
  drawSkier(g) {
    const u = this.unit, air = this.z / u;
    const y = this.lineY - this.z;

    g.fillStyle = "rgba(96,124,152," + (0.3 / (1 + air * 1.6)).toFixed(3) + ")";
    g.beginPath();
    g.ellipse(this.x, this.lineY + u * 0.3, u * 0.34, u * 0.11, 0, 0, TAU); g.fill();

    g.save();
    g.translate(this.x, y);
    const sc = 1 + air * 0.14;
    g.scale(sc, sc);
    g.rotate(this.lean * 0.24);

    g.fillStyle = "#16232e";
    for (const side of [-1, 1]) {                     // skis
      g.save();
      g.translate(side * u * 0.19, u * 0.16);
      g.rotate(this.lean * 0.3);
      g.beginPath();
      g.roundRect ? g.roundRect(-u * 0.055, -u * 0.42, u * 0.11, u * 0.84, u * 0.055)
                  : g.rect(-u * 0.055, -u * 0.42, u * 0.11, u * 0.84);
      g.fill();
      g.restore();
    }
    // Poles, trailing.
    g.strokeStyle = "#16232e"; g.lineWidth = Math.max(1.4, u * 0.045); g.lineCap = "round";
    for (const side of [-1, 1]) {
      g.beginPath();
      g.moveTo(side * u * 0.28, -u * 0.12);
      g.lineTo(side * u * 0.42, u * 0.5);
      g.stroke();
    }
    g.fillStyle = "#16232e";
    g.beginPath();                                     // legs and back
    g.moveTo(-u * 0.2, u * 0.2);
    g.lineTo(-u * 0.26, -u * 0.2);
    g.lineTo(-u * 0.2, -u * 0.5);
    g.lineTo(u * 0.2, -u * 0.5);
    g.lineTo(u * 0.26, -u * 0.2);
    g.lineTo(u * 0.2, u * 0.2);
    g.closePath(); g.fill();
    g.fillStyle = "#e8452f";                           // hat
    g.beginPath(); g.arc(0, -u * 0.6, u * 0.16, 0, TAU); g.fill();
    g.fillStyle = "#16232e";
    g.fillRect(-u * 0.17, -u * 0.56, u * 0.34, u * 0.07);
    g.restore();
  },

  // The push you are carrying, under the score. No label — it fills when you
  // cut it fine and drains when you play safe.
  drawBoost(g, w) {
    if (this.boost <= 0.01) return;
    const bw = 76, x = (w - bw) / 2;
    g.fillStyle = "rgba(22,35,46,.20)";
    g.fillRect(x, 74, bw, 5);
    g.fillStyle = "#e8452f";
    g.fillRect(x, 74, bw * clamp(this.boost / 1.6, 0, 1), 5);
  },
};

const GAMES = [
  { g: DinoFall, art: "dino",
    fmt: (v) => v ? "Best " + Number(v).toFixed(1) + "s" : "Never played" },
  { g: FishFall, art: "fish",
    fmt: (v) => v ? "Best " + v + " points" : "Never played" },
  { g: GolfFall, art: "golf",
    fmt: (v) => v ? "Best " + v + " shots" : "Never played" },
  { g: SkiFall, art: "ski",
    fmt: (v) => v ? "Best " + v + " metres" : "Never played" },
];

const Home = {
  paint() {
    $("cards").innerHTML = GAMES.map((entry, i) => {
      const soon = entry.g.soon;
      return '<button class="card' + (soon ? " locked" : "") + '" data-i="' + i + '"' +
             (soon ? ' disabled' : '') + '>' +
        '<span class="art">' + ART[entry.art] + '</span>' +
        '<span><h2>' + entry.g.title +
          (soon ? '<span class="tag soon">Soon</span>' : '<span class="tag">Beta</span>') + '</h2>' +
          '<span class="meta">' + entry.fmt(Best.get(entry.g.id)) + '</span></span>' +
      '</button>';
    }).join("");

    $("cards").querySelectorAll(".card").forEach((el) => {
      el.addEventListener("click", () => {
        const entry = GAMES[Number(el.dataset.i)];
        if (entry.g.soon) return;
        Sound.wake();
        Engine.run(entry.g);
      });
    });
  },
};

// ── Settings wiring ──────────────────────────────────────────────────────────
function paintSeg(id, value) {
  $(id).querySelectorAll("button").forEach((b) => {
    b.setAttribute("aria-pressed", String(b.dataset.v === value));
  });
}
function paintSwitch(id, on) { $(id).setAttribute("aria-pressed", String(!!on)); }

function paintSettings() {
  paintSeg("ctrlSeg", Settings.controls);
  paintSeg("tiltSeg", Settings.tilt);
  paintSwitch("optSound", Settings.sound);
  paintSwitch("optHaptics", Settings.haptics);
  paintSwitch("optLefty", Settings.lefty);

  const needsPerm = typeof DeviceOrientationEvent !== "undefined" &&
                    typeof DeviceOrientationEvent.requestPermission === "function";
  $("tiltPerm").style.display = (Settings.controls === "tilt" && needsPerm && !Input.tiltSeen) ? "block" : "none";

  const noTilt = Settings.controls === "tilt" && !Input.tiltSeen;
  $("ctrlHint").textContent = noTilt
    ? "This device has not reported any tilt yet. Allow motion access, or steer another way."
    : "";
}

function wireSettings() {
  $("toSettings").addEventListener("click", () => { Router.show("settings"); paintSettings(); });
  $("settingsBack").addEventListener("click", () => Router.show("home"));

  $("ctrlSeg").addEventListener("click", (e) => {
    const b = e.target.closest("button[data-v]");
    if (!b) return;
    Settings.save("controls", b.dataset.v);
    paintSettings();
  });
  $("tiltSeg").addEventListener("click", (e) => {
    const b = e.target.closest("button[data-v]");
    if (!b) return;
    Settings.save("tilt", b.dataset.v);
    paintSettings();
  });

  $("tiltPerm").addEventListener("click", () => {
    if (typeof DeviceOrientationEvent !== "undefined" &&
        typeof DeviceOrientationEvent.requestPermission === "function") {
      DeviceOrientationEvent.requestPermission().then(() => {
        setTimeout(paintSettings, 400);
      }).catch(() => {});
    }
  });
  $("tiltZero").addEventListener("click", (e) => {
    Settings.save("tiltZero", Input.tiltAxis);
    e.target.textContent = "Centred";
    setTimeout(() => { e.target.textContent = "Recentre tilt"; }, 1200);
  });

  const toggle = (id, key) => $(id).addEventListener("click", () => {
    Settings.save(key, !Settings[key]);
    paintSwitch(id, Settings[key]);
    if (key === "sound" && Settings.sound) { Sound.wake(); Sound.blip(760, 0.09, "sine", 0.1); }
    if (key === "haptics" && Settings.haptics) buzz(18);
  });
  toggle("optSound", "sound");
  toggle("optHaptics", "haptics");
  toggle("optLefty", "lefty");

  $("wipe").addEventListener("click", (e) => {
    if (e.target.dataset.sure !== "1") {
      e.target.dataset.sure = "1";
      e.target.textContent = "Tap again to erase";
      setTimeout(() => { e.target.dataset.sure = ""; e.target.textContent = "Erase every best score"; }, 3500);
      return;
    }
    GAMES.forEach((entry) => Store.drop("best_" + entry.g.id));
    e.target.dataset.sure = "";
    e.target.textContent = "Gone";
    setTimeout(() => { e.target.textContent = "Erase every best score"; }, 1500);
  });

  $("quit").addEventListener("click", () => Router.show("home"));

  $("clubs").addEventListener("click", (e) => {
    const b = e.target.closest("button[data-c]");
    if (b && Engine.game && Engine.game.pickClub) Engine.game.pickClub(Number(b.dataset.c));
  });
}

// ── Go ───────────────────────────────────────────────────────────────────────
Engine.boot();
wireSettings();
Home.paint();
document.addEventListener("gesturestart", (e) => e.preventDefault());
document.addEventListener("dblclick", (e) => e.preventDefault());
</script>
