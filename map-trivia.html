<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#0d0d0d">
<meta name="mobile-web-app-capable" content="yes">
<title>Map Trivia</title>
<style>
  :root {
    color-scheme: dark;
    --surface-1: #1a1a19;
    --plane: #0d0d0d;
    --text-primary: #ffffff;
    --text-secondary: #c3c2b7;
    --muted: #898781;
    --grid: #2c2c2a;
    --axis: #383835;
    --border: rgba(255,255,255,0.12);
    --wash: rgba(255,255,255,0.07);
    --land: #303030;
    --land-ink: #4a4a48;
    --accent: #3987e5;
    --good: #0ca30c;
    --bad: #d03b3b;
    --on-fill: #ffffff;
    --sheet-shadow: 0 -8px 32px rgba(0,0,0,.5);
  }

  * { box-sizing: border-box; min-width: 0; -webkit-tap-highlight-color: transparent; }
  /* The page itself never pans or zooms — only the map does, under its own
     gesture handling. Without this a pinch would scale the whole UI. */
  html, body { height: 100%; margin: 0; overscroll-behavior: none; touch-action: none; }
  body {
    background: var(--plane); color: var(--text-primary);
    font: 16px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased;
    display: flex; flex-direction: column;
    height: 100dvh; overflow: hidden;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left);
  }
  button, input, select { font: inherit; color: inherit; touch-action: manipulation; }

  /* ---------- top bar ---------- */
  .top {
    flex: 0 0 auto; display: flex; align-items: center; gap: 8px;
    padding: 9px 12px; border-bottom: 1px solid var(--grid); background: var(--surface-1);
  }
  #mapsel {
    background: var(--wash); border: 1px solid var(--border); border-radius: 10px;
    padding: 9px 8px; font-size: .88rem; font-weight: 600; min-height: 42px;
    max-width: 42vw;
  }
  .modes { display: flex; gap: 2px; background: var(--wash); padding: 3px; border-radius: 10px; }
  .modes button {
    background: none; border: 0; padding: 8px 11px; border-radius: 7px;
    color: var(--text-secondary); cursor: pointer; font-size: .85rem; min-height: 36px;
  }
  .modes button[aria-pressed="true"] {
    background: var(--surface-1); color: var(--text-primary); font-weight: 650;
    box-shadow: 0 1px 2px rgba(0,0,0,.10), 0 0 0 1px var(--border);
  }
  .grow { flex: 1 1 auto; }
  .stat { text-align: right; line-height: 1.15; flex: 0 0 auto; }
  .stat .big { font-size: 1rem; font-weight: 650; font-variant-numeric: tabular-nums; }
  .lives { display: flex; gap: 2px; font-size: .82rem; line-height: 1; justify-content: flex-end; }
  .lives i { font-style: normal; filter: grayscale(1) opacity(.28); }
  .lives i.on { filter: none; }

  .iconbtn {
    background: var(--surface-1); border: 1px solid var(--axis); border-radius: 10px;
    width: 42px; height: 42px; display: grid; place-items: center; cursor: pointer;
    font-size: 1.05rem; flex: 0 0 auto;
  }
  .iconbtn:active { background: var(--wash); }

  /* ---------- map ---------- */
  .maparea { flex: 1 1 auto; position: relative; min-height: 0; background: var(--plane); }
  svg#map { width: 100%; height: 100%; display: block; touch-action: none; }
  #map path {
    fill: var(--land); stroke: var(--plane); stroke-width: 1.6;
    stroke-linejoin: round; vector-effect: non-scaling-stroke;
  }
  #map path.solved { fill: var(--good); pointer-events: none; }
  #map path.active { fill: var(--accent); }
  #map .dot { fill: var(--land-ink); stroke: var(--plane); stroke-width: 1.2;
              vector-effect: non-scaling-stroke; }
  #map .dot.solved { fill: var(--good); pointer-events: none; }
  #map .dot.active { fill: var(--accent); }
  #map text {
    fill: var(--on-fill); text-anchor: middle; font-weight: 700;
    pointer-events: none; opacity: 0; letter-spacing: .02em;
  }
  #map text.show { opacity: 1; }
  .zoomers { position: absolute; right: 10px; bottom: 10px; display: flex; flex-direction: column; gap: 6px; }

  .hint {
    position: absolute; left: 50%; top: 10px; transform: translateX(-50%);
    background: var(--surface-1); border: 1px solid var(--border); border-radius: 999px;
    padding: 7px 14px; font-size: .8rem; color: var(--text-secondary);
    box-shadow: 0 2px 10px rgba(0,0,0,.4); white-space: nowrap; pointer-events: none;
  }

  /* ---------- answer sheet ---------- */
  .sheet {
    flex: 0 0 auto; background: var(--surface-1); border-top: 1px solid var(--grid);
    box-shadow: var(--sheet-shadow);
    padding: 14px 14px calc(14px + env(safe-area-inset-bottom));
  }
  .ask { font-size: .82rem; color: var(--muted); text-transform: uppercase;
         letter-spacing: .07em; font-weight: 650; margin-bottom: 10px; text-align: center; }
  .opts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
  .opts button {
    min-height: 56px; border-radius: 12px; border: 1px solid var(--axis);
    background: var(--surface-1); cursor: pointer; padding: 8px 6px;
    font-size: .92rem; font-weight: 550; line-height: 1.15;
    overflow-wrap: break-word; hyphens: auto;
  }
  .opts button:active { background: var(--wash); }
  .opts button.right { background: var(--good); border-color: var(--good); color: #fff; }
  .opts button.wrongpick { background: var(--bad); border-color: var(--bad); color: #fff; }
  @media (min-width: 620px) { .opts { grid-template-columns: repeat(4, minmax(0,1fr)); } }

  .typerow { display: flex; gap: 8px; }
  .typerow input {
    flex: 1 1 auto; min-width: 0; min-height: 56px; border-radius: 12px; padding: 0 14px;
    border: 1px solid var(--axis); background: var(--plane); font-size: 16px;
  }
  .typerow input:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  .typerow button {
    min-height: 56px; padding: 0 20px; border-radius: 12px; border: 0;
    background: var(--accent); color: #fff; font-weight: 650; cursor: pointer;
  }
  .idle { text-align: center; color: var(--text-secondary); font-size: .92rem; padding: 6px 0 2px; }
  .flash { text-align: center; font-weight: 650; min-height: 1.3em; margin-top: 10px; font-size: .95rem; }
  .flash.ok { color: var(--good); }
  .flash.no { color: var(--bad); }

  /* ---------- overlay ---------- */
  .overlay {
    position: fixed; inset: 0; z-index: 50; display: grid; place-items: center;
    background: rgba(0,0,0,.6); padding: 24px;
  }
  .panel {
    background: var(--surface-1); border-radius: 18px; padding: 26px 22px;
    max-width: 380px; width: 100%; text-align: center;
    box-shadow: 0 20px 60px rgba(0,0,0,.5);
  }
  .panel h2 { margin: 0 0 6px; font-size: 1.4rem; letter-spacing: -0.01em; }
  .panel p { margin: 0 0 18px; color: var(--text-secondary); font-size: .95rem; }
  .panel button {
    width: 100%; min-height: 52px; border-radius: 12px; border: 0;
    background: var(--accent); color: #fff; font-weight: 650; cursor: pointer; font-size: 1rem;
  }
  [hidden] { display: none !important; }

  @keyframes shake {
    0%,100% { transform: translateX(0); }
    25% { transform: translateX(-6px); }
    75% { transform: translateX(6px); }
  }
  .shake { animation: shake .22s ease-in-out 2; }
</style>
</head>
<body>

<div class="top">
  <select id="mapsel" aria-label="Choose a map"></select>
  <div class="modes" role="group" aria-label="Difficulty">
    <button type="button" data-mode="easy" aria-pressed="true">Easy</button>
    <button type="button" data-mode="hard" aria-pressed="false">Hard</button>
  </div>
  <div class="grow"></div>
  <div class="stat">
    <div class="big" id="score">0/0</div>
    <div class="lives" id="lives" aria-label="Lives remaining"></div>
  </div>
</div>

<div class="maparea">
  <svg id="map" role="application"></svg>
  <div class="hint" id="hint"></div>
  <div class="zoomers">
    <button class="iconbtn" id="zin"  type="button" aria-label="Zoom in">+</button>
    <button class="iconbtn" id="zout" type="button" aria-label="Zoom out">−</button>
    <button class="iconbtn" id="zfit" type="button" aria-label="Reset view">⤢</button>
  </div>
</div>

<div class="sheet">
  <div id="idle" class="idle"></div>
  <div id="quiz" hidden>
    <div class="ask" id="ask"></div>
    <div class="opts" id="opts" hidden></div>
    <form class="typerow" id="typerow" hidden autocomplete="off">
      <input id="answer" type="text" autocomplete="off" autocorrect="off"
             autocapitalize="words" spellcheck="false" enterkeyhint="go" aria-label="Name">
      <button type="submit">Go</button>
    </form>
  </div>
  <div class="flash" id="flash" role="status" aria-live="polite"></div>
</div>

<div class="overlay" id="overlay" hidden>
  <div class="panel">
    <h2 id="ovtitle"></h2>
    <p id="ovbody"></p>
    <button type="button" id="ovbtn"></button>
  </div>
</div>

L291.1,418.1L291.3,422.3L292.8,422.6L292.1,425.0L288.7,426.0L286.9,429.6L285.7,430.6L282.6,429.6Z","c":[340.1,433.4],"a":12880,"code":"GB","alt":["united kingdom","uk","great britain","britain","u k"]},{"n":"Vatican City","d":"","c":[571.3,736.1],"a":0,"code":"VA","alt":["vatican city","vatican","holy see"]}]}]};
const MAPS = DATA.maps;
const STORE = "map-trivia-v2";
const MAX_WRONG = 5;

const $ = id => document.getElementById(id);
const norm = s => s.normalize("NFD").replace(/[\u0300-\u036f]/g, "")
  .toLowerCase().replace(/[^a-z0-9 ]+/g, " ").replace(/\s+/g, " ").trim();

/* ---------------- state ---------------- */
let mapId = MAPS[0].id;
let mode = "easy";
let MAP = MAPS[0];
const N = () => MAP.items.length;

const blank = () => ({ solved: [], wrong: 0 });
let save;
try { save = JSON.parse(localStorage.getItem(STORE)) || {}; } catch { save = {}; }
for (const m of MAPS) {
  save[m.id] = save[m.id] || {};
  save[m.id].easy = save[m.id].easy || blank();
  save[m.id].hard = save[m.id].hard || blank();
  save[m.id].best = save[m.id].best || { easy: 0, hard: 0 };
}
const run = () => save[mapId][mode];
const solvedSet = () => new Set(run().solved);
function persist() {
  try { localStorage.setItem(STORE, JSON.stringify(save)); } catch {}
}

/* ---------------- map rendering ---------------- */
const svg = $("map");
const NS = "http://www.w3.org/2000/svg";
let g, byName = {};
let k = 1, tx = 0, ty = 0;
const SMALL = 1600;

function buildMap() {
  byName = {};
  svg.innerHTML = "";
  svg.setAttribute("viewBox", `0 0 ${MAP.w} ${MAP.h}`);
  svg.setAttribute("preserveAspectRatio", "xMidYMid meet");
  svg.setAttribute("aria-label", `Map of ${MAP.title}. Tap a ${MAP.unit} to name it.`);
  g = document.createElementNS(NS, "g");
  svg.appendChild(g);

  for (const s of MAP.items) {
    const p = document.createElementNS(NS, "path");
    p.setAttribute("d", s.d);
    p.dataset.n = s.n;
    p.style.cursor = "pointer";
    g.appendChild(p);

    let dot = null;
    if (s.a < SMALL) {
      dot = document.createElementNS(NS, "circle");
      dot.setAttribute("class", "dot");
      dot.setAttribute("cx", s.c[0]);
      dot.setAttribute("cy", s.c[1]);
      dot.dataset.n = s.n;
      dot.style.cursor = "pointer";
      g.appendChild(dot);
    }

    const t = document.createElementNS(NS, "text");
    t.setAttribute("x", s.c[0]);
    t.setAttribute("y", s.c[1]);
    t.textContent = s.code;
    g.appendChild(t);

    byName[s.n] = { s, path: p, dot, text: t };
  }
  fit();
}

function unitsPerPx() {
  const r = svg.getBoundingClientRect();
  if (!r.width || !r.height) return 1;
  return 1 / Math.min(r.width / MAP.w, r.height / MAP.h);
}

function applyTransform() {
  g.setAttribute("transform", `translate(${tx} ${ty}) scale(${k})`);
  const u = unitsPerPx();
  const r = 10 * u / k;
  const fs = 11 * u / k;
  for (const name in byName) {
    const { s, dot, text } = byName[name];
    const areaPx = s.a * k * k / (u * u);
    if (dot) {
      dot.setAttribute("r", r);
      dot.style.display = areaPx < 1900 ? "" : "none";
    }
    text.setAttribute("font-size", fs);
    text.classList.toggle("show",
      text.classList.contains("solvedlabel") && areaPx > 1100);
  }
}

function fit() { k = 1; tx = 0; ty = 0; applyTransform(); }

function clamp() {
  if (k <= 1) { k = 1; tx = 0; ty = 0; return; }
  tx = Math.min(0, Math.max(MAP.w - MAP.w * k, tx));
  ty = Math.min(0, Math.max(MAP.h - MAP.h * k, ty));
}

function zoomAt(factor, vx, vy) {
  const nk = Math.min(12, Math.max(1, k * factor));
  if (nk === k) return;
  tx += (k - nk) * ((vx - tx) / k);
  ty += (k - nk) * ((vy - ty) / k);
  k = nk;
  clamp();
  applyTransform();
}

function toView(cx, cy) {
  const pt = new DOMPoint(cx, cy).matrixTransform(svg.getScreenCTM().inverse());
  return [pt.x, pt.y];
}

/* ---------------- gestures ----------------
   The map handles its own pan/pinch. Browser-level pinch zoom is suppressed
   page-wide so the sheet, buttons and text field never scale with it. */
["gesturestart", "gesturechange", "gestureend"].forEach(t =>
  document.addEventListener(t, e => e.preventDefault(), { passive: false }));
document.addEventListener("touchmove", e => {
  if (e.touches.length > 1) e.preventDefault();
}, { passive: false });

const pointers = new Map();
let startDist = 0, startK = 1, startMid = null, moved = false, downAt = 0;
let downName = null, multi = false;

svg.addEventListener("pointerdown", e => {
  try { svg.setPointerCapture(e.pointerId); } catch {}
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (pointers.size === 1) {
    moved = false; multi = false; downAt = Date.now();
    downName = (e.target.dataset && e.target.dataset.n) || null;
  }
  if (pointers.size === 2) {
    multi = true;
    const [a, b] = [...pointers.values()];
    startDist = Math.hypot(a.x - b.x, a.y - b.y);
    startK = k;
    startMid = toView((a.x + b.x) / 2, (a.y + b.y) / 2);
  }
});

svg.addEventListener("pointermove", e => {
  const prev = pointers.get(e.pointerId);
  if (!prev) return;
  const dx = e.clientX - prev.x, dy = e.clientY - prev.y;
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });

  if (pointers.size === 1) {
    if (Math.abs(dx) + Math.abs(dy) > 2) moved = true;
    if (k > 1) {
      const u = unitsPerPx();
      tx += dx * u; ty += dy * u;
      clamp(); applyTransform();
    }
  } else if (pointers.size === 2) {
    moved = true;
    const [a, b] = [...pointers.values()];
    const dist = Math.hypot(a.x - b.x, a.y - b.y);
    if (startDist > 0) {
      const nk = Math.min(12, Math.max(1, startK * (dist / startDist)));
      tx += (k - nk) * ((startMid[0] - tx) / k);
      ty += (k - nk) * ((startMid[1] - ty) / k);
      k = nk;
      clamp(); applyTransform();
    }
  }
});

svg.addEventListener("pointerup", e => {
  const wasLast = pointers.size === 1;
  pointers.delete(e.pointerId);
  if (pointers.size < 2) startDist = 0;
  if (wasLast && !moved && !multi && downName && Date.now() - downAt < 600) {
    const n = downName;
    downName = null;
    select(n);
  }
});
svg.addEventListener("pointercancel", e => {
  pointers.delete(e.pointerId);
  if (pointers.size < 2) startDist = 0;
  downName = null;
});

svg.addEventListener("wheel", e => {
  e.preventDefault();
  const [vx, vy] = toView(e.clientX, e.clientY);
  zoomAt(e.deltaY < 0 ? 1.18 : 1 / 1.18, vx, vy);
}, { passive: false });

if (!window.PointerEvent) {
  svg.addEventListener("click", e => {
    const n = e.target.dataset && e.target.dataset.n;
    if (n) select(n);
  });
}

$("zin").onclick  = () => zoomAt(1.5, MAP.w / 2, MAP.h / 2);
$("zout").onclick = () => zoomAt(1 / 1.5, MAP.w / 2, MAP.h / 2);
$("zfit").onclick = () => fit();

/* ---------------- game ---------------- */
let current = null, locked = false;

function shuffle(a) {
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function select(name) {
  if (locked || solvedSet().has(name)) return;
  current = name;
  paint();
  askQuestion();
}

function askQuestion() {
  $("idle").hidden = true;
  $("quiz").hidden = false;
  $("flash").textContent = "";
  $("flash").className = "flash";
  $("ask").textContent = `Which ${MAP.unit} is highlighted?`;

  if (mode === "easy") {
    $("opts").hidden = false;
    $("typerow").hidden = true;
    const others = MAP.items.map(s => s.n).filter(n => n !== current);
    const choices = shuffle([current, ...shuffle(others).slice(0, 3)]);
    $("opts").innerHTML = choices
      .map(c => `<button type="button" data-c="${c}">${c}</button>`).join("");
    for (const b of $("opts").children) b.onclick = () => answer(b.dataset.c, b);
  } else {
    $("opts").hidden = true;
    $("typerow").hidden = false;
    $("answer").placeholder = `Type the ${MAP.unit} name`;
    $("answer").value = "";
    $("answer").focus({ preventScroll: true });
  }
}

function answer(text, btn) {
  if (locked || !current) return;
  const it = byName[current].s;
  const ok = mode === "easy" ? text === current : it.alt.includes(norm(text));

  if (ok) {
    locked = true;
    if (btn) btn.classList.add("right");
    run().solved.push(current);
    const best = save[mapId].best;
    if (run().solved.length > best[mode]) best[mode] = run().solved.length;
    persist();
    flash(`Correct — ${current}`, true);
    byName[current].text.classList.add("solvedlabel");
    current = null;
    setTimeout(() => {
      locked = false;
      paint();
      if (run().solved.length === N()) return over(true);
      idle();
    }, 550);
  } else {
    run().wrong++;
    persist();
    if (btn) btn.classList.add("wrongpick");
    const sheet = document.querySelector(".sheet");
    sheet.classList.add("shake");
    setTimeout(() => sheet.classList.remove("shake"), 460);
    if (navigator.vibrate) navigator.vibrate(60);
    const left = MAX_WRONG - run().wrong;
    if (left <= 0) { paintLives(); return over(false); }
    flash(mode === "easy" ? `Not quite — ${left} ${left === 1 ? "life" : "lives"} left`
                          : `“${text}” isn’t right — ${left} left`, false);
    paintLives();
    if (mode === "easy") {
      locked = true;
      setTimeout(() => { locked = false; askQuestion(); }, 700);
    } else {
      $("answer").select();
    }
  }
}

function flash(msg, ok) {
  const f = $("flash");
  f.textContent = msg;
  f.className = "flash " + (ok ? "ok" : "no");
}

function idle() {
  current = null;
  $("quiz").hidden = true;
  $("idle").hidden = false;
  $("idle").textContent = `Tap any grey ${MAP.unit} to name it.`;
  paint();
}

function paint() {
  const done = solvedSet();
  for (const name in byName) {
    const { path, dot, text } = byName[name];
    const isDone = done.has(name), isCur = name === current;
    path.classList.toggle("solved", isDone);
    path.classList.toggle("active", isCur);
    if (dot) {
      dot.classList.toggle("solved", isDone);
      dot.classList.toggle("active", isCur);
    }
    text.classList.toggle("solvedlabel", isDone);
  }
  applyTransform();
  $("score").textContent = `${done.size}/${N()}`;
  paintLives();
}

function paintLives() {
  const left = Math.max(0, MAX_WRONG - run().wrong);
  $("lives").innerHTML = Array.from({ length: MAX_WRONG },
    (_, i) => `<i class="${i < left ? "on" : ""}">♥</i>`).join("");
  $("lives").setAttribute("aria-label", `${left} of ${MAX_WRONG} lives remaining`);
}

function over(won) {
  locked = true;
  const got = run().solved.length;
  $("ovtitle").textContent = won ? `All ${N()} ${MAP.unitPlural}!` : "Out of lives";
  $("ovbody").textContent = won
    ? `You named every ${MAP.unit} in ${MAP.title} on ${mode} mode without running out of lives.`
    : `You got ${got} of ${N()} before missing ${MAX_WRONG} times. `
      + `Best so far: ${save[mapId].best[mode]}.`;
  $("ovbtn").textContent = won ? "Play again" : "Start over";
  $("overlay").hidden = false;
}

$("ovbtn").onclick = () => {
  save[mapId][mode] = blank();
  persist();
  $("overlay").hidden = true;
  locked = false;
  for (const name in byName) byName[name].text.classList.remove("solvedlabel");
  fit();
  idle();
};

/* ---------------- chrome ---------------- */
function refreshLabels() {
  for (const name in byName) byName[name].text.classList.remove("solvedlabel");
  for (const n of run().solved) if (byName[n]) byName[n].text.classList.add("solvedlabel");
}

function setHint() {
  $("hint").textContent = mode === "easy"
    ? `Tap a ${MAP.unit}, then pick its name`
    : `Tap a ${MAP.unit}, then type its name`;
  $("hint").style.display = "";
  clearTimeout(setHint._t);
  setHint._t = setTimeout(() => { $("hint").style.display = "none"; }, 4000);
}

$("mapsel").innerHTML = MAPS.map(m =>
  `<option value="${m.id}">${m.title}</option>`).join("");
$("mapsel").onchange = () => {
  mapId = $("mapsel").value;
  MAP = MAPS.find(m => m.id === mapId);
  $("overlay").hidden = true;
  locked = false;
  buildMap();
  refreshLabels();
  setHint();
  idle();
  if (run().wrong >= MAX_WRONG) over(false);
};

for (const b of document.querySelectorAll(".modes button")) {
  b.onclick = () => {
    mode = b.dataset.mode;
    for (const o of document.querySelectorAll(".modes button"))
      o.setAttribute("aria-pressed", String(o.dataset.mode === mode));
    $("overlay").hidden = true;
    locked = false;
    refreshLabels();
    setHint();
    idle();
    if (run().wrong >= MAX_WRONG) over(false);
  };
}

$("typerow").onsubmit = e => { e.preventDefault(); answer($("answer").value); };

if (window.visualViewport) {
  const vv = window.visualViewport;
  vv.addEventListener("resize", () => {
    document.body.style.height = vv.height + "px";
    applyTransform();
  });
}
if (window.ResizeObserver) new ResizeObserver(() => applyTransform()).observe(svg);
addEventListener("orientationchange", () => setTimeout(applyTransform, 250));

document.title = "Map Trivia";
buildMap();
refreshLabels();
setHint();
idle();
if (run().wrong >= MAX_WRONG) over(false);
</script>
