/* ───────────────────────── The building in hand ───────────────────────── */

const ghostCells = () => UI.ghost && current() ? cellsAt(current(), UI.ghost) : null;

function placeGhost(o) {
  const [w, h] = extent(orient(DEF[current()].shape, o.rot, o.flip));
  UI.ghost = { rot: o.rot, flip: o.flip, ax: clamp(o.ax, 0, COLS - w), ay: clamp(o.ay, 0, ROWS - h) };
}

/* Starts a new building in hand at the open spot nearest the middle of the map. */
function freshGhost() {
  const type = current();
  if (!type) { UI.ghost = null; return; }
  let best = null;
  for (const p of placements(type)) {
    const [w, h] = extent(orient(DEF[type].shape, p.rot, p.flip));
    const d = (p.ax + w / 2 - COLS / 2) ** 2 + (p.ay + h / 2 - ROWS / 2) ** 2 + (p.rot || p.flip ? 1.5 : 0);
    if (!best || d < best.d) best = { ...p, d };
  }
  UI.ghost = best && { rot: best.rot, flip: best.flip, ax: best.ax, ay: best.ay };
}

function turnGhost(dRot, flip) {
  if (!UI.ghost) return;
  const g = UI.ghost, type = current();
  const [w, h] = extent(orient(DEF[type].shape, g.rot, g.flip));
  const next = { rot: (g.rot + dRot + 4) % 4, flip: flip ? !g.flip : g.flip };
  const [w2, h2] = extent(orient(DEF[type].shape, next.rot, next.flip));
  placeGhost({ ...next, ax: Math.round(g.ax + w / 2 - w2 / 2), ay: Math.round(g.ay + h / 2 - h2 / 2) });
  if (dRot) TUT.turned = true;
  if (flip) TUT.flipped = true;
  paintPanel();
}

function drawGhost(g, now) {
  const cells = ghostCells();
  if (!cells) return;
  const S = UI.S, type = current(), ok = canPlace(cells, type), lift = S * .16;
  const dy = -lift - S * .085, pulse = .8 + .2 * Math.sin(now * 5);
  // The district it would join: its lot breathes a deeper shade in the lanes between the buildings.
  if (ok && !DEF[type].bridge) {
    const joins = districtOf(type, cells);
    if (joins.length) {
      const th = S * .085;
      wg.setTransform(UI.dpr, 0, 0, UI.dpr, 0, 0); wg.clearRect(0, 0, UI.w, UI.h);
      union(wg, joins.flatMap(k => G.pieces[k].cells).concat(cells).filter(c => MAP[c] !== "water"), S * .02, S * .22);
      wg.fillStyle = shade(CAT_HEX[DEF[type].cat], .15); wg.fill();
      wg.globalCompositeOperation = "destination-out";
      for (const k of joins) for (const lift of [0, th]) { union(wg, G.pieces[k].cells, S * .075, S * .16, -lift); wg.fill(); }
      wg.globalCompositeOperation = "source-over";
      g.globalAlpha = .3 + .25 * Math.sin(now * 2.6);
      g.drawImage(wash, 0, 0, UI.w, UI.h);
      g.globalAlpha = 1;
    }
  }
  // The squares it would land on, marked on the board below it.
  g.beginPath();
  for (const c of cells) rr(g, cellX(c) + S * .1, cellY(c) + S * .1, S * .8, S * .8, S * .16);
  g.fillStyle = ok ? "rgba(255,255,255,.38)" : "rgba(214,72,52,.4)"; g.fill();
  if ((press && press.moved) || UI.rules) {
    const own = new Set(cells), ring = new Set();
    for (const c of cells) for (const j of around(c)) if (!own.has(j)) ring.add(j);
    g.save();
    g.setLineDash([S * .09, S * .07]); g.lineWidth = Math.max(1.5, S * .035); g.strokeStyle = "rgba(255,255,255,.8)";
    g.beginPath();
    for (const j of ring) rr(g, cellX(j) + S * .14, cellY(j) + S * .14, S * .72, S * .72, S * .12);
    g.stroke();
    g.restore();
  }
  // A glowing rim: a slightly bigger shape filled underneath, so only its outside edge shows.
  union(g, cells, 0, S * .22, dy + S * .04);
  g.fillStyle = ok ? `rgba(255,255,255,${pulse})` : `rgba(255,105,85,${pulse})`;
  g.fill();
  drawPiece(g, current(), cells, lift, false);
  if (!ok) {
    for (const c of cells) {
      const end = c === cells[0] || c === cells[cells.length - 1];
      if (OWNER[c] < 0 && (MAP[c] !== "water" || (DEF[type].bridge && !end))) continue;
      const x = cellX(c), y = cellY(c) + dy;
      g.beginPath(); rr(g, x + S * .12, y + S * .12, S * .76, S * .76, S * .14); g.fillStyle = "rgba(214,72,52,.55)"; g.fill();
      g.strokeStyle = "#fff"; g.lineWidth = Math.max(2, S * .06); g.lineCap = "round";
      g.beginPath(); g.moveTo(x + S * .36, y + S * .36); g.lineTo(x + S * .64, y + S * .64); g.moveTo(x + S * .64, y + S * .36); g.lineTo(x + S * .36, y + S * .64); g.stroke();
    }
  }
}

function drawSelection(g, now) {
  if (UI.sel < 0) return;
  const S = UI.S, k = OWNER[UI.sel], a = .6 + .4 * Math.sin(now * 4);
  if (k >= 0) {
    if (UI.drop && UI.drop.k === k) return;
    const p = G.pieces[k];
    union(g, p.cells, S * .01, S * .22, -S * .04); g.fillStyle = `rgba(255,214,102,${a})`; g.fill();
    drawPiece(g, p.type, p.cells, 0, false);
  }
}

/* ───────────────────────── Loop ───────────────────────── */

let last = performance.now();
function frame(nowMs) {
  requestAnimationFrame(frame);
  const dt = Math.min(.1, (nowMs - last) / 1000), now = nowMs / 1000;
  last = nowMs;
  if (!G || !UI.w) return;
  NOW = now;
  if (UI.dirty) bake();
  ctx.setTransform(UI.dpr, 0, 0, UI.dpr, 0, 0);
  ctx.clearRect(0, 0, UI.w, UI.h);
  ctx.drawImage(layer, 0, 0, UI.w, UI.h);
  drawWater(ctx, now);
  drawGlints(ctx, now);
  drawHerds(ctx, now);
  if (UI.drop) {
    UI.drop.t += dt;
    const k = Math.min(1, UI.drop.t / .32), p = G.pieces[UI.drop.k];
    drawPiece(ctx, p.type, p.cells, UI.S * .5 * (1 - k) * (1 - k), false);
    if (k >= 1) {
      const S = UI.S, cx = p.cells.reduce((s, c) => s + cellX(c), 0) / p.cells.length + S / 2, cy = p.cells.reduce((s, c) => s + cellY(c), 0) / p.cells.length + S / 2;
      for (let n = 0; n < 12; n++) FX.dust.push({ x: cx, y: cy + S * .3, a: (n / 12) * Math.PI * 2, t: 0 });
      UI.drop = null; UI.dirty = true;
    }
  }
  updateWalkers(dt); drawWalkers(ctx, now);
  for (const [kind, x, y, a, r] of LIVE) live(ctx, kind, x, y, a, r);
  updateSmoke(dt); drawSmoke(ctx);
  drawDust(ctx, dt);
  if ($("dialogWrap").hidden) { drawGhost(ctx, now); drawTarget(ctx, now); }
  drawSelection(ctx, now);
  drawFloats(ctx, dt);
  drawConfetti(ctx, dt);
  tickScore(dt);
}

function tickScore(dt) {
  const target = total();
  if (UI.shown === target) return;
  const step = Math.max(1, Math.abs(target - UI.shown) * dt * 6);
  UI.shown = UI.shown < target ? Math.min(target, UI.shown + step) : Math.max(target, UI.shown - step);
  $("score").textContent = Math.round(UI.shown);
}

/* ───────────────────────── Words on screen ───────────────────────── */

const catColor = (cat) => `var(--${cat})`;
const chip = (cat) => `<span class="chip" style="--c:${catColor(cat)}">${CATS[cat].name}</span>`;

function shapeSVG(type, rot = 0, flip = false, box = 44) {
  const offs = orient(DEF[type].shape, rot, flip), [w, h] = extent(offs);
  const s = Math.floor(box / Math.max(w, h, 3)), gap = Math.max(1, s * .12);
  const color = getComputedStyle(document.documentElement).getPropertyValue(`--${DEF[type].cat}`).trim();
  const cellsSvg = offs.map(([x, y]) => `<rect x="${x * s + gap / 2}" y="${y * s + gap / 2}" width="${s - gap}" height="${s - gap}" rx="${s * .22}" fill="${color}"/>`).join("");
  return `<svg width="${w * s}" height="${h * s}" viewBox="0 0 ${w * s} ${h * s}">${cellsSvg}</svg>`;
}

const LAND_HEX = { grass: "#a5c884", forest: "#5b9a58", ore: "#9a9285", wheat: "#e2bf5c", herd: "#c4a37c", water: "#62abc9" };

/* A small picture of what a rule counts: a kind of land, a kind of building, the map edge. */
function ruleIcon(r) {

  if (r.k === "land") return svg(`<rect x="1" y="1" width="18" height="18" rx="4" fill="${LAND_HEX[r.t]}"/><path d="M5.5 15.5V9.8L10 5.8l4.5 4v5.7z" fill="#fff"/>`);

      `<rect x="13.6" y="1" width="5" height="5" rx="1.2" fill="${CAT_HEX[cat]}"/><rect x="1" y="13.6" width="5" height="5" rx="1.2" fill="${CAT_HEX[cat]}"/>`);

    return svg(`<rect x="1.5" y="5.5" width="8" height="9" rx="2.5" fill="#fff" stroke="#c9c2b4"/><rect x="10.5" y="5" width="8.5" height="10" rx="2.5" fill="${CAT_HEX[cat]}"/>`);

  return svg(`<rect x="1" y="6" width="5.5" height="8" rx="1.5" fill="${CAT_HEX.home}"/><rect x="7.25" y="6" width="5.5" height="8" rx="1.5" fill="${CAT_HEX.shop}"/><rect x="13.5" y="6" width="5.5" height="8" rx="1.5" fill="${CAT_HEX.civic}"/>`);
}
/* A district: three squares of one kind, joined into one lot. */
const districtIcon = (cat) => `<svg class="ico" viewBox="0 0 20 20"><path d="M1 3.5A2.5 2.5 0 0 1 3.5 1h13A2.5 2.5 0 0 1 19 3.5v13a2.5 2.5 0 0 1-2.5 2.5h-6A2.5 2.5 0 0 1 8 16.5V12H3.5A2.5 2.5 0 0 1 1 9.5z" fill="${shade(CAT_HEX[cat], .55)}"/>` +
  `<g fill="${CAT_HEX[cat]}"><rect x="2.5" y="2.5" width="6" height="6" rx="1.5"/><rect x="11.5" y="2.5" width="6" height="6" rx="1.5"/><rect x="11.5" y="11.5" width="6" height="6" rx="1.5"/></g></svg>`;
const rowHTML = (v, text, cls, icon) =>
  `<li class="${cls ?? (v < 0 ? "bad" : "")}"><b>${signed(v)}</b>${icon || '<i class="sp"></i>'}<span>${esc(text)}</span></li>`;

let toastTimer = 0;

}

/* ───────────────────────── Info about a square ───────────────────────── */

function select(i) {
  UI.rules = false; UI.sel = i;
  paintInfo(); paintPanel();
  tutEvent("select");
}
function closeInfo() {
  const wasRules = UI.rules;
  UI.sel = -1; UI.rules = false; $("info").hidden = true;
  if (wasRules && G && G.player) paintPanel();
}
function toggleRules() {
  if (UI.rules) return closeInfo();
  UI.sel = -1; UI.rules = !!current();
  paintInfo(); paintPanel();
  if (UI.rules) tutEvent("rules");
}
const ghostRow = () => { const cells = ghostCells(); return cells ? cells.reduce((sum, c) => sum + rowOf(c), 0) / cells.length : 0; };
function placeInfo(row) {
  const step = tutStep(), side = step ? (step.side === "top" ? "bottom" : "top") : null;
  const cls = "card " + (side || (row >= ROWS / 2 ? "top" : "bottom"));
  if ($("info").className !== cls) $("info").className = cls;
}

function paintInfo() {
  const box = $("info"), i = UI.sel;
  let html = `<button class="x" id="infoX" aria-label="Close">×</button>`;
  if (UI.rules && current()) {
    const d = DEF[current()];
    html += `<div class="kind">Scoring ${chip(d.cat)}</div><h3>${esc(d.name)}</h3><p>${esc(d.blurb)}</p>${modsHTML(current())}`;
    placeInfo(ghostRow());
  } else if (i >= 0 && OWNER[i] >= 0) {
    const k = OWNER[i], p = G.pieces[k], d = DEF[p.type], parts = pieceParts(k);
    const rows = parts.map(q => {
      const r = d.rules[q.r];
      return rowHTML(q.v, partText(p.type, q), q.r === -1 ? "base" : q.v < 0 ? "bad" : q.v === 0 ? "zero" : "", q.r === "district" ? districtIcon(d.cat) : r && ruleIcon(r));
    }).join("");
    html += `<div class="kind">Built ${chip(d.cat)}</div><h3>${esc(d.name)} <span class="scored">${signed(sumParts(parts))}</span></h3><ul class="mods">${rows}</ul>`;
    placeInfo(rowOf(i));
  } else {
    return closeInfo();
  }
  box.innerHTML = html;
  box.hidden = false;
  $("infoX").onclick = closeInfo;
}

/* ───────────────────────── Moves ───────────────────────── */

function doBuild() {
  const cells = ghostCells();
  if (!G || G.over || !placeOK()) return;
  const res = build(cells), S = UI.S;
  const middle = (cs) => [cs.reduce((sum, c) => sum + cellX(c), 0) / cs.length + S / 2, cs.reduce((sum, c) => sum + cellY(c), 0) / cs.length + S / 2];
  // Neighbours whose scores moved show it over their roofs.
  for (const x of res.changed) {
    const [nx, ny] = middle(G.pieces[x.k].cells);
    FX.floats.push({ x: nx, y: ny - S * .2, t: -.35, text: signed(x.d), good: x.d > 0 });
  }
  const [cx, cy] = middle(cells);
  if (res.trophies.some(id => TROPHIES[id].good)) burst(cx, cy, res.gain >= JACKPOT ? 90 : 45);
  UI.drop = { k: res.k, t: 0 };
  UI.dirty = true;
  freshGhost();
  showPop(res, cells);
  bumpScore();
  for (const e of res.events) if (e.away) toast(`No room for the ${DEF[e.away].name}. −${AWAY}`, 3000);
  save(); hud();
  if (G.over) closeInfo(); else if (UI.rules || UI.sel >= 0) paintInfo();
  paintPanel();
  if (G.over) { if (!G.tut) recordBest(); setTimeout(showSummary, 2400); }
  tutEvent("build", res);
}

const CUP = `<svg viewBox="0 0 24 24" fill="#ffd45c"><path d="M7 3h10v2h3v3a4 4 0 0 1-4 4h-.4A5 5 0 0 1 13 14.9V17h3v3H8v-3h3v-2.1A5 5 0 0 1 8.4 12H8a4 4 0 0 1-4-4V5h3zM6 7v1a2 2 0 0 0 1 1.7V7zm11 0v2.7A2 2 0 0 0 18 8V7z"/></svg>`;
const DOWN = `<svg viewBox="0 0 24 24" fill="none" stroke="#ff9f8a" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7l6 6 4-4 8 8"/><path d="M15 17h6v-6"/></svg>`;

/* The new building's score, big, over its roof, with any trophies under it. It stays this long, fade included. */
let popTimer = 0;
const popPills = (res) => Math.min(2, res.trophies.filter(id => TROPHIES[id].good).length) + Math.min(1, res.trophies.filter(id => !TROPHIES[id].good).length);
const popTime = (res) => res ? 1300 + popPills(res) * 600 + 400 : 0;
function showPop(res, cells) {
  const good = res.trophies.filter(id => TROPHIES[id].good).slice(0, 2);
  const bad = res.trophies.filter(id => !TROPHIES[id].good).slice(0, 1);
  const tier = res.gain >= JACKPOT ? "gold" : res.gain >= GREAT ? "great" : res.pts <= 0 ? "low" : "";
  const pop = $("pop");
  pop.innerHTML = `<div class="popnum num ${tier}" id="popNum">+0</div>` + [...good, ...bad].map((id, n) =>
    `<div class="tpill${TROPHIES[id].good ? "" : " bad"}" style="animation-delay:${.25 + n * .15}s">${TROPHIES[id].good ? CUP : DOWN}${TROPHIES[id].name}</div>`).join("");
  const S = UI.S, x = cells.reduce((sum, c) => sum + cellX(c), 0) / cells.length + S / 2, y = Math.min(...cells.map(cellY));
  pop.className = "pop";
  pop.style.left = clamp(x, 90, UI.w - 90) + "px";
  pop.style.top = Math.max(60 + (good.length + bad.length) * 34, y + S * .2) + "px";
  pop.hidden = false;
  const start = performance.now();
  const count = (now) => {
    const k = Math.min(1, (now - start) / 500), el = $("popNum");
    if (!el) return;
    el.textContent = signed(Math.round(res.pts * (1 - (1 - k) ** 3)));
    if (k < 1) requestAnimationFrame(count);
  };
  requestAnimationFrame(count);
  clearTimeout(popTimer);
  popTimer = setTimeout(() => {
    pop.classList.add("hide");
    popTimer = setTimeout(() => { pop.hidden = true; }, 400);
  }, popTime(res) - 400);
}
function hidePop() { clearTimeout(popTimer); $("pop").hidden = true; }
function bumpScore() {
  const el = $("score").parentElement;
  el.classList.remove("bump"); void el.offsetWidth; el.classList.add("bump");
}

/* ───────────────────────── Touch ───────────────────────── */

function boardPoint(e) {
  const r = cv.getBoundingClientRect();
  return [(e.clientX - r.left - UI.BX) / UI.S, (e.clientY - r.top - UI.BY) / UI.S];
}

let press = null;
cv.addEventListener("pointerdown", (e) => {
  if (!G) return;
  cv.setPointerCapture(e.pointerId);
  const [fx, fy] = boardPoint(e);
  const cells = ghostCells(), here = inside(Math.floor(fx), Math.floor(fy)) ? idx(Math.floor(fx), Math.floor(fy)) : -1;
  // The ghost floats a little above its squares, so a press just below it still counts as grabbing it.
  const lifted = inside(Math.floor(fx), Math.floor(fy + .25)) ? idx(Math.floor(fx), Math.floor(fy + .25)) : -1;
  const onGhost = !!cells && (cells.includes(here) || cells.includes(lifted));
  press = { x: e.clientX, y: e.clientY, fx, fy, here, onGhost, moved: false, touch: e.pointerType !== "mouse",
            gx: UI.ghost ? fx - UI.ghost.ax : 0, gy: UI.ghost ? fy - UI.ghost.ay : 0 };
});
cv.addEventListener("pointermove", (e) => {
  if (!press || !UI.ghost || G.over) return;
  if (!press.moved && Math.hypot(e.clientX - press.x, e.clientY - press.y) < 7) return;
  press.moved = true;
  const [fx, fy] = boardPoint(e), type = current();
  const [w, h] = extent(orient(DEF[type].shape, UI.ghost.rot, UI.ghost.flip));
  let ax, ay;
  if (press.onGhost) { ax = Math.round(fx - press.gx); ay = Math.round(fy - press.gy); }
  else { ax = Math.round(fx - w / 2); ay = Math.round(fy - (press.touch ? 1.3 : 0) - h / 2); }
  const before = UI.ghost.ax + "," + UI.ghost.ay;
  placeGhost({ ...UI.ghost, ax, ay });
  if (UI.ghost.ax + "," + UI.ghost.ay !== before) {
    $("bBuild").disabled = !placeOK();
    if (UI.rules) placeInfo(ghostRow());
    paintCoach();
  }
});
cv.addEventListener("pointerup", () => {
  if (!press) return;
  const p = press;
  press = null;
  if (p.moved) return;
  if (p.onGhost && !G.over) return toggleRules();
  // Only buildings have anything to say.
  if (p.here < 0 || OWNER[p.here] < 0 || p.here === UI.sel) return closeInfo();
  select(p.here);
});
cv.addEventListener("pointercancel", () => { press = null; });

addEventListener("keydown", (e) => {
  if (e.target.tagName === "INPUT" || !G) return;
  if (e.key === "Escape") { if (!$("sheetWrap").hidden) closeSheet(); else closeInfo(); return; }
  if (!$("sheetWrap").hidden || !$("dialogWrap").hidden || G.over || !UI.ghost) return;
  const moves = { ArrowLeft: [-1, 0], ArrowRight: [1, 0], ArrowUp: [0, -1], ArrowDown: [0, 1] };
  if (moves[e.key]) { e.preventDefault(); placeGhost({ ...UI.ghost, ax: UI.ghost.ax + moves[e.key][0], ay: UI.ghost.ay + moves[e.key][1] }); paintPanel(); }
  else if (e.key === "r" || e.key === "R") turnGhost(e.shiftKey ? -1 : 1, false);
  else if (e.key === "f" || e.key === "F") turnGhost(0, true);
  else if (e.key === "Enter") doBuild();
});

    ${UI.confirm ? `<p style="margin:10px 2px 0;font-size:.82rem;color:var(--bad)">Start again and this town is lost. Tap once more.</p>` : ""}
    <h2 style="margin-top:18px">How to play</h2>${RULES_HTML}
    <div class="row"><button class="tool" id="mClose">Close</button></div>`);

  $("mTut").onclick = startTutorial;
}

function showDeck() {

const DAILY = "hugelland.daily", NAME = "hugelland.name";

/* The name from last time, so a new game is two taps. */
function lastName() {
  try { return (localStorage.getItem(NAME) || "").slice(0, 14); } catch (e) { return ""; }
}

/* The day the player last finished, what they scored on it, and how many days in a row they have played. */
function dailyRecord() {
  try { return JSON.parse(localStorage.getItem(DAILY)) || null; } catch (e) { return null; }
}
const yesterdayOf = (key) => { const d = new Date(key + "T12:00:00Z"); d.setUTCDate(d.getUTCDate() - 1); return dayKey(d); };

/* The first finished run of a day is the one that counts, so a second run is practice. */
function recordDaily() {
  const past = dailyRecord();
  if (!isDaily() || G.day !== dayKey()) return past;
  if (past && past.day === G.day) {
    if (past.par === G.par) return past;
    const fixed = { ...past, par: G.par };
    try { localStorage.setItem(DAILY, JSON.stringify(fixed)); } catch (e) {}
    return fixed;
  }
  const streak = past && past.day === yesterdayOf(G.day) ? past.streak + 1 : 1;
  const now = { day: G.day, score: total(), par: G.par, goals: goalsDone(), streak };
  try { localStorage.setItem(DAILY, JSON.stringify(now)); } catch (e) {}
  cloudPost(now);
  return now;
}

/*
  A daily leaderboard: fill in a Supabase project's URL and its public anon key, and the game posts each day's
  score and reads the day's top ten. Left empty, the game never touches the network and shows no board.
*/
const CLOUD = { url: "", key: "", table: "daily_scores" };
const cloudOn = () => !!(CLOUD.url && CLOUD.key);
const cloudHead = () => ({ "Content-Type": "application/json", apikey: CLOUD.key, Authorization: `Bearer ${CLOUD.key}` });

async function cloudPost(run) {
  if (!cloudOn()) return;
  try {
    await fetch(`${CLOUD.url}/rest/v1/${CLOUD.table}`, { method: "POST", headers: cloudHead(),
      body: JSON.stringify({ day: run.day, name: G.player.slice(0, 14), score: run.score, goals: run.goals, par: run.par }) });
  } catch (e) {}
}
async function cloudTop(day) {
  if (!cloudOn()) return null;
  try {
    const r = await fetch(`${CLOUD.url}/rest/v1/${CLOUD.table}?day=eq.${day}&select=name,score,goals&order=score.desc&limit=10`, { headers: cloudHead() });
    return r.ok ? await r.json() : null;
  } catch (e) { return null; }
}

function recordBest() {
  try { const best = +localStorage.getItem(BEST) || 0; if (total() > best) localStorage.setItem(BEST, total()); } catch (e) {}
}

/* Bump when a change to the map, the deck or the scoring means an old link no longer gives the same game. */
const LINK_VERSION = 6;

function challengeURL() {
  const base = location.href.split(/[?#]/)[0], who = encodeURIComponent(G.player);
  // A daily town shares its day, so a friend gets the goals and the par with the map.
  return isDaily() ? `${base}?daily=${G.day}&score=${total()}&from=${who}&v=${LINK_VERSION}`
                   : `${base}?seed=${G.seed}&score=${total()}&from=${who}&v=${LINK_VERSION}`;
}

/* The phone's share sheet where there is one; otherwise copy the link, or show it to copy by hand. */
async function shareChallenge() {
  const url = challengeURL(), button = $("sShare");
  if (navigator.share) {
    const where = isDaily() ? (G.day === dayKey() ? "on today's map" : `on the ${dayName(G.day)} map`) : "on the same map";
    try { await navigator.share({ title: GAME, text: `I scored ${total()} in ${GAME}. Beat me ${where}!`, url }); return; }
    catch (e) { if (e && e.name === "AbortError") return; }
  }
  try {
    await navigator.clipboard.writeText(url);
    if (button) button.textContent = "Link copied ✓";
  } catch (e) {
    const box = $("shareBox");
    if (!box) return;
    box.innerHTML = `<input readonly value="${esc(url)}">`;
    box.querySelector("input").select();
  }
}

/* The dots under the summary follow the page you swiped to, and move it when tapped. */
function pageDots() {
  const box = $("pages"), dots = [...$("dots").children], hint = document.querySelector(".swipe");
  const mark = () => {
    const i = Math.round(box.scrollLeft / (box.scrollWidth / dots.length));
    dots.forEach((d, k) => d.setAttribute("aria-current", String(k === i)));
    if (hint) hint.style.visibility = i === dots.length - 1 ? "hidden" : "visible";
  };
  box.addEventListener("scroll", mark, { passive: true });
  dots.forEach((d, i) => { d.onclick = () => box.scrollTo({ left: i * box.scrollWidth / dots.length, behavior: "smooth" }); });
}

/* ───────────────────────── Tutorial ───────────────────────── */

/*
  A short game on a map drawn by hand, with eight buildings in a set order. A coach card says what to do next,
  and the Build button waits until the building sits where the step wants it. The tutorial is never saved, so a
  town under way is still there when it ends.

  F woods, O ore, W wheat, H herd, ~ water, . open grass. The mill fits the woods only when turned and flipped,
  the farm that helps the homes sits on the Mine's ore, and the bridge crosses the river next to the homes.
  The lake keeps the land tight: at the end the Church, a plus, fits in only two gaps, next to the last ore.
  A Mine put down without thinking of it can take both, and the Church is turned away.
*/
const TUT_MAP = [
  "F.F..~~~~",
  ".FFF.~~~~",
  ".F..~~~~~",
  ".F.~~~~~~",
  "FFF..~~~~",
  ".....~~~~",
  ".....~.~~",
  "OO...~.HH",
  "OOW..~.H~",
  "OOW..~~~~",
  "....~~~~~",
  "~~~~~~~~~",
];
const TUT_LAND = { F: "forest", O: "ore", W: "wheat", H: "herd", "~": "water", ".": "grass" };
const TUT_DECK = ["lumber", "cabin", "loghouse", "homestead", "farm", "bridge", "mine", "church"];
const TUT = { on: false, i: 0, turned: false, flipped: false, last: null, html: "", until: 0, timer: 0 };

const squares = (xys) => xys.map(([x, y]) => idx(x, y));
const sameCells = (a, b) => !!a && a.length === b.length && a.every(c => b.includes(c));
const landOf = (r) => r.parts.find(q => q.r === 0).n;
const gained = (r) => r.changed.reduce((sum, x) => sum + x.d, 0);

/*
  side:  where the coach sits, "top" or "bottom", clear of the squares the step is about.
  next:  the step waits for the Next button. wait: it waits for "rules", "deck", "sheetclose" or "select".
  build: the squares the building must cover, or "any". ghost: where the building in hand starts.
  hold:  how long the coach stays away first, so the player can look: milliseconds, or "pop" to wait until the
         score and trophies over the new building have gone.
  text gets the last build's result, so it can name the points the move earned.
*/
const STEPS = [
  { side: "bottom", next: true,
    text: () => `Hügelland is a jigsaw. Every building must fit somewhere, and one with no room costs −${AWAY}. Within that, put each where it scores the most. First up: a <b>Lumber Mill</b>.` },
  { side: "bottom", wait: "rules",
    text: () => `Tap the mill on the map, or tap its name in the panel below, to see how it scores.` },
  { side: "bottom", next: true, hold: 2200, leave: () => closeInfo(),
    text: () => `Each row is one way the mill scores. <b>Base</b> is always yours. <b>District</b>: +1 for each industry it touches. <b>Woods</b>: +2 for each woods square under it or next to it, the dashed squares.` },
  { side: "bottom", build: [[2, 0], [2, 1], [1, 1], [1, 2]],
    todo: (s) => [["Turn", TUT.turned], ["Flip", TUT.flipped], ["On the outline", sameCells(ghostCells(), squares(s.build))]],
    text: () => `The outline sits deep in the woods. Use <b>Turn</b> and <b>Flip</b> to match its shape. Then drag the mill onto it and tap <b>Build</b>.` },
  { side: "bottom", next: true, hold: "pop",
    text: (r) => `+${r.pts}! <b>Perfect ground</b>: every square is on woods. <b>Rich land</b>: ${landOf(r)} woods in all. Build well to win trophies.` },
  { side: "top", build: [[0, 6], [1, 6]], ghost: { rot: 0, flip: false, ax: 3, ay: 4 },
    text: () => `Now a home. The Cabin's card has a red row: it loses 2 for each industry next to it, so keep homes away from the mill. Put the Cabin on the outline and tap <b>Build</b>.` },
  { side: "top", hold: "pop", build: [[0, 5], [1, 5], [2, 5]], ghost: { rot: 0, flip: false, ax: 2, ay: 4 },
    text: () => `Buildings of one kind that touch make a <b>district</b>. Put the Log House on the outline, next to the Cabin. The shaded lot shows the district it joins.` },
  { side: "top", next: true, hold: "pop",
    text: () => `A district of 2: each home gets +1, so the Cabin went up too.` },
  { side: "top", build: [[2, 6], [2, 7], [3, 7]], ghost: { rot: 0, flip: false, ax: 3, ay: 4 },
    text: () => `Add the Homestead to the district.` },
  { side: "top", next: true, hold: "pop",
    text: () => `A district of 3: now each home gets +2. It grows up to +${DISTRICT_MAX}.` },
  { side: "top", build: [[0, 7], [1, 7], [0, 8], [1, 8]], ghost: { rot: 0, flip: false, ax: 3, ay: 8 },
    text: () => `The Farm is food, and homes like food next door. Put it on the outline, next to the homes.` },
  { side: "top", next: true, hold: "pop",
    text: (r) => `The homes gained +${gained(r)}. But see the red trophy, <b>Wasted land</b>: the Farm covers ore that a Mine will want later. Every spot is a trade-off.` },
  { side: "top", build: [[4, 7], [5, 7], [6, 7]], ghost: { rot: 0, flip: false, ax: 4, ay: 6 },
    text: () => `<b>Bridges</b> are the only buildings that can sit on water, and both ends must be on land. Put the bridge on the outline, across the river.` },
  { side: "top", next: true, hold: "pop",
    text: (r) => `+${r.pts}: for the water around it and the building it touches. Bridges join no district.` },
  { side: "top", wait: "deck",
    text: () => `Two buildings are left. Tap <b>To come</b> at the top right to see them.` },
  { side: "top", wait: "sheetclose",
    text: () => `Everything still to come, and the squares it needs. In a real game that is almost every open square, so watch this count and leave room for awkward shapes. Then close the list.` },
  { side: "top", wait: "select",
    text: () => `Tap any building you have built to see its score now.` },
  { side: "top", next: true, hold: 2200, leave: () => closeInfo(),
    text: () => `Each row is part of its score now. Grey rows are bonuses it could still get. <b>Points</b> at the top shows the whole town.` },
  { side: "top", build: "any",
    text: () => current() === "church"
      ? `Now the Church. Find a gap where the whole plus fits.`
      : `Your turn. The Mine wants ore. But the Church comes next, a plus shape with only two gaps left that fit it, both by the ore. Place the Mine without taking them.` },
];

const tutStep = () => G && G.tut && TUT.on && !G.over ? STEPS[TUT.i] : null;

/* Only what the step asks for can be built. Outside the tutorial, any open spot will do. */
function placeOK() {
  const cells = ghostCells();
  if (!canPlace(cells, current())) return false;
  if (!G.tut) return true;
  const step = tutStep();
  return !!step && !!step.build && (step.build === "any" || sameCells(cells, squares(step.build)));
}

function paintCoach() {
  const box = $("coach"), step = tutStep();
  if (!step || performance.now() < TUT.until) { box.hidden = true; TUT.html = ""; return; }
  const todo = step.todo ? step.todo(step) : [];
  const html = `<div class="kind">Tutorial · ${TUT.i + 1} of ${STEPS.length}</div><p>${step.text(TUT.last)}</p>` +
    (todo.length ? `<ul class="todo">${todo.map(([t, ok]) => `<li class="${ok ? "ok" : ""}">${t}</li>`).join("")}</ul>` : "") +
    (step.next ? `<div class="go"><button class="primary" id="coachNext">Next</button></div>` : "");
  box.className = "card " + step.side;
  if (box.hidden) { box.hidden = false; box.style.animation = "none"; void box.offsetWidth; box.style.animation = ""; }
  // Paint only on a change, so a tap on Next is never lost to a fresh button.
  if (html === TUT.html) return;
  box.innerHTML = html; TUT.html = html;
  if ($("coachNext")) $("coachNext").onclick = nextStep;
}

function enterStep() {
  const step = STEPS[TUT.i];
  TUT.turned = TUT.flipped = false;
  clearTimeout(TUT.timer);
  const wait = step.hold === "pop" ? popTime(TUT.last) + 300 : step.hold || 0;
  TUT.until = performance.now() + wait;
  if (wait) TUT.timer = setTimeout(paintCoach, wait);
  if (step.ghost && current()) UI.ghost = { ...step.ghost };
  paintPanel();
  if (UI.rules || UI.sel >= 0) paintInfo();
}
function nextStep() {
  const step = STEPS[TUT.i];
  if (step.leave) step.leave();
  TUT.i = Math.min(TUT.i + 1, STEPS.length - 1);
  enterStep();
}
/* What the player just did. A step moves on when it is the thing the step waits for. */
function tutEvent(name, res) {
  const step = tutStep();
  if (name === "build" && G && G.tut) TUT.last = res;
  if (!step) return;
  if (name === "build" && step.build === "any") return paintCoach();
  if (step.wait === name || (name === "build" && step.build)) nextStep();
}

/* The squares the step wants, marked with a gold outline that turns green when the building fits them. */
function drawTarget(g, now) {
  const step = tutStep();
  if (!step || !step.build || step.build === "any") return;
  const cells = squares(step.build), set = new Set(cells), S = UI.S, hit = sameCells(ghostCells(), cells);
  union(g, cells, S * .04, S * .2);
  g.fillStyle = hit ? "rgba(108,240,154,.18)" : `rgba(255,214,92,${.14 + .1 * Math.sin(now * 4)})`;
  g.fill();
  g.beginPath();
  for (const c of cells) {
    const x = cellX(c), y = cellY(c), col = colOf(c);
    if (!set.has(c - COLS)) { g.moveTo(x, y); g.lineTo(x + S, y); }
    if (!set.has(c + COLS)) { g.moveTo(x, y + S); g.lineTo(x + S, y + S); }
    if (col === 0 || !set.has(c - 1)) { g.moveTo(x, y); g.lineTo(x, y + S); }
    if (col === COLS - 1 || !set.has(c + 1)) { g.moveTo(x + S, y); g.lineTo(x + S, y + S); }
  }
  g.save();
  g.setLineDash([S * .16, S * .1]); g.lineDashOffset = -now * S * .5; g.lineCap = "round";
  g.lineWidth = Math.max(2, S * .07); g.strokeStyle = hit ? "#6cf09a" : "#ffd45c";
  g.stroke();
  g.restore();
}

/* The name of the unfinished town in the save, if there is one. */
function savedTown() {
  try {
    const s = JSON.parse(localStorage.getItem(SAVE));
    return s && (s.v === 6 || s.v === 7) && s.player && !s.over ? townName(s.player, s.pick) : null;
  } catch (e) { return null; }
}
/* Out of the tutorial: back to the town under way, or to the start. */
function leaveTutorial() {
  TUT.on = false;
  closeDialog();
  if (load() && !G.over) showGame(); else intro();
}
/* Into a real game, with the name from last time if there is one. */
function playFromTutorial(daily) {
  TUT.on = false;
  closeDialog();
  const name = lastName();
  if (name) startTown(name, null, daily, null); else intro();
}

function startTutorial() {
  TUT.on = false;
  closeSheet(); closeDialog();
  MAP = TUT_MAP.join("").split("").map(ch => TUT_LAND[ch]);
  OWNER = new Array(N).fill(-1);
  G = { v: 7, player: lastName() || "You", pick: 0, seed: (Math.random() * 2 ** 31) | 0, deck: TUT_DECK.slice(), at: 0,
        away: [], pieces: [], over: false, trophies: {}, streak: 0, challenge: null, day: null, goals: null, par: 0, tut: true };
  Object.assign(TUT, { i: 0, last: null, html: "" });
  resetScene();
  UI.shown = 0; $("score").textContent = 0;
  UI.ghost = { rot: 0, flip: false, ax: 2, ay: 2 };
  hud(); paintPanel();
  layout();
  const back = savedTown();
  showDialog(`<div style="text-align:center"><img class="crest" src="hugelland-icon.svg" alt="">
      <h2>Welcome to the tutorial</h2>
      <p>You will build a small town, one building at a time. These are the rules. The tutorial shows you each one.</p></div>
    ${RULES_HTML}
    <div class="row"><button class="tool" id="tutQuit">${back ? "Back to my town" : "Not now"}</button><button class="primary" id="tutGo">Start</button></div>`);
  $("tutQuit").onclick = leaveTutorial;
  $("tutGo").onclick = () => { closeDialog(); TUT.on = true; enterStep(); };
}

/* The end of the tutorial: the final score, how it adds up, and the way into a real game. */
function tutSummary() {
  hidePop();
  const won = Object.keys(TROPHIES).filter(id => G.trophies[id]), back = savedTown();
  showDialog(`<div class="final">
      <h2>Final scoring</h2>
      <div class="big num">${total()}</div>
      <div class="best">Your tutorial town</div>
    </div>
    <p>When the last building is down, the town is done and every building's score adds up. Fit them all for +${ALL_FIT}. Each building with no room costs −${AWAY}.</p>
    <p>${G.away.length
      ? `The ${esc(DEF[G.away[0]].name)} had no room, so it cost −${AWAY} and the +${ALL_FIT}. That is the jigsaw: every square you take is one a later building can't have.`
      : `You fit every building. On a real map that is the hard part, so keep an eye on To come.`}</p>
    <ul class="tally">
      <li><span>Buildings</span><b>${boardScore()}</b></li>
      ${G.away.length ? `<li><span>${G.away.length} turned away</span><b>−${G.away.length * AWAY}</b></li>`
                      : `<li><span>Every building fit</span><b>+${ALL_FIT}</b></li>`}
    </ul>
    ${won.length ? `<p class="label">Trophies</p><div class="tchips">${won.map(id =>
      `<span class="tchip${TROPHIES[id].good ? "" : " bad"}">${esc(TROPHIES[id].name.replace("!", ""))}${G.trophies[id] > 1 ? ` ×${G.trophies[id]}` : ""}</span>`).join("")}</div>` : ""}
    <p>Now try a real map. The <b>Daily</b> map is the same for everyone today, with three goals and a par to beat. A <b>Free</b> map is new each time.</p>
    <div class="modes">
      <button class="primary" id="tDaily">Daily<span class="sub">Today's challenge map</span></button>
      <button class="primary green" id="tFree">Free<span class="sub">A random map</span></button>
    </div>
    ${back ? `<p class="today">A new map takes the place of ${esc(back)}.</p><button class="linkbtn" id="tBack">Back to ${esc(back)}</button>` : ""}
    <button class="linkbtn" id="tLook">Look at the town</button>`);
  $("tDaily").onclick = () => playFromTutorial(dayKey());
  $("tFree").onclick = () => playFromTutorial(null);
  if ($("tBack")) $("tBack").onclick = leaveTutorial;
  $("tLook").onclick = closeDialog;
}

/* ───────────────────────── Saving and starting ───────────────────────── */

function save() { if (!G || !G.player || G.tut) return; try { localStorage.setItem(SAVE, JSON.stringify(G)); } catch (e) {} }
function load() {
  try {
    const s = JSON.parse(localStorage.getItem(SAVE));
    // A town saved before the daily map carries on as a free one.
    if (s && s.v === 6 && s.player) { s.v = 7; s.day = null; s.goals = null; s.par = 0; }
    if (s && s.v === 7 && s.player) { restore(s); return true; }
  } catch (e) {}
  return false;
}

function resetScene() {
  FX.walkers.length = 0; FX.puffs.length = 0; FX.dust.length = 0; FX.floats.length = 0; FX.confetti.length = 0;
  hidePop();
  UI.drop = null; UI.dirty = true; closeInfo();
}

/*
  The town gets its name when it is founded: Fort Zach, Zachville and so on. From the intro it keeps the map shown
  behind it. Pass null as the seed for a fresh random map.
*/
function startTown(player, challenge = null, daily = null, seed = G.seed) {
  newGame(player, Math.floor(Math.random() * (PREFIX.length + SUFFIX.length)), seed, daily);
  G.challenge = challenge && { from: challenge.from, score: challenge.score };
  resetScene();
  UI.shown = 0; $("score").textContent = 0;
  freshGhost(); save(); hud(); paintPanel();
  layout();
  if (daily) toast(`${townName(player, G.pick)} on today's map, with three goals.`, 3600);
  else toast(`Welcome to ${townName(player, G.pick)}!${challenge ? ` Beat ${challenge.score}.` : ""}`);
}

function showGame() {
  closeDialog();
  resetScene();
  UI.shown = total(); $("score").textContent = total();
  freshGhost(); hud(); paintPanel();
  layout();
}

/* A challenge link brings its map, its deck and a score to beat. */
function intro(challenge = null) {
  newGame("", 0, challenge && challenge.seed ? challenge.seed : undefined, challenge && challenge.day ? challenge.day : null);
  resetScene(); UI.ghost = null;
  $("panel").hidden = true;
  hud();
  const today = dayKey(), rec = dailyRecord(), doneToday = rec && rec.day === today;
  const sameDay = challenge && challenge.day === today;
  const lead = challenge
    ? `<div class="versus">${esc(challenge.from)} scored ${challenge.score} on ${challenge.day ? (sameDay ? "today's map" : esc(dayName(challenge.day)) + "'s map") : "this map"}<span>${challenge.day ? "The daily map, with its three goals and its par." : "Same land, same buildings, same order. Can you beat it?"}</span></div>
       ${challenge.v !== LINK_VERSION ? `<p>This link is from an older version of the game, so the map or the scoring may be different.</p>` : ""}`
    : `<p>Fit odd-shaped buildings onto the map. Good spots score more.</p>`;
  const choose = challenge ? `<div class="row"><button class="primary" id="found" type="submit">Take the challenge</button></div>`
    : `<div class="modes">
         <button class="primary" id="goDaily" type="submit">Daily<span class="sub">Play the daily challenge map</span></button>
         <button class="primary green" id="goFree" type="button">Free<span class="sub">Play a random map</span></button>
       </div>
       <div class="modes one"><button class="primary wheat" id="goTut" type="button">Tutorial<span class="sub">Learn how to play</span></button></div>
       ${doneToday ? `<p class="today">Today: ${rec.score} against par ${rec.par}, ${rec.goals} of 3 goals${rec.streak > 1 ? ` · ${rec.streak} days in a row` : ""}</p>` : ""}`;
  showDialog(`<form id="introForm" autocomplete="off" style="text-align:center">
      <img class="crest" src="hugelland-icon.svg" alt="">
      <h1>Hügelland</h1>
      ${lead}
      <input id="nameIn" maxlength="14" placeholder="Your name" enterkeyhint="go" autocapitalize="words" spellcheck="false" value="${esc(lastName())}">
      ${choose}
      ${challenge ? `<button type="button" class="linkbtn" id="decline">Play a different map</button>` : ""}
      <details class="how"><summary>How to play</summary>${RULES_HTML}</details>
    </form>`);
  const named = () => $("nameIn").value.trim();
  if ($("decline")) $("decline").onclick = () => intro();
  const begin = (daily) => {
    if (!named()) { $("nameIn").focus(); return; }
    const player = named();
    try { localStorage.setItem(NAME, player); } catch (e) {}
    $("nameIn").blur();
    closeDialog();
    startTown(player, challenge, daily);
  };
  if ($("goFree")) $("goFree").onclick = () => begin(null);
  if ($("goTut")) $("goTut").onclick = () => {
    if (named()) try { localStorage.setItem(NAME, named()); } catch (e) {}
    startTutorial();
  };
  $("introForm").onsubmit = (e) => { e.preventDefault(); begin(challenge ? challenge.day || null : dayKey()); };
  layout();
}

// Safari ignores the viewport's no-zoom setting, so stop pinch zoom here.
for (const type of ["gesturestart", "gesturechange"]) document.addEventListener(type, (e) => e.preventDefault(), { passive: false });
addEventListener("visibilitychange", () => { if (document.hidden) save(); });
addEventListener("pagehide", save);
new ResizeObserver(layout).observe($("stage"));

restoreControls();
const link = new URLSearchParams(location.search);
if (link.has("seed") || link.has("daily")) {
  const from = (link.get("from") || "").trim().slice(0, 14) || "A friend";
  const day = (link.get("daily") || "").slice(0, 10).match(/^\d{4}-\d{2}-\d{2}$/) ? link.get("daily") : null;
  const challenge = { seed: day ? 0 : parseInt(link.get("seed"), 10) | 0, day,
                      score: parseInt(link.get("score"), 10) || 0, from, v: parseInt(link.get("v"), 10) || 0 };
  // Drop the link from the address bar, so a reload resumes the game instead of starting the challenge again.
  history.replaceState(null, "", location.pathname);
  intro(challenge);
} else if (load() && !G.over) showGame(); else intro();
requestAnimationFrame(frame);
</script>
</body>
