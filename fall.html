<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0e1118">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Fall</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #0e1118; --panel: #171c27; --panel-2: #1e2431;
    --line: #29303f; --ink: #f2f4f8; --ink-2: #98a2b6; --muted: #6d7688;
    --accent: #ffb703; --accent-2: #4cc9f0; --good: #6ee7a8; --bad: #ff6b6b;
    --pad-t: env(safe-area-inset-top, 0px);
    --pad-b: env(safe-area-inset-bottom, 0px);
    --pad-l: env(safe-area-inset-left, 0px);
    --pad-r: env(safe-area-inset-right, 0px);
  }
  * { box-sizing: border-box; min-width: 0; -webkit-tap-highlight-color: transparent; }
  html, body {
    height: 100%; margin: 0; overflow: hidden; overscroll-behavior: none;
    background: var(--bg); color: var(--ink);
    font: 16px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased;
    -webkit-user-select: none; user-select: none;
  }
  button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; }

  #app { position: fixed; inset: 0; }
  .screen { position: absolute; inset: 0; display: none; flex-direction: column; }
  .screen.on { display: flex; }

  /* ── Scrolling panels (home, settings) ── */
  .sheet {
    flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch;
    padding: calc(var(--pad-t) + 28px) calc(var(--pad-r) + 18px)
             calc(var(--pad-b) + 40px) calc(var(--pad-l) + 18px);
  }
  .inner { max-width: 520px; margin: 0 auto; }

  .brand { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 4px; }
  h1 {
    margin: 0; font-size: clamp(2.4rem, 13vw, 3.4rem); font-weight: 800;
    letter-spacing: -0.045em; line-height: .95;
  }
  h1 span { color: var(--accent); }
  .lede { margin: 10px 0 26px; color: var(--ink-2); font-size: .92rem; max-width: 34ch; }

  .icon-btn {
    width: 42px; height: 42px; flex: 0 0 42px; border-radius: 12px;
    background: var(--panel); border: 1px solid var(--line);
    display: grid; place-items: center;
  }
  .icon-btn:active { background: var(--panel-2); }
  .icon-btn svg { width: 20px; height: 20px; fill: none; stroke: var(--ink-2); stroke-width: 1.8;
                  stroke-linecap: round; stroke-linejoin: round; }

  /* ── Game cards ── */
  .cards { display: grid; gap: 14px; }
  .card {
    display: grid; grid-template-columns: 66px 1fr; gap: 16px; align-items: center;
    width: 100%; text-align: left; padding: 16px;
    background: var(--panel); border: 1px solid var(--line); border-radius: 18px;
    transition: transform .12s ease, border-color .12s ease;
  }
  .card:active { transform: scale(.985); border-color: var(--accent); }
  .card.locked { opacity: .55; }
  .card.locked:active { transform: none; border-color: var(--line); }
  .card .art {
    width: 66px; height: 66px; border-radius: 14px; display: grid; place-items: center;
    overflow: hidden;
  }
  .card h2 { margin: 0 0 3px; font-size: 1.12rem; font-weight: 700; letter-spacing: -0.02em; }
  .card p { margin: 0; color: var(--ink-2); font-size: .84rem; line-height: 1.35; }
  .card .meta {
    margin-top: 7px; font-size: .74rem; font-weight: 600; letter-spacing: .06em;
    text-transform: uppercase; color: var(--muted); font-variant-numeric: tabular-nums;
  }
  .card .meta b { color: var(--accent); font-weight: 700; }
  .tag {
    display: inline-block; margin-left: 8px; padding: 2px 7px; border-radius: 999px;
    font-size: .6rem; font-weight: 700; letter-spacing: .1em; text-transform: uppercase;
    vertical-align: middle; background: rgba(255,183,3,.14); color: var(--accent);
  }
  .tag.soon { background: rgba(152,162,182,.14); color: var(--ink-2); }

  .foot { margin-top: 30px; padding-top: 16px; border-top: 1px solid var(--line);
          color: var(--muted); font-size: .78rem; }
  .foot a { color: var(--ink-2); }

  /* ── Settings ── */
  .bar {
    display: flex; align-items: center; gap: 12px; margin-bottom: 24px;
  }
  .bar h2 { margin: 0; font-size: 1.3rem; letter-spacing: -0.02em; }
  .group { margin-bottom: 26px; }
  .group > label { display: block; font-size: .74rem; font-weight: 700; letter-spacing: .1em;
                   text-transform: uppercase; color: var(--muted); margin-bottom: 10px; }
  .group .hint { margin: 10px 0 0; color: var(--muted); font-size: .8rem; line-height: 1.4; }
  .seg { display: grid; grid-auto-flow: column; gap: 6px; padding: 5px;
         background: var(--panel); border: 1px solid var(--line); border-radius: 14px; }
  .seg button {
    padding: 11px 8px; border-radius: 10px; font-size: .88rem; font-weight: 600;
    color: var(--ink-2); text-align: center;
  }
  .seg button[aria-pressed="true"] { background: var(--accent); color: #17130a; }
  .row {
    display: flex; align-items: center; justify-content: space-between; gap: 14px;
    padding: 14px 16px; background: var(--panel); border: 1px solid var(--line);
    border-radius: 14px; margin-bottom: 8px;
  }
  .row .t { font-size: .92rem; }
  .row .s { color: var(--muted); font-size: .78rem; margin-top: 2px; }
  .switch {
    width: 50px; height: 30px; flex: 0 0 50px; border-radius: 999px;
    background: var(--panel-2); border: 1px solid var(--line); position: relative;
    transition: background .16s ease;
  }
  .switch::after {
    content: ""; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px;
    border-radius: 50%; background: var(--muted); transition: transform .16s ease, background .16s ease;
  }
  .switch[aria-pressed="true"] { background: rgba(255,183,3,.25); border-color: var(--accent); }
  .switch[aria-pressed="true"]::after { transform: translateX(20px); background: var(--accent); }
  .btn {
    display: block; width: 100%; padding: 14px; border-radius: 14px; font-weight: 700;
    background: var(--panel); border: 1px solid var(--line); text-align: center;
  }
  .btn:active { background: var(--panel-2); }
  .btn.primary { background: var(--accent); color: #17130a; border-color: var(--accent); }
  .btn.ghost { background: none; color: var(--ink-2); }

  /* ── Game view ── */
  #play { background: #000; }
  #stage { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  .hud {
    position: absolute; top: 0; left: 0; right: 0;
    padding: calc(var(--pad-t) + 10px) calc(var(--pad-r) + 12px) 10px calc(var(--pad-l) + 12px);
    display: flex; align-items: flex-start; gap: 10px; pointer-events: none;
  }
  .hud .icon-btn { pointer-events: auto; background: rgba(14,17,24,.55); border-color: rgba(255,255,255,.14);
                   backdrop-filter: blur(6px); }
  .hud .readout { margin-left: auto; text-align: right; }
  .hud .big {
    font-size: 1.5rem; font-weight: 800; letter-spacing: -0.02em; font-variant-numeric: tabular-nums;
    text-shadow: 0 1px 6px rgba(0,0,0,.6);
  }
  .hud .sub {
    font-size: .72rem; font-weight: 600; letter-spacing: .08em; text-transform: uppercase;
    color: rgba(255,255,255,.7); text-shadow: 0 1px 5px rgba(0,0,0,.6);
    font-variant-numeric: tabular-nums;
  }

  /* ── On-screen pads ── */
  .pads { position: absolute; inset: auto 0 0 0; height: 40%; display: none; pointer-events: none; }
  .pads.on { display: flex; }
  .pad {
    flex: 1; margin: 0 calc(var(--pad-r) + 14px) calc(var(--pad-b) + 18px) calc(var(--pad-l) + 14px);
    max-width: 120px; height: 74px; align-self: flex-end;
    border-radius: 20px; background: rgba(255,255,255,.09); border: 1px solid rgba(255,255,255,.16);
    backdrop-filter: blur(4px); display: grid; place-items: center; pointer-events: auto;
  }
  .pad.right { margin-left: auto; }
  .pad.down { background: rgba(255,183,3,.3); }
  .pad svg { width: 28px; height: 28px; fill: rgba(255,255,255,.85); }

  /* ── Club bar ── */
  .clubs {
    position: absolute; left: 0; right: 0; bottom: 0; display: none;
    gap: 8px; padding: 10px calc(var(--pad-r) + 16px) calc(var(--pad-b) + 16px)
                       calc(var(--pad-l) + 16px);
    z-index: 4;
  }
  .clubs.on { display: flex; }
  .clubs button {
    flex: 1; padding: 13px 6px; border-radius: 14px;
    font-size: .84rem; font-weight: 700; letter-spacing: .01em;
    background: rgba(14,17,24,.5); border: 1px solid rgba(255,255,255,.18);
    color: rgba(255,255,255,.82); backdrop-filter: blur(6px);
  }
  .clubs button[aria-pressed="true"] {
    background: var(--accent); border-color: var(--accent); color: #17130a;
  }

  /* ── Overlays ── */
  .veil {
    position: absolute; inset: 0; display: none; align-items: flex-start; justify-content: center;
    padding: calc(var(--pad-t) + 16px) 22px calc(var(--pad-b) + 16px);
    background: rgba(9,11,16,.78); backdrop-filter: blur(7px); z-index: 5;
    overflow-y: auto; -webkit-overflow-scrolling: touch;
  }
  .veil.on { display: flex; }
  .veil .box {
    width: 100%; max-width: 340px; margin: auto 0;
    background: var(--panel); border: 1px solid var(--line);
    border-radius: 20px; padding: 24px 22px; text-align: center;
  }
  .veil h3 { margin: 0 0 6px; font-size: 1.35rem; letter-spacing: -0.02em; }
  .veil .why { margin: 0 0 18px; color: var(--ink-2); font-size: .88rem; }
  .veil .score { font-size: 3rem; font-weight: 800; letter-spacing: -0.03em; line-height: 1;
                 color: var(--accent); font-variant-numeric: tabular-nums; margin: 4px 0 2px; }
  .veil .best { color: var(--muted); font-size: .8rem; font-weight: 600; letter-spacing: .06em;
                text-transform: uppercase; margin: 0 0 20px; font-variant-numeric: tabular-nums; }
  .veil .btn + .btn { margin-top: 8px; }
  .catch-list { display: grid; gap: 6px; margin: 0 0 18px; padding: 0; list-style: none;
                text-align: left; font-size: .85rem; max-height: 34vh; overflow-y: auto; }
  .catch-list li { display: flex; justify-content: space-between; gap: 10px;
                   padding: 7px 10px; background: var(--panel-2); border-radius: 9px; }
  .catch-list .v { color: var(--accent); font-weight: 700; font-variant-numeric: tabular-nums; }
  .catch-list .miss { color: var(--muted); font-weight: 600; }

  /* ── Landscape and other short screens ── */
  @media (max-height: 540px) {
    .veil .box { padding: 16px 18px; border-radius: 16px; }
    .veil h3 { font-size: 1.1rem; }
    .veil .why { margin-bottom: 12px; font-size: .82rem; }
    .veil .score { font-size: 2.1rem; }
    .veil .best { margin-bottom: 12px; }
    .catch-list { max-height: 26vh; margin-bottom: 12px; }
    .btn { padding: 11px; }
    .pad { height: 58px; }
  }
</style>
</head>
<body>
<div id="app">

  <!-- ── Home ── -->
  <section class="screen on" id="home">
    <div class="sheet">
      <div class="inner">
        <div class="brand">
          <h1>Fall<span>.</span></h1>
          <button class="icon-btn" id="toSettings" aria-label="Settings">
            <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.2"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.5v.2a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.9.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.5-1H2.9a2 2 0 1 1 0-4H3a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.9.3H9a1.7 1.7 0 0 0 1-1.5V2.9a2 2 0 1 1 4 0V3a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.9-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.9V9a1.7 1.7 0 0 0 1.5 1h.2a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
          </button>
        </div>
        <div class="cards" id="cards"></div>

        <div class="foot"><a href="index.html">All projects</a></div>
      </div>
    </div>
  </section>

  <!-- ── Settings ── -->
  <section class="screen" id="settings">
    <div class="sheet">
      <div class="inner">
        <div class="bar">
          <button class="icon-btn" id="settingsBack" aria-label="Back">
            <svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>
          </button>
          <h2>Settings</h2>
        </div>

        <div class="group">
          <label>Steering</label>
          <div class="seg" id="ctrlSeg">
            <button data-v="drag" aria-pressed="false">Drag</button>
            <button data-v="buttons" aria-pressed="false">Buttons</button>
            <button data-v="tilt" aria-pressed="false">Tilt</button>
          </div>
          <p class="hint" id="ctrlHint"></p>
          <button class="btn" id="tiltPerm" style="margin-top:10px; display:none">Allow motion access</button>
        </div>

        <div class="group">
          <label>Tilt sensitivity</label>
          <div class="seg" id="tiltSeg">
            <button data-v="low" aria-pressed="false">Gentle</button>
            <button data-v="mid" aria-pressed="false">Normal</button>
            <button data-v="high" aria-pressed="false">Twitchy</button>
          </div>
          <button class="btn" id="tiltZero" style="margin-top:10px">Recentre tilt</button>
        </div>

        <div class="group">
          <label>Feel</label>
          <div class="row">
            <div class="t">Sound</div>
            <button class="switch" id="optSound" aria-pressed="false" aria-label="Sound"></button>
          </div>
          <div class="row">
            <div class="t">Vibration</div>
            <button class="switch" id="optHaptics" aria-pressed="false" aria-label="Vibration"></button>
          </div>
          <div class="row">
            <div class="t">Left-handed</div>
            <button class="switch" id="optLefty" aria-pressed="false" aria-label="Left-handed"></button>
          </div>
        </div>

        <div class="group">
          <label>Scores</label>
          <button class="btn ghost" id="wipe">Erase every best score</button>
        </div>
      </div>
    </div>
  </section>

  <!-- ── Play ── -->
  <section class="screen" id="play">
    <canvas id="stage"></canvas>
    <div class="hud">
      <button class="icon-btn" id="quit" aria-label="Back">
        <svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>
      </button>
      <div class="readout">
        <div class="big" id="hudBig">0</div>
        <div class="sub" id="hudSub"></div>
      </div>
    </div>
    <div class="pads" id="pads">
      <button class="pad left" data-dir="-1" aria-label="Left">
        <svg viewBox="0 0 24 24"><path d="M15 4l-8 8 8 8z"/></svg>
      </button>
      <button class="pad right" data-dir="1" aria-label="Right">
        <svg viewBox="0 0 24 24"><path d="M9 4l8 8-8 8z"/></svg>
      </button>
    </div>
    <div class="clubs" id="clubs">
      <button data-c="0" aria-pressed="true">Driver</button>
      <button data-c="1" aria-pressed="false">Wedge</button>
      <button data-c="2" aria-pressed="false">Putter</button>
    </div>
    <div class="veil" id="veil"><div class="box" id="veilBox"></div></div>
  </section>

</div>
<script>
"use strict";

// ── Small helpers ────────────────────────────────────────────────────────────
const $  = (id) => document.getElementById(id);
const clamp = (v, lo, hi) => v < lo ? lo : v > hi ? hi : v;
const rand  = (lo, hi) => lo + Math.random() * (hi - lo);
const pick  = (a) => a[(Math.random() * a.length) | 0];
const TAU = Math.PI * 2;

// ── Saved state ──────────────────────────────────────────────────────────────
const Store = {
  read(key, fallback) {
    try { const v = localStorage.getItem("fall_" + key); return v === null ? fallback : JSON.parse(v); }
    catch (e) { return fallback; }
  },
  write(key, value) {
    try { localStorage.setItem("fall_" + key, JSON.stringify(value)); } catch (e) {}
  },
  drop(key) { try { localStorage.removeItem("fall_" + key); } catch (e) {} },
};

const Settings = {
  controls: Store.read("controls", "drag"),   // drag | buttons | tilt
  tilt:     Store.read("tilt", "mid"),        // low | mid | high
  tiltZero: Store.read("tiltZero", 0),
  sound:    Store.read("sound", true),
  haptics:  Store.read("haptics", true),
  lefty:    Store.read("lefty", false),
  save(key, value) { this[key] = value; Store.write(key, value); },
};

const Best = {
  get(game, fallback) { return Store.read("best_" + game, fallback === undefined ? 0 : fallback); },
  set(game, value) {
    if (value > this.get(game)) { Store.write("best_" + game, value); return true; }
    return false;
  },
  // Golf is won by the smallest number.
  setLow(game, value) {
    const cur = this.get(game, 0);
    if (!cur || value < cur) { Store.write("best_" + game, value); return true; }
    return false;
  },
};

// ── Sound: a few synthesised blips, no files ─────────────────────────────────
const Sound = {
  ctx: null,
  wake() {
    if (!this.ctx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (AC) this.ctx = new AC();
    }
    if (this.ctx && this.ctx.state === "suspended") this.ctx.resume();
  },
  blip(freq, len, type, gain) {
    if (!Settings.sound || !this.ctx) return;
    const t = this.ctx.currentTime;
    const osc = this.ctx.createOscillator();
    const amp = this.ctx.createGain();
    osc.type = type || "sine";
    osc.frequency.setValueAtTime(freq, t);
    amp.gain.setValueAtTime(0, t);
    amp.gain.linearRampToValueAtTime(gain === undefined ? 0.16 : gain, t + 0.012);
    amp.gain.exponentialRampToValueAtTime(0.0001, t + len);
    osc.connect(amp).connect(this.ctx.destination);
    osc.start(t); osc.stop(t + len + 0.02);
  },
  slide(from, to, len, type) {
    if (!Settings.sound || !this.ctx) return;
    const t = this.ctx.currentTime;
    const osc = this.ctx.createOscillator();
    const amp = this.ctx.createGain();
    osc.type = type || "triangle";
    osc.frequency.setValueAtTime(from, t);
    osc.frequency.exponentialRampToValueAtTime(Math.max(30, to), t + len);
    amp.gain.setValueAtTime(0.14, t);
    amp.gain.exponentialRampToValueAtTime(0.0001, t + len);
    osc.connect(amp).connect(this.ctx.destination);
    osc.start(t); osc.stop(t + len + 0.02);
  },
  noise(len, gain) {
    if (!Settings.sound || !this.ctx) return;
    const rate = this.ctx.sampleRate, n = (rate * len) | 0;
    const buf = this.ctx.createBuffer(1, n, rate);
    const data = buf.getChannelData(0);
    for (let i = 0; i < n; i++) data[i] = (Math.random() * 2 - 1) * (1 - i / n);
    const src = this.ctx.createBufferSource(); src.buffer = buf;
    const amp = this.ctx.createGain(); amp.gain.value = gain === undefined ? 0.2 : gain;
    src.connect(amp).connect(this.ctx.destination);
    src.start();
  },
};

function buzz(ms) {
  if (Settings.haptics && navigator.vibrate) { try { navigator.vibrate(ms); } catch (e) {} }
}

// ── Input: one steering axis, however the player supplies it ─────────────────
// Games ask for `Input.dragDelta()` (pixels moved since the last frame) and
// `Input.axis` (-1..1). Drag mode fills the first, buttons and tilt the second.
const Input = {
  axis: 0,
  padAxis: 0,
  tiltAxis: 0,
  tiltSeen: false,
  pointerX: 0, pointerY: 0,
  down: false,
  _accum: 0,
  _lastX: 0,
  _tapAt: 0, _tapStartX: 0, _tapStartY: 0,
  onTap: null,          // set by the running game
  onPress: null,        // set by the running game

  get gain() { return { low: 34, mid: 22, high: 15 }[Settings.tilt] || 22; },

  reset() {
    this.axis = this.padAxis = this._accum = 0;
    this.down = false;
    this.onTap = this.onPress = null;
  },

  dragDelta() { const d = this._accum; this._accum = 0; return d; },

  bind(canvas) {
    const at = (e) => {
      const r = canvas.getBoundingClientRect();
      return { x: e.clientX - r.left, y: e.clientY - r.top };
    };
    canvas.addEventListener("pointerdown", (e) => {
      e.preventDefault();
      canvas.setPointerCapture(e.pointerId);
      const p = at(e);
      this.down = true; this._lastX = p.x; this._accum = 0;
      this.pointerX = p.x; this.pointerY = p.y;
      this._tapAt = performance.now(); this._tapStartX = p.x; this._tapStartY = p.y;
      if (this.onPress) this.onPress(p.x, p.y);
    });
    canvas.addEventListener("pointermove", (e) => {
      if (!this.down) return;
      const p = at(e);
      this._accum += p.x - this._lastX;
      this._lastX = p.x;
      this.pointerX = p.x; this.pointerY = p.y;
    });
    const up = (e) => {
      if (!this.down) return;
      const p = at(e);
      this.down = false; this._accum = 0;
      const moved = Math.hypot(p.x - this._tapStartX, p.y - this._tapStartY);
      const quick = performance.now() - this._tapAt < 400;
      if (moved < 18 && quick && this.onTap) this.onTap(p.x, p.y);
    };
    canvas.addEventListener("pointerup", up);
    canvas.addEventListener("pointercancel", up);
  },

  bindPads(root) {
    root.querySelectorAll(".pad").forEach((pad) => {
      const dir = Number(pad.dataset.dir);
      const on  = (e) => { e.preventDefault(); this.padAxis = dir; pad.classList.add("down"); };
      const off = (e) => { e.preventDefault(); if (this.padAxis === dir) this.padAxis = 0; pad.classList.remove("down"); };
      pad.addEventListener("pointerdown", on);
      pad.addEventListener("pointerup", off);
      pad.addEventListener("pointercancel", off);
      pad.addEventListener("pointerleave", off);
    });
  },

  bindKeys() {
    const set = (down) => (e) => {
      const k = e.key.toLowerCase();
      if (k === "arrowleft"  || k === "a") { this.padAxis = down ? -1 : (this.padAxis === -1 ? 0 : this.padAxis); e.preventDefault(); }
      if (k === "arrowright" || k === "d") { this.padAxis = down ?  1 : (this.padAxis ===  1 ? 0 : this.padAxis); e.preventDefault(); }
      if (down && (k === " " || k === "enter") && this.onTap) { this.onTap(-1, -1); e.preventDefault(); }
    };
    window.addEventListener("keydown", set(true));
    window.addEventListener("keyup", set(false));
  },

  bindTilt() {
    window.addEventListener("deviceorientation", (e) => {
      if (e.gamma === null || e.gamma === undefined) return;
      this.tiltSeen = true;
      let g = e.gamma;
      // Landscape holds put the left-right axis on beta instead.
      const a = (screen.orientation && screen.orientation.angle) || window.orientation || 0;
      if (a === 90)  g = -(e.beta || 0);
      if (a === -90 || a === 270) g = (e.beta || 0);
      this.tiltAxis = g;
    });
  },

  // Called once a frame by the engine.
  step() {
    if (Settings.controls === "tilt") {
      this.axis = clamp((this.tiltAxis - Settings.tiltZero) / this.gain, -1, 1);
      if (Math.abs(this.axis) < 0.06) this.axis = 0;   // deadzone
    } else {
      this.axis = this.padAxis;
    }
  },

  // The one call games make to steer something horizontally.
  steer(x, dt, speed, lo, hi) {
    if (Settings.controls === "drag") x += this.dragDelta() * 1.15;
    else x += this.axis * speed * dt;
    return clamp(x, lo, hi);
  },
};

// ── Engine: canvas sizing, the loop, and screen swapping ─────────────────────
const Engine = {
  canvas: null, ctx: null, w: 0, h: 0, dpr: 1,
  game: null, raf: 0, last: 0, paused: false,

  boot() {
    this.canvas = $("stage");
    this.ctx = this.canvas.getContext("2d");
    Input.bind(this.canvas);
    Input.bindPads($("pads"));
    Input.bindKeys();
    Input.bindTilt();
    window.addEventListener("resize", () => this.size());
    window.addEventListener("orientationchange", () => setTimeout(() => this.size(), 250));
    document.addEventListener("visibilitychange", () => { if (document.hidden) this.pause(); });
  },

  size() {
    const r = this.canvas.getBoundingClientRect();
    this.w = Math.max(1, Math.round(r.width));
    this.h = Math.max(1, Math.round(r.height));
    this.dpr = Math.min(window.devicePixelRatio || 1, 2);
    this.canvas.width  = Math.round(this.w * this.dpr);
    this.canvas.height = Math.round(this.h * this.dpr);
    this.ctx.setTransform(this.dpr, 0, 0, this.dpr, 0, 0);
    if (this.game && this.game.resize) this.game.resize(this.w, this.h);
  },

  run(game) {
    this.stop();
    Input.reset();
    Sound.wake();
    this.game = game;
    Router.show("play");
    const pads = $("pads");
    pads.classList.toggle("on", Settings.controls === "buttons" && game.usesPads !== false);
    pads.style.flexDirection = Settings.lefty ? "row-reverse" : "row";
    const clubs = $("clubs");
    clubs.classList.toggle("on", !!game.clubs);
    clubs.style.flexDirection = Settings.lefty ? "row-reverse" : "row";
    this.size();
    game.init(this.w, this.h);
    this.paused = false;
    this.last = performance.now();
    this.raf = requestAnimationFrame((t) => this.frame(t));
  },

  frame(now) {
    this.raf = requestAnimationFrame((t) => this.frame(t));
    const dt = Math.min((now - this.last) / 1000, 0.05);
    this.last = now;
    if (this.paused || !this.game) return;
    Input.step();
    this.game.update(dt);
    this.game.draw(this.ctx, this.w, this.h);
  },

  pause() {
    if (!this.game || this.paused) return;
    this.paused = true;
    if (this.game.onPause) this.game.onPause();
  },

  resume() { this.paused = false; this.last = performance.now(); },

  stop() {
    cancelAnimationFrame(this.raf);
    this.raf = 0;
    if (this.game && this.game.destroy) this.game.destroy();
    this.game = null;
    Veil.hide();
    $("pads").classList.remove("on");
    $("clubs").classList.remove("on");
  },
};

// ── Screens and overlay ──────────────────────────────────────────────────────
const Router = {
  show(id) {
    document.querySelectorAll(".screen").forEach((s) => s.classList.toggle("on", s.id === id));
    if (id !== "play") Engine.stop();
    if (id === "home") Home.paint();
  },
};

const Veil = {
  show(html) { $("veilBox").innerHTML = html; $("veil").classList.add("on"); },
  hide() { $("veil").classList.remove("on"); $("veilBox").innerHTML = ""; },
  get on() { return $("veil").classList.contains("on"); },
};

// ── HUD ──────────────────────────────────────────────────────────────────────
const Hud = {
  set(big, sub) { $("hudBig").textContent = big; $("hudSub").textContent = sub || ""; },
};

function overlay(html, actions) {
  Veil.show(html);
  Object.keys(actions || {}).forEach((key) => {
    const el = $("veilBox").querySelector('[data-act="' + key + '"]');
    if (el) el.addEventListener("click", actions[key]);
  });
}

// ── Dino Fall ────────────────────────────────────────────────────────────────
// The sky drops blocks. You are a small dinosaur with nowhere to hide.
// Four things fall that are not blocks. Score is time on your feet.
const DINO_ART = [
  [12, 0, 11, 8], [12, 8, 8, 9], [8, 9, 4, 7], [4, 8, 4, 5], [0, 6, 4, 4], [20, 10, 3, 2],
];
const DINO_LEGS = [[10, 16, 3, 8], [10, 23, 5, 3]];
const DINO_LEGS_B = [[15, 16, 3, 8], [15, 23, 5, 3]];

const SHAPES = [
  { k: "sq",   w: 0.58, h: 0.58 },
  { k: "tall", w: 0.34, h: 1.00 },
  { k: "wide", w: 1.00, h: 0.34 },
  { k: "dot",  w: 0.52, h: 0.52 },
];
// The only colour in the game, apart from the sky.
const PICKUPS = [
  { id: "shield", col: "#d76b5b", weight: 34, size: 0.56 },
  { id: "mini",   col: "#6fbf73", weight: 26, size: 0.60 },
  { id: "slow",   col: "#5aa9d6", weight: 24, size: 0.56 },
  { id: "bomb",   col: "#e8b33c", weight: 16, size: 0.52 },
];
const PICKUP_ODDS = 0.13;
const SLOW_SECONDS = 5.5, MINI_SECONDS = 8, MINI_SCALE = 0.55;

const DinoFall = {
  id: "dino",
  title: "Dino Fall",

  init(w, h) {
    this.resize(w, h);
    this.state = "ready";
    this.blocks = [];
    this.dust = [];
    this.elapsed = 0;
    this.shield = false;
    this.shieldFlash = 0;
    this.shake = 0;
    this.flash = 0;
    this.slowT = 0;
    this.miniT = 0;
    this.mini = 1;
    this.scroll = 0;
    this.x = w / 2;
    Hud.set("0.0", "seconds");
    this.intro();
  },

  resize(w, h) {
    this.w = w; this.h = h;
    this.unit = clamp(Math.min(w, h) * 0.115, 30, 78);   // dino height
    this.ground = h - Math.max(h * 0.06, 26) - this.unit;
    this.x = clamp(this.x || w / 2, 0, w - this.unit * 0.92);
  },

  intro() {
    overlay(
      '<h3>Dino Fall</h3>' +
      '<p class="why">The sky is falling.</p>' +
      '<button class="btn primary" data-act="play">Start</button>' +
      '<button class="btn ghost" data-act="home">Back</button>',
      { play: () => this.begin(), home: () => Router.show("home") }
    );
  },

  begin() {
    Veil.hide();
    Engine.resume();
    this.state = "run";
    this.blocks = [];
    this.dust = [];
    this.elapsed = 0;
    this.shield = false;
    this.slowT = 0;
    this.miniT = 0;
    this.mini = 1;
    this.flash = 0;
    this.shake = 0;
    this.nextSpawn = 0.7;
    this.x = this.w / 2 - this.unit * 0.46;
    Input.dragDelta();
  },

  onPause() {
    if (this.state !== "run") return;
    this.state = "held";
    overlay(
      '<h3>Paused</h3>' +
      '<button class="btn primary" data-act="go">Keep going</button>' +
      '<button class="btn ghost" data-act="home">Give up</button>',
      { go: () => { Veil.hide(); this.state = "run"; Input.dragDelta(); Engine.resume(); },
        home: () => Router.show("home") }
    );
  },

  spawn() {
    const u = this.unit;
    let kind = null, w, h;
    if (Math.random() < PICKUP_ODDS) {
      let total = 0;
      for (const p of PICKUPS) total += p.weight;
      let r = Math.random() * total;
      kind = PICKUPS[0];
      for (const p of PICKUPS) { r -= p.weight; if (r <= 0) { kind = p; break; } }
      w = h = kind.size * u;
    } else {
      const s = pick(SHAPES);
      w = s.w * u; h = s.h * u;
      this.blocks.push({
        k: s.k, pick: null, w, h,
        x: rand(0, Math.max(1, this.w - w)),
        y: -h - rand(0, u),
        rot: 0,
        jitter: rand(0.86, 1.18),
      });
      return;
    }
    this.blocks.push({
      k: kind.id, pick: kind, w, h,
      x: rand(0, Math.max(1, this.w - w)),
      y: -h - rand(0, u),
      spin: rand(-1.6, 1.6),
      rot: 0,
      jitter: rand(0.8, 1.0),
    });
  },

  update(dt) {
    // These keep running past the end of the run so a death still lands.
    this.shake = Math.max(0, this.shake - dt * 2.2);
    this.flash = Math.max(0, this.flash - dt * 3);
    if (this.state !== "run") return;

    const { w, h, unit } = this;
    this.elapsed += dt;
    this.scroll += dt * (140 + this.elapsed * 5);
    this.shieldFlash = Math.max(0, this.shieldFlash - dt * 2);

    // Timed pickups. Only the sky slows down — you still move at full speed.
    this.slowT = Math.max(0, this.slowT - dt);
    this.miniT = Math.max(0, this.miniT - dt);
    const wantMini = this.miniT > 0 ? MINI_SCALE : 1;
    this.mini += (wantMini - this.mini) * Math.min(1, dt * 9);
    const slow = this.slowT > 0 ? 0.42 : 1;

    Hud.set(this.elapsed.toFixed(1), "seconds");

    // Steering. A small dino is a nimble dino.
    const dw = unit * 0.92 * this.mini, dh = unit * this.mini;
    this.x = Input.steer(this.x, dt, w * (1.25 + (1 - this.mini) * 0.5), 0, w - dw);

    // Difficulty ramp: quicker falls, tighter gaps.
    const fall = Math.min(h * (0.30 + this.elapsed * 0.011), h * 0.95) * slow;
    const gap  = Math.max(0.13, 0.60 - this.elapsed * 0.016) / slow;

    this.nextSpawn -= dt;
    if (this.nextSpawn <= 0) {
      this.spawn();
      if (this.elapsed > 18 && Math.random() < 0.3) this.spawn();
      this.nextSpawn = gap * rand(0.75, 1.3);
    }

    // Dino hitbox, a little kinder than the drawing.
    const hx = this.x + dw * 0.18, hw = dw * 0.64;
    const hy = this.ground + unit - dh + dh * 0.14, hh = dh * 0.8;

    for (let i = this.blocks.length - 1; i >= 0; i--) {
      const b = this.blocks[i];
      b.y += fall * b.jitter * dt;
      b.rot += b.spin * dt;

      if (b.y + b.h >= this.ground + unit) {
        this.blocks.splice(i, 1);
        if (!b.pick) for (let k = 0; k < 5; k++) {
          this.dust.push({ x: b.x + rand(0, b.w), y: this.ground + unit,
                           r: rand(1.5, 3.5), life: 0.8, vx: rand(-60, 60) });
        }
        continue;
      }

      const hit = b.x < hx + hw && b.x + b.w > hx && b.y < hy + hh && b.y + b.h > hy;
      if (!hit) continue;

      this.blocks.splice(i, 1);
      if (b.pick) {
        this.take(b);
      } else if (this.shield) {
        this.shield = false;
        this.shake = 1;
        this.burst(b.x + b.w / 2, b.y + b.h / 2, "#d76b5b");
        Sound.noise(0.2, 0.18);
        Sound.slide(420, 120, 0.2, "square");
        buzz(34);
      } else {
        this.die();
        return;
      }
    }

    // Foot dust.
    if (Math.random() < 0.5) {
      this.dust.push({ x: this.x + unit * rand(0.15, 0.7), y: this.ground + unit,
                       r: rand(1.5, 3.5), life: 1, vx: rand(-26, -70) });
    }
    for (let i = this.dust.length - 1; i >= 0; i--) {
      const d = this.dust[i];
      d.life -= dt * 1.9; d.x += d.vx * dt; d.y -= dt * 8;
      if (d.life <= 0) this.dust.splice(i, 1);
    }
  },

  take(b) {
    const cx = b.x + b.w / 2, cy = b.y + b.h / 2;
    this.burst(cx, cy, b.pick.col);
    buzz(14);
    switch (b.pick.id) {
      case "shield":
        this.shield = true; this.shieldFlash = 1;
        Sound.blip(880, 0.14, "triangle", 0.13);
        Sound.blip(1320, 0.18, "triangle", 0.09);
        break;
      case "mini":
        this.miniT = MINI_SECONDS;
        Sound.slide(300, 900, 0.22, "triangle");
        break;
      case "slow":
        this.slowT = SLOW_SECONDS;
        Sound.slide(900, 260, 0.4, "sine");
        break;
      case "bomb":
        this.bomb(cx, cy);
        break;
    }
  },

  // Clears the sky. Pickups already falling survive it.
  bomb(cx, cy) {
    let cleared = 0;
    this.blocks = this.blocks.filter((b) => {
      if (b.pick) return true;
      cleared++;
      this.burst(b.x + b.w / 2, b.y + b.h / 2, "#e8b33c");
      return false;
    });
    this.flash = 1;
    this.shake = 1.3;
    for (let i = 0; i < 26; i++) {
      this.dust.push({ x: cx, y: cy, r: rand(2, 6), life: 1,
                       vx: rand(-260, 260), col: "#e8b33c" });
    }
    Sound.noise(0.4, 0.3);
    Sound.slide(220, 40, 0.5, "sawtooth");
    buzz([40, 30, 60]);
    return cleared;
  },

  burst(x, y, col) {
    for (let i = 0; i < 12; i++) {
      this.dust.push({ x, y, r: rand(2, 4.5), life: 1, vx: rand(-90, 90), col });
    }
  },

  die() {
    this.state = "over";
    this.shake = 1.6;
    this.burst(this.x + this.unit * 0.46, this.ground + this.unit * 0.5, "#15151b");
    const secs = Number(this.elapsed.toFixed(1));
    const fresh = Best.set(this.id, secs);
    Sound.slide(300, 60, 0.45, "sawtooth");
    buzz([30, 50, 60]);
    overlay(
      '<h3>' + (fresh ? "New best" : "Flattened") + '</h3>' +
      '<div class="score">' + secs.toFixed(1) + 's</div>' +
      '<p class="best">Best ' + Best.get(this.id).toFixed(1) + 's</p>' +
      '<button class="btn primary" data-act="again">Again</button>' +
      '<button class="btn ghost" data-act="home">Back</button>',
      { again: () => this.begin(), home: () => Router.show("home") }
    );
  },

  // ── Drawing ──
  draw(g, w, h) {
    const u = this.unit;
    g.save();
    if (this.shake > 0) {
      const k = this.shake * this.shake * 16;
      g.translate(rand(-1, 1) * k, rand(-1, 1) * k);
      g.rotate(rand(-1, 1) * this.shake * 0.012);
    }

    // Dusk sky.
    const sky = g.createLinearGradient(0, 0, 0, h);
    sky.addColorStop(0, "#5b4478");
    sky.addColorStop(0.45, "#8f5560");
    sky.addColorStop(0.78, "#d98a5f");
    sky.addColorStop(1, "#f0b57c");
    g.fillStyle = sky; g.fillRect(-10, -10, w + 20, h + 20);

    // Sun.
    g.fillStyle = "rgba(255,226,168,.75)";
    g.beginPath(); g.arc(w * 0.72, h * 0.52, u * 1.5, 0, TAU); g.fill();

    // Dunes, two layers.
    this.dunes(g, w, h, h * 0.66, "#8d5a54", this.scroll * 0.06);
    this.dunes(g, w, h, h * 0.76, "#6b3f45", this.scroll * 0.13);

    // Ground.
    const gy = this.ground + u;
    g.fillStyle = "#3a2430"; g.fillRect(0, gy, w, h - gy);
    g.fillStyle = "rgba(255,255,255,.09)";
    for (let i = -1; i < w / 60 + 2; i++) {
      const x = ((i * 60 - this.scroll * 0.5) % (w + 60) + w + 60) % (w + 60) - 60;
      g.fillRect(x, gy + 6 + (i % 2) * 9, 22, 2);
    }

    // Dust and sparks.
    for (const d of this.dust) {
      g.globalAlpha = Math.max(0, d.life) * 0.6;
      g.fillStyle = d.col || "#e8c8a8";
      g.beginPath(); g.arc(d.x, d.y, d.r, 0, TAU); g.fill();
    }
    g.globalAlpha = 1;

    // Falling blocks.
    for (const b of this.blocks) {
      if (b.pick) {
        g.save();
        g.translate(b.x + b.w / 2, b.y + b.h / 2); g.rotate(b.rot);
        this.drawPickup(g, b.pick, b.w);
        g.restore();
      } else {
        g.fillStyle = "rgba(0,0,0,.18)";
        g.fillRect(b.x + 2, b.y + 3, b.w, b.h);
        g.fillStyle = "#15151b";
        if (b.k === "dot") {
          g.beginPath(); g.arc(b.x + b.w / 2, b.y + b.h / 2, b.w / 2, 0, TAU); g.fill();
        } else {
          g.fillRect(b.x, b.y, b.w, b.h);
        }
      }
    }

    this.drawDino(g, this.x, this.ground + u, u * this.mini);

    // Slow-motion wash.
    if (this.slowT > 0) {
      g.globalAlpha = Math.min(1, this.slowT) * 0.13;
      g.fillStyle = "#5aa9d6"; g.fillRect(0, 0, w, h);
      g.globalAlpha = 1;
    }
    g.restore();

    // The bomb goes off outside the shake, so the whole frame whites out.
    if (this.flash > 0) {
      g.globalAlpha = this.flash * 0.75;
      g.fillStyle = "#fff5e0"; g.fillRect(0, 0, w, h);
      g.globalAlpha = 1;
    }
    this.drawTimers(g, w);
  },

  // Countdown bars for the two that run on a clock. The shield has no clock —
  // it sits there until something hits you — so it gets a diamond instead.
  drawTimers(g, w) {
    const bars = [];
    if (this.slowT > 0) bars.push({ t: this.slowT / SLOW_SECONDS, col: "#5aa9d6" });
    if (this.miniT > 0) bars.push({ t: this.miniT / MINI_SECONDS, col: "#6fbf73" });
    const bw = 52, gap = 8, pip = this.shield ? 20 : 0;
    const total = bars.length * bw + Math.max(0, bars.length - 1) * gap +
                  (pip && bars.length ? gap : 0) + pip;
    if (!total) return;

    let x = (w - total) / 2;
    for (const e of bars) {
      g.fillStyle = "rgba(0,0,0,.28)";
      g.fillRect(x, 74, bw, 5);
      g.fillStyle = e.col;
      g.fillRect(x, 74, bw * clamp(e.t, 0, 1), 5);
      x += bw + gap;
    }
    if (this.shield) {
      g.save();
      g.translate(x + pip / 2, 76.5);
      g.fillStyle = "#d76b5b";
      g.beginPath();
      g.moveTo(0, -8); g.lineTo(7, 0); g.lineTo(0, 8); g.lineTo(-7, 0);
      g.closePath(); g.fill();
      g.restore();
    }
  },

  drawPickup(g, kind, size) {
    const r = size / 2;
    g.fillStyle = kind.col;
    if (kind.id === "shield") {
      g.beginPath();
      g.moveTo(0, -r); g.lineTo(r, 0); g.lineTo(0, r); g.lineTo(-r, 0);
      g.closePath(); g.fill();
      g.fillStyle = "rgba(255,255,255,.5)";
      g.beginPath();
      g.moveTo(0, -r); g.lineTo(r / 2, -r / 3); g.lineTo(0, 0); g.lineTo(-r / 2, -r / 3);
      g.closePath(); g.fill();

    } else if (kind.id === "slow") {                      // hourglass
      g.beginPath();
      g.moveTo(-r * 0.7, -r); g.lineTo(r * 0.7, -r); g.lineTo(-r * 0.7, r);
      g.lineTo(r * 0.7, r); g.closePath(); g.fill();
      g.fillRect(-r * 0.85, -r - r * 0.22, r * 1.7, r * 0.22);
      g.fillRect(-r * 0.85, r, r * 1.7, r * 0.22);
      g.fillStyle = "rgba(255,255,255,.7)";
      g.beginPath(); g.arc(0, r * 0.55, r * 0.14, 0, TAU); g.fill();

    } else if (kind.id === "bomb") {                      // bomb and fuse
      g.beginPath(); g.arc(0, r * 0.18, r * 0.78, 0, TAU); g.fill();
      g.strokeStyle = kind.col; g.lineWidth = Math.max(2, r * 0.24);
      g.lineCap = "round";
      g.beginPath();
      g.moveTo(r * 0.3, -r * 0.5);
      g.quadraticCurveTo(r * 0.9, -r * 0.9, r * 0.6, -r * 1.25);
      g.stroke();
      g.fillStyle = "#fff5e0";
      g.beginPath(); g.arc(r * 0.6, -r * 1.3, r * 0.22, 0, TAU); g.fill();

    } else {                                              // a very small dinosaur
      const sc = size / 26;
      g.save();
      g.translate(-12 * sc, -13 * sc);
      for (const q of DINO_ART)   g.fillRect(q[0] * sc, q[1] * sc, q[2] * sc, q[3] * sc);
      for (const q of DINO_LEGS)  g.fillRect(q[0] * sc, q[1] * sc, q[2] * sc, q[3] * sc);
      for (const q of DINO_LEGS_B) g.fillRect(q[0] * sc, q[1] * sc, q[2] * sc, q[3] * sc);
      g.restore();
    }
  },

  dunes(g, w, h, base, col, off) {
    g.fillStyle = col;
    g.beginPath();
    g.moveTo(0, h);
    const span = w / 3;
    for (let i = -1; i <= 4; i++) {
      const x = i * span - (off % span);
      g.quadraticCurveTo(x + span * 0.5, base - span * 0.28, x + span, base);
    }
    g.lineTo(w, h); g.closePath(); g.fill();
  },

  // `base` is the ground line. The dino stands on it whatever size it is.
  drawDino(g, x, base, u) {
    const s = u / 26;                     // art is 24 x 26
    const step = this.state === "run" ? Math.sin(this.elapsed * 15) : 0;

    g.save();
    g.translate(x, base - u);

    // Shadow.
    g.fillStyle = "rgba(0,0,0,.22)";
    g.beginPath(); g.ellipse(u * 0.46, u + 3, u * 0.42, u * 0.09, 0, 0, TAU); g.fill();

    if (this.shield) {
      const pulse = 0.55 + Math.sin(this.elapsed * 6) * 0.2 + this.shieldFlash * 0.4;
      g.strokeStyle = "rgba(215,107,91," + clamp(pulse, 0, 1) + ")";
      g.lineWidth = Math.max(2, u * 0.07);
      g.beginPath(); g.arc(u * 0.46, u * 0.5, u * 0.72, 0, TAU); g.stroke();
    }

    g.fillStyle = "#15151a";
    for (const r of DINO_ART) g.fillRect(r[0] * s, r[1] * s, r[2] * s, r[3] * s);
    for (const r of DINO_LEGS)   g.fillRect(r[0] * s, (r[1] + step * 1.4) * s, r[2] * s, r[3] * s);
    for (const r of DINO_LEGS_B) g.fillRect(r[0] * s, (r[1] - step * 1.4) * s, r[2] * s, r[3] * s);
    g.fillStyle = "#fff";
    g.fillRect(14.5 * s, 2 * s, 2 * s, 2 * s);
    g.restore();
  },
};

// ── Fish Fall ────────────────────────────────────────────────────────────────
// Tap to drop the line. The first thing you touch on the way down ends the
// descent, so a deep cast means threading past everything. Nothing stops the
// line but the sea itself, which thickens as it darkens. On the way up you
// hook whatever you can reach. At the surface the catch goes airborne and you
// shoot it out of the sky.
// Everything in the water is drawn in ink. You tell them apart by their
// outline, the way you tell the blocks apart in Dino Fall.
const INK = "#080d14", INK_2 = "#141d29", LIT = "rgba(219,233,246,.72)";
const GLOW = "#ffd76b";

const FISH = [
  { id: "sardine", name: "Sardine",    kind: "fish",   len: 24, pts: 15,  ratio: 0.20, dorsal: "soft",   min: 0,    max: 900,  w: 30, spd: 46 },
  { id: "boot",    name: "Old boot",   kind: "boot",   len: 30, pts: 5,                                  min: 0,    max: 1200, w: 7,  spd: 6 },
  { id: "perch",   name: "Perch",      kind: "fish",   len: 33, pts: 30,  ratio: 0.29, dorsal: "spiky",  min: 220,  max: 1800, w: 24, spd: 40 },
  { id: "snapper", name: "Snapper",    kind: "fish",   len: 42, pts: 55,  ratio: 0.36, dorsal: "soft",   min: 700,  max: 3000, w: 18, spd: 38 },
  { id: "jelly",   name: "Jellyfish",  kind: "jelly",  len: 30, pts: 70,                                 min: 900,  max: 4200, w: 11, spd: 12 },
  { id: "tuna",    name: "Tuna",       kind: "fish",   len: 58, pts: 90,  ratio: 0.24, dorsal: "sickle", min: 1300, max: 5000, w: 14, spd: 66 },
  { id: "squid",   name: "Squid",      kind: "squid",  len: 46, pts: 130,                                min: 1900, max: 6500, w: 9,  spd: 30 },
  { id: "angler",  name: "Anglerfish", kind: "fish",   len: 50, pts: 220, ratio: 0.37, dorsal: "soft",   min: 2800, max: 9000, w: 7,  spd: 22, lure: true },
  { id: "gulper",  name: "Gulper eel", kind: "gulper", len: 66, pts: 320,                                min: 3800, max: 9000, w: 5,  spd: 20 },
];
const BY_ID = {};
FISH.forEach((f) => { BY_ID[f.id] = f; });

const WATER = [
  [0,    [47, 163, 216]], [600,  [28, 118, 171]], [1500, [16, 80, 124]],
  [2600, [12, 52, 86]],   [4000, [10, 38, 64]],   [6400, [8, 28, 48]],
  [9000, [7, 22, 40]],
];

const CASTS_PER_TRIP = 5;
const SEABED = 9000;                    // 900 m. Nobody is getting there.

const FishFall = {
  id: "fish",
  title: "Fish Fall",

  init(w, h) {
    this.resize(w, h);
    this.state = "ready";
    this.cast = 0;
    this.score = 0;
    this.fish = [];
    this.caught = [];
    this.flyers = [];
    this.bits = [];
    this.pops = [];
    this.snow = [];
    this.banner = null;
    this.hook = { x: w / 2, y: 0 };
    this.camY = -h * 0.32;
    this.shake = 0;
    this.t = 0;
    this.aim = null;
    Hud.set("0", "trip score");
    this.intro();
  },

  resize(w, h) { this.w = w; this.h = h; },

  intro() {
    overlay(
      '<h3>Fish Fall</h3>' +
      '<p class="why">Five casts.</p>' +
      '<button class="btn primary" data-act="play">Start</button>' +
      '<button class="btn ghost" data-act="home">Back</button>',
      { play: () => this.startTrip(), home: () => Router.show("home") }
    );
  },

  onPause() {
    if (this.state === "ready" || this.state === "done") return;
    this.held = this.state;
    this.state = "held";
    overlay(
      '<h3>Paused</h3>' +
      '<button class="btn primary" data-act="go">Back to it</button>' +
      '<button class="btn ghost" data-act="home">End the trip</button>',
      { go: () => { Veil.hide(); this.state = this.held; Input.dragDelta(); Engine.resume(); },
        home: () => Router.show("home") }
    );
  },

  startTrip() {
    Veil.hide();
    Engine.resume();
    this.cast = 0;
    this.score = 0;
    this.trip = [];
    this.nextCast();
  },

  nextCast() {
    this.cast++;
    if (this.cast > CASTS_PER_TRIP) return this.finish();

    this.hook.x = this.w / 2;
    this.hook.y = 0;
    this.caught = [];
    this.flyers = [];
    this.state = "aim";
    this.stock();
    Input.onTap = () => this.drop();
  },

  // Fill the column top to bottom. It gets thicker and the animals get bigger
  // the further down you go, so the sea closes in on you instead of the line
  // running out.
  stock() {
    this.fish = [];
    for (let d = 120; d < SEABED; d += clamp(150 - d * 0.02, 30, 150)) {
      if (Math.random() > 0.78) continue;
      const pool = FISH.filter((f) => d >= f.min && d <= f.max);
      if (!pool.length) continue;
      let total = 0;
      for (const f of pool) total += f.w;
      let r = Math.random() * total, sp = pool[0];
      for (const f of pool) { r -= f.w; if (r <= 0) { sp = f; break; } }
      this.fish.push({
        sp, x: rand(0, this.w), y: d + rand(-16, 16),
        dir: Math.random() < 0.5 ? -1 : 1,
        speed: sp.spd * rand(0.75, 1.3),
        bob: rand(0, TAU),
        scale: rand(0.85, 1.2) * (1 + (d / SEABED) * 0.5),
      });
    }
    this.snow = [];
    for (let i = 0; i < 150; i++) {
      this.snow.push({ x: rand(0, this.w), y: rand(0, SEABED), r: rand(0.6, 2.1), ph: rand(0, TAU) });
    }
  },

  drop() {
    if (this.state !== "aim") return;
    this.state = "down";
    Input.onTap = null;
    Input.dragDelta();
    Sound.blip(520, 0.1, "sine", 0.1);
    Sound.noise(0.12, 0.08);
  },

  // ── Update ──
  update(dt) {
    this.t += dt;
    this.shake = Math.max(0, this.shake - dt * 2.6);
    if (this.aim) {
      this.aim.life -= dt * 5;
      if (this.aim.life <= 0) this.aim = null;
    }
    const { w, h } = this;
    if (this.state === "ready" || this.state === "held" || this.state === "done") return;

    // Swim. Everything below slows down while the catch is in the air.
    const swim = (this.state === "shoot" || this.state === "tally") ? dt * 0.3 : dt;
    for (const f of this.fish) {
      f.x += f.dir * f.speed * swim;
      const pad = f.sp.len * f.scale;
      if (f.x < -pad) f.x = w + pad;
      if (f.x > w + pad) f.x = -pad;
    }

    if (this.state === "aim")   this.updateAim(dt);
    if (this.state === "down")  this.updateDown(dt);
    if (this.state === "up")    this.updateUp(dt);
    if (this.state === "shoot") this.updateShoot(dt);
    if (this.state === "tally") {
      this.banner.life -= dt;
      Hud.set(this.score, "trip score");
      if (this.banner.life <= 0) { this.banner = null; this.nextCast(); }
    }

    // Camera.
    const sky = this.state === "shoot" || this.state === "tally";
    const want = (this.state === "down" || this.state === "up")
      ? this.hook.y - h * 0.42 : (sky ? -h * 0.62 : -h * 0.32);
    const lo = sky ? -h * 0.66 : -h * 0.34;
    this.camY += (Math.max(want, lo) - this.camY) * Math.min(1, dt * 7);

    // Particles.
    for (let i = this.bits.length - 1; i >= 0; i--) {
      const b = this.bits[i];
      b.life -= dt * 1.7; b.x += b.vx * dt; b.y += b.vy * dt; b.vy += 340 * dt;
      if (b.life <= 0) this.bits.splice(i, 1);
    }
    for (let i = this.pops.length - 1; i >= 0; i--) {
      const p = this.pops[i];
      p.life -= dt * 0.85; p.y -= 42 * dt;
      if (p.life <= 0) this.pops.splice(i, 1);
    }
  },

  updateAim(dt) {
    this.hook.x = Input.steer(this.hook.x, dt, this.w * 1.1, 14, this.w - 14);
    this.hook.y = 0;
    Hud.set(this.score, "cast " + this.cast + " of " + CASTS_PER_TRIP);
  },

  updateDown(dt) {
    this.hook.x = Input.steer(this.hook.x, dt, this.w * 1.1, 14, this.w - 14);
    this.hook.y += (190 + this.hook.y * 0.06) * dt;
    Hud.set(Math.round(this.hook.y / 10) + " m", "going down");

    const grab = this.grab();
    if (grab >= 0) { this.hookFish(grab); this.reel(); return; }
    if (this.hook.y >= SEABED - 40) {                  // you hit the bottom
      this.hook.y = SEABED - 40;
      this.shake = 1;
      this.reel();
    }
  },

  reel() {
    this.state = "up";
    this.deepest = Math.round(this.hook.y / 10);
    Sound.slide(180, 320, 0.25, "triangle");
  },

  updateUp(dt) {
    this.hook.x = Input.steer(this.hook.x, dt, this.w * 1.1, 14, this.w - 14);
    this.hook.y -= (290 + this.hook.y * 0.03) * dt;
    Hud.set(this.caught.length + " on the line", "reeling in");

    if (this.caught.length < 26) {
      const grab = this.grab();
      if (grab >= 0) this.hookFish(grab);
    }
    if (this.hook.y <= 0) { this.hook.y = 0; this.launch(); }
  },

  grab() {
    const hx = this.hook.x, hy = this.hook.y;
    for (let i = 0; i < this.fish.length; i++) {
      const f = this.fish[i];
      const hw = f.sp.len * f.scale * 0.5, hh = f.sp.len * f.scale * 0.28;
      if (Math.abs(f.x - hx) < hw + 7 && Math.abs(f.y - hy) < hh + 9) return i;
    }
    return -1;
  },

  hookFish(i) {
    const f = this.fish.splice(i, 1)[0];
    this.caught.push(f);
    // The first one stops you dead, so it gets the jolt.
    this.shake = this.state === "down" ? 0.75 : 0.25;
    Sound.blip(660 + Math.min(this.caught.length, 10) * 40, 0.09, "square", 0.07);
    buzz(this.state === "down" ? 24 : 10);
  },

  // The catch is thrown clear of the water and falls back into it in slow
  // motion. How high a fish is IS the clock on it: the low ones splash first,
  // so those are the ones to shoot first.
  launch() {
    Sound.slide(300, 700, 0.3, "sine");
    const n = this.caught.length;
    if (!n) { this.tally(); return; }

    this.state = "shoot";
    this.grav = this.h * 0.17;                     // gentle, so it hangs
    const sky = this.h * 0.60;                     // room above the waterline
    const padX = 40;

    // Scattered, not stacked. Best-of-several sampling spreads them out, and
    // the apex height doubles as how long you have.
    const spots = [];
    for (let i = 0; i < n; i++) {
      let best = null, bestGap = -1;
      for (let k = 0; k < 16; k++) {
        const c = { x: rand(padX, this.w - padX), apex: rand(sky * 0.20, sky * 0.96) };
        let gap = 1e9;
        for (const q of spots) gap = Math.min(gap, Math.hypot(q.x - c.x, q.apex - c.apex));
        if (gap > bestGap) { bestGap = gap; best = c; }
      }
      spots.push(best);
    }

    // Flyers live in world coordinates, where y = 0 is the waterline. That way
    // the camera can still be panning up while they fly.
    this.flyers = this.caught.map((f, i) => ({
      f,
      x: this.hook.x + rand(-6, 6),
      y: -4,
      vx: (spots[i].x - this.hook.x) / Math.max(0.9, Math.sqrt(2 * spots[i].apex / this.grav)),
      vy: -Math.sqrt(2 * this.grav * spots[i].apex),
      rot: rand(-0.6, 0.6),
      spin: rand(-1.5, 1.5),
      dead: false, shot: false,
    }));
    this.aim = null;
    Input.onTap = (x, y) => this.shoot(x, y);
    this.shotT = 0;
  },

  updateShoot(dt) {
    this.shotT += dt;
    let left = 0;
    for (const p of this.flyers) {
      if (p.dead) continue;
      p.vy += this.grav * dt;
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.rot += p.spin * dt;

      // Bounce off the sides rather than sailing out of reach.
      if (p.x < 24 && p.vx < 0) { p.x = 24; p.vx *= -0.7; }
      if (p.x > this.w - 24 && p.vx > 0) { p.x = this.w - 24; p.vx *= -0.7; }

      if (p.y >= 0 && p.vy > 0) { this.splash(p); continue; }
      left++;
    }
    Hud.set(this.score, left ? left + " in the air" : "");
    if (!left) { Input.onTap = null; this.tally(); }
  },

  splash(p) {
    p.dead = true;
    const sy = -this.camY;
    for (let i = 0; i < 9; i++) {
      this.bits.push({
        x: p.x, y: sy, vx: rand(-70, 70), vy: rand(-150, -40),
        r: rand(1.4, 3.2), life: 0.9, col: "rgba(226,240,250,.85)",
      });
    }
    Sound.noise(0.14, 0.07);
  },

  shoot(x, y) {
    if (this.state !== "shoot") return;
    const cam = this.camY;
    let best = null, bestD = 1e9;
    for (const p of this.flyers) {
      if (p.dead) continue;
      const r = Math.max(30, p.f.sp.len * p.f.scale * 0.7);
      const d = Math.hypot(p.x - x, (p.y - cam) - y);
      if (d < r + 24 && d < bestD) { best = p; bestD = d; }
    }
    if (!best) {
      Sound.blip(160, 0.05, "square", 0.05);
      this.aim = { x, y, life: 1 };
      return;
    }
    best.dead = true;
    best.shot = true;
    this.score += best.f.sp.pts;
    this.trip.push(best.f.sp.id);
    const by = best.y - cam;
    this.aim = { x: best.x, y: by, life: 1 };
    this.pops.push({ x: best.x, y: by, txt: "+" + best.f.sp.pts, life: 1 });
    for (let i = 0; i < 14; i++) {
      this.bits.push({
        x: best.x, y: by, vx: rand(-160, 160), vy: rand(-190, 60),
        r: rand(1.6, 4), life: 1, col: pick(["#dbe9f6", "#ffd76b", "#9fb4c8"]),
      });
    }
    Sound.blip(1200, 0.05, "square", 0.09);
    Sound.noise(0.09, 0.12);
    buzz(12);
  },

  tally() {
    this.aim = null;
    const got = this.caught.length;
    const shot = this.flyers.filter((p) => p.shot).length;
    this.banner = {
      life: 1.7,
      a: got ? shot + " of " + got + " landed" : "Nothing on the line",
      b: (got ? "Trip score " + this.score : "The sea kept it all") +
         "  ·  " + this.deepest + " m down",
    };
    this.state = "tally";
  },

  finish() {
    this.state = "done";
    Input.onTap = null;
    const fresh = Best.set(this.id, this.score);
    const counts = {};
    for (const id of this.trip) counts[id] = (counts[id] || 0) + 1;
    const ids = Object.keys(counts).sort((a, b) => BY_ID[b].pts - BY_ID[a].pts);
    const rows = ids.length
      ? ids.map((id) => '<li><span>' + BY_ID[id].name + ' &times;' + counts[id] + '</span>' +
          '<span class="v">' + (BY_ID[id].pts * counts[id]) + '</span></li>').join("")
      : '<li><span class="miss">You came home empty.</span></li>';
    overlay(
      '<h3>' + (fresh ? "Best trip yet" : "Back at the dock") + '</h3>' +
      '<div class="score">' + this.score + '</div>' +
      '<p class="best">Best ' + Best.get(this.id) + '</p>' +
      '<ul class="catch-list">' + rows + '</ul>' +
      '<button class="btn primary" data-act="again">Head out again</button>' +
      '<button class="btn ghost" data-act="home">Back</button>',
      { again: () => this.startTrip(), home: () => Router.show("home") }
    );
  },

  // ── Drawing ──
  draw(g, w, h) {
    const cam = this.camY;
    const surf = -cam;                    // screen y of the waterline
    const t = this.t;

    g.save();
    if (this.shake > 0) {
      const k = this.shake * this.shake * 13;
      g.translate(rand(-1, 1) * k, rand(-1, 1) * k);
    }

    // Sky.
    if (surf > 0) {
      const sky = g.createLinearGradient(0, 0, 0, Math.max(1, surf));
      sky.addColorStop(0, "#8fd0e8");
      sky.addColorStop(1, "#e6f2f2");
      g.fillStyle = sky; g.fillRect(0, 0, w, surf + 1);
      g.fillStyle = "rgba(255,255,255,.42)";
      g.beginPath(); g.arc(w * 0.30, surf * 0.42, Math.max(13, Math.min(surf * 0.14, 44)), 0, TAU); g.fill();
    }

    // Water, coloured by how deep the camera is.
    const top = Math.max(0, cam), bot = cam + h;
    const water = g.createLinearGradient(0, Math.max(0, surf), 0, h);
    for (let i = 0; i <= 4; i++) water.addColorStop(i / 4, waterCol(top + (bot - top) * i / 4));
    g.fillStyle = water;
    g.fillRect(0, Math.max(0, surf), w, h - Math.max(0, surf));

    // Sunbeams near the surface.
    if (cam < 1100) {
      g.save();
      g.globalAlpha = clamp(1 - cam / 1100, 0, 1) * 0.16;
      g.fillStyle = "#dffaff";
      for (let i = 0; i < 5; i++) {
        const bx = w * (0.1 + i * 0.2) + Math.sin(t * 0.4 + i) * 18;
        g.beginPath();
        g.moveTo(bx - 14, surf); g.lineTo(bx + 14, surf);
        g.lineTo(bx + 74, surf + h * 1.2); g.lineTo(bx + 6, surf + h * 1.2);
        g.closePath(); g.fill();
      }
      g.restore();
    }

    // The deep gets its dark from the edges closing in, not from the water
    // going black — a black sea would swallow every silhouette in it.
    const gloom = clamp((cam - 400) / 4200, 0, 1) * 0.72;
    if (gloom > 0.01) {
      const vig = g.createRadialGradient(w / 2, h * 0.46, Math.min(w, h) * 0.14,
                                         w / 2, h * 0.46, Math.max(w, h) * 0.78);
      vig.addColorStop(0, "rgba(2,7,14,0)");
      vig.addColorStop(1, "rgba(2,7,14," + gloom.toFixed(3) + ")");
      g.fillStyle = vig;
      g.fillRect(0, Math.max(0, surf), w, h - Math.max(0, surf));
    }

    // Marine snow.
    g.fillStyle = "rgba(255,255,255,.22)";
    for (const s of this.snow) {
      const y = s.y - cam + Math.sin(t * 0.5 + s.ph) * 4;
      if (y < -6 || y > h + 6) continue;
      g.beginPath(); g.arc(s.x + Math.sin(t * 0.3 + s.ph) * 6, y, s.r, 0, TAU); g.fill();
    }

    // Depth marks.
    if (this.state === "down" || this.state === "up") {
      g.font = "600 10px system-ui, sans-serif";
      g.textAlign = "left"; g.textBaseline = "middle";
      for (let d = 500; d <= SEABED; d += 500) {
        const y = d - cam;
        if (y < 20 || y > h - 20) continue;
        g.fillStyle = "rgba(255,255,255,.16)";
        g.fillRect(0, y, w, 1);
        g.fillStyle = "rgba(255,255,255,.42)";
        g.fillText((d / 10) + " m", 8, y - 8);
      }
    }

    // The sea floor, if anyone ever gets that far.
    const fy = SEABED - cam;
    if (fy < h + 60) {
      g.fillStyle = "#05080c";
      g.beginPath();
      g.moveTo(0, h + 10);
      for (let i = 0; i <= 6; i++) {
        const bx = (i / 6) * w;
        g.lineTo(bx, fy + Math.sin(i * 1.7) * 14);
      }
      g.lineTo(w, h + 10); g.closePath(); g.fill();
    }

    // Fish still in the water.
    for (const f of this.fish) {
      const y = f.y - cam;
      if (y < -70 || y > h + 70) continue;
      g.save();
      g.translate(f.x, y + Math.sin(t * 1.6 + f.bob) * 2.5);
      drawCreature(g, f.sp, f.scale, f.dir, t + f.bob);
      g.restore();
    }

    // Line, hook and the catch riding along it.
    const boatX = w / 2, bob = Math.sin(t * 1.5) * 3;
    const rodX = boatX + 46, rodY = surf - 64 + bob;      // rod tip
    const gunX = boatX + 6,  gunY = surf - 42 + bob;      // shoulder
    if (this.state !== "shoot" && this.state !== "tally") {
      const hy = this.hook.y - cam;
      g.strokeStyle = "rgba(255,255,255,.62)"; g.lineWidth = 1.4;
      g.beginPath();
      g.moveTo(rodX, rodY);
      g.quadraticCurveTo((rodX + this.hook.x) / 2 + Math.sin(t * 2) * 4, (rodY + hy) / 2, this.hook.x, hy);
      g.stroke();

      for (let i = 0; i < this.caught.length; i++) {
        const f = this.caught[i];
        const cy = hy - 22 - i * 21;
        if (cy < -60) break;
        g.save();
        g.translate(this.hook.x + (i % 2 ? 13 : -13), cy);
        g.rotate((i % 2 ? 0.5 : -0.5) + Math.sin(t * 5 + i) * 0.12);
        drawCreature(g, f.sp, f.scale * 0.9, i % 2 ? 1 : -1, t + i);
        g.restore();
      }

      // The hook itself.
      g.save();
      g.translate(this.hook.x, hy);
      g.strokeStyle = "#e8eef5"; g.lineWidth = 2.4; g.lineCap = "round";
      g.beginPath(); g.moveTo(0, -8); g.lineTo(0, 2);
      g.arc(0, 2, 5, -Math.PI / 2, Math.PI * 0.85); g.stroke();
      g.restore();
    }

    // Boat and fisherman.
    this.drawBoat(g, boatX, surf + bob, w, h);

    // Airborne catch. It is in world coordinates like everything in the water.
    for (const p of this.flyers) {
      if (p.dead) continue;
      const py = p.y - cam;
      if (py < -80 || py > h + 60) continue;
      g.save();
      g.translate(p.x, py); g.rotate(p.rot);
      drawCreature(g, p.f.sp, p.f.scale * 1.15, p.vx < 0 ? -1 : 1, t + p.x * 0.03);
      g.restore();
    }

    // Muzzle flash and tracer.
    if (this.aim && this.aim.life > 0) {
      const a = clamp(this.aim.life, 0, 1);
      g.save();
      g.globalAlpha = a;
      g.strokeStyle = "#ffe08a"; g.lineWidth = 2;
      g.beginPath(); g.moveTo(gunX, gunY); g.lineTo(this.aim.x, this.aim.y); g.stroke();
      g.fillStyle = "#fff2c2";
      g.beginPath(); g.arc(gunX, gunY, 6 * a, 0, TAU); g.fill();
      g.restore();
    }

    // Bits and points.
    for (const b of this.bits) {
      g.globalAlpha = clamp(b.life, 0, 1);
      g.fillStyle = b.col;
      g.beginPath(); g.arc(b.x, b.y, b.r, 0, TAU); g.fill();
    }
    g.globalAlpha = 1;
    g.textAlign = "center"; g.textBaseline = "middle";
    for (const p of this.pops) {
      g.globalAlpha = clamp(p.life, 0, 1);
      g.fillStyle = "#ffd76b";
      g.font = "800 18px system-ui, sans-serif";
      g.fillText(p.txt, p.x, p.y);
    }
    g.globalAlpha = 1;

    // Prompts.
    g.textAlign = "center"; g.textBaseline = "middle";
    if (this.state === "aim") {                        // a ring where the line waits
      const pulse = (t * 0.8) % 1;
      g.strokeStyle = "rgba(255,255,255," + (0.5 * (1 - pulse)).toFixed(3) + ")";
      g.lineWidth = 2;
      g.beginPath();
      g.arc(this.hook.x, surf + 6, 10 + pulse * 26, 0, TAU);
      g.stroke();
    }
    if (this.banner) {
      const a = clamp(this.banner.life, 0, 1);
      g.globalAlpha = Math.min(1, a * 2);
      g.fillStyle = "#fff";
      g.font = "800 22px system-ui, sans-serif";
      shout(g, this.banner.a, w / 2, h * 0.44);
      g.font = "600 14px system-ui, sans-serif";
      shout(g, this.banner.b, w / 2, h * 0.44 + 26, "rgba(255,255,255,.8)");
      g.globalAlpha = 1;
    }
    g.restore();
  },

  drawBoat(g, x, y, w, h) {
    const t = this.t;
    g.save();
    g.translate(x, y);

    // Hull. Ink, like everything else that is not the sea or the sky.
    g.fillStyle = INK;
    g.beginPath();
    g.moveTo(-46, -10); g.lineTo(46, -10); g.lineTo(32, 12); g.lineTo(-32, 12);
    g.closePath(); g.fill();
    g.fillStyle = INK_2;
    g.fillRect(-46, -14, 92, 5);

    // He turns to face whatever he is aiming at.
    const shooting = this.state === "shoot";
    let dir = 1, ang = -0.5 + Math.sin(t * 1.5) * 0.05;
    if (shooting) {
      const tgt = this.aim || this.flyers.find((p) => !p.dead);
      if (tgt) {
        dir = tgt.x >= x ? 1 : -1;
        ang = Math.atan2(tgt.y - (y - 42), (tgt.x - x) * dir - 6);
      }
    }

    g.save();
    g.scale(dir, 1);

    // Legs, coat, head, hat.
    g.fillStyle = INK;
    g.fillRect(-10, -30, 6, 16); g.fillRect(-2, -30, 6, 16);
    g.fillRect(-12, -48, 20, 20);
    g.beginPath(); g.arc(-2, -55, 8, 0, TAU); g.fill();
    g.fillRect(-13, -60, 22, 4);
    g.beginPath(); g.arc(-2, -59, 8, Math.PI, TAU); g.fill();
    g.fillStyle = INK_2;                                 // collar, so the head reads
    g.fillRect(-12, -49, 20, 3);

    // Arm: a rod normally, a rifle once the catch is in the air.
    g.save();
    g.translate(6, -42);
    g.rotate(ang);
    g.fillStyle = INK_2; g.fillRect(0, -3, 14, 6);
    g.fillRect(12, -2.5, shooting ? 22 : 34, shooting ? 5 : 3);
    g.restore();
    g.restore();
    g.restore();
  },
};

// White text with a soft shadow, so a prompt reads over water or sky.
function shout(g, text, x, y, col) {
  g.fillStyle = "rgba(4,12,22,.45)";
  g.fillText(text, x + 1, y + 1.5);
  g.fillStyle = col || "#fff";
  g.fillText(text, x, y);
}

function waterCol(d) {
  d = clamp(d, 0, 9000);
  for (let i = 1; i < WATER.length; i++) {
    if (d > WATER[i][0]) continue;
    const a = WATER[i - 1], b = WATER[i];
    const k = (d - a[0]) / (b[0] - a[0]);
    const c = [0, 1, 2].map((j) => Math.round(a[1][j] + (b[1][j] - a[1][j]) * k));
    return "rgb(" + c[0] + "," + c[1] + "," + c[2] + ")";
  }
  return "rgb(1,5,11)";
}

// One creature, drawn from shapes. Origin is the middle of the animal.
// Solid silhouettes, no outlines: the water never goes darker than a deep blue,
// so a near-black animal reads at any depth. Size and shape are what tell a
// sardine from a gulper eel, not colour.
function drawCreature(g, sp, scale, dir, t) {
  const L = sp.len * scale;
  g.save();
  g.scale(dir < 0 ? -1 : 1, 1);
  g.lineJoin = "round";
  g.lineCap = "round";

  if (sp.kind === "fish") {
    const r = sp.ratio, wag = Math.sin(t * 6) * L * 0.07;

    // Tail.
    g.fillStyle = INK_2;
    if (sp.dorsal === "sickle") {                        // tuna: crescent
      g.beginPath();
      g.moveTo(-L * 0.28, 0);
      g.quadraticCurveTo(-L * 0.44, -L * 0.06 + wag, -L * 0.64, -L * 0.36 + wag);
      g.quadraticCurveTo(-L * 0.46, -L * 0.15 + wag, -L * 0.36, 0);
      g.quadraticCurveTo(-L * 0.46, L * 0.15 + wag, -L * 0.64, L * 0.36 + wag);
      g.quadraticCurveTo(-L * 0.44, L * 0.06 + wag, -L * 0.28, 0);
      g.closePath(); g.fill();
    } else {
      g.beginPath();
      g.moveTo(-L * 0.26, 0);
      g.quadraticCurveTo(-L * 0.42, -L * 0.05 + wag, -L * 0.55, -L * (r + 0.09) + wag);
      g.quadraticCurveTo(-L * 0.42, 0 + wag, -L * 0.55, L * (r + 0.09) + wag);
      g.quadraticCurveTo(-L * 0.42, L * 0.05 + wag, -L * 0.26, 0);
      g.closePath(); g.fill();
    }

    // Dorsal.
    g.beginPath();
    if (sp.dorsal === "spiky") {
      g.moveTo(-L * 0.16, -L * r * 0.9);
      for (let i = 0; i < 4; i++) {
        g.lineTo(-L * (0.12 - i * 0.07), -L * (r + 0.2));
        g.lineTo(-L * (0.08 - i * 0.07), -L * (r * 0.85));
      }
    } else if (sp.dorsal === "sickle") {
      g.moveTo(-L * 0.08, -L * r * 0.9);
      g.quadraticCurveTo(L * 0.02, -L * (r + 0.32), L * 0.16, -L * (r * 0.85));
    } else {
      g.moveTo(-L * 0.12, -L * r * 0.9);
      g.quadraticCurveTo(L * 0.02, -L * (r + 0.28), L * 0.22, -L * (r * 0.8));
    }
    g.closePath(); g.fill();

    // Pelvic fin.
    g.beginPath();
    g.moveTo(L * 0.0, L * r * 0.85);
    g.quadraticCurveTo(L * 0.04, L * (r + 0.22), L * 0.22, L * (r * 0.78));
    g.closePath(); g.fill();

    // Body: a proper tapered shape, not an ellipse.
    g.fillStyle = INK;
    g.beginPath();
    g.moveTo(L * 0.5, 0);
    g.bezierCurveTo(L * 0.28, -L * r * 1.08, L * 0.0, -L * r, -L * 0.27, -L * r * 0.34);
    g.lineTo(-L * 0.27, L * r * 0.34);
    g.bezierCurveTo(L * 0.0, L * r, L * 0.28, L * r * 1.08, L * 0.5, 0);
    g.closePath(); g.fill();

    // Belly, just enough to give the body a top and a bottom.
    g.fillStyle = "rgba(150,180,205,.14)";
    g.beginPath();
    g.moveTo(L * 0.42, L * r * 0.16);
    g.bezierCurveTo(L * 0.1, L * r * 0.95, -L * 0.05, L * r * 0.86, -L * 0.26, L * r * 0.3);
    g.lineTo(-L * 0.26, L * r * 0.05);
    g.closePath(); g.fill();

    if (sp.lure) {
      g.strokeStyle = INK_2; g.lineWidth = Math.max(1.4, L * 0.05);
      g.beginPath(); g.moveTo(L * 0.2, -L * r * 0.75);
      g.quadraticCurveTo(L * 0.5, -L * 0.66, L * 0.6, -L * 0.36); g.stroke();
      g.fillStyle = "rgba(255,215,107,.18)";
      g.beginPath(); g.arc(L * 0.6, -L * 0.36, L * 0.28, 0, TAU); g.fill();
      g.fillStyle = GLOW;
      g.beginPath(); g.arc(L * 0.6, -L * 0.36, L * 0.1, 0, TAU); g.fill();
      g.fillStyle = LIT;                                 // teeth
      for (let i = 0; i < 4; i++) {
        g.beginPath();
        g.moveTo(L * (0.18 + i * 0.07), L * 0.02);
        g.lineTo(L * (0.215 + i * 0.07), L * 0.15);
        g.lineTo(L * (0.25 + i * 0.07), L * 0.02);
        g.closePath(); g.fill();
      }
    }

    g.fillStyle = LIT;
    g.beginPath(); g.arc(L * 0.34, -L * r * 0.34, L * 0.045, 0, TAU); g.fill();

  } else if (sp.kind === "jelly") {
    g.strokeStyle = INK; g.lineWidth = Math.max(1.4, L * 0.055);
    for (let i = 0; i < 5; i++) {
      const ox = (i - 2) * L * 0.13;
      g.beginPath();
      g.moveTo(ox, L * 0.06);
      g.quadraticCurveTo(ox + Math.sin(t * 3 + i) * L * 0.16, L * 0.4,
                         ox + Math.sin(t * 3 + i) * L * 0.24, L * 0.72);
      g.stroke();
    }
    g.fillStyle = INK;
    g.beginPath();
    g.moveTo(-L * 0.42, L * 0.04);
    g.bezierCurveTo(-L * 0.42, -L * 0.46, L * 0.42, -L * 0.46, L * 0.42, L * 0.04);
    g.quadraticCurveTo(L * 0.2, L * 0.14, 0, L * 0.08);
    g.quadraticCurveTo(-L * 0.2, L * 0.14, -L * 0.42, L * 0.04);
    g.closePath(); g.fill();
    g.fillStyle = "rgba(150,180,205,.2)";
    g.beginPath(); g.ellipse(-L * 0.13, -L * 0.16, L * 0.12, L * 0.07, -0.4, 0, TAU); g.fill();

  } else if (sp.kind === "squid") {
    g.strokeStyle = INK; g.lineWidth = Math.max(1.4, L * 0.055);
    for (let i = 0; i < 5; i++) {
      g.beginPath();
      g.moveTo(L * 0.26, (i - 2) * L * 0.05);
      g.quadraticCurveTo(L * 0.5, (i - 2) * L * 0.1 + Math.sin(t * 4 + i) * L * 0.1,
                         L * 0.68, (i - 2) * L * 0.15 + Math.sin(t * 4 + i) * L * 0.16);
      g.stroke();
    }
    g.fillStyle = INK_2;                                 // mantle fins
    g.beginPath();
    g.moveTo(-L * 0.22, -L * 0.13);
    g.quadraticCurveTo(-L * 0.62, -L * 0.3, -L * 0.5, L * 0.12);
    g.closePath(); g.fill();
    g.fillStyle = INK;                                   // mantle
    g.beginPath();
    g.moveTo(L * 0.3, 0);
    g.bezierCurveTo(L * 0.14, -L * 0.22, -L * 0.24, -L * 0.2, -L * 0.42, 0);
    g.bezierCurveTo(-L * 0.24, L * 0.2, L * 0.14, L * 0.22, L * 0.3, 0);
    g.closePath(); g.fill();
    g.fillStyle = LIT;
    g.beginPath(); g.arc(L * 0.19, -L * 0.02, L * 0.06, 0, TAU); g.fill();

  } else if (sp.kind === "gulper") {
    g.fillStyle = INK;
    g.beginPath();
    g.moveTo(L * 0.46, -L * 0.3);
    g.quadraticCurveTo(L * 0.2, -L * 0.08, -L * 0.12, -L * 0.07);
    g.quadraticCurveTo(-L * 0.36, -L * 0.05, -L * 0.5, Math.sin(t * 4) * L * 0.12);
    g.quadraticCurveTo(-L * 0.3, L * 0.06, -L * 0.1, L * 0.08);
    g.quadraticCurveTo(L * 0.2, L * 0.12, L * 0.46, L * 0.28);
    g.closePath(); g.fill();
    // The mouth is the whole point of a gulper eel, so open it.
    g.fillStyle = "rgba(150,190,220,.22)";
    g.beginPath();
    g.moveTo(L * 0.44, -L * 0.24); g.lineTo(L * 0.44, L * 0.22); g.lineTo(L * 0.05, 0);
    g.closePath(); g.fill();
    g.fillStyle = LIT;
    for (let i = 0; i < 3; i++) {
      g.beginPath();
      g.moveTo(L * (0.44 - i * 0.1), -L * (0.24 - i * 0.06));
      g.lineTo(L * (0.40 - i * 0.1), -L * (0.13 - i * 0.04));
      g.lineTo(L * (0.36 - i * 0.1), -L * (0.19 - i * 0.05));
      g.closePath(); g.fill();
    }
    g.fillStyle = GLOW;                                  // tail light
    g.beginPath(); g.arc(-L * 0.49, Math.sin(t * 4) * L * 0.12, L * 0.05, 0, TAU); g.fill();
    g.fillStyle = LIT;
    g.beginPath(); g.arc(L * 0.3, -L * 0.11, L * 0.04, 0, TAU); g.fill();

  } else {                                               // boot
    g.fillStyle = INK;
    g.beginPath();
    g.moveTo(-L * 0.17, -L * 0.44);
    g.lineTo(L * 0.15, -L * 0.44);
    g.quadraticCurveTo(L * 0.17, -L * 0.05, L * 0.2, L * 0.05);
    g.lineTo(L * 0.48, L * 0.1);
    g.quadraticCurveTo(L * 0.54, L * 0.16, L * 0.48, L * 0.28);
    g.lineTo(-L * 0.2, L * 0.28);
    g.closePath(); g.fill();
    g.fillStyle = INK_2;
    g.fillRect(-L * 0.2, L * 0.21, L * 0.68, L * 0.07);
  }
  g.restore();
}

// ── Golf Fall ────────────────────────────────────────────────────────────────
// Five holes on a slab of course hanging in the air. Drag back off the ball to
// hit it. Drag anywhere else to turn the course; pinch to zoom.
//
// The world is a grid on the ground plane, plus a height. Everything is drawn
// through one axonometric projection you can spin, and sorted back to front.

const T = {                              // terrain, in draw order of hardness
  VOID:  0,
  WATER: 1,
  SAND:  2,
  ROUGH: 3,
  FAIR:  4,
  GREEN: 5,
  TEE:   6,
};

const GROUND = {
  //           top       side      bounce  keep  drag
  1: { top: "#2f6f9e", side: "#1e4a6c", e: 0.00, k: 0.00, f: 999 },   // water
  2: { top: "#dcc48b", side: "#b39d67", e: 0.06, k: 0.16, f: 26 },    // sand
  3: { top: "#4b7a41", side: "#33552d", e: 0.20, k: 0.46, f: 15 },    // rough
  4: { top: "#6da851", side: "#4a7d3c", e: 0.42, k: 0.78, f: 7 },    // fairway
  5: { top: "#8ccb6b", side: "#63954c", e: 0.30, k: 0.74, f: 4.2 },   // green
  6: { top: "#7ab85d", side: "#568043", e: 0.34, k: 0.72, f: 6 },     // tee
};

const CLUBS = [
  { id: "driver", name: "Driver", power: 27.5, angle: 0.40, bounce: 1.25, roll: 1.00, zoom: 0.72 },
  { id: "wedge",  name: "Wedge",  power: 18.0, angle: 0.95, bounce: 0.42, roll: 0.38, zoom: 1.05 },
  { id: "putter", name: "Putter", power: 10.5, angle: 0.00, bounce: 0.00, roll: 1.00, zoom: 1.60 },
];

const GRAV = 34;
const HOLES = 5;
const CUP_R = 0.42;
const TICK = 1 / 120;                    // the ball runs on a fixed step, so the
                                         // preview and the real shot agree exactly

const GolfFall = {
  id: "golf",
  title: "Golf Fall",
  clubs: true,
  usesPads: false,

  init(w, h) {
    this.resize(w, h);
    this.state = "ready";
    this.rot = Math.PI / 4;
    this.spin = 0;
    this.userZoom = 1;
    this.club = 0;
    this.hole = 0;
    this.strokes = 0;
    this.total = 0;
    this.card = [];
    this.ball = { x: 0, y: 0, z: 0, vx: 0, vy: 0, vz: 0, rest: true, gone: false };
    this.aim = null;
    this.trail = [];
    this.puff = [];
    this.msg = null;
    this.camX = 0; this.camY = 0;
    this.bindTouch();
    Hud.set("0", "");
    this.intro();
  },

  resize(w, h) { this.w = w; this.h = h; },

  destroy() { this.unbindTouch(); },

  intro() {
    overlay(
      '<h3>Golf Fall</h3>' +
      '<p class="why">Five holes. Fewest shots.</p>' +
      '<button class="btn primary" data-act="play">Start</button>' +
      '<button class="btn ghost" data-act="home">Back</button>',
      { play: () => this.startRound(), home: () => Router.show("home") }
    );
  },

  onPause() {
    if (this.state === "ready" || this.state === "done") return;
    this.held = this.state;
    this.state = "held";
    overlay(
      '<h3>Paused</h3>' +
      '<button class="btn primary" data-act="go">Play on</button>' +
      '<button class="btn ghost" data-act="home">Walk off</button>',
      { go: () => { Veil.hide(); this.state = this.held; Engine.resume(); },
        home: () => Router.show("home") }
    );
  },

  startRound() {
    Veil.hide();
    Engine.resume();
    this.hole = 0;
    this.total = 0;
    this.card = [];
    this.nextHole();
  },

  nextHole() {
    this.hole++;
    if (this.hole > HOLES) return this.finish();
    this.course = genHole(this.hole);
    this.strokes = 0;
    this.club = 0;
    this.userZoom = 1;
    this.faceThePin();
    this.setBall(this.course.tee.x, this.course.tee.y);
    this.camX = this.ball.x; this.camY = this.ball.y;
    this.state = "aim";
    this.msg = { txt: "Hole " + this.hole + " · par " + this.course.par, life: 2 };
    this.paintClubs();
  },

  // Start every hole looking down it, with the flag at the top of the screen.
  faceThePin() {
    const c = this.course;
    this.rot = Math.atan2(c.pin.x - c.tee.x, c.pin.y - c.tee.y) + Math.PI;
    this.spin = 0;
  },

  setBall(x, y) {
    const b = this.ball;
    b.x = x; b.y = y; b.z = 0;
    b.vx = b.vy = b.vz = 0;
    b.rest = true; b.gone = false;
    this.lie = { x, y };
    this.trail = [];
  },

  // ── Course lookups ──
  cell(x, y) {
    const c = this.course;
    const i = Math.floor(x), j = Math.floor(y);
    if (i < 0 || j < 0 || i >= c.w || j >= c.h) return T.VOID;
    return c.grid[j * c.w + i];
  },

  ground(x, y) { return GROUND[this.cell(x, y)] || null; },

  // ── Shooting ──
  hit(dirX, dirY, power) {
    const c = CLUBS[this.club];
    const speed = c.power * clamp(power, 0.06, 1);
    const b = this.ball;
    const len = Math.hypot(dirX, dirY) || 1;
    b.vx = (dirX / len) * speed * Math.cos(c.angle);
    b.vy = (dirY / len) * speed * Math.cos(c.angle);
    b.vz = speed * Math.sin(c.angle);
    b.rest = false;
    b.shotWith = c;
    b.bounces = 0;
    this.lie = { x: b.x, y: b.y };
    this.strokes++;
    this.trail = [];
    this.state = "fly";
    this.acc = 0;
    this.aim = null;
    Sound.blip(c.id === "putter" ? 420 : 260, 0.07, "square", 0.1);
    Sound.noise(0.05, 0.1);
    buzz(12);
  },

  // One step of ball physics. Shared by the live ball and the aim preview, so
  // the line you are shown is the line the ball actually takes.
  step(b, dt, preview) {
    if (b.rest) return;
    if (b.z > 0 || b.vz > 0) {                         // in the air
      b.vz -= GRAV * dt;
      b.x += b.vx * dt; b.y += b.vy * dt; b.z += b.vz * dt;
      if (b.z > 0) return;
      b.z = 0;
      const g = this.ground(b.x, b.y);
      if (!g) { b.gone = true; b.rest = true; return; }
      const club = b.shotWith || CLUBS[0];
      const e = g.e * club.bounce;
      b.bounces = (b.bounces || 0) + 1;
      if (e > 0.04 && -b.vz > 1.2) {
        b.vz = -b.vz * e;
        b.vx *= g.k * (0.55 + club.roll * 0.45);
        b.vy *= g.k * (0.55 + club.roll * 0.45);
        if (!preview) this.land(b.x, b.y, g);
      } else {
        b.vz = 0;
        b.vx *= g.k * club.roll;
        b.vy *= g.k * club.roll;
        if (!preview) this.land(b.x, b.y, g);
      }
      return;
    }

    // rolling
    const g = this.ground(b.x, b.y);
    if (!g) { b.gone = true; b.rest = true; return; }
    const sp = Math.hypot(b.vx, b.vy);
    if (sp < 0.12) { b.vx = b.vy = 0; b.rest = true; return; }
    const drop = Math.min(sp, g.f * dt);
    b.vx -= (b.vx / sp) * drop;
    b.vy -= (b.vy / sp) * drop;
    b.x += b.vx * dt; b.y += b.vy * dt;
  },

  land(x, y, g) {
    for (let i = 0; i < 5; i++) {
      this.puff.push({ x, y, z: 0, vx: rand(-1.5, 1.5), vy: rand(-1.5, 1.5),
                       vz: rand(1, 4), life: 1, col: g.top });
    }
    Sound.blip(180, 0.05, "sine", 0.05);
  },

  // ── Update ──
  update(dt) {
    if (this.state === "ready" || this.state === "held" || this.state === "done") return;
    this.rot += this.spin * dt;
    this.spin *= Math.pow(0.02, dt);
    if (Math.abs(this.spin) < 0.01) this.spin = 0;

    if (this.msg) { this.msg.life -= dt; if (this.msg.life <= 0) this.msg = null; }

    for (let i = this.puff.length - 1; i >= 0; i--) {
      const q = this.puff[i];
      q.life -= dt * 1.8;
      q.x += q.vx * dt; q.y += q.vy * dt; q.z += q.vz * dt; q.vz -= 14 * dt;
      if (q.life <= 0 || q.z < 0) this.puff.splice(i, 1);
    }

    const b = this.ball;

    if (this.state === "fly") {
      // Fixed steps. A variable step made the real shot drift off the line the
      // preview drew, and no frame rate can tunnel the ball past the cup.
      this.acc = Math.min((this.acc || 0) + dt, 0.25);
      while (this.acc >= TICK) {
        this.acc -= TICK;
        this.step(b, TICK, false);
