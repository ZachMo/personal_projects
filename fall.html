        if (b.z <= 0.35) {
          const c = this.course;
          if (Math.hypot(b.x - c.pin.x, b.y - c.pin.y) < CUP_R &&
              Math.hypot(b.vx, b.vy) < 4.2) { this.sink(); return; }
        }
        if (b.gone || b.rest) break;
      }
      if (this.trail.length > 90) this.trail.shift();
      this.trail.push({ x: b.x, y: b.y, z: b.z });

      if (b.gone) return this.penalty("off the edge");
      if (b.rest) {
        const g = this.ground(b.x, b.y);
        if (!g || this.cell(b.x, b.y) === T.WATER) return this.penalty("in the water");
        this.state = "aim";
        // Close to the pin, the putter is the obvious club.
        const d = Math.hypot(b.x - this.course.pin.x, b.y - this.course.pin.y);
        this.club = d < 6 ? 2 : d < 17 ? 1 : 0;
        this.paintClubs();
      }
    }

    if (this.state === "sunk") {
      this.sinkT -= dt;
      if (this.sinkT <= 0) {
        this.card.push(this.strokes);
        this.total += this.strokes;
        this.nextHole();
      }
      return;
    }

    // Camera follows the ball, and leads it while it is moving.
    const tx = b.x + (this.state === "fly" ? b.vx * 0.22 : 0);
    const ty = b.y + (this.state === "fly" ? b.vy * 0.22 : 0);
    this.camX += (tx - this.camX) * Math.min(1, dt * 3.4);
    this.camY += (ty - this.camY) * Math.min(1, dt * 3.4);

    Hud.set(this.strokes, "hole " + this.hole + " · par " + this.course.par +
                          (this.total ? " · " + this.total + " so far" : ""));
  },

  sink() {
    const b = this.ball;
    b.rest = true; b.vx = b.vy = b.vz = 0;
    b.x = this.course.pin.x; b.y = this.course.pin.y; b.z = -0.3;
    this.state = "sunk";
    this.sinkT = 1.5;
    const v = this.strokes - this.course.par;
    this.msg = { txt: v < -1 ? "Eagle" : v === -1 ? "Birdie" : v === 0 ? "Par" :
                      v === 1 ? "Bogey" : "+" + v, life: 1.5, big: true };
    Sound.blip(680, 0.1, "sine", 0.12);
    Sound.blip(1020, 0.22, "sine", 0.1);
    buzz([16, 40, 24]);
  },

  penalty(why) {
    this.strokes++;
    this.setBall(this.lie.x, this.lie.y);
    this.state = "aim";
    this.msg = { txt: why + " · +1", life: 1.8 };
    Sound.slide(280, 90, 0.3, "sawtooth");
    buzz(40);
    this.paintClubs();
  },

  finish() {
    this.state = "done";
    const par = this.card.length ? this.total : 0;
    const fresh = this.total > 0 && Best.setLow(this.id, this.total);
    const rows = this.card.map((v, i) =>
      '<li><span>Hole ' + (i + 1) + '</span><span class="v">' + v + '</span></li>').join("");
    const b = Best.get(this.id, 0);
    overlay(
      '<h3>' + (fresh ? "Best round yet" : "Round over") + '</h3>' +
      '<div class="score">' + this.total + '</div>' +
      '<p class="best">' + (b ? "Best " + b : "&nbsp;") + '</p>' +
      '<ul class="catch-list">' + rows + '</ul>' +
      '<button class="btn primary" data-act="again">Another round</button>' +
      '<button class="btn ghost" data-act="home">Back</button>',
      { again: () => this.startRound(), home: () => Router.show("home") }
    );
  },

  // ── Projection ──
  // Rotate on the ground plane, squash the vertical, lift by height.
  scale() { return Math.min(this.w, this.h) * 0.082 * CLUBS[this.club].zoom * this.userZoom; },

  proj(x, y, z) {
    const k = this.scale(), c = Math.cos(this.rot), s = Math.sin(this.rot);
    const dx = x - this.camX, dy = y - this.camY;
    const rx = dx * c - dy * s, ry = dx * s + dy * c;
    return { x: this.w / 2 + rx * k, y: this.h * 0.66 + ry * k * 0.52 - (z || 0) * k * 0.62, d: ry };
  },

  // Screen delta back to a direction on the ground.
  unproj(sdx, sdy) {
    const k = this.scale(), c = Math.cos(this.rot), s = Math.sin(this.rot);
    const rx = sdx / k, ry = sdy / (k * 0.52);
    return { x: rx * c + ry * s, y: -rx * s + ry * c };
  },

  // ── Touch: one finger on the ball aims, one finger elsewhere turns the
  // course, two fingers zoom. ──
  bindTouch() {
    const cv = Engine.canvas;
    this.pts = new Map();
    const at = (e) => {
      const r = cv.getBoundingClientRect();
      return { x: e.clientX - r.left, y: e.clientY - r.top };
    };

    this.onDown = (e) => {
      if (this.state !== "aim" && this.state !== "fly") return;
      const p = at(e);
      this.pts.set(e.pointerId, p);
      if (this.pts.size === 2) {
        const [a, b] = [...this.pts.values()];
        this.pinch = { d: Math.hypot(a.x - b.x, a.y - b.y), z: this.userZoom };
        this.aim = null;
        return;
      }
      if (this.state !== "aim") return;
      const bp = this.proj(this.ball.x, this.ball.y, this.ball.z);
      if (Math.hypot(p.x - bp.x, p.y - bp.y) < 54) {
        this.aim = { ox: p.x, oy: p.y, x: p.x, y: p.y, power: 0 };
        this.spin = 0;
      } else {
        this.turn = { x: p.x, last: p.x, t: performance.now() };
      }
    };

    this.onMove = (e) => {
      if (!this.pts.has(e.pointerId)) return;
      const p = at(e);
      this.pts.set(e.pointerId, p);

      if (this.pinch && this.pts.size >= 2) {
        const [a, b] = [...this.pts.values()];
        const d = Math.hypot(a.x - b.x, a.y - b.y);
        this.userZoom = clamp(this.pinch.z * (d / Math.max(1, this.pinch.d)), 0.45, 2.6);
        return;
      }
      if (this.aim) {
        this.aim.x = p.x; this.aim.y = p.y;
        const dx = p.x - this.aim.ox, dy = p.y - this.aim.oy;
        this.aim.power = clamp(Math.hypot(dx, dy) / (Math.min(this.w, this.h) * 0.34), 0, 1);
        return;
      }
      if (this.turn) {
        const dx = p.x - this.turn.last;
        this.rot -= dx * 0.006;
        this.spin = -dx * 0.09;
        this.turn.last = p.x;
      }
    };

    this.onUp = (e) => {
      const had = this.pts.get(e.pointerId);
      this.pts.delete(e.pointerId);
      if (this.pts.size < 2) this.pinch = null;
      if (this.turn && !this.pts.size) this.turn = null;
      if (!this.aim || !had) return;
      const a = this.aim;
      const dx = a.x - a.ox, dy = a.y - a.oy;
      this.aim = null;
      if (a.power < 0.06 || Math.hypot(dx, dy) < 14) return;   // a tap, not a swing
      const dir = this.unproj(-dx, -dy);                       // pull back to send it forward
      this.hit(dir.x, dir.y, a.power);
    };

    cv.addEventListener("pointerdown", this.onDown);
    cv.addEventListener("pointermove", this.onMove);
    cv.addEventListener("pointerup", this.onUp);
    cv.addEventListener("pointercancel", this.onUp);
  },

  unbindTouch() {
    const cv = Engine.canvas;
    if (!this.onDown) return;
    cv.removeEventListener("pointerdown", this.onDown);
    cv.removeEventListener("pointermove", this.onMove);
    cv.removeEventListener("pointerup", this.onUp);
    cv.removeEventListener("pointercancel", this.onUp);
    this.onDown = this.onMove = this.onUp = null;
  },

  paintClubs() {
    const bar = $("clubs");
    bar.querySelectorAll("button").forEach((b, i) => {
      b.setAttribute("aria-pressed", String(i === this.club));
    });
  },

  pickClub(i) {
    if (this.state !== "aim") return;
    this.club = i;
    this.aim = null;
    this.paintClubs();
    Sound.blip(520 + i * 90, 0.05, "sine", 0.07);
  },

  // ── Drawing ──
  draw(g, w, h) {
    const sky = g.createLinearGradient(0, 0, 0, h);
    sky.addColorStop(0, "#8fc3e8");
    sky.addColorStop(0.55, "#cfe6f2");
    sky.addColorStop(1, "#eef3ee");
    g.fillStyle = sky; g.fillRect(0, 0, w, h);
    if (!this.course) return;

    const c = this.course, k = this.scale();
    const THICK = 1.15;

    // Every solid thing gets a depth key and is drawn back to front.
    const items = [];
    for (let j = 0; j < c.h; j++) {
      for (let i = 0; i < c.w; i++) {
        const t = c.grid[j * c.w + i];
        if (t === T.VOID) continue;
        items.push({ d: this.proj(i + 0.5, j + 0.5, 0).d, kind: "cell", i, j, t });
      }
    }
    for (const tr of c.trees) items.push({ d: this.proj(tr.x, tr.y, 0).d, kind: "tree", tr });
    items.push({ d: this.proj(c.pin.x, c.pin.y, 0).d + 0.02, kind: "pin" });
    const b = this.ball;
    if (this.state !== "sunk") {
      items.push({ d: this.proj(b.x, b.y, 0).d + 0.03, kind: "ball" });
    }
    items.sort((a, z) => a.d - z.d);

    for (const it of items) {
      if (it.kind === "cell") this.drawCell(g, it.i, it.j, it.t, THICK);
      else if (it.kind === "tree") this.drawTree(g, it.tr);
      else if (it.kind === "pin") this.drawPin(g, c.pin);
      else this.drawBall(g, b);
    }

    // Aim preview sits on top of the course.
    if (this.state === "aim" && this.aim && this.aim.power > 0.06) this.drawAim(g);

    // Flight trail.
    if (this.trail.length > 1) {
      g.strokeStyle = "rgba(255,255,255,.55)"; g.lineWidth = 2;
      g.beginPath();
      this.trail.forEach((p, i) => {
        const s = this.proj(p.x, p.y, p.z);
        i ? g.lineTo(s.x, s.y) : g.moveTo(s.x, s.y);
      });
      g.stroke();
    }

    for (const q of this.puff) {
      const s = this.proj(q.x, q.y, q.z);
      g.globalAlpha = clamp(q.life, 0, 1) * 0.8;
      g.fillStyle = q.col;
      g.beginPath(); g.arc(s.x, s.y, Math.max(1.5, k * 0.09), 0, TAU); g.fill();
    }
    g.globalAlpha = 1;

    if (this.msg) {
      g.textAlign = "center"; g.textBaseline = "middle";
      g.globalAlpha = clamp(this.msg.life, 0, 1);
      g.font = (this.msg.big ? "800 34px" : "700 17px") + " system-ui, sans-serif";
      g.fillStyle = "rgba(10,26,18,.35)";
      g.fillText(this.msg.txt, w / 2 + 1, h * 0.14 + 1.5);
      g.fillStyle = "#fff";
      g.fillText(this.msg.txt, w / 2, h * 0.14);
      g.globalAlpha = 1;
    }
  },

  // A cell is a top face plus a side wall wherever it hangs over nothing.
  drawCell(g, i, j, t, thick) {
    const gr = GROUND[t];
    const lift = t === T.WATER ? -0.16 : t === T.SAND ? -0.06 : 0;
    const a = this.proj(i, j, lift), b2 = this.proj(i + 1, j, lift);
    const c2 = this.proj(i + 1, j + 1, lift), d2 = this.proj(i, j + 1, lift);
    const corners = [a, b2, c2, d2];

    // Walls first, so the top face lands on them.
    const nb = [[0, -1, a, b2], [1, 0, b2, c2], [0, 1, c2, d2], [-1, 0, d2, a]];
    g.fillStyle = gr.side;
    for (const [di, dj, p, q] of nb) {
      const n = this.cell(i + di + 0.5, j + dj + 0.5);
      if (n !== T.VOID) continue;
      const drop = thick + Math.max(0, -lift);
      g.beginPath();
      g.moveTo(p.x, p.y); g.lineTo(q.x, q.y);
      g.lineTo(q.x, q.y + drop * this.scale() * 0.62);
      g.lineTo(p.x, p.y + drop * this.scale() * 0.62);
      g.closePath(); g.fill();
    }

    g.fillStyle = gr.top;
    g.beginPath();
    corners.forEach((p, n) => n ? g.lineTo(p.x, p.y) : g.moveTo(p.x, p.y));
    g.closePath(); g.fill();

    if (t === T.WATER) {                                // a little movement on it
      g.fillStyle = "rgba(255,255,255,.16)";
      const m = this.proj(i + 0.5, j + 0.5, lift);
      g.beginPath();
      g.ellipse(m.x, m.y + Math.sin(Engine.last * 0.002 + i + j) * 1.5,
                this.scale() * 0.26, this.scale() * 0.09, 0, 0, TAU);
      g.fill();
    }
  },

  drawTree(g, tr) {
    const k = this.scale();
    const base = this.proj(tr.x, tr.y, 0);
    const top = this.proj(tr.x, tr.y, tr.tall);
    g.strokeStyle = "rgba(20,40,20,.18)";
    g.lineWidth = k * 0.5;
    g.lineCap = "round";
    g.beginPath();                                       // shadow on the grass
    g.moveTo(base.x, base.y); g.lineTo(base.x + k * 0.5, base.y + k * 0.2); g.stroke();
    g.strokeStyle = "#5c4327"; g.lineWidth = Math.max(2, k * 0.14);
    g.beginPath(); g.moveTo(base.x, base.y); g.lineTo(top.x, top.y); g.stroke();
    g.fillStyle = "#2f6b33";
    g.beginPath(); g.arc(top.x, top.y, k * tr.r, 0, TAU); g.fill();
    g.fillStyle = "rgba(255,255,255,.14)";
    g.beginPath(); g.arc(top.x - k * tr.r * 0.3, top.y - k * tr.r * 0.35, k * tr.r * 0.42, 0, TAU); g.fill();
  },

  drawPin(g, pin) {
    const k = this.scale();
    const base = this.proj(pin.x, pin.y, 0);
    const top = this.proj(pin.x, pin.y, 2.4);
    g.fillStyle = "#10231a";
    g.beginPath(); g.ellipse(base.x, base.y, k * CUP_R, k * CUP_R * 0.52, 0, 0, TAU); g.fill();
    g.strokeStyle = "#f3f3ef"; g.lineWidth = Math.max(1.6, k * 0.075);
    g.beginPath(); g.moveTo(base.x, base.y); g.lineTo(top.x, top.y); g.stroke();
    g.fillStyle = "#e8452f";
    const flap = Math.sin(Engine.last * 0.004) * k * 0.1;
    g.beginPath();
    g.moveTo(top.x, top.y);
    g.lineTo(top.x + k * 0.9, top.y + k * 0.25 + flap);
    g.lineTo(top.x, top.y + k * 0.55);
    g.closePath(); g.fill();
  },

  drawBall(g, b) {
    const k = this.scale();
    const sh = this.proj(b.x, b.y, 0);
    const air = clamp(1 - b.z / 6, 0.25, 1);
    g.fillStyle = "rgba(20,40,20," + (0.28 * air).toFixed(2) + ")";
    g.beginPath();
    g.ellipse(sh.x, sh.y, k * 0.24 * air, k * 0.12 * air, 0, 0, TAU); g.fill();
    const s = this.proj(b.x, b.y, b.z);
    g.fillStyle = "#fdfdf8";
    g.beginPath(); g.arc(s.x, s.y, Math.max(2.4, k * 0.2), 0, TAU); g.fill();
    g.fillStyle = "rgba(90,110,90,.35)";
    g.beginPath(); g.arc(s.x + k * 0.06, s.y + k * 0.05, Math.max(1, k * 0.09), 0, TAU); g.fill();
  },

  // The preview runs the real physics forward, so what you see is what happens.
  drawAim(g) {
    const a = this.aim, club = CLUBS[this.club];
    const dir = this.unproj(-(a.x - a.ox), -(a.y - a.oy));
    const len = Math.hypot(dir.x, dir.y) || 1;
    const speed = club.power * clamp(a.power, 0.06, 1);
    const sim = {
      x: this.ball.x, y: this.ball.y, z: 0,
      vx: (dir.x / len) * speed * Math.cos(club.angle),
      vy: (dir.y / len) * speed * Math.cos(club.angle),
      vz: speed * Math.sin(club.angle),
      rest: false, shotWith: club,
    };

    const pts = [];
    let land = null;
    for (let i = 0; i < 900 && !sim.rest && !sim.gone; i++) {
      this.step(sim, TICK, true);
      pts.push({ x: sim.x, y: sim.y, z: sim.z });
      if (!land && sim.z <= 0 && i > 2) land = { x: sim.x, y: sim.y };
      if (club.id === "putter" && i > 190) break;
      if (land && club.id !== "putter") break;            // stop at the first bounce
    }

    const k = this.scale();
    // The putter shows a line on the ground. The others show an arc.
    g.strokeStyle = "rgba(255,255,255,.9)";
    g.lineWidth = club.id === "putter" ? 3 : 2;
    g.setLineDash(club.id === "putter" ? [] : [5, 6]);
    g.beginPath();
    pts.forEach((p, i) => {
      const s = this.proj(p.x, p.y, p.z);
      i ? g.lineTo(s.x, s.y) : g.moveTo(s.x, s.y);
    });
    g.stroke();
    g.setLineDash([]);

    if (club.id !== "putter" && land) {
      const spread = 0.5 + a.power * 1.5;
      const m = this.proj(land.x, land.y, 0);
      g.strokeStyle = "rgba(255,255,255,.85)"; g.lineWidth = 2;
      g.beginPath();
      g.ellipse(m.x, m.y, k * spread, k * spread * 0.52, 0, 0, TAU); g.stroke();
      g.fillStyle = "rgba(255,255,255,.16)"; g.fill();
    }

    // The pull-back itself.
    const bp = this.proj(this.ball.x, this.ball.y, 0);
    g.strokeStyle = "rgba(255,255,255,.5)"; g.lineWidth = 2;
    g.setLineDash([3, 5]);
    g.beginPath(); g.moveTo(bp.x, bp.y);
    g.lineTo(bp.x + (a.x - a.ox), bp.y + (a.y - a.oy)); g.stroke();
    g.setLineDash([]);

    // Power ring on the ball.
    g.strokeStyle = a.power > 0.92 ? "#e8452f" : "#fff";
    g.lineWidth = 3;
    g.beginPath();
    g.arc(bp.x, bp.y, k * 0.55, -Math.PI / 2, -Math.PI / 2 + TAU * a.power);
    g.stroke();
  },
};

// ── Hole generation ──────────────────────────────────────────────────────────
// A wandering spine from tee to green, carved out of nothing. Everything the
// spine does not touch stays void, which is the edge you fall off.
function genHole(n) {
  const W = 15, H = 22 + n * 3 + ((Math.random() * 5) | 0);
  const grid = new Uint8Array(W * H);
  const put = (i, j, t) => {
    if (i < 0 || j < 0 || i >= W || j >= H) return;
    if (grid[j * W + i] < t) grid[j * W + i] = t;
  };
  const at = (i, j) => (i < 0 || j < 0 || i >= W || j >= H) ? T.VOID : grid[j * W + i];

  // Spine: one quadratic bend from tee to green. A random walk wandered so far
  // that the straight line from tee to pin left the map for whole stretches.
  const x0 = rand(4, W - 4);
  const x2 = clamp(x0 + rand(-4.5, 4.5), 3.4, W - 3.4);
  const x1 = clamp((x0 + x2) / 2 + rand(-4.2, 4.2), 3.4, W - 3.4);
  const spine = [];
  for (let j = 1; j < H - 1; j++) {
    const u = (j - 1) / (H - 3);
    const v = 1 - u;
    const sx = clamp(v * v * x0 + 2 * v * u * x1 + u * u * x2 + Math.sin(j * 0.9) * 0.12,
                     2.6, W - 2.6);
    spine.push({ x: sx, y: j + 0.5 });
  }

  // Fairway, wide at the ends and pinched in the middle.
  const disc = (cx, cy, r, t) => {
    for (let j = Math.floor(cy - r); j <= cy + r; j++) {
      for (let i = Math.floor(cx - r); i <= cx + r; i++) {
        if (Math.hypot(i + 0.5 - cx, j + 0.5 - cy) <= r) put(i, j, t);
      }
    }
  };
  spine.forEach((p, k) => {
    const u = k / (spine.length - 1);
    const wide = 2.35 + Math.sin(u * Math.PI) * -0.4 + (u < 0.12 || u > 0.88 ? 0.9 : 0);
    disc(p.x, p.y, wide, T.FAIR);
  });

  // Two rings of rough, so a shot that misses the short grass usually still
  // has somewhere to land.
  for (let ring = 0; ring < 2; ring++) {
    const edge = [];
    for (let j = 0; j < H; j++) {
      for (let i = 0; i < W; i++) {
        if (at(i, j) !== T.VOID) continue;
        let near = false;
        for (let d = -1; d <= 1 && !near; d++) {
          for (let e = -1; e <= 1; e++) {
            if (at(i + d, j + e) !== T.VOID) { near = true; break; }
          }
        }
        if (near && (ring === 0 || Math.random() < 0.6)) edge.push(j * W + i);
      }
    }
    for (const n of edge) grid[n] = T.ROUGH;
  }

  // Hazards. Sand hugs the fairway, water cuts across it.
  const bunkers = 1 + ((Math.random() * 3) | 0);
  for (let b = 0; b < bunkers; b++) {
    const p = spine[(spine.length * rand(0.2, 0.92)) | 0];
    const off = (Math.random() < 0.5 ? -1 : 1) * rand(1.6, 2.9);
    const cx = clamp(p.x + off, 1, W - 1), cy = p.y + rand(-1.5, 1.5);
    for (let j = Math.floor(cy - 2); j <= cy + 2; j++) {
      for (let i = Math.floor(cx - 2); i <= cx + 2; i++) {
        const d = Math.hypot(i + 0.5 - cx, j + 0.5 - cy);
        if (d <= rand(1.1, 1.9) && at(i, j) !== T.VOID) grid[j * W + i] = T.SAND;
      }
    }
  }
  if (n > 1 && Math.random() < 0.72) {
    const p = spine[(spine.length * rand(0.28, 0.72)) | 0];
    const cx = p.x + rand(-1.4, 1.4), cy = p.y, r = rand(2.0, 3.2);
    for (let j = Math.floor(cy - r); j <= cy + r; j++) {
      for (let i = Math.floor(cx - r); i <= cx + r; i++) {
        const d = Math.hypot((i + 0.5 - cx) * 0.75, j + 0.5 - cy);
        if (d <= r && at(i, j) !== T.VOID) grid[j * W + i] = T.WATER;
      }
    }
  }

  // Tee and green go on last so nothing overwrites them.
  const tee = spine[0], pin = spine[spine.length - 1];
  disc(tee.x, tee.y, 1.6, T.TEE);
  disc(pin.x, pin.y, 2.6, T.GREEN);
  for (let j = 0; j < H; j++) {
    for (let i = 0; i < W; i++) {
      const c = grid[j * W + i];
      if (c === T.GREEN || c === T.TEE) continue;
      if (Math.hypot(i + 0.5 - pin.x, j + 0.5 - pin.y) < 2.6) grid[j * W + i] = T.GREEN;
      else if (Math.hypot(i + 0.5 - tee.x, j + 0.5 - tee.y) < 1.6) grid[j * W + i] = T.TEE;
    }
  }

  // Trees, on the rough only, and never in the line of the tee shot.
  const trees = [];
  for (let j = 0; j < H; j++) {
    for (let i = 0; i < W; i++) {
      if (grid[j * W + i] !== T.ROUGH) continue;
      if (Math.hypot(i + 0.5 - tee.x, j + 0.5 - tee.y) < 4) continue;
      if (Math.random() < 0.17) {
        trees.push({ x: i + rand(0.25, 0.75), y: j + rand(0.25, 0.75),
                     r: rand(0.62, 0.95), tall: rand(1.5, 2.4) });
      }
    }
  }

  const dist = Math.hypot(pin.x - tee.x, pin.y - tee.y);
  const par = dist < 22 ? 3 : dist < 32 ? 4 : 5;
  return { w: W, h: H, grid, trees, tee: { x: tee.x, y: tee.y }, pin: { x: pin.x, y: pin.y }, par, dist };
}

// ── Home ─────────────────────────────────────────────────────────────────────

  dino: '<svg viewBox="0 0 40 40" width="66" height="66">' +
    '<rect width="40" height="40" rx="14" fill="#7a4a55"/>' +
    '<rect x="8" y="6" width="6" height="6" fill="#15151a"/>' +
    '<rect x="24" y="4" width="5" height="10" fill="#15151a"/>' +
    '<rect x="17" y="12" width="4" height="4" fill="#d76b5b" transform="rotate(45 19 14)"/>' +
    '<path d="M20 33h9v-6h-4v-4h-3v4h-4v3h2z" fill="#15151a"/>' +
    '<rect x="4" y="33" width="32" height="3" fill="#3a2430"/></svg>',
  fish: '<svg viewBox="0 0 40 40" width="66" height="66">' +
    '<rect width="40" height="40" rx="14" fill="#0d4a75"/>' +
    '<rect y="0" width="40" height="11" fill="#2fa3d8"/>' +
    '<path d="M17 4h8l-2 4h-6z" fill="#0d1219"/>' +
    '<path d="M21 8v13" stroke="#dbe9f6" stroke-width="1.1" fill="none"/>' +
    '<ellipse cx="17" cy="28" rx="7" ry="3.4" fill="#0d1219"/>' +
    '<path d="M10 28l-4-3.4v6.8z" fill="#1b2532"/>' +
    '<circle cx="21" cy="27" r="1.2" fill="#dbe9f6"/></svg>',
  golf: '<svg viewBox="0 0 40 40" width="66" height="66">' +
    '<rect width="40" height="40" rx="14" fill="#8fc3e8"/>' +
    '<path d="M20 15l14 7-14 7-14-7z" fill="#6da851"/>' +
    '<path d="M6 22v4l14 7v-4z" fill="#4a7d3c"/>' +
    '<path d="M34 22v4l-14 7v-4z" fill="#3d6b32"/>' +
    '<path d="M24 12v9" stroke="#f3f3ef" stroke-width="1.4" fill="none"/>' +
    '<path d="M24 12l5 1.6-5 1.8z" fill="#e8452f"/>' +
    '<circle cx="15" cy="23" r="2.1" fill="#fdfdf8"/></svg>',
};

const GAMES = [
  { g: DinoFall, art: "dino",
    fmt: (v) => v ? "Best " + Number(v).toFixed(1) + "s" : "Never played" },
  { g: FishFall, art: "fish",
    fmt: (v) => v ? "Best " + v + " points" : "Never played" },
  { g: GolfFall, art: "golf",
    fmt: (v) => v ? "Best " + v + " shots" : "Never played" },
];

const Home = {
  paint() {
    $("cards").innerHTML = GAMES.map((entry, i) => {
      const soon = entry.g.soon;
      return '<button class="card' + (soon ? " locked" : "") + '" data-i="' + i + '"' +
             (soon ? ' disabled' : '') + '>' +
        '<span class="art">' + ART[entry.art] + '</span>' +
        '<span><h2>' + entry.g.title +
          (soon ? '<span class="tag soon">Soon</span>' : '<span class="tag">Beta</span>') + '</h2>' +
          '<span class="meta">' + entry.fmt(Best.get(entry.g.id)) + '</span></span>' +
      '</button>';
    }).join("");

    $("cards").querySelectorAll(".card").forEach((el) => {
      el.addEventListener("click", () => {
        const entry = GAMES[Number(el.dataset.i)];
        if (entry.g.soon) return;
        Sound.wake();
        Engine.run(entry.g);
      });
    });
  },
};

// ── Settings wiring ──────────────────────────────────────────────────────────
function paintSeg(id, value) {
  $(id).querySelectorAll("button").forEach((b) => {
    b.setAttribute("aria-pressed", String(b.dataset.v === value));
  });
}
function paintSwitch(id, on) { $(id).setAttribute("aria-pressed", String(!!on)); }

function paintSettings() {
  paintSeg("ctrlSeg", Settings.controls);
  paintSeg("tiltSeg", Settings.tilt);
  paintSwitch("optSound", Settings.sound);
  paintSwitch("optHaptics", Settings.haptics);
  paintSwitch("optLefty", Settings.lefty);

  const needsPerm = typeof DeviceOrientationEvent !== "undefined" &&
                    typeof DeviceOrientationEvent.requestPermission === "function";
  $("tiltPerm").style.display = (Settings.controls === "tilt" && needsPerm && !Input.tiltSeen) ? "block" : "none";

  const noTilt = Settings.controls === "tilt" && !Input.tiltSeen;
  $("ctrlHint").textContent = noTilt
    ? "This device has not reported any tilt yet. Allow motion access, or steer another way."
    : "";
}

function wireSettings() {
  $("toSettings").addEventListener("click", () => { Router.show("settings"); paintSettings(); });
  $("settingsBack").addEventListener("click", () => Router.show("home"));

  $("ctrlSeg").addEventListener("click", (e) => {
    const b = e.target.closest("button[data-v]");
    if (!b) return;
    Settings.save("controls", b.dataset.v);
    paintSettings();
  });
  $("tiltSeg").addEventListener("click", (e) => {
    const b = e.target.closest("button[data-v]");
    if (!b) return;
    Settings.save("tilt", b.dataset.v);
    paintSettings();
  });

  $("tiltPerm").addEventListener("click", () => {
    if (typeof DeviceOrientationEvent !== "undefined" &&
        typeof DeviceOrientationEvent.requestPermission === "function") {
      DeviceOrientationEvent.requestPermission().then(() => {
        setTimeout(paintSettings, 400);
      }).catch(() => {});
    }
  });
  $("tiltZero").addEventListener("click", (e) => {
    Settings.save("tiltZero", Input.tiltAxis);
    e.target.textContent = "Centred";
    setTimeout(() => { e.target.textContent = "Recentre tilt"; }, 1200);
  });

  const toggle = (id, key) => $(id).addEventListener("click", () => {
    Settings.save(key, !Settings[key]);
    paintSwitch(id, Settings[key]);
    if (key === "sound" && Settings.sound) { Sound.wake(); Sound.blip(760, 0.09, "sine", 0.1); }
    if (key === "haptics" && Settings.haptics) buzz(18);
  });
  toggle("optSound", "sound");
  toggle("optHaptics", "haptics");
  toggle("optLefty", "lefty");

  $("wipe").addEventListener("click", (e) => {
    if (e.target.dataset.sure !== "1") {
      e.target.dataset.sure = "1";
      e.target.textContent = "Tap again to erase";
      setTimeout(() => { e.target.dataset.sure = ""; e.target.textContent = "Erase every best score"; }, 3500);
      return;
    }
    GAMES.forEach((entry) => Store.drop("best_" + entry.g.id));
    e.target.dataset.sure = "";
    e.target.textContent = "Gone";
    setTimeout(() => { e.target.textContent = "Erase every best score"; }, 1500);
  });

  $("quit").addEventListener("click", () => Router.show("home"));

  $("clubs").addEventListener("click", (e) => {
    const b = e.target.closest("button[data-c]");
    if (b && Engine.game && Engine.game.pickClub) Engine.game.pickClub(Number(b.dataset.c));
  });
}

// ── Go ───────────────────────────────────────────────────────────────────────
Engine.boot();
wireSettings();
Home.paint();
document.addEventListener("gesturestart", (e) => e.preventDefault());
document.addEventListener("dblclick", (e) => e.preventDefault());
</script>
