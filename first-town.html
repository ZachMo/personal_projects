  const cx = cells.reduce((s, c) => s + cellX(c), 0) / cells.length + S / 2, cy = cells.reduce((s, c) => s + cellY(c), 0) / cells.length;
  FX.floats.push({ x: cx, y: cy, t: -.25, text: signed(res.pts), good: res.pts > 0, big: res.pts >= GREAT });
  if (res.trophies.some(t => TROPHIES[t.id].good)) burst(cx, cy + S * .3, res.pts >= JACKPOT ? 90 : 45);
  UI.drop = { k: G.pieces.length - 1, t: 0 };
  UI.dirty = true;
  freshGhost();
  showPop(res, cells);
  bumpScore();
  for (const e of res.events) if (e.away) toast(`No room anywhere for the ${DEF[e.away].name}. You lose ${AWAY} points.`, 3400);
  save(); hud(); paintPanel();
  if (UI.sel >= 0) paintInfo();
  if (G.over) { recordBest(); setTimeout(showSummary, 2800); }
}

const CUP = `<svg viewBox="0 0 24 24" fill="#ffd45c"><path d="M7 3h10v2h3v3a4 4 0 0 1-4 4h-.4A5 5 0 0 1 13 14.9V17h3v3H8v-3h3v-2.1A5 5 0 0 1 8.4 12H8a4 4 0 0 1-4-4V5h3zM6 7v1a2 2 0 0 0 1 1.7V7zm11 0v2.7A2 2 0 0 0 18 8V7z"/></svg>`;
const DOWN = `<svg viewBox="0 0 24 24" fill="none" stroke="#ff9f8a" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7l6 6 4-4 8 8"/><path d="M15 17h6v-6"/></svg>`;

/* The score for the building just placed, part by part, with any trophies under it. */
let popTimer = 0;
function showPop(res, cells) {
  const good = res.trophies.filter(t => TROPHIES[t.id].good).slice(0, 2);
  const bad = res.trophies.filter(t => !TROPHIES[t.id].good).slice(0, 1);
  const tier = res.pts >= JACKPOT ? "gold" : res.pts >= GREAT ? "great" : res.pts <= 0 ? "low" : "";
  const rows = res.parts.filter(q => q.v).map(q =>
    `<li class="${q.r < 0 ? "base" : q.v < 0 ? "bad" : ""}"><span>${esc(partText(res.type, q))}</span><b>${signed(q.v)}</b></li>`).join("");
  const pop = $("pop");
  pop.innerHTML = `<div class="popcard ${tier}"><div class="popnum num" id="popNum">+0</div>
      <div class="popname">${esc(DEF[res.type].name)}</div><ul class="popparts">${rows}</ul></div>` +
    [...good, ...bad].map((t, n) => `<div class="trophy${TROPHIES[t.id].good ? "" : " bad"}" style="animation-delay:${.35 + n * .2}s">
      ${TROPHIES[t.id].good ? CUP : DOWN}<div><b>${TROPHIES[t.id].name}</b><span>${esc(t.text)}</span></div></div>`).join("");
  const row = cells.reduce((s, c) => s + rowOf(c), 0) / cells.length;
  pop.className = "pop " + (row >= ROWS / 2 ? "top" : "bottom");
  pop.hidden = false;
  const start = performance.now();
  const count = (now) => {
    const k = Math.min(1, (now - start) / 550), el = $("popNum");
    if (!el) return;
    el.textContent = signed(Math.round(res.pts * (1 - (1 - k) ** 3)));
    if (k < 1) requestAnimationFrame(count);
  };
  requestAnimationFrame(count);
  clearTimeout(popTimer);
  popTimer = setTimeout(() => {
    pop.classList.add("hide");
    popTimer = setTimeout(() => { pop.hidden = true; }, 350);
  }, 2200 + (good.length + bad.length) * 900);
}
function hidePop() { clearTimeout(popTimer); $("pop").hidden = true; }
function bumpScore() {
  const el = $("score").parentElement;
  el.classList.remove("bump"); void el.offsetWidth; el.classList.add("bump");
}

function doSwap() {
  if (!swap()) return;
  freshGhost(); save(); paintPanel();
  toast(`Swapped. ${G.swaps ? `${G.swaps} swap left.` : "No swaps left."}`);
}

/* ───────────────────────── Touch ───────────────────────── */

function boardPoint(e) {
  const r = cv.getBoundingClientRect();
  return [(e.clientX - r.left - UI.BX) / UI.S, (e.clientY - r.top - UI.BY) / UI.S];
}

let press = null;
cv.addEventListener("pointerdown", (e) => {
  if (!G) return;
  cv.setPointerCapture(e.pointerId);
  const [fx, fy] = boardPoint(e);
  const cells = ghostCells(), here = inside(Math.floor(fx), Math.floor(fy)) ? idx(Math.floor(fx), Math.floor(fy)) : -1;
  // The ghost floats a little above its squares, so a press just below it still counts as grabbing it.
  const lifted = inside(Math.floor(fx), Math.floor(fy + .25)) ? idx(Math.floor(fx), Math.floor(fy + .25)) : -1;
  const onGhost = !!cells && (cells.includes(here) || cells.includes(lifted));
  press = { x: e.clientX, y: e.clientY, fx, fy, here, onGhost, moved: false, touch: e.pointerType !== "mouse",
            gx: UI.ghost ? fx - UI.ghost.ax : 0, gy: UI.ghost ? fy - UI.ghost.ay : 0 };
});
cv.addEventListener("pointermove", (e) => {
  if (!press || !UI.ghost || G.over) return;
  if (!press.moved && Math.hypot(e.clientX - press.x, e.clientY - press.y) < 7) return;
  press.moved = true;
  const [fx, fy] = boardPoint(e), type = current();
  const [w, h] = extent(orient(DEF[type].shape, UI.ghost.rot, UI.ghost.flip));
  let ax, ay;
  if (press.onGhost) { ax = Math.round(fx - press.gx); ay = Math.round(fy - press.gy); }
  else { ax = Math.round(fx - w / 2); ay = Math.round(fy - (press.touch ? 1.3 : 0) - h / 2); }
  const before = UI.ghost.ax + "," + UI.ghost.ay;
  placeGhost({ ...UI.ghost, ax, ay });
  if (UI.ghost.ax + "," + UI.ghost.ay !== before) $("bBuild").disabled = !canPlace(ghostCells());
});
cv.addEventListener("pointerup", () => {
  if (!press) return;
  const p = press;
  press = null;
  if (p.moved) return;
  if (p.onGhost && !G.over) return turnGhost(1, false);
  if (p.here < 0) return closeInfo();
  if (p.here === UI.sel) return closeInfo();
  select(p.here);
});
cv.addEventListener("pointercancel", () => { press = null; });

addEventListener("keydown", (e) => {
  if (e.target.tagName === "INPUT" || !G) return;
  if (e.key === "Escape") { if (!$("sheetWrap").hidden) closeSheet(); else closeInfo(); return; }
  if (!$("sheetWrap").hidden || !$("dialogWrap").hidden || G.over || !UI.ghost) return;
  const moves = { ArrowLeft: [-1, 0], ArrowRight: [1, 0], ArrowUp: [0, -1], ArrowDown: [0, 1] };
  if (moves[e.key]) { e.preventDefault(); placeGhost({ ...UI.ghost, ax: UI.ghost.ax + moves[e.key][0], ay: UI.ghost.ay + moves[e.key][1] }); paintPanel(); }
  else if (e.key === "r" || e.key === "R") turnGhost(e.shiftKey ? -1 : 1, false);
  else if (e.key === "f" || e.key === "F") turnGhost(0, true);
  else if (e.key === "s" || e.key === "S") doSwap();
  else if (e.key === "Enter") doBuild();
});

/* ───────────────────────── Sheets and dialogs ───────────────────────── */

function openSheet(html) {
  $("sheet").innerHTML = html;
  $("sheetWrap").hidden = false;
}
function closeSheet() { $("sheetWrap").hidden = true; UI.confirm = false; }
$("scrim").onclick = closeSheet;

const RULES_HTML = `<ul class="rules">
  <li><b>Build:</b> drag a building onto open land, tap it to turn it, then press Build.</li>
  <li><b>Score:</b> base points, plus or minus points for what it touches. Touching means sharing a side.</li>
  <li><b>Scores are final</b> when you build. Later buildings don't change them.</li>
  <li><b>No room</b> for a building costs ${AWAY} points. Fit them all for +${ALL_FIT}.</li>
  <li><b>Swap</b> trades your building for the next one, ${SWAPS} times a game.</li>
</ul>`;

function showMenu() {
  const inGame = G && G.player;
  openSheet(`<h2>How to play</h2>${RULES_HTML}
    <div class="row">
      <button class="tool" id="mClose">Close</button>
      ${inGame ? `<button class="primary dark" id="mNew">${UI.confirm ? "Yes, start over" : "New town"}</button>` : ""}
    </div>
    ${inGame && UI.confirm ? `<p style="margin:10px 2px 0;font-size:.82rem;color:var(--bad)">This town will be lost.</p>` : ""}`);
  $("mClose").onclick = closeSheet;
  if ($("mNew")) $("mNew").onclick = () => {
    if (!G.over && G.pieces.length && !UI.confirm) { UI.confirm = true; return showMenu(); }
    closeSheet(); intro();
  };
}
$("menuBtn").onclick = () => { UI.confirm = false; showMenu(); };

function showDeck() {
  if (!G || !G.player) return;
  const left = G.over ? [] : G.deck.slice(G.at);
  const count = {};
  for (const k of left) count[k] = (count[k] || 0) + 1;
  const order = Object.keys(DEF).filter(k => count[k]);
  const cells = left.reduce((s, k) => s + SHAPES[DEF[k].shape].length, 0);
  let open = 0;
  for (let i = 0; i < N; i++) if (MAP[i] !== "water" && OWNER[i] < 0) open++;
  openSheet(`<h2>Still to come</h2>
    <p>${left.length ? `${left.length} buildings need ${cells} squares. You have ${open} open squares left.` : "Nothing left to place."}</p>
    <div class="deck">${order.map(k => `<div class="deckrow"><div class="mini">${shapeSVG(k, 0, false, 36)}</div>
      <div><div class="name">${esc(DEF[k].name)} <span class="count">×${count[k]}</span> ${chip(DEF[k].cat)}</div>${modsHTML(k)}</div></div>`).join("")}</div>
    <div class="row"><button class="tool" id="dClose">Close</button></div>`);
  $("dClose").onclick = closeSheet;
}
$("deckBtn").onclick = showDeck;

function showDialog(html) { $("dialog").innerHTML = html; $("dialogWrap").hidden = false; }
function closeDialog() { $("dialogWrap").hidden = true; }

function recordBest() {
  try { const best = +localStorage.getItem(BEST) || 0; if (total() > best) localStorage.setItem(BEST, total()); } catch (e) {}
}

function showSummary() {
  hidePop();
  const top = G.pieces.slice().sort((a, b) => b.pts - a.pts).slice(0, 3);
  const won = Object.keys(TROPHIES).filter(id => G.trophies[id]);
  let best = 0;
  try { best = +localStorage.getItem(BEST) || 0; } catch (e) {}
  showDialog(`<div class="final">
      <h2>${esc(townName(G.player, G.pick))} is done</h2>
      <div class="big num">${total()}</div>
      <div class="best">${total() >= best ? "Your best town yet" : `Your best is ${best}`}</div>
    </div>
    <ul class="tally">
      <li><span>Buildings</span><b>${boardScore()}</b></li>
      ${G.away.length ? `<li><span>${G.away.length} turned away</span><b>−${G.away.length * AWAY}</b></li>`
                      : `<li><span>Every building fit</span><b>+${ALL_FIT}</b></li>`}
    </ul>
    ${won.length ? `<p class="label">Trophies</p><div class="tchips">${won.map(id =>
      `<span class="tchip${TROPHIES[id].good ? "" : " bad"}">${esc(TROPHIES[id].name.replace("!", ""))}${G.trophies[id] > 1 ? ` ×${G.trophies[id]}` : ""}</span>`).join("")}</div>` : ""}
    <p class="label">Best buildings</p>
    <ul class="tally" style="margin-top:4px">${top.map(p => `<li><span>${esc(DEF[p.type].name)}</span><b>${signed(p.pts)}</b></li>`).join("")}</ul>
    <div class="row"><button class="tool" id="sLook">Look at the town</button><button class="primary" id="sNew">New town</button></div>`);
  $("sLook").onclick = closeDialog;
  $("sNew").onclick = () => { closeDialog(); intro(); };
}

/* ───────────────────────── Saving and starting ───────────────────────── */

function save() { if (!G || !G.player) return; try { localStorage.setItem(SAVE, JSON.stringify(G)); } catch (e) {} }
function load() {
  try { const s = JSON.parse(localStorage.getItem(SAVE)); if (s && s.v === 4 && s.player) { restore(s); return true; } } catch (e) {}
  return false;
}

function resetScene() {
  FX.walkers.length = 0; FX.puffs.length = 0; FX.dust.length = 0; FX.floats.length = 0; FX.confetti.length = 0;
  hidePop();
  UI.drop = null; UI.dirty = true; closeInfo();
}

/* The town gets its name when it is founded: Fort Zach, Zachville and so on. */
function startTown(player) {
  newGame(player, Math.floor(Math.random() * (PREFIX.length + SUFFIX.length)));
  resetScene();
  UI.shown = 0; $("score").textContent = 0;
  freshGhost(); save(); hud(); paintPanel();
  layout();
  toast(`Welcome to ${townName(player, G.pick)}! Drag the building onto the map.`, 3400);
}

function showGame() {
  closeDialog();
  resetScene();
  UI.shown = total(); $("score").textContent = total();
  freshGhost(); hud(); paintPanel();
  layout();
}

function intro() {
  try { localStorage.removeItem(SAVE); } catch (e) {}
  newGame("", 0);
  resetScene(); UI.ghost = null;
  $("panel").hidden = true;
  hud();
  showDialog(`<form id="introForm" autocomplete="off" style="text-align:center">
      <h1>First Town</h1>
      <p>Fit odd-shaped buildings onto the map. Good spots score more.</p>
      <input id="nameIn" maxlength="14" placeholder="Your name" enterkeyhint="go" autocapitalize="words" spellcheck="false">
      <div class="row"><button class="primary" id="found" type="submit" disabled>Start</button></div>
      <details class="how"><summary>How to play</summary>${RULES_HTML}</details>
    </form>`);
  $("nameIn").addEventListener("input", () => { $("found").disabled = !$("nameIn").value.trim(); });
  $("introForm").onsubmit = (e) => {
    e.preventDefault();
    const v = $("nameIn").value.trim();
    if (!v) return;
    $("nameIn").blur();
    closeDialog();
    startTown(v);
  };
  layout();
}

addEventListener("visibilitychange", () => { if (document.hidden) save(); });
addEventListener("pagehide", save);
new ResizeObserver(layout).observe($("stage"));

restoreControls();
if (load()) showGame(); else intro();
requestAnimationFrame(frame);
</script>
</body>
</html>
