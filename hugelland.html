<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1b2422">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Hügelland</title>
<meta name="apple-mobile-web-app-title" content="Hügelland">
<meta name="description" content="Fit odd-shaped buildings onto the map and grow a town in the hills.">
<link rel="icon" href="hugelland-icon.svg" type="image/svg+xml">
<link rel="icon" href="hugelland-icon-180.png" sizes="180x180" type="image/png">
<link rel="icon" href="hugelland-icon-512.png" sizes="512x512" type="image/png">
<link rel="apple-touch-icon" href="hugelland-icon-180.png">
<style>
  :root {
    color-scheme: dark;
    --table: #1b2422; --table-2: #27332f;
    --card: #fbf9f4; --card-2: #f0ece3; --line: #e6e1d6;
    --ink: #1f2624; --ink-2: #5b645f; --muted: #8c938e;
    --accent: #e0703f; --accent-2: #c05a2e;
    --good: #2f8a55; --good-bg: #e4f2e8; --bad: #b8412f; --bad-bg: #f9e5e0;
    --home: #d8734a; --agri: #c9952a; --industry: #6f7d8b; --shop: #33968a; --civic: #5a7fc4; --leisure: #a8588f;
    --pad-t: env(safe-area-inset-top, 0px);
    --pad-b: env(safe-area-inset-bottom, 0px);
    --pad-l: env(safe-area-inset-left, 0px);
    --pad-r: env(safe-area-inset-right, 0px);
  }
  * { box-sizing: border-box; min-width: 0; -webkit-tap-highlight-color: transparent; }
  html, body {
    height: 100%; margin: 0; overflow: hidden; overscroll-behavior: none;
    /* Taps are taps: no double-tap zoom when Turn is pressed quickly. */
    touch-action: manipulation; -webkit-text-size-adjust: 100%;
    background: var(--table); color: #eef1ec;
    font: 15px/1.4 system-ui, -apple-system, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased; -webkit-user-select: none; user-select: none;
  }
  button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; padding: 0; touch-action: manipulation; }
  [hidden] { display: none !important; }
  .num { font-variant-numeric: tabular-nums; }

  #app {
    position: fixed; inset: 0; display: grid; grid-template-rows: auto minmax(0, 1fr) auto;
    background: radial-gradient(90% 70% at 50% 42%, #2d3a36 0%, var(--table) 75%);
  }

  /* ── Top bar ── */
  #hud {
    display: flex; align-items: center; gap: 8px;
    padding: calc(var(--pad-t) + 10px) calc(var(--pad-r) + 12px) 2px calc(var(--pad-l) + 12px);
  }
  .glass { background: rgba(255,255,255,.07); border-radius: 14px; box-shadow: inset 0 0 0 1px rgba(255,255,255,.06); }
  .iconbtn { width: 44px; height: 44px; display: grid; place-items: center; flex: 0 0 auto; }
  .iconbtn svg { width: 20px; height: 20px; }
  .iconbtn:active, .stat:active { transform: scale(.96); }
  .title { flex: 1; padding: 0 4px; text-align: left; }
  .title b { display: block; font-size: 1.02rem; letter-spacing: -.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .title span { display: block; font-size: .72rem; color: #9fb0a9; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .stat { min-width: 62px; height: 44px; padding: 0 10px; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .stat b { font-size: 1.1rem; line-height: 1.1; font-weight: 750; }
  .stat span { font-size: .58rem; letter-spacing: .09em; text-transform: uppercase; color: #9fb0a9; font-weight: 700; }

  /* ── Board ── */
  #stage { position: relative; }
  #board { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  #toast {
    position: absolute; left: 50%; top: 10px; transform: translate(-50%, -6px); max-width: calc(100% - 32px);
    padding: 8px 14px; border-radius: 999px; background: rgba(20,28,26,.88); color: #fff; font-size: .84rem; font-weight: 600;
    box-shadow: 0 6px 20px rgba(0,0,0,.3); pointer-events: none; opacity: 0; transition: opacity .25s, transform .25s; text-align: center;
  }
  #toast.on { opacity: 1; transform: translate(-50%, 0); }

  .card { background: var(--card); color: var(--ink); border-radius: 20px; box-shadow: 0 12px 34px rgba(0,0,0,.34); }

  /* ── Info about a square ── */
  #info {
    position: absolute; left: 12px; right: 12px; margin: 0 auto; max-width: 420px; padding: 14px 16px 12px;
    max-height: calc(50% - 16px); overflow-y: auto; -webkit-overflow-scrolling: touch;
  }
  #info.top { top: 10px; } #info.bottom { bottom: 10px; }
  .x { position: absolute; top: 8px; right: 8px; width: 34px; height: 34px; border-radius: 12px; font-size: 1.3rem; line-height: 34px; color: var(--ink-2); }
  .kind { font-size: .66rem; font-weight: 750; letter-spacing: .09em; text-transform: uppercase; color: var(--muted); margin-right: 36px; }
  #info h3 { margin: 2px 0 2px; font-size: 1.08rem; letter-spacing: -.01em; }
  #info p { margin: 0 0 6px; color: var(--ink-2); font-size: .84rem; }

  /* ── The piece in hand ── */
  #panel {
    width: calc(100% - 16px); max-width: 520px; justify-self: center; display: flex; align-items: center; gap: 8px;
    margin: 4px calc(var(--pad-r) + 8px) calc(var(--pad-b) + 8px) calc(var(--pad-l) + 8px); padding: 8px; border-radius: 18px;
  }
  #piece { flex: 1; min-width: 0; }
  #piece .head { grid-template-columns: 44px 1fr; gap: 10px; }
  #piece .mini { width: 44px; height: 44px; border-radius: 12px; }
  #piece .name { display: block; font-size: .98rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .nx { display: inline-flex; align-items: center; gap: 4px; }
  .nx svg { display: block; }
  #controls { flex: 0 0 auto; margin-top: 0; }
  #controls .tool { height: 44px; }
  #bTurn, #bFlip { width: 44px; padding: 0; justify-content: center; }
  #controls .primary { flex: 0 0 auto; height: 44px; padding: 0 20px; }
  .head { display: grid; grid-template-columns: 58px 1fr auto; gap: 12px; align-items: center; width: 100%; text-align: left; }
  .hint { display: flex; align-items: center; gap: 10px; white-space: nowrap; font-size: .74rem; font-weight: 650; color: var(--muted); margin-top: 2px; }
  .mini { width: 58px; height: 58px; display: grid; place-items: center; background: var(--card-2); border-radius: 14px; }
  .mini svg { display: block; }
  .name { font-weight: 750; font-size: 1.06rem; letter-spacing: -.01em; display: flex; align-items: center; gap: 7px; flex-wrap: wrap; }
  .chip { font-size: .58rem; font-weight: 750; letter-spacing: .09em; text-transform: uppercase; padding: 3px 7px; border-radius: 999px; color: #fff; background: var(--c); }
  .next { display: flex; flex-direction: column; align-items: center; gap: 3px; }
  .next span { font-size: .58rem; font-weight: 750; letter-spacing: .09em; text-transform: uppercase; color: var(--muted); }
  .next .mini { width: 44px; height: 44px; border-radius: 12px; }

  .mods { list-style: none; margin: 10px 0 0; padding: 0; display: grid; gap: 5px; }
  .mods li { display: flex; align-items: center; gap: 7px; font-size: .84rem; }
  .mods li b { flex: 0 0 auto; min-width: 36px; text-align: center; padding: 2px 6px; border-radius: 8px; font-size: .8rem; font-weight: 800;
               font-variant-numeric: tabular-nums; background: var(--good-bg); color: var(--good); }
  .mods li.bad b { background: var(--bad-bg); color: var(--bad); }
  .mods li.base b { background: var(--ink); color: #fff; }
  .mods li.zero { color: var(--muted); }
  .mods li.zero b { background: var(--card-2); color: var(--muted); }
  .mods li .ico { width: 18px; height: 18px; flex: 0 0 auto; }
  .mods li i.sp { width: 18px; flex: 0 0 auto; }
  .bk { cursor: pointer; }
  .bk small { display: block; font-size: .74rem; color: var(--muted); margin-top: 1px; }
  .scored { font-size: .8rem; font-weight: 800; padding: 2px 8px; border-radius: 999px; background: var(--ink); color: #fff; vertical-align: 2px; }

  .controls { display: flex; gap: 8px; margin-top: 12px; }
  .tool { height: 48px; padding: 0 12px; border-radius: 14px; background: var(--card-2); color: var(--ink); font-weight: 650; font-size: .85rem;
          display: inline-flex; align-items: center; gap: 6px; flex: 0 0 auto; }
  .tool svg { width: 18px; height: 18px; flex: 0 0 auto; }
  .tool em { font-style: normal; font-size: .7rem; font-weight: 800; background: var(--ink); color: #fff; border-radius: 999px; padding: 1px 6px; }
  .tool[disabled] { opacity: .4; pointer-events: none; }
  .tool:active, .primary:active { transform: translateY(1px); }
  .primary { flex: 1; height: 48px; border-radius: 14px; background: var(--accent); color: #fff; font-weight: 750; font-size: 1rem;
             box-shadow: inset 0 -3px 0 var(--accent-2); }
  .primary[disabled] { background: #dcd6ca; color: #8e897e; box-shadow: none; pointer-events: none; }
  .primary.dark { background: var(--ink); box-shadow: inset 0 -3px 0 #000; }

  .done { display: flex; align-items: baseline; gap: 6px; padding-left: 6px; }
  .done .big { font-size: 1.7rem; font-weight: 800; letter-spacing: -.03em; line-height: 1; }
  .done .sub { font-size: .8rem; color: var(--ink-2); }

  /* ── Sheets and dialogs ── */
  .overlay { position: fixed; inset: 0; background: rgba(8,14,12,.55); -webkit-backdrop-filter: blur(3px); backdrop-filter: blur(3px); }
  .center { display: grid; place-items: center; padding: 20px; }
  .dialog { width: 100%; max-width: 380px; padding: 24px 20px 20px; max-height: calc(100vh - 40px); overflow-y: auto; }
  /* Whatever the dialog holds, its last row of buttons stays on screen: nobody gets stuck scrolling for the way out. */
  .dialog > .row:last-child .primary { height: auto; min-height: 48px; padding: 8px 10px; line-height: 1.2; }
  .dialog > .row:last-child .primary .sub { display: block; font-size: .68rem; font-weight: 600; opacity: .85; margin-top: 2px; }
  .dialog > .row:last-child, .dialog > .foot {
    position: sticky; bottom: -20px; margin: 14px -20px -20px; padding: 12px 20px calc(20px + var(--pad-b));
    background: var(--card); border-radius: 0 0 20px 20px;
    /* Soft above, so the page looks like it runs on under the buttons rather than being cut off. */
    box-shadow: 0 -14px 16px -8px var(--card);
  }
  .dialog > .foot .dots { margin: 2px 0 0; } .dialog > .foot .swipe { margin: 6px 0 0; }
  .dialog > .foot .row { margin-top: 10px; }
  .dialog h1 { margin: 0; font-size: 2.1rem; letter-spacing: -.035em; line-height: 1; }
  .dialog h2 { margin: 0 0 4px; font-size: 1.3rem; letter-spacing: -.02em; }
  .dialog p { margin: 8px 0 12px; color: var(--ink-2); font-size: .9rem; }
  .dialog input {
    width: 100%; font: inherit; font-size: 16px; padding: 13px 14px; border-radius: 14px; border: 0; background: var(--card-2);
    color: var(--ink); text-align: center; -webkit-user-select: text; user-select: text; box-shadow: inset 0 0 0 1.5px transparent;
  }
  .dialog input:focus { outline: none; box-shadow: inset 0 0 0 2px var(--accent); }
  .how { margin-top: 12px; text-align: left; }
  .how summary { cursor: pointer; list-style: none; text-align: center; font-size: .86rem; font-weight: 700; color: var(--ink-2); padding: 6px; }
  .how summary::-webkit-details-marker { display: none; }
  .row { display: flex; gap: 8px; margin-top: 14px; }
  .row .tool { flex: 1; justify-content: center; }
  .rules { margin: 12px 0 0; padding: 0; list-style: none; text-align: left; }
  .rules li { position: relative; padding: 7px 0 7px 26px; font-size: .86rem; color: var(--ink-2); border-top: 1px solid var(--line); }
  .rules li b { color: var(--ink); }
  .rules li::before { content: ""; position: absolute; left: 6px; top: 13px; width: 8px; height: 8px; border-radius: 3px; background: var(--accent); }
  /* The summary is a few pages side by side: swipe, or use the dots. */
  .pages { display: flex; overflow-x: auto; scroll-snap-type: x mandatory; scroll-behavior: smooth;
           margin: 0 -20px; padding: 0 20px; gap: 40px; scrollbar-width: none; }
  .pages::-webkit-scrollbar { display: none; }
  .pages > section { flex: 0 0 100%; scroll-snap-align: center; }
  .dots { display: flex; justify-content: center; gap: 7px; margin: 14px 0 2px; }
  .dots button { width: 8px; height: 8px; border-radius: 999px; background: var(--line); }
  .dots button[aria-current="true"] { background: var(--ink-2); width: 20px; }
  .swipe { text-align: center; font-size: .76rem; color: var(--muted); font-weight: 650; margin-top: 8px; }
  .final { text-align: center; }
  .final .big { font-size: 3.2rem; font-weight: 800; letter-spacing: -.04em; line-height: 1; margin: 8px 0 2px; }
  .final .best { font-size: .8rem; color: var(--muted); font-weight: 650; }
  .tally { margin: 14px 0 0; padding: 0; list-style: none; text-align: left; }
  .tally li { display: flex; justify-content: space-between; gap: 12px; padding: 7px 0; border-top: 1px solid var(--line); font-size: .88rem; }
  .tally li span { color: var(--ink-2); }
  .tally li b { font-variant-numeric: tabular-nums; }

  .sheet {
    position: fixed; left: 0; right: 0; bottom: 0; margin: 0 auto; max-width: 560px; max-height: 82vh; overflow-y: auto;
    -webkit-overflow-scrolling: touch; border-radius: 22px 22px 0 0; padding: 18px 16px calc(var(--pad-b) + 18px);
  }
  .sheet h2 { margin: 0 0 4px; font-size: 1.2rem; letter-spacing: -.01em; }
  .sheet > p { margin: 0 0 10px; color: var(--ink-2); font-size: .86rem; }
  .deck { display: grid; grid-template-columns: 1fr; gap: 8px; margin-top: 10px; }
  .deckrow { display: grid; grid-template-columns: 48px 1fr; gap: 12px; align-items: center; background: var(--card-2); border-radius: 14px; padding: 8px 10px; }
  .deckrow .mini { width: 48px; height: 48px; background: var(--card); }
  .deckrow .name { font-size: .92rem; }
  .deckrow .mods { margin-top: 6px; gap: 3px; }
  .deckrow .mods li { font-size: .76rem; }
  .deckrow .mods li b { min-width: 30px; font-size: .72rem; padding: 1px 5px; }
  .count { font-size: .72rem; font-weight: 800; color: var(--ink-2); background: var(--card); border-radius: 999px; padding: 1px 7px; }

  .goal { display: flex; align-items: center; gap: 9px; font-size: .88rem; padding: 4px 0; }
  .goal .tick { width: 20px; height: 20px; border-radius: 999px; flex: 0 0 auto; display: grid; place-content: center;
                background: var(--card-2); color: var(--muted); font-size: .72rem; font-weight: 800; }
  .goal.hit .tick { background: var(--good-bg); color: var(--good); }
  .goal b { margin-left: auto; font-variant-numeric: tabular-nums; color: var(--ink-2); font-size: .8rem; }
  .goal.hit b { color: var(--good); }
  .par { display: flex; align-items: baseline; gap: 8px; justify-content: center; margin: 10px 0 2px; font-weight: 750; }
  .par b { font-size: 1.25rem; }
  .par.win { color: var(--good); } .par.lose { color: var(--bad); }
  .modes { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 12px; }
  .modes button { display: block; height: auto; min-height: 66px; padding: 12px 10px; text-align: center; flex: none; line-height: 1.25;
                  font-size: 1.05rem; font-weight: 800; }
  .modes .sub { display: block; font-size: .72rem; font-weight: 600; opacity: .85; margin-top: 4px; }
  .modes.one { grid-template-columns: 1fr; margin-top: 10px; }
  .modes.one button { min-height: 56px; }
  .primary.green { background: #2f8a55; box-shadow: inset 0 -3px 0 #226a41; }
  .primary.wheat { background: #e2bf5c; color: #4a3508; box-shadow: inset 0 -3px 0 #b8952f; }

  /* ── The tutorial's coach: one card that says what to do next ── */
  #coach {
    position: absolute; left: 12px; right: 12px; margin: 0 auto; max-width: 420px; padding: 12px 16px 12px; z-index: 30;
    max-height: calc(50% - 16px); overflow-y: auto; -webkit-overflow-scrolling: touch;
  }
  #coach.top { top: 10px; } #coach.bottom { bottom: 10px; }
  #coach { animation: coachIn .35s ease both; }
  @keyframes coachIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  #coach p { margin: 4px 0 0; color: var(--ink-2); font-size: .88rem; }
  #coach p b { color: var(--ink); }
  #coach .todo { list-style: none; margin: 8px 0 0; padding: 0; display: flex; flex-wrap: wrap; gap: 6px; }
  #coach .todo li { font-size: .78rem; font-weight: 700; padding: 3px 10px 3px 6px; border-radius: 999px; background: var(--card-2); color: var(--muted);
                    display: flex; align-items: center; gap: 5px; }
  #coach .todo li::before { content: ""; width: 12px; height: 12px; border-radius: 999px; box-shadow: inset 0 0 0 1.5px currentColor; }
  #coach .todo li.ok { background: var(--good-bg); color: var(--good); }
  #coach .todo li.ok::before { content: "✓"; box-shadow: none; font-size: .7rem; line-height: 12px; text-align: center; }
  #coach .go { display: flex; justify-content: flex-end; gap: 8px; margin-top: 10px; }
  #coach .go .primary { flex: 0 0 auto; height: 40px; padding: 0 20px; font-size: .92rem; }
  #coach .go .tool { height: 40px; }
  .crest { width: 66px; height: 66px; border-radius: 20px; display: block; margin: 0 auto 10px; box-shadow: 0 8px 20px rgba(0,0,0,.18); }
  .today { margin: 12px 2px 0; font-size: .82rem; color: var(--ink-2); font-weight: 650; }
  .versus { margin: 12px 0 4px; padding: 12px 14px; border-radius: 16px; background: #f6e7b4; color: #6b4a08;
            font-weight: 750; font-size: 1rem; text-align: center; }
  .versus span { display: block; font-size: .8rem; font-weight: 600; margin-top: 3px; }
  .versus.win { background: var(--good-bg); color: var(--good); }
  .versus.lose { background: var(--bad-bg); color: var(--bad); }
  .wide { width: 100%; margin-top: 10px; }
  .linkbtn { display: block; margin: 10px auto 0; padding: 6px; font-size: .84rem; font-weight: 700; color: var(--ink-2); }
  .sharebox input { margin-top: 8px; font-size: .8rem; }
  .label { margin: 14px 0 2px; font-size: .72rem; font-weight: 750; letter-spacing: .09em; text-transform: uppercase; color: var(--muted); }
  .tchips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
  .tchip { font-size: .78rem; font-weight: 700; padding: 4px 10px; border-radius: 999px; background: #f6e7b4; color: #7a5608; }
  .tchip.bad { background: var(--bad-bg); color: var(--bad); }

  /* ── The Hügelland Herald, at the end of a daily town ── */
  .paper {
    background: #efe7d3; color: #241f19; border-radius: 4px; padding: 14px 14px 16px; margin: 4px 0 2px;
    font-family: Georgia, "Iowan Old Style", "Times New Roman", serif; box-shadow: 0 2px 10px rgba(0,0,0,.18);
    background-image: repeating-linear-gradient(0deg, rgba(120,100,70,.05) 0 2px, transparent 2px 4px);
  }
  .paper .mast { display: flex; align-items: baseline; justify-content: space-between; gap: 8px;
                 border-bottom: 3px double #241f19; padding-bottom: 6px; }
  .paper .mast b { font-size: 1.24rem; letter-spacing: .01em; font-weight: 700; font-variant: small-caps; white-space: nowrap; }
  .paper .mast span { font-size: .52rem; letter-spacing: .1em; text-transform: uppercase; color: #6b5f4d; flex: 1 1 0; }
  .paper .mast span:last-child { text-align: right; }
  .paper .dateline { font-size: .6rem; letter-spacing: .1em; text-transform: uppercase; color: #6b5f4d;
                     border-bottom: 1px solid #c8bb9e; padding: 4px 0 6px; text-align: center; }
  .paper .hl { margin: 10px 0 0; font-size: 1.2rem; line-height: 1.15; letter-spacing: -.01em; text-align: center; font-weight: 700; }
  .paper .sub { margin: 6px 0 0; font-size: .84rem; line-height: 1.45; text-align: center; font-style: italic; color: #453c30; }
  .paper .cut { margin: 10px 0 0; text-align: center; }
  .paper .cut img { display: block; width: 100%; max-width: 250px; max-height: 150px; object-fit: cover; margin: 0 auto;
                    border: 1px solid #241f19; filter: sepia(.72) contrast(1.12) saturate(.65) brightness(1.02); }
  .paper .cut figcaption { font-size: .6rem; letter-spacing: .06em; text-transform: uppercase; color: #6b5f4d; margin-top: 4px; }
  .paper .short { margin-top: 10px; border-top: 1px solid #c8bb9e; padding-top: 8px; column-gap: 14px; }
  .paper .short p { margin: 0 0 8px; font-size: .76rem; line-height: 1.4; color: #352e25; text-align: justify; }
  .paper .short b { letter-spacing: .04em; }
  @media (min-width: 440px) { .paper .short { column-count: 2; } }

  /* ── Score pop and trophies ── */
  .pop { position: absolute; transform: translate(-50%, -100%); display: flex; flex-direction: column; align-items: center; gap: 5px;
         pointer-events: none; z-index: 5; transition: opacity .4s, margin-top .4s; }
  .pop.hide { opacity: 0; margin-top: -26px; }
  .popnum { font-size: 2.7rem; font-weight: 850; letter-spacing: -.04em; line-height: 1; color: #fff;
            text-shadow: 0 2px 0 #1b2422, 0 -2px 0 #1b2422, 2px 0 0 #1b2422, -2px 0 0 #1b2422, 0 8px 22px rgba(0,0,0,.45);
            animation: popIn .55s cubic-bezier(.2,1.7,.4,1) both; }
  .popnum.great { color: #a9f2b8; }
  .popnum.gold { color: #ffd45c; font-size: 3.4rem; }

  Buildings of one kind that touch make a district, and so do the buildings those touch. Each gains 1 point for

  A land bonus counts that land under the building and next to it. It is set when you build, so covering
  that land later takes nothing away, and water under a bridge still counts as water. Bonuses for buildings
  stay live, so a building gains whenever a neighbour it likes arrives.

/*
  Staging for a change that would alter what a map deals or how it scores. Mark a building `draft: true`, or give
  one a `pending` block, and set LIVE_FROM to the day it should arrive: at midnight Central that morning the
  drafts join the decks and the pending changes take effect, so no day's map changes partway through. Then fold
  the change into DEF, drop the flags, and move LIVE_FROM on to the next one. Nothing is staged at the moment.
*/
const LIVE_FROM = "2026-09-21";
const today = () => new Intl.DateTimeFormat("en-CA", { timeZone: "America/Chicago", year: "numeric", month: "2-digit", day: "2-digit" }).format(new Date());
const NEW_RULES = today() >= LIVE_FROM;
if (NEW_RULES) for (const k in DEF) {
  const d = DEF[k];
  if (d.pending) { Object.assign(d, d.pending); delete d.pending; }
  delete d.draft;
}

/* ───────────────────────── Small tools ───────────────────────── */

function mulberry(seed) {
  return function () {
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
const pick = (a, r = Math.random) => a[Math.floor(r() * a.length)];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
/* A fixed hash for art, so a square draws the same way every frame. */
function hash(a, b) { const s = Math.sin(a * 127.1 + b * 311.7) * 43758.5453; return s - Math.floor(s); }

const idx = (x, y) => y * COLS + x;
const colOf = (i) => i % COLS, rowOf = (i) => (i / COLS) | 0;
const inside = (x, y) => x >= 0 && y >= 0 && x < COLS && y < ROWS;
const N4 = [[1,0],[-1,0],[0,1],[0,-1]];
function around(i) {
  const x = colOf(i), y = rowOf(i), out = [];
  for (const [dx, dy] of N4) if (inside(x + dx, y + dy)) out.push(idx(x + dx, y + dy));
  return out;
}

/* ───────────────────────── The map ───────────────────────── */

/* A blob that prefers to grow into squares that already touch it, so patches come out chunky. */
function grow(t, r, start, size, kind) {
  if (start < 0 || t[start] !== "grass") return 0;
  const got = [start]; t[start] = kind;
  for (let tries = 0; got.length < size && tries < 60; tries++) {
    const cand = [];
    for (const c of got) for (const j of around(c)) {
      if (t[j] === "grass") cand.push([j, 1 + around(j).filter(q => t[q] === kind).length ** 2]);
    }
    if (!cand.length) break;
    let s = r() * cand.reduce((a, b) => a + b[1], 0);
    for (const [j, w] of cand) if ((s -= w) <= 0) { t[j] = kind; got.push(j); break; }
  }
  return got.length;
}

function makeMap(seed) {
  const r = mulberry(seed);
  const t = new Array(N).fill("grass");
  const n = (a, b) => a + Math.floor(r() * (b - a + 1));
  const style = r();
  if (style < .5) {
    // A river from the top edge to the bottom edge that wanders as it goes.
    let x = n(2, COLS - 3);
    for (let y = 0; y < ROWS; y++) {
      t[idx(x, y)] = "water";
      if (y > 0 && y < ROWS - 1 && r() < .3) { x = clamp(x + (r() < .5 ? -1 : 1), 1, COLS - 2); t[idx(x, y)] = "water"; }
    }
  } else if (style < .8) {
    // A lake on one side, with a creek that runs out across the map.
    const left = r() < .5, ly = n(3, ROWS - 4);
    grow(t, r, idx(left ? 0 : COLS - 1, ly), n(6, 8), "water");
    let y = ly + (r() < .5 ? -2 : 2);
    for (let s = 0; s < COLS; s++) {
      const x = left ? s : COLS - 1 - s;
      t[idx(x, y)] = "water";
      if (s > 1 && s < COLS - 1 && r() < .3) { y = clamp(y + (r() < .5 ? -1 : 1), 1, ROWS - 2); t[idx(x, y)] = "water"; }
    }
  } else {
    // Two ponds.
    grow(t, r, idx(n(1, 3), n(1, 4)), n(4, 6), "water");
    grow(t, r, idx(n(5, 7), n(7, 10)), n(4, 6), "water");
  }
  const spot = (nearWater) => {
    for (let tries = 0; tries < 50; tries++) {
      const i = Math.floor(r() * N);
      if (t[i] !== "grass") continue;
      if (nearWater && tries < 35 && !around(i).some(j => t[j] === "water")) continue;
      return i;
    }
    return -1;
  };
  grow(t, r, spot(false), n(5, 7), "forest");
  grow(t, r, spot(false), n(3, 5), "forest");
  grow(t, r, spot(false), 3, "ore");
  grow(t, r, spot(false), 2, "ore");
  grow(t, r, spot(true), n(4, 5), "wheat");
  grow(t, r, spot(false), n(3, 4), "wheat");
  grow(t, r, spot(false), n(4, 5), "herd");
  grow(t, r, spot(false), n(2, 3), "herd");
  return t;
}

/*
  Each game draws a few kinds of building from every category, and any map with water to cross gets a bridge. Then the counts go up or down until the
  deck covers a bit less than the land can take.
*/
const QUOTA = { home: 4, agri: 3, industry: 3, shop: 3, civic: 3, leisure: 2 };

function makeDeck(seed, terrain) {
  const r = mulberry(seed ^ 0x5bd1e995);
  const shuffle = (a) => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  const types = new Set();
  for (const cat in QUOTA) {
    shuffle(Object.keys(DEF).filter(k => DEF[k].cat === cat && !DEF[k].bridge && !DEF[k].draft)).slice(0, QUOTA[cat]).forEach(k => types.add(k));
  }
  const bridge = shuffle(Object.keys(DEF).filter(k => DEF[k].bridge && !DEF[k].draft)).find(k => placements(k).length);
  if (bridge) types.add(bridge);

  const chosen = [...types], count = {};
  for (const k of chosen) count[k] = DEF[k].n;
  const size = (k) => SHAPES[DEF[k].shape].length;
  const total = () => chosen.reduce((sum, k) => sum + count[k] * size(k), 0);
  const target = Math.round(terrain.filter(t => t !== "water").length * FILL);
  while (total() > target) {
    const k = pick(chosen.filter(q => count[q] > 1), r) || pick(chosen.filter(q => count[q] === 1 && !DEF[q].bridge), r);
    if (!k) break;
    count[k]--;
  }
  // Up to three of a kind of home, and no more than its usual count of anything else. To fill the deck,
  // the town gets new kinds of building instead of piling up copies.
  const cap = (k) => DEF[k].cat === "home" ? 3 : DEF[k].n;
  while (total() < target - 1) {
    const gap = target - total();
    const more = chosen.filter(q => count[q] < cap(q));
    const fresh = Object.keys(DEF).filter(q => !DEF[q].bridge && !DEF[q].draft && !types.has(q) && size(q) <= gap + 1);
    const k = (more.length && r() < .4 ? pick(more, r) : pick(fresh, r)) || pick(more, r);
    if (!k) break;
    if (!types.has(k)) { types.add(k); chosen.push(k); count[k] = 0; }
    count[k]++;
  }
  const deck = [];
  for (const k of chosen) for (let c = 0; c < count[k]; c++) deck.push({ k, key: DEF[k].era + r() * 1.6 });
  deck.sort((a, b) => a.key - b.key);
  return deck.map(d => d.k);
}

/* ───────────────────────── Footprints ───────────────────────── */

function orient(shape, rot, flip) {
  let s = SHAPES[shape].map(p => p.slice());
  if (flip) s = s.map(([x, y]) => [-x, y]);
  for (let k = 0; k < ((rot % 4) + 4) % 4; k++) s = s.map(([x, y]) => [-y, x]);
  const mx = Math.min(...s.map(p => p[0])), my = Math.min(...s.map(p => p[1]));
  return s.map(([x, y]) => [x - mx, y - my]);
}
const extent = (offs) => [Math.max(...offs.map(p => p[0])) + 1, Math.max(...offs.map(p => p[1])) + 1];

function cellsAt(type, o) {
  const out = [];
  for (const [x, y] of orient(DEF[type].shape, o.rot, o.flip)) {
    if (!inside(o.ax + x, o.ay + y)) return null;
    out.push(idx(o.ax + x, o.ay + y));
  }
  return out;
}

/* Every distinct way to turn and flip a shape. */
function orientations(type) {
  const seen = new Set(), out = [];
  for (const flip of [false, true]) for (let rot = 0; rot < 4; rot++) {
    const offs = orient(DEF[type].shape, rot, flip);
    const key = offs.map(p => p.join(",")).sort().join(";");
    if (!seen.has(key)) { seen.add(key); out.push({ rot, flip }); }
  }
  return out;
}

/* ───────────────────────── Game state ───────────────────────── */

let G = null;       // what gets saved
let MAP = null;     // terrain, rebuilt from the seed
let OWNER = null;   // for each square, the index of the building on it, or -1

function newGame(player, pickName, seed, daily = null) {
  seed = daily ? dailySeed(daily) : seed ?? (Math.random() * 2 ** 31) | 0;
  MAP = makeMap(seed);
  OWNER = new Array(N).fill(-1);
  const deck = makeDeck(seed, MAP);
  G = { v: 7, player, pick: pickName, seed, deck, at: 0, away: [], pieces: [], over: false,
        trophies: {}, streak: 0, challenge: null, day: daily, goals: daily ? goalsFor(daily, deck) : null, par: 0 };
  settle();
}
const isDaily = () => !!(G && G.day);

function restore(saved) {
  G = saved;
  MAP = makeMap(G.seed);
  OWNER = new Array(N).fill(-1);
  G.pieces.forEach((p, k) => {
    // Saves from before land was kept: work it out again, in the order the buildings went up.
    if (!p.land) p.land = look(p.cells).by;
    p.cells.forEach(c => { OWNER[c] = k; });
  });
}

const current = () => G.over ? null : G.deck[G.at];
const upcoming = () => G.over ? null : G.deck[G.at + 1] || null;
/* A building can't overlap another or sit on water. A bridge must sit on water, with both ends on land. */
function canPlace(cells, type) {
  if (!cells || cells.some(c => OWNER[c] >= 0)) return false;
  if (!DEF[type].bridge) return cells.every(c => MAP[c] !== "water");
  // A bridge's footprint is a straight line, so its first and last squares are its ends.
  return MAP[cells[0]] !== "water" && MAP[cells[cells.length - 1]] !== "water" && cells.some(c => MAP[c] === "water");
}

function placements(type) {
  const out = [];
  for (const o of orientations(type)) {
    const [w, h] = extent(orient(DEF[type].shape, o.rot, o.flip));
    for (let ay = 0; ay <= ROWS - h; ay++) for (let ax = 0; ax <= COLS - w; ax++) {
      const cells = cellsAt(type, { ...o, ax, ay });
      if (canPlace(cells, type)) out.push({ ...o, ax, ay, cells });
    }
  }
  return out;
}
const fits = (type) => placements(type).length > 0;

/* Moves past buildings that fit nowhere, and ends the game when the deck runs out. */
function settle() {
  const events = [];
  while (!G.over) {
    if (G.at >= G.deck.length) {
      G.over = true;
      if (!G.away.length) G.trophies.allfit = 1;
      events.push({ end: true });
      break;
    }
    if (fits(G.deck[G.at])) break;
    G.away.push(G.deck[G.at]); events.push({ away: G.deck[G.at] });
    G.at++;
  }
  return events;
}

/* Builds the building in hand. Scores are live, so the buildings next to it can go up or down too. */
function build(cells) {
  const type = current(), before = G.pieces.map((_, k) => pieceScore(k));
  G.pieces.push({ type, cells, land: look(cells).by });
  const k = G.pieces.length - 1;
  cells.forEach(c => { OWNER[c] = k; });
  G.at++;
  const parts = pieceParts(k), pts = sumParts(parts);
  const changed = before.map((b, j) => ({ k: j, d: pieceScore(j) - b })).filter(x => x.d);
  const gain = pts + changed.reduce((sum, x) => sum + x.d, 0);
  const trophies = judge(type, cells, parts, pts, gain, changed);
  for (const id of trophies) G.trophies[id] = (G.trophies[id] || 0) + 1;
  G.pieces[k].won = trophies;
  return { type, k, pts, parts, gain, changed, trophies, events: settle() };
}

/* ───────────────────────── Scoring ───────────────────────── */

/* What a footprint sits on and touches. `self` is its own index, so it doesn't count itself. */
function look(cells, self = -1) {
  const own = new Set(cells), on = {}, by = {}, near = new Set(), open = new Set();
  let edge = false;
  for (const c of cells) {
    on[MAP[c]] = (on[MAP[c]] || 0) + 1;
    const x = colOf(c), y = rowOf(c);
    for (const [dx, dy] of N4) {
      if (!inside(x + dx, y + dy)) { edge = true; continue; }
      const j = idx(x + dx, y + dy);
      if (own.has(j)) continue;
      if (OWNER[j] >= 0 && OWNER[j] !== self) near.add(OWNER[j]);
      if (OWNER[j] < 0 && MAP[j] !== "water") open.add(j);
      // Water never runs out: a bridge over it doesn't stop it counting.
      if (OWNER[j] < 0 || MAP[j] === "water") by[j] = MAP[j];
    }
  }
  const byCount = {};
  for (const j in by) byCount[by[j]] = (byCount[by[j]] || 0) + 1;
  // A placed building keeps the land it had beside it when it was built.
  const land = self >= 0 && G.pieces[self].land;
  return { on, by: land || byCount, near: [...near].map(k => ({ k, type: G.pieces[k].type })), edge, self, open: open.size };
}

/* The buildings a footprint shares a side with. */
function touching(cells, self = -1) {
  const own = new Set(cells), out = new Set();
  for (const c of cells) for (const j of around(c)) if (!own.has(j) && OWNER[j] >= 0 && OWNER[j] !== self) out.add(OWNER[j]);
  return out;
}

/* The buildings in the district a footprint belongs to, or would join, not counting itself. */
function districtOf(type, cells, self = -1) {
  if (DEF[type].bridge) return [];
  const same = (k) => k !== self && !DEF[G.pieces[k].type].bridge && DEF[G.pieces[k].type].cat === DEF[type].cat;
  const queue = [...touching(cells, self)].filter(same), found = new Set(queue);
  while (queue.length) {
    const k = queue.pop();
    for (const j of touching(G.pieces[k].cells, k)) if (!found.has(j) && same(j)) { found.add(j); queue.push(j); }
  }
  return [...found];
}

const matches = (r, type) => !!r.any || (r.bridge && !!DEF[type].bridge) || (r.types || []).includes(type) || (r.cats || []).includes(DEF[type].cat);

function evalRule(r, c, type, cells) {
  if (r.k === "land") {
    const n = (c.on[r.t] || 0) + (c.by[r.t] || 0);
    return { n, v: (r.once ? Math.min(n, 1) : n) * r.p };
  }
  if (r.k === "near") { const hit = c.near.filter(q => matches(r, q.type)); return { n: hit.length, hit, v: hit.length * r.p }; }
  if (r.k === "edge") return { n: c.edge ? 1 : 0, v: c.edge ? r.p : 0 };
  if (r.k === "variety") { const n = new Set(c.near.map(q => DEF[q.type].cat)).size; return { n, v: n * r.p }; }
  if (r.k === "town") { const n = G.pieces.filter((p, k) => k !== c.self && matches(r, p.type)).length; return { n, v: n * r.p }; }
  if (r.k === "without") { const n = c.near.some(q => matches(r, q.type)) ? 0 : 1; return { n, v: n * r.p }; }
  if (r.k === "crowd") { const n = districtOf(type, cells, c.self).length + 1; return { n, v: n >= r.n ? r.p : 0 }; }
  if (r.k === "room") return { n: c.open, v: c.open * r.p };
  return { n: 0, v: 0 };
}

/*
  A score, part by part, from what the building sits on and touches right now. Base points come first, as rule -1,
  then the district, as rule "district", where n is the size of the district.
*/
function scoreParts(type, cells, self = -1) {
  const d = DEF[type], c = look(cells, self), parts = [{ r: -1, n: 1, v: d.base }];
  if (!d.bridge) { const n = districtOf(type, cells, self).length + 1; parts.push({ r: "district", n, v: Math.min(n - 1, DISTRICT_MAX) }); }
  return [...parts, ...d.rules.map((r, i) => { const e = evalRule(r, c, type, cells); return { r: i, n: e.n, v: e.v }; })];
}
const sumParts = (parts) => parts.reduce((sum, q) => sum + q.v, 0);
const pieceParts = (k) => scoreParts(G.pieces[k].type, G.pieces[k].cells, k);
const pieceScore = (k) => sumParts(pieceParts(k));
const boardScore = () => G.pieces.reduce((sum, _, k) => sum + pieceScore(k), 0);
const total = () => boardScore() - AWAY * G.away.length + (G.over && !G.away.length ? ALL_FIT : 0);

/* ───────────────────────── Trophies ───────────────────────── */

const GREAT = 9, JACKPOT = 15;    // points a move must earn to count as great, or as a jackpot
/* In the order they are announced. */
const TROPHIES = {
  jackpot:    { name: "Jackpot!",           good: true },
  district:   { name: "Full district",      good: true },
  combo:      { name: "Combo!",             good: true },
  quadruple:  { name: "Quadruple!",         good: true },
  triple:     { name: "Triple!",            good: true },
  perfect:    { name: "Perfect ground",     good: true },
  rich:       { name: "Rich land",          good: true },
  boost:      { name: "Good neighbour",     good: true },
  snug:       { name: "Snug fit",           good: true },
  roll:       { name: "On a roll",          good: true },
  allfit:     { name: "Every building fit", good: true },
  ouch:       { name: "Ouch",               good: false },
  neighbours: { name: "Bad neighbours",     good: false },
  spoiler:    { name: "Spoiler",            good: false },
  wasted:     { name: "Wasted land",        good: false },
};

/* `gain` is what the whole move earned: the new building's score plus every change it caused next door. */
function judge(type, cells, parts, pts, gain, changed) {
  const d = DEF[type], out = new Set(), ruleOf = (q) => d.rules[q.r];
  if (gain >= JACKPOT) out.add("jackpot");
  // A district big enough that every building in it earns the most it can.
  if (parts.some(q => q.r === "district" && q.n > DISTRICT_MAX)) out.add("district");

  // The biggest stack of one neighbour bonus: 3 of a kind is a triple, 4 a quadruple, 5 or more a combo.
  // Land bonuses count squares, which stack up much more easily, so they have their own trophy at 5.
  let top = 0, land = 0;
  for (const q of parts) {
    const r = ruleOf(q);
    if (!r || r.p <= 0 || r.once || ["edge", "without", "crowd", "room"].includes(r.k)) continue;
    if (r.k === "land") land = Math.max(land, q.n); else top = Math.max(top, q.n);
  }
  if (top >= 3) out.add(top >= 5 ? "combo" : top === 4 ? "quadruple" : "triple");
  if (land >= 5) out.add("rich");

  if (cells.length >= 2 && cells.every(c => d.rules.some(r => r.k === "land" && r.p > 0 && r.t === MAP[c]))) out.add("perfect");
  // Only buildings that touch it: a growing district lifts buildings further away too.
  const next = touching(cells, G.pieces.length - 1);
  if (changed.filter(x => x.d > 0 && next.has(x.k)).length >= 3) out.add("boost");
  const own = new Set(cells);
  if (!cells.some(c => around(c).some(j => !own.has(j) && OWNER[j] < 0 && MAP[j] !== "water"))) out.add("snug");

  G.streak = gain >= GREAT ? G.streak + 1 : 0;
  if (G.streak >= 3 && G.streak % 3 === 0) out.add("roll");

  if (pts <= 0) out.add("ouch");
  if (parts.some(q => { const r = ruleOf(q); return r && r.p < 0 && q.n >= 2; })) out.add("neighbours");
  if (changed.reduce((sum, x) => sum + Math.min(0, x.d), 0) <= -3) out.add("spoiler");
  const uses = new Set(d.rules.filter(r => r.k === "land").map(r => r.t));
  if (cells.filter(c => ["ore", "wheat", "herd"].includes(MAP[c]) && !uses.has(MAP[c])).length >= 2) out.add("wasted");
  return Object.keys(TROPHIES).filter(id => out.has(id));
}

/* ───────────────────────── The daily map ───────────────────────── */

/*
  One map a day, the same for everyone: the seed comes from the date in Texas, where the town comes from, so
  everyone plays the same map and the day turns over at midnight Central. A daily game also carries three goals
  and a par, and a free map is the game as it always was, with neither.
*/
const ZONE = "America/Chicago";
const dayKey = (d = new Date()) => new Intl.DateTimeFormat("en-CA", { timeZone: ZONE, year: "numeric", month: "2-digit", day: "2-digit" }).format(d);
const dayName = (key) => new Date(key + "T12:00:00Z").toLocaleDateString(undefined, { day: "numeric", month: "long" });

function seedFrom(text) {
  let h = 2166136261;
  for (let i = 0; i < text.length; i++) { h ^= text.charCodeAt(i); h = Math.imul(h, 16777619); }
  return h & 0x7fffffff;
}
const dailySeed = (key) => seedFrom("hugelland/" + key);

/* The biggest district of one kind in town, or of any kind when `cat` is left out. */
function biggestDistrict(cat) {
  let best = 0;
  G.pieces.forEach((p, k) => {
    if (DEF[p.type].bridge || (cat && DEF[p.type].cat !== cat)) return;
    best = Math.max(best, districtOf(p.type, p.cells, k).length + 1);
  });
  return best;
}
const goodTrophies = () => Object.keys(G.trophies).filter(id => TROPHIES[id].good).reduce((sum, id) => sum + G.trophies[id], 0);

/*
  What a day can ask for. `ns` are the sizes it picks from, hardest last. `at` is where the town stands now,
  so a goal can show its progress while you play. `floor` goals are met by the worst building, not the best.
*/
const GOALS = [
  { id: "district", ns: [6, 7], text: (n) => `One district of ${n} buildings`, at: () => biggestDistrict() },
  /*
    A district of one other kind. Homes come four kinds to a deck and everything else two or three, so asking
    for five shops is asking for something the day never deals. This one reads the day's own deck and asks only
    for what is in it, and always keeps a spare: three of a kind when the deck holds four or five, four when it
    holds six or more. A day with no such kind sets another goal instead.
  */
  { id: "catdistrict", text: (n, goal) => `A district of ${n} ${CATS[goal.cat].many}`, at: (goal) => biggestDistrict(goal.cat),
    pick: (count, r) => {
      // Always one more of that kind in the deck than the goal asks for: a day that deals three shops does not
      // demand that all three touch, which needs the shapes to fall exactly right.
      const cats = Object.keys(CATS).filter(c => c !== "home" && (count[c] || 0) >= 4);
      if (!cats.length) return null;
      const cat = pick(cats, r);
      return { cat, n: count[cat] >= 6 ? 4 : 3 };
    } },
  { id: "homes",    ns: [4, 5],    text: (n) => `${n} homes in one district`,    at: () => biggestDistrict("home") },
  { id: "big",      ns: [14, 15, 16], text: (n) => `A building worth ${n}`,      at: () => Math.max(0, ...G.pieces.map((p, k) => pieceScore(k))) },
  { id: "clean",    ns: [3, 4],    text: (n) => `Every building scores ${n}`,    floor: true,
    at: () => G.pieces.length ? Math.min(...G.pieces.map((p, k) => pieceScore(k))) : 0 },
  { id: "trophies", ns: [8, 10, 12], text: (n) => `Win ${n} trophies`,           at: () => goodTrophies() },
];

/* Three goals for a day, drawn from its seed. A goal that reads the deck is given it, and stands aside when the day cannot meet it. */
function goalsFor(key, deck = []) {
  const r = mulberry(seedFrom("goals/" + key));
  const count = {};
  for (const k of deck) if (!DEF[k].bridge) count[DEF[k].cat] = (count[DEF[k].cat] || 0) + 1;
  const pool = GOALS.slice();
  for (let i = pool.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [pool[i], pool[j]] = [pool[j], pool[i]]; }
  const out = [];
  for (const g of pool) {
    if (out.length === 3) break;
    if (!g.pick) { out.push({ id: g.id, n: g.ns[Math.floor(r() * g.ns.length)] }); continue; }
    const got = g.pick(count, r);
    if (got) out.push({ id: g.id, ...got });
  }
  return out;
}
const goalKind = (goal) => GOALS.find(g => g.id === goal.id);
const goalText = (goal) => goalKind(goal).text(goal.n, goal);
const goalNow = (goal) => goalKind(goal).at(goal);
const goalDone = (goal) => goalKind(goal).floor ? G.pieces.length > 0 && goalNow(goal) >= goal.n : goalNow(goal) >= goal.n;
const goalsDone = () => (G.goals || []).filter(goalDone).length;

/*
  Par: a good game on this map. A machine plays it through, always taking the best spot for the building in
  hand and never looking ahead, which is more than a person can weigh: it reads every one of the eighty or so
  spots each turn. Par is a share of that, so it is a target a sharp player can beat on a good day, and it
  still rises and falls with how rich the map is.
*/
const PAR_SHARE = .85;
function parFor(seed) {
  const keepG = G, keepMap = MAP, keepOwner = OWNER;
  try {
    newGame("par", 0, seed);
    while (!G.over) {
      const type = current(), k = G.pieces.length;
      let best = null;
      for (const spot of placements(type)) {
        // Put it down, read the board, take it back: cheaper than copying the game for every square.
        G.pieces.push({ type, cells: spot.cells, land: look(spot.cells).by });
        spot.cells.forEach(c => { OWNER[c] = k; });
        const v = boardScore();
        G.pieces.pop();
        spot.cells.forEach(c => { OWNER[c] = -1; });
        if (!best || v > best.v) best = { v, cells: spot.cells };
      }
      if (!best) break;
      build(best.cells);
    }
    return Math.round(total() * PAR_SHARE);
  } finally { G = keepG; MAP = keepMap; OWNER = keepOwner; }
}

/* ───────────────────────── Words ───────────────────────── */

const plural = (k) => DEF[k].plural || DEF[k].name + "s";
const joinOr = (a) => a.length < 2 ? a.join("") : a.slice(0, -1).join(", ") + " or " + a[a.length - 1];
const landWord = (t) => TERRAIN[t].short;
const signed = (v) => (v < 0 ? "−" : "+") + Math.abs(v);
const nearNoun = (r, n) => r.any ? (n === 1 ? "building" : "buildings") : r.bridge ? (n === 1 ? "bridge" : "bridges") : joinOr(n === 1
  ? [...(r.types || []).map(t => DEF[t].name), ...(r.cats || []).map(c => CATS[c].one)]
  : [...(r.types || []).map(plural), ...(r.cats || []).map(c => CATS[c].many)]);

const cap = (s) => s.charAt(0).toUpperCase() + s.slice(1);

/*
  A rule as the card shows it, after its points and its icon: "+2 Woods", "+2 Food". How to play says a land
  bonus counts the land under and next to a building, and a neighbour bonus counts what touches it, so the
  card only names what it counts. Rules that count further away say so.
*/
function ruleText(r) {
  // Water mostly counts once. The few rules that count every square of it say so.
  if (r.k === "land") return r.t === "water" && !r.once ? `Each ${landWord(r.t)}` : cap(landWord(r.t));
  if (r.k === "near") return r.any ? "Any building" : cap(nearNoun(r, 1));
  if (r.k === "edge") return "Map edge";
  if (r.k === "variety") return "Each kind of building";
  if (r.k === "town") return `${cap(nearNoun(r, 2))} in town`;
  if (r.k === "without") return `No ${nearNoun(r, 2)}`;
  if (r.k === "crowd") return `District of ${r.n} or more`;
  if (r.k === "room") return "Each open square";
  return "";
}

/* The district row on a building's card. */
const districtText = (type) => `${CATS[DEF[type].cat].name} district, max +${DISTRICT_MAX}`;

/* One part of a score as it stands, in as few words as it takes: "3 woods". */
function partText(type, q) {
  if (q.r === "district") return q.n > 1 ? `District of ${q.n}` : "No district";
  if (q.r < 0) return "Base";
  const r = DEF[type].rules[q.r];
  if (r.k === "land") return r.once ? cap(q.n ? landWord(r.t) : `no ${landWord(r.t)}`) : `${q.n} ${landWord(r.t)}`;
  if (r.k === "near") return `${q.n} ${nearNoun(r, q.n)}`;
  if (r.k === "edge") return q.n ? "Map edge" : "Not at the edge";
  if (r.k === "variety") return `${q.n} ${q.n === 1 ? "kind" : "kinds"}`;
  if (r.k === "town") return `${q.n} ${nearNoun(r, q.n)} in town`;
  if (r.k === "without") return q.n ? `No ${nearNoun(r, 2)}` : `Has ${nearNoun(r, 2)}`;
  if (r.k === "crowd") return q.n >= r.n ? `District of ${q.n}` : `District of ${q.n}, needs ${r.n}`;
  if (r.k === "room") return `${q.n} open ${q.n === 1 ? "square" : "squares"}`;
  return "";
}
</script>

<script>
"use strict";

/* ───────────────────────── Names ───────────────────────── */

const GAME = "Hügelland";   // the game's name, on the header and on a shared link

/* How a town takes its name from the one who founds it. */
const PREFIX = ["Fort", "St.", "New", "Port", "Mount"];        // Fort Zach
const HEAD = ["Glen"];                                         // Glenzach
const SUFFIX = ["ville", "burg", "ton", "field", "fels", "bury", "dale", "chester", "ford",
                "by", "hurst", "mont", "grove", "ridge"];      // Zachville
const TAIL = ["Creek", "Springs"];                             // Zach Creek
const BOTH = [["New", "fels"], ["New", "burg"], ["Fort", "ton"]];   // New Zachfels, as New Braunfels got its name
const NAME_FORMS = PREFIX.length + HEAD.length + SUFFIX.length + TAIL.length + BOTH.length;
function townName(player, n) {
  const first = player.trim().split(/\s+/)[0] || "Pioneer";
  const name = first.charAt(0).toUpperCase() + first.slice(1);
  const all = PREFIX.map(p => `${p} ${name}`)
    .concat(HEAD.map(h => h + name.toLowerCase()))
    .concat(SUFFIX.map(s => name + s))
    .concat(TAIL.map(t => `${name} ${t}`))
    .concat(BOTH.map(([p, s]) => `${p} ${name}${s}`));
  return all[((n % all.length) + all.length) % all.length];
}

/* ───────────────────────── Screen ───────────────────────── */

const $ = (id) => document.getElementById(id);
const cv = $("board"), ctx = cv.getContext("2d");
const layer = document.createElement("canvas"), lg = layer.getContext("2d");
const wash = document.createElement("canvas"), wg = wash.getContext("2d");   // the lot a building in hand would join
const SAVE = "firsttown.v3", BEST = "firsttown.best";
const esc = (s) => String(s).replace(/[&<>"]/g, (ch) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[ch]);

const UI = {
  dpr: 1, w: 0, h: 0, S: 40, BX: 0, BY: 0,
  ghost: null,       // { rot, flip, ax, ay } for the building in hand
  rules: false,      // the scoring card for the building in hand is open
  sel: -1,           // the square whose info is open
  dirty: true,       // the baked board needs drawing again
  drop: null,        // { k, t } a building landing
  shown: 0,          // the score as the counter shows it
  confirm: false,
};

function layout() {
  const r = $("stage").getBoundingClientRect();
  const dpr = Math.min(window.devicePixelRatio || 1, 3);
  UI.dpr = dpr; UI.w = r.width; UI.h = r.height;
  cv.width = layer.width = wash.width = Math.max(1, Math.round(r.width * dpr));
  cv.height = layer.height = wash.height = Math.max(1, Math.round(r.height * dpr));
  const pad = 6, frame = .24;
  UI.S = Math.max(16, Math.floor(Math.min((r.width - pad * 2) / (COLS + frame * 2), (r.height - pad * 2) / (ROWS + frame * 2))));
  UI.BX = Math.round((r.width - COLS * UI.S) / 2);
  UI.BY = Math.round((r.height - ROWS * UI.S) / 2);
  UI.dirty = true;
}

/* ───────────────────────── Drawing tools ───────────────────────── */

function rr(g, x, y, w, h, r) {
  r = Math.max(0, Math.min(r, w / 2, h / 2));
  g.moveTo(x + r, y);
  g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r);
  g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r);
  g.closePath();
}
const cellX = (i) => UI.BX + colOf(i) * UI.S, cellY = (i) => UI.BY + rowOf(i) * UI.S;
function circle(g, x, y, r, c) { g.fillStyle = c; g.beginPath(); g.arc(x, y, r, 0, Math.PI * 2); g.fill(); }
function ellipse(g, x, y, rx, ry, c) { g.fillStyle = c; g.beginPath(); g.ellipse(x, y, rx, ry, 0, 0, Math.PI * 2); g.fill(); }

/*
  One path for a group of squares, as if cut from one sheet: rounded outside corners,
  with bridges across the gaps between squares that belong together.
*/
function union(g, cells, inset, r, dy = 0) {
  const set = new Set(cells), S = UI.S, span = inset * 2 + r * 2;
  g.beginPath();
  for (const i of cells) {
    const x = cellX(i), y = cellY(i) + dy, right = colOf(i) < COLS - 1 && set.has(i + 1), down = set.has(i + COLS);
    rr(g, x + inset, y + inset, S - inset * 2, S - inset * 2, r);
    if (right) g.rect(x + S - inset - r, y + inset, span, S - inset * 2);
    if (down) g.rect(x + inset, y + S - inset - r, S - inset * 2, span);
    if (right && down && set.has(i + COLS + 1)) g.rect(x + S - inset - r, y + S - inset - r, span, span);
  }
}

function shade(hex, f) {
  const n = parseInt(hex.slice(1), 16);
  const ch = (v) => Math.round(f < 0 ? v * (1 + f) : v + (255 - v) * f);
  return `rgb(${ch(n >> 16)},${ch(n >> 8 & 255)},${ch(n & 255)})`;
}

/* ───────────────────────── The land ───────────────────────── */

const GRASS = ["#a5c884", "#a0c47f", "#9cc17b", "#a9cb88"];
const TREES = ["#4f8d52", "#5b9a58", "#468449", "#62a05c"];

function tree(g, x, y, r, seed) {
  ellipse(g, x + r * .32, y + r * .42, r * 1.02, r * .82, "rgba(28,58,34,.26)");
  circle(g, x, y, r, TREES[(seed * TREES.length) | 0]);
  circle(g, x - r * .28, y - r * .3, r * .52, "rgba(255,255,255,.14)");
}

function drawLand(g) {
  const S = UI.S, W = COLS * S, H = ROWS * S, m = S * .24;

  g.save();
  g.shadowColor = "rgba(0,0,0,.45)"; g.shadowBlur = S * .7; g.shadowOffsetY = S * .22;
  g.beginPath(); rr(g, UI.BX - m, UI.BY - m, W + m * 2, H + m * 2, S * .55); g.fillStyle = "#3a4843"; g.fill();
  g.restore();
  g.beginPath(); rr(g, UI.BX - m, UI.BY - m, W + m * 2, H + m * 2, S * .55);
  g.strokeStyle = "rgba(255,255,255,.07)"; g.lineWidth = 1; g.stroke();
  g.beginPath(); rr(g, UI.BX - 3, UI.BY - 3, W + 6, H + 6, S * .3); g.fillStyle = "#26302d"; g.fill();

  g.save();
  g.beginPath(); rr(g, UI.BX, UI.BY, W, H, S * .26); g.clip();

  for (let i = 0; i < N; i++) {
    g.fillStyle = GRASS[(hash(i, 1) * GRASS.length) | 0];
    g.fillRect(cellX(i), cellY(i), S + .5, S + .5);
  }
  // Tufts on the open grass.
  g.strokeStyle = "rgba(70,110,50,.35)"; g.lineWidth = Math.max(1, S * .025); g.lineCap = "round";
  g.beginPath();
  for (let i = 0; i < N; i++) {
    if (MAP[i] !== "grass") continue;
    for (let k = 0; k < 3; k++) {
      const x = cellX(i) + S * (.14 + .72 * hash(i, k * 3 + 2)), y = cellY(i) + S * (.18 + .7 * hash(i, k * 5 + 7)), s = S * .05;
      g.moveTo(x - s, y - s); g.lineTo(x, y); g.lineTo(x + s * .8, y - s * 1.1);
    }
  }
  g.stroke();

  const of = (t) => { const a = []; for (let i = 0; i < N; i++) if (MAP[i] === t) a.push(i); return a; };

  // Wild wheat: rows of little stalks.
  union(g, of("wheat"), S * .03, S * .28); g.fillStyle = "#e5c66b"; g.fill();
  for (const i of of("wheat")) {
    const x = cellX(i), y = cellY(i);
    for (let row = 0; row < 4; row++) for (let col = 0; col < 4; col++) {
      const px = x + S * (.16 + col * .22 + (row % 2) * .1), py = y + S * (.22 + row * .21);
      if (px > x + S * .92) continue;
      g.strokeStyle = "#c9a445"; g.lineWidth = Math.max(1, S * .035);
      g.beginPath(); g.moveTo(px, py + S * .05); g.lineTo(px + S * .03, py - S * .06); g.stroke();
      circle(g, px + S * .035, py - S * .07, S * .028, "#f3dc92");
    }
  }

  // Grazing herds: lush grass. The animals move, so they are drawn every frame.
  union(g, of("herd"), S * .03, S * .3); g.fillStyle = "#c9de8f"; g.fill();
  union(g, of("herd"), S * .1, S * .24); g.fillStyle = "#d2e39a"; g.fill();

  // Ore: grey rock with bright flecks.
  union(g, of("ore"), S * .04, S * .3); g.fillStyle = "#c3baa8"; g.fill();
  for (const i of of("ore")) {
    const x = cellX(i), y = cellY(i);
    const rocks = [[.34, .38, .2], [.68, .6, .16], [.36, .74, .11]];
    for (const [rx, ry, rs] of rocks) {
      const px = x + S * (rx + (hash(i, rx * 10) - .5) * .08), py = y + S * ry, s = S * rs;
      ellipse(g, px + s * .2, py + s * .3, s * 1.05, s * .75, "rgba(60,50,40,.22)");
      ellipse(g, px, py, s, s * .78, "#8f887d");
      ellipse(g, px - s * .18, py - s * .2, s * .62, s * .42, "#aaa396");
    }
    for (let k = 0; k < 4; k++) {
      const px = x + S * (.2 + .6 * hash(i, k + 40)), py = y + S * (.2 + .6 * hash(i, k + 50));
      g.fillStyle = k % 2 ? "#f2cf63" : "#e8eef2";
      g.save(); g.translate(px, py); g.rotate(Math.PI / 4); g.fillRect(-S * .025, -S * .025, S * .05, S * .05); g.restore();
    }
  }

  // Woods ground.
  union(g, of("forest"), S * .02, S * .32); g.fillStyle = "#86b16b"; g.fill();

  // Water: a pale bank, then deeper water in the middle.
  const water = of("water");
  union(g, water, 0, S * .32); g.fillStyle = "#cfe8e6"; g.fill();
  union(g, water, S * .07, S * .26); g.fillStyle = "#62abc9"; g.fill();
  union(g, water, S * .2, S * .2); g.fillStyle = "#559fc0"; g.fill();

  // Empty lots: a faint outline where a building could go.
  g.strokeStyle = "rgba(255,255,255,.2)"; g.lineWidth = 1;
  g.beginPath();
  for (let i = 0; i < N; i++) if (MAP[i] !== "water" && OWNER[i] < 0) rr(g, cellX(i) + S * .08 + .5, cellY(i) + S * .08 + .5, S * .84, S * .84, S * .14);
  g.stroke();

  // Trees, top row first so lower trees overlap the ones behind.
  for (const i of of("forest")) {
    const x = cellX(i), y = cellY(i);
    const spots = [[.3, .3, .21], [.72, .38, .19], [.44, .72, .22], [.84, .82, .13]];
    spots.forEach(([tx, ty, ts], k) => {
      if (k === 3 && hash(i, 9) < .5) return;
      tree(g, x + S * (tx + (hash(i, k) - .5) * .1), y + S * (ty + (hash(i, k + 20) - .5) * .1), S * ts, hash(i, k + 30));
    });
  }
  g.restore();
}

/* ───────────────────────── Buildings ───────────────────────── */

/* Each kind of building has one colour. Its tile is a pale top over a side in that colour, and its lot a soft wash of it. */
const CAT_HEX = { home: "#d8734a", agri: "#c9952a", industry: "#6f7d8b", shop: "#33968a", civic: "#5a7fc4", leisure: "#a8588f" };
const TILE = {}, LOT = {};
for (const cat in CAT_HEX) {
  TILE[cat] = [shade(CAT_HEX[cat], .77), shade(CAT_HEX[cat], .2)];
  LOT[cat] = [shade(CAT_HEX[cat], .25), shade(CAT_HEX[cat], .5)];
}
const GROUND = {
  garden: "#b3d494", tree: "#b3d494", flag: "#b3d494", well: "#b3d494", field: "#e6c463", pasture: "#bddb95",
  yard: "#e5d6b7", crates: "#e5d6b7", logs: "#e5d6b7", produce: "#e5d6b7", rocks: "#d2c9ba", shaft: "#cfc4b1",
  plank: "#bb8c5f", porch: "#c29568", rail: "#cdc2ad", play: "#ebdaa9",
  orchard: "#b8d98f", vines: "#cbdc9e", wheel: "#cfc4b1", windmill: "#b3d494", kiln: "#d2c9ba", sluice: "#cbbfa9",
  deck: "#c69a6b", hay: "#e5d6b7", plaza: "#e3dac7", graves: "#b3d494", pool: "#e3dac7", track: "#bddb95", tent: "#eadcb5",
  woodpile: "#c2d69b", veg: "#b99470", hedge: "#b3d494", laundry: "#e5d6b7", coop: "#dccfa4", fire: "#d2c9ba", hides: "#e5d6b7",
  anvil: "#cbc3b6", cart: "#cfc4b1", bricks: "#e5d6b7", bread: "#e9dcc0", fish: "#dfe6e3", furs: "#e5d6b7", hitch: "#e5d6b7",
  pen: "#cdc8bf", paddock: "#bddb95", tollgate: "#d8cdb5", sacks: "#e5d6b7", derrick: "#cfc4b1", bales: "#e9e2d0", barrels: "#d8c9a8", tank: "#cfc8ba", hosecart: "#d9cdb8",
};
let BAKING = false;  // art is being drawn onto the baked board, so chimneys should smoke
let NOW = 0;         // seconds, for the parts of buildings that move

/*
  Parts of buildings that move: sails, wheels, fires, hens, ripples, birds. The baked board leaves them out
  and lists them in LIVE, so they are drawn fresh every frame. A building drawn outside the bake, like the one
  in hand, draws them straight away. `a` sets each one apart, so neighbours don't move in step; `r` is a size.
*/
const LIVE = [];
function alive(g, kind, x, y, a = 0, r = 0) { if (BAKING) LIVE.push([kind, x, y, a, r]); else live(g, kind, x, y, a, r); }

function sparks(g, x, y, t, n) {
  const S = UI.S;
  for (let k = 0; k < n; k++) {
    const p = (t * .8 + k / n) % 1;
    if (p > .6) continue;
    circle(g, x + Math.sin(k * 2.3 + Math.floor(t * .8 + k / n)) * S * .1 * p, y - p * S * .32, S * .018, `rgba(255,${200 - p * 150 | 0},90,${1 - p / .6})`);
  }
}

function live(g, kind, x, y, a, r) {
  const S = UI.S, t = NOW + a * 10;
  if (kind === "sails") {
    // A slow drift in the breeze, and every few seconds a gust spins the sails round one and a half turns.
    const gust = 9, k = Math.floor(t / gust), u = Math.max(0, (t / gust - k - .4) / .6), ease = u * u * (3 - 2 * u);
    g.save(); g.translate(x, y); g.rotate((k + ease) * Math.PI * 3 + t * .12);
    for (let k = 0; k < 4; k++) {
      g.rotate(Math.PI / 2);
      g.fillStyle = "#8a6444"; g.fillRect(-S * .02, 0, S * .04, S * .4);
      g.fillStyle = "#f7f2e6"; g.fillRect(S * .02, S * .12, S * .08, S * .26);
    }
    g.restore();
    circle(g, x, y, S * .045, "#5b4a3c");
  } else if (kind === "wheel") {
    g.strokeStyle = "#7a5634"; g.lineWidth = Math.max(1.5, S * .05);
    g.beginPath(); g.arc(x, y, S * .26, 0, Math.PI * 2); g.stroke();
    g.lineWidth = Math.max(1, S * .03); g.beginPath();
    for (let k = 0; k < 4; k++) {
      const b = t * .7 + k * Math.PI / 4;
      g.moveTo(x - Math.cos(b) * S * .26, y - Math.sin(b) * S * .26); g.lineTo(x + Math.cos(b) * S * .26, y + Math.sin(b) * S * .26);
    }
    g.stroke();
  } else if (kind === "saw") {
    g.save(); g.translate(x, y); g.rotate(t * 1.5);
    g.beginPath();
    for (let k = 0; k < 24; k++) { const rad = k % 2 ? S * .12 : S * .155, b = k * Math.PI / 12; g.lineTo(Math.cos(b) * rad, Math.sin(b) * rad); }
    g.closePath(); g.fillStyle = "#d9dee2"; g.fill();
    g.fillStyle = "#b8c0c6"; g.beginPath(); g.moveTo(0, 0); g.arc(0, 0, S * .11, 0, Math.PI / 2); g.closePath(); g.fill();
    g.restore();
    circle(g, x, y, S * .06, "#9aa3aa"); circle(g, x, y, S * .025, "#4d535b");
  } else if (kind === "coals" || kind === "flame") {
    // Coals glow and fade; a campfire flickers more and throws sparks more often.
    const f = kind === "flame" ? 1 : .5, glow = .5 + .5 * Math.sin(t * 5) * Math.sin(t * 3.3 + 1);
    circle(g, x, y, r, `rgb(${224 + glow * 20 | 0},${100 + glow * 40 | 0},50)`);
    circle(g, x - r * .1, y - r * .1, r * (.45 + .15 * glow * f), "#ffd45c");
    sparks(g, x, y, t, kind === "flame" ? 3 : 2);
  } else if (kind === "glow") {
    const glow = .5 + .5 * Math.sin(t * 4) * Math.sin(t * 2.7);
    circle(g, x, y, r * (1.6 + glow * .6), `rgba(255,150,60,${.12 + glow * .15})`);
    circle(g, x, y, r, `rgb(240,${120 + glow * 60 | 0},58)`);
  } else if (kind === "hens") {
    for (const [hx, hy, k] of [[.3, .7, 0], [.6, .64, 1], [.72, .82, 2], [.76, .38, 3]]) {
      const w = Math.sin(t * .4 + k * 2), face = Math.cos(t * .4 + k * 2) >= 0 ? 1 : -1;
      const px = x + S * hx + w * S * .05, py = y + S * hy, peck = Math.sin(t * 3 + k * 1.7) > .75 ? S * .015 : 0;
      ellipse(g, px, py, S * .055, S * .04, "#fbf8f0");
      circle(g, px + face * (S * .045 + peck), py - S * .01 + peck * .5, S * .02, "#d65a45");
    }
  } else if (kind === "ripple") {
    // A ring spreads across still water now and then.
    const p = (t * .35) % 1;
    g.strokeStyle = `rgba(255,255,255,${.55 * (1 - p)})`; g.lineWidth = Math.max(1, S * .02);
    g.beginPath(); g.arc(x, y, r * (.15 + .85 * p), 0, Math.PI * 2); g.stroke();
  } else if (kind === "flag") {
    g.fillStyle = "#d65a45"; g.beginPath(); g.moveTo(x, y);
    for (let k = 0; k <= 4; k++) g.lineTo(x + S * .05 * k, y + Math.sin(t * 5 - k) * S * .015 * k / 4);
    for (let k = 4; k >= 0; k--) g.lineTo(x + S * .05 * k, y + S * .1 + Math.sin(t * 5 - k) * S * .015 * k / 4);
    g.closePath(); g.fill();
    g.fillStyle = "#f7f2e6"; g.fillRect(x, y, S * .07, S * .05);
  } else if (kind === "train" || kind === "wagon") {
    // A train pulls in, waits and pulls out, then the next comes the other way. A wagon just drives across.
    const train = kind === "train", cycle = train ? 16 : 11, T = ((t % (cycle * 2)) + cycle * 2) % (cycle * 2);
    const back = T >= cycle, u = back ? T - cycle : T;
    const span = r.n * S, cars = train ? (r.freight ? 2 : 4) : 0, len = train ? S * .8 + cars * S * (r.freight ? .8 : .85) : S * .85;
    const stop = span / 2 + len / 2, end = span + len;
    let head, moving = true;
    if (!train) { if (u > 6) return; head = end * u / 6; }
    else if (u < 3.5) head = stop * (1 - (1 - u / 3.5) ** 2);
    else if (u < 10) { head = stop; moving = false; }
    else if (u < 13.5) head = stop + (end - stop) * ((u - 10) / 3.5) ** 2;
    else return;
    const dir = r.horiz ? [1, 0] : [0, 1], sgn = back ? -1 : 1;
    const ox = r.x - dir[0] * S / 2 + (back ? dir[0] * span : 0), oy = r.y - dir[1] * S / 2 + (back ? dir[1] * span : 0);
    g.save();
    g.beginPath(); for (const c of r.clips) g.rect(...c); g.clip();
    g.translate(ox, oy); g.rotate(Math.atan2(dir[1] * sgn, dir[0] * sgn));
    if (train) {
      engine(g, head, S);
      for (let k = 0; k < cars; k++) {
        const at = head - S * .85 - k * S * (r.freight ? .8 : .85);
        if (r.freight) car(g, at, S, S * .75, k % 2 ? "#7d6a56" : "#a8503a", "rgba(255,240,220,.25)");
        else car(g, at, S, S * .8, "#3f6f5a", "#e9dcc4");
      }
    } else wagon(g, head, S);
    g.restore();
    // Steam from the stack, but only where the engine can be seen.
    if (train && Math.random() < (moving ? .05 : .008)) {
      const along = head - S * .16, sx = ox + dir[0] * sgn * along, sy = oy + dir[1] * sgn * along;
      if (r.clips.some(([cx, cy, cw, ch]) => sx >= cx && sx <= cx + cw && sy >= cy && sy <= cy + ch)) FX.puffs.push({ x: sx, y: sy, t: 0, dark: false, drift: .5 + Math.random() * .5 });
    }
  } else if (kind === "race") {
    // Three horses race two laps and finish together at the line, with the lead changing on the way; then they rest.
    const cycle = 18, T = ((t % cycle) + cycle) % cycle, race = Math.floor(t / cycle), u = Math.min(1, T / 11);
    const ease = u < .5 ? 2 * u * u : 1 - 2 * (1 - u) ** 2;
    [["#d65a45", "#6e4a33"], ["#3f79b5", "#b4875a"], ["#e3a92f", "#4a382d"]].forEach(([silk, coat], i) => {
      const lane = (i - 1) * S * .1, rx = r.rx + lane, ry = r.ry + lane;
      const lead = (hash(race, i + a) - .5) * .2 * Math.sin(Math.PI * u) ** 2;
      const th = -(ease + lead) * Math.PI * 4;
      const hx = x + rx * Math.cos(th), hy = y + ry * Math.sin(th), head = Math.atan2(-ry * Math.cos(th), rx * Math.sin(th));
      if (u < 1) circle(g, hx - Math.cos(head) * S * .16, hy - Math.sin(head) * S * .16, S * .05, "rgba(240,225,190,.5)");
      horse(g, hx, hy, head, coat, .75);
      circle(g, hx + Math.cos(head) * S * .02, hy + Math.sin(head) * S * .02, S * .035, silk);
    });
  } else if (kind === "sluice") {
    // Water streaks and flecks of gold wash down the trough. Every square of it runs the same way at the same
    // time, so a fleck that leaves one square turns up in the next. `a` is 1 when the trough lies flat.
    const along = (u, v) => a ? [x + S * u, y + S / 2 + S * v] : [x + S / 2 + S * v, y + S * u];
    g.strokeStyle = "rgba(255,255,255,.55)"; g.lineWidth = Math.max(1, S * .015); g.beginPath();
    for (let k = 0; k < 3; k++) {
      const p = (NOW * .9 + k / 3) % 1, [x1, y1] = along(p, (k - 1) * .04), [x2, y2] = along(Math.min(1, p + .1), (k - 1) * .04);
      g.moveTo(x1, y1); g.lineTo(x2, y2);
    }
    g.stroke();
    for (let k = 0; k < 4; k++) {
      const p = (NOW * .3 + k / 4 + hash(k, 3) * .15) % 1, [fx, fy] = along(p, (hash(k, 4) - .5) * .08);
      circle(g, fx, fy, S * .032, "#d9a82e");
      circle(g, fx - S * .008, fy - S * .008, S * (.016 + .008 * Math.sin(NOW * 7 + k * 2)), "#fff0a8");
    }
  } else if (kind === "mine") {
    // A headframe winds a cart of ore up out of the shaft and down its track. It tips the ore out at the end,
    // rolls back up empty and drops out of sight, then the next load comes up. Dust drifts from the shaft.
    for (let k = 0; k < 4; k++) {
      const p = (t * .35 + k / 4) % 1, ang = -Math.PI / 2 + (hash(k, Math.floor(t * .35 + k / 4)) - .5) * 1.6;
      circle(g, x + Math.cos(ang) * S * .2 * p, y + S * .05 + Math.sin(ang) * S * .2 * p, S * (.03 + .06 * p), `rgba(214,198,170,${.55 * (1 - p)})`);
    }
    const T = ((t % 8) + 8) % 8, ease = (v) => v * v * (3 - 2 * v);
    const top = y + S * .06, bottom = y + S * .4;
    let at = top, seen = 1, full = true;
    if (T < 1) { seen = T; }                                           // rising out of the shaft
    else if (T < 3) at = top + (bottom - top) * ease((T - 1) / 2);      // down the track, loaded
    else if (T < 3.8) { at = bottom; full = T < 3.2; }  // tips the ore out
    else if (T < 5.8) { at = bottom - (bottom - top) * ease((T - 3.8) / 2); full = false; }
    else if (T < 6.6) { seen = 1 - (T - 5.8) / .8; full = false; }      // down into the dark
    else seen = 0;
    if (T >= 3.1 && T < 4.2) {
      // The load spills off the end of the track and settles.
      const q = (T - 3.1) / 1.1;
      for (let k = 0; k < 3; k++) circle(g, x + (k - 1) * S * .07, bottom + S * (.08 + .1 * q) - Math.sin(q * Math.PI) * S * .06 * (k % 2 + 1), S * .028,
                                         `rgba(170,163,150,${1 - q * .6})`);
    }
    if (seen > 0) {
      const w = S * .2, h = S * .15;
      g.save(); g.globalAlpha = seen;
      g.strokeStyle = "#3d3a36"; g.lineWidth = Math.max(1, S * .012);
      g.beginPath(); g.moveTo(x, y - S * .2); g.lineTo(x, at - h / 2); g.stroke();
      g.fillStyle = "rgba(40,30,20,.25)"; g.fillRect(x - w / 2 + S * .02, at - h / 2 + S * .03, w, h);
      g.fillStyle = "#5c4028"; g.fillRect(x - w / 2, at - h / 2, w, h);
      g.fillStyle = "#7a5a3c"; g.fillRect(x - w / 2, at - h / 2, w, h * .25);
      if (full) {
        circle(g, x - w * .22, at - h * .15, w * .2, "#958d82"); circle(g, x + w * .2, at - h * .1, w * .18, "#aaa396");
        circle(g, x + w * .02, at - h * .35, w * .13, "#f2cf63");
      }
      g.restore();
    }
    // The headframe over the shaft: two legs and a wheel that turns while the cart moves.
    const hx = x, hy = y - S * .2, spin = (at - top) / S * 14;   // the cable winds as the cart travels
    g.strokeStyle = "#6c4f35"; g.lineWidth = Math.max(1.2, S * .03); g.lineCap = "round";
    g.beginPath(); g.moveTo(hx - S * .13, y + S * .02); g.lineTo(hx, hy); g.lineTo(hx + S * .13, y + S * .02); g.stroke();
    g.strokeStyle = "#3d3a36"; g.lineWidth = Math.max(1, S * .02);
    g.beginPath(); g.arc(hx, hy, S * .07, 0, Math.PI * 2); g.stroke();
    g.beginPath();
    for (let k = 0; k < 3; k++) { const b = spin + k * Math.PI / 3; g.moveTo(hx - Math.cos(b) * S * .07, hy - Math.sin(b) * S * .07); g.lineTo(hx + Math.cos(b) * S * .07, hy + Math.sin(b) * S * .07); }
    g.stroke();
  } else if (kind === "mosey") {
    // A horse wanders its paddock: a slow walk to the next spot, then a while grazing there. `r` picks the coat.
    const spots = [[.32, .66], [.72, .7], [.7, .42], [.46, .6]], leg = 5.5, T = ((t % (leg * 4)) + leg * 4) % (leg * 4);
    const n = Math.floor(T / leg), u = Math.min(1, (T - n * leg) / 3), ease = u * u * (3 - 2 * u);
    const [ax, ay] = spots[n], [bx, by] = spots[(n + 1) % 4];

/*
  A way through a building that things travel along: the track of a station or freight yard, or the deck of a
  bridge. The way runs the length of the building. Travellers only show on the squares of that role, so they
  slip under a station hall or a covered bridge's roof.
*/
function route(d, cells, role, dy) {
  const S = UI.S, on = cells.filter((c, k) => d.roles[k] === role);
  const horiz = on.every(c => rowOf(c) === rowOf(on[0]));
  const at = (c) => horiz ? colOf(c) : rowOf(c);
  const sorted = on.slice().sort((a, b) => at(a) - at(b)), first = sorted[0], last = sorted[sorted.length - 1];
  const clips = [], ins = S * .09;
  let start = first;
  sorted.forEach((c, k) => {
    const next = sorted[k + 1];
    if (next !== undefined && at(next) === at(c) + 1) return;
    const n = at(c) - at(start) + 1;
    clips.push([cellX(start) + ins, cellY(start) + dy + ins, (horiz ? n : 1) * S - ins * 2, (horiz ? 1 : n) * S - ins * 2]);
    start = next;
  });
  return { horiz, n: at(last) - at(first) + 1, x: cellX(first) + S / 2, y: cellY(first) + dy + S / 2, clips };
}

/* A little steam engine, a wagon and its horse, and the cars a train pulls. All point along +x, front at x. */
function engine(g, x, S) {

  g.fillStyle = "#8f4b36"; g.beginPath(); g.moveTo(x - S * .08, -S * .15); g.lineTo(x, 0); g.lineTo(x - S * .08, S * .15); g.closePath(); g.fill();
  g.beginPath(); rr(g, x0 + S * .26, -S * .14, S * .48, S * .28, S * .13); g.fillStyle = "#3d4148"; g.fill();
  g.fillStyle = "#c9a13b"; g.fillRect(x0 + S * .48, -S * .14, S * .035, S * .28);

  g.fillStyle = "#c26a4f"; g.fillRect(x0 + S * .04, -S * .18, S * .22, S * .1);

/* Draws a building's art on top of its tile. `dy` is how far the top of the tile is raised. */
function art(g, type, cells, dy, baking) {
  const d = DEF[type], S = UI.S, ins = S * .075;
  BAKING = !!baking;
  const roleOf = new Map(cells.map((c, k) => [c, d.roles[k]]));
  const xs = cells.map(colOf), ys = cells.map(rowOf);
  const horiz = Math.max(...xs) - Math.min(...xs) >= Math.max(...ys) - Math.min(...ys);

  const roles = [...new Set(d.roles)];
  for (const role of roles) {
    if (ROOFS.has(role)) continue;
    const group = cells.filter(c => roleOf.get(c) === role);
    union(g, group, ins + S * .045, S * .1, dy); g.fillStyle = GROUND[role]; g.fill();
    if (role === "field" || role === "plank") {
      g.save(); union(g, group, ins + S * .045, S * .1, dy); g.clip();
      g.strokeStyle = role === "field" ? "#cfa546" : "#9c704a"; g.lineWidth = Math.max(1, S * (role === "field" ? .05 : .025));
      g.beginPath();
      const step = S * (role === "field" ? .16 : .12), flat = role === "field" ? horiz : !horiz;
      for (const c of group) {
        const x = cellX(c), y = cellY(c) + dy;
        if (flat) for (let t = y + step / 2; t < y + S; t += step) { g.moveTo(x, t); g.lineTo(x + S, t); }
        else for (let t = x + step / 2; t < x + S; t += step) { g.moveTo(t, y); g.lineTo(t, y + S); }
      }
      g.stroke();
      g.restore();
    }
    const box = () => {
      const gx = group.map(colOf), gy = group.map(rowOf), x0 = Math.min(...gx), y0 = Math.min(...gy);
      const w = (Math.max(...gx) - x0 + 1) * S, h = (Math.max(...gy) - y0 + 1) * S;
      return [UI.BX + x0 * S + w / 2, UI.BY + y0 * S + dy + h / 2, w, h];
    };
    if (role === "plaza") {
      g.save(); union(g, group, ins + S * .045, S * .1, dy); g.clip();
      g.strokeStyle = "rgba(120,100,70,.18)"; g.lineWidth = 1; g.beginPath();
      for (const c of group) for (let k = 1; k < 3; k++) {
        const x = cellX(c), y = cellY(c) + dy;
        g.moveTo(x + S * k / 3, y); g.lineTo(x + S * k / 3, y + S); g.moveTo(x, y + S * k / 3); g.lineTo(x + S, y + S * k / 3);
      }
      g.stroke(); g.restore();
      const [px, py] = box();
      circle(g, px + S * .03, py + S * .05, S * .36, "rgba(40,30,20,.18)");
      circle(g, px, py, S * .36, "#cfc5b0"); circle(g, px, py, S * .28, "#7cc3d8");
      alive(g, "ripple", px, py, hash(px, py), S * .27);
      // Benches face the fountain on four sides, with a lamp post on each corner between them.
      for (let k = 0; k < 4; k++) {
        const a = k * Math.PI / 2, bx = px + Math.cos(a) * S * .6, by = py + Math.sin(a) * S * .6;
        g.save(); g.translate(bx, by); g.rotate(a + Math.PI / 2);
        g.fillStyle = "rgba(40,30,20,.2)"; g.fillRect(-S * .15 + S * .02, -S * .04 + S * .04, S * .3, S * .1);
        g.fillStyle = "#8a6040"; g.fillRect(-S * .15, -S * .05, S * .3, S * .1);
        g.fillStyle = "#b4875a"; g.fillRect(-S * .15, -S * .05, S * .3, S * .03); g.fillRect(-S * .15, -S * .005, S * .3, S * .03);
        g.fillStyle = "#3d4148"; g.fillRect(-S * .17, -S * .06, S * .03, S * .12); g.fillRect(S * .14, -S * .06, S * .03, S * .12);
        g.fillRect(-S * .15, S * .045, S * .3, S * .02);
        g.restore();
        const la = a + Math.PI / 4, lx = px + Math.cos(la) * S * .66, ly = py + Math.sin(la) * S * .66;
        circle(g, lx + S * .03, ly + S * .04, S * .05, "rgba(40,30,20,.2)");
        circle(g, lx, ly, S * .1, "rgba(255,226,150,.22)");
        circle(g, lx, ly, S * .045, "#3d4148"); circle(g, lx, ly, S * .025, "#ffe9a8");
      }
      circle(g, px, py, S * .1, "#e9e2d0"); circle(g, px - S * .08, py - S * .09, S * .05, "rgba(255,255,255,.6)");
    }

      const [px, py, w, h] = box();
      g.strokeStyle = "#caa46c"; g.lineWidth = S * .3;
      g.beginPath(); g.ellipse(px, py, w / 2 - S * .32, h / 2 - S * .32, 0, 0, Math.PI * 2); g.stroke();
      g.strokeStyle = "#f7f2e6"; g.lineWidth = Math.max(1, S * .025);
      g.beginPath(); g.ellipse(px, py, w / 2 - S * .16, h / 2 - S * .16, 0, 0, Math.PI * 2); g.stroke();
      const fx = px + w / 2 - S * .32;
      for (let k = 0; k < 6; k++) { g.fillStyle = k % 2 ? "#3d4148" : "#f7f2e6"; g.fillRect(fx - S * .15 + k * S * .05, py - S * .02, S * .05, S * .04); }
      circle(g, fx + S * .19, py, S * .03, "#d65a45");
      alive(g, "race", px, py, hash(px, py), { rx: w / 2 - S * .32, ry: h / 2 - S * .32 });
    }
    if (role === "pasture") {
      // A fence: a darker ring, then the grass again just inside it.
      union(g, group, ins + S * .075, S * .08, dy); g.fillStyle = "#9d7b56"; g.fill();
      union(g, group, ins + S * .1, S * .07, dy); g.fillStyle = GROUND.pasture; g.fill();
    }
    for (const c of group) groundDetail(g, role, c, cellX(c), cellY(c) + dy, S, horiz);
  }

  // Roofs: squares with the same role that make a rectangle share one roof.
  const done = new Set(), pad = ins + S * .06;
  let sign = null;   // the biggest roof, where the emblem goes
  for (const c of cells) {
    const role = roleOf.get(c);
    if (!ROOFS.has(role) || done.has(c)) continue;
    const group = [c], queue = [c];
    done.add(c);
