<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spartan Brawl</title>
<meta name="description" content="A retro Halo-style platform brawler. Rifles, energy swords, grenades and jetpacks, against CPUs or online with friends.">
<meta name="theme-color" content="#121725">
<meta name="apple-mobile-web-app-title" content="Spartan Brawl">

<link rel="apple-touch-icon" href="spartan-brawl-icon-180.png">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Spartan Brawl">
<meta property="og:title" content="Spartan Brawl">
<meta property="og:description" content="A retro Halo-style platform brawler. Play against CPUs, or online with up to three friends.">
<meta property="og:url" content="https://zachmo.github.io/personal_projects/spartan-brawl/spartan-brawl.html">

<style>
  :root {
    color-scheme: dark;
    --bg: #07090f; --panel: #121725; --panel-2: #1a2133; --line: #2c3550;
    --ink: #eef1f8; --dim: #8b94ad; --accent: #f0a830; --bad: #ff6a5a;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); overflow: hidden;
    font: 14px/1.45 ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
  #wrap { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  #game { image-rendering: pixelated; image-rendering: crisp-edges; background: #000; display: block; }
  .screen { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    background: rgba(4,6,12,.84); padding: 16px; overflow: auto; }
  .screen.clear { background: rgba(4,6,12,.55); }
  .hidden { display: none !important; }
  .box { background: var(--panel); border: 3px solid var(--line); box-shadow: 0 0 0 3px #000, 8px 8px 0 3px #000;
    padding: 22px; width: min(720px, 100%); margin: auto; }
  h1 { margin: 0; font-size: 34px; letter-spacing: .08em; color: var(--accent);
    text-shadow: 3px 3px 0 #6a3a08, 6px 6px 0 #000; }
  h2 { margin: 0 0 12px; font-size: 26px; letter-spacing: .06em; text-shadow: 3px 3px 0 #000; }
  .sub { margin: 6px 0 18px; color: var(--dim); }
  .row { display: flex; align-items: center; gap: 12px; margin: 10px 0; flex-wrap: wrap; }
  .row > label { width: 70px; color: var(--dim); text-transform: uppercase; font-size: 12px; letter-spacing: .1em; }
  .seg { display: flex; flex-wrap: wrap; gap: 6px; }
  button { font: inherit; color: var(--ink); background: var(--panel-2); border: 2px solid var(--line);
    padding: 6px 12px; cursor: pointer; box-shadow: 3px 3px 0 #000; }
  button:hover { border-color: var(--dim); }
  button:active { transform: translate(2px,2px); box-shadow: 1px 1px 0 #000; }
  body.padnav button:focus, body.padnav select:focus, body.padnav input:focus { outline: 3px solid #fff; outline-offset: 2px; }
  .seg button.on { background: var(--accent); color: #1a1000; border-color: #ffd27a; }
  .big { font-size: 18px; padding: 10px 22px; background: var(--accent); color: #1a1000; border-color: #ffd27a;
    text-transform: uppercase; letter-spacing: .1em; }
  .team { margin: 14px 0 4px; padding: 10px; border: 2px dashed var(--line); }
  .team-h { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 6px; color: var(--dim);
    text-transform: uppercase; font-size: 12px; letter-spacing: .1em; }
  .slot { display: flex; align-items: center; gap: 10px; padding: 6px 0; flex-wrap: wrap; }
  .slot canvas { width: 36px; height: 54px; image-rendering: pixelated; background: #0b0e18; border: 2px solid #000; }
  .slot .tag { width: 34px; font-weight: bold; }
  select { font: inherit; color: var(--ink); background: var(--panel-2); border: 2px solid var(--line); padding: 5px 8px; }
  .sw { display: flex; gap: 4px; flex-wrap: wrap; }
  .sw button { width: 22px; height: 22px; padding: 0; box-shadow: 2px 2px 0 #000; }
  .sw button.on { outline: 3px solid #fff; outline-offset: 1px; }
  .keys { margin-top: 16px; display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 10px; }
  .keys div { background: #0b0e18; border: 2px solid var(--line); padding: 10px; color: var(--dim); font-size: 12.5px; }
  .keys b { color: var(--ink); }
  kbd { display: inline-block; min-width: 18px; text-align: center; padding: 0 4px; margin: 1px 0;
    background: var(--panel-2); border: 1px solid var(--line); border-bottom-width: 2px; color: var(--ink); }
  .note { color: var(--dim); font-size: 12.5px; margin: 10px 0 0; }
  .howto { display: flex; flex-wrap: wrap; gap: 14px; align-items: flex-start; margin-top: 16px; }
  .ctl { display: flex; gap: 18px; padding: 10px; background: #0b0e18; border: 2px solid var(--line); }
  .keyrows > div { display: flex; justify-content: center; }
  .keyrows > div:first-child { justify-content: flex-start; padding-left: 26px; }
  .keyrows:first-child > div:first-child { justify-content: center; padding-left: 0; }
  .cap { display: inline-flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px;
    width: 46px; height: 46px; margin: 2px; background: var(--panel-2); border: 2px solid var(--line); border-bottom-width: 4px; }
  .cap b { font-size: 13px; line-height: 1; }
  .cap i { font-style: normal; color: var(--dim); font-size: 15px; line-height: 1; }
  .cap canvas { width: 32px; height: 24px; image-rendering: pixelated; }
  .cap.sm { width: 26px; height: 26px; font-size: 14px; margin: 1px; border-bottom-width: 3px; }
  .cap.sm.hold { border-bottom-color: var(--accent); }
  .cards { display: flex; flex-wrap: wrap; gap: 8px; flex: 1; min-width: 260px; }
  .padbox { flex-direction: column; gap: 6px; }
  .mappick { display: flex; align-items: center; gap: 8px; }
  .mapcard { display: flex; align-items: center; gap: 10px; min-width: 15em; padding: 4px 8px 4px 4px; background: #0b0e18; border: 2px solid var(--line); }
  .mapcard canvas { width: 96px; height: 54px; image-rendering: pixelated; border: 1px solid #000; }
  .mapcard span { line-height: 1.25; }
  .mapcard small { display: block; color: var(--dim); font-size: 11px; text-transform: uppercase; letter-spacing: .08em; }
  .padhead { display: flex; justify-content: space-between; align-items: center; color: var(--ink); }
  button.tiny { font-size: 11px; padding: 2px 8px; box-shadow: 2px 2px 0 #000; }
  #padCaps { display: flex; flex-wrap: wrap; }
  button.cap { padding: 0; color: var(--ink); font: inherit; box-shadow: none; cursor: pointer; }
  button.cap.wait { border-color: var(--accent); }
  #padNote { margin: 0; font-size: 11px; }
  .mcard { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 8px 6px; width: 92px;
    background: #0b0e18; border: 2px solid var(--line); }
  .mcard canvas { width: 64px; height: 52px; image-rendering: pixelated; }
  .mcard span.ml { font-size: 11px; color: var(--dim); text-transform: uppercase; letter-spacing: .08em; text-align: center; }
  .mcard .mk { display: flex; }
  .moves { display: grid; grid-template-columns: auto 1fr; gap: 2px 14px; margin: 12px 0 0; font-size: 12.5px; color: var(--dim); }
  .moves b { color: var(--ink); font-weight: normal; }
  #err { color: var(--bad); min-height: 1.4em; margin: 10px 0 0; }
  #err.ok { color: var(--dim); }
  input { font: inherit; font-size: 16px; color: var(--ink); background: #0b0e18; border: 2px solid var(--line);
    padding: 6px 10px; width: 9em; text-transform: uppercase; letter-spacing: .1em; }
  input.codebox { width: 6em; }
  .tabs { margin: 16px 0 6px; }
  .code { font-size: 28px; letter-spacing: .25em; color: var(--accent); text-shadow: 3px 3px 0 #000; }
  .slot .who { min-width: 9em; }
  .slot .who input { width: 7em; }
  .slot .you { color: var(--accent); }
  .actions { display: flex; gap: 12px; align-items: center; margin-top: 16px; flex-wrap: wrap; }
  table { border-collapse: collapse; width: 100%; margin: 8px 0 4px; }
  th, td { text-align: left; padding: 6px 8px; border-bottom: 2px solid var(--line); }
  th { color: var(--dim); font-weight: normal; text-transform: uppercase; font-size: 12px; letter-spacing: .1em; }
  td.n, th.n { text-align: right; }
  .chip { display: inline-block; width: 12px; height: 12px; margin-right: 8px; vertical-align: -1px; border: 1px solid #000; }
</style>
</head>
<body>
<div id="wrap"><canvas id="game"></canvas></div>

<div id="lobby" class="screen">
  <div class="box">
    <h1>SPARTAN BRAWL</h1>
    <div class="seg tabs" id="tabs"><button data-tab="local">On this computer</button><button data-tab="online">Online</button></div>
    <div id="netStart" class="hidden">
      <div class="row"><label for="nameIn">Name</label>
        <input id="nameIn" maxlength="6" autocomplete="off" spellcheck="false" placeholder="6 letters"></div>
      <div class="row"><label></label><button id="create" class="big">Create game</button></div>
      <div class="row"><label for="codeIn">Or join</label>
        <input id="codeIn" maxlength="4" autocomplete="off" spellcheck="false" placeholder="CODE" class="codebox">
        <button id="join">Join</button></div>
      <p class="note">The host's browser runs the match. Keep that tab open.</p>
    </div>
    <div id="room" class="hidden">
      <div class="row"><label>Code</label><span class="code" id="roomCode"></span>
        <button id="copyLink">Copy invite link</button><button id="leave">Leave</button></div>
    </div>
    <div id="settings">
      <div class="row"><label>Mode</label><div class="seg" data-key="mode">
        <button data-v="ffa">Free for all</button><button data-v="team">2 v 2</button>
        <button data-v="training" class="local-only">Training</button></div></div>
      <div class="row match-only"><label>Weapons</label><div class="seg" data-key="set">
        <button data-v="standard">Standard</button><button data-v="swords">Sword fight</button>
        <button data-v="shotty">Shotty snipers</button></div></div>
      <div class="row match-only"><label>Win by</label><div class="seg" data-key="rule">
        <button data-v="lives">5 lives</button><button data-v="timer">Most kills in 3:00</button></div></div>
      <div class="row"><label>CPUs</label><div class="seg" data-key="skill">
        <button data-v="recruit">Recruit</button><button data-v="normal">Normal</button>
        <button data-v="heroic">Heroic</button><button data-v="legendary">Legendary</button></div></div>
      <div class="row match-only"><label>Map</label><div class="mappick" id="mapPick">
        <button id="mapPrev" aria-label="Previous map">◀</button>
        <div class="mapcard"><canvas id="mapThumb" width="96" height="54"></canvas><span id="mapName"></span></div>
        <button id="mapNext" aria-label="Next map">▶</button></div></div>
    </div>
    <div id="slots"></div>
    <div class="howto">
      <div class="ctl">
        <div class="keyrows" aria-label="Move with W A S D">
          <div><span class="cap"><b>W</b><i>↑</i></span></div>
          <div><span class="cap"><b>A</b><i>←</i></span><span class="cap"><b>S</b><i>↓</i></span><span class="cap"><b>D</b><i>→</i></span></div>
        </div>
        <div class="keyrows">
          <div><span class="cap" title="Grenade" aria-label="U: grenade"><b>U</b><canvas data-icon="nade" width="16" height="12"></canvas></span></div>
          <div><span class="cap" title="Shoot" aria-label="J: shoot"><b>J</b><canvas data-icon="gun" width="16" height="12"></canvas></span><span
            class="cap" title="Melee" aria-label="K: melee"><b>K</b><canvas data-icon="fist" width="16" height="12"></canvas></span><span
            class="cap" title="Shield" aria-label="L: shield"><b>L</b><canvas data-icon="shield" width="16" height="12"></canvas></span></div>
        </div>
      </div>
      <div class="ctl padbox" id="padBox">
        <div class="padhead"><b id="padTitle">Controller</b><button id="padReset" class="tiny hidden">Reset</button></div>
        <div id="padCaps"></div>
        <p class="note" id="padNote">Click an action, then press a button.</p>
      </div>
      <div class="cards" id="moveCards"></div>
    </div>
    <p id="err"></p>
    <div class="actions"><button id="start" class="big">Start</button><button id="full">Fullscreen</button><button id="musicBtn"></button></div>
  </div>
</div>

<div id="pause" class="screen clear hidden">
  <div class="box" style="width:min(360px,100%);text-align:center">
    <h2 id="pauseTitle">PAUSED</h2>
    <div class="actions" style="justify-content:center">
      <button id="resume" class="big">Resume</button><button id="quit">Quit to lobby</button></div>
    <p class="note" id="mutenote"></p>
  </div>
</div>

<div id="end" class="screen clear hidden">
  <div class="box" style="width:min(480px,100%)">
    <h2 id="endTitle"></h2>
    <table id="endTable"></table>
    <div class="actions"><button id="again" class="big">Rematch</button><button id="toLobby">Lobby</button>
      <span class="note" id="endNote">Enter: rematch · Esc: lobby</span></div>
  </div>
</div>

<script>
'use strict';
// ============================================================================
// Constants
// ============================================================================
const HUD_W = 480, HUD_H = 270, DT = 1 / 60;
// Movement. Low gravity and fast acceleration: big floaty jumps, but you stop and turn at once.
const GRAV = 0.21, MAXFALL = 5.2, RUN = 2.6, CRAWL = 1.0, ACC_G = 0.9, ACC_A = 0.5, AIR_DRAG = 0.2;
const JUMP = -6.0, JUMP2 = -5.4, SPIN_V = -8.4, SPIN_G = 0.30, SPIN_SPD = 4.6, SLIDE_V = 5.8;
const JET_FUEL = 48, JET_ACC = 0.6, JET_MAX = -3.2;
const PH = 18, PH_C = 11, HALF = 5;
const SHIELD_MAX = 50, MAG = 32, RESERVE = 128, RELOAD = 70, CHARGE = 40, LIVES = 5, MATCH_TIME = 180 * 60;
const MAXAMMO = { plasma: 100, sword: 100, shotgun: 6, sniper: 4 };
// Weapon sets. base: the weapon everyone carries and falls back to. drops: what the pads give, and how often.
const SETS = {
  standard: { name: 'Standard', base: 'rifle',
    drops: [['health', 22], ['ammo', 22], ['grenades', 16], ['shotgun', 16], ['sniper', 14], ['plasma', 14], ['sword', 12]] },
  swords: { name: 'Sword fight', base: 'sword', drops: [['health', 50], ['grenades', 50]] },
  shotty: { name: 'Shotty snipers', base: 'shotgun', drops: [['sniper', 35], ['ammo', 30], ['health', 25], ['grenades', 10]] },
};
// The carried weapon's magazine. The sword needs none: as a carried weapon it never runs out.
const BASES = { rifle: { mag: MAG, reserve: RESERVE, reload: RELOAD, label: 'AR' }, shotgun: { mag: 6, reserve: 18, reload: 80, label: 'SG' },
  sword: { mag: 0, reserve: 0, reload: 0, label: 'SW' } };
const NADES = 2, NADE_MAX = 4, NADE_FUSE = 90, NADE_R = 52; // frag grenades: carried, thrown, 1.5 s fuse

const COLORS = [
  { n: 'Red', c: '#d8423a' }, { n: 'Blue', c: '#3a72d8' }, { n: 'Olive', c: '#6f8f3a' },
  { n: 'Orange', c: '#e8862c' }, { n: 'Purple', c: '#8e52d8' }, { n: 'Pink', c: '#ea6aaa' },
  { n: 'Gold', c: '#d9b22e' }, { n: 'Cyan', c: '#36c4d4' }, { n: 'White', c: '#dcdce4' },
  { n: 'Steel', c: '#6e7a8c' },
];

// x, y is the top-left. A thin platform can be jumped through from below and dropped through.
const S_ = (x, y, w, h) => ({ x, y, w, h });
const T_ = (x, y, w) => ({ x, y, w, h: 5, thin: 1 });
const MAPS = [
  { id: 'canyon', name: 'Canyon', w: 1000, h: 620,
    plats: [S_(180, 500, 640, 56), S_(40, 440, 140, 116), S_(820, 440, 140, 116),
            T_(260, 436, 96), T_(644, 436, 96), T_(440, 380, 120), T_(96, 368, 96), T_(808, 368, 96),
            T_(300, 312, 96), T_(604, 312, 96), T_(452, 248, 96)],
    spawns: [[110, 440], [890, 440], [308, 436], [692, 436]],
    pickups: [[500, 380], [500, 248], [348, 312], [652, 312], [144, 368], [856, 368]] },
  // Small: two islands and a raised middle, joined, with two short tiers above. Made for close fights.
  { id: 'ring', name: 'Ring Station', small: true, w: 680, h: 480,
    plats: [S_(60, 360, 190, 30), S_(250, 340, 180, 26), S_(430, 360, 190, 30),
            T_(100, 290, 90), T_(490, 290, 90), T_(290, 268, 100), T_(190, 212, 80), T_(410, 212, 80)],
    spawns: [[120, 360], [560, 360], [145, 290], [535, 290]],
    pickups: [[340, 340], [340, 268], [230, 212], [450, 212], [145, 290], [535, 290]] },
  { id: 'frost', name: 'Frostbite', w: 1000, h: 640,
    plats: [S_(120, 540, 760, 60), S_(440, 470, 120, 70), S_(120, 430, 80, 110), S_(800, 430, 80, 110),
            T_(230, 476, 90), T_(680, 476, 90), T_(430, 408, 140), T_(250, 404, 100), T_(650, 404, 100),
            T_(96, 356, 104), T_(800, 356, 104), T_(320, 334, 110), T_(570, 334, 110), T_(450, 268, 100),
            T_(200, 282, 80), T_(720, 282, 80)],
    spawns: [[160, 430], [840, 430], [275, 476], [725, 476]],
    pickups: [[500, 470], [500, 268], [148, 356], [852, 356], [375, 334], [625, 334]] },
  { id: 'magma', name: 'Magma Forge', w: 1040, h: 640,
    plats: [S_(360, 500, 320, 60), S_(80, 460, 180, 100), S_(780, 460, 180, 100), S_(500, 440, 40, 60),
            T_(255, 480, 110), T_(675, 480, 110), T_(120, 390, 110), T_(810, 390, 110), T_(380, 380, 100),
            T_(560, 380, 100), T_(250, 320, 90), T_(700, 320, 90), T_(470, 260, 100)],
    spawns: [[150, 460], [890, 460], [420, 500], [620, 500]],
    pickups: [[520, 440], [520, 260], [175, 390], [865, 390], [430, 380], [610, 380]] },
  { id: 'lab', name: 'Deep Lab', w: 1000, h: 660,
    plats: [S_(70, 540, 310, 50), S_(620, 540, 310, 50), S_(380, 560, 240, 30), S_(420, 400, 160, 24),
            S_(120, 440, 60, 100), S_(820, 440, 60, 100),
            T_(220, 470, 110), T_(670, 470, 110), T_(320, 410, 80), T_(600, 410, 80), T_(150, 370, 100),
            T_(750, 370, 100), T_(300, 330, 100), T_(600, 330, 100), T_(450, 270, 100)],
    spawns: [[230, 540], [770, 540], [275, 470], [725, 470]],
    pickups: [[500, 560], [500, 400], [500, 270], [200, 370], [800, 370], [350, 330]] },
  // Small: one rooftop, two AC units for cover, a billboard ledge and a water tower.
  { id: 'roof', name: 'Rooftop', small: true, w: 600, h: 440,
    plats: [S_(60, 340, 480, 40), S_(150, 318, 40, 22), S_(410, 318, 40, 22),
            T_(250, 280, 100), T_(90, 252, 80), T_(430, 252, 80), T_(260, 200, 80)],
    spawns: [[110, 340], [490, 340], [130, 252], [470, 252]],
    pickups: [[300, 340], [300, 280], [300, 200], [130, 252], [470, 252]] },
  { id: 'training', name: 'Training', w: 1200, h: 600, training: true,
    plats: [S_(60, 480, 1080, 70), S_(640, 420, 30, 60), S_(60, 420, 120, 60),
            T_(220, 420, 90), T_(340, 360, 90), T_(460, 300, 90), T_(580, 240, 90),
            T_(760, 420, 120), T_(930, 360, 110)],
    spawns: [[300, 480]],
    dummies: [[860, 480], [1010, 480]],
    pickups: [[90, 420, 'shotgun'], [150, 420, 'sniper'], [265, 420, 'sword'], [385, 360, 'plasma'],
              [505, 300, 'ammo'], [625, 240, 'health'], [560, 480, 'grenades']] },
];
const DUMMY_MODES = ['stand', 'shield', 'jump', 'walk', 'fight'];

const ATK = {
  melee: { on: 3, off: 7, len: 16, cd: 16, reach: 15, dmg: 20, kbx: 6, kby: -3, stun: 16, knock: true },
  // Ten swings, each one able to send a foe off the map. Only the shield stops it.
  sword: { on: 4, off: 10, len: 24, cd: 10, reach: 24, dmg: 34, kbx: 8.5, kby: -5, stun: 26 },
};

// ============================================================================
// Simulation. Pure game state in, game state out. No drawing and no DOM, so the
// same code can run on a server when the game goes online.
// ============================================================================
// up is W: jump, or aim up while firing. jump is a controller's jump button. aimU is the stick pushed up: aim only.
const NO_INPUT = { left: false, right: false, up: false, down: false, fire: false, melee: false, shield: false, nade: false,
  jump: false, aimU: false };
const BITS_ALL = Object.keys(NO_INPUT);

function rnd(S) { // mulberry32, kept in the state so a server and a client roll the same numbers
  let t = (S.seed = (S.seed + 0x6D2B79F5) | 0);
  t = Math.imul(t ^ (t >>> 15), t | 1);
  t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
  return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
}
function ev(S, type, d) { S.events.push(Object.assign({ type }, d)); }
function teams(S) { return S.mode !== 'ffa'; }
function isFoe(S, a, b) { return a !== b && !(teams(S) && a.team === b.team); }
function sideOf(S, p) { return teams(S) ? 't' + p.team : 'p' + p.id; }
function height(p) { return p.kd > 0 && p.onGround ? 8 : p.crouch || p.slide > 0 ? PH_C : PH; }
function wtype(p) { return p.wpn ? p.wpn.type : p.base || 'rifle'; }
function approach(v, t, a) { return v < t ? Math.min(t, v + a) : Math.max(t, v - a); }

function newGame(cfg) {
  const training = cfg.mode === 'training';
  const def = training ? MAPS.find(m => m.training)
    : cfg.map === 'random' ? (arenas => arenas[Math.floor(Math.random() * arenas.length)])(
        MAPS.filter(m => !m.training && (cfg.set !== 'swords' || m.small))) // a sword fight wants a small map
    : MAPS.find(m => m.id === cfg.map);
  const S = {
    phase: training ? 'play' : 'countdown', count: 180, tick: 0, seed: (Math.random() * 2 ** 31) | 0,
    mode: cfg.mode, rule: training ? 'training' : cfg.rule, skill: cfg.skill || 'normal', set: training ? 'standard' : cfg.set || 'standard', time: MATCH_TIME, sudden: false, winner: null,
    map: def, players: [], bullets: [], nades: [], events: [], feed: [], dummyMode: 'stand',
    pickups: def.pickups.map(([x, y, fixed], i) => ({ x, y, fixed, type: null, ammo: 0, timer: fixed ? 1 : 240 + i * 50 })),
  };
  const add = (props, sp) => {
    const p = Object.assign({ id: S.players.length, base: SETS[S.set].base, lives: LIVES, kills: 0, deaths: 0, out: false, prev: NO_INPUT }, props);
    resetBody(p, sp[0], sp[1]);
    S.players.push(p);
  };
  if (training) {
    const sl = cfg.slots[0];
    add({ slot: 0, team: 0, color: COLORS[sl.color].c, ctrl: sl.ctrl, name: 'P1' }, def.spawns[0]);
    def.dummies.forEach((d, i) => add({ slot: i + 1, team: 1, color: COLORS[i ? 8 : 9].c, ctrl: 'dummy',
      name: 'DUMMY' + (i + 1), home: d }, d));
    S.players.slice(1).forEach(p => (p.face = -1));
    return S;
  }
  cfg.slots.forEach((sl, i) => {
    if (sl.ctrl === 'off') return;
    const team = i < 2 ? 0 : 1;
    add({ slot: i, team, color: COLORS[cfg.mode === 'team' ? cfg.teamColors[team] : sl.color].c, ctrl: sl.ctrl, peer: sl.peer,
      name: sl.name || (sl.ctrl === 'cpu' ? 'CPU' + (i + 1) : 'P' + (i + 1)) }, def.spawns[cfg.mode === 'team' ? [0, 2, 1, 3][i] : i]);
  });
  return S;
}

function resetBody(p, x, y) {
  Object.assign(p, { x, y, vx: 0, vy: 0, hp: 100, shieldHp: SHIELD_MAX, stun: 0, inv: 0, atk: null,
    shielding: false, crouch: false, onGround: false, onThin: false, jumping: false, ff: false,
    spin: false, slide: 0, slideCd: 0, slideHit: [], jet: false, fuel: JET_FUEL,
    airJumps: 1, coyote: 0, jbuf: 0, drop: 0, cd: 0, dead: 0, lastHit: null, hurtT: -999, nades: NADES, nadeCd: 0,
    kd: 0, shieldDown: false, spun: false, aim: 0,
    downT: -99, dirT: -99, dirD: 0, jumpT: -99, swap: false, charge: 0,
    ar: { ammo: BASES[p.base || 'rifle'].mag, reserve: BASES[p.base || 'rifle'].reserve, reload: 0 }, wpn: null, face: x < 500 ? 1 : -1 });
}

function step(S, inputs) {
  S.events = [];
  if (S.phase === 'countdown') {
    S.tick++; // the clock runs through the countdown, so guests can lock onto it
    if (S.count % 60 === 0) ev(S, 'count', { n: S.count / 60 });
    if (--S.count <= 0) { S.phase = 'play'; ev(S, 'go', {}); }
    for (const p of S.players) p.prev = inputs[p.id] || NO_INPUT;
    return;
  }
  if (S.phase !== 'play') return;
  S.tick++;
  if (S.rule === 'timer' && !S.sudden && --S.time <= 0) { S.time = 0; endByTime(S); if (S.phase !== 'play') return; }
  for (const p of S.players) updatePlayer(S, p, inputs[p.id] || NO_INPUT);
  updateBullets(S);
  updateNades(S);
  updatePickups(S);
  checkWin(S);
}

function updatePlayer(S, p, inp) {
  const pr = p.prev; p.prev = inp;
  const press = k => inp[k] && !pr[k];
  if (p.out) return;
  if (p.dead > 0) { if (--p.dead === 0) respawn(S, p); return; }
  if (p.inv > 0) p.inv--;
  if (p.cd > 0) p.cd--;
  if (p.drop > 0) p.drop--;
  if (p.slideCd > 0) p.slideCd--;
  if (p.nadeCd > 0) p.nadeCd--;
  let stunned = p.stun > 0;
  if (stunned) { p.stun--; p.spin = false; p.slide = 0; }
  if (p.kd > 0) { // knocked down: lie there until the timer runs out. Mashing any key gets you up sooner.
    stunned = true;
    if (p.onGround && p.stun <= 0) {
      p.kd -= 1 + (BITS_ALL.some(press) ? 4 : 0);
      if (p.kd <= 0) { p.kd = 0; p.inv = Math.max(p.inv, 20); ev(S, 'getup', { x: p.x, y: p.y }); }
    }
  }
  // Holding fire turns W and S into aim up and aim down, instead of jump and crouch.
  const pressUp = (press('up') && !inp.fire) || press('jump'), pressDown = press('down') && !inp.fire;
  const jumpHeld = inp.up || inp.jump;
  p.aim = inp.fire && !stunned ? (inp.up || inp.aimU ? -1 : inp.down ? 1 : 0) : 0;
  if (S.rule === 'training') { // practice: health comes back and the rifle never runs dry
    if (S.tick - p.hurtT > 150) p.hp = 100;
    p.ar.reserve = BASES[p.base].reserve;
    p.nades = NADE_MAX;
  }
  const ar = p.ar;
  if (ar.reload > 0 && --ar.reload === 0) { const n = Math.min(BASES[p.base].mag - ar.ammo, ar.reserve); ar.ammo += n; ar.reserve -= n; }

  // Shield: works on the ground and in the air. It shrinks while held. When it runs out it switches
  // off and recharges, and it comes back once it is half full.
  if (p.shieldDown && p.shieldHp >= SHIELD_MAX / 2) p.shieldDown = false;
  if (inp.shield && !stunned && !p.atk && p.slide <= 0 && !p.shieldDown && (p.shielding ? p.shieldHp > 0 : p.shieldHp > 8)) {
    if (!p.shielding) ev(S, 'shieldup', { id: p.id });
    p.shielding = true; p.spin = false; p.jet = false;
    p.shieldHp -= 0.22;
    if (p.shieldHp <= 0) breakShield(S, p);
  } else {
    p.shielding = false;
    p.shieldHp = Math.min(SHIELD_MAX, p.shieldHp + (p.shieldDown ? 0.2 : 0.12));
  }

  // Double taps: forward, forward is a slide. Down, down drops through a thin platform.
  let dir = (inp.right ? 1 : 0) - (inp.left ? 1 : 0);
  for (const d of [-1, 1]) {
    if (!press(d < 0 ? 'left' : 'right')) continue;
    if (p.onGround && !stunned && !p.shielding && !p.slide && p.slideCd <= 0 && p.dirD === d && S.tick - p.dirT <= 15) {
      p.slide = 24; p.vx = d * SLIDE_V; p.face = d; p.slideHit = []; p.crouch = false;
      ev(S, 'slide', { x: p.x, y: p.y, id: p.id });
    }
    p.dirD = d; p.dirT = S.tick;
  }
  p.swap = pressDown;
  if (pressDown) {
    if (p.onGround && p.onThin && S.tick - p.downT <= 14) { p.drop = 12; p.onGround = false; p.coyote = 0; }
    p.downT = S.tick;
  }

  // Run, crouch and slide.
  p.crouch = !stunned && !p.shielding && !p.slide && inp.down && !inp.fire && p.onGround;
  if (stunned) dir = 0;
  if (dir && !p.slide && !(p.atk && p.atk.type === 'sword')) p.face = dir;
  if (stunned) p.vx *= p.onGround ? 0.88 : 0.985;
  else if (p.shielding) p.vx = approach(p.vx, dir * RUN * 0.6, p.onGround ? ACC_G : ACC_A);
  else if (p.slide > 0) {
    p.slide--;
    if (p.slide < 14) p.vx *= 0.93;
    if (!p.slide) p.slideCd = 16;
    for (const q of S.players) {
      if (!isFoe(S, p, q) || q.dead || q.out || p.slideHit.includes(q.id)) continue;
      if (Math.abs(q.x - p.x) < HALF * 2 + 2 && q.y > p.y - PH_C && q.y - height(q) < p.y) {
        p.slideHit.push(q.id);
        hit(S, q, p, { dmg: 10, kbx: p.face * 2, kby: -3.5, stun: 14, kind: 'slide', knock: true });
      }
    }
  } else if (p.atk && p.atk.type === 'sword' && p.atk.t < 16) p.vx *= 0.9;
  else {
    const max = p.crouch ? CRAWL : p.spin ? SPIN_SPD : RUN, tgt = dir * max;
    if (p.onGround) p.vx = approach(p.vx, tgt, ACC_G);
    else if (dir && Math.sign(p.vx) === dir && Math.abs(p.vx) > max) p.vx *= 0.985; // keep momentum from a slide or a hit
    else p.vx = approach(p.vx, tgt, dir ? ACC_A : AIR_DRAG);
  }

  // Jetpack: after the double jump, a fresh press of jump fires it. Hold to keep thrusting.
  if (!p.onGround && p.airJumps === 0 && !stunned && !p.shielding && p.fuel > 0 && jumpHeld && (p.jet || pressUp)) {
    if (!p.jet) ev(S, 'jet', { x: p.x, y: p.y, id: p.id });
    p.jet = true; p.fuel--; p.ff = false; p.spin = false; p.jumping = false;
    p.vy = Math.max(JET_MAX, p.vy - JET_ACC);
  } else p.jet = false;

  // Jump, double jump, spin jump, short hop, fast fall.
  if (p.onGround) { p.coyote = 6; p.airJumps = 1; p.fuel = JET_FUEL; p.spun = false; } else if (p.coyote > 0) p.coyote--;
  if (pressUp) p.jbuf = 6; else if (p.jbuf > 0) p.jbuf--;
  if (!stunned && p.jbuf > 0 && !p.jet) {
    if (p.coyote > 0) { p.coyote = 0; p.jumpT = S.tick; doJump(S, p, dir, false, false); }
    else if (pressUp) {
      // Jump, then a quick tap spins. The spin is a bonus: the double jump and the jetpack still follow.
      if (!p.spun && S.tick - p.jumpT <= 15) { p.spun = true; doJump(S, p, dir, true, true); }
      else if (p.airJumps > 0) { p.airJumps--; doJump(S, p, dir, false, true); }
    }
  }
  if (p.jumping && !jumpHeld && p.vy < -2.4) { p.vy = -2.4; p.jumping = false; }
  if (p.vy >= 0) p.jumping = false;
  if (!p.onGround && pressDown && p.vy > -1 && !stunned) p.ff = true;
  if (!p.jet) {
    const g = p.ff ? 0.5 : p.spin ? SPIN_G : GRAV, mf = p.ff ? 8 : p.spin ? 7 : MAXFALL;
    p.vy = Math.min(mf, p.vy + g);
  }

  // Attacks.
  const w = p.wpn, wt = wtype(p);
  if (p.atk) runAtk(S, p);
  else if (!stunned && !p.shielding) {
    if (press('melee') && p.cd <= 0) startAtk(S, p, 'melee');
    else if (wt === 'sword') { if (press('fire') && p.cd <= 0) startAtk(S, p, 'sword'); }
    else if (wt === 'rifle') {
      if (inp.fire && p.cd <= 0 && !ar.reload) {
        if (ar.ammo > 0) fireRifle(S, p);
        else if (press('fire')) ev(S, 'dry', { id: p.id });
      }
    } else if (wt === 'shotgun') {
      if (inp.fire && p.cd <= 0) {
        if (p.wpn || (ar.ammo > 0 && !ar.reload)) fireShotgun(S, p);
        else if (press('fire') && !ar.reload) ev(S, 'dry', { id: p.id });
      }
    }
    else if (wt === 'sniper') { if (press('fire') && p.cd <= 0) fireSniper(S, p); }
    else if (wt === 'plasma') {
      if (press('fire')) { if (p.cd <= 0) firePlasma(S, p, false); p.charge = 1; }
      else if (inp.fire && p.charge > 0) p.charge = Math.min(CHARGE + 20, p.charge + 1);
      else if (!inp.fire && p.charge > 0) { if (p.charge >= CHARGE && p.wpn) firePlasma(S, p, true); p.charge = 0; }
    }
  } else p.charge = 0;
  if (!stunned && !p.shielding && !p.atk && press('nade') && p.nades > 0 && p.nadeCd <= 0) throwNade(S, p);
  if (w && w.ammo <= 0 && !p.atk) { p.wpn = null; p.charge = 0; ev(S, 'empty', { x: p.x, y: p.y - 12, id: p.id }); }
  if (!p.wpn && ar.ammo === 0 && ar.reserve > 0 && !ar.reload) { ar.reload = BASES[p.base].reload; ev(S, 'reload', { id: p.id }); }

  const wasAir = !p.onGround;
  moveBody(S, p, height(p));
  if (p.onGround) { p.spin = false; p.jet = false; if (wasAir) ev(S, 'land', { x: p.x, y: p.y, vy: p.vy, id: p.id }); }
  else if (p.slide > 0) { p.slide = 0; p.slideCd = 16; }

  const M = S.map;
  if (p.y > M.h + 40 || p.y < -220 || p.x < -80 || p.x > M.w + 80) {
    const k = p.lastHit && S.tick - p.lastHit.tick < 360 ? S.players[p.lastHit.by] : null;
    die(S, p, k, 'fall');
  }
}

function doJump(S, p, dir, spin, air) {
  p.jbuf = 0; p.onGround = false; p.ff = false; p.crouch = false;
  if (p.slide > 0) { p.slide = 0; p.slideCd = 16; } // a slide jump keeps the slide's speed
  if (spin) {
    const d = dir || p.face;
    p.vy = SPIN_V; p.spin = true; p.jumping = false; p.face = d;
    p.vx = d * Math.max(SPIN_SPD, Math.sign(p.vx) === d ? Math.abs(p.vx) : 0);
    ev(S, 'spin', { x: p.x, y: p.y, id: p.id });
  } else {
    p.vy = air ? JUMP2 : JUMP; p.jumping = true; p.spin = false;
    ev(S, air ? 'jump2' : 'jump', { x: p.x, y: p.y, id: p.id });
  }
}

function moveBody(S, p, h) {
  const P = S.map.plats;
  p.x += p.vx;
  for (const s of P) {
    if (s.thin) continue;
    if (p.x + HALF > s.x && p.x - HALF < s.x + s.w && p.y > s.y && p.y - h < s.y + s.h) {
      const left = p.vx > 0 || (p.vx === 0 && p.x < s.x + s.w / 2);
      p.x = left ? s.x - HALF : s.x + s.w + HALF;
      p.vx = 0;
      if (p.slide) { p.slide = 0; p.slideCd = 16; }
    }
  }
  const py = p.y;
  p.y += p.vy;
  p.onGround = false; p.onThin = false;
  for (const s of P) {
    if (p.x + HALF <= s.x || p.x - HALF >= s.x + s.w) continue;
    if (s.thin) {
      if (p.vy >= 0 && p.drop <= 0 && py <= s.y && p.y >= s.y) { p.y = s.y; p.vy = 0; p.onGround = true; p.onThin = true; }
    } else if (p.y > s.y && p.y - h < s.y + s.h) {
      if (p.vy < 0 && py - h >= s.y + s.h - 0.01) { p.y = s.y + s.h + h; p.vy = 0; }
      else { p.y = s.y; p.vy = 0; p.onGround = true; }
    }
  }
  if (p.onGround) p.ff = false;
}

function startAtk(S, p, type) {
  p.atk = { type, t: 0, hit: [] };
  if (type === 'sword' && p.wpn) p.wpn.ammo -= 10; // a carried sword never runs out
  ev(S, type, { id: p.id });
}

function runAtk(S, p) {
  const a = p.atk, D = ATK[a.type];
  a.t++;
  if (a.type === 'sword' && a.t === 1) p.vx = p.onGround ? p.face * 4.2 : p.vx + p.face * 1.5;
  if (a.t >= D.on && a.t <= D.off) {
    const x1 = p.face > 0 ? p.x : p.x - HALF - D.reach, x2 = p.face > 0 ? p.x + HALF + D.reach : p.x;
    const y1 = p.y - height(p) - 4, y2 = p.y + 2;
    for (const q of S.players) {
      if (q === p || q.dead || q.out || a.hit.includes(q.id)) continue;
      if (q.x + HALF > x1 && q.x - HALF < x2 && q.y > y1 && q.y - height(q) < y2) {
        a.hit.push(q.id);
        const back = a.type === 'melee' && q.face === p.face && !q.shielding;
        const away = Math.sign(q.x - p.x) || p.face;
        hit(S, q, p, { dmg: back ? D.dmg * 2 : D.dmg, kbx: D.kbx * away, kby: D.kby, stun: D.stun, back, kind: a.type, knock: D.knock });
        if (!p.atk) return; // our swing was stopped by a block
      }
    }
  }
  if (a.t >= D.len) { p.atk = null; p.cd = D.cd; }
}

function gunY(p) { return p.y - (p.crouch || p.slide > 0 ? 6 : 12); }
// A shot leaves the muzzle at the aim angle: level, or 45 degrees up or down.
function shot(p, speed, spread, props) {
  const a = p.aim * Math.PI / 4 + spread, cx = Math.cos(a) * p.face, cy = Math.sin(a);
  return Object.assign({ x: p.x + cx * 6, y: gunY(p) + cy * 6, vx: cx * speed, vy: cy * speed, o: p.id, team: p.team }, props);
}
function fireRifle(S, p) {
  p.ar.ammo--; p.cd = 5;
  S.bullets.push(shot(p, 7.5, (rnd(S) - 0.5) * 0.09, { dmg: 10, kbx: 1.2, kby: -0.4, stun: 0, life: 60, k: 'ar' }));
  ev(S, 'ar', { id: p.id });
}
function fireShotgun(S, p) {
  if (p.wpn) p.wpn.ammo--; else p.ar.ammo--;
  p.cd = 42;
  for (let i = 0; i < 6; i++) {
    S.bullets.push(shot(p, 6.5 + rnd(S), (i - 2.5) * 0.045 + (rnd(S) - 0.5) * 0.03,
      { dmg: 24, kbx: 2.2, kby: -1.6, stun: 10, life: 15, life0: 15, k: 'sg' }));
  }
  p.vx -= p.face * (p.onGround ? 1.5 : 2.5);
  ev(S, 'shotgun', { id: p.id });
}
function fireSniper(S, p) {
  p.wpn.ammo--; p.cd = 60;
  S.bullets.push(shot(p, 90, 0, { dmg: 100, kbx: 3, kby: -1.6, stun: 16, life: 16, k: 'sr' })); // crosses a map in 0.2 s
  ev(S, 'sniper', { id: p.id });
}
function firePlasma(S, p, charged) {
  if (charged) {
    S.bullets.push(shot(p, 6, 0, { dmg: 30, kbx: 4.2, kby: -3, stun: 22, life: 200, k: 'pc', breaks: true }));
    p.wpn.ammo -= 20; p.cd = 20; ev(S, 'pc', { id: p.id });
  } else {
    S.bullets.push(shot(p, 6.5, 0, { dmg: 12, kbx: 2, kby: -1.2, stun: 6, life: 150, k: 'pp' }));
    p.wpn.ammo -= 5; p.cd = 9; ev(S, 'pp', { id: p.id });
  }
}

function throwNade(S, p) {
  p.nades--; p.nadeCd = 30;
  S.nades.push({ x: p.x + p.face * 6, y: p.y - 14, vx: p.face * 3.6 + p.vx * 0.4, vy: -2.4 + Math.min(0, p.vy) * 0.3,
    o: p.id, team: p.team, t: NADE_FUSE });
  ev(S, 'throw', { id: p.id });
}
function updateNades(S) {
  const keep = [];
  for (const n of S.nades) {
    n.vy = Math.min(7, n.vy + 0.2);
    n.x += n.vx;
    if (solidAt(S.map, n.x, n.y)) { n.x -= n.vx; n.vx *= -0.5; }
    const py = n.y;
    n.y += n.vy;
    let landed = false;
    if (solidAt(S.map, n.x, n.y)) { n.y = py; landed = n.vy > 0; n.vy *= -0.45; n.vx *= 0.7; }
    else if (n.vy > 0) for (const s of S.map.plats) {
      if (s.thin && n.x >= s.x && n.x <= s.x + s.w && py <= s.y && n.y >= s.y) { n.y = s.y - 0.01; n.vy *= -0.45; n.vx *= 0.7; landed = true; }
    }
    if (landed && Math.abs(n.vy) < 0.6) n.vy = 0;
    for (const q of S.players) { // bounce off an enemy, so a direct throw drops at their feet
      if (q.dead || q.out || q.id === n.o || (teams(S) && q.team === n.team)) continue;
      if (Math.abs(n.x - q.x) < HALF + 2 && n.y > q.y - height(q) - 12 && n.y < q.y && Math.sign(n.vx) === Math.sign(q.x - n.x)) n.vx *= -0.1;
    }
    if (--n.t <= 0) { explode(S, n); continue; }
    if (n.y < S.map.h + 40 && n.x > -60 && n.x < S.map.w + 60) keep.push(n);
  }
  S.nades = keep;
}
function explode(S, n) {
  ev(S, 'boom', { x: n.x, y: n.y });
  const owner = S.players[n.o];
  for (const q of S.players) {
    if (q.dead || q.out) continue;
    const dx = q.x - n.x, dy = q.y - 9 - n.y, d = Math.hypot(dx, dy);
    if (d > NADE_R) continue;
    const self = q.id === n.o;
    if (!self && owner && !isFoe(S, owner, q)) continue; // teammates are safe; you are not
    const f = 1 - d / NADE_R, ux = dx / (d || 1), uy = dy / (d || 1);
    hit(S, q, self ? null : owner, { dmg: Math.round((10 + 60 * f) * (self ? 0.5 : 1)),
      kbx: ux * 5.5 * f + (Math.sign(dx) || 1) * 0.8, kby: Math.max(-4.5, Math.min(-1.5, uy * 5 * f - 2.5 * f)), stun: Math.round(10 + 22 * f), kind: 'nade' });
  }
}

function thinAt(map, x, y) {
  for (const s of map.plats) if (s.thin && x >= s.x && x < s.x + s.w && y >= s.y && y < s.y + 5) return true;
  return false;
}
function solidAt(map, x, y) {
  for (const s of map.plats) if (!s.thin && x >= s.x && x < s.x + s.w && y >= s.y && y < s.y + s.h) return true;
  return false;
}

function updateBullets(S) {
  const keep = [];
  for (const b of S.bullets) {
    let alive = true;
    const plasma = b.k === 'pp' || b.k === 'pc';

// --- camera: frames every living player, zooming out as they spread apart ---
const cam = { x: 500, y: 300, h: 300 };
function updateCamera(snap) {
  const M = S.map;
  let ps = S.players.filter(p => !p.dead && !p.out);
  if (S.rule === 'training') ps = ps.filter(p => p.ctrl !== 'dummy');
  let x0 = M.w / 2, x1 = M.w / 2, y0 = M.h / 2, y1 = M.h / 2;
  if (ps.length) {
    x0 = Math.min(...ps.map(p => p.x)); x1 = Math.max(...ps.map(p => p.x));
    y0 = Math.min(...ps.map(p => p.y - 18)); y1 = Math.max(...ps.map(p => p.y));
  }
  let h = Math.max(y1 - y0 + 170, ((x1 - x0) + 200) * 9 / 16);
  h = Math.max(280, Math.min(470, M.h, h));
  const w = h * 16 / 9;
  let cx = (x0 + x1) / 2, cy = (y0 + y1) / 2 - h * 0.14; // more room above than below
  cy = Math.max(cy, y1 + h * 40 / HUD_H - h / 2); // never let the player cards cover the lowest fighter
  cx = w >= M.w + 80 ? M.w / 2 : Math.max(w / 2 - 40, Math.min(M.w + 40 - w / 2, cx));
  cy = Math.max(h / 2 - 60, Math.min(M.h + 10 - h / 2, cy));
  const k = snap ? 1 : 0.1;
  cam.x += (cx - cam.x) * k; cam.y += (cy - cam.y) * k; cam.h += (h - cam.h) * k * 0.6;

function tickEffects() {
  for (const p of S.players) { // smoke in the player's color behind spins, slides and the jetpack
    if (p.dead || p.out) continue;
    if (p.spin && S.tick % 2 === 0) puff(p.x - p.vx * 2, p.y - 9, p.color, -p.vx * 0.1, -0.1);
    if (p.slide > 0 && S.tick % 2 === 0) puff(p.x - p.face * 6, p.y - 2, p.color, -p.face * 0.4, -0.2);
    if (p.jet) {
      puff(p.x - p.face * 5, p.y - 4, p.color, (Math.random() - 0.5) * 0.4, 1.2, 1);
      burst(p.x - p.face * 5, p.y - 5, 1, ['#ffd25a', '#ff8a3a'], 0.6, 8, 0.15);
      if (S.tick % 5 === 0) noise(0.1, 0.03, 700);
    }
  }
  for (const p of parts) { p.x += p.vx; p.y += p.vy; p.vy += p.g; p.vx *= 0.96; p.life--; }
  parts = parts.filter(p => p.life > 0);
  for (const p of puffs) { p.x += p.vx; p.y += p.vy; p.vx *= 0.92; p.vy *= 0.92; p.r += 0.16; p.life--; }
  puffs = puffs.filter(p => p.life > 0);
  for (const r of rings) { r.r += r.shrink ? -1.2 : 2.4; r.life--; }
  rings = rings.filter(r => r.life > 0 && r.r > 0);
  for (const p of pops) { p.y -= 0.4; p.life--; }
  pops = pops.filter(p => p.life > 0);
  if (shake > 0) shake *= 0.85;
  if (shake < 0.5) shake = 0;
  if (goT > 0) goT--;
}
function pixelRing(x, y, r, c, th = 1) {
  ctx.fillStyle = c;
  const n = Math.max(12, Math.round(r * 6));
  for (let i = 0; i < n; i++) {
    const a = (i / n) * Math.PI * 2;
    ctx.fillRect(Math.round(x + Math.cos(a) * r), Math.round(y + Math.sin(a) * r), th, th);
  }
}
function disc(x, y, r, c) { // a blocky filled circle, to match the pixel art
  ctx.fillStyle = c;
  const R = Math.round(r), cx = Math.round(x), cy = Math.round(y);
  for (let dy = -R; dy <= R; dy++) { const w = Math.round(Math.sqrt(r * r - dy * dy)); ctx.fillRect(cx - w, cy + dy, w * 2 + 1, 1); }
}

function drawWeapon(p, px, hy) {
  const f = p.face, X = (lx, w) => (f > 0 ? px + lx : px - lx - w);
  const box = (lx, ly, w, h, c) => { ctx.fillStyle = c; ctx.fillRect(X(lx, w), hy + ly, w, h); };
  if (p.atk && p.atk.type === 'melee') {
    if (p.atk.t <= 8) { box(3, 0, 6 + Math.min(4, p.atk.t), 2, p.color); box(9 + Math.min(4, p.atk.t), 0, 2, 2, '#101018'); }
    return;
  }
  const wt = wtype(p);
  if (wt === 'rifle') {
    box(1, 0, 10, 2, '#262a32'); box(2, -1, 6, 1, '#5a6070'); box(5, 2, 2, 2, '#262a32');
    if (p.cd >= 3 && !p.ar.reload) box(11, -1, 2, 3, '#ffe066');
  } else if (wt === 'shotgun') {
    box(0, 0, 12, 2, '#3a3026'); box(1, -1, 9, 1, '#6a5a48'); box(7, 2, 3, 1, '#262a32');
    if (p.cd >= 36) box(12, -2, 3, 5, '#ffe066');
  } else if (wt === 'sniper') {
    box(0, 0, 15, 2, '#2c3038'); box(4, -2, 5, 2, '#14161c'); box(3, 2, 2, 2, '#2c3038');
    if (p.cd >= 54) box(15, -1, 3, 3, '#ffffff');
  } else if (wt === 'plasma') {
    box(2, 0, 6, 2, '#2f8a78'); box(3, -1, 4, 1, '#6fe0c0'); box(3, 2, 2, 2, '#2f8a78');
    if (p.charge > 0) {
      const ready = p.charge >= CHARGE, s = ready ? 3 : 1 + Math.floor(p.charge / 20);
      box(8, 1 - Math.floor(s / 2), s, s, ready && (p.charge >> 2) % 2 ? '#ffffff' : '#8dff7a');
    }
  } else if (wt === 'sword') {
    const glow = p.wpn && p.wpn.ammo < 25 && (S.tick >> 2) % 2 ? '#3a7a8a' : '#7ae8ff';
    if (p.atk && p.atk.type === 'sword') {
      const t = p.atk.t;
      if (t < ATK.sword.on) { // wind-up: the sword drawn back over the shoulder
        box(-8, -6, 3, 2, '#c0c8d8'); box(-12, -9, 6, 1, glow); box(-12, -5, 6, 1, glow);
        return;
      }
      const a0 = -1.6 + Math.min(1, (t - ATK.sword.on + 1) / 6) * 2.6;
      ctx.fillStyle = glow;
      for (let a = -1.6; a <= a0; a += 0.12) for (let rr = 10; rr <= 22; rr += 3) {
        ctx.fillRect(Math.round(px + f * Math.cos(a) * rr), Math.round(hy + Math.sin(a) * rr), 2, 2);
      }
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(Math.round(px + f * Math.cos(a0) * 22), Math.round(hy + Math.sin(a0) * 22), 2, 2);
    } else {
      box(2, 0, 3, 2, '#c0c8d8'); box(5, -2, 7, 1, glow); box(5, 2, 7, 1, glow); box(5, -1, 2, 3, '#bff4ff');
    }
  }
}

function drawPlayer(p) {
  if (p.dead || p.out) return;
  if (p.inv > 0 && (p.inv >> 2) % 2) return;
  let frame = 'idle';
  if (p.slide > 0) frame = 'slide';
  else if (p.crouch) frame = 'crouch';
  else if (!p.onGround) frame = 'jump';
  else if (Math.abs(p.vx) > 0.3) frame = (S.tick >> 3) % 2 ? 'run1' : 'run2';
  const flash = p.stun > 0 && (p.stun >> 1) % 2 === 0;
  const img = sprite(frame, p.color, p.face < 0, flash);
  const px = Math.round(p.x), py = Math.round(p.y);
  if (p.kd > 0 && p.onGround) { // knocked down: flat on the ground, stars overhead
    ctx.save();
    ctx.translate(px, py - 6);
    ctx.rotate(-p.face * Math.PI / 2);
    ctx.drawImage(sprite('idle', p.color, p.face < 0, flash), -6, -9);
    ctx.restore();
    for (let i = 0; i < 3; i++) {
      const a = S.tick / 8 + (i * Math.PI * 2) / 3;
      ctx.fillStyle = '#ffd25a'; ctx.fillRect(Math.round(px + Math.cos(a) * 8), Math.round(py - 15 + Math.sin(a) * 2), 2, 2);
    }
    text(p.name, px, py - 22, mix(p.color, 0.35), 1, 'center');
    return;
  }
  if (p.spin) { // a quarter turn every three ticks keeps the pixels square
    ctx.save();
    ctx.translate(px, py - 9);
    ctx.rotate((Math.floor(S.tick / 3) % 4) * (Math.PI / 2) * p.face);
    ctx.drawImage(img, -6, -9);
    ctx.restore();
  } else {
    ctx.drawImage(img, px - 6, py - img.height);
    const hy = py - (p.crouch || p.slide > 0 ? 6 : 12);
    if (p.aim) { // tilt the gun 45 degrees up or down
      ctx.save(); ctx.translate(px, hy); ctx.rotate(p.aim * p.face * Math.PI / 4); drawWeapon(p, 0, 0); ctx.restore();
    } else drawWeapon(p, px, hy);
  }
  if (p.jet) { // jetpack flame
    const fx = px - p.face * 5, n = 3 + (S.tick % 3);
    ctx.fillStyle = '#ffd25a'; ctx.fillRect(fx - 1, py - 6, 3, n);
    ctx.fillStyle = '#ffffff'; ctx.fillRect(fx, py - 6, 1, Math.max(1, n - 2));
  }
  if (p.shielding) {
    const r = 5 + 9 * (p.shieldHp / SHIELD_MAX), cy = py - 9;
    if (p.shieldHp > 12 || (S.tick >> 1) % 2) {
      ctx.globalAlpha = 0.28; disc(px, cy, r, mix(p.color, 0.5)); ctx.globalAlpha = 1;
      pixelRing(px, cy, r, mix(p.color, 0.7));
    }
  }
  if (wtype(p) === 'sniper' && !p.spin && !p.stun) { // laser sight
    const y0 = py - (p.crouch || p.slide > 0 ? 6 : 12), a = p.aim * Math.PI / 4, ux = Math.cos(a) * p.face, uy = Math.sin(a);
    ctx.fillStyle = 'rgba(255,60,60,0.55)';
    for (let d = 18; d < 420; d += 4) {
      const x = px + ux * d, y = y0 + uy * d;
      if (solidAt(S.map, x, y)) break;
      ctx.fillRect(Math.round(x), Math.round(y), 2, 1);
    }
  }
  text(p.name, px, py - (p.crouch || p.slide > 0 ? PH_C : PH) - 9, mix(p.color, 0.35), 1, 'center');
}

function drawBullet(b) {
  const x = Math.round(b.x), y = Math.round(b.y), sp = Math.hypot(b.vx, b.vy) || 1, ux = b.vx / sp, uy = b.vy / sp;
  const trail = (from, to, c) => { ctx.fillStyle = c; for (let d = from; d < to; d++) ctx.fillRect(Math.round(b.x - ux * d), Math.round(b.y - uy * d), 1, 1); };
  if (b.k === 'ar' || b.k === 'sg') { trail(0, 4, '#ffe680'); trail(4, 7, '#c86a20'); }
  else if (b.k === 'sr') { trail(10, 70, 'rgba(160,230,255,0.45)'); trail(0, 10, '#ffffff'); }
  else if (b.k === 'pp') {

    ctx.fillStyle = (S.tick >> 1) % 2 ? '#b4ff9a' : '#ffffff'; ctx.fillRect(x - 2, y - 2, 5, 5);

}

function drawPickup(pk) {

function drawHud() {
  const n = S.players.length, cw = 104, gap = 6, x0 = Math.round((HUD_W - (n * cw + (n - 1) * gap)) / 2), y = HUD_H - 25;
  S.players.forEach((p, i) => {

    ctx.fillStyle = p.color; ctx.fillRect(x, y, cw, 1); ctx.fillRect(x, y + 21, cw, 1);

    text(p.name, x + 16, y + 3, mix(p.color, 0.35));

    } else if (S.rule === 'timer') text(String(p.kills), x + cw - 4, y + 3, '#fff', 1, 'right');

    const bw = cw - 20;
    ctx.fillStyle = '#2a2f3c'; ctx.fillRect(x + 16, y + 12, bw, 5);
    const hp = p.dead ? 0 : p.hp;
    ctx.fillStyle = hp > 50 ? '#5ce06a' : hp > 25 ? '#f0c040' : '#f04a3a';
    ctx.fillRect(x + 16, y + 12, Math.ceil(bw * hp / 100), 5);
    ctx.fillStyle = 'rgba(255,255,255,0.25)'; ctx.fillRect(x + 16, y + 12, Math.ceil(bw * hp / 100), 1);
    ctx.fillStyle = '#8aa05a'; for (let k = 0; k < (p.dead ? 0 : p.nades); k++) ctx.fillRect(x + 16 + k * 5, y + 18, 3, 2);
    const w = p.wpn;

    else if (!w) { const B = BASES[p.base || 'rifle']; label = !B.mag ? B.label : p.ar.reload ? B.label + ' ..' : B.label + ' ' + p.ar.ammo + '/' + p.ar.reserve; }
    else label = { sword: 'SW ', plasma: 'PP ', shotgun: 'SG ', sniper: 'SR ' }[w.type] + Math.max(0, Math.ceil(w.ammo));
    text(label, x + cw - (S.rule === 'lives' ? 25 : 12), y + 3, '#cfd6e6', 1, 'right');

  if (soundLocked() && (S.tick >> 5) % 2) text('CLICK FOR SOUND', HUD_W - 6, S.rule === 'training' ? 22 : 6, '#ffd25a', 1, 'right');

    text('PING ' + ms, HUD_W - 6, HUD_H - 34, ms < 90 ? '#8b94ad' : ms < 160 ? '#f0c040' : '#ff6a5a', 1, 'right');
  }
  if (S.rule === 'timer') {
    if (S.sudden) { if ((S.tick >> 4) % 2) text('SUDDEN DEATH', HUD_W / 2, 6, '#ff6a5a', 2, 'center'); }
    else {
      const s = Math.ceil(S.time / 60);
      text(Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'), HUD_W / 2, 6, s <= 10 ? '#ff6a5a' : '#fff', 2, 'center');
    }
  }
  if (S.rule === 'training') {
    const lines = ['TAP JUMP X2 FAST: SPIN JUMP', 'TAP FORWARD X2: SLIDE', 'JUMP, SPIN, JUMP, HOLD: JETPACK', 'HOLD J + W OR S: AIM', 'DOWN, DOWN: DROP THROUGH',
      'CROUCH ON WEAPON: SWAP', 'U: GRENADE'];
    ctx.fillStyle = 'rgba(8,10,18,0.7)'; ctx.fillRect(4, 4, 132, lines.length * 8 + 6);
    lines.forEach((l, i) => text(l, 8, 8 + i * 8, '#cfd6e6'));
    const m = 'T: DUMMIES ' + S.dummyMode.toUpperCase();
    ctx.fillStyle = 'rgba(8,10,18,0.7)'; ctx.fillRect(HUD_W - textW(m) - 12, 4, textW(m) + 8, 14);
    text(m, HUD_W - 8, 8, '#ffd25a', 1, 'right');

  let fy = 6;

    text(f.v.name, x, fy, mix(f.v.color, 0.35));
    if (!f.k) text('FELL', x + textW(f.v.name) + 4, fy, '#8b94ad');
    fy += 8;
  }

function drawLayer(L, ls) {

  for (const L of sc.fg) drawLayer(L, ls);

    ctx.setTransform(ls, 0, 0, ls, 0, 0);
    const t = performance.now() / 1000;
    for (let i = 0; i < 80; i++) {
      const near = i % 3 === 0, pf = near ? 1.4 : 0.7;
      const x = ((i * 67 - t * 40 - cam.x * pf) % VIEW_LW + VIEW_LW) % VIEW_LW;
      const y = ((i * 41 + t * (220 + (i % 5) * 30) - cam.y * pf * 0.5) % VIEW_LH + VIEW_LH) % VIEW_LH;

      const x = ((i * 89 - cam.x * pf + Math.sin(t * 1.3 + i) * 8) % VIEW_LW + VIEW_LW) % VIEW_LW;
      const y = VIEW_LH - (((i * 61 + t * (12 + (i % 6) * 5) + cam.y * pf * 0.5) % (VIEW_LH + 10) + VIEW_LH + 10) % (VIEW_LH + 10));

      else { ctx.fillStyle = i % 2 ? '#ffb347' : '#ff7a1a'; ctx.fillRect(Math.round(x), Math.round(y), near ? 2 : 1, near ? 2 : 1); }
    }

    const t = performance.now() / 1000;
    for (let i = 0; i < 90; i++) {

    head.textContent = 'Team ' + (t + 1) + (canPick ? ' color' : ' · ' + COLORS[colors[t]].n);
    if (canPick) head.appendChild(swatches(colors[t], c => onPick(t, c)));
    team.appendChild(head);
    team.appendChild(row(t * 2)); team.appendChild(row(t * 2 + 1));
    box.appendChild(team);
  });
}
// The map picker: one card with a small picture of the layout, stepped through with ◀ and ▶.
const MAP_CHOICES = ['random'].concat(MAPS.filter(m => !m.training).map(m => m.id));
function drawMapPick(settings, canEdit) {
  const id = settings.map, m = MAPS.find(x => x.id === id), c = $('mapThumb'), g = c.getContext('2d');
  g.imageSmoothingEnabled = false;
  g.clearRect(0, 0, c.width, c.height);
  if (!m) {
    g.fillStyle = '#121725'; g.fillRect(0, 0, c.width, c.height);
    g.fillStyle = '#f0a830'; g.font = 'bold 30px ui-monospace, monospace'; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText('?', 48, 29);
    $('mapName').innerHTML = 'Random<small>' + (settings.set === 'swords' ? 'a small map, for swords' : 'any map') + '</small>';
  } else {
    const T = THEMES[m.id];
    T.sky.forEach((col, i) => { g.fillStyle = col; g.fillRect(0, Math.floor(i * c.height / T.sky.length), c.width, Math.ceil(c.height / T.sky.length) + 1); });
    const k = Math.min(c.width / m.w, c.height / m.h), w = m.w * k, h = m.h * k;
    g.drawImage(scene(m).world, (c.width - w) / 2, (c.height - h) / 2, w, h);
    $('mapName').innerHTML = m.name + '<small>' + (m.small ? 'small' : 'large') + '</small>';
  }
  for (const b of ['mapPrev', 'mapNext']) $(b).disabled = !canEdit;
}
function stepMap(d) {
  const online = tab === 'online', settings = online && NET.room ? NET.room.cfg : cfg;
  if (online && NET.role !== 'host') return;
  const i = MAP_CHOICES.indexOf(settings.map);
  settings.map = MAP_CHOICES[(Math.max(0, i) + d + MAP_CHOICES.length) % MAP_CHOICES.length];
  if (online) sendLobby(); else saveCfg();
  renderLobby();
}

function renderLobby() {
  const online = tab === 'online', inRoom = online && !!NET.room, host = NET.role === 'host';
  const settings = inRoom ? NET.room.cfg : cfg;
  document.querySelectorAll('#tabs button').forEach(b => b.classList.toggle('on', b.dataset.tab === tab));
  $('netStart').classList.toggle('hidden', !online || inRoom || !!NET.role);
  $('room').classList.toggle('hidden', !inRoom);
  $('settings').classList.toggle('hidden', online && !inRoom);
  buildHowto(inRoom ? NET.room.slots[NET.role === 'host' ? 0 : Math.max(0, NET.mySlot)].color : cfg.slots[0].color);
  if (inRoom) $('roomCode').textContent = NET.code;
  $('copyLink').classList.toggle('hidden', !host);
  document.querySelectorAll('#settings .seg').forEach(seg => {
    seg.style.pointerEvents = inRoom && !host ? 'none' : '';
    seg.style.opacity = inRoom && !host ? 0.75 : '';
    seg.querySelectorAll('button').forEach(b => b.classList.toggle('on', settings[seg.dataset.key] === b.dataset.v));
  });
  drawMapPick(settings, !inRoom || host);
  document.querySelectorAll('.local-only').forEach(el => el.classList.toggle('hidden', online));
  document.querySelectorAll('.match-only').forEach(el => el.classList.toggle('hidden', settings.mode === 'training'));
  const box = $('slots'), editing = document.activeElement && document.activeElement.dataset.role === 'myname'
    ? { v: document.activeElement.value, at: document.activeElement.selectionStart } : null;
  box.innerHTML = '';
  if (online && !inRoom) { /* nothing yet */ }
  else if (inRoom) {
    if (NET.room.cfg.mode === 'team') renderTeams(box, onlineSlotRow, NET.room.cfg.teamColors, host,
      (t, c) => { NET.room.cfg.teamColors[t] = c; renderLobby(); sendLobby(); });
    else for (let i = 0; i < 4; i++) box.appendChild(onlineSlotRow(i));
  } else if (cfg.mode === 'team') renderTeams(box, slotRow, cfg.teamColors, true, (t, c) => { cfg.teamColors[t] = c; saveCfg(); renderLobby(); });
  else if (cfg.mode === 'training') {
    box.appendChild(slotRow(0));
    const n = document.createElement('p');
    n.className = 'note';
    n.textContent = 'Every weapon on a rack, and two dummies. Press T to change what the dummies do.';
    box.appendChild(n);
  } else for (let i = 0; i < 4; i++) box.appendChild(slotRow(i));
  if (editing) { // a lobby update arrived while you were typing your name: keep what you typed
    const inp = box.querySelector('input[data-role=myname]');
    if (inp) { inp.value = editing.v; inp.focus(); inp.setSelectionRange(editing.at, editing.at); }
  }
  $('start').classList.toggle('hidden', online && !host);
  $('start').textContent = online ? 'Start match' : cfg.mode === 'training' ? 'Start training' : 'Start match';
}
document.querySelectorAll('#settings .seg').forEach(seg => seg.addEventListener('click', e => {
  const b = e.target.closest('button');
  if (!b) return;
  if (tab === 'online') {
    if (NET.role !== 'host') return;
    NET.room.cfg[seg.dataset.key] = b.dataset.v; renderLobby(); sendLobby();
  } else { cfg[seg.dataset.key] = b.dataset.v; saveCfg(); renderLobby(); }
}));
$('tabs').addEventListener('click', e => {
  const b = e.target.closest('button');
  if (!b || b.dataset.tab === tab) return;
  if (NET.role) leaveRoom();
  tab = b.dataset.tab; status(''); renderLobby();
});

function problem() {
  if (cfg.mode === 'training') return null;
  const on = cfg.slots.filter(s => s.ctrl !== 'off');
  if (on.length < 2) return 'Turn on at least one other player.';
  const pads = on.filter(s => /^pad/.test(s.ctrl)).map(s => s.ctrl);
  if (new Set(pads).size < pads.length) return 'Each controller can only play one spartan.';
  const n = getPads().length, missing = pads.find(c => +c[3] >= n);
  if (missing) return 'Controller ' + (+missing[3] + 1) + ' is not connected. Press a button on it.';
  if (cfg.mode === 'team') {
    const t0 = cfg.slots.slice(0, 2).some(s => s.ctrl !== 'off'), t1 = cfg.slots.slice(2).some(s => s.ctrl !== 'off');
    if (!t0 || !t1) return 'Each team needs at least one player.';
  }
  return null;
}

let S = null, paused = false, acc = 0, last = performance.now();
function resetEffects() { parts = []; rings = []; pops = []; puffs = []; shake = 0; goT = 0; overT = 0; }
function startMatch() {
  if (NET.role === 'host') { onlineStart(); return; }
  if (NET.role) return;
  const err = problem();
  if (err) { status(err); return; }
  audioInit();
  if (document.activeElement) document.activeElement.blur();
  for (const k in BOT) delete BOT[k];
  resetEffects();
  S = newGame(cfg);
  musicStart(S.map.id);
  updateCamera(true);
  paused = false; acc = 0;
  ['lobby', 'pause', 'end'].forEach(id => $(id).classList.add('hidden'));
}
function showLobbyScreen() {
  S = null; paused = false; musicStop();
  ['pause', 'end'].forEach(id => $(id).classList.add('hidden'));
  $('lobby').classList.remove('hidden');
  renderLobby();
}
function toLobby() {
  if (NET.role === 'host') { hostToLobby(); return; }
  if (NET.role === 'guest') { leaveRoom(); return; }
  showLobbyScreen();
}
function setPaused(v) {
  if (!S || S.phase === 'over') return;
  const online = !!NET.role;
  paused = v && !online; // online the match keeps running for everyone
  $('pause').classList.toggle('hidden', !v);
  $('pauseTitle').textContent = online ? 'MENU' : 'PAUSED';
  $('resume').textContent = online ? 'Back to game' : 'Resume';
  $('quit').textContent = NET.role === 'host' ? 'End match for everyone' : NET.role === 'guest' ? 'Leave game' : 'Quit to lobby';
  $('mutenote').textContent = (online ? 'The match keeps going while this menu is open. ' : '') +
    (muted ? 'Sound is off. Press M to turn it on.' : 'Press M to mute.');
  held.clear();
}
function menuOpen() { return !$('pause').classList.contains('hidden'); }
function showEnd() {
  const names = { t0: 'Team 1', t1: 'Team 2' }, tc = NET.room ? NET.room.cfg.teamColors : cfg.teamColors;
  let title = 'DRAW', color = '#eef1f8';
  if (S.winner) {
    const p = S.players.find(q => sideOf(S, q) === S.winner);
    color = p.color;
    title = S.mode === 'team' ? COLORS[tc[p.team]].n.toUpperCase() + ' TEAM WINS' : p.name + ' WINS';
  }
  $('endTitle').textContent = title;
  $('endTitle').style.color = color;
  const rows = S.players.slice().sort((a, b) => b.kills - a.kills || a.deaths - b.deaths);
  $('endTable').innerHTML = '<tr><th>Player</th>' + (S.mode === 'team' ? '<th>Team</th>' : '') +
    '<th class="n">Kills</th><th class="n">Deaths</th></tr>' + rows.map(p =>
    `<tr><td><span class="chip" style="background:${p.color}"></span>${p.name}</td>` +
    (S.mode === 'team' ? `<td>${names['t' + p.team]}</td>` : '') +
    `<td class="n">${p.kills}</td><td class="n">${p.deaths}</td></tr>`).join('');
  const guest = NET.role === 'guest';
  $('again').classList.toggle('hidden', guest);
  $('toLobby').textContent = guest ? 'Leave game' : 'Lobby';
  $('endNote').textContent = guest ? 'Waiting for the host to start a rematch.' : 'Enter: rematch · Esc: lobby';
  $('end').classList.remove('hidden');
  if (getPads().length) padFocus(defaultFocus($('end')));
}
function fullscreen() {
  const d = document.documentElement;
  if (document.fullscreenElement) document.exitFullscreen();
  else if (d.requestFullscreen) d.requestFullscreen().catch(() => {});
}

$('start').onclick = startMatch;
$('full').onclick = fullscreen;
$('mapPrev').onclick = () => stepMap(-1);
$('mapNext').onclick = () => stepMap(1);
function musicLabel() { $('musicBtn').textContent = 'Music: ' + (MUSIC.on ? 'on' : 'off'); }
$('musicBtn').onclick = () => {
  MUSIC.on = !MUSIC.on; musicLabel(); musicUpdate();
  try { localStorage.setItem(MUSIC_KEY, MUSIC.on ? 'on' : 'off'); } catch (e) {}
};
musicLabel();
$('resume').onclick = () => setPaused(false);
$('quit').onclick = toLobby;
$('again').onclick = startMatch;
$('toLobby').onclick = toLobby;
$('create').onclick = createRoom;
$('join').onclick = joinRoom;
$('codeIn').addEventListener('keydown', e => { if (e.key === 'Enter') joinRoom(); });
$('leave').onclick = leaveRoom;
$('copyLink').onclick = () => {
  const link = location.origin + location.pathname + '?join=' + NET.code;
  (navigator.clipboard ? navigator.clipboard.writeText(link) : Promise.reject())
    .then(() => status('Invite link copied: ' + link, true), () => status('Invite link: ' + link, true));
};

addEventListener('keydown', e => {
  if (e.target && e.target.tagName === 'INPUT') return;
  const inGame = S && !paused && S.phase !== 'over' && !menuOpen();
  if (inGame && GAME_KEYS.has(e.code)) e.preventDefault();
  if (e.code === 'KeyM' && S) { muted = !muted; musicUpdate(); if (menuOpen()) setPaused(true); }
  if (e.code === 'KeyT' && inGame && S.rule === 'training' && !e.repeat) {
    S.dummyMode = DUMMY_MODES[(DUMMY_MODES.indexOf(S.dummyMode) + 1) % DUMMY_MODES.length];
    for (const k in BOT) delete BOT[k];
  }
  const endShown = S && S.phase === 'over' && !$('end').classList.contains('hidden');
  if (e.code === 'Escape') {
    if (endShown) { if (NET.role !== 'guest') toLobby(); }
    else if (S) setPaused(!menuOpen());
  }
  if (e.code === 'Enter' && endShown && NET.role !== 'guest') startMatch();
  if (!menuOpen()) held.add(e.code);
});
addEventListener('keyup', e => held.delete(e.code));
addEventListener('blur', () => { held.clear(); if (S && S.phase !== 'over' && !NET.role) setPaused(true); });

function fit() {
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  let w = innerWidth, h = innerHeight;
  if (w / h > 16 / 9) w = h * 16 / 9; else h = w * 9 / 16;
  cv.style.width = Math.floor(w) + 'px'; cv.style.height = Math.floor(h) + 'px';
  cv.width = Math.floor(w * dpr); cv.height = Math.floor(h * dpr);
  ctx = cv.getContext('2d');
  ctx.imageSmoothingEnabled = false;
}
addEventListener('resize', fit);
fit();

// Fixed 60 Hz steps. Called every animation frame, and by the host's background ticker.
function advance() {
  const now = performance.now(), dt = Math.min(0.25, (now - last) / 1000);
  last = now;
  if (!S || paused) return;
  acc += dt;
  for (let n = 0; acc >= DT && n < 15; n++) {
    acc -= DT;
    if (NET.role === 'guest') { if (NET.playing) guestTick(); continue; }
    const hosting = NET.role === 'host' && NET.playing;
    if (hosting) hostBeforeStep();
    step(S, gatherInputs());
    handleEvents(S.events);
    if (hosting) hostAfterStep();
    tickEffects();
    updateCamera(false);
    if (S.phase === 'over' && ++overT === 90) showEnd();
  }
  if (acc > DT * 15) acc = 0;
}
// The controller panel in the lobby: one cap per action showing its button. Click one, press a button.
let padWait = null, padPrev = [], padSeen = null;
function renderPad() {
  const g = getPad(), caps = $('padCaps');
  padSeen = !!g;
  caps.innerHTML = '';
  $('padReset').classList.toggle('hidden', !g);
  if (!g) { // say so plainly, so it is clear whether the browser sees a controller at all
    $('padTitle').textContent = 'Controller';
    $('padNote').textContent = !navigator.getGamepads || !window.isSecureContext
      ? 'This browser cannot read controllers on this page.'
      : 'No controller found. Connect one, then press any button on it.';
    return;
  }
  const fam = padFamily(g);
  $('padTitle').textContent = fam.name === 'Controller' ? g.id.replace(/\(.*$/, '').trim().slice(0, 28) || 'Controller' : fam.name;
  for (const [k, name] of PAD_ACTIONS) {
    const b = document.createElement('button');
    b.className = 'cap' + (padWait === k ? ' wait' : ''); b.title = name; b.setAttribute('aria-label', name + ': ' + padName(g, padMap[k]));
    const label = document.createElement('b'); label.textContent = padWait === k ? '…' : padName(g, padMap[k]);
    b.appendChild(label);
    if (k === 'jump') { const i = document.createElement('i'); i.textContent = '↑'; b.appendChild(i); }
    else { const c = document.createElement('canvas'); c.width = 16; c.height = 12; drawKeyIcon(c, { fire: 'gun', melee: 'fist', shield: 'shield', nade: 'nade' }[k], howtoColor || COLORS[2].c); b.appendChild(c); }
    b.onclick = () => { padWait = padWait === k ? null : k; renderPad(); };
    caps.appendChild(b);
  }
  $('padNote').textContent = padWait ? 'Press a button on the controller for ' + PAD_ACTIONS.find(a => a[0] === padWait)[1].toLowerCase() + '.'
    : 'Click an action, then press a button. Stick: move, and aim while shooting.';
}
$('padReset').onclick = () => { padMap = Object.assign({}, PAD_DEFAULT); padWait = null; try { localStorage.setItem(PAD_KEY, JSON.stringify(padMap)); } catch (e) {} renderPad(); };
addEventListener('gamepadconnected', e => {
  const n = getPads().indexOf(e.gamepad);
  if (n >= 1 && tab === 'local' && !NET.role && !$('lobby').classList.contains('hidden') && cfg.mode !== 'training'
      && !cfg.slots.some(sl => sl.ctrl === 'pad' + n)) {
    const sl = cfg.slots.find((x, i) => i > 0 && (x.ctrl === 'cpu' || x.ctrl === 'off'));
    if (sl) { sl.ctrl = 'pad' + n; saveCfg(); status('Controller ' + (n + 1) + ' joined as P' + (cfg.slots.indexOf(sl) + 1) + '.', true); }
  }
  renderLobby(); renderPad();
});
addEventListener('gamepaddisconnected', () => { renderLobby(); renderPad(); });
// --- moving around the lobby and menus with a controller ---
function uiScreen() { for (const id of ['end', 'pause', 'lobby']) if (!$(id).classList.contains('hidden')) return $(id); return null; }
function focusables(root) {
  return [...root.querySelectorAll('button, select, input')].filter(el => el.offsetParent !== null && !el.disabled
    && !(el.closest('.seg') && el.closest('.seg').style.pointerEvents === 'none'));
}
function defaultFocus(root) {
  const pick = { end: $('again').classList.contains('hidden') ? 'toLobby' : 'again', pause: 'resume', lobby: 'start' }[root.id];
  const el = $(pick);
  return el && el.offsetParent !== null ? el : focusables(root)[0];
}
function padFocus(el) { if (!el) return; document.body.classList.add('padnav'); el.focus({ preventScroll: true }); el.scrollIntoView({ block: 'nearest' }); }
function navMove(dx, dy) { // move to the nearest control in that direction
  const root = uiScreen(); if (!root) return;
  const list = focusables(root), cur = document.activeElement;
  if (!list.includes(cur)) { padFocus(defaultFocus(root)); return; }
  const r = cur.getBoundingClientRect(), cx = r.left + r.width / 2, cy = r.top + r.height / 2;
  let best = null, bd = 1e9;
  for (const el of list) {
    if (el === cur) continue;
    const q = el.getBoundingClientRect(), ex = q.left + q.width / 2 - cx, ey = q.top + q.height / 2 - cy;
    const along = dx ? ex * dx : ey * dy, across = dx ? Math.abs(ey) : Math.abs(ex);
    if (along <= 4) continue;
    const d = along + across * 2.5;
    if (d < bd) { bd = d; best = el; }
  }
  if (best) padFocus(best);
}
function navPress() { // ✕: press the highlighted control; on a dropdown, step to the next choice
  const root = uiScreen(), el = document.activeElement;
  if (!root || !focusables(root).includes(el)) { padFocus(root && defaultFocus(root)); return; }
  const at = focusables(root).indexOf(el);
  setTimeout(() => { // the lobby may redraw that row: keep the highlight in the same place
    const scr = uiScreen();
    if (scr && !focusables(scr).includes(document.activeElement)) padFocus(focusables(scr)[Math.min(at, focusables(scr).length - 1)]);
  }, 0);
  if (el.tagName === 'SELECT') { el.selectedIndex = (el.selectedIndex + 1) % el.options.length; el.dispatchEvent(new Event('change')); }
  else if (el.tagName === 'BUTTON') el.click();
  else el.focus();
}
addEventListener('mousedown', () => document.body.classList.remove('padnav'));
let navHeld = { k: null, t: 0, next: 0 };
function pollPad() {
  const pads = getPads(), g = pads[0] || null;
  if (!!g !== padSeen && !$('lobby').classList.contains('hidden')) renderPad();
  if (!pads.length) { padPrev = []; return; }
  // every controller can drive the menus: merge them
  const now = [], dir = { x: 0, y: 0 };
  for (const p of pads) {
    p.buttons.forEach((b, i) => { now[i] = now[i] || padDown(p, i); });
    const ax = p.axes[0] || 0, ay = p.axes[1] || 0;
    if (ax < -0.5 || padDown(p, 14)) dir.x = -1; else if (ax > 0.5 || padDown(p, 15)) dir.x = 1;
    if (ay < -0.5 || padDown(p, 12)) dir.y = -1; else if (ay > 0.5 || padDown(p, 13)) dir.y = 1;
  }
  const pressed = i => now[i] && !padPrev[i];
  if (padWait) { // remapping: the first button pressed takes the action
    const i = now.findIndex((d, j) => d && !padPrev[j] && j !== PAD_MENU);
    if (i >= 0) { padMap[padWait] = i; padWait = null; try { localStorage.setItem(PAD_KEY, JSON.stringify(padMap)); } catch (e) {} renderPad(); }
    padPrev = now; return;
  }
  const endShown = S && S.phase === 'over' && !$('end').classList.contains('hidden'), root = uiScreen();
  if (pressed(PAD_MENU)) {
    if (endShown) { if (NET.role !== 'guest') toLobby(); }
    else if (S) { setPaused(!menuOpen()); if (menuOpen()) padFocus(defaultFocus($('pause'))); }
    else if (root && root.id === 'lobby' && !$('start').classList.contains('hidden')) $('start').click();
  } else if (root) {
    // stick or d-pad moves the highlight: once on the push, then repeating while held
    const k = dir.x || dir.y ? dir.x + ',' + dir.y : null, t = performance.now();
    if (k && (k !== navHeld.k || t >= navHeld.next)) {
      navHeld = { k, t, next: t + (k !== navHeld.k ? 380 : 130) };
      navMove(dir.y ? 0 : dir.x, dir.y);
    } else if (!k) navHeld.k = null;
    if (pressed(0)) navPress(); // ✕ (A) presses, whatever jump is mapped to
    if (pressed(1) && root.id === 'pause') setPaused(false); // ○ (B) backs out of the menu
  }
  padPrev = now;
}

function frame() {
  requestAnimationFrame(frame);
  pollPad();
  advance();
  if (NET.role === 'guest' && NET.playing) buildView(); // place other players for this exact moment, not just this tick
  render();
}
renderLobby();
requestAnimationFrame(frame);
</script>
</body>
